---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/secret-v1.json
# Placeholder objects passed to `flate --supply` by the flate and
# image-registry-check workflows. Not a Kubernetes manifest: nothing applies
# this file, and every value is a dummy.
#
# flate v0.7 stopped silently stubbing Secret/ConfigMap values it can't read
# from Git (home-operations/flate#1367). The two gha-runner-scale-set
# HelmReleases source `githubConfigSecret.*` via `valuesFrom` from the
# in-cluster `actions-runner-controller-auth` Secret (an ExternalSecret, never
# in Git), so without a stub the chart's githubsecret.yaml validation fails at
# helm-template time.
apiVersion: v1
kind: Secret
metadata:
  name: actions-runner-controller-auth
  namespace: actions-runner-privileged
stringData:
  github_app_id: "dummy"
  github_app_installation_id: "dummy"
  github_app_private_key: "dummy"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: actions-runner-controller-auth
  namespace: actions-runner-system
stringData:
  github_app_id: "dummy"
  github_app_installation_id: "dummy"
  github_app_private_key: "dummy"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/secret-v1.json
# flate v0.8 enforces Flux semantics: the tier parents' required
# substituteFrom Secret must exist (v0.7 tolerated it missing), or every
# Kustomization is blocked. SECRET_DOMAIN is its only key.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-secrets
  namespace: flux-system
stringData:
  SECRET_DOMAIN: "example.com"
