---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Docs: Data Classification Scrub"

# Per `.agents/instructions/data-classification.md` (HOMELAB-SPEC Inv 2)
# — restricted-tier app names must not appear in narrative artifacts
# that third parties can see. This job greps for them and fails the PR
# if any leak through.
#
# Exceptions:
#  - `.agents/instructions/data-classification.md` — defines the
#    convention by naming the categories.
#  - `.agents/skills/historian.md` — cites the convention by name.
#  - `.agents/skills/data-classification-audit.md` — implements the
#    audit skill; contains the restricted names as grep patterns.
#  - `docs/src/audit/**` — historical audit artifacts, frozen
#    (replaced going forward by the convention).

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scrub:
    name: Scan for restricted-tier names
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Grep restricted-tier names
        run: |
          set -euo pipefail
          # Restricted apps per `.agents/instructions/data-classification.md`:
          # arr stack + stash + download clients.
          PATTERN='\bsonarr\b|\bradarr\b|\bprowlarr\b|\blidarr\b|\brecyclarr\b|\bsuggestarr\b|\bsoularr\b|\bqbittorrent\b|\bsabnzbd\b|\bslskd\b|\bjdownloader\b|\bautobrr\b|\bstash\b'

          # Scope: every .md file in the repo, with exceptions.
          # `git grep` respects .gitignore + ls-files semantics. The
          # exception list lives below.
          if git grep -nEi "${PATTERN}" -- '*.md' \
              ':!.agents/instructions/data-classification.md' \
              ':!.agents/skills/historian.md' \
              ':!.agents/skills/data-classification-audit.md' \
              ':!docs/src/audit/**'; then
            echo
            echo "❌ Restricted-tier names found in narrative artifacts."
            echo "Per HOMELAB-SPEC Inv 2 +"
            echo "  .agents/instructions/data-classification.md,"
            echo "rewrite using the neutral category descriptors:"
            echo "  - media-pull-stack (apps + download clients)"
            echo "  - media-library-app"
            echo
            echo "If the match is in a manifest path (kubernetes/apps/..."
            echo "directory or filename), this scrub does not apply — the"
            echo "manifests themselves are exempt by the convention. Move"
            echo "narrative content out of the .md and into a comment in"
            echo "the manifest if you need to discuss the app."
            exit 1
          fi
          echo "✅ No restricted-tier names found in narrative artifacts."

      - name: Grep restricted personal identifiers (secret-backed)
        env:
          PII_REGEX: ${{ secrets.RESTRICTED_PII_REGEX }}
        run: |
          set -euo pipefail
          # Personal identifiers — the home street address and household
          # member names — are Restricted (HOMELAB-SPEC Layer 2 #1 / Layer 5)
          # and must not appear in ANY tracked file in this PUBLIC repo:
          # manifest, agent prompt, doc, comment, or path. Unlike the
          # app-name scan above there is NO manifest exemption — there is no
          # legitimate reason for this PII to be in the tree at all.
          #
          # The match pattern lives in the `RESTRICTED_PII_REGEX` repo secret
          # (a case-insensitive ERE, e.g. the address + first names), so the
          # values are NEVER committed to this public repo. Set/extend it at
          # Settings → Secrets and variables → Actions. If unset, this scan
          # is skipped (so the job can't be weaponised by an empty secret).
          if [ -z "${PII_REGEX:-}" ]; then
            echo "⚠️  RESTRICTED_PII_REGEX secret not set — PII scan skipped."
            echo "    Set it to enforce the home-address / household-name check."
            exit 0
          fi
          # Scan every tracked file in HEAD (no path filter). git grep exits
          # 1 on no-match (the good case), 0 on a match (the leak → fail).
          if git grep -nEi "${PII_REGEX}"; then
            echo
            echo "❌ Restricted personal identifier found in a tracked file."
            echo "Home address / household names are Restricted and must not"
            echo "appear anywhere in this public repo. Use a generic"
            echo "descriptor ('his home', 'the household user') and fetch the"
            echo "specifics at runtime via tools — never inline."
            exit 1
          fi
          echo "✅ No restricted personal identifiers found."
