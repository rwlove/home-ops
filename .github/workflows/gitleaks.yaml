---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Gitleaks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Scan for inline secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR scans need base-branch history for --log-opts; push scans
          # don't, but full-depth checkout is cheap on this repo and keeps
          # the two branches symmetric.
          fetch-depth: 0

      # Verified against the release's checksums file. Keep the version in
      # step with the gitleaks `rev:` in .pre-commit-config.yaml; Renovate
      # tracks both.
      - name: Install gitleaks
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          v="${GITLEAKS_VERSION#v}"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${v}"
          tarball="gitleaks_${v}_linux_x64.tar.gz"
          cd "${RUNNER_TEMP}"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSL "${base}/gitleaks_${v}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Scan PR commits
        if: github.event_name == 'pull_request'
        # Only the commits this PR adds. Historical leaks on other refs
        # (e.g. bc7dddb1, remediated in PR #11587) do not break CI here.
        run: |
          gitleaks detect \
            --no-banner \
            --config=.gitleaks.toml \
            --log-opts="origin/${GITHUB_BASE_REF}..HEAD" \
            --verbose --redact

      - name: Scan working tree
        if: github.event_name == 'push'
        # Direct-to-main push: validate the tree as it is, ignore history.
        run: |
          gitleaks detect \
            --no-banner \
            --config=.gitleaks.toml \
            --no-git \
            --verbose --redact
