---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Registry Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter-changes:
    name: Filter changes
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get changed files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            kubernetes/**/*
            .github/image-registry-allowlist.txt
            .github/workflows/image-registry-check.yaml
            tools/check-image-registry.sh

  extract-images:
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    name: Extract images
    # Runs flate to extract images; charts resolve from public registries,
    # so GitHub-hosted works with no cluster access (see flate.yaml).
    runs-on: ubuntu-latest
    needs:
      - filter-changes
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        branches:
          - default
          - pull
      fail-fast: false
    outputs:
      default: ${{ steps.extract.outputs.default }}
      pull: ${{ steps.extract.outputs.pull }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ matrix.branches == 'default' && github.event.repository.default_branch || '' }}"

      # Authenticated ghcr.io pulls (see flate.yaml). No secret needed.
      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5

      # Retry mostly covers first-call cold-cache misses on upstream
      # registries when resolving chart/image refs.
      - name: Gather images
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        # FLATE_BASE="" overrides the setup action's FLATE_BASE=main — each
        # matrix leg is a single-ref shallow checkout (no `main` to diff
        # against), so this forces full-tree extraction on both legs instead
        # of an implicit changed-only mode. Same override as
        # flate.yaml's `test` job.
        env:
          FLATE_BASE: ""
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          shell: sh
          command: |
            flate get images \
              --path "$GITHUB_WORKSPACE/kubernetes/flux" \
              --output json > images.json

      # Multi-line heredoc avoids needing jq for this step — file is
      # already valid JSON, just plumb it through. printf ensures a
      # trailing newline before the delimiter, and the random-ish
      # delimiter guards against any image name literally containing
      # `EOF` on a line.
      - name: Emit images
        id: extract
        shell: sh
        run: |
          delim="EOF_$(date +%s)_$$"
          {
            echo "${{ matrix.branches }}<<${delim}"
            cat images.json
            printf '\n%s\n' "${delim}"
          } >> "$GITHUB_OUTPUT"

  check-new-images:
    if: ${{ needs.extract-images.outputs.default != needs.extract-images.outputs.pull }}
    name: Check new images
    runs-on: ubuntu-latest
    needs:
      - extract-images
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Diff images (pull − default)
        id: diff
        run: |
          new_images=$(jq --compact-output --null-input \
            --argjson f1 '${{ needs.extract-images.outputs.default }}' \
            --argjson f2 '${{ needs.extract-images.outputs.pull }}' \
            '$f2 - $f1')
          echo "$new_images" > new-images.json
          {
            echo "## New images on this PR"
            echo '```json'
            echo "$new_images" | jq
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate registries
        run: |
          ./tools/check-image-registry.sh --json new-images.json

  image-registry-check-success:
    if: ${{ !cancelled() }}
    # `check-new-images` alone is not enough. If `filter-changes` or
    # `extract-images` fails, this job is SKIPPED — result "skipped",
    # not "failure" — so `contains(needs.*.result, 'failure')` stayed
    # false and the gate went green with the registry policy never
    # having run. Depending on all three closes that hole while still
    # allowing the legitimate skip (no image changes on the PR), where
    # the upstream jobs succeed and nothing reports failure.
    needs:
      - filter-changes
      - extract-images
      - check-new-images
    name: Image registry check successful
    runs-on: ubuntu-latest
    steps:
      - name: Check job status
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
