---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Registry Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter-changes:
    name: Filter changes
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get changed files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            kubernetes/**/*
            .github/image-registry-allowlist.txt
            .github/workflows/image-registry-check.yaml
            tools/check-image-registry.sh

  extract-images:
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    name: Extract images
    # Runs flate to extract images; charts resolve from public registries,
    # so GitHub-hosted works with no cluster access (see flate.yaml).
    runs-on: ubuntu-latest
    needs:
      - filter-changes
    strategy:
      matrix:
        branches:
          - default
          - pull
      fail-fast: false
    outputs:
      default: ${{ steps.extract.outputs.default }}
      pull: ${{ steps.extract.outputs.pull }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: "${{ matrix.branches == 'default' && github.event.repository.default_branch || '' }}"

      - name: Setup flate
        uses: home-operations/flate/action@0fc37fae10cf3c265294f6adebc6d6c100c74ea5 # v0.4.10

      # Retry mostly covers first-call cold-cache misses on upstream
      # registries when resolving chart/image refs.
      - name: Gather images
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        # FLATE_BASE="" overrides the setup action's FLATE_BASE=main — each
        # matrix leg is a single-ref shallow checkout (no `main` to diff
        # against), so this forces full-tree extraction on both legs instead
        # of an implicit changed-only mode. Same override as
        # flate.yaml's `test` job.
        env:
          FLATE_BASE: ""
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          shell: sh
          # workaround: https://github.com/FairwindsOps/charts/issues/1879 — remove when Fairwinds re-indexes
          # The Fairwinds Helm repo (charts.fairwinds.com) publishes an
          # index.yaml whose `digest:` for vpa/goldilocks no longer matches the
          # served .tgz, so flate's strict reconcile exits non-zero. flate still
          # writes the full image list to stdout, so we keep images.json and
          # tolerate ONLY when every reconcile failure is a `fairwinds-charts-*
          # … digest mismatch`; any other error (or a transient failure) exits
          # non-zero so retry / the job still fails loud. Same tolerance as
          # flate.yaml's `test` job.
          command: |
            set +e
            flate get images \
              --path "$GITHUB_WORKSPACE/kubernetes/flux" \
              --output json > images.json 2> flate.err
            rc=$?
            set -e
            cat flate.err >&2
            [ "$rc" -eq 0 ] && exit 0
            clean="$(sed 's/\x1b\[[0-9;]*m//g' flate.err)"
            total="$(printf '%s\n' "$clean" | grep -oE 'reconcile completed with [0-9]+ failure' | grep -oE '[0-9]+' | tail -1)"
            tolerated="$(printf '%s\n' "$clean" | grep -cE 'fairwinds-charts-.*digest mismatch' || true)"
            if [ -n "$total" ] && [ "$total" -gt 0 ] && [ "$total" -eq "$tolerated" ]; then
              echo "::warning::flate get images: tolerating ${tolerated} Fairwinds index digest mismatch(es) (vpa/goldilocks) — see FairwindsOps/charts#1879. Image list still emitted."
              exit 0
            fi
            echo "::error::flate get images failed with untolerated errors (failed=${total:-unknown}, tolerated Fairwinds digest mismatches=${tolerated})."
            exit "$rc"

      # Multi-line heredoc avoids needing jq for this step — file is
      # already valid JSON, just plumb it through. printf ensures a
      # trailing newline before the delimiter, and the random-ish
      # delimiter guards against any image name literally containing
      # `EOF` on a line.
      - name: Emit images
        id: extract
        shell: sh
        run: |
          delim="EOF_$(date +%s)_$$"
          {
            echo "${{ matrix.branches }}<<${delim}"
            cat images.json
            printf '\n%s\n' "${delim}"
          } >> "$GITHUB_OUTPUT"

  check-new-images:
    if: ${{ needs.extract-images.outputs.default != needs.extract-images.outputs.pull }}
    name: Check new images
    runs-on: ubuntu-latest
    needs:
      - extract-images
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Diff images (pull − default)
        id: diff
        run: |
          new_images=$(jq --compact-output --null-input \
            --argjson f1 '${{ needs.extract-images.outputs.default }}' \
            --argjson f2 '${{ needs.extract-images.outputs.pull }}' \
            '$f2 - $f1')
          echo "$new_images" > new-images.json
          {
            echo "## New images on this PR"
            echo '```json'
            echo "$new_images" | jq
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate registries
        run: |
          ./tools/check-image-registry.sh --json new-images.json

  image-registry-check-success:
    if: ${{ !cancelled() }}
    needs:
      - check-new-images
    name: Image registry check successful
    runs-on: ubuntu-latest
    steps:
      - name: Check job status
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
