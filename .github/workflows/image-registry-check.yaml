---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Registry Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter-changes:
    name: Filter changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      # The action reads the PR file list from the API; no checkout needed.
      - name: Get changed files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          include_deleted_files: true
          patterns: |-
            kubernetes/**/*
            .github/flate-supply.yaml
            .github/image-registry-allowlist.txt
            .github/workflows/image-registry-check.yaml
            tools/check-image-registry.sh

  extract-images:
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    name: Extract images
    # Runs flate to extract images; charts resolve from public registries,
    # so GitHub-hosted works with no cluster access (see flate.yaml).
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs:
      - filter-changes
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        branches:
          - default
          - pull
      fail-fast: false
    outputs:
      default: ${{ steps.extract.outputs.default }}
      pull: ${{ steps.extract.outputs.pull }}
    steps:
      # Both legs check out the PR at the workspace root, so the supply file
      # and tooling always come from the PR. The `default` leg also checks
      # out the default branch into ./base and renders that tree instead.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout default branch
        if: ${{ matrix.branches == 'default' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: base
          persist-credentials: false

      # Authenticated ghcr.io pulls (see flate.yaml). No secret needed.
      - name: Login to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Authenticated docker.io pulls — the durable fix for the recurring
      # "Extract images (pull)" 429s. flate resolves docker.io/* refs
      # anonymously otherwise, and GitHub runners share IPs, so Docker Hub's
      # anonymous per-IP limit is what the retries below exhaust against.
      # No-op until a DOCKERHUB_USERNAME repo *variable* + DOCKERHUB_TOKEN
      # *secret* (a free read-only Docker Hub access token) are set — so this
      # is safe to merge before the credential exists.
      - name: Login to docker.io
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup flate
        uses: home-operations/flate/action@4e07f351352d235a335e5a1f0a088eab7ec40997 # v0.8.0
        with:
          # Same chart/blob cache flate.yaml uses. A warm cache means most
          # registry requests are never made, which is what actually stops
          # the shared-IP 429s the retry step below otherwise has to sit out.
          cache: true

      # Retry mostly covers first-call cold-cache misses on upstream
      # registries when resolving chart/image refs.
      - name: Gather images
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        # FLATE_BASE="" overrides the setup action's FLATE_BASE=main — each
        # matrix leg is a single-ref shallow checkout (no `main` to diff
        # against), so this forces full-tree extraction on both legs instead
        # of an implicit changed-only mode. Same override as
        # flate.yaml's `test` job.
        env:
          FLATE_BASE: ""
          TREE: ${{ matrix.branches == 'default' && 'base/kubernetes/flux' || 'kubernetes/flux' }}
        with:
          timeout_minutes: 10
          # Bumped 3->6 / 30->60s: rides out short Docker Hub 429 spikes on the
          # shared runner IP even when docker.io auth is not yet configured.
          max_attempts: 6
          retry_wait_seconds: 60
          shell: sh
          command: |
            flate get images \
              --path "$GITHUB_WORKSPACE/$TREE" \
              --supply "$GITHUB_WORKSPACE/.github/flate-supply.yaml" \
              --output json > "$RUNNER_TEMP/images.json"

      # Multi-line heredoc avoids needing jq for this step — file is
      # already valid JSON, just plumb it through. printf ensures a
      # trailing newline before the delimiter, and the random-ish
      # delimiter guards against any image name literally containing
      # `EOF` on a line.
      - name: Emit images
        id: extract
        shell: sh
        env:
          LEG: ${{ matrix.branches }}
        run: |
          delim="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "${LEG}<<${delim}"
            cat "$RUNNER_TEMP/images.json"
            printf '\n%s\n' "${delim}"
          } >> "$GITHUB_OUTPUT"

  check-new-images:
    if: ${{ needs.extract-images.outputs.default != needs.extract-images.outputs.pull }}
    name: Check new images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - extract-images
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image lists come from the PR's manifests, so they reach the
      # shell through env vars, never `${{ }}` interpolation into the script.
      - name: Diff images (pull − default)
        id: diff
        env:
          DEFAULT_IMAGES: ${{ needs.extract-images.outputs.default }}
          PULL_IMAGES: ${{ needs.extract-images.outputs.pull }}
        run: |
          printf '%s' "$DEFAULT_IMAGES" > default-images.json
          printf '%s' "$PULL_IMAGES" > pull-images.json
          new_images=$(jq --compact-output --null-input \
            --slurpfile f1 default-images.json \
            --slurpfile f2 pull-images.json \
            '$f2[0] - $f1[0]')
          echo "$new_images" > new-images.json
          {
            echo "## New images on this PR"
            echo '```json'
            echo "$new_images" | jq
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate registries
        run: |
          ./tools/check-image-registry.sh --json new-images.json

  image-registry-check-success:
    if: ${{ !cancelled() }}
    # `check-new-images` alone is not enough. If `filter-changes` or
    # `extract-images` fails, this job is SKIPPED — result "skipped",
    # not "failure" — so `contains(needs.*.result, 'failure')` stayed
    # false and the gate went green with the registry policy never
    # having run. Depending on all three closes that hole while still
    # allowing the legitimate skip (no image changes on the PR), where
    # the upstream jobs succeed and nothing reports failure.
    needs:
      - filter-changes
      - extract-images
      - check-new-images
    name: Image registry check successful
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check job status
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
