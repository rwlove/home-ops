---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint

on:
  workflow_dispatch:
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

# Runner choice, repeated per job (`runs-on` can't read env):
#   arc-runner-set-home-ops for same-repo PRs and manual runs;
#   ubuntu-latest for PRs from forks.
# The self-hosted runners live inside the cluster, and a fork PR controls the
# code these jobs execute (it can edit tools/lint-*.py), so fork code never
# gets a self-hosted runner. Fork PRs still run every lint, on GitHub's
# runners, so the required "Lint successful" gate keeps its full coverage.
#
# Changed-file lists come from PR filenames, so they reach the shell through
# env vars (parsed as JSON), never `${{ }}` interpolation into a script.

jobs:
  actionlint:
    name: actionlint
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-runner-set-home-ops' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Get changed files
      id: changed-files
      uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
      with:
        patterns: |-
          .github/workflows/*.yaml
          .github/workflows/*.yml

    - name: Run actionlint
      if: steps.changed-files.outputs.changed_files != '[]'
      uses: bjw-s/action-actionlint@b346813e82708106544f48a93a5b3fbeeb8e37eb # v0.1.1
      with:
        actionlint_config: .github/actionlint.yaml
        file_pattern: ${{ join(fromJSON(steps.changed-files.outputs.changed_files), ' ') }}

  yamllint:
    name: yamllint
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-runner-set-home-ops' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Get changed files
      id: changed-files
      uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
      with:
        patterns: |-
          **/*.yaml
          **/*.yml

    - name: Setup Python
      if: steps.changed-files.outputs.changed_files != '[]'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: 3.15.x

    - name: Install yamllint
      if: steps.changed-files.outputs.changed_files != '[]'
      shell: bash
      run: |
        pip install yamllint

    - name: Run yamllint
      if: steps.changed-files.outputs.changed_files != '[]'
      shell: bash
      env:
        CHANGED_FILES: ${{ steps.changed-files.outputs.changed_files }}
      run: |
        python -c 'import json, os, sys; files = json.loads(os.environ["CHANGED_FILES"]); os.execvp("yamllint", ["yamllint", "--config-file", ".yamllint.yaml", "--format", "github", "--", *files])'

  markdownlint:
    name: markdownlint
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-runner-set-home-ops' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Get changed files
      id: changed-files
      uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
      with:
        patterns: |-
          **/*.md

    # The bjw-s/action-markdownlint-cli2 action runs `npm install -g
    # markdownlint-cli2` and the self-hosted runner doesn't ship with
    # node — install it explicitly before the action runs.
    - name: Setup Node
      if: steps.changed-files.outputs.changed_files != '[]'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26

    - name: Run markdownlint-cli2
      if: steps.changed-files.outputs.changed_files != '[]'
      uses: bjw-s/action-markdownlint-cli2@c3c44cc6f77516007f1a85d982ed6276e840dcec # v0.1.0
      with:
        markdownlint_config: .markdownlint.yaml
        file_pattern: ${{ join(fromJSON(steps.changed-files.outputs.changed_files), ' ') }}

  # The repo-local lints, one job instead of one runner pod each. Every lint
  # step runs even if an earlier one failed (`!cancelled()`), so a PR sees all
  # of its failures at once, and each still reports as its own step.
  # Mirrors the `repo: local` hooks in .pre-commit-config.yaml.
  repo-lints:
    name: repo-lints
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-runner-set-home-ops' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      # move-window-freeze reads the PR's labels/state.
      pull-requests: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # On a PR, HEAD is the merge commit and HEAD^1 the base it merges
        # into; subpath-key-removal and move-window-freeze diff the two.
        fetch-depth: 2
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: 3.15.x

    - name: Install PyYAML
      shell: bash
      run: pip install pyyaml

    - name: cnp-empty-rules
      if: ${{ !cancelled() }}
      shell: bash
      run: tools/lint-cnp-empty-rules.py kubernetes

    - name: longhorn-static-only
      if: ${{ !cancelled() }}
      shell: bash
      run: tools/lint-longhorn-static.py kubernetes

    - name: flux-ks-explicit
      if: ${{ !cancelled() }}
      shell: bash
      run: tools/lint-flux-ks.py kubernetes/apps

    - name: tier-membership
      if: ${{ !cancelled() }}
      shell: bash
      run: tools/lint-tier-membership.py

    - name: flux-parents
      if: ${{ !cancelled() }}
      shell: bash
      run: tools/lint-flux-parents.py

    - name: claude-runner-no-broker
      if: ${{ !cancelled() }}
      shell: bash
      run: tools/lint-claude-runner-no-broker.py kubernetes .github

    - name: envsubst-shell-vars
      if: ${{ !cancelled() }}
      shell: bash
      run: tools/lint-envsubst-shell-vars.py kubernetes

    - name: esphome-config-substitutions
      if: ${{ !cancelled() }}
      shell: bash
      run: tools/lint-esphome-config-substitutions.py

    - name: readme-drift
      if: ${{ !cancelled() }}
      shell: bash
      run: tools/lint-readme-drift.py

    - name: move-window-freeze
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      # The window state comes from main as it is now, so a re-run after the
      # window opens sees it (a re-run keeps the original merge commit).
      run: |
        git fetch --depth=1 --no-tags origin main
        tools/lint-move-window-freeze.py --base HEAD^1 --head HEAD --window-ref FETCH_HEAD

    - name: subpath-key-removal
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      shell: bash
      run: tools/lint-subpath-key-removal.py --base HEAD^1 --head HEAD

  lint_success:
    needs:
    - actionlint
    - yamllint
    - markdownlint
    - repo-lints
    if: ${{ !cancelled() }}
    name: Lint successful
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check job status
      if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      run: exit 1
