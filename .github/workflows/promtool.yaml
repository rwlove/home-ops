---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Promtool

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter-changes:
    name: Filter changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get changed files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          # Any kubernetes YAML: PrometheusRules live in files of every name
          # (addons/alerts/<name>.yaml, prometheus-rule.yaml, ...), and the
          # script now checks all of them, not only the tested ones.
          include_deleted_files: true
          patterns: |-
            kubernetes/**/*.yaml
            tools/test-prometheusrules.sh
            .github/workflows/promtool.yaml

  rule-tests:
    name: Rule tests
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - filter-changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `promtool check rules` on every PrometheusRule CR under kubernetes/,
      # then `promtool test rules` for every *prometheusrule.test.yaml (its
      # sibling rule's .spec extracted). Adding a rule or test needs no edit
      # here.
      - name: promtool check + test rules
        shell: bash
        run: tools/test-prometheusrules.sh kubernetes

  promtool-success:
    # filter-changes is listed so its failure fails the gate instead of
    # skipping rule-tests and going green.
    needs:
      - filter-changes
      - rule-tests
    if: ${{ !cancelled() }}
    name: Promtool successful
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A skipped rule-tests (no kubernetes YAML changed) is success; a
      # failure or a cancelled job fails the aggregator.
      - name: Check job status
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
