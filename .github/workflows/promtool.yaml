---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Promtool

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter-changes:
    name: Filter changes
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get changed files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            kubernetes/**/*prometheusrule*.yaml
            tools/test-prometheusrules.sh
            .github/workflows/promtool.yaml

  rule-tests:
    name: Rule tests
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    runs-on: ubuntu-latest
    needs:
      - filter-changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Discovers every *prometheusrule.test.yaml under kubernetes/, extracts
      # .spec from the sibling PrometheusRule, then runs `promtool check rules`
      # and `promtool test rules`. Adding a test needs no edit here.
      - name: promtool check + test rules
        shell: bash
        run: tools/test-prometheusrules.sh kubernetes

  promtool-success:
    needs:
      - rule-tests
    if: ${{ !cancelled() }}
    name: Promtool successful
    runs-on: ubuntu-latest
    steps:
      # A skipped rule-tests (no prometheusrule*.yaml changed) is success;
      # only a failure fails the aggregator.
      - name: Check job status
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
