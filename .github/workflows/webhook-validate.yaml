---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Webhook Validate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter-changes:
    name: Filter changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get changed files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          include_deleted_files: true
          patterns: |-
            kubernetes/apps/selfhosted/webhook/**
            .github/workflows/webhook-validate.yaml

  validate:
    name: Validate webhook hooks.yaml
    if: ${{ needs.filter-changes.outputs.changed-files != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - filter-changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The HMAC `| js` filter silently corrupts secrets containing =, ', ",
      # <, >, &, or \. Block any new occurrences in webhook hook configs.
      - name: Reject `| js` on HMAC secret templates
        shell: bash
        run: |
          set -euo pipefail
          file="kubernetes/apps/selfhosted/webhook/app/resources/hooks.yaml"
          if [[ ! -f "$file" ]]; then
            echo "$file not found, skipping"
            exit 0
          fi
          if grep -nE '^\s*secret:.*\| *js' "$file"; then
            echo "::error file=$file::secret: fields must not pipe through | js (corrupts HMAC keys containing =, ', \", <, >, &, \\)"
            exit 1
          fi
          # Multi-line case: secret: >- ... {{ ... | js }}
          if awk '
            /^[[:space:]]*secret:/ { in_secret=1; next }
            in_secret && /\| *js/ { print FILENAME ":" NR ": " $0; found=1 }
            in_secret && /^[[:space:]]*[a-zA-Z_-]+:/ && !/^[[:space:]]*secret:/ { in_secret=0 }
            END { exit found ? 1 : 0 }
          ' "$file"; then
            echo "OK: no | js filter found on secret: templates"
          else
            echo "::error file=$file::Multi-line secret: block uses | js — see lines above"
            exit 1
          fi

      # Run the same webhook image used in-cluster against the hooks file and
      # judge the result from its log. webhook does NOT exit when hooks.yaml
      # fails to parse: it logs "couldn't load hooks from file!" and keeps
      # serving zero hooks. So "the process is still alive" proves nothing;
      # the earlier version of this step passed a broken file every time.
      # It also raced the image pull (3s sleep).
      #
      # Pass = webhook reached "serving hooks", logged no load error, found
      # N > 0 hooks and loaded all N.
      - name: Parse hooks.yaml with adnanh/webhook
        shell: bash
        env:
          GITHUB_WEBHOOK_SECRET: ci-placeholder-secret
          # renovate: datasource=docker depName=ghcr.io/home-operations/webhook
          WEBHOOK_VERSION: 2.8.3
        run: |
          set -euo pipefail
          image="ghcr.io/home-operations/webhook:${WEBHOOK_VERSION}"
          docker pull --quiet "$image"
          docker run -d --name webhook-validate \
            -e GITHUB_WEBHOOK_SECRET \
            -v "${PWD}/kubernetes/apps/selfhosted/webhook/app/resources:/config:ro" \
            --entrypoint /app/bin/webhook \
            "$image" \
            -hooks /config/hooks.yaml \
            -template \
            -verbose \
            -port 0
          trap 'docker stop -t 1 webhook-validate >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 30); do
            log=$(docker logs webhook-validate 2>&1)
            if grep -q 'serving hooks on' <<<"$log"; then
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' webhook-validate)" != "true" ]; then
              break
            fi
            sleep 1
          done
          echo "$log"

          if ! grep -q 'serving hooks on' <<<"$log"; then
            echo "::error::webhook never finished loading hooks.yaml"
            exit 1
          fi
          if grep -q "couldn't load" <<<"$log"; then
            echo "::error file=kubernetes/apps/selfhosted/webhook/app/resources/hooks.yaml::webhook could not load hooks.yaml (see log above)"
            exit 1
          fi
          found=$(sed -nE 's/.*found ([0-9]+) hook\(s\) in file.*/\1/p' <<<"$log" | head -n1)
          loaded=$(grep -c $'\tloaded: ' <<<"$log" || true)
          if [ -z "$found" ] || [ "$found" -eq 0 ] || [ "$loaded" -ne "$found" ]; then
            echo "::error::webhook found ${found:-0} hook(s) but loaded ${loaded}"
            exit 1
          fi
          echo "OK: webhook loaded ${loaded}/${found} hooks from hooks.yaml"

  webhook-validate-success:
    # filter-changes is listed so its failure fails the gate instead of
    # skipping `validate` and going green.
    needs:
      - filter-changes
      - validate
    if: ${{ !cancelled() }}
    name: Webhook Validate successful
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check job status
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
