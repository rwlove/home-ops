---
# yaml-language-server: $schema=https://raw.githubusercontent.com/DavidAnson/markdownlint-cli2/main/schema/markdownlint-cli2-config-schema.json
#
# markdownlint-cli2 auto-discovers this file in the repo root, so it
# applies to BOTH the pre-commit hook and the CI markdownlint job
# (bjw-s/action-markdownlint-cli2, which passes changed files directly
# and so bypasses the pre-commit `exclude:` regex).
#
# Rules live in .markdownlint.yaml (referenced by the hook/action via
# --config); this file only carries ignore globs.
#
# resources/ holds vendored config artifacts mounted as ConfigMaps
# (e.g. opencode agent personas) — runtime data, not repo docs. Same
# exclusion the file-content pre-commit hooks already apply to resources/.
ignores:
  - "**/resources/**"
