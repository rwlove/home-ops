---
# kubeadm JoinConfiguration for the additional control-plane nodes
# (JOIN_MASTERS in nodes.sh). create-cluster.sh renders it with envsubst: the
# token, CA hash and certificate key are minted at join time and never
# committed. The patches directory carries any per-node kubelet override from
# init/patches/<group>/ (see docs/src/kubelet_tuning.md); it is empty on nodes
# with no override.
apiVersion: kubeadm.k8s.io/v1beta4
kind: JoinConfiguration
controlPlane:
  certificateKey: ${JOIN_CERT_KEY}
discovery:
  bootstrapToken:
    apiServerEndpoint: ${JOIN_ENDPOINT}
    caCertHashes:
      - ${JOIN_CA_HASH}
    token: ${JOIN_TOKEN}
nodeRegistration:
  criSocket: unix:///var/run/crio/crio.sock
patches:
  directory: /etc/kubernetes/patches
