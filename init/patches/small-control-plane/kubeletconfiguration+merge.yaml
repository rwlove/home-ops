# kubeadm patch for the small control-plane VMs (master2, master3; ~10Gi RAM).
# They run only the control plane and DaemonSets. The cluster-wide 1Gi + 1Gi
# reservation left ~790Mi between pod memory and the 500Mi eviction threshold,
# and kube-apiserver spikes evicted kube-vip dozens of times a day (2026-11-23).
# Static pods are exempt from eviction, so the reservation protected nothing.
# Installed at /etc/kubernetes/patches; see docs/src/kubelet_tuning.md.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
kubeReserved:
  memory: "0"
systemReserved:
  memory: 512Mi
