---
# kubeadm UpgradeConfiguration used for every kubelet re-sync
# (`just cluster kubelet-resync <node>`). Declaring the patches directory here,
# instead of a --patches flag someone has to remember, keeps per-node kubelet
# overrides from silently dropping on a re-sync or upgrade.
apiVersion: kubeadm.k8s.io/v1beta4
kind: UpgradeConfiguration
node:
  patches:
    directory: /etc/kubernetes/patches
