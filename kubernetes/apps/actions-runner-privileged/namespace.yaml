---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: actions-runner-privileged
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # PSA: enforce-privileged by design. This namespace's sole resident is
    # the rwlove/containers image-builder runner set, which requires a
    # privileged dind sidecar (real Docker daemon for `docker buildx` /
    # build-push-action — see runners/containers.yaml). Carved out of
    # actions-runner-system (PSS Phase 2, #15671) specifically so that
    # namespace can stay enforce: baseline and this one architecturally-
    # privileged workload doesn't force a blanket downgrade there.
    # audit/warn match enforce (same reasoning as vpn/namespace.yaml) —
    # there is no non-privileged workload here to ratchet toward a
    # tighter target; see docs/src/pod_security_audit.md.
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
