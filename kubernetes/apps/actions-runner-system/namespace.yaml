---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: actions-runner-system
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # PSS ramp (audit+warn now, enforce per phase): baseline (see docs/src/pod_security_audit.md).
    # ARC runners spawn user-defined workloads; start at baseline (not
    # restricted) until we have a known-good runner spec.
    # The one privileged workload that used to live here (the dind
    # image-builder runner set for rwlove/containers) was carved out to
    # its own actions-runner-privileged namespace so this namespace could
    # move to enforce: baseline (PSS Phase 2, #15671) without rejecting
    # it. See docs/src/pod_security_audit.md.
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: latest
