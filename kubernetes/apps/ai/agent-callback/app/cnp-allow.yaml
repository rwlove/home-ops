---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-callback-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agent-callback
  # Additive — the ai ns default-deny is what locks down. The agent A2A hop
  # (callback -> <agent>.ai:8080) is INTRA-namespace and rides the baseline
  # allow-intra-namespace, so no egress rule is needed here. This only opens the
  # gateway -> callback ingress.
  enableDefaultDeny:
    egress: false
    ingress: false
  ingress:
    # Internal gateway (envoy) -> agent-callback:8080. Authelia extAuth (the
    # SecurityPolicy) gates this at the gateway; a wrong label here silent-drops.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
