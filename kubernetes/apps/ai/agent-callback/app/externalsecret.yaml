---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-callback
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agent-callback-secret
    creationPolicy: Owner
  data:
    # Shared HMAC signing key. notify-mcp signs email action-button tokens with
    # it; this service verifies them. SETUP: Rob must add a random high-entropy
    # value (e.g. `openssl rand -hex 32`) to the 1Password `agent-callback` item
    # as property `hmac_key`. The SAME secret is referenced by notify-mcp. Until
    # it exists the service fails closed (rejects every token).
    - secretKey: CALLBACK_HMAC_KEY
      remoteRef:
        key: agent-callback
        property: hmac_key
