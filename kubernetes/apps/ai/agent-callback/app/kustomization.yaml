---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cnp-allow.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./securitypolicy.yaml
configMapGenerator:
  - name: agent-callback
    files:
      - server.py=./resources/server.py
generatorOptions:
  disableNameSuffixHash: true
