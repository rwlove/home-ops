---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
#
# extAuth via Authelia — agent-callback turns a clicked email button into a real
# agent action, so it MUST be behind Rob's admin session. failOpen stays false:
# Authelia down means deny (never let an action through unauthenticated). The
# matching access_control rule (admin-tier, group:lldap_admin) lives in
# kubernetes/apps/auth/authelia/app/configmap.yaml. The token in the URL is
# additionally HMAC-signed + single-use, so even an authenticated user cannot
# forge or replay an action.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: agent-callback-extauth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agent-callback
  extAuth:
    failOpen: false
    headersToExtAuth:
      - accept
      - cookie
      - authorization
      - proxy-authorization
      - x-forwarded-proto
    http:
      backendRefs:
        - name: authelia
          namespace: auth
          port: 9091
      path: /api/authz/ext-authz/
      headersToBackend:
        - Remote-User
        - Remote-Groups
        - Remote-Name
        - Remote-Email
