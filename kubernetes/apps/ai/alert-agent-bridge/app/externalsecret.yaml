---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alert-agent-bridge
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alert-agent-bridge-secret
    creationPolicy: Owner
  data:
    # Pushover — the supplemental enrichment sink (private channel to Rob). Reuses
    # the same 1P `Pushover` item the alertmanager + local-cron paths use. The
    # enrichment note is priority 0 (quiet context) alongside AlertManager's own
    # page; it can safely carry namespace/app names (private channel, not a public
    # artifact) — same classification stance as the existing Pushover triage path.
    - secretKey: PUSHOVER_TOKEN
      remoteRef:
        key: Pushover
        property: alertmanager_token
    - secretKey: PUSHOVER_USER
      remoteRef:
        key: Pushover
        property: userkey
