---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: calendar-mcp-allow
spec:
  # Additive allow on top of the ai default-deny. Apiserver + DNS are covered by
  # the baseline component.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: calendar-mcp
  ingress:
    # ONLY the five concierge agents may reach the calendar write tools — not the
    # whole ai namespace. Belt-and-suspenders with the per-agent tool bindings
    # (the cluster operators are not bound to this server at all). This is the
    # blast-radius boundary for the Google Calendar write path.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - arnold
                - cooter
                - crusher
                - gordon
                - warren
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # mcp-gateway federation: the Kuadrant broker (mcp-gateway app pod, mcp-system)
    # dials this backend directly over Service DNS to serve the federated calendar_
    # tools. L4 conduit only — the write-authz boundary (the five concierge agents)
    # stays enforced above it via each agent's tool list in the kagent
    # MCPVirtualServer, behind the gateway's Authelia bearer. Without this ingress
    # the broker->backend SYN is dropped. Verified via Hubble (broker APP pod connects).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: mcp-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # → Google Calendar API (www/oauth2/accounts.googleapis.com) + PyPI for the
    # ephemeral `uv run --with` dependency fetch. Broad HTTPS egress; could be
    # tightened to toFQDNs later.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
