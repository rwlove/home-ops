---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calendar-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: calendar-mcp-secret
    creationPolicy: Owner
  data:
    # Google service-account key (JSON) with write access to the shared
    # "Concierge" calendar. Same 1P item the laptop gcal.py reads.
    - secretKey: GOOGLE_SA_KEY
      remoteRef:
        key: concierge-calendar
        property: credential
    # The shared secondary calendar's id.
    - secretKey: CALENDAR_ID
      remoteRef:
        key: concierge-calendar
        property: calendar_id
