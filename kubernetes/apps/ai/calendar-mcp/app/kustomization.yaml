---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/repos/app-template
resources:
  - ./cnp-allow.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: calendar-mcp-configmap
    files:
      - calendar_mcp.py=./resources/calendar_mcp.py
generatorOptions:
  disableNameSuffixHash: true
