---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: claude-runner-jobs
  labels:
    app.kubernetes.io/name: claude-runner
spec:
  # ACTIVE (unsuspended 2026-08-24, trial). This is the vault-driven runner:
  # the JOBS live as private notes in the Obsidian vault (never in this public
  # repo) under `automation/jobs/claude/`; this CronJob is only the reviewed
  # CAGE. Governed by .agents/instructions/claude-runner-routing.md — re-add
  # `suspend: true` to pause without tearing down objects.
  # 0 13 * * 1 UTC = Mon 09:00 EDT / 08:00 EST. Weekly — every note in the
  # folder runs on this cadence (finer cadence = a second runner).
  schedule: "0 13 * * 1"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # 40 min: a vault mirror (~few min) + N caged claude jobs.
      activeDeadlineSeconds: 2400
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: claude-runner
          annotations:
            k8tz.io/inject: "false"
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: claude-runner
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          initContainers:
            # NATIVE SIDECAR (restartPolicy: Always) — the official
            # livesync-cli daemon materialises the private `claude` vault into
            # the shared scratch dir. It runs for the life of the main
            # container and is terminated by the kubelet once the Job
            # completes (native-sidecar semantics, k8s >= 1.29). Reuses the
            # claude-vault-bridge secret (in-cluster CouchDB, db `claude`,
            # encrypt:false). CouchDB stays canonical; this mount is read-only
            # to the runner, so nothing is written back.
            - name: vault-bridge
              image: ghcr.io/vrtmrz/livesync-cli:1.0.24-cli
              restartPolicy: Always
              imagePullPolicy: IfNotPresent
              args:
                - --settings
                - /config/settings.json
                - --vault
                - /vault
                - daemon
              env:
                - name: LIVESYNC_DB_PATH
                  value: /db
                - name: TZ
                  value: America/New_York
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 25m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: vault-scratch
                  mountPath: /db
                  subPath: db
                - name: vault-scratch
                  mountPath: /vault
                  subPath: vault
                - name: bridge-config
                  mountPath: /config
                  readOnly: true
                - name: bridge-tmp
                  mountPath: /tmp
          containers:
            - name: runner
              image: ghcr.io/rwlove/claude-runner:v2.1.261
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - |
                  DIR=/vault/automation/jobs/claude
                  # The vault-bridge sidecar does an initial FULL replication of
                  # the vault (~1200+ files) into this per-run scratch dir. The
                  # jobs DIRECTORY can appear early — while its *.md notes are
                  # still in flight — so waiting on the directory alone RACES: a
                  # run can glob zero notes and exit 0 (the 2026-08-24 43s no-op).
                  # Wait instead until the WHOLE /vault file count stops growing
                  # for 4 consecutive 5s samples (initial sync settled), capped
                  # at ~8 min so a stuck sidecar can't hang the job.
                  echo "waiting for the vault-bridge sidecar to finish materialising the vault ..."
                  prev=-1; stable=0; i=0
                  while [ "$stable" -lt 4 ] && [ "$i" -lt 96 ]; do
                    n=$(find /vault -type f 2>/dev/null | wc -l)
                    if [ "$n" -gt 0 ] && [ "$n" -eq "$prev" ]; then
                      stable=$((stable + 1))
                    else
                      stable=0
                    fi
                    prev=$n; i=$((i + 1)); sleep 5
                  done
                  echo "vault settled at $prev file(s) after $((i * 5))s"
                  if [ ! -d "$DIR" ]; then
                    echo "FATAL: vault jobs folder $DIR never materialised"; exit 1
                  fi
                  ran=0
                  for f in "$DIR"/*.md; do
                    [ -e "$f" ] || continue
                    name=$(basename "$f" .md)
                    echo "=== job: $name ==="
                    # Claude READS Prometheus (curl, no secret → allowed) and
                    # REASONS, printing the digest (or the word CLEAN) to stdout.
                    # It does NOT send Pushover itself: claude --print auto-denies
                    # a Bash command that reads a secret env var AND hits the
                    # network. So the RUNNER SHELL delivers the digest below —
                    # PUSHOVER_TOKEN never touches a Claude tool call.
                    OUT=$(claude --print --allowedTools "Bash(curl:*)" --max-turns 25 < "$f" 2>&1) || {
                      echo "job $name: claude run failed (continuing)"; continue; }
                    ran=$((ran + 1))
                    SIG=$(printf '%s' "$OUT" | tr -d '[:space:]')
                    if [ -z "$SIG" ] || [ "$SIG" = "CLEAN" ]; then
                      echo "job $name: nothing to report"; continue
                    fi
                    MSG=$(printf '%s' "$OUT" | cut -c1-1000)
                    H=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
                          --form-string "token=$PUSHOVER_TOKEN" \
                          --form-string "user=$PUSHOVER_USER" \
                          --form-string "title=$name $(date -u +%Y-%m-%d)" \
                          --form-string "message=$MSG" \
                          https://api.pushover.net/1/messages.json) || { echo "job $name: pushover errored"; continue; }
                    echo "job $name: pushover HTTP $H"
                  done
                  echo "ran $ran job(s)"
                  # Guardrail (claude-runner-routing.md #10): a settled vault with
                  # ZERO notes means the sync failed or the folder is unexpectedly
                  # empty — make that VISIBLE instead of a silent success.
                  notes=$(ls "$DIR"/*.md 2>/dev/null | wc -l)
                  if [ "$notes" -eq 0 ]; then
                    echo "WARNING: no job notes present in $DIR after the vault settled"
                    curl -sS --max-time 30 -o /dev/null \
                      --form-string "token=$PUSHOVER_TOKEN" \
                      --form-string "user=$PUSHOVER_USER" \
                      --form-string "title=claude-runner-jobs: no notes" \
                      --form-string "message=Vault materialised but $DIR held no *.md notes — sync may have failed." \
                      https://api.pushover.net/1/messages.json || true
                  fi
              env:
                - name: HOME
                  value: /workspace
                - name: TZ
                  value: America/New_York
              # Subscription token (CLAUDE_CODE_OAUTH_TOKEN) + Pushover.
              envFrom:
                - secretRef:
                    name: claude-runner-secret
                    optional: false
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: vault-scratch
                  mountPath: /vault
                  subPath: vault
                  readOnly: true
                - name: workspace
                  mountPath: /workspace
                - name: tmp
                  mountPath: /tmp
          volumes:
            # Per-run scratch (disk, not tmpfs — ~80 MB: PouchDB /db + the
            # materialised /vault files). Discarded when the Job pod ends.
            - name: vault-scratch
              emptyDir:
                sizeLimit: 1Gi
            - name: bridge-config
              secret:
                secretName: claude-vault-bridge-secret
            - name: bridge-tmp
              emptyDir:
                medium: Memory
                sizeLimit: 128Mi
            - name: workspace
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
