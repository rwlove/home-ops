---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-runner-shell
  labels:
    app.kubernetes.io/name: claude-runner
spec:
  # Persistent interactive Claude Code session that survives laptop sleep.
  # Attach:  kubectl -n ai exec -it deploy/claude-runner-shell -- tmux attach -t main
  # then run `claude`. Detach with Ctrl-b d (or just let the connection drop) —
  # the tmux session, and any task running in it, keeps going in the pod.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: claude-runner
      app.kubernetes.io/component: shell
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claude-runner
        app.kubernetes.io/component: shell
      annotations:
        k8tz.io/inject: "false"
    spec:
      # amd64 image; ai ns also has arm64 Spark nodes.
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        # Writable ceph-block PVC at HOME — chown the mount to the non-root gid.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: claude-runner
      automountServiceAccountToken: false
      containers:
        - name: shell
          image: ghcr.io/rwlove/claude-runner:v2.1.241
          imagePullPolicy: IfNotPresent
          # Hold a detached tmux session "main" (running the default bash) alive;
          # sleep infinity keeps PID 1 up. tini reaps/forwards signals.
          command:
            - /sbin/tini
            - --
            - bash
            - -c
            - tmux new-session -d -s main; exec sleep infinity
          workingDir: /home/node
          env:
            - name: HOME
              value: /home/node
            - name: TZ
              value: America/New_York
          # Subscription token (CLAUDE_CODE_OAUTH_TOKEN) — same secret as the
          # cron workflows; PUSHOVER_* come along unused, harmless.
          envFrom:
            - secretRef:
                name: claude-runner-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /home/node
            - name: tmp
              mountPath: /tmp
            # The materialised vault, shared with the vault-bridge sidecar
            # (subPath `vault` of the same RWO PVC — single pod, no RWX).
            # CouchDB (obsidian.${SECRET_DOMAIN}) stays the source of truth;
            # this is a SECONDARY writer. If pod-Claude and the laptop edit
            # the same note at once, LiveSync records conflict revisions —
            # resolve them from Obsidian on the laptop. See ./README.md.
            - name: vault
              mountPath: /home/node/vaults/claude
              subPath: vault
        # ---------------------------------------------------------------
        # vault-bridge — official Self-hosted LiveSync CLI (same author &
        # core as the Obsidian plugin) running its `daemon`: continuously
        # replicates the CouchDB remote <-> the local filesystem via the
        # _changes feed. This is what materialises the vault as FILES the
        # in-cluster Claude can read/write. Sidecar (not standalone) so the
        # vault volume stays RWO inside one pod.
        - name: vault-bridge
          image: ghcr.io/vrtmrz/livesync-cli:1.0.17-cli
          imagePullPolicy: IfNotPresent
          # Entrypoint prepends the DB path (LIVESYNC_DB_PATH) as argv[1],
          # so these args become:
          #   /db --settings /config/settings.json --vault /vault daemon
          # daemon = mirror-scan then continuous bidirectional sync.
          args:
            - --settings
            - /config/settings.json
            - --vault
            - /vault
            - daemon
          env:
            - name: LIVESYNC_DB_PATH
              value: /db
            - name: TZ
              value: America/New_York
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            # PouchDB local database (leveldown writes here).
            - name: vault
              mountPath: /db
              subPath: db
            # The materialised vault .md files.
            - name: vault
              mountPath: /vault
              subPath: vault
            # settings.json (couchDB_URI/user/password/dbname/passphrase),
            # rendered by the claude-vault-bridge ExternalSecret from 1P.
            - name: bridge-config
              mountPath: /config
              readOnly: true
            - name: bridge-tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: claude-shell-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: vault
          persistentVolumeClaim:
            claimName: claude-vault-data
        - name: bridge-config
          secret:
            secretName: claude-vault-bridge-secret
        - name: bridge-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
