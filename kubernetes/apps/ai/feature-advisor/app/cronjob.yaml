---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: feature-advisor
  labels:
    app.kubernetes.io/name: feature-advisor
spec:
  # Weekly upstream feature-adoption advisor on the CLAUDE tier (Max subscription
  # via the headless `claude` CLI — never an Anthropic API key). It git-logs the
  # Renovate image/chart bumps from the last ~8 days, reads each new version's
  # release notes, compares them against our current home-ops config, and OPENS A
  # PR per worthwhile new feature we should adopt. Claude authors the diff (a 7B
  # local model can't do this reasoning — see the network-drift precedent) but
  # holds only a scoped Contents+PR-write token (NO merge); main is branch-
  # protected, so every PR is Rob-reviewed. home-ops is a PUBLIC repo — the prompt
  # carries a hard data-classification rule (no secrets / restricted app names /
  # media names / internal IPs).
  #
  # Reuses existing ai-ns secrets (no new provisioning): network-drift-secret
  # (CLAUDE_CODE_OAUTH_TOKEN, the Max sub) + kagent-doer-secret (GITHUB_PR_TOKEN,
  # already scoped to rwlove/home-ops Contents+PR write, no merge — same token the
  # doers use).
  #
  # ACTIVE. Verified 2026-09-27 (test job feature-advisor-test): reviewed 6 recent
  # bumps, correctly judged 5 as nothing-to-adopt (no noise), and opened one sound
  # security-hardening PR (#14525, pgadmin readOnlyRootFilesystem) — minimal,
  # verified-before-proposing, leak-free. High-quality Claude-tier recommendations.
  suspend: false
  schedule: "0 9 * * 1"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # npm install + shallow clone + a multi-upgrade research/author/PR pass.
      activeDeadlineSeconds: 2700
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: feature-advisor
          annotations:
            k8tz.io/inject: "false"
        spec:
          # amd64 image; the ai ns also has arm64 Spark nodes — pin so the pod
          # can't land on Spark and hit an exec-format error.
          nodeSelector:
            kubernetes.io/arch: amd64
          automountServiceAccountToken: false
          restartPolicy: Never
          # fsGroup so the non-root (1000) container can write the marker to the
          # ceph-block state PVC. OnRootMismatch skips a needless recursive chown.
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: advisor
              # node:22 FULL (buildpack-deps: has git + curl; glibc for the claude
              # CLI's prebuilt binaries). -slim would lack git.
              image: docker.io/library/node:24@sha256:22f6fe5f59fb7fed238b19623506d573dffaa932ce33b84ce541a9a2e0eade28
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                # Flux postBuild runs envsubst in STRICT mode over this manifest
                # (AND over the ConfigMap data): every shell `$` is doubled (`$$`)
                # so the rendered manifest carries a literal `$` for /bin/sh. The
                # /config prompt files deliberately contain NO `$VAR` for the same
                # reason.
                - |
                  cd /tmp
                  export HOME=/tmp
                  export XDG_CONFIG_HOME=/tmp/.config
                  export npm_config_cache=/tmp/.npm
                  export npm_config_prefix=/tmp/.npm-global
                  export PATH="/tmp/.npm-global/bin:$${PATH}"
                  export CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
                  export GH_TOKEN="$${GITHUB_PR_TOKEN}"

                  echo "----- installing claude CLI -----"
                  npm install -g @anthropic-ai/claude-code >/tmp/npm.log 2>&1 || {
                    echo "FATAL: claude CLI install failed"; tail -30 /tmp/npm.log; exit 1;
                  }
                  claude --version || { echo "FATAL: claude CLI not runnable"; exit 1; }

                  echo "----- cloning home-ops (shallow, ~45d history) -----"
                  git clone --shallow-since="45 days ago" \
                    "https://x-access-token:$${GITHUB_PR_TOKEN}@github.com/rwlove/home-ops" \
                    /tmp/home-ops 2>/tmp/clone.log || {
                    echo "FATAL: clone failed"; tail -5 /tmp/clone.log; exit 1;
                  }
                  cd /tmp/home-ops
                  git config user.name "kagent-feature-advisor"
                  git config user.email "kagent-feature-advisor@users.noreply.github.com"

                  # "Since last check-in": /state/last-sha holds the HEAD of the last
                  # SUCCESSFUL run. Review exactly the commits since then; on the
                  # first run (or if the marker predates the ~45d shallow window and
                  # so isn't in the clone) fall back to an 8-day window.
                  LAST="$$(cat /state/last-sha 2>/dev/null || true)"
                  if [ -n "$$LAST" ] && git cat-file -e "$${LAST}^{commit}" 2>/dev/null; then
                    RANGE_HINT="For step 1, review ONLY the dependency bumps in the git range $${LAST}..HEAD (run: git log $${LAST}..HEAD --no-merges) — the commits since your last check-in."
                    echo "since-marker: $${LAST} (range $${LAST}..HEAD)"
                  else
                    RANGE_HINT="For step 1, no prior check-in marker is available — review the dependency bumps from: git log --since=\"8 days ago\"."
                    echo "since-marker: none (first run / marker outside shallow window) — using 8-day window"
                  fi

                  echo "----- feature advisor run (claude tier) -----"
                  # Headless. Explicit read/edit/git allowlist — never
                  # --dangerously-skip-permissions. Claude authors the diff and
                  # opens PRs with the scoped token; it cannot merge.
                  claude -p "$$(cat /config/prompt.txt)

                  $${RANGE_HINT}" \
                    --allowedTools "$$(cat /config/allowed-tools.txt)" \
                    --max-turns 80 \
                    --output-format text

                  # Reached only if claude exited 0 (set -e) — advance the marker so
                  # the next run starts where this one ended. A failed run leaves the
                  # marker unchanged and re-reviews the same range next time.
                  git rev-parse HEAD > /state/last-sha
                  echo "----- advisor complete (marker -> $$(git rev-parse --short HEAD)) -----"
              env:
                - name: TZ
                  value: America/New_York
              envFrom:
                # CLAUDE_CODE_OAUTH_TOKEN — Max subscription (never an API key).
                - secretRef:
                    name: network-drift-secret
                # GITHUB_PR_TOKEN — scoped Contents+PR write on rwlove/home-ops,
                # no merge (the doers' token; reused).
                - secretRef:
                    name: kagent-doer-secret
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: state
                  mountPath: /state
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 1Gi
            - name: config
              configMap:
                name: feature-advisor-config
            - name: state
              persistentVolumeClaim:
                claimName: feature-advisor-state
