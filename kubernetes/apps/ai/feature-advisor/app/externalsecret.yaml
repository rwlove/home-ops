---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Claude MAX subscription OAuth token for the headless `claude` CLI (output of
# `claude setup-token`). SUBSCRIPTION ONLY — never an Anthropic API key (Rob's
# hard constraint).
#
# feature-advisor used to piggyback on network-drift's `network-drift-secret`
# for this token. PR #15009 converted network-drift to a deterministic, zero-LLM
# detector and deleted its ExternalSecret — which silently broke every weekly
# feature-advisor run (unresolvable `envFrom` secretRef → DeadlineExceeded). This
# gives feature-advisor its OWN ExternalSecret so its token supply no longer
# depends on an unrelated app's lifecycle. It still reads the SAME 1Password item
# (`network-drift`, property `claude_code_oauth_token`) — that item remains the
# canonical store for the Max-subscription token, so no re-provisioning by Rob.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: feature-advisor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: feature-advisor-secret
  data:
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: network-drift
        property: claude_code_oauth_token
