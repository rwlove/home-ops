---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cnp-allow.yaml
  - ./cronjob.yaml
configMapGenerator:
  - name: feature-advisor-config
    files:
      - prompt.txt=./resources/prompt.txt
      - allowed-tools.txt=./resources/allowed-tools.txt
generatorOptions:
  disableNameSuffixHash: true
