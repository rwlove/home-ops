---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/persistentvolumeclaim-v1.json
# Tiny persistent marker so the advisor reviews exactly the bumps since its last
# SUCCESSFUL run (stores the last-processed commit SHA), instead of a fixed time
# window that would miss older bumps if the cron were ever down longer than it.
# Regenerable derived state → ceph-block per storage-class.instructions.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: feature-advisor-state
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 1Gi
