---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app feature-advisor
spec:
  # Weekly upstream feature-adoption advisor on the CLAUDE tier (Max subscription
  # via the headless `claude` CLI). Reads Renovate image/chart bumps + their
  # release notes, compares vs our config, and opens recommendation PRs (Rob
  # reviews/merges). Reuses ai-ns secrets network-drift-secret + kagent-doer-secret.
  # Ships SUSPENDED pending a leak-free manual-test run.
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: ai
  path: ./kubernetes/apps/ai/feature-advisor/app
  interval: 1h
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: home-ops-kubernetes
    namespace: flux-system
  dependsOn:
    - name: onepassword-connect
      namespace: external-secrets
