---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ghostfolio-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    controllers:
      ghostfolio-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        type: deployment
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/mhajder/ghostfolio-mcp
              tag: 1.8.2@sha256:13dc92347de3def7c4b1061ad055028623ed03b8fac0bec40ed6eaa6fb974f3e
            env:
              # HTTP transport so kagent can reach it as a RemoteMCPServer
              # (STREAMABLE_HTTP at /mcp on :8000).
              MCP_TRANSPORT: http
              MCP_HTTP_HOST: 0.0.0.0
              MCP_HTTP_PORT: "8000"
              # Talk to Ghostfolio over the in-cluster service (no TLS needed).
              GHOSTFOLIO_URL: http://ghostfolio.selfhosted.svc.cluster.local:3333
              # Full read+write surface for warren (advisory model + population).
              READ_ONLY_MODE: "false"
              TZ: America/New_York
            # GHOSTFOLIO_TOKEN (the Ghostfolio admin security token) from 1P.
            envFrom:
              - secretRef:
                  name: ghostfolio-mcp-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8000
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  failureThreshold: 3
            resources:
              requests:
                cpu: 15m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              # readOnlyRootFilesystem left OFF for bring-up: the Python image's
              # write paths (caches under /data, /tmp) are unverified. /data and
              # /tmp are emptyDir below; tighten after soak.
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: ghostfolio-mcp
        ports:
          http:
            port: *port
    persistence:
      data:
        type: emptyDir
        advancedMounts:
          ghostfolio-mcp:
            app:
              - path: /data
      tmp:
        type: emptyDir
        advancedMounts:
          ghostfolio-mcp:
            app:
              - path: /tmp
    externalSecrets:
      ghostfolio-mcp:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: ghostfolio-mcp-secret
          template:
            data:
              GHOSTFOLIO_TOKEN: "{{ .GHOSTFOLIO_TOKEN }}"
        dataFrom:
          - extract:
              key: ghostfolio
    networkpolicies:
      allow:
        type: cilium
        forceRename: ghostfolio-mcp-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: ghostfolio-mcp
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # kagent (ai ns) calls the MCP over STREAMABLE_HTTP on :8000. Scoped
          # to the ai namespace — this is a full read+write Ghostfolio surface
          # (Restricted finance), so it is NOT cluster-wide reachable.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
            toPorts:
              - ports:
                  - port: "8000"
                    protocol: TCP
          # mcp-gateway federation: the Kuadrant broker (mcp-gateway app pod,
          # mcp-system) dials this backend directly over Service DNS to serve the
          # federated ghostfolio_ tools. ai is default-deny, so without this the
          # broker->backend SYN is dropped (context deadline → broker removes the
          # tools); the mcp-system egress half is in mcp-system/ghostfolio-mcp/app/cnp-allow.yaml.
          #
          # SECOND selector added 2026-11-14: every backend's HTTPRoute (the
          # mcp-gateway `mcps` listener) is actually dispatched per tool call by
          # the Istio data-plane pod itself, not proxied through the broker —
          # the "Verified via Hubble" note above only ever tested the broker's
          # own health-ping/registration dial, not the real per-call data path.
          # home-ops#15904 fixed that pod's egress side; this adds the matching
          # ingress half here (destination side), mirroring the two-selector
          # shape already proven in media/music-assistant-allow. Root-caused on
          # health-mcp-rw via Tempo trace 51dc161b71ac0d3e8c8ddef903f4c9f5 (3x
          # 10s connect-timeout/UF) + a live `Policy denied` drop spike on the
          # backend's own node during the incident window. Full rationale:
          # kubernetes/apps/ai/calendar-mcp/app/cnp-allow.yaml.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  app.kubernetes.io/name: mcp-gateway
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  gateway.networking.k8s.io/gateway-name: mcp-gateway
            toPorts:
              - ports:
                  - port: "8000"
                    protocol: TCP
        egress:
          # → Ghostfolio REST API in selfhosted ns.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: selfhosted
                  app.kubernetes.io/name: ghostfolio
            toPorts:
              - ports:
                  - port: "3333"
                    protocol: TCP
