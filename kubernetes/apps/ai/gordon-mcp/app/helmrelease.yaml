---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app gordon-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    controllers:
      gordon-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        type: deployment
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/rwlove/mcp-openapi-proxy
              tag: v0.4.0@sha256:23906c73b605b7d464c21194bb0a4a017b59d464828d332cdd5e44f4970c841e
            # Generic OpenAPI->MCP bridge (matthewhand/mcp-openapi-proxy), serving
            # STREAMABLE-HTTP at /mcp on :8080 — the image bakes
            # MCP_TRANSPORT=streamable-http (stateless), so this backend federates
            # through the Kuadrant mcp-gateway (SSE-only ckanthony could not).
            # Env-driven: OPENAPI_SPEC_URL is the hand-authored KitchenOwl spec
            # mounted below; SERVER_URL_OVERRIDE overrides the spec's server to the
            # in-cluster service. The static Bearer token is injected into every
            # upstream request via API_KEY (default scheme Authorization: Bearer).
            env:
              TZ: America/New_York
              OPENAPI_SPEC_URL: file:///spec/kitchenowl.json
              SERVER_URL_OVERRIDE: http://kitchenowl.collab.svc.cluster.local:8080
            # API_KEY=<gordon_agent_token> from 1P via the ES.
            envFrom:
              - secretRef:
                  name: gordon-mcp-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: gordon-mcp
        ports:
          http:
            port: *port
    persistence:
      # Hand-authored OpenAPI spec (configMapGenerator in kustomization.yaml).
      spec:
        type: configMap
        name: gordon-mcp-spec
        advancedMounts:
          gordon-mcp:
            app:
              - path: /spec/kitchenowl.json
                subPath: kitchenowl.json
                readOnly: true
      # godotenv probes <specdir>/.env on start; give it a writable tmp and keep
      # the root filesystem read-only.
      tmp:
        type: emptyDir
        advancedMounts:
          gordon-mcp:
            app:
              - path: /tmp
    externalSecrets:
      gordon-mcp:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: gordon-mcp-secret
          template:
            data:
              # matthewhand sends `Authorization: Bearer <API_KEY>` by default.
              API_KEY: "{{ .gordon_agent_token }}"
        dataFrom:
          - extract:
              key: kitchenowl
    networkpolicies:
      allow:
        type: cilium
        forceRename: gordon-mcp-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: gordon-mcp
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # mcp-gateway federation: the Kuadrant broker (mcp-gateway app pod,
          # mcp-system) dials this backend directly over Service DNS to serve the
          # federated gordon_ tools. ai is default-deny, so without this the
          # broker->backend SYN is dropped. Verified pattern (see #15826).
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  app.kubernetes.io/name: mcp-gateway
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          # Legacy kagent direct dial (ai ns) — retired once gordon migrates to
          # the gateway (Stage 2); kept transiently so nothing drops mid-rollout.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        egress:
          # -> KitchenOwl in the collab ns (spec fetch + tool calls), :8080.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: collab
                  app.kubernetes.io/name: kitchenowl
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
