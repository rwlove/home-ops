---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/repos/app-template
resources:
  - ./helmrelease.yaml
  # ReferenceGrant: lets the mcp-system HTTPRoute (gateway federation) target this
  # ns-ai gordon-mcp Service cross-namespace.
  - ./referencegrant.yaml
configMapGenerator:
  - name: gordon-mcp-spec
    files:
      - kitchenowl.json=./resources/kitchenowl.json
generatorOptions:
  disableNameSuffixHash: true
