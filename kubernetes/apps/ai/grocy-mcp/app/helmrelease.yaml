---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app grocy-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    controllers:
      grocy-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        type: deployment
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/rwlove/mcp-openapi-proxy
              tag: v0.4.0@sha256:23906c73b605b7d464c21194bb0a4a017b59d464828d332cdd5e44f4970c841e
            # Generic OpenAPI->MCP bridge over SSE (GET/POST /mcp, binds
            # 0.0.0.0:8080). --spec is the hand-authored Grocy subset; --base-url
            # overrides the spec's server to the in-cluster service. The
            # GROCY-API-KEY header is injected into every upstream request via
            # REQUEST_HEADERS (from the secret). Bound by the `vila` agent.
            env:
              TZ: America/New_York
              OPENAPI_SPEC_URL: file:///spec/grocy.json
              SERVER_URL_OVERRIDE: http://grocy.selfhosted.svc.cluster.local:80
            # REQUEST_HEADERS=GROCY-API-KEY:<api_key> from 1P via the
            # ExternalSecret. Grocy's API key is a proper long-lived key created
            # in its UI (Manage API keys) — no expiry concern.
            envFrom:
              - secretRef:
                  name: grocy-mcp-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: grocy-mcp
        ports:
          http:
            port: *port
    persistence:
      spec:
        type: configMap
        name: grocy-mcp-spec
        advancedMounts:
          grocy-mcp:
            app:
              - path: /spec/grocy.json
                subPath: grocy.json
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          grocy-mcp:
            app:
              - path: /tmp
    externalSecrets:
      grocy-mcp:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: grocy-mcp-secret
          template:
            data:
              EXTRA_HEADERS: "GROCY-API-KEY: {{ .api_key }}"
        dataFrom:
          - extract:
              key: grocy
    networkpolicies:
      allow:
        type: cilium
        forceRename: grocy-mcp-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: grocy-mcp
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # mcp-gateway federation: the Kuadrant broker (mcp-gateway app pod,
          # mcp-system) dials this backend directly over Service DNS to serve the
          # federated tools. ai is default-deny; backend-ingress half of the
          # cross-ns pattern (#15826).
          #
          # SECOND selector (2026-11-17): the "No istio-egress (dead, #15834)"
          # note above was wrong — every HTTPRoute tool call is actually
          # dispatched by mcp-gateway-istio (the Gateway's own Envoy data-plane
          # pod, labeled gateway.networking.k8s.io/gateway-name=mcp-gateway), not
          # proxied through the broker pod. tools/list (served from the broker's
          # own discovery cache) never touches that pod, which is why federation
          # looked healthy while every tools/call connect-failed. Same root cause
          # #15904 already fixed on calendar-mcp + 6 siblings 2026-11-14; this
          # backend was scaffolded afterward from a template that both predated
          # that generalization and carried the stale "dead" note. Confirmed live
          # on vikunja-mcp (home-ops#16050/#16051): mcp-gateway-istio's own Envoy
          # stats (:15000/clusters) showed cx_connect_fail == cx_total until both
          # this ingress selector AND the mcp-gateway-istio-allow egress entry
          # were added.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  app.kubernetes.io/name: mcp-gateway
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  gateway.networking.k8s.io/gateway-name: mcp-gateway
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          # Legacy kagent direct dial (ai ns) — retired at Stage 2.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        egress:
          # -> Grocy in the selfhosted ns (spec fetch + tool calls), :80.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: selfhosted
                  app.kubernetes.io/name: grocy
            toPorts:
              - ports:
                  - port: "80"
                    protocol: TCP
