---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/servicemonitor_v1.json
#
# health-mcp-rw was never scraped before this (Vikunja #90). It exposes
# `health_mcp_tool_calls_total{status,tool}` on the same :8080 the MCP
# endpoint serves — confirmed live via `GET /metrics`. The `ai` namespace's
# baseline allow-monitoring-scrape CNP (endpointSelector: {}) already admits
# the observability Prometheus pod into every pod in this namespace, so no
# CNP change is needed here (same precedent as ai/kagent/app/servicemonitor.yaml).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: health-mcp-rw
  labels:
    app.kubernetes.io/name: health-mcp-rw
spec:
  endpoints:
    - interval: 30s
      path: /metrics
      port: http
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - ai
  selector:
    matchLabels:
      app.kubernetes.io/name: health-mcp-rw
