---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  # Additive — the ai namespace default-deny triggers the lockdown; these
  # rules punch holes. DNS egress is provided cluster-wide by the baseline
  # network-policy component, so it is not repeated here.
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    # Primary model: the vLLM reasoning/driver LLM on the Spark. Hermes runs
    # the local execution loop against this endpoint — zero Anthropic quota.
    # The driver's own cnp-allow adds the matching ingress entry for hermes.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: vllm-driver-spark
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # LightRAG knowledge-graph API (:9621) — the query/ingest skill and the
    # pre_llm_call auto-RAG hook. Same-namespace endpoint; auth is the X-API-Key.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: lightrag
      toPorts:
        - ports:
            - port: "9621"
              protocol: TCP
    # Full lovenet-gateway MCP broker (all tools) for every agent — the
    # mcp-gateway in mcp-system on :8080. The mcp-gateway pod's own CNP only
    # admits the istio gateway, which fronts the broker and admits
    # `fromEntities:[cluster]` on :8080; this egress is what lets hermes reach it.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # External HTTPS for (a) the claude-code escalation skill → api.anthropic.com
    # (draws Rob's Max subscription) and (b) the one-time npm install of the
    # `claude` CLI onto the PVC. toEntities:[world]:443 is the cluster's reliable
    # external-egress pattern — Cilium 1.19 toFQDNs.matchPattern is limited here
    # (see project_cilium_matchpattern_fqdn_limits; actions-runner uses the same
    # world:443 rule). The fine-grained exfil control is the fail-closed
    # pre_tool_call gate (blocks credential + restricted-tier content in tool
    # args), not the CNP; tightening this to toFQDNs is a hardening follow-up.
    - toEntities: [world]
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  ingress:
    # Blackbox-exporter health probe → /health on :8642 (unauthenticated).
    # Without this the hermes-health probe is a silent default-deny drop and
    # probe_success never populates — the #13264 label trap. The label is
    # `prometheus-blackbox-exporter`, NOT `blackbox-exporter`.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus-blackbox-exporter
      toPorts:
        - ports:
            - port: "8642"
              protocol: TCP
    # Internal gateway (envoy) → the board dashboard (:9119, Authelia-fronted)
    # and the api_server / peer endpoint (:8642, bearer-key). Without this the
    # board + hermes-api HTTPRoutes resolve but Cilium default-denies the
    # gateway→backend hop, so Envoy returns "503 upstream connection timeout".
    # Same pattern as ai/khoj. Auth is enforced at the gateway (Authelia) and by
    # the api_server's own bearer key — the CNP only opens the network path.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "9119"
              protocol: TCP
            - port: "8642"
              protocol: TCP
