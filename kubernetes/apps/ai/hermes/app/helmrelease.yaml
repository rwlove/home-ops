---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    # First boot: s6 remaps the hermes user, chowns /opt/data, then starts the
    # gateway. Don't let Flux block on readiness (mirrors vllm/ollama-spark).
    disableWait: true
  upgrade:
    disableWait: true
  values:
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        # StatefulSet + single writer: "never run two gateway containers
        # against the same data directory" (session/memory stores are not
        # concurrency-safe). RWO Longhorn volume enforces it.
        type: statefulset
        pod:
          securityContext:
            # s6-overlay image: /init starts as root to remap the internal
            # `hermes` user to HERMES_UID/GID and chown /opt/data, then drops
            # each supervised service to that user via s6-setuidgid. So it MUST
            # start as root and keep the default cap set — runAsNonRoot or
            # capabilities.drop:[ALL] breaks the supervised drop. Documented
            # escape hatch per helmrelease.security.md (same root-required
            # rationale as ollama-spark / vllm-driver-spark).
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          config-seed:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.9.14
            # Apply the operator-owned config.yaml declaratively on every start
            # (cp -f, was cp -n in PR-3). This keeps the `hooks.pre_tool_call`
            # gate block authoritative — an agent edit to config.yaml cannot
            # persistently disable its own gate, since the declarative version
            # is restored on restart. Personal identity (SOUL/USER/MEMORY) lives
            # in separate files, hand-placed on the PVC, and is untouched.
            command:
              - sh
              - -c
              # Apply both the config and the shell-hook consent allowlist
              # declaratively each start (before the gateway registers hooks).
              # The allowlist is what actually makes the pre_tool_call gate FIRE
              # — an unconsented hook is skipped (fail-open on consent), and
              # HERMES_ACCEPT_HOOKS does not consent `gateway run` (verified via
              # `hermes hooks doctor`). Seeding it each start also restores it if
              # the agent deletes it, since consent is checked at registration.
              #
              # Profiles (the board's "different agents"): each profile's
              # config.yaml is operator-owned (cp -f = authoritative — pins the
              # LOCAL provider + the orchestrator's kanban toolset, so an agent
              # cannot disable its own gate or switch to a remote model). SOUL.md
              # is a one-time identity seed (cp -n) the agent then evolves — never
              # clobbered on restart.
              - |
                set -e
                cp -f /seed/config.yaml /opt/data/config.yaml
                cp -f /seed/shell-hooks-allowlist.json /opt/data/shell-hooks-allowlist.json
                for p in orchestrator generalist ml network observability smart-home storage librarian; do
                  mkdir -p "/opt/data/profiles/$${p}"
                done
                cp -f /seed-profiles/orchestrator-config.yaml /opt/data/profiles/orchestrator/config.yaml
                # librarian is a worker (wiki maintainer) — same self-contained worker-config
                # (local pin + gate); its identity is librarian.SOUL.md, seeded cp -n below.
                for p in generalist ml network observability smart-home storage librarian; do
                  cp -f /seed-profiles/worker-config.yaml "/opt/data/profiles/$${p}/config.yaml"
                done
                for p in orchestrator generalist ml network observability smart-home storage librarian; do
                  cp -n "/seed-profiles/$${p}.SOUL.md" "/opt/data/profiles/$${p}/SOUL.md" || true
                done
                # LightRAG skill (operator-owned, cp -f authoritative).
                mkdir -p /opt/data/skills/lightrag/scripts
                cp -f /seed-skills/SKILL.md /opt/data/skills/lightrag/SKILL.md
                cp -f /seed-skills/query.py /opt/data/skills/lightrag/scripts/query.py
                cp -f /seed-skills/ingest.py /opt/data/skills/lightrag/scripts/ingest.py
                chmod +x /opt/data/skills/lightrag/scripts/query.py /opt/data/skills/lightrag/scripts/ingest.py
                # Wiki skill (the LLM-Wiki bookkeeping helper + playbook) — the
                # Librarian profile drives it against the vault's raw/ + wiki/ subtrees.
                mkdir -p /opt/data/skills/wiki/scripts
                cp -f /seed-skills-wiki/SKILL.md /opt/data/skills/wiki/SKILL.md
                cp -f /seed-skills-wiki/wiki.py /opt/data/skills/wiki/scripts/wiki.py
                chmod +x /opt/data/skills/wiki/scripts/wiki.py
          # One-time install of the `claude` CLI onto the PVC for the escalation
          # skill. Lands in /opt/data/.local/bin (already on $PATH) so no PATH
          # override is needed. Idempotent: skips if already present, so only
          # the first boot pulls from npm (needs the world:443 egress in the CNP).
          claude-cli-install:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.9.14
            command:
              - sh
              - -c
              - test -x /opt/data/.local/bin/claude || npm install -g --prefix /opt/data/.local --cache /tmp/.npm @anthropic-ai/claude-code
        containers:
          app:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.9.14
            # The image ENTRYPOINT (/init → main-wrapper.sh) MUST stay PID 1
            # for s6-overlay; only override CMD.
            args: ["gateway", "run"]
            env:
              HERMES_HOME: /opt/data
              HERMES_UID: "10000"
              HERMES_GID: "10000"
              # In-cluster OpenAI-compatible API server (health + reachability
              # for later consumers). Binds 0.0.0.0 but pod-network only — no
              # public HTTPRoute. API_SERVER_KEY (from the secret) is mandatory:
              # an unauthenticated Hermes API server was an entry point for the
              # June-2026 agent-backdoor campaign.
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: 0.0.0.0
              # The driver has no --api-key, so any non-empty value satisfies
              # the OpenAI client. Real secrets come via envFrom below.
              OPENAI_API_KEY: sk-noauth-local-vllm
              # Same keyless-vLLM dummy for the `vllm` provider alias. The main
              # inference loop resolves its key via OPENAI_API_KEY, but the
              # auxiliary / context-compression client resolves the alias's OWN
              # env var (VLLM_API_KEY) and hard-fails without it ("Provider
              # 'vllm' is set but no API key was found") — which aborts context
              # compression mid-session. Keyless endpoint ignores the value.
              VLLM_API_KEY: sk-noauth-local-vllm
              # Kanban dashboard — the bundled s6 service (UI + /api/plugins/
              # kanban/* + /events WS) on :9119. It is already supervised by
              # /init; this flag brings it up. A non-loopback bind REQUIRES an
              # auth provider (a June-2026 hardening SystemExits otherwise), so
              # HERMES_DASHBOARD_BASIC_AUTH_{USERNAME,PASSWORD} arrive via envFrom
              # from hermes-secret; the board HTTPRoute is additionally fronted by
              # Authelia (defense in depth, admin-tier group:lldap_admin).
              HERMES_DASHBOARD: "true"
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_PORT: "9119"
              # LightRAG knowledge-graph endpoint for the query/ingest skill and
              # the pre_llm_call auto-RAG hook. LIGHTRAG_API_KEY comes via envFrom.
              LIGHTRAG_URL: http://lightrag.ai.svc.cluster.local:9621
              # The materialised Obsidian vault (the `claude` DB), synced by the
              # vault-bridge sidecar. Hermes' note-taking/obsidian skill reads &
              # writes markdown here (also the substrate for the LLM-Wiki flow).
              OBSIDIAN_VAULT_PATH: /vault
            envFrom:
              - secretRef:
                  name: hermes-secret
              # LightRAG API key (isolated ExternalSecret) — LIGHTRAG_API_KEY.
              - secretRef:
                  name: hermes-lightrag-secret
            probes:
              # TCP on the API server port — the API server binds :8642 once
              # the gateway is up. Generous startup budget for the s6 init +
              # chown + gateway warmup on a fresh volume.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8642
                  initialDelaySeconds: 90
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8642
                  initialDelaySeconds: 45
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8642
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext:
              # See the pod comment: root-required s6 image. s6-setuidgid needs
              # SETUID/SETGID/CHOWN from the default cap set, so do NOT drop
              # ALL; rootfs stays writable for s6 /run state. This is the
              # documented deviation, not the baseline.
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 4Gi
          # vault-bridge — the official Self-hosted LiveSync CLI (same author +
          # core as the Obsidian plugin) in `daemon` mode: continuously
          # replicates the `claude` CouchDB DB <-> the local filesystem via the
          # _changes feed, materialising the vault as files the agent reads/writes.
          # CouchDB stays the source of truth; the laptop is the canonical editor.
          # Single pod → the RWO vault PVC is shared with the app container.
          vault-bridge:
            image:
              repository: ghcr.io/vrtmrz/livesync-cli
              tag: 1.0.30-cli
            # Entrypoint prepends LIVESYNC_DB_PATH as argv[1], so args become:
            #   /db --settings /config/settings.json --vault /vault daemon
            args:
              - --settings
              - /config/settings.json
              - --vault
              - /vault
              - daemon
            env:
              LIVESYNC_DB_PATH: /db
              TZ: America/New_York
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: hermes
        ports:
          http:
            port: 8642
          # Bundled Kanban dashboard s6 service (board.${SECRET_DOMAIN} route).
          dashboard:
            port: 9119
    persistence:
      # The materialised Obsidian vault (the `claude` DB) — ceph-block, shared
      # RWO between the app (reads/writes markdown at /vault) and vault-bridge
      # (LiveSync materialises files at /vault, PouchDB local db at /db).
      vault:
        existingClaim: hermes-vault-data
        advancedMounts:
          hermes:
            app:
              - path: /vault
                subPath: vault
            vault-bridge:
              - path: /vault
                subPath: vault
              - path: /db
                subPath: db
      # LiveSync settings.json (couchDB creds templated) → vault-bridge only.
      vault-bridge-config:
        type: secret
        name: hermes-vault-bridge-secret
        advancedMounts:
          hermes:
            vault-bridge:
              - path: /config
                readOnly: true
      # The single source of truth for all Hermes state (SQLite, config, .env,
      # profiles, skills, memories, sessions) — mounted into both the seed init
      # container and the app.
      data:
        existingClaim: hermes-data
        advancedMounts:
          hermes:
            config-seed:
              - path: /opt/data
            claude-cli-install:
              - path: /opt/data
            app:
              - path: /opt/data
      # The operator-managed config.yaml, mounted read-only into the seed init
      # container only (it copies it onto the data volume every start).
      config-seed:
        type: configMap
        name: hermes-config
        advancedMounts:
          hermes:
            config-seed:
              - path: /seed
                readOnly: true
      # Per-profile seed files (operator-owned config.yaml + one-time SOUL.md),
      # mounted read-only into the seed init container only. It places them under
      # /opt/data/profiles/<name>/ (config cp -f, identity cp -n).
      profiles-seed:
        type: configMap
        name: hermes-profiles
        advancedMounts:
          hermes:
            config-seed:
              - path: /seed-profiles
                readOnly: true
      # LightRAG skill seed files (SKILL.md + query.py + ingest.py), placed onto
      # /opt/data/skills/lightrag/ by the seed init container.
      skills-seed:
        type: configMap
        name: hermes-skills-lightrag
        advancedMounts:
          hermes:
            config-seed:
              - path: /seed-skills
                readOnly: true
      # Wiki skill seed files (SKILL.md + wiki.py), placed onto
      # /opt/data/skills/wiki/ by the seed init container.
      skills-wiki-seed:
        type: configMap
        name: hermes-skills-wiki
        advancedMounts:
          hermes:
            config-seed:
              - path: /seed-skills-wiki
                readOnly: true
      # The fail-closed pre_tool_call gate, mounted READ-ONLY at /opt/hooks —
      # physically outside the writable /opt/data PVC, so the agent cannot
      # rewrite its own gate (config.yaml references python3 /opt/hooks/gate.py).
      hooks:
        type: configMap
        name: hermes-hooks
        advancedMounts:
          hermes:
            app:
              - path: /opt/hooks
                readOnly: true
    externalSecrets:
      hermes:
        forceRename: hermes
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: hermes-secret
          creationPolicy: Owner
        data:
          # Claude MAX subscription OAuth (output of `claude setup-token`, ~1yr).
          # Subscription only — never an API key (Rob's hard constraint). Consumed
          # by the claude-code escalation skill (wired in PR-4). Its OWN 1P item
          # (`hermes`), deliberately NOT the shared `claude-runner` item, so the
          # claude-runner teardown can't break Hermes.
          - secretKey: CLAUDE_CODE_OAUTH_TOKEN
            remoteRef:
              key: hermes
              property: claude_code_oauth_token
          # Auth key for Hermes' in-cluster OpenAI-compatible API server (:8642).
          # Mandatory whenever the API server binds beyond loopback — an
          # unauthenticated Hermes API server was an entry point for the June-2026
          # agent-backdoor campaign, so this is never optional.
          - secretKey: API_SERVER_KEY
            remoteRef:
              key: hermes
              property: api_server_key
          # NOTE: LIGHTRAG_API_KEY is a SEPARATE ExternalSecret below (own target
          # secret) — the `lightrag` 1P item exposes its key only via
          # `extract`/`{{ .api_key }}` (a direct `property: api_key` lookup errors and
          # would fail this whole ES). Dashboard basic-auth is NOT a secret here — it's
          # a hashed value in config.yaml (dashboard.basic_auth, behind Authelia).
      # LightRAG API key, ISOLATED in its own Secret so a provider hiccup on the
      # `lightrag` 1P item can never fail the main hermes-secret. Same `extract` +
      # `{{ .api_key }}` mechanism the lightrag app's own ExternalSecret uses (a direct
      # `property: api_key` remoteRef errors — the field is only reachable via extract).
      hermes-lightrag:
        forceRename: hermes-lightrag
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: hermes-lightrag-secret
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              LIGHTRAG_API_KEY: "{{ .api_key }}"
        dataFrom:
          - extract:
              key: lightrag
      # LiveSync vault-bridge settings.json (couchDB creds templated in). Mirrors the
      # retired claude-runner's proven vault-bridge. encrypt:false — the `claude` DB is
      # not E2EE (its doc IDs are plaintext paths), so no passphrase. CouchDB is the
      # source of truth; the laptop stays the canonical editor.
      hermes-vault-bridge:
        forceRename: hermes-vault-bridge
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: hermes-vault-bridge-secret
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              settings.json: |-
                {
                  "couchDB_URI": "http://obsidian-couchdb.collab.svc.cluster.local:5984",
                  "couchDB_USER": "{{ .couchdb_username }}",
                  "couchDB_PASSWORD": "{{ .couchdb_password }}",
                  "couchDB_DBNAME": "claude",
                  "encrypt": false,
                  "passphrase": "",
                  "liveSync": true,
                  "syncOnSave": true,
                  "syncOnStart": true,
                  "usePluginSync": false,
                  "isConfigured": true
                }
        dataFrom:
          - extract:
              key: obsidian
    networkpolicies:
      allow:
        type: cilium
        forceRename: hermes-allow
        # Explicit endpointSelector preserves the pre-inline selector
        # instead of the chart's controller-derived default, keeping the
        # policy byte-identical across the migration.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: hermes
        # Additive — the ai namespace default-deny triggers the lockdown; these
        # rules punch holes. DNS egress is provided cluster-wide by the baseline
        # network-policy component, so it is not repeated here.
        enableDefaultDeny:
          egress: false
          ingress: false
        egress:
          # Primary model: the vLLM reasoning/driver LLM on the Spark. Hermes runs
          # the local execution loop against this endpoint — zero Anthropic quota.
          # The driver's own cnp-allow adds the matching ingress entry for hermes.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: vllm-driver-spark
            toPorts:
              - ports:
                  - port: "8000"
                    protocol: TCP
          # LightRAG knowledge-graph API (:9621) — the query/ingest skill and the
          # pre_llm_call auto-RAG hook. Same-namespace endpoint; auth is the X-API-Key.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: lightrag
            toPorts:
              - ports:
                  - port: "9621"
                    protocol: TCP
          # Full lovenet-gateway MCP broker (all tools) for every agent — the
          # mcp-gateway in mcp-system on :8080. The mcp-gateway pod's own CNP only
          # admits the istio gateway, which fronts the broker and admits
          # `fromEntities:[cluster]` on :8080; this egress is what lets hermes reach it.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          # Obsidian vault sync — the vault-bridge LiveSync sidecar → obsidian-couchdb
          # (collab ns) :5984. The couchdb side re-adds the matching ingress for hermes
          # (its rule was removed when claude-runner was retired). Label is
          # `obsidian-couchdb` (not `couchdb`).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: collab
                  app.kubernetes.io/name: obsidian-couchdb
            toPorts:
              - ports:
                  - port: "5984"
                    protocol: TCP
          # OTel gateway-health-export → the in-cluster OpenTelemetry Collector on
          # :4318 (OTLP/HTTP). Carries redacted health/diagnostic/warning-error spans
          # only — content-free by construction (no prompts/messages/tool args). The
          # collector's own CNP admits fromEntities:[cluster], so only this egress
          # hole is needed; the collector tags every span with pod metadata.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: observability
                  app.kubernetes.io/name: opentelemetry-collector
            toPorts:
              - ports:
                  - port: "4318"
                    protocol: TCP
          # External HTTPS for (a) the claude-code escalation skill → api.anthropic.com
          # (draws Rob's Max subscription) and (b) the one-time npm install of the
          # `claude` CLI onto the PVC. toEntities:[world]:443 is the cluster's reliable
          # external-egress pattern — Cilium 1.19 toFQDNs.matchPattern is limited here
          # (see project_cilium_matchpattern_fqdn_limits; actions-runner uses the same
          # world:443 rule). The fine-grained exfil control is the fail-closed
          # pre_tool_call gate (blocks credential + restricted-tier content in tool
          # args), not the CNP; tightening this to toFQDNs is a hardening follow-up.
          - toEntities: [world]
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
        ingress:
          # Blackbox-exporter health probe → /health on :8642 (unauthenticated).
          # Without this the hermes-health probe is a silent default-deny drop and
          # probe_success never populates — the #13264 label trap. The label is
          # `prometheus-blackbox-exporter`, NOT `blackbox-exporter`.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: observability
                  app.kubernetes.io/name: prometheus-blackbox-exporter
            toPorts:
              - ports:
                  - port: "8642"
                    protocol: TCP
          # Internal gateway (envoy) → the board dashboard (:9119, Authelia-fronted)
          # and the api_server / peer endpoint (:8642, bearer-key). Without this the
          # board + hermes-api HTTPRoutes resolve but Cilium default-denies the
          # gateway→backend hop, so Envoy returns "503 upstream connection timeout".
          # Same pattern as ai/khoj. Auth is enforced at the gateway (Authelia) and by
          # the api_server's own bearer key — the CNP only opens the network path.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "9119"
                    protocol: TCP
                  - port: "8642"
                    protocol: TCP
