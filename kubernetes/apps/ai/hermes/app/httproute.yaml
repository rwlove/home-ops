---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
#
# Kanban dashboard UI (the bundled s6 service on :9119). Fronted by Authelia
# via securitypolicy.yaml (admin-tier, group:lldap_admin) — the same extAuth
# pattern as ai/khoj. The dashboard ALSO enforces its own basic-auth, so this
# is defense in depth.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-board
  annotations:
    glance/name: "Hermes Board"
    glance/show: "true"
    glance/id: "AI"
spec:
  hostnames:
    - board.${SECRET_DOMAIN}
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: hermes
          port: 9119
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
#
# Hermes OpenAI-compatible API server / peer endpoint (:8642). This route is
# how the off-cluster beast gateway peers in (`hermes peer add in-cluster
# https://hermes-api.${SECRET_DOMAIN}`). Deliberately NOT Authelia-gated — a bot
# can't do interactive auth; the api_server enforces its own bearer API_SERVER_KEY
# (mandatory, from the hermes ExternalSecret). Internal gateway = LAN-only via
# split-horizon DNS; no public exposure.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-api
spec:
  hostnames:
    - hermes-api.${SECRET_DOMAIN}
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: hermes
          port: 8642
