# Hermes Agent config — mounted READ-ONLY from the hermes-config ConfigMap at
# /opt/data/config.yaml (PR-4 moved this off the writable PVC). Read-only is
# deliberate: the `hooks.pre_tool_call` gate below is the security floor, and
# an agent that could rewrite its own config could disable its own gate. So
# config is operator-owned + declarative here; Hermes still owns the rest of
# /opt/data (sessions, memory, self-authored skills). Personal identity
# (SOUL.md / USER.md / MEMORY.md) is hand-placed on the PVC, never committed.
# Secrets (OPENAI_API_KEY dummy, CLAUDE_CODE_OAUTH_TOKEN, API_SERVER_KEY)
# arrive via env from the hermes ExternalSecret, never here.
model:
  # The vLLM reasoning/driver model on the Spark. provider "vllm" is an
  # alias for "custom" (any OpenAI-compatible endpoint); base_url selects it.
  default: qwen3.6-35b-a3b
  provider: vllm
  base_url: http://vllm-driver-spark.ai.svc.cluster.local:8000/v1
  # Local server — /v1/models auto-detect is unreliable, so pin the window
  # to the driver's --max-model-len.
  context_length: 131072
  # REQUIRED: the driver runs --tool-call-parser qwen3_xml + --reasoning-parser
  # qwen3, which leaks tool calls into plain text under streaming (Hermes
  # #72901). The entire local execution loop depends on real tool_calls.
  streaming: false
auxiliary:
  # Never reach for a paid fallback model (OpenRouter/Nous) for auxiliary
  # tasks — the whole point is zero-Anthropic-quota ambient work.
  free_only: true
  # Context compression on the same local model.
  compression:
    provider: vllm
    base_url: http://vllm-driver-spark.ai.svc.cluster.local:8000/v1
    model: qwen3.6-35b-a3b
  # Board decomposition + profile auto-descriptions run on the local model too
  # (zero Anthropic quota — the board's planning is local, not escalated).
  kanban_decomposer:
    provider: vllm
    base_url: http://vllm-driver-spark.ai.svc.cluster.local:8000/v1
    model: qwen3.6-35b-a3b
  profile_describer:
    provider: vllm
    base_url: http://vllm-driver-spark.ai.svc.cluster.local:8000/v1
    model: qwen3.6-35b-a3b
  # vision aux deferred — the driver is text-only.
agent:
  # Hermes' native control is a fail-OPEN denylist; the fail-CLOSED gate is the
  # pre_tool_call hook below. Keep arbitrary web disabled (egress + exfil
  # surface) — escalation to Claude goes through the gated `terminal` path.
  disabled_toolsets:
    - web
# Expose the Kanban board tools to the api_server (peer) agent so beast can
# create and route cards over the peer path. BOTH keys are required — verified
# end-to-end live (beast peer → card created on the in-cluster board):
#   • platform_toolsets registers the `kanban` toolset on the api_server platform
#     (its default `hermes-api-server` set excludes every kanban_* tool);
#   • the top-level `toolsets` list satisfies the kanban tools' own check_fn
#     (_profile_has_kanban_toolset → "kanban" in config.toolsets), which gates
#     kanban_* for non-worker agents. platform_toolsets ALONE is not enough.
platform_toolsets:
  api_server:
    - hermes-cli
    - kanban
toolsets:
  - kanban
# The security floor: a fail-closed pre_tool_call gate scoped to the `terminal`
# tool (the coding-agent shell-out to `claude -p` and any shell command).
# gate.py is mounted READ-ONLY at /opt/hooks (outside the writable PVC), so the
# agent cannot rewrite it. fail_closed: true means a timeout/error/exit-2 all
# BLOCK the tool — a bug in the gate denies rather than opening. It refuses
# --dangerously-skip-permissions, blocks credential exfil, and runs the
# escalation redaction (restricted-tier content never serialized to claude -p).
hooks:
  pre_tool_call:
    - matcher: "terminal"
      command: "python3 /opt/hooks/gate.py"
      timeout: 10
      fail_closed: true
  # Auto-RAG: inject relevant LightRAG knowledge-graph context into LOCAL turns.
  # Fail-safe (any error/slow → no-op, never breaks a turn) and bounded (~3k
  # tokens). Runs only on Hermes turns, NOT on `claude -p` (a separate CLI), so
  # the KG content stays local; gate.py additionally refuses the LIGHTRAG-KG
  # sentinel in any claude -p command (L2 #1: local yes, Claude no).
  pre_llm_call:
    - command: "python3 /opt/hooks/lightrag-rag.py"
      timeout: 12
# Interactive front door. Unattended/cron lanes (deny by default) come later.
cron_mode: false
unattended_mode: false
single_query_mode: false
# Peer→named-profile routing: `peer run in-cluster/<profile>` is served by that
# profile (via /p/<profile>/). REQUIRED for beast to reach the `orchestrator`
# profile — without it the api_server ignores the selector and card creation
# over the peer path silently no-ops.
multiplex_profiles: true
# Kanban delegation board. The dispatcher runs in THIS gateway (single owner),
# atomically claims `ready` cards, and spawns the assigned worker profile as a
# local process on the 35B. Human-in-the-loop: a worker `kanban_block`s a
# destructive/ambiguous step and Rob clears it from the dashboard (L2 #3).
kanban:
  dispatch_in_gateway: true
  orchestrator_profile: orchestrator
  default_assignee: generalist
  auto_decompose: true
  auto_decompose_per_tick: 5
  dispatch_interval_seconds: 60
  failure_limit: 2
  # Reclaim a `running` card whose worker died (pod restart kills worker child
  # processes; PID reuse can mask the death) after 30m instead of the 4h default
  # — adversarial durability finding FM-1.
  dispatch_stale_timeout_seconds: 1800
  reconcile_orphans: true
  # Bounded fan-out: workers are real processes under the pod's 4Gi limit and
  # the dispatch cap reads host MemTotal not the cgroup, so pin it low (FM-3).
  max_in_progress: 2
  max_in_progress_per_profile: 1
  review_dispatch: true
  auto_subscribe_on_create: true
# Dashboard (the bundled board UI on :9119). This Hermes version reads basic-auth
# from HERE (not the HERMES_DASHBOARD_BASIC_AUTH_* env PR-1 tried, which this
# build ignores → the service SystemExit'd and nothing listened on :9119). The
# board HTTPRoute is ALSO Authelia-gated (admin group), so this basic-auth is a
# second factor, not the primary gate. password_hash is a scrypt hash (one-way);
# every `$` is escaped `$$` so Flux envsubst passes it through intact.
dashboard:
  public_url: https://board.${SECRET_DOMAIN}
  basic_auth:
    username: rob
    password_hash: "scrypt$$16384$$8$$1$$d3VnR54RVLvjyd6M2RFG+w==$$dUa0TH3Q14pNobwL9KWvt13N5KKe2Gs33vxydWhsj+Q="
# Full lovenet-gateway MCP broker — ALL its tools (kubectl_*, ha_*, omada_*,
# netbox_*, immich_*, arr_*, prom_*, grafana_*, esphome_*, music_assistant_*,
# comfyui_*, paperless_*, chrome_*, …) available to EVERY agent (Rob: full access
# to all agents, interactive + unattended). The internal endpoint needs no auth
# (auth is only at the external Authelia gateway); tools.include: [] = all.
#
# SECURITY NOTE (accepted): MCP tool calls are NOT covered by the pre_tool_call
# gate (it matches `terminal` only), so this is an UNGATED mutating surface
# (kubectl_delete, omada/network, ha control…). The behavioral guardrail is the
# kanban human-in-the-loop (a worker `kanban_block`s a destructive step → Rob
# clears it) plus each profile's SOUL prime directive.
mcp_servers:
  lovenet-gateway:
    # The `mcp-gateway` service selects the app pod (its CNP admits only the
    # istio gateway → hermes drops). Use `mcp-gateway-istio` — the istio gateway
    # that fronts the broker and admits fromEntities:[cluster] on :8080.
    url: "http://mcp-gateway-istio.mcp-system.svc.cluster.local:8080/mcp"
    enabled: true
    connect_timeout: 30
    timeout: 120
    tools:
      include: []
      exclude: []
