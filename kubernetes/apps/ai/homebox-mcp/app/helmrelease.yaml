---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homebox-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    controllers:
      homebox-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        type: deployment
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/rwlove/mcp-openapi-proxy
              tag: v0.4.0@sha256:23906c73b605b7d464c21194bb0a4a017b59d464828d332cdd5e44f4970c841e
            # Generic OpenAPI->MCP bridge over SSE (GET/POST /mcp, binds
            # 0.0.0.0:8080). --spec is the hand-authored HomeBox subset baked in
            # via the configMap below; --base-url overrides the spec's server to
            # the in-cluster service. The Authorization: Bearer header is
            # injected into every upstream request via REQUEST_HEADERS (from the
            # secret). Bound by the `vila` agent.
            env:
              TZ: America/New_York
              OPENAPI_SPEC_URL: file:///spec/homebox.json
              SERVER_URL_OVERRIDE: http://homebox.selfhosted.svc.cluster.local:7745
            # REQUEST_HEADERS=Authorization:Bearer <token> from 1P via the
            # ExternalSecret. NOTE: HomeBox's /users/login token is
            # session-scoped and will expire; this `token` field MUST be a
            # long-lived HomeBox API token. Confirm HomeBox exposes one when
            # seeding the 1P item; if it only issues session tokens, this bridge
            # needs a login-refresh sidecar instead (the laptop vila persona,
            # which logs in per-session via curl, is unaffected).
            envFrom:
              - secretRef:
                  name: homebox-mcp-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: homebox-mcp
        ports:
          http:
            port: *port
    persistence:
      # Hand-authored OpenAPI spec (configMapGenerator in kustomization.yaml).
      spec:
        type: configMap
        name: homebox-mcp-spec
        advancedMounts:
          homebox-mcp:
            app:
              - path: /spec/homebox.json
                subPath: homebox.json
                readOnly: true
      # godotenv probes <specdir>/.env on start; give it a writable tmp and keep
      # the root filesystem read-only.
      tmp:
        type: emptyDir
        advancedMounts:
          homebox-mcp:
            app:
              - path: /tmp
    externalSecrets:
      homebox-mcp:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: homebox-mcp-secret
          template:
            data:
              # matthewhand sends Authorization: Bearer <API_KEY> by default.
              API_KEY: "{{ .token }}"
        dataFrom:
          - extract:
              key: homebox
    networkpolicies:
      allow:
        type: cilium
        forceRename: homebox-mcp-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: homebox-mcp
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # mcp-gateway federation: the Kuadrant broker (mcp-gateway app pod,
          # mcp-system) dials this backend directly over Service DNS to serve the
          # federated tools. ai is default-deny; backend-ingress half of the
          # cross-ns pattern (#15826). No istio-egress (dead, #15834).
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  app.kubernetes.io/name: mcp-gateway
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          # Legacy kagent direct dial (ai ns) — retired at Stage 2.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        egress:
          # -> HomeBox in the selfhosted ns (spec fetch + tool calls), :7745.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: selfhosted
                  app.kubernetes.io/name: homebox
            toPorts:
              - ports:
                  - port: "7745"
                    protocol: TCP
