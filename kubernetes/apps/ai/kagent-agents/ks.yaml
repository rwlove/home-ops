---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kagent-agents
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: ai
  # Path is relative to the PRIVATE Forgejo source (windmill/kagent-agents),
  # not this GitHub repo. sourceRef below is re-asserted by the exclusion
  # patch in kubernetes/flux/cluster/ks.yaml.
  path: ./agents
  interval: 1h
  timeout: 5m
  wait: true
  sourceRef:
    kind: GitRepository
    name: kagent-agents
    namespace: flux-system
  dependsOn:
    - name: kagent
