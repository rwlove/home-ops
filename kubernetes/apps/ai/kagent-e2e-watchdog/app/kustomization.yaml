---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./prometheusrule.yaml
  - ./servicemonitor.yaml
configMapGenerator:
  - name: kagent-e2e-watchdog
    files:
      - kagent_e2e_watchdog.py=./resources/kagent_e2e_watchdog.py
generatorOptions:
  disableNameSuffixHash: true
