---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-evals-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kagent-evals
  # Additive — the ai ns default-deny is what locks down; DNS/apiserver come from the
  # baseline allows. This adds the two hops the exporter needs.
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    # GitHub search API (api.github.com) — a canonical FQDN behind a CDN; Cilium
    # matchPattern FQDN rules are unreliable there (see project_cilium_matchpattern_fqdn_limits),
    # so this collapses to world:443 like the other external-HTTPS callers in ai.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  ingress:
    # Prometheus (observability) scrapes /metrics on :8080 via the ServiceMonitor.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
