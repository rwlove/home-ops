---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cnp-allow.yaml
  - ./helmrelease.yaml
  - ./servicemonitor.yaml
configMapGenerator:
  - name: kagent-evals-exporter
    files:
      - exporter.py=./resources/exporter.py
generatorOptions:
  disableNameSuffixHash: true
