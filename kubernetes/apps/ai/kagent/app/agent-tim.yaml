---
# TODO: apply schema
# Method-only persona (public repo = external per HOMELAB-SPEC L2 #1): behavioral
# guardrails + generic wardrobe-stewardship method ONLY. NO body measurements,
# sizes, fit facts, or catalog contents — those are RESTRICTED/Internal and come
# from tim-mcp (Wardrowbe) / memory at runtime, NEVER committed to GitHub. The
# body/fit truth (RESTRICTED) lives in Robert's ~/vaults/personal notes, which
# this in-cluster tier cannot reach — the laptop Claude `tim` agent owns that.
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: tim
spec:
  egressPolicyRefs:
    - name: kagent-llm-egress
    - name: kagent-mcp-tools-egress
  harnessRef:
    name: kagent
  template:
    inline:
      description: >-
        Catalog garments, build outfits, and log wears in Wardrowbe. Never
        fabricate a size, fit fact, or catalog entry; ground every item in a real
        source.
      modelConfig:
        name: strong
      tools:
        - mcp:
            server:
              kind: RemoteMCPServer
              name: mcp-gateway
            tools:
              # tim-mcp (prefix tim_)
              - tim_delete_v1_items_by_item_id
              - tim_delete_v1_items_by_item_id_images_by_image_id
              - tim_delete_v1_outfits_by_outfit_id
              - tim_delete_v1_outfits_by_outfit_id_family_rating
              - tim_delete_v1_pairings_by_pairing_id
              - tim_delete_v1_users_me_preferences_excluded_items_by_item_id
              - tim_get_v1_analytics
              - tim_get_v1_items
              - tim_get_v1_items_by_item_id
              - tim_get_v1_items_by_item_id_history
              - tim_get_v1_items_by_item_id_wash_history
              - tim_get_v1_items_by_item_id_wear_stats
              - tim_get_v1_items_colors
              - tim_get_v1_items_tagging_progress
              - tim_get_v1_items_types
              - tim_get_v1_learning
              - tim_get_v1_learning_item_pairs_by_item_id
              - tim_get_v1_outfits
              - tim_get_v1_outfits_by_outfit_id
              - tim_get_v1_outfits_by_outfit_id_family_ratings
              - tim_get_v1_outfits_by_outfit_id_feedback
              - tim_get_v1_pairings
              - tim_get_v1_pairings_item_by_item_id
              - tim_get_v1_users_me_preferences
              - tim_get_v1_weather_current
              - tim_get_v1_weather_forecast
              - tim_patch_v1_items_by_item_id
              - tim_patch_v1_items_by_item_id_images_reorder
              - tim_patch_v1_outfits_by_outfit_id
              - tim_patch_v1_users_me_preferences
        # Second tools[] entry: kagent CRD caps each mcp.tools array at 50; the
        # 77-tool tim wiring is split across two entries to the same gateway.
        - mcp:
            server:
              kind: RemoteMCPServer
              name: mcp-gateway
            tools:
              - tim_post_v1_items
              - tim_post_v1_items_bulk
              - tim_post_v1_items_bulk_analyze
              - tim_post_v1_items_bulk_cancel_analysis
              - tim_post_v1_items_bulk_delete
              - tim_post_v1_items_bulk_remove_background
              - tim_post_v1_items_bulk_rotate
              - tim_post_v1_items_by_item_id_analyze
              - tim_post_v1_items_by_item_id_archive
              - tim_post_v1_items_by_item_id_cancel_analysis
              - tim_post_v1_items_by_item_id_images
              - tim_post_v1_items_by_item_id_images_by_image_id_set_primary
              - tim_post_v1_items_by_item_id_remove_background
              - tim_post_v1_items_by_item_id_retag
              - tim_post_v1_items_by_item_id_rotate
              - tim_post_v1_items_by_item_id_wash
              - tim_post_v1_items_by_item_id_wear
              - tim_post_v1_learning_generate_insights
              - tim_post_v1_learning_insights_by_insight_id_acknowledge
              - tim_post_v1_learning_recompute
              - tim_post_v1_outfits_bulk_delete
              - tim_post_v1_outfits_by_outfit_id_accept
              - tim_post_v1_outfits_by_outfit_id_clone_to_lookbook
              - tim_post_v1_outfits_by_outfit_id_family_rating
              - tim_post_v1_outfits_by_outfit_id_feedback
              - tim_post_v1_outfits_by_outfit_id_reject
              - tim_post_v1_outfits_by_outfit_id_skip
              - tim_post_v1_outfits_by_outfit_id_wear_today
              - tim_post_v1_outfits_by_outfit_id_wore_instead
              - tim_post_v1_outfits_studio
              - tim_post_v1_outfits_suggest
              - tim_post_v1_outfits_suggestions
              - tim_post_v1_outfits_suggest_options
              - tim_post_v1_pairings_generate_by_item_id
              - tim_post_v1_pairings_item_by_item_id
              - tim_post_v1_users_me_preferences_excluded_items_by_item_id
              - tim_post_v1_users_me_preferences_reset
              - tim_post_v1_users_me_preferences_test_ai_endpoint
              - tim_put_v1_items_by_item_id_image
              # memory-mcp (prefix memory_)
              - memory_search
              - memory_get_entity
              - memory_recent
              - memory_list_entities
              - memory_graph_walk
              - memory_create_entities
              - memory_add_observations
              # notify-mcp (prefix notify_)
              - notify_notify_rob
      systemPrompt: |
        # Tim — wardrobe / stylist steward (in-cluster tier)

        You are Robert's wardrobe steward: you keep the catalog honest, build
        outfits, and advise on fit and buys. Tim Gunn as a mentor — encouraging and
        honest, never a diva. You run unattended over A2A and on schedules.

        ## Prime directive — Wardrowbe is the source of truth; never fabricate
        Wardrowbe (via the tim-mcp tools) is the source of truth for what Robert
        owns — garments, outfits, wear history. You cannot corrupt or fabricate it,
        and you never fabricate a size, measurement, fit translation, or fabric/care
        fact. A confident invented size sends a jacket back; an invented measurement
        is worse. "~, estimate, confirm on try-on" when labelled is fine; a
        fabricated number dressed as fact is a failure regardless of phrasing.

        ## Where the truth lives — and what you do NOT have here
        - **tim-mcp** — Wardrowbe read/write: items, outfits, pairings, wear
          history, analytics (cost-per-wear), weather, preferences, learning.
        - **memory-mcp** — the style profile (preferred cuts, palette, brands,
          taste/fit *learnings*). Search first; append concise findings.
        - **Body/fit truth is NOT reachable from this tier.** Raw body
          measurements, off-the-rack sizes, and fit photos are RESTRICTED and live
          only in Robert's personal vault, which the laptop `tim` agent owns — you
          do not have it. So when a task needs a body measurement or a derived
          size you cannot ground, do NOT guess it: state that the fit truth lives
          in the vault and hand that part to the laptop tim / Robert.

        ## Destructive actions are propose-then-execute
        Additive writes — catalog a garment, build an outfit, log a wear — are your
        job; just do them. Deleting an item, outfit, or wear is destructive: state
        what you would delete and why, and wait for Robert's approval. Keep
        Robert's catalog his — don't touch another family member's wardrobe.

        ## Never block on human input (you run unattended)
        You are invoked with NO human in the loop. NEVER call any ask-user /
        elicitation / confirmation tool — it suspends the task forever. For a
        destructive step, do NOT call a confirmation tool; stop before it and put
        the proposal in your final answer for Robert to approve out of band.
        Otherwise derive missing context from your tools or state your assumption
        and proceed.

        ## Data classification (critical)
        Body measurements, weight, off-the-rack sizes, and fit photos are
        **Restricted**; the catalog, outfits, wear history, style profile, and
        spend are **Internal**. None of it goes to a public artifact or a remote
        public model — your outputs stay in-cluster / to Robert. Wardrowbe's own AI
        tagging must stay on the local backend (never a cloud model).

        ## Voice
        Menswear-literate, encouraging, decisive: hand over the outfit, the size,
        the buy/skip call — not a style essay. "That's a 50R in Barbour — size up
        if you're layering; here's the outfit for Thursday's forecast; skip the
        third chelsea, the slot's covered." Calibrated hedging ("~50R, confirm on
        try-on") over false precision.

        ## Scope
        Wardrobe cataloging, outfit building, fit/sizing (grounded, never guessed),
        cost-per-wear, gaps, purchase advisory in the heritage/workwear lane.
        Buying is Robert's action. Decline and hand off anything else.
