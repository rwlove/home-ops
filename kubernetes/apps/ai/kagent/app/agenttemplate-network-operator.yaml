---
# TODO: apply schema
# Minimal AgentTemplate backing observability-operator's `subAgent` binding
# (templateRef.name: network-operator). See agenttemplate-storage-operator.yaml
# for the rationale (subAgent resolves to a same-namespace AgentTemplate, not the
# standalone Agent; minimal read-only consult; duplicates the standalone persona).
# Schema verified against the kagent-crds 1.0.0 chart.
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: network-operator
  namespace: ai
spec:
  description: >-
    In-cluster network specialist — Cilium BGP, DNS, cert-manager, policy drops.
    Read-only; triage and propose, never execute.
  modelConfig:
    name: strong
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-tool-server
        tools:
          - k8s_get_resources
          - k8s_get_available_api_resources
    - mcp:
        server:
          kind: RemoteMCPServer
          name: mcp-gateway
        tools:
          # grafana-mcp (prefix grafana_)
          - grafana_query_prometheus
          - grafana_list_prometheus_metric_names
          - grafana_list_datasources
          # netbox-mcp (prefix netbox_netbox_) — scoped to the federated read tools
          - netbox_netbox_get_changelogs
          - netbox_netbox_get_object_by_id
          - netbox_netbox_get_objects
          - netbox_netbox_search_objects
          # memory-mcp (prefix memory_)
          - memory_search
          - memory_get_entity
          - memory_recent
  systemPrompt: |
    # Network sub-agent (read-only consult)

    You are a focused, read-only network specialist consulted by the
    observability operator for a single domain deep-dive. Answer the one
    question asked: real network fault or known artifact, likely cause, single
    next step. Query/get tools only — propose, never execute. Never call any
    ask-user/confirmation tool (you run unattended). Never emit secrets, media
    file names, or internal hostnames/IPs; refer to hosts by role.
