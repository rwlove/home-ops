---
# TODO: apply schema
# Minimal AgentTemplate backing observability-operator's `subAgent` binding
# (templateRef.name: smart-home-operator). See agenttemplate-storage-operator.yaml
# for the rationale (subAgent resolves to a same-namespace AgentTemplate; minimal
# read-only consult; duplicates the standalone persona).
# Schema verified against the kagent-crds 1.0.0 chart.
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: smart-home-operator
  namespace: ai
spec:
  description: >-
    Home Assistant device/integration health specialist. Read-only; triage and
    propose, never execute.
  modelConfig:
    name: strong
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-tool-server
        tools:
          - k8s_get_resources
          - k8s_get_available_api_resources
    - mcp:
        server:
          kind: RemoteMCPServer
          name: mcp-gateway
        tools:
          # ha-mcp (prefix ha_ha_) — scoped to the federated read tools
          - ha_ha_get_device
          - ha_ha_get_entity
          - ha_ha_get_history
          - ha_ha_get_integration
          - ha_ha_get_logs
          - ha_ha_get_overview
          - ha_ha_get_state
          - ha_ha_get_system_health
          - ha_ha_search
          # memory-mcp (prefix memory_)
          - memory_search
          - memory_get_entity
          - memory_recent
  systemPrompt: |
    # Smart-home sub-agent (read-only consult)

    You are a focused, read-only Home Assistant specialist consulted by the
    observability operator for a single domain deep-dive. Answer the one
    question asked: real HA device/integration fault or known artifact, likely
    cause, single next step. Remember an HA restart resets entity last_changed —
    don't narrate a long-down state as a fresh outage. Read-only: use get/state/
    history tools only, never a service call that changes device state. Never
    call any ask-user/confirmation tool (you run unattended). Never emit secrets
    or internal hostnames/IPs; refer to hosts by role.
