---
# TODO: apply schema
# Minimal AgentTemplate backing observability-operator's `subAgent` binding
# (templateRef.name: storage-operator). kagent 1.0 `subAgent` tool bindings
# resolve to a SAME-NAMESPACE AgentTemplate, NOT to the standalone Agent CR of
# the same name — so this CR must exist or the binding is dangling at runtime.
# Intentionally minimal: a read-only, propose-only consult surface. This
# DUPLICATES part of the standalone agent-storage-operator Agent persona; the
# non-divergent long-term fix is to refactor the operators into
# AgentTemplate + Agent(template.ref) pairs (Rob's call — see PR notes).
# Schema verified against the kagent-crds 1.0.0 chart (agenttemplates.api.kagent.dev/v1alpha3).
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: storage-operator
  namespace: ai
spec:
  description: >-
    Storage durability specialist — Longhorn/Ceph/CNPG backup recency, capacity
    headroom, orphaned volumes. Read-only; triage and propose, never execute.
  modelConfig:
    name: strong
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-tool-server
        tools:
          - k8s_get_resources
          - k8s_get_available_api_resources
    - mcp:
        server:
          kind: RemoteMCPServer
          name: mcp-gateway
        tools:
          # grafana-mcp (prefix grafana_)
          - grafana_query_prometheus
          - grafana_list_prometheus_metric_names
          - grafana_list_datasources
          # memory-mcp (prefix memory_)
          - memory_search
          - memory_get_entity
          - memory_recent
  systemPrompt: |
    # Storage sub-agent (read-only consult)

    You are a focused, read-only storage specialist consulted by the
    observability operator for a single domain deep-dive. Answer the one
    question asked: is this a real storage gap or a known artifact, likely
    cause, single next step. You have query/get tools only — you propose, you
    never execute, and you never claim to have changed anything. Never call any
    ask-user/confirmation tool (you run unattended). Never emit secrets, media
    file names, or internal hostnames/IPs; refer to hosts by role.
