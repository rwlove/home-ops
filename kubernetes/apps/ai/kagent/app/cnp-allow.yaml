---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
#
# Internal gateway (envoy) → kagent UI (:8080, Authelia-fronted) and the
# agents-as-MCP endpoint on the controller (:8083, LAN-only — see home-ops#14362).
# The `ai` namespace is default-deny; without this the kagent + kagent-mcp
# HTTPRoutes resolve but Cilium default-denies the gateway→backend hop and Envoy
# returns 503. Same pattern as ai/hermes — but kagent is not app-template, so this
# CNP is standalone rather than inline in the HelmRelease.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-allow-gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: kagent
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8083"
              protocol: TCP
  egress:
    # OTel tracing → the cluster OTLP collector (observability), gRPC :4317.
    # The controller carries OTEL_TRACING_ENABLED; apiserver/DNS/intra-ns egress
    # come from the ai baseline allows — this adds only the cross-ns trace sink.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: opentelemetry-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
#
# kagent AGENT pods → in-cluster MCP servers they read from. Agents carry
# `app.kubernetes.io/part-of: kagent`; the controller/ui use `instance=kagent`
# instead (a different label scheme), so this needs its own CNP rather than
# sharing kagent-allow-gateway. Cross-ns; memory-mcp re-adds matching ingress
# (ha-mcp does not default-deny ingress, so no ha-mcp-side change is needed).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-agents-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: kagent
  egress:
    # Curated operator memory — read-only, all agents.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: memory-mcp
      toPorts:
        - ports:
            - port: "8070"
              protocol: TCP
    # Grafana MCP — read-only (allowlist-enforced): Prometheus/Loki queries +
    # datasource/alert listing. The SHARED mcp-system instance (dedup 2026-10-03,
    # replacing the formerly-bundled ai grafana-mcp). Ingress half is in
    # mcp-system kagent-mcp-read-allow (:8000 already open there).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: grafana-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Home Assistant MCP — read-only (allowlist-enforced), smart-home-operator.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: ha-mcp
      toPorts:
        - ports:
            - port: "8086"
              protocol: TCP
    # ESPHome MCP — read-only (allowlist-enforced), smart-home-operator.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: esphome-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # GitHub MCP — read-only, observability-operator (alert→commit correlation).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: github-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Omada MCP — read-only (health subset), network-operator.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: omada-mcp
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # NetBox MCP — read-only (allowlist-enforced), network-operator.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: netbox-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Notify MCP — the guardrailed "email Rob" tool, bound to every agent.
    # The relay behind it recipient-locks + rate-limits, so this hop can only
    # ever result in one capped email to Rob.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: notify-mcp
      toPorts:
        - ports:
            - port: "8060"
              protocol: TCP
    # pr-mcp (:8090) — the propose_pr tool. Bound into agents that may open a PR;
    # WITHOUT this egress the agent's tool-init to :8090 is default-denied and
    # hangs 60s before falling back to lazy discovery (the ingress side lives in
    # mcp-system kagent-mcp-read-allow — BOTH sides are required).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: pr-mcp
      toPorts:
        - ports:
            - port: "8090"
              protocol: TCP
    # OTel tracing → the cluster OTLP collector (observability), gRPC :4317.
    # Agent pods emit a span per invocation + tool call; this opens the trace
    # sink (the audit/trace surface, and the doer-tier prerequisite).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: opentelemetry-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-controller-mcp-discovery-allow
spec:
  # The kagent CONTROLLER (not an agent pod) reconciles every RemoteMCPServer CR
  # itself, independent of any agent invocation — it dials each MCP server directly
  # to discover/refresh its tool list at controller startup and on every spec
  # change. The controller carries `instance=kagent, component=controller`, NOT
  # `part-of=kagent` (see kagent-agents-allow above), so neither that CNP's egress
  # side nor the mcp-system ingress allows keyed on part-of=kagent admit it.
  # Confirmed live 2026-09-30: the controller's reconcile 100% failed ("context
  # deadline exceeded", retrying every ~65s) for EVERY cross-namespace MCP server
  # in mcp-system — esphome/github/ha/memory/netbox/omada — not just the
  # pr-mcp/notify-mcp originally fixed in #14586 (that PR's assumption that
  # github-mcp/memory-mcp were already covered did not hold against live data).
  # ghostfolio-mcp/kagent-tool-server are intra-namespace (covered by the ai
  # allow-intra-namespace baseline), so they are genuinely unaffected. grafana-mcp
  # MOVED cross-ns 2026-10-03 (dedup to mcp-system/grafana-mcp) — its controller
  # egress is the :8000 entry below. This opens controller egress to each
  # mcp-system server; the ingress halves are in
  # mcp-system/mcp-gateway/app/cnp-kagent-read-allow.yaml (kagent-mcp-read-allow)
  # and mcp-system/memory-mcp/app/helmrelease.yaml (memory-mcp-allow).
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/component: controller
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: grafana-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: esphome-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: github-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: ha-mcp
      toPorts:
        - ports:
            - port: "8086"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: memory-mcp
      toPorts:
        - ports:
            - port: "8070"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: netbox-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: notify-mcp
      toPorts:
        - ports:
            - port: "8060"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: omada-mcp
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: pr-mcp
      toPorts:
        - ports:
            - port: "8090"
              protocol: TCP
