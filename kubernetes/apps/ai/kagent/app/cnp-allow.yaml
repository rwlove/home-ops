---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
#
# Internal gateway (envoy) → kagent UI (:8080, Authelia-fronted) and the
# agents-as-MCP endpoint on the controller (:8083, LAN-only — see home-ops#14362).
# The `ai` namespace is default-deny; without this the kagent + kagent-mcp
# HTTPRoutes resolve but Cilium default-denies the gateway→backend hop and Envoy
# returns 503. Same pattern as ai/hermes — but kagent is not app-template, so this
# CNP is standalone rather than inline in the HelmRelease.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-allow-gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: kagent
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8083"
              protocol: TCP
  egress:
    # OTel tracing → the cluster OTLP collector (observability), gRPC :4317.
    # The controller carries OTEL_TRACING_ENABLED; apiserver/DNS/intra-ns egress
    # come from the ai baseline allows — this adds only the cross-ns trace sink.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: opentelemetry-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
#
# kagent AGENT pods → in-cluster MCP servers they read from. Agents carry
# `app.kubernetes.io/part-of: kagent`; the controller/ui use `instance=kagent`
# instead (a different label scheme), so this needs its own CNP rather than
# sharing kagent-allow-gateway. Cross-ns; memory-mcp re-adds matching ingress
# (ha-mcp does not default-deny ingress, so no ha-mcp-side change is needed).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-agents-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: kagent
  egress:
    # Curated operator memory — read-only, all agents.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: memory-mcp
      toPorts:
        - ports:
            - port: "8070"
              protocol: TCP
    # Home Assistant MCP — read-only (allowlist-enforced), smart-home-operator.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: ha-mcp
      toPorts:
        - ports:
            - port: "8086"
              protocol: TCP
    # ESPHome MCP — read-only (allowlist-enforced), smart-home-operator.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: esphome-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # GitHub MCP — read-only, observability-operator (alert→commit correlation).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: github-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Omada MCP — read-only (health subset), network-operator.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: omada-mcp
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # NetBox MCP — read-only (allowlist-enforced), network-operator.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: netbox-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # OTel tracing → the cluster OTLP collector (observability), gRPC :4317.
    # Agent pods emit a span per invocation + tool call; this opens the trace
    # sink (the audit/trace surface, and the doer-tier prerequisite).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: opentelemetry-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
