---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# Egress for the kagent mcp-gateway JWT rotator to reach the Authelia OIDC token
# endpoint (auth.${SECRET_DOMAIN}) via the public Envoy gateway. Mirrors
# mcp-system/mcp-gateway `mcp-gateway-jwt-rotator-allow`. DNS is provided by the
# ai baseline network-policy component.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-mcp-gateway-jwt-rotator-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kagent-mcp-gateway-jwt-rotator
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
            - port: "10443"
              protocol: UDP
            - port: "443"
              protocol: TCP
