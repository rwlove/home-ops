---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-mcp-gateway-authelia-client
spec:
  # Reuses the SAME Authelia OIDC client-credentials client as the mcp-system
  # broker rotator (1P item `mcp-gateway-authelia`). Per the migration auth
  # decision, kagent authenticates to the gateway with an Authelia bearer
  # (aud=mcp-gateway) via the enforced hostname — no new Authelia client, fewest
  # moving parts. A dedicated `mcp-kagent` client is the access-design doc's
  # Decision 2 (deferred). The client_credentials grant is stateless per request,
  # so this second rotator minting from the same client never conflicts with
  # mcp-system/mcp-gateway-jwt-rotator.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kagent-mcp-gateway-authelia-client
    template:
      data:
        OIDC_CLIENT_ID: "{{ .client_id }}"
        OIDC_CLIENT_SECRET: "{{ .client_secret }}"
  dataFrom:
    - extract:
        key: mcp-gateway-authelia
