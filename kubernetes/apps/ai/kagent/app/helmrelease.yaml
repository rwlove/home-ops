---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
spec:
  chartRef:
    kind: OCIRepository
    name: kagent
  interval: 1h
  # Fresh 1.0.0 install (not an upgrade) pulls new images + waits on the external
  # CNPG DB connect; 5m Helm watch can trip MissingRollbackTarget on a slow first
  # start. 15m gives headroom. See reference_flux_stalled_missingrollbacktarget_new_app_timeout.
  timeout: 15m
  dependsOn:
    - name: kagent-crds
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: kagent-values
