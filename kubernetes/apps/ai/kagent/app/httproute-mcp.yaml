---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
#
# kagent agents-as-MCP endpoint (kagent-controller :8083 /mcp, kagent-dev/kagent#1160).
# Direct route for Claude Code delegation: the endpoint is STATEFUL (returns
# Mcp-Session-Id) so it cannot federate through the Kuadrant lovenet gateway
# (home-ops#14362) — Claude Code connects here directly and manages the session.
# Deliberately NOT Authelia-gated (a bot can't do interactive auth, like
# hermes-api); LAN-only via split-horizon DNS + kagent's unsecure auth mode.
# Agents are read-only. Path restricted to /mcp so the rest of the controller
# API is not exposed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent-mcp
spec:
  hostnames:
    - kagent-mcp.${SECRET_DOMAIN}
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: kagent-controller
          port: 8083
