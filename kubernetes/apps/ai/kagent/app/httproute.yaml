---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
#
# kagent web UI (kagent-ui :8080). Fronted by Authelia via securitypolicy.yaml
# (admin-tier, group:lldap_admin) — the same extAuth pattern as ai/hermes board.
# Internal gateway = LAN-only via split-horizon DNS; no public exposure.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent
  annotations:
    glance/name: "kagent"
    glance/show: "true"
    glance/id: "AI"
spec:
  hostnames:
    - kagent.${SECRET_DOMAIN}
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: kagent-ui
          port: 8080
