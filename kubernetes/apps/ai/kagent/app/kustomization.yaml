patches:
  # Fleet runaway-loop policy (2026-10-29): pin EVERY agent to the Python ADK runtime
  # and give it 2Gi. The default Go ADK runtime enforces NO per-invocation LLM-call cap
  # — a stuck agent loops unbounded (the 46h smart-home-operator incident). ADK-Python
  # caps ~500 calls/invocation (LlmCallsLimitExceededError), the only native stop the
  # Agent CRD exposes. Python costs ~4x the Go memory footprint (verified in-cluster:
  # ml-operator idle 55->253Mi, peak 454->956Mi), which breaches kagent's 1Gi controller
  # default on heavier agents -> OOMKills; 2Gi gives headroom (nodes have room). Applied
  # fleet-wide here so new agents inherit it; a per-agent exception goes in its own
  # targeted patch below this one.
  - target:
      kind: Agent
    patch: |-
      apiVersion: kagent.dev/v1alpha2
      kind: Agent
      metadata:
        name: ignored-when-target-selector-is-used
      spec:
        declarative:
          runtime: python
          deployment:
            resources:
              requests:
                cpu: 100m
                memory: 768Mi
              limits:
                cpu: "2"
                memory: 2Gi
  # Per-agent limit bumps (OOM-exposed, 2026-11-03): ml-operator, network-operator,
  # and storage-operator sustain genuine memory growth under the Python ADK runtime
  # that the fleet-wide 2Gi limit above doesn't cover for these three specifically.
  # Root cause is NOT runaway recurrence (the 10-29 46h-loop incident this fleet
  # patch was built for) -- it's a CPython heap ratchet: these agents' tool calls
  # return large broad-cluster-read payloads (kubectl/Omada/Ceph listings spanning
  # many resources), and CPython's allocator doesn't release that heap back to the
  # OS between invocations, so peak RSS ratchets upward over the agent's uptime.
  # Observed in-cluster: ml-operator 7 OOM restarts, network-operator 3, and
  # storage-operator (proactive catch, same ~2.14Gi peak signature, 0 restarts yet
  # but trending the same way) -- all peaking ~2.0-2.14Gi against the 2Gi ceiling.
  # 3Gi gives ~50% headroom over the observed peak. Limits only -- requests stay at
  # the fleet-default 768Mi; idle baseline for these three (280-500Mi) doesn't
  # justify a request bump, and request only affects scheduling, not the OOM
  # trigger. Counterpart to the request-trim sweep below: this is the fleet
  # right-sizing UP for a genuine under-provisioning, not VPA-target trimming.
  - patch: |-
      apiVersion: kagent.dev/v1alpha2
      kind: Agent
      metadata:
        name: ml-operator
      spec:
        declarative:
          deployment:
            resources:
              limits:
                memory: 3Gi
  - patch: |-
      apiVersion: kagent.dev/v1alpha2
      kind: Agent
      metadata:
        name: network-operator
      spec:
        declarative:
          deployment:
            resources:
              limits:
                memory: 3Gi
  - patch: |-
      apiVersion: kagent.dev/v1alpha2
      kind: Agent
      metadata:
        name: storage-operator
      spec:
        declarative:
          deployment:
            resources:
              limits:
                memory: 3Gi
  # Per-agent request trims (PR-sweep, fleet right-size): 14d Prometheus peak
  # was well under the shared 768Mi fleet-default request for these 10
  # agents. Limit stays 2Gi (fleet default, unchanged) — only the scheduler
  # reservation shrinks. The other 7 agents sharing the fleet default above
  # (lloyd, vila, ml-operator, network-operator, observability-operator,
  # smart-home-operator, storage-operator) are untouched — not measured in
  # this sweep, so left on the 768Mi default.
  - patch: |-
      apiVersion: kagent.dev/v1alpha2
      kind: Agent
      metadata:
        name: dali
      spec:
        declarative:
          deployment:
            resources:
              requests:
                memory: 334Mi
  - patch: |-
      apiVersion: kagent.dev/v1alpha2
      kind: Agent
      metadata:
        name: tim
      spec:
        declarative:
          deployment:
            resources:
              requests:
                memory: 334Mi
  - patch: |-
      apiVersion: kagent.dev/v1alpha2
      kind: Agent
      metadata:
        name: cooter
      spec:
        declarative:
          deployment:
            resources:
              requests:
                memory: 334Mi
  - patch: |-
      apiVersion: kagent.dev/v1alpha2
      kind: Agent
      metadata:
        name: arnold
      spec:
        declarative:
          deployment:
            resources:
              requests:
                memory: 334Mi
  - patch: |-
      apiVersion: kagent.dev/v1alpha2
      kind: Agent
      metadata:
        name: gordon
      spec:
        declarative:
          deployment:
            resources:
              requests:
                memory: 334Mi
  - patch: |-
      apiVersion: kagent.dev/v1alpha2
      kind: Agent
      metadata:
        name: rick
      spec:
        declarative:
          deployment:
            resources:
              requests:
                memory: 344Mi
  - patch: |-
      apiVersion: kagent.dev/v1alpha2
      kind: Agent
      metadata:
        name: triage-router
      spec:
        declarative:
          deployment:
            resources:
              requests:
                memory: 362Mi
  - patch: |-
      apiVersion: kagent.dev/v1alpha2
      kind: Agent
      metadata:
        name: crusher
      spec:
        declarative:
          deployment:
            resources:
              requests:
                memory: 363Mi
  - patch: |-
      apiVersion: kagent.dev/v1alpha2
      kind: Agent
      metadata:
        name: warren
      spec:
        declarative:
          deployment:
            resources:
              requests:
                memory: 393Mi
  - patch: |-
      apiVersion: kagent.dev/v1alpha2
      kind: Agent
      metadata:
        name: homeops-operator
      spec:
        declarative:
          deployment:
            resources:
              requests:
                memory: 457Mi
configMapGenerator:
  - name: kagent-values
    files:
      - values.yaml=./values.yaml
secretGenerator:
  # No-auth placeholder key for the Spark vLLM ModelConfigs. kagent's OpenAI
  # provider requires OPENAI_API_KEY to be set even though the vLLM servers do
  # not check it. Per-generator disableNameSuffixHash keeps the name stable
  # (referenced by ModelConfig.apiKeySecret) WITHOUT disturbing the hashed
  # kagent-values configMapGenerator above. Same dummy value hermes uses.
  - name: vllm-api-key
    literals:
      - OPENAI_API_KEY=sk-noauth-local-vllm
    options:
      disableNameSuffixHash: true
configurations:
  - ./kustomizeconfig.yaml
