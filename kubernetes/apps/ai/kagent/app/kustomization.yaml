---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./agent-arnold.yaml
  - ./agent-cooter.yaml
  - ./agent-crusher.yaml
  - ./agent-dali.yaml
  - ./agent-gordon.yaml
  - ./agent-homeops-operator.yaml
  - ./agent-lloyd.yaml
  - ./agent-ml-operator.yaml
  - ./agent-network-operator.yaml
  - ./agent-observability-operator.yaml
  - ./agent-rick.yaml
  - ./agent-smart-home-operator.yaml
  - ./agent-storage-operator.yaml
  - ./agent-tim.yaml
  - ./agent-triage-router.yaml
  - ./agent-vila.yaml
  - ./agent-warren.yaml
  - ./agenttemplate-ml-operator.yaml
  - ./agenttemplate-network-operator.yaml
  - ./agenttemplate-smart-home-operator.yaml
  - ./agenttemplate-storage-operator.yaml
  - ./cnp-allow.yaml
  - ./cnp-rotator-allow.yaml
  - ./externalsecret-mcp-gateway-authelia.yaml
  - ./harness-kagent.yaml
  - ./helmrelease-crds.yaml
  - ./helmrelease.yaml
  - ./httproute-mcp.yaml
  - ./httproute.yaml
  - ./modelconfig-litellm.yaml
  - ./modelconfig-vllm-spark.yaml
  - ./ocirepository-crds.yaml
  - ./ocirepository.yaml
  # Direct per-backend RemoteMCPServers for the 19 federated backends were retired
  # 2026-11-11 (Phase 4 teardown) — those agents now consume them through the
  # `mcp-gateway` RemoteMCPServer (Kuadrant broker, prefixed tool names). The
  # entries below are the backends that stay on a direct dial: the 6 openapi-mcp
  # SSE backends the broker can't federate (upstream-gated), pump (being migrated
  # to a streamable-http image so it can federate), and the mcp-gateway broker CR
  # itself.
  - ./remotemcpserver-cooter-mcp.yaml
  - ./remotemcpserver-gordon-mcp.yaml
  - ./remotemcpserver-grocy-mcp.yaml
  - ./remotemcpserver-homebox-mcp.yaml
  - ./remotemcpserver-lloyd-mcp.yaml
  - ./remotemcpserver-mcp-gateway.yaml
  - ./remotemcpserver-pump-mcp.yaml
  - ./remotemcpserver-tim-mcp.yaml
  - ./rotator-cronjob.yaml
  - ./rotator-rbac.yaml
  - ./securitypolicy.yaml
  - ./workerpool-kagent-default.yaml
# Per-agent runtime sizing is a chart-values concern in 1.0
# (config.runtimeDefaults / config.sandboxes) — the Harness workload object has
# no resources field. Compaction + substrate placement live on the Harness
# (harness-kagent.yaml, api.kagent.dev/v1alpha3).
configMapGenerator:
  - name: kagent-values
    files:
      - values.yaml=./values.yaml
secretGenerator:
  # No-auth placeholder key for the Spark vLLM ModelConfigs. kagent's OpenAI
  # provider requires OPENAI_API_KEY to be set even though the vLLM servers do
  # not check it. Per-generator disableNameSuffixHash keeps the name stable
  # (referenced by ModelConfig.apiKeySecret) WITHOUT disturbing the hashed
  # kagent-values configMapGenerator above. Same dummy value hermes uses.
  - name: vllm-api-key
    literals:
      - OPENAI_API_KEY=sk-noauth-local-vllm
    options:
      disableNameSuffixHash: true
configurations:
  - ./kustomizeconfig.yaml
