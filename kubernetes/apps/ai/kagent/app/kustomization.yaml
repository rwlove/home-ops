---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./agent-ml-operator.yaml
  - ./agent-network-operator.yaml
  - ./agent-observability-operator.yaml
  - ./agent-smart-home-operator.yaml
  - ./agent-storage-operator.yaml
  - ./cnp-allow.yaml
  - ./externalsecret.yaml
  - ./helmrelease-crds.yaml
  - ./helmrelease.yaml
  - ./httproute-mcp.yaml
  - ./httproute.yaml
  - ./modelconfig-vllm-spark.yaml
  - ./ocirepository-crds.yaml
  - ./ocirepository.yaml
  - ./remotemcpserver-esphome-mcp.yaml
  - ./remotemcpserver-github-mcp.yaml
  - ./remotemcpserver-ha-mcp.yaml
  - ./remotemcpserver-memory-mcp.yaml
  - ./remotemcpserver-netbox-mcp.yaml
  - ./remotemcpserver-omada-mcp.yaml
  - ./securitypolicy.yaml
configMapGenerator:
  - name: kagent-values
    files:
      - values.yaml=./values.yaml
secretGenerator:
  # No-auth placeholder key for the Spark vLLM ModelConfigs. kagent's OpenAI
  # provider requires OPENAI_API_KEY to be set even though the vLLM servers do
  # not check it. Per-generator disableNameSuffixHash keeps the name stable
  # (referenced by ModelConfig.apiKeySecret) WITHOUT disturbing the hashed
  # kagent-values configMapGenerator above. Same dummy value hermes uses.
  - name: vllm-api-key
    literals:
      - OPENAI_API_KEY=sk-noauth-local-vllm
    options:
      disableNameSuffixHash: true
configurations:
  - ./kustomizeconfig.yaml
