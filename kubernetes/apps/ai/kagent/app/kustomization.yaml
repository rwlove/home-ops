---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Agent personas moved to the private Forgejo source (windmill/kagent-agents),
  # reconciled by the kagent-agents Kustomization. Kept out of this public repo
  # because the persona definitions are internal-tier. The files remain on disk
  # here until the Forgejo path is proven (scrubbed in a follow-up PR); they are
  # intentionally unreferenced so this app no longer applies them.
  - ./cnp-allow.yaml
  - ./helmrelease-crds.yaml
  - ./helmrelease.yaml
  - ./httproute-mcp.yaml
  - ./httproute.yaml
  - ./mcpserver-owl-mcp.yaml
  - ./modelconfig-litellm.yaml
  - ./modelconfig-vllm-spark.yaml
  - ./ocirepository-crds.yaml
  - ./ocirepository.yaml
  - ./remotemcpserver-arr-mcp.yaml
  - ./remotemcpserver-calendar-mcp.yaml
  - ./remotemcpserver-comfyui-mcp.yaml
  - ./remotemcpserver-cooter-mcp.yaml
  - ./remotemcpserver-esphome-mcp.yaml
  - ./remotemcpserver-ghostfolio-mcp.yaml
  - ./remotemcpserver-gordon-mcp.yaml
  - ./remotemcpserver-grafana-mcp.yaml
  - ./remotemcpserver-github-mcp.yaml
  - ./remotemcpserver-ha-mcp.yaml
  - ./remotemcpserver-health-mcp.yaml
  - ./remotemcpserver-health-mcp-rw.yaml
  - ./remotemcpserver-medikeep-mcp.yaml
  - ./remotemcpserver-memory-mcp.yaml
  - ./remotemcpserver-netbox-mcp.yaml
  - ./remotemcpserver-notify-mcp.yaml
  - ./remotemcpserver-omada-mcp.yaml
  - ./remotemcpserver-paperless-mcp.yaml
  - ./remotemcpserver-pr-mcp.yaml
  - ./remotemcpserver-pump-mcp.yaml
  - ./remotemcpserver-rick-gonic-mcp.yaml
  - ./remotemcpserver-rick-library-mcp.yaml
  - ./remotemcpserver-tim-mcp.yaml
  - ./securitypolicy.yaml
configMapGenerator:
  - name: kagent-values
    files:
      - values.yaml=./values.yaml
secretGenerator:
  # No-auth placeholder key for the Spark vLLM ModelConfigs. kagent's OpenAI
  # provider requires OPENAI_API_KEY to be set even though the vLLM servers do
  # not check it. Per-generator disableNameSuffixHash keeps the name stable
  # (referenced by ModelConfig.apiKeySecret) WITHOUT disturbing the hashed
  # kagent-values configMapGenerator above. Same dummy value hermes uses.
  - name: vllm-api-key
    literals:
      - OPENAI_API_KEY=sk-noauth-local-vllm
    options:
      disableNameSuffixHash: true
configurations:
  - ./kustomizeconfig.yaml
