---
# TODO: apply schema
# kagent-hosted (kmcp) MCP server for the Owl retirement optimizer. Owl ships
# only a stdio MCP (`owlcli serve`), so kagent runs it in-cluster and wraps the
# stdio<->agent transport itself — no custom bridge image needed. The owlcli
# binary lives in the owldocker image's venv at /app/owl/.venv/bin/owlcli.
# Bound read+compute to the warren agent (agent-warren.yaml). All in-cluster;
# Owl computes from inputs the agent passes, no external calls required.
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: owl-mcp
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    image: docker.io/owlplanner/owldocker:2026.10.26@sha256:352ef598e948675dfad84ee2e2d474c25f31beebc346b4f74c5fe5c3afdbd40a
    cmd: /app/owl/.venv/bin/owlcli
    args:
      - serve
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        # 1Gi OOMKilled the pod (2026-10-16, 4 restarts) rendering Matplotlib
        # plots for a retirement Monte Carlo run. 2Gi is plain sizing for a
        # known memory-heavy plotting workload, not an upstream workaround.
        memory: 2Gi
