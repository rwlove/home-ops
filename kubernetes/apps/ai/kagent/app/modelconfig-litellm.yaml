---
# TODO: apply schema
# Agent-facing model GROUPS via the LiteLLM gateway (litellm.ai:4000) — NOT raw
# backends. Each group fails over between the two local GPUs, so a single backend
# outage degrades an agent instead of taking it offline:
#   strong -> Spark vLLM (qwen3.6-35b-a3b) -> Ollama qwen2.5:7b   (doers / hard reasoning)
#   fast   -> Ollama qwen2.5:7b            -> Spark vLLM          (pure watchers)
# LiteLLM is no-auth; the dummy vllm-api-key satisfies kagent's required-key check.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: strong
spec:
  provider: OpenAI
  model: strong
  apiKeySecret: vllm-api-key
  apiKeySecretKey: OPENAI_API_KEY
  openAI:
    baseUrl: http://litellm.ai.svc.cluster.local:4000/v1
---
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: fast
spec:
  provider: OpenAI
  model: fast
  apiKeySecret: vllm-api-key
  apiKeySecretKey: OPENAI_API_KEY
  openAI:
    baseUrl: http://litellm.ai.svc.cluster.local:4000/v1
