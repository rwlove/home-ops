---
# TODO: apply schema
# Spark vLLM ModelConfig — a direct-to-backend route to `vllm-driver-spark`
# (qwen3.6-35b-a3b), for an agent that ever needs to bypass the `strong`/`fast`
# LiteLLM groups (modelconfig-litellm.yaml) and opt in to this specific backend.
# No Agent currently references this ModelConfig by name — every agent in this
# fleet binds `strong` or `fast` instead, which LiteLLM itself routes to
# vllm-driver-spark (primary) or Ollama qwen2.5:7b (fallback). Kept as a documented
# direct-route escape hatch, not because anything consumes it today.
#
# A SECOND ModelConfig here, `vllm-coder-spark`, was removed 2026-11-14: it pointed
# at a backend parked at replicas:0 (the coder never ran on the Spark — see
# docs/src/vllm_spark_migration_plan.md D5; the coder lives on the P40 instead) and
# nothing referenced it either. A dangling ModelConfig pointing at a 0/0 backend is
# a trap for a future agent wiring — any Agent that picked it by name would fail
# with no indication why. Re-add it only alongside actually scaling
# vllm-coder-spark back up, not speculatively.
#
# kagent's OpenAI provider REQUIRES an api key even for a no-auth endpoint (it crashes
# with "OPENAI_API_KEY environment variable is not set"), so this references the dummy
# `vllm-api-key` Secret (generated in kustomization.yaml). The vLLM server does not
# check it — same no-auth placeholder hermes already uses.
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: vllm-driver-spark
spec:
  provider: OpenAI
  model: qwen3.6-35b-a3b
  apiKeySecret: vllm-api-key
  apiKeySecretKey: OPENAI_API_KEY
  openAI:
    baseUrl: http://vllm-driver-spark.ai.svc.cluster.local:8000/v1
