---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent-crds
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
  # ⚠ DO NOT bump this tag to 1.0.x standalone. kagent 1.0 is a breaking
  # re-architecture (api.kagent.dev/v1alpha3 + mandatory Substrate); a bare tag
  # bump cascade-deletes the fleet CRs (outage 2026-11-10). The 1.0 move lands
  # ONLY as part of the cutover (home-ops#15735 runbook / PR #15734).
    tag: 0.10.6
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds
