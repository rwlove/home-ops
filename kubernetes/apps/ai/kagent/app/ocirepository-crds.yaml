---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent-crds
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
  # kagent 1.0 cutover (home-ops#15735 runbook / PR #15734) — this IS the
  # sanctioned bump. 1.0.0 installs the api.kagent.dev/v1alpha3 CRDs and, via
  # the kagent-crds HelmRelease `crds: CreateReplace`, REMOVES the old
  # kagent.dev/v1alpha2 CRDs that 0.10.6 shipped (Agent/ModelConfig/
  # RemoteMCPServer/AgentHarness/…) — cascade-deleting their v1alpha2 CRs. That
  # is the intended migration; the rewritten fleet re-lands on v1alpha3.
  # owl-mcp (a kagent.dev/v1alpha1 MCPServer CR) was DROPPED from this cutover —
  # its CRD group is removed by CreateReplace and no agent references it; re-add
  # it later as a RemoteMCPServer once the 1.0 fleet is stable.
    tag: 1.0.1
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds
