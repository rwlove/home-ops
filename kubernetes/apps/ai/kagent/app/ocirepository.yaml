---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
  # kagent 1.0 cutover (home-ops#15735 runbook / PR #15734) — this IS the
  # sanctioned bump that lands the api.kagent.dev/v1alpha3 + Substrate
  # re-architecture together with the rewritten fleet CRs. Do NOT bump this tag
  # standalone outside the cutover: a bare bump cascade-deletes the fleet CRs.
    tag: 1.0.1
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent
