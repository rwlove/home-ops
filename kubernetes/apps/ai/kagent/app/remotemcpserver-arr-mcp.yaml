---
# TODO: apply schema
# In-cluster media-stack acquisition MCP (mcp-system/arr-mcp, Streamable-HTTP on
# :3000/mcp). rick uses it to read the acquisition manager's root folders,
# quality/metadata profiles, and library/missing state, and — on explicit,
# single-item approval only — to queue an acquisition. All in-cluster; the broker
# strips inbound Authorization and the backend carries its own env-loaded creds.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: arr-mcp
spec:
  description: In-cluster media-stack acquisition API
  protocol: STREAMABLE_HTTP
  url: http://arr-mcp.mcp-system.svc.cluster.local:3000/mcp
