---
# TODO: apply schema
# First-party calendar MCP (ai/calendar-mcp): guarded write tools over the shared
# "Concierge" Google Calendar, mirroring the laptop _shared/gcal.py surface.
# Bound to the five concierge agents (crusher/cooter/warren/gordon/arnold). Writes
# are DRY_RUN-gated at the server, per-persona scoped (an agent only edits events
# it tagged), and hourly-capped; its CNP admits ingress only from those agents.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: calendar-mcp
spec:
  description: Guarded shared-calendar write tools (list/add/update/delete_event) — DRY_RUN-gated, per-persona scoped
  protocol: STREAMABLE_HTTP
  url: http://calendar-mcp.ai.svc.cluster.local:8080/mcp
