---
# TODO: apply schema
# In-cluster ComfyUI MCP (mcp-system/comfyui-mcp, Streamable-HTTP on :9100/mcp),
# fronting the ComfyUI instance on the DGX Spark. dali uses it to read ComfyUI
# health/queue/history and to author + enqueue image/video workflows. All
# in-cluster; the broker strips inbound Authorization and the intra-ns CNP +
# istio mTLS are the auth boundary.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: comfyui-mcp
spec:
  description: In-cluster ComfyUI image/video gen
  protocol: STREAMABLE_HTTP
  url: http://comfyui-mcp.mcp-system.svc.cluster.local:9100/mcp
