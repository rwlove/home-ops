# Generic OpenAPI->MCP bridge (ai/cooter-mcp, ckanthony/openapi-mcp over SSE)
# in front of LubeLogger (selfhosted ns). Exposes the hand-authored vehicle /
# service / repair / gas / odometer / reminder / note surface as MCP tools.
# Bound by the `cooter` agent.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: cooter-mcp
spec:
  description: LubeLogger fleet records bridge (read/write)
  protocol: SSE
  url: http://cooter-mcp.ai.svc.cluster.local:8080/mcp
