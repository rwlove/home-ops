---
# TODO: apply schema
# ESPHome MCP (mcp-system/esphome-mcp), referenced read-only by the
# smart-home-operator agent for ESP device status / version / logs / update-check.
# esphome-mcp exposes write tools (edit/install/update/validate — install FLASHES
# firmware); the read-only guarantee is the agent's toolNames allowlist — only the
# get/list/check reads are bound (see agent-smart-home-operator.yaml). In-cluster only.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: esphome-mcp
spec:
  description: ESPHome device dashboard (read-only via allowlist)
  protocol: STREAMABLE_HTTP
  url: http://esphome-mcp.mcp-system.svc.cluster.local:8080/mcp
