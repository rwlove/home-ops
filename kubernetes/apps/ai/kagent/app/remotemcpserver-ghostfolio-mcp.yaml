---
# TODO: apply schema
# In-cluster Ghostfolio portfolio API (selfhosted/ghostfolio) fronted by
# ai/ghostfolio-mcp (mhajder/ghostfolio-mcp, HTTP transport). Read+write:
# warren uses it to read the live portfolio (valuation, allocation, performance)
# and to maintain the tracking model (accounts, activities, asset profiles).
# All in-cluster; the Ghostfolio token never leaves the network.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: ghostfolio-mcp
spec:
  description: In-cluster Ghostfolio portfolio API (read+write)
  protocol: STREAMABLE_HTTP
  url: http://ghostfolio-mcp.ai.svc.cluster.local:8000/mcp
