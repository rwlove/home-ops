---
# TODO: apply schema
# GitHub MCP (mcp-system/github-mcp), referenced read-only by the
# observability-operator agent to correlate a firing alert to recent commits / PRs
# ("what changed?"). github-mcp's tool surface is entirely read/search; the agent
# binds a focused subset (see agent-observability-operator.yaml). In-cluster only.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: github-mcp
spec:
  description: GitHub (read-only commits/PRs/releases for change correlation)
  protocol: STREAMABLE_HTTP
  url: http://github-mcp.mcp-system.svc.cluster.local:8080/mcp
