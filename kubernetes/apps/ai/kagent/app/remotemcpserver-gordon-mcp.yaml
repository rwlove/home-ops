# recipe / shopping-list / item / category / planner surface as MCP tools.
# Bound by the `gordon` agent.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: gordon-mcp
spec:
  description: KitchenOwl kitchen bridge (read/write)
  protocol: SSE
  url: http://gordon-mcp.ai.svc.cluster.local:8080/mcp
