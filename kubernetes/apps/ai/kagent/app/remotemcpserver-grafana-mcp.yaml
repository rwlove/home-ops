---
# TODO: apply schema
# Shared Grafana MCP (mcp-system/grafana-mcp), referenced read-only by the
# operator agents for Prometheus/Loki queries + datasource/alert listing.
# DEDUP 2026-10-03 (home-ops F6): replaces the second grafana-mcp the kagent
# chart used to bundle in this namespace (grafana-mcp.enabled: false in
# values.yaml). The mcp-system instance is already read-only (--disable-write)
# and Host-agnostic (--allowed-hosts "*"), so it serves the agents the same tool
# surface; the Green-tier read-only guarantee is still enforced by each agent's
# toolNames allowlist. Named `grafana-mcp` (not `kagent-grafana-mcp`) to avoid a
# name collision with the Helm-owned CR during the subchart removal. Reachability:
# agent/controller egress in cnp-allow.yaml + grafana-mcp added to the mcp-system
# kagent-mcp-read-allow ingress. Stateless STREAMABLE_HTTP; in-cluster only.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: grafana-mcp
spec:
  description: Grafana MCP (Prometheus/Loki queries, datasources — read-only via allowlist)
  protocol: STREAMABLE_HTTP
  url: http://grafana-mcp.mcp-system.svc.cluster.local:8000/mcp
