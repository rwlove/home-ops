# TODO: apply schema
# Generic OpenAPI->MCP bridge (ai/grocy-mcp, ckanthony/openapi-mcp over SSE) in
# front of Grocy (selfhosted ns). Exposes the hand-authored chore / battery /
# stock / object surface (non-food maintenance lane) as MCP tools. Bound by the
# `vila` property-steward agent.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: grocy-mcp
spec:
  description: Grocy chores + batteries + consumables bridge (read/write)
  protocol: SSE
  url: http://grocy-mcp.ai.svc.cluster.local:8080/mcp
