---
# TODO: apply schema
# Home Assistant MCP (mcp-system/ha-mcp), referenced read-only by the
# smart-home-operator agent for device-health watching (unavailable / low battery /
# integration health). ha-mcp exposes a large WRITE surface (set/remove/call_service/
# restart/reload); the Green-tier read-only guarantee is enforced entirely by the
# agent's toolNames allowlist (see agent-smart-home-operator.yaml) — this CR just
# makes the server reachable. Stateless STREAMABLE_HTTP, no Host allowlist (verified
# 2026-09-23). In-cluster only; never GitHub.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: ha-mcp
spec:
  description: Home Assistant MCP (device state / health — read-only via allowlist)
  protocol: STREAMABLE_HTTP
  url: http://ha-mcp.mcp-system.svc.cluster.local:8086/mcp
