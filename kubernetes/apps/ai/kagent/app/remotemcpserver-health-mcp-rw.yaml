---
# TODO: apply schema
# Write-enabled sibling of health-mcp (ai/health-mcp-rw). Same first-party image,
# deployed separately with the Medikeep REST write env so the ONE guarded
# `upsert_weight` tool is live. Bound to Crusher with toolNames: [upsert_weight]
# ONLY; its CNP admits ingress only from the Crusher pod. The read tools
# (bp/dose/planned/weight) stay on the read-only health-mcp server.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: health-mcp-rw
spec:
  description: Guarded Medikeep weight-write tool (upsert_weight) — PUMP->Medikeep reconcile, DRY_RUN-gated
  protocol: STREAMABLE_HTTP
  url: http://health-mcp-rw.ai.svc.cluster.local:8080/mcp
