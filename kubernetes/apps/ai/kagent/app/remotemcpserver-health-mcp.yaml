---
# TODO: apply schema
# First-party in-cluster health MCP (ai/health-mcp). ONE server fronting the
# medikeep + pump read-replicas with named, read-only tools (bp/dose/planned/
# weight), replacing Crusher's two crystaldba/postgres-mcp binds whose identical
# toolsets collided at tool-init ("duplicate tool: list_schemas"). Streamable-
# HTTP at /mcp. Read-only by construction (health_ro role + read-only txns + no
# write tool); bind all tools — every one is a fixed SELECT over an api.v_* view.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: health-mcp
spec:
  description: In-cluster health read tools — bp/dose/planned (medikeep) + weight (pump), read-only
  protocol: STREAMABLE_HTTP
  url: http://health-mcp.ai.svc.cluster.local:8080/mcp
