# warranty / maintenance / location / label surface as MCP tools. Bound by the
# `vila` property-steward agent.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: homebox-mcp
spec:
  description: HomeBox asset + warranty + maintenance bridge (read/write)
  protocol: SSE
  url: http://homebox-mcp.ai.svc.cluster.local:8080/mcp
