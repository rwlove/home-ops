---
# TODO: apply schema
# Generic OpenAPI->MCP bridge (ai/lloyd-mcp, ckanthony/openapi-mcp over SSE) in
# front of NocoDB (collab ns) — the insurance policy register. Exposes the
# hand-authored record read/write + table-listing surface as MCP tools. Bound by
# the `lloyd` agent, which scopes to the read + append operations (no delete) via
# its own toolNames allowlist. No insurance facts here; the register content is
# Internal/Restricted and lives in NocoDB, never GitHub.
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: lloyd-mcp
spec:
  description: NocoDB insurance policy register bridge (read/write)
  protocol: SSE
  url: http://lloyd-mcp.ai.svc.cluster.local:8080/mcp
