---
# TODO: apply schema
# The Kuadrant mcp-gateway broker, consumed through the ENFORCED public hostname
# (mcp.${SECRET_DOMAIN}) exactly like every other gateway client (open-webui,
# the laptop) — in-cluster direct-to-broker is closed by the access-design doc
# (Decision 1b). Auth is an Authelia bearer (aud=mcp-gateway) minted by the
# sibling rotator CronJob into the `kagent-mcp-gateway-jwt` secret; the gateway's
# Envoy SecurityPolicy validates it. The X-Mcp-Virtualserver header scopes the
# federated ~940-tool catalog down to the `kagent` MCPVirtualServer
# (mcp-system/kagent) so controller discovery stays small.
#
# Migration has since moved past Step A: all 21 agents now reference this
# RemoteMCPServer (the per-backend direct dials were retired in the Phase
# 2/4 migration PRs). The "additive, no agent references it yet" framing
# above is stale — left as-is for history; see git log for the migration
# sequence.
#
# status.discoveredTools forced to re-sync 2026-11-14 (Vikunja #96): the
# controller's cached tool catalog froze at 245 tools from the one-time
# discovery snapshot at 2026-11-11T14:37:10Z — ~2h before the
# healthrw-tools/health-tools MCPServerRegistrations existed, and never
# advanced across 5 later MCPVirtualServer generation bumps (now at 320
# declared tools). A live stateful handshake direct to the broker proves
# health_rw_upsert_weight resolves and executes correctly — the broker,
# virtualserver scope, and backend are fine; only the controller's cached
# view is stale. A kagent-controller pod restart does NOT clear this: this
# object's metadata.generation and status.conditions[0].observedGeneration
# were both already 1 before the restart (confirmed live), and `generation`
# only increments on a spec-field write (core apiserver behavior for any
# CRD with the status subresource, independent of kagent's own code) — a
# bare restart re-reads the same already-"observed" generation and skips
# re-discovery. This description edit is a real (if cosmetic) spec change
# to advance generation to 2 and force the controller's reconcile loop to
# treat this object as needing fresh work, matching the explicit
# observedGeneration-gated condition pattern already present in this CRD's
# status schema.
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: mcp-gateway
spec:
  description: >-
    Kuadrant mcp-gateway broker (federated MCP catalog), scoped to the kagent
    MCPVirtualServer. Authelia-bearer auth via the enforced hostname.
    status.discoveredTools re-sync forced 2026-11-14 (Vikunja #96) — see the
    comment above this object for why a restart alone did not do this.
  protocol: STREAMABLE_HTTP
  url: https://mcp.${SECRET_DOMAIN}/mcp/stateful
  timeout: 30s
  headersFrom:
    # Scope the federated catalog to the kagent virtual server (namespace/name).
    - name: X-Mcp-Virtualserver
      value: mcp-system/kagent
    # Authelia bearer (already "Bearer <jwt>" in the secret value). Injected by
    # the egress gateway; the controller also injects it for tool discovery.
    - name: Authorization
      valueFrom:
        type: Secret
        name: kagent-mcp-gateway-jwt
        key: authorization
