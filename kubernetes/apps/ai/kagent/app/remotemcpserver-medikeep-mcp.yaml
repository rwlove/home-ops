---
# TODO: apply schema
# In-cluster Medikeep records DB (collab/medikeep CNPG) exposed read-only via
# ai/medikeep-mcp (crystaldba/postgres-mcp, --access-mode=restricted, SSE).
# Connects as the health_ro role → sees only the api.v_bp + api.v_dose views.
# Crusher (medical) reads blood-pressure and dose history here. The BP WRITE
# path (append to public.vitals) is added separately.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: medikeep-mcp
spec:
  description: In-cluster Medikeep bp/dose views (read-only)
  protocol: SSE
  url: http://medikeep-mcp.ai.svc.cluster.local:8000/sse
