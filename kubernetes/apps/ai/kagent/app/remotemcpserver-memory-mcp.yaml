# TODO: apply schema
# In-cluster curated operator memory (mcp-system/memory-mcp), populated from
# Robert's `.md` memory by ai/memory-sync. Referenced read-only by the
# observability-operator agent so it grounds in this cluster's history
# (known false-positives, prior decisions) instead of guessing. All in-cluster,
# never GitHub.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: memory-mcp
spec:
  description: In-cluster curated operator memory (read-only)
  protocol: STREAMABLE_HTTP
  url: http://memory-mcp.mcp-system.svc.cluster.local:8070/mcp
