---
# TODO: apply schema
# NetBox MCP (mcp-system/netbox-mcp), referenced read-only by the network-operator
# agent for IPAM/DCIM source-of-truth. netbox-mcp exposes a large write surface
# (create/update/delete *); the read-only guarantee is the agent's toolNames
# allowlist — only netbox_get_*/netbox_search_objects/netbox_get_changelogs are
# bound (see agent-network-operator.yaml). In-cluster only; never GitHub.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: netbox-mcp
spec:
  description: NetBox IPAM/DCIM (read-only via allowlist)
  protocol: STREAMABLE_HTTP
  url: http://netbox-mcp.mcp-system.svc.cluster.local:8000/mcp
