---
# TODO: apply schema
# In-cluster notify MCP (mcp-system/notify-mcp) — a single `notify_rob` tool
# that emails Rob via the guardrailed smtp-relay :2526 endpoint. Bound to EVERY
# kagent agent so any of them can notify Rob on demand (not just from cron
# glue). The relay recipient-locks + rate-limits, so this tool can only ever
# email Rob, capped, regardless of caller — safe to expose fleet-wide. The
# recipient is NOT a tool parameter (injected server-side from 1P). In-cluster
# only, never GitHub.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: notify-mcp
spec:
  description: Email Rob one guardrailed notification (relay recipient-locked)
  protocol: STREAMABLE_HTTP
  url: http://notify-mcp.mcp-system.svc.cluster.local:8060/mcp
