# TODO: apply schema
# Omada MCP (mcp-system/omada-mcp), referenced read-only by the network-operator
# agent for AP / client / gateway / WAN / threat health. omada-mcp's tool surface is
# entirely read (get*/list*/search*), but the agent binds only a focused health
# subset (see agent-network-operator.yaml). In-cluster only; never GitHub.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: omada-mcp
spec:
  description: Omada SDN controller (read-only AP/client/gateway/WAN/threat health)
  protocol: STREAMABLE_HTTP
  url: http://omada-mcp.mcp-system.svc.cluster.local:3000/mcp
