---
# TODO: apply schema
# In-cluster Owl retirement optimizer (ai/owl-mcp). Owl ships ONLY a stdio MCP
# server (`owlcli serve`, 18 tools); ai/owl-mcp wraps it with sparfenyuk/mcp-proxy
# as a stdio->HTTP bridge and exposes streamable-HTTP at /mcp. Owl solves locally
# from parameters warren passes (no financial data leaves the cluster); it fetches
# only public rate/assumption tables. Bound by the `warren` financial-advisor agent.
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: owl-mcp
spec:
  description: Owl retirement optimizer (local solve) bridge
  protocol: STREAMABLE_HTTP
  url: http://owl-mcp.ai.svc.cluster.local:8080/mcp
