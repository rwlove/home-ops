---
# TODO: apply schema
# In-cluster Paperless-ngx document store (mcp-system/paperless-mcp,
# Streamable-HTTP on :3000/mcp), referenced READ-ONLY by the warren financial
# advisor to source filed tax/financial documents (statements, 1099s, tax
# returns, prospectuses). warren binds only the document-READ subset (see
# agent-warren.yaml) — it never writes to Paperless. All in-cluster; the broker
# strips inbound Authorization and the backend carries its own env-loaded
# PAPERLESS_API_KEY.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: paperless-mcp
spec:
  description: In-cluster Paperless-ngx document store (read-only) — warren sources filed tax/financial docs
  protocol: STREAMABLE_HTTP
  url: http://paperless-mcp.mcp-system.svc.cluster.local:3000/mcp
