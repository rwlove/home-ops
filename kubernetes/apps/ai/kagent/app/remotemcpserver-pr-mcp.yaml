---
# TODO: apply schema
# pr-mcp (mcp-system/pr-mcp): the guardrailed `propose_pr` tool any kagent agent
# can call to open a PR against home-ops. The AGENT authors the file content; the
# pr-mcp service holds the scoped Contents+PR-write token, validates (path
# allowlist, no secrets, YAML parse, size cap), commits to a fresh branch, and
# opens the PR via the GitHub REST API — it can NEVER merge (the default branch is
# protected; Rob reviews every PR). In-cluster only.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: pr-mcp
spec:
  description: Open a guardrailed PR against home-ops (propose_pr; never merges)
  protocol: STREAMABLE_HTTP
  url: http://pr-mcp.mcp-system.svc.cluster.local:8090/mcp
