---
# TODO: apply schema
# In-cluster PUMP weight (collab/pump CNPG DB) exposed read-only via
# ai/pump-mcp (bytebase/dbhub, streamable-HTTP at /mcp). Connects as the
# health_ro role → sees only the api.v_weight view. Arnold (fitness) + Crusher
# (medical, weight-as-signal) read it. Swapped off crystaldba/postgres-mcp:0.3.0
# 2026-11-11 — its MCP SDK was too old for kagent 1.0's server/discover
# (protocolVersion 2026-07-28 → DiscoveryFailed). Still a direct dial for now;
# federating via the mcp-gateway is the follow-up (dbhub is streamable, so it
# federates cleanly via the B1 pattern).
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: pump-mcp
spec:
  description: In-cluster PUMP weight view (read-only)
  protocol: STREAMABLE_HTTP
  url: http://pump-mcp.ai.svc.cluster.local:8000/mcp
