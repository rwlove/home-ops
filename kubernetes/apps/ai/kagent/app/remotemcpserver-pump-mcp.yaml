# TODO: apply schema
# In-cluster PUMP weight (collab/pump CNPG DB) exposed read-only via
# ai/pump-mcp (crystaldba/postgres-mcp, --access-mode=restricted, SSE).
# Connects as the health_ro role → sees only the api.v_weight view.
# Arnold (fitness) + Crusher (medical, weight-as-signal) read it.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: pump-mcp
spec:
  description: In-cluster PUMP weight view (read-only)
  protocol: SSE
  url: http://pump-mcp.ai.svc.cluster.local:8000/sse
