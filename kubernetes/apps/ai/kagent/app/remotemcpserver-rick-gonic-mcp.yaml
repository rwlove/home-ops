---
# TODO: apply schema
# Thin read-only Subsonic/OpenSubsonic MCP over gonic (ai/rick-gonic-mcp,
# Streamable-HTTP on :8099/mcp). rick's TASTE-SIGNAL read path: most-/recently-
# played albums, starred, search, album/song detail with per-user play counts —
# unioned across Robert's two gonic accounts. Read-only by construction (no
# scrobble/star/scan method exists), which backs rick's "taste signal is
# read-only" prime directive at the tool surface. Intra-namespace to kagent.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: rick-gonic-mcp
spec:
  description: Read-only gonic/Subsonic taste-signal reader (play counts, starred, search)
  protocol: STREAMABLE_HTTP
  url: http://rick-gonic-mcp.ai.svc.cluster.local:8099/mcp
