---
# TODO: apply schema
# In-cluster music-library remediation MCP (media/rick-library-mcp,
# Streamable-HTTP on :8095/mcp). rick (ward of the library) uses it to evaluate
# misfiled content and apply reversible fixes: every write is backed up to an
# off-library volume first, recorded to a durable ledger, confidence-gated, and
# never a delete. The write gate is behavioral (rick's prime directive) + the
# toolNames allowlist on agent-rick. Cross-namespace: the kagent egress halves
# are in ai/kagent/app/cnp-allow.yaml; the ingress half is inline in the app's
# HelmRelease networkpolicies block (media ns).
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: rick-library-mcp
spec:
  description: In-cluster music-library remediation (read + reversible, gated write)
  protocol: STREAMABLE_HTTP
  url: http://rick-library-mcp.media.svc.cluster.local:8095/mcp
