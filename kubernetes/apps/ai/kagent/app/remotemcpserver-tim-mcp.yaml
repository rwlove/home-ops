# TODO: apply schema
# Generic OpenAPI->MCP bridge (ai/tim-mcp, ckanthony/openapi-mcp over SSE) in
# front of Wardrowbe (selfhosted ns). Exposes the item / outfit / pairing /
# analytics / weather / preferences / learning surface (scoped via --include-tag)
# as MCP tools. Bound by the `tim` agent.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: tim-mcp
spec:
  description: Wardrowbe wardrobe catalog bridge (read/write)
  protocol: SSE
  url: http://tim-mcp.ai.svc.cluster.local:8080/mcp
