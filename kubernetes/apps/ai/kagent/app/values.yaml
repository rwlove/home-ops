---
# kagent 0.10.1 — values verified against
#   helm show values oci://ghcr.io/kagent-dev/kagent/helm/kagent --version 0.10.1
# Trial posture: controller-only, everything on LOCAL inference, contained to `ai`.

# Keep the whole trial on local models — no cloud provider keys, no external egress.
# `providers.default: ollama` makes the chart generate the default ModelConfig from
# this block; the native Ollama provider needs no apiKey (sidesteps kagent#57, the
# keyless-OpenAI-compatible crashloop).
providers:
  default: ollama
  ollama:
    provider: Ollama
    model: qwen2.5:7b  # served by the P40 ollama (kubernetes/apps/ai/ollama); swap per taste
    config:
      host: ollama.ai.svc.cluster.local:11434
      options:
        num_ctx: "16000"  # P40-safe; chart default is 64000

# Contain the controller to `ai` for the trial: Role/RoleBinding in `ai` only and
# WATCH_NAMESPACES=ai, instead of the default cluster-wide ClusterRole. Widen later
# when an operator legitimately needs to watch other namespaces.
rbac:
  namespaces:
    - ai

# Start CONTROLLER-ONLY. Every built-in agent is off; enable one deliberately (mapped
# to an operator persona, with its RBAC/model validated) per the transition plan.
k8s-agent:
  enabled: false
kgateway-agent:
  enabled: false
istio-agent:
  enabled: false
promql-agent:
  enabled: true
  modelConfigRef: default-model-config
# Prebuilt observability-agent DISABLED — replaced by the custom, read-only
# `observability-operator` Agent CR (agent-observability-operator.yaml), which
# carries Robert's guardrails + a query-only tool subset. grafana-mcp stays
# enabled (it provides the RemoteMCPServer the custom agent references).
observability-agent:
  enabled: false
argo-rollouts-agent:
  enabled: false
helm-agent:
  enabled: false
cilium-policy-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-debug-agent:
  enabled: false

# grafana-mcp: reuse the EXISTING read-only Grafana SA token. The mcp-system/grafana-mcp
# app already runs mcp-grafana with --disable-write against grafana.observability.svc; its
# token lives in 1P item `grafana` (field mcp_token). The ExternalSecret in this app mints
# Secret `kagent-grafana-mcp-secret` (key GRAFANA_SERVICE_ACCOUNT_TOKEN) from that item.
grafana-mcp:
  enabled: true
  # Pin the bundled grafana-mcp image. The chart default is
  # `mcp/grafana:latest` (Docker's MCP-catalog mirror), which ONLY ever ships
  # `latest` — unversioned and un-Renovatable. Repoint at the UPSTREAM
  # `grafana/mcp-grafana` image (same server, tags every release; the mcp/grafana
  # mirror is just a repackage of it) pinned by tag + digest. Same image family
  # as mcp-system/grafana-mcp. The 0.10.x subchart image helper is
  # `join "/" [registry, repository] + ":" + tag`, so the digest rides on the
  # tag → docker.io/grafana/mcp-grafana:1.6.3@sha256:...  Renovate's helm-values
  # manager tracks registry+repository+tag@digest here (kubernetes/**.yaml).
  image:
    registry: docker.io
    repository: grafana/mcp-grafana
    tag: "2.0.0@sha256:2ed63c4d9d67557c8ea6cc6988743ddd9008e248bd9842e760fec378a0b61062"
    pullPolicy: IfNotPresent
  grafana:
    url: "http://grafana.observability.svc.cluster.local"
    secretRef: kagent-grafana-mcp-secret
  # mcp-grafana defaults --allowed-hosts to loopback and 403s the in-cluster agent's
  # `Host: kagent-grafana-mcp.ai:8000` (DNS-rebinding protection). Allowlist the service
  # DNS the kagent agents actually dial (appended to the chart's --transport args).
  args:
    - "--allowed-hosts"
    - "kagent-grafana-mcp.ai:8000,kagent-grafana-mcp.ai.svc.cluster.local:8000,kagent-grafana-mcp:8000"

# Bundled dev/eval Postgres on ceph-block (regenerable trial state).
# PRODUCTION TODO: point database.postgres.url at a CNPG cluster with pgvector
# (set database.postgres.vectorEnabled: true) to enable long-term agent memory,
# per the repo storage-class convention. Bundled is explicitly "not for production".
database:
  postgres:
    bundled:
      enabled: true
      storage: 1Gi
      storageClassName: ceph-block

controller:
  replicas: 1

# OTel tracing → the cluster OTLP collector (opentelemetry-collector.observability
# :4317 gRPC → Tempo, the same sink open-webui / tei-spark use). Every agent
# invocation and every tool call becomes a span: the observability/audit surface for
# the watcher fleet today, and the prerequisite trace trail for the future doer tier
# (every mutating tool call recorded as a span, correlatable with the apiserver audit
# log Vector already ships to Loki). gRPC endpoint is bare host:port (otlptracegrpc
# form), not a URL. Additive + reversible: drop this block to turn tracing back off.
otel:
  tracing:
    enabled: true
    exporter:
      otlp:
        endpoint: "opentelemetry-collector.observability.svc.cluster.local:4317"
        protocol: "grpc"
        timeout: 15000

# FOLLOW-UPS (left at chart defaults for the scaffold):
# - ui.enabled: true + an HTTPRoute behind Authelia for the kagent web UI (interaction plan).
