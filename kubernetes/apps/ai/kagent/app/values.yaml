---
# kagent 1.0 — values verified against
#   helm show values oci://ghcr.io/kagent-dev/kagent/helm/kagent --version 1.0.0
# Posture unchanged from the 0.10.x trial: controller + built-in tools only,
# everything on LOCAL inference, contained to `ai`.
#
# 1.0 schema changes applied vs the old file:
#   - DROPPED the prebuilt-agent subcharts (k8s-agent, kgateway-agent,
#     istio-agent, promql-agent, observability-agent, argo-rollouts-agent,
#     helm-agent, cilium-*-agent) and grafana-mcp subchart — none exist in 1.0.
#   - DROPPED database.postgres.bundled — 1.0 has no bundled dev DB; it takes
#     external Postgres connection strings from Secrets.
#   - DROPPED top-level `otel.tracing` — not a 1.0 value key (telemetry moved
#     under config.telemetry / config.runtimeDefaults.telemetry).
#   - kagent-tools container resources moved from kagent-tools.tools.resources
#     (0.10.x) to kagent-tools.resources (1.0).

# Keep the whole fleet on local models — no cloud provider keys, no external
# egress. providers.default: ollama makes the chart generate its default
# ModelConfig from this block; native Ollama needs no apiKey (sidesteps the
# keyless-OpenAI-compatible crashloop). The 4 task ModelConfigs
# (strong/fast/vllm-*) are separate api.kagent.dev/v1alpha3 CRs; this generated
# one is additional.
providers:
  default: ollama
  ollama:
    provider: Ollama
    model: qwen2.5:7b  # served by the P40 ollama (kubernetes/apps/ai/ollama)
    config:
      host: ollama.ai.svc.cluster.local:11434  # not the chart-default docker host
      options:
        num_ctx: "16000"  # P40-safe; chart default is 64000

# External Postgres (CNPG). 1.0 replaced the bundled dev DB with required
# connection-string Secrets. These Secrets must exist in `ai` (owner creates
# the schema + runs migrations; readWrite is used for every runtime query).
database:
  postgres:
    ownerConnectionStringSecretRef:
      name: kagent-postgres-owner
      key: ownerConnectionString
    readWriteConnectionStringSecretRef:
      name: kagent-postgres-readwrite
      key: readWriteConnectionString

config:
  # Roles each login assumes + the schema holding kagent tables.
  database:
    owner:
      role: kagent_owner
    readWrite:
      role: kagent_readwrite
    schema: kagent
  # config.substrate left at chart defaults (ate-system service names:
  # api.ate-system.svc:443 / atenet-router.ate-system.svc:443 / idp.ate-system.svc).

# Contain the controller to `ai` for now: Role/RoleBinding in `ai` only and the
# controller watch scoped to `ai`, instead of the default cluster-wide
# ClusterRole. Widen later when an operator must watch other namespaces.
rbac:
  namespaces:
    - ai

# Controller OOMKilled repeatedly on reconcile/invocation bursts at the
# chart-default 512Mi limit; keep the limit at 1Gi. Requests (cpu 100m /
# mem 128Mi) deep-merged, left as-is. Reversible: drop this block.
controller:
  replicas: 1
  resources:
    limits:
      memory: 1Gi

# Built-in tool server OOMKilled under tool-call bursts; keep the headroom bump
# at 2Gi. NOTE the 1.0 path: the tools *container* resources are at
# kagent-tools.resources (0.10.x nested them under kagent-tools.tools.resources,
# which no longer carries resources). Requests (cpu 50m / mem 128Mi) left as-is.
kagent-tools:
  resources:
    limits:
      memory: 2Gi

# FOLLOW-UPS (left at chart defaults for the cutover):
# - ui.enabled + an HTTPRoute behind Authelia for the kagent web UI.
