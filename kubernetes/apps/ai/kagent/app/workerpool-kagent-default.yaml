---
# TODO: apply schema
# The Agent Substrate WorkerPool the Harness references
# (spec.substrate.workerPoolRef.name: kagent-default). Platform capacity, not
# owned by any one agent — authored standalone here rather than via the chart's
# substrateWorkerPool.create (left false), so Flux owns its lifecycle directly.
#
# Schema verified LIVE against the cluster — workerpools.ate.dev/v1 IS installed
# (`kubectl explain workerpools.ate.dev.spec`): replicas (required), workerImage
# (required), sandboxClasses (required, []{name enum gvisor|microvm}, exactly one
# entry), template {nodeSelector, tolerations, resources (std ResourceRequirements),
# nodeAffinity, priorityClassName, serviceAccountName, labels, annotations}.
#
# Pinned to the DGX Spark: it is the lone arm64 node and carries the arm64
# NoSchedule taint, so workers need both the hostname nodeSelector and the
# matching toleration or they go Pending.
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: kagent-default
  namespace: ai
spec:
  replicas: 1
  workerImage: ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1.0.0
  sandboxClasses:
    - name: gvisor
  template:
    nodeSelector:
      kubernetes.io/hostname: spark.thesteamedcrab.com
    tolerations:
      - key: kubernetes.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
