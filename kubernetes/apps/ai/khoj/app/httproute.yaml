---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
#
# Route moved here from the retired khoj-oauth2-proxy (#12767).
# The UI route carries the extAuth SecurityPolicy; /api/ is exposed
# without gateway auth because khoj clients authenticate with khoj's
# own API tokens (was --skip-auth-route=^/api/ on oauth2-proxy).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: khoj
  # Hand-off to the chart-rendered route (next PR): prune-disabled keeps this
  # object when the file is removed; the Helm ownership metadata lets the
  # release adopt it in place (no route gap).
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    app.kubernetes.io/managed-by: Helm
  annotations:
    glance/name: "Khoj"
    glance/show: "true"
    glance/id: "AI"
    glance/icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/khoj.png"
    meta.helm.sh/release-name: khoj
    meta.helm.sh/release-namespace: ai
spec:
  hostnames:
    - khoj.${SECRET_DOMAIN}
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: khoj
          port: 42110
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: khoj-public
  # Hand-off to the chart-rendered route (next PR): prune-disabled keeps this
  # object when the file is removed; the Helm ownership metadata lets the
  # release adopt it in place (no route gap).
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: khoj
    meta.helm.sh/release-namespace: ai
spec:
  hostnames:
    - khoj.${SECRET_DOMAIN}
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: khoj
          port: 42110
