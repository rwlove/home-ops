---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/persistentvolumeclaim-v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lightrag-finance-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # ceph-block per storage-class rule 2: the KV cache / vector store /
  # knowledge graph are derived state, reconstructable by re-running
  # extraction over the finance corpus (the audit/ markdown + data/*.yaml in
  # ~/workspace/claude-workspace/finance — the durable source of truth).
  # Survives node loss + pod restart; rebuild-from-source is the DR path.
  # 10Gi (vs the shared instance's 20Gi): the finance corpus is small.
  storageClassName: ceph-block
