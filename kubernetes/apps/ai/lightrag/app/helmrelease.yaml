---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lightrag
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  install:
    # First start creates the storage layout and warms the Ollama models;
    # helm-controller's 5-min wait can outlast that cold path.
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      lightrag:
        annotations:
          reloader.stakater.com/auto: "true"
        type: deployment
        replicas: 1
        strategy: Recreate  # single replica, RWO data PVC
        containers:
          app:
            image:
              repository: ghcr.io/hkuds/lightrag
              tag: v1.5.7@sha256:5bdbd524931b011df246fe20888d110cef691e6804c12cde636a2b746d7de27e
            env:
              HOST: "0.0.0.0"
              PORT: "9621"
              # All durable paths live under the data PVC mount (/app/data).
              WORKING_DIR: /app/data/rag_storage
              INPUT_DIR: /app/data/inputs
              PROMPT_DIR: /app/data/prompts
              # lightrag.log defaults to cwd (/app, root-owned) → uid 1000
              # can't create it → CrashLoop. Point it at the writable tmpfs;
              # logs also go to stdout (Loki), so the file is ephemeral.
              LOG_DIR: /tmp
              # tiktoken caches its BPE vocab here (on the data PVC) so the
              # one-time download from openaipublic.blob.core.windows.net
              # survives pod restarts. Without a writable cache dir it
              # re-downloads every cold start (and fails under default-deny).
              TIKTOKEN_CACHE_DIR: /app/data/tiktoken
              # --- LLM: graph extraction + query synthesis via vLLM driver ---
              # Cut over 2026-07-24 from ollama-spark/qwen3.5:122b-a10b (which
              # was removed — the dangling ref was breaking ingest) to the vLLM
              # driver serving Qwen3.6-35B-A3B over the OpenAI API. NOTE: openai
              # binding, not ollama — vLLM speaks /v1, not the ollama API. The
              # driver runs 128k context. LLM_TIMEOUT stays 900 (driver ~20
              # tok/s single-stream); the tight MAX_ASYNC/INSERT caps below stay
              # to avoid over-subscribing the shared GB10.
              LLM_BINDING: openai
              LLM_BINDING_HOST: http://vllm-driver-spark.ai.svc.cluster.local:8000/v1
              LLM_BINDING_API_KEY: vllm
              LLM_MODEL: qwen3.6-35b-a3b
              LLM_TIMEOUT: "900"
              # Single GB10 serves ~4 concurrent (ollama-spark
              # OLLAMA_NUM_PARALLEL=4) and each 80b call runs at a fraction of
              # GPU speed under load. LightRAG's defaults offer up to
              # MAX_PARALLEL_INSERT(3) × MAX_ASYNC(4) = 12 concurrent extraction
              # calls, which queue past the read timeout → extraction
              # ReadTimeouts (docs stuck 'failed'). Cap concurrency so we stop
              # over-subscribing the shared Spark GPU; ingest is slower but
              # completes cleanly.
              MAX_ASYNC: "2"
              MAX_PARALLEL_INSERT: "1"
              # --- Embeddings: bge-m3 (1024-dim) on TEI ---
              # Cut over 2026-07-25 from ollama-spark/bge-m3:latest to
              # tei-embed-spark, the dedicated TEI embedder. NOTE: openai
              # binding, not ollama — TEI speaks /v1, not the ollama API.
              # Same weights (BAAI/bge-m3), so EXISTING VECTORS STAY VALID:
              # a parity check over 5 inputs (incl. multilingual + a single
              # char) measured cosine ≥0.999995 vs the ollama path, identical
              # 1024 dim, both L2-normalised, identical retrieval rank order.
              # No re-embed needed.
              EMBEDDING_BINDING: openai
              EMBEDDING_BINDING_HOST: http://tei-embed-spark.ai.svc.cluster.local:3000/v1
              # TEI serves exactly one model and ignores the request's `model`
              # field (verified: any string returns BAAI/bge-m3). Kept
              # descriptive rather than load-bearing.
              EMBEDDING_MODEL: bge-m3
              EMBEDDING_DIM: "1024"
              # TEI requires no auth, but the openai binding sends an
              # Authorization header unconditionally — a placeholder keeps
              # the client library happy. Same pattern as LLM_BINDING_API_KEY.
              EMBEDDING_BINDING_API_KEY: tei
              # TEI hard-rejects client batches >32 with HTTP 422 (Ollama
              # accepted any size). LightRAG's default is 10, but pin it so
              # the cutover doesn't silently depend on an upstream default
              # that could rise past the cap in a future release.
              EMBEDDING_BATCH_NUM: "16"
            envFrom:
              - secretRef:
                  name: lightrag-secret
            probes:
              # tcpSocket (not httpGet) — robust without asserting an exact
              # health-endpoint path on first deploy.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &httpPort 9621
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *httpPort
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *httpPort
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              # readOnlyRootFilesystem omitted for first deploy: the image
              # may write Python caches / scratch under / at startup.
              # Durable state is on the data PVC; /tmp is tmpfs below.
              # Revisit with RO rootfs once the image's write paths are
              # confirmed clean.
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: lightrag
        ports:
          http:
            port: *httpPort
    route:
      app:
        annotations:
          glance/name: "LightRAG"
          glance/show: "true"
          glance/id: "AI"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      data:
        existingClaim: lightrag-data
        advancedMounts:
          lightrag:
            app:
              - path: /app/data
      tmp:
        type: emptyDir
        advancedMounts:
          lightrag:
            app:
              - path: /tmp
    externalSecrets:
      lightrag:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        refreshInterval: 5m
        target:
          name: lightrag-secret
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              # Server-to-server API key (the future paperless→LightRAG ingest
              # pusher authenticates with this) and the WebUI login accounts.
              # Ollama itself needs no key — LLM + embedding calls are
              # unauthenticated intra-cluster.
              LIGHTRAG_API_KEY: "{{ .api_key }}"
              AUTH_ACCOUNTS: "{{ .auth_accounts }}"
              TOKEN_SECRET: "{{ .token_secret }}"
        dataFrom:
          - extract:
              key: lightrag
    networkpolicies:
      allow:
        type: cilium
        forceRename: lightrag-allow
        # Explicit endpointSelector preserves the pre-inline selector
        # instead of the chart's controller-derived default, keeping the
        # policy byte-identical across the migration.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: lightrag
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # HTTPRoute on internal gateway → lightrag:9621 (lightrag.${SECRET_DOMAIN}
          # for the WebUI + REST API).
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "9621"
                    protocol: TCP
          # Ingest pusher: a Windmill flow reads the paperless corpus and POSTs
          # documents into LightRAG's REST API (mirrors the existing
          # paperless-rag-ingest → Qdrant flow). Windmill workers live in home ns.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: home
                  app.kubernetes.io/name: windmill-workers
            toPorts:
              - ports:
                  - port: "9621"
                    protocol: TCP
        egress:
          # LLM (graph extraction + query synthesis) → vllm-driver-spark:8000
          # (OpenAI /v1) as of the 2026-07-24 cutover. Embeddings (bge-m3) →
          # tei-embed-spark:3000 (OpenAI /v1) as of the 2026-07-25 cutover; the
          # ollama-spark:11434 hole retires with it.
          # Baseline allow-intra-namespace already covers ai→ai; explicit here
          # for grep-ability (paperless-ai pattern).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: vllm-driver-spark
            toPorts:
              - ports:
                  - port: "8000"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: tei-embed-spark
            toPorts:
              - ports:
                  - port: "3000"
                    protocol: TCP
          # tiktoken downloads its BPE vocab (o200k_base) from
          # openaipublic.blob.core.windows.net on first startup, or LightRAG
          # CrashLoops at import. Azure blob is an A-record FQDN where Cilium's
          # toFQDNs.matchPattern silently fails (see
          # project_cilium_matchpattern_fqdn_limits.md), so world:443 per the
          # github-mcp / khoj precedent. The vocab is cached to the data PVC
          # (TIKTOKEN_CACHE_DIR) so this fires once, not every cold start.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
