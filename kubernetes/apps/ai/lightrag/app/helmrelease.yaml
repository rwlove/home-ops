---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lightrag
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  install:
    # First start creates the storage layout and warms the Ollama models;
    # helm-controller's 5-min wait can outlast that cold path.
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      lightrag:
        annotations:
          reloader.stakater.com/auto: "true"
        type: deployment
        replicas: 1
        strategy: Recreate  # single replica, RWO data PVC
        containers:
          app:
            image:
              repository: ghcr.io/hkuds/lightrag
              tag: v1.5.5@sha256:206579ab1a2bc1f2b5f19fe97c01cb801ff409e6ae29a15542f82208a285640a
            env:
              HOST: "0.0.0.0"
              PORT: "9621"
              # All durable paths live under the data PVC mount (/app/data).
              WORKING_DIR: /app/data/rag_storage
              INPUT_DIR: /app/data/inputs
              PROMPT_DIR: /app/data/prompts
              # lightrag.log defaults to cwd (/app, root-owned) → uid 1000
              # can't create it → CrashLoop. Point it at the writable tmpfs;
              # logs also go to stdout (Loki), so the file is ephemeral.
              LOG_DIR: /tmp
              # tiktoken caches its BPE vocab here (on the data PVC) so the
              # one-time download from openaipublic.blob.core.windows.net
              # survives pod restarts. Without a writable cache dir it
              # re-downloads every cold start (and fails under default-deny).
              TIKTOKEN_CACHE_DIR: /app/data/tiktoken
              # --- LLM: graph extraction + query synthesis via vLLM driver ---
              # Cut over 2026-07-24 from ollama-spark/qwen3.5:122b-a10b (which
              # was removed — the dangling ref was breaking ingest) to the vLLM
              # driver serving Qwen3.6-35B-A3B over the OpenAI API. NOTE: openai
              # binding, not ollama — vLLM speaks /v1, not the ollama API. The
              # driver runs 128k context. LLM_TIMEOUT stays 900 (driver ~20
              # tok/s single-stream); the tight MAX_ASYNC/INSERT caps below stay
              # to avoid over-subscribing the shared GB10.
              LLM_BINDING: openai
              LLM_BINDING_HOST: http://vllm-driver-spark.ai.svc.cluster.local:8000/v1
              LLM_BINDING_API_KEY: vllm
              LLM_MODEL: qwen3.6-35b-a3b
              LLM_TIMEOUT: "900"
              # Single GB10 serves ~4 concurrent (ollama-spark
              # OLLAMA_NUM_PARALLEL=4) and each 80b call runs at a fraction of
              # GPU speed under load. LightRAG's defaults offer up to
              # MAX_PARALLEL_INSERT(3) × MAX_ASYNC(4) = 12 concurrent extraction
              # calls, which queue past the read timeout → extraction
              # ReadTimeouts (docs stuck 'failed'). Cap concurrency so we stop
              # over-subscribing the shared Spark GPU; ingest is slower but
              # completes cleanly.
              MAX_ASYNC: "2"
              MAX_PARALLEL_INSERT: "1"
              # --- Embeddings: bge-m3 (1024-dim) on TEI ---
              # Cut over 2026-07-25 from ollama-spark/bge-m3:latest to
              # tei-embed-spark, the dedicated TEI embedder. NOTE: openai
              # binding, not ollama — TEI speaks /v1, not the ollama API.
              # Same weights (BAAI/bge-m3), so EXISTING VECTORS STAY VALID:
              # a parity check over 5 inputs (incl. multilingual + a single
              # char) measured cosine ≥0.999995 vs the ollama path, identical
              # 1024 dim, both L2-normalised, identical retrieval rank order.
              # No re-embed needed.
              EMBEDDING_BINDING: openai
              EMBEDDING_BINDING_HOST: http://tei-embed-spark.ai.svc.cluster.local:3000/v1
              # TEI serves exactly one model and ignores the request's `model`
              # field (verified: any string returns BAAI/bge-m3). Kept
              # descriptive rather than load-bearing.
              EMBEDDING_MODEL: bge-m3
              EMBEDDING_DIM: "1024"
              # TEI requires no auth, but the openai binding sends an
              # Authorization header unconditionally — a placeholder keeps
              # the client library happy. Same pattern as LLM_BINDING_API_KEY.
              EMBEDDING_BINDING_API_KEY: tei
              # TEI hard-rejects client batches >32 with HTTP 422 (Ollama
              # accepted any size). LightRAG's default is 10, but pin it so
              # the cutover doesn't silently depend on an upstream default
              # that could rise past the cap in a future release.
              EMBEDDING_BATCH_NUM: "16"
            envFrom:
              - secretRef:
                  name: lightrag-secret
            probes:
              # tcpSocket (not httpGet) — robust without asserting an exact
              # health-endpoint path on first deploy.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &httpPort 9621
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *httpPort
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *httpPort
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              # readOnlyRootFilesystem omitted for first deploy: the image
              # may write Python caches / scratch under / at startup.
              # Durable state is on the data PVC; /tmp is tmpfs below.
              # Revisit with RO rootfs once the image's write paths are
              # confirmed clean.
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: lightrag
        ports:
          http:
            port: *httpPort
    route:
      app:
        annotations:
          glance/name: "LightRAG"
          glance/show: "true"
          glance/id: "AI"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      data:
        existingClaim: lightrag-data
        advancedMounts:
          lightrag:
            app:
              - path: /app/data
      tmp:
        type: emptyDir
        advancedMounts:
          lightrag:
            app:
              - path: /tmp
