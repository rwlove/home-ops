---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app lightrag
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: ai
  path: ./kubernetes/apps/ai/lightrag/app
  interval: 1h
  timeout: 10m
  wait: false
  # Depended on ollama-spark until 2026-07-26. That was already stale:
  # LightRAG's LLM moved to vllm-driver-spark on 07-24 and its embeddings
  # to tei-embed-spark on 07-25. Left in place it would have pinned
  # lightrag permanently not-Ready the moment ollama-spark was removed.
  dependsOn:
    - name: tei-embed-spark
      namespace: ai
    - name: vllm-driver-spark
      namespace: ai
    - name: onepassword-connect
      namespace: external-secrets
  retryInterval: 2m
