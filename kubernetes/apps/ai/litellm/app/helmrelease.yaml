---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      litellm:
        # 2 replicas — LiteLLM is now the critical path for every agent's model
        # access, so a single pod restart must not blind the fleet. Stateless
        # (config-based, no DB), so replicas are clean.
        replicas: 2
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/berriai/litellm-non_root
              tag: v1.104.0@sha256:37066242e6b8327fdd627682a66a9ae2a599553b4d5a84c905c6d8b9eb35c01e
            args:
              - "--config"
              - "/config/config.yaml"
              - "--port"
              - "4000"
            env:
              LITELLM_LOG: INFO
              HOME: /tmp
              # Use the cost map bundled in the image instead of fetching
              # model_prices_and_context_window.json from GitHub at startup. The
              # fetch always fails here (no world:443 egress) and added ~15s of
              # cold-start latency — long enough for a probe flap after an image
              # bump (observed on the v4 upgrade). We don't use cost tracking.
              LITELLM_LOCAL_MODEL_COST_MAP: "True"
            probes:
              # Startup probe gates liveness/readiness until the server has
              # actually bound :4000. Without it, liveness fired 15s in and
              # restarted the pod mid-cold-start (the v4-upgrade "connection
              # refused" flaps). Allows up to 30 × 5s = 150s to come up.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: 4000
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: 4000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: 4000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: litellm
        ports:
          http:
            port: 4000
    persistence:
      config:
        type: configMap
        name: litellm-config
        globalMounts:
          - path: /config
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
