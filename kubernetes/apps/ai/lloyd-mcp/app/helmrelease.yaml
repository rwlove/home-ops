---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lloyd-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  # Default Flux timeout is 5m; first install (2026-11-03) timed out — the
  # app container can't start until the `lloyd-mcp-secret` ExternalSecret
  # syncs from 1Password (envFrom, non-optional), and that sync took ~42m on
  # first bootstrap. Both attempts hit 5m and left the HR Stalled /
  # MissingRollbackTarget (no prior good release to roll back to) even though
  # the Deployment became healthy on its own once the secret landed. 15m gives
  # the slow first secret-sync room without affecting steady-state behaviour.
  # See `docs/src/failure_mode_runbooks.md` → "Stalled HelmRelease with
  # MissingRollbackTarget" for the recovery procedure.
  timeout: 15m
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    controllers:
      lloyd-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        type: deployment
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/rwlove/mcp-openapi-proxy
              tag: v0.4.0@sha256:23906c73b605b7d464c21194bb0a4a017b59d464828d332cdd5e44f4970c841e
            # Generic OpenAPI->MCP bridge over SSE (GET/POST /mcp, binds
            # 0.0.0.0:8080). --spec is the hand-authored NocoDB Data-API subset
            # baked in via the configMap below; --base-url overrides the spec's
            # server to the in-cluster NocoDB service. The static xc-token header
            # is injected into every upstream request via REQUEST_HEADERS (from
            # the secret). Bound by the `lloyd` kagent agent.
            env:
              TZ: America/New_York
              OPENAPI_SPEC_URL: file:///spec/nocodb.json
              SERVER_URL_OVERRIDE: http://nocodb.collab.svc.cluster.local:8080
            # REQUEST_HEADERS=xc-token:<api_token> from 1P via the ExternalSecret.
            envFrom:
              - secretRef:
                  name: lloyd-mcp-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: lloyd-mcp
        ports:
          http:
            port: *port
    persistence:
      # Hand-authored OpenAPI spec (configMapGenerator in kustomization.yaml).
      spec:
        type: configMap
        name: lloyd-mcp-spec
        advancedMounts:
          lloyd-mcp:
            app:
              - path: /spec/nocodb.json
                subPath: nocodb.json
                readOnly: true
      # godotenv probes <specdir>/.env on start; give it a writable tmp and keep
      # the root filesystem read-only.
      tmp:
        type: emptyDir
        advancedMounts:
          lloyd-mcp:
            app:
              - path: /tmp
    externalSecrets:
      lloyd-mcp:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: lloyd-mcp-secret
          template:
            data:
              EXTRA_HEADERS: "xc-token: {{ .api_token }}"
        dataFrom:
          - extract:
              key: lloyd-nocodb
    networkpolicies:
      allow:
        type: cilium
        forceRename: lloyd-mcp-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: lloyd-mcp
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # mcp-gateway federation: the Kuadrant broker (mcp-gateway app pod,
          # mcp-system) dials this backend directly over Service DNS to serve the
          # federated tools. ai is default-deny; backend-ingress half of the
          # cross-ns pattern (#15826). No istio-egress (dead, #15834).
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  app.kubernetes.io/name: mcp-gateway
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          # Legacy kagent direct dial (ai ns) — retired at Stage 2.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        egress:
          # -> NocoDB in the collab ns (spec fetch + tool calls), :8080.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: collab
                  app.kubernetes.io/name: nocodb
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
