---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/repos/app-template
resources:
  - ./helmrelease.yaml
  # ReferenceGrant: mcp-system HTTPRoute (gateway federation) -> this ns-ai Service.
  - ./referencegrant.yaml
configMapGenerator:
  - name: lloyd-mcp-spec
    files:
      - nocodb.json=./resources/nocodb.json
generatorOptions:
  disableNameSuffixHash: true
