---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: local-cron-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: local-cron
  # Additive — the ai ns default-deny is what triggers the lockdown; these
  # rules punch holes through it.
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    # Prometheus (observability ns) — READ-ONLY capacity queries for the set_mem_limit
    # doers: node allocatable / cluster free memory, so a proposed limit is checked
    # against LIVE cluster capacity (never hardcoded). Ingress punched through in
    # observability/kube-prometheus-stack/app/cnp-allow.yaml.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # LubeLogger (selfhosted ns) — READ-ONLY for the cooter jobs: the
    # recall-watch reads /api/vehicles, and the weekly service-due digest reads
    # /api/vehicles + /api/vehicle/reminders/all. Both pull vehicle facts at
    # RUNTIME (Viewer API key, x-api-key) so nothing private lives in this
    # public repo. NHTSA recall lookups go out over the world:443 rule below.
    # The INGRESS side is punched through in
    # selfhosted/lubelogger/app/helmrelease.yaml.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: selfhosted
            app.kubernetes.io/name: lubelogger
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # notify-mcp (mcp-system) — themed per-agent HTML email via its /send HTTP
    # route (:8060). All the local-cron digests POST here so the mail gets the
    # shared theme; notify-mcp holds the relay recipient-lock, so this can still
    # only ever email Rob. The INGRESS side is punched through in
    # mcp-system/notify-mcp/app/cnp-allow.yaml.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: notify-mcp
      toPorts:
        - ports:
            - port: "8060"
              protocol: TCP
    # Ollama (ai ns, intra-namespace) — the local-model summarizer. NOT
    # given its own rule here: local-cron and ollama are both in `ai`, so
    # this hop is covered by the baseline `allow-intra-namespace` component.
    # ollama's own cnp-allow.yaml lists cross-ns callers only; intra-ns is
    # explicitly delegated to the baseline there. Reasoning runs on the P40
    # local model (qwen2.5:7b) — NOT Claude/Anthropic (HOMELAB-SPEC L6).
    #
    # External HTTPS: api.github.com (renovate-pr-digest, unauth) and
    # api.nhtsa.gov (cooter recall watch). Both are canonical FQDNs behind a
    # CDN, and Cilium matchPattern silently fails on those through K8s DNS
    # search-domain augmentation (see memory
    # project_cilium_matchpattern_fqdn_limits), so this collapses to world:443.
    # (It formerly also carried the Pushover digest sink; that moved to
    # notify-mcp email 2026-10-15, but world:443 stays for GitHub + NHTSA.)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
