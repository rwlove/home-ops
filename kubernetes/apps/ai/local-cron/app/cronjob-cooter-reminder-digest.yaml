---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-cooter-reminder-digest
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # cooter (vehicle/garage operator) — weekly "service due" watch. Reads the
  # fleet's DUE maintenance reminders from LubeLogger AT RUNTIME (so no private
  # vehicle facts ever live in this PUBLIC repo) and emails Rob ONE message PER
  # due concern via notify-mcp /send (which fronts the guardrailed relay
  # :2526). Silent when nothing is due (same discipline as the recall watch).
  # First real consumer of the agent-notify mail path. Fully deterministic: no
  # LLM, no k8s API. Reminders must be SEEDED in LubeLogger for this to have
  # content; until then every run is ALL CLEAR and sends nothing.
  schedule: "0 8 * * 1"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: digest
              image: docker.io/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                # Flux postBuild envsubst runs STRICT over this manifest: every
                # shell `$` is doubled (`$$`) so the rendered manifest carries a
                # literal `$` for /bin/sh (and for jq vars). A bare `$${VAR}`
                # even in a comment is read as a Flux substitution and fails the
                # whole kustomization. Same convention as recall/triage jobs.
                - |
                  LUBE="http://lubelogger.selfhosted:8080"
                  DAY="$$(date +%Y-%m-%d)"
                  # Hard cap so a pathological reminders response can never blast
                  # mail. The relay also rate-caps at 20/hr, but do not loop
                  # unbounded; truncate and note it if exceeded.
                  MAX=12

                  # --- fleet: id -> "Year Make Model" (fetched at runtime) -----
                  VEH="$$(curl -sS --max-time 30 \
                            -H "x-api-key: $${LUBELOGGER_API_KEY}" \
                            "$$LUBE/api/vehicles")" || {
                    echo "FATAL: LubeLogger /api/vehicles request errored"
                    exit 1
                  }
                  VN="$$(printf '%s' "$$VEH" | jq -r 'if type=="array" then length else "ERR" end' 2>/dev/null || echo ERR)"
                  if [ "$$VN" = "ERR" ]; then
                    echo "FATAL: unexpected /api/vehicles response (auth/API-key?)"
                    printf '%s' "$$VEH" | head -c 300
                    exit 1
                  fi
                  # id<TAB>label lookup table (tolerant of camel/Pascal case).
                  printf '%s' "$$VEH" \
                    | jq -r '.[] | [((.id // .Id)|tostring),
                              (((.year // .Year)|tostring) + " " + (.make // .Make) + " " + (.model // .Model))]
                              | @tsv' > /tmp/fleet.tsv 2>/dev/null || : > /tmp/fleet.tsv

                  # --- reminders: global list across all vehicles --------------
                  # GET /api/vehicle/reminders/all is the API-key-readable list
                  # route (Controllers/API/ReminderController.cs); the per-vehicle
                  # /api/vehicle/reminders carries a CollaboratorFilter and the
                  # /send route is root-only — neither is what we want. Each item
                  # is a ReminderAPIExportModel serialized with camelCase JSON
                  # keys: vehicleId, description, urgency
                  # (NotUrgent|Urgent|VeryUrgent|PastDue), dueDate, dueOdometer,
                  # dueDistance, dueDays.
                  REM="$$(curl -sS --max-time 30 \
                            -H "x-api-key: $${LUBELOGGER_API_KEY}" \
                            "$$LUBE/api/vehicle/reminders/all")" || {
                    echo "FATAL: LubeLogger /api/vehicle/reminders/all request errored"
                    exit 1
                  }
                  RN="$$(printf '%s' "$$REM" | jq -r 'if type=="array" then length else "ERR" end' 2>/dev/null || echo ERR)"
                  if [ "$$RN" = "ERR" ]; then
                    echo "FATAL: unexpected /api/vehicle/reminders/all response (auth/API-key?)"
                    printf '%s' "$$REM" | head -c 300
                    exit 1
                  fi

                  # DUE = the urgent tiers only (drop NotUrgent). Emit one line
                  # per due reminder as tab-separated fields for the shell loop;
                  # write to /tmp so the loop is not a pipe subshell.
                  #
                  # LubeLogger's ReminderAPIExportModel serializes with
                  # camelCase JSON keys (`urgency`, `vehicleId`, `dueDate`, ...),
                  # NOT the PascalCase C# member names. The `urgency` string is
                  # one of NotUrgent | Urgent | VeryUrgent | PastDue. Read the
                  # lowercase key first (fall back to Pascal for safety, same
                  # tolerance as the /api/vehicles block above) and match the
                  # three due tiers by their downcased literal. PastDue is what
                  # the overdue Honda timing-belt reminder carries.
                  printf '%s' "$$REM" | jq -r '
                    .[]
                    | select(((.urgency // .Urgency) // "NotUrgent")
                             | ascii_downcase
                             | (. == "urgent" or . == "veryurgent" or . == "pastdue"))
                    | [ ((.vehicleId // .VehicleId) // ""),
                        ((.urgency // .Urgency) // ""),
                        ((.description // .Description) // ""),
                        ((.dueDate // .DueDate) // ""),
                        ((.dueOdometer // .DueOdometer) // ""),
                        ((.dueDistance // .DueDistance) // ""),
                        ((.dueDays // .DueDays) // "") ]
                    | @tsv' > /tmp/due.tsv 2>/dev/null || : > /tmp/due.tsv

                  # Single-integer total of due lines. `grep -c .` exits non-zero
                  # (and its `|| echo 0` would append a SECOND `0`, yielding the
                  # multi-line `0\n0` that broke the arithmetic below) when the
                  # file is empty, so count with awk which always prints exactly
                  # one number and exits 0.
                  DUE="$$(awk 'NF{n++} END{print n+0}' /tmp/due.tsv 2>/dev/null)"
                  [ -n "$$DUE" ] || DUE=0
                  echo "----- cooter service-due watch ($$VN vehicles, $$RN reminders, $$DUE due) -----"
                  if [ "$$DUE" = "0" ]; then
                    echo "ALL CLEAR — no service due; no email sent"
                    exit 0
                  fi

                  # Cap the number of individual mails; note truncation.
                  TRUNC=0
                  if [ "$$DUE" -gt "$$MAX" ]; then
                    echo "NOTE: $$DUE due reminders exceed cap $$MAX — sending first $$MAX, $$(($$DUE - $$MAX)) truncated"
                    TRUNC=$$(($$DUE - $$MAX))
                    head -n "$$MAX" /tmp/due.tsv > /tmp/due.capped.tsv
                    mv /tmp/due.capped.tsv /tmp/due.tsv
                  fi

                  # --- one email per due concern ------------------------------
                  TAB="$$(printf '\t')"
                  SENT=0
                  FAILED=0
                  while IFS="$$TAB" read -r VID URG DESC DDATE DODO DDIST DDAYS; do
                    [ -z "$$DESC" ] && [ -z "$$VID" ] && continue

                    # Resolve vehicle label from the fleet table; fall back to a
                    # neutral id-based label if not found.
                    VLABEL="$$(awk -F"$$TAB" -v id="$$VID" '$$1==id{print $$2; exit}' /tmp/fleet.tsv)"
                    [ -z "$$VLABEL" ] && VLABEL="vehicle $$VID"

                    # Compose the "due-by" phrase from whichever of date / odo /
                    # distance / days LubeLogger populated.
                    DUEBY=""
                    [ -n "$$DDATE" ] && DUEBY="by $$DDATE"
                    if [ -n "$$DODO" ]; then
                      [ -n "$$DUEBY" ] && DUEBY="$$DUEBY / at $$DODO mi" || DUEBY="at $$DODO mi"
                    fi
                    EXTRA=""
                    [ -n "$$DDAYS" ] && EXTRA="$$DDAYS"
                    if [ -n "$$DDIST" ]; then
                      [ -n "$$EXTRA" ] && EXTRA="$$EXTRA, $$DDIST" || EXTRA="$$DDIST"
                    fi

                    SUBJECT="Cooter: $$VLABEL — $$DESC due"

                    # Plain-text summary to stdout (job log).
                    printf 'DUE  %-24s | %-10s | %s | %s | %s\n' \
                      "$$VLABEL" "$$URG" "$$DESC" "$$DUEBY" "$$EXTRA"

                    # ONE themed HTML email per due concern via notify-mcp /send
                    # (agent=cooter): build a markdown body and let notify-mcp
                    # render it in cooter's theme; it holds the SAME relay
                    # recipient-lock. jq -n escapes the field values safely.
                    BODY="$$(printf '**Vehicle:** %s\n**Item:** %s\n**Urgency:** %s\n**Due by:** %s\n**Remaining:** %s\n\n_Source of truth: LubeLogger — log the service there when done to clear this reminder._' \
                      "$$VLABEL" "$$DESC" "$$URG" "$${DUEBY:--}" "$${EXTRA:--}")"
                    REQ="$$(jq -n --arg s "$$SUBJECT" --arg b "$$BODY" --arg a "cooter" \
                              '{subject:$$s, body:$$b, agent:$$a}')"
                    HTTP="$$(curl -sS --max-time 30 -o /tmp/send.out -w '%{http_code}' \
                              -H 'Content-Type: application/json' -d "$$REQ" \
                              http://notify-mcp.mcp-system:8060/send)"
                    case "$$HTTP" in
                      2??) SENT=$$(($$SENT + 1));;
                      *) echo "FATAL: notify-mcp /send HTTP $$HTTP for '$$SUBJECT'"; cat /tmp/send.out; FAILED=$$(($$FAILED + 1));;
                    esac
                  done < /tmp/due.tsv

                  echo "----- sent $$SENT email(s); $$FAILED failed; $$TRUNC truncated -----"
                  [ "$$FAILED" -eq 0 ] || exit 1
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
              envFrom:
                # LubeLogger Viewer API key — its OWN secret, shared with the
                # recall cron (both are read-only cooter jobs). The triage/skim/
                # doer jobs never see it.
                - secretRef:
                    name: cooter-recall-secret
                    optional: false
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
