---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-crusher-review
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # Weekly medical trend review (kagent tier). Monday 07:00 ET — one hour AFTER
  # the Sheet->Medikeep BP import (medikeep-ingest, Mon 06:00 ET) so it reviews
  # fresh data. It invokes the in-cluster `crusher` agent over A2A (local model,
  # qwen on the Spark via LiteLLM) and asks it to compute, from its READ-ONLY
  # tools (health-mcp bp/dose/planned + weight, memory-mcp for
  # prior context), the trailing BP trend, the weight<->BP correlation, any
  # relation to TRT dose, and any planned/scheduled health action newly coming
  # due (api.v_planned due_soon, surfaced once on state-change — not re-alerted
  # every week), then DELIVERS the short interpretation to Robert as a
  # themed HTML email via notify-mcp (/send) — the same private sink the sibling
  # local-cron digests use; notify-mcp holds the recipient-lock, so it can only
  # email Robert. Unlike the problem-only triage crons this ALWAYS sends the
  # weekly digest; a slow/empty/unreachable agent degrades to a SILENT skipped
  # run (a2a_client never raises) — never a KubeJobFailed page. ALL medical data
  # stays in-cluster except the short interpretation text in the email notify-mcp
  # relays to Robert; never a public sink, never a remote model.
  #
  # LIVE since 2026-10-15 (unsuspended on Robert's approval). Ad-hoc run:
  #   kubectl -n ai create job --from=cronjob/local-cron-crusher-review crusher-review-test
  # verify the notify-mcp email digest + the CRUSHER_REVIEW_RESULT= log line.
  #
  # Kill criteria (per claude-runner-routing): retire if useful-output rate is
  # poor after 2 weeks of live runs, or the digest is noise, or it never surfaces
  # anything acted upon — delete this file + its kustomization entries (Flux prunes).
  suspend: false
  schedule: "0 7 * * 1"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # > the client's 800s A2A budget so the client's graceful timeout fires
      # first and exits 0 (silent), rather than the Job deadline killing it.
      activeDeadlineSeconds: 1000
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: review
              image: docker.io/library/python:3.15
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - exec python3 /app/crusher_review.py
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
                - name: AGENT_URL
                  value: http://crusher.ai:8080/
                - name: AGENT_NAME
                  value: crusher
                - name: TITLE
                  value: crusher trend review
                - name: BUDGET_SECONDS
                  value: "800"
                - name: PROMPT
                  value: >-
                    This is the weekly health trend review. Using ONLY your
                    read-only tools (all on health-mcp), pull the recent
                    blood-pressure series (the `bp` tool), the bodyweight series
                    (the `weight` tool), and the medication/TRT dose history (the
                    `dose` tool). First search memory-mcp
                    for your previous review so you can note what changed since
                    last week. Then assess: (1) the trailing blood-pressure trend
                    over roughly the last 4-8 weeks versus the prior period — is
                    systolic/diastolic rising, falling, or stable; (2) whether body
                    weight and blood pressure move together, and in which
                    direction; (3) whether any BP shift lines up with a TRT or
                    other dose change. Note anything sustained worth raising at the
                    next clinician visit.
                    Then (4) also pull the planned/scheduled health actions
                    (the `planned` tool) and look at rows where
                    due_soon is true (due within ~14 days, or already overdue).
                    For each such item add ONE actionable reminder line of the form
                    "<action> due <due_date> (~<days_until> days)" — overdue if
                    days_until is negative. DIGEST DISCIPLINE: only surface an item
                    the FIRST week it enters the due_soon window (a state change) or
                    if its due_date changed — compare against the planned items you
                    recorded in memory-mcp last week and do NOT re-list an item you
                    already flagged in a prior week. If nothing is newly due_soon,
                    say nothing about reminders (no all-clear line). Never invent a
                    date — every value comes from api.v_planned.
                    Append a one-line concise finding to memory-mcp so next week can
                    diff against it, and record the current due_soon planned items
                    (action + due_date) so next week can tell what is newly due.
              # No envFrom: the notify-mcp email path needs no credentials
              # (notify-mcp holds the recipient-lock). The runner's NOTIFY_URL
              # defaults to http://notify-mcp.mcp-system:8060/send.
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: local-cron-scripts
                defaultMode: 0o555
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
