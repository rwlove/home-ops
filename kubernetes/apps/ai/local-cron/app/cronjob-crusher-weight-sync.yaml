---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-crusher-weight-sync
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # Daily PUMP->Medikeep weight reconcile (kagent tier). 06:30 ET — before the
  # Monday 07:00 trend review (local-cron-crusher-review) so that review reads a
  # Medikeep weight series already aligned with PUMP. It invokes the in-cluster
  # `crusher` agent over A2A (local model on the Spark via LiteLLM) and asks it
  # to run its ONE guarded write tool, upsert_weight (health-mcp-rw), which
  # reconciles the last ~60 days of PUMP bodyweight (source of truth) into
  # Medikeep: it adds new weigh-in dates AND updates any past date whose value
  # was corrected in PUMP. The numeric write is deterministic inside the tool.
  #
  # PROBLEM/CHANGE-ONLY: unlike the weekly review digest, this is SILENT on the
  # routine path (a new daily weigh-in, or nothing to do). It emails Robert via
  # notify-mcp ONLY when a historical value was corrected or an error occurred —
  # the runner gates on the agent's WEIGHT_SYNC sentinel. A slow/empty/
  # unreachable agent degrades to a silent skipped run (a2a_client never raises)
  # — never a KubeJobFailed page; the daily idempotent reconcile self-heals.
  #
  # SHIP SUSPENDED + server DRY_RUN=true (health-mcp-rw). Bring-up:
  #   kubectl -n ai create job --from=cronjob/local-cron-crusher-weight-sync crusher-weight-sync-test
  # read the log's CRUSHER_WEIGHT_SYNC_RESULT= line + the dry-run plan, then set
  # health-mcp-rw UPSERT_WEIGHT_DRY_RUN=false and unsuspend this CronJob.
  #
  # Kill criteria (per claude-runner-routing): retire if it never surfaces a
  # real correction it should and the write path is unused, or it mis-fires —
  # delete this file + its kustomization entries (Flux prunes).
  suspend: false
  schedule: "30 6 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # > the client's 600s A2A budget so the client's graceful timeout fires
      # first and exits 0 (silent), rather than the Job deadline killing it.
      activeDeadlineSeconds: 800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: weight-sync
              image: docker.io/library/python:3.15
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - exec python3 /app/crusher_weight_sync.py
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
                - name: AGENT_URL
                  value: http://crusher.ai:8080/
                - name: AGENT_NAME
                  value: crusher
                - name: TITLE
                  value: crusher weight sync
                - name: BUDGET_SECONDS
                  value: "600"
                - name: PROMPT
                  value: >-
                    This is the daily PUMP->Medikeep weight reconcile. Call your
                    upsert_weight tool exactly once with window_days=60 to
                    reconcile the last ~2 months of PUMP bodyweight (the source
                    of truth) into Medikeep: it adds any new weigh-in dates and,
                    importantly, updates any past date whose value was corrected
                    in PUMP after the fact. The tool performs the deterministic
                    write and returns exact counts (dry_run, creates, updates,
                    skips, errors). Report ONLY the exceptions — the corrected
                    dates and any errors — not the routine daily additions, and
                    finish with the required WEIGHT_SYNC sentinel line.
              # No envFrom: the notify-mcp email path needs no credentials
              # (notify-mcp holds the recipient-lock). NOTIFY_URL defaults to
              # http://notify-mcp.mcp-system:8060/send.
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: local-cron-scripts
                defaultMode: 0o555
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
