---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-homeops-hygiene
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # Autonomous repo-hygiene watcher for the `homeops-operator` kagent agent
  # (read-only, Green tier). Weekly it asks the agent to sweep the home-ops repo
  # + live cluster for API-version drift, missing/wrong schemas, doc-vs-code
  # drift, git-vs-cluster drift, and retirable upstream workarounds, then emails
  # Rob a concise ranked digest of findings (ALL CLEAR → nothing sent). This is
  # the scheduled-pull form and the ONLY way the agent currently reaches Rob —
  # the agent itself has no mail tool; this cron is the auditable glue that does
  # the send (notify-mcp /send -> smtp-relay).
  #
  # Area 5 (retirable workarounds, added 2026-10-31) is the scheduled DISCOVERY
  # half of the `upstream-watcher` skill: the agent flags `# workaround:`
  # annotations whose upstream condition now holds in our pinned version. It
  # ONLY flags candidates — a human runs the skill to author the verified
  # removal PR. Folded into this existing weekly run (not a new agent/cron) per
  # the repo's fewer-moving-parts rule; homeops-operator already binds the
  # read-only github-mcp tools and carries the workaround-resolution skill tag.
  #
  # Findings are PROPOSALS, never same-day-urgent — so there is no Pushover/pager
  # branch (unlike the observability triage): it either emails an FYI digest or
  # stays silent. Opening real PRs from these findings is a separate, higher-trust
  # step (the doer_pipeline path) — deliberately NOT wired here until the agent's
  # findings prove good; see the fleet doer merge-rate caveat.
  #
  # Unsuspended 2026-09-25 (Rob) — the homeops-operator agent's tool-init is
  # healthy (notify-mcp ingress fixed) and it now carries the agent↔MCP CNP
  # reachability audit, so the weekly digest goes live directly. Weekly +
  # ALL-CLEAR suppression keeps the mail surface and the Spark's model load low.
  #
  # Mechanics: the A2A call + the FYI:/ALL CLEAR send-gate live in the shared,
  # tested resources/homeops_hygiene.py (over resources/a2a_client.py); this
  # cron supplies only the domain prompt. Migrated 2026-11-16 off the dead
  # kagent-1.0 per-agent endpoint (`http://homeops-operator.ai:8080/`, removed
  # by kagent's ATE rewrite) onto the controller's shared MCP interface — see
  # resources/a2a_client.py's module docstring. That move also fixes a latent
  # stale-Session bug the old inline script carried: its fixed messageId pinned
  # one eternal Session; a2a_client appends a per-run nonce instead.
  suspend: false
  schedule: "0 8 * * 1"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # A repo-wide sweep drives many github-mcp + cluster tool round-trips on a
      # local model, so this is much slower than the alert triage — give it 30m.
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          # amd64 image; ai ns also has arm64 Spark nodes — pin so the pod
          # can't land on Spark and hit an exec-format error.
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: hygiene
              # Stdlib-only runner (resources/homeops_hygiene.py) — no more
              # curl/jq, so this is the same python image every other
              # kagent-tier local-cron job uses.
              image: docker.io/library/python:3.15@sha256:46837ed3105db0029b6d656816185c6258e3b39690532fb782428e0a5fd76182
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - exec python3 /app/homeops_hygiene.py
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
                - name: AGENT_URL
                  # kagent 1.0 ATE removed the per-agent Service + A2A endpoint;
                  # invocation now goes through the controller's own MCP interface
                  # (kagent-dev/kagent#1160), shared by every agent.
                  value: http://kagent-controller.ai:8083/mcp
                - name: AGENT
                  value: homeops-operator
                - name: AGENT_NAME
                  value: homeops-operator
                - name: TITLE
                  value: homeops hygiene
                - name: BUDGET_SECONDS
                  value: "1700"
                - name: PROMPT
                  value: >-
                    Using your read-only tools, sweep the home-ops repo and the live cluster for repo-hygiene issues in your five areas: (1) deprecated/removed apiVersions vs the versions the cluster serves, (2) missing/wrong/dead yaml-language-server schema lines, (3) docs that no longer match the manifests they describe, (4) git-vs-cluster drift (respecting deliberate Flux suspensions), (5) retirable upstream workarounds — search the repo for the marker `# workaround:`; for each annotation read its upstream link and its remove-when condition, then using ONLY your read-only GitHub tools check whether that condition now holds AND the fix is in the version this repo actually pins (read our pin with get_file_contents; check upstream with get_latest_release and search_pull_requests). Flag an annotation ONLY when you can show both — resolved upstream AND reachable in our pinned version; if you cannot confirm it with read-only tools, do NOT flag it (a false retirement is worse than a missed one). Do NOT open a removal PR yourself — a human runs the upstream-watcher skill to verify and remove; just report the file path and a one-line upstream-resolution evidence. Read AGENTS.md and .agents/instructions/ (including workarounds.md) first for the repo conventions. Report the TOP findings you are confident about (at most 8, but ALWAYS include any area-5 retirement candidate even if it displaces a lower-priority item from areas 1-4), ranked most-actionable first. FORMAT the findings as a markdown bulleted list — one `- ` bullet per finding, each LEADING with the **bold** file path, then `— <one-line problem> -> <one-line proposed fix>`; never a prose paragraph. Do NOT include full diffs. If you find nothing confident, reply with EXACTLY: ALL CLEAR. Otherwise BEGIN your reply with exactly the tag FYI: then the findings list. This is a one-way notification — never ask a question or request confirmation (nobody can reply). Under 3500 characters. You may add a short `##` heading to group the list. Light markdown only — **bold**, `code`, `- bullets`, short `#`/`##` headings, [links](url) — it is rendered into a themed HTML email; do not use tables or images.
              # No secrets: the digest reaches Rob via notify-mcp /send (which
              # holds the recipient) and has no Pushover branch.
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: local-cron-scripts
                defaultMode: 0o555
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
