---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-homeops-hygiene
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # Autonomous repo-hygiene watcher for the `homeops-operator` kagent agent
  # (read-only, Green tier). Weekly it asks the agent to sweep the home-ops repo
  # + live cluster for API-version drift, missing/wrong schemas, doc-vs-code
  # drift, and git-vs-cluster drift, then emails Rob a concise ranked digest of
  # findings (ALL CLEAR → nothing sent). This is the scheduled-pull form and the
  # ONLY way the agent currently reaches Rob — the agent itself has no mail tool;
  # this cron is the auditable glue that does the send (notify.sh → smtp-relay).
  #
  # Findings are PROPOSALS, never same-day-urgent — so there is no Pushover/pager
  # branch (unlike the observability triage): it either emails an FYI digest or
  # stays silent. Opening real PRs from these findings is a separate, higher-trust
  # step (the doer_pipeline path) — deliberately NOT wired here until the agent's
  # findings prove good; see the fleet doer merge-rate caveat.
  #
  # SHIPPED SUSPENDED: manual-test one run, verify the digest, then drop
  # `suspend: true` in a follow-up. Weekly + ALL-CLEAR suppression keeps the mail
  # surface and the Spark's model load low.
  suspend: true
  schedule: "0 8 * * 1"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # A repo-wide sweep drives many github-mcp + cluster tool round-trips on a
      # local model, so this is much slower than the alert triage — give it 30m.
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          # amd64 image; ai ns also has arm64 Spark nodes — pin so the pod
          # can't land on Spark and hit an exec-format error.
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: hygiene
              # Carries curl + jq. Same image the other local-cron jobs use.
              image: docker.io/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                # Flux postBuild runs envsubst in STRICT mode over this manifest:
                # a bare ${VAR} is read as a Flux substitution and fails the whole
                # Kustomization. Every shell `$` is doubled (`$$`) so the rendered
                # manifest carries a literal `$` for /bin/sh. Same convention as
                # cronjob-observability-triage.yaml.
                - |
                  # homeops-operator agent A2A endpoint (intra-namespace; the ai
                  # baseline allow-intra-namespace covers this hop, same as the
                  # observability-operator call in the obs triage job).
                  AGENT="http://homeops-operator.ai:8080/"
                  DAY="$$(date -u +%Y-%m-%d)"

                  # Ask the agent (read-only, Green tier) to sweep and report a
                  # concise ranked digest. jq -n builds the A2A message/send body
                  # so the prompt is safely JSON-escaped.
                  REQ="$$(jq -n '{
                    jsonrpc:"2.0", id:1, method:"message/send",
                    params:{ message:{
                      role:"user",
                      parts:[{kind:"text", text:"Using your read-only tools, sweep the home-ops repo and the live cluster for repo-hygiene issues in your four areas: (1) deprecated/removed apiVersions vs the versions the cluster serves, (2) missing/wrong/dead yaml-language-server schema lines, (3) docs that no longer match the manifests they describe, (4) git-vs-cluster drift (respecting deliberate Flux suspensions). Read AGENTS.md and .agents/instructions/ first for the repo conventions. Report the TOP findings you are confident about (at most 8), ranked most-actionable first; for each give: file path, the one-line problem, and the one-line proposed fix. Do NOT include full diffs. If you find nothing confident, reply with EXACTLY: ALL CLEAR. Otherwise BEGIN your reply with exactly the tag FYI: then the findings list. This is a one-way notification — never ask a question or request confirmation (nobody can reply). Plain text, no markdown, under 3500 characters."}],
                      messageId:"homeops-hygiene-cron", kind:"message"
                    }}
                  }')"

                  RESP="$$(curl -sS --max-time 1700 -X POST "$$AGENT" \
                            -H 'Content-Type: application/json' \
                            -H 'Accept: application/json, text/event-stream' \
                            -d "$$REQ")" || {
                    echo "FATAL: agent A2A call errored"
                    exit 1
                  }

                  # A2A returns a task; the answer is in result.artifacts[].parts[]
                  # or result.status.message.parts[]. Take the last text part.
                  TEXT="$$(printf '%s' "$$RESP" | jq -r '
                    [ (.result.artifacts[]?.parts[]? // empty),
                      (.result.status.message.parts[]? // empty) ]
                    | map(select(.kind=="text") | .text) | last // empty')"
                  STATE="$$(printf '%s' "$$RESP" | jq -r '.result.status.state // "?"')"

                  if [ -z "$$TEXT" ]; then
                    echo "FATAL: no agent text (state=$$STATE)"
                    printf '%s' "$$RESP" | head -c 600
                    exit 1
                  fi

                  echo "----- homeops-operator hygiene sweep (state=$$STATE) -----"
                  printf '%s\n' "$$TEXT"

                  # ALL CLEAR -> silent; anything else -> ONE FYI email. Findings
                  # are Internal-tier repo state (public repo + cluster paths) —
                  # fine for the guardrailed agent-notify relay (recipient-locked
                  # to Rob). No pager branch: repo hygiene is never same-day-urgent.
                  case "$$TEXT" in
                    *"ALL CLEAR"*) echo "ALL CLEAR — nothing sent"; exit 0;;
                  esac

                  # Email via the shared guarded relay (notify.sh -> smtp-relay
                  # :2526). Plain text on stdin; 3800-char cap keeps it terse.
                  MSG="$$(printf '%s' "$$TEXT" | cut -c1-3800)"
                  if printf '%s\n' "$$MSG" | sh /opt/notify/notify.sh \
                       --subject "kagent homeops hygiene (FYI) $${DAY}"; then
                    echo "FYI digest emailed"
                  else
                    echo "FATAL: notify.sh failed"
                    exit 1
                  fi
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
                # notify.sh's From address (agents@$SECRET_DOMAIN); the relay
                # rewrites the envelope sender regardless. Injected via Flux
                # postBuild var.
                - name: SECRET_DOMAIN
                  value: "${SECRET_DOMAIN}"
              envFrom:
                # Supplies AGENT_NOTIFY_RCPT (the recipient notify.sh sends to).
                - secretRef:
                    name: local-cron-secret
                    optional: false
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                # Shared notify.sh helper (configMapGenerator `notify`), mounted
                # read-only. Invoked as `sh /opt/notify/notify.sh`.
                - name: notify
                  mountPath: /opt/notify
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
            - name: notify
              configMap:
                name: notify
