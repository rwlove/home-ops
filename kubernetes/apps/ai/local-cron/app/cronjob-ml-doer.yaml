---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-ml-doer
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # Write-gate DOER (PR-only) for ML/inference. Same deterministic pipeline;
  # ALLOWED_ACTIONS=set_mem_limit. Asks the read-only ml-operator (on the strong
  # group) to find an inference/ML app that is OOMing and propose raising its memory
  # limit; the pipeline validates + applies an INCREASE-only minimal edit + opens a PR
  # + NEVER merges. Ships SUSPENDED — set_mem_limit is a new applier; unsuspend after a
  # manual test produced a clean PR:
  #   kubectl -n ai create job --from=cronjob/local-cron-ml-doer ml-doer-test
  suspend: true
  schedule: "20 9 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: doer
              image: docker.io/library/python:3.12
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - |
                  pip install --quiet --no-cache-dir --target /tmp/pylib 'ruamel.yaml>=0.18,<0.19'
                  exec python3 /app/doer_pipeline.py
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
                - name: PYTHONPATH
                  value: /tmp/pylib
                - name: AGENT_URL
                  value: http://ml-operator.ai:8080/
                - name: AGENT_NAME
                  value: ml
                - name: ALLOWED_ACTIONS
                  value: set_mem_limit
                - name: REPO
                  value: rwlove/home-ops
                - name: PATH_PREFIX
                  value: kubernetes/apps/
                - name: GIT_USER_NAME
                  value: kagent-doer
                - name: GIT_USER_EMAIL
                  value: kagent-doer@users.noreply.github.com
                - name: DOER_PROMPT
                  value: |
                    Using your read-only tools (Prometheus especially), find ONE
                    inference/ML app that is OOMing — an OOMKilled restart, or memory
                    usage pinned at its container limit. Give a terse triage first.
                    THEN, only if one app clearly needs more headroom, append a fenced
                    ```json block with EXACTLY these keys:
                    {"action":"set_mem_limit","target":"<app / HelmRelease name>","new_value":"<a larger memory quantity like 4Gi>","rationale":"<one sentence>"}.
                    Only INCREASE a limit (never reduce), and only for a single-container
                    app you can name confidently. If nothing clearly needs it, emit NO
                    json block. Never propose deletions, reductions, or scaling changes.
              envFrom:
                - secretRef:
                    name: local-cron-secret
                    optional: false
                - secretRef:
                    name: kagent-doer-secret
                    optional: false
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: doer-pipeline
                defaultMode: 0o555
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
