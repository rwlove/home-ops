---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-network-drift
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # Network source-of-truth reconciliation for the `network-operator` kagent
  # agent (read-only, Green tier). Weekly it asks the agent to reconcile the two
  # records-of-record — NetBox (IPAM/DCIM) and the lovenet-network-configuration
  # repo — against LIVE reality (Omada + Cilium + Kubernetes), then emails Rob a
  # concise drift digest (ALL CLEAR → nothing sent). Detect-only Phase 1: findings
  # are PROPOSALS (NetBox/repo writes are human/higher-tier), same discipline as
  # the homeops-hygiene digest. No Pushover/pager branch — drift is never
  # same-day-urgent.
  #
  # Shipped SUSPENDED: the github-mcp token's access to the PRIVATE
  # `lovenet-network-configuration` repo is unverified — manual-test one run
  # (confirm both records are readable + the drift report is sane), then drop
  # `suspend: true`. If the repo is unreadable the agent reports that as a finding.
  suspend: true
  schedule: "0 8 * * 2"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # NetBox + repo + live reconciliation drives many tool round-trips on a
      # local model — give it 30m like the homeops sweep.
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          # amd64 image; ai ns also has arm64 Spark nodes — pin so the pod
          # can't land on Spark and hit an exec-format error.
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: drift
              # Carries curl + jq. Same image the other local-cron jobs use.
              image: docker.io/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                # Flux postBuild runs envsubst in STRICT mode over this manifest:
                # a bare ${VAR} is read as a Flux substitution and fails the whole
                # Kustomization. Every shell `$` is doubled (`$$`) so the rendered
                # manifest carries a literal `$` for /bin/sh. Same convention as
                # cronjob-homeops-hygiene.yaml.
                - |
                  # network-operator agent A2A endpoint (intra-namespace; the ai
                  # baseline allow-intra-namespace covers this hop).
                  AGENT="http://network-operator.ai:8080/"
                  DAY="$$(date -u +%Y-%m-%d)"

                  # Ask the agent (read-only, Green tier) to reconcile the two
                  # records-of-record against live reality. jq -n builds the A2A
                  # message/send body so the prompt is safely JSON-escaped.
                  REQ="$$(jq -n '{
                    jsonrpc:"2.0", id:1, method:"message/send",
                    params:{ message:{
                      role:"user",
                      parts:[{kind:"text", text:"Using your read-only tools, reconcile the network'"'"'s two records-of-record against LIVE reality and report DRIFT. (1) NetBox (netbox-mcp) vs the live network — Omada devices/APs/VLANs/clients + Cilium BGP peers/advertised routes + Kubernetes gateway/LoadBalancer/DNS: flag any device, VLAN, prefix, IP, interface, or AP where reality and NetBox disagree (missing on either side, or a different value). (2) The lovenet-network-configuration repo (github-mcp, owner rwlove, repo lovenet-network-configuration) vs live reality: flag any declared network config that no longer matches. Report the TOP drifts you are confident about (at most 8), most-actionable first; for each give: the object, what REALITY shows, what the RECORD shows, and the exact correction you propose — mark every NetBox or repo change human-only (you are read-only on both). If you CANNOT read a record (e.g. the github token lacks access to the private repo, or NetBox is unreachable), report that as a finding — do not silently skip it. If both records match reality with nothing to correct, reply with EXACTLY: ALL CLEAR. Otherwise BEGIN your reply with exactly the tag FYI: then the drift list. This is a one-way notification — never ask a question or request confirmation (nobody can reply). Under 3500 characters. You may use light markdown — **bold**, `code`, `- bullets`, short `#`/`##` headings, [links](url) — it is rendered into a themed HTML email; do not use tables or images."}],
                      messageId:"network-drift-cron", kind:"message"
                    }}
                  }')"

                  RESP="$$(curl -sS --max-time 1700 -X POST "$$AGENT" \
                            -H 'Content-Type: application/json' \
                            -H 'Accept: application/json, text/event-stream' \
                            -d "$$REQ")" || {
                    echo "FATAL: agent A2A call errored"
                    exit 1
                  }

                  # A2A returns a task; the answer is in result.artifacts[].parts[]
                  # or result.status.message.parts[]. Take the last text part.
                  TEXT="$$(printf '%s' "$$RESP" | jq -r '
                    [ (.result.artifacts[]?.parts[]? // empty),
                      (.result.status.message.parts[]? // empty) ]
                    | map(select(.kind=="text") | .text) | last // empty')"
                  STATE="$$(printf '%s' "$$RESP" | jq -r '.result.status.state // "?"')"

                  if [ -z "$$TEXT" ]; then
                    echo "FATAL: no agent text (state=$$STATE)"
                    printf '%s' "$$RESP" | head -c 600
                    exit 1
                  fi

                  echo "----- network-operator drift reconcile (state=$$STATE) -----"
                  printf '%s\n' "$$TEXT"

                  # ALL CLEAR -> silent; anything else -> ONE FYI email. Drift is
                  # Internal-tier network state — fine for the recipient-locked
                  # agent-notify relay. No pager branch: drift is never urgent.
                  case "$$TEXT" in
                    *"ALL CLEAR"*) echo "ALL CLEAR — nothing sent"; exit 0;;
                  esac

                  # ONE themed, per-agent HTML email via notify-mcp /send (agent
                  # theme = network). jq -n escapes the body safely; 3800-char cap.
                  MSG="$$(printf '%s' "$$TEXT" | cut -c1-3800)"
                  REQ="$$(jq -n --arg s "network drift — $${DAY}" \
                                --arg b "$$MSG" --arg a "network-operator" \
                            '{subject:$$s, body:$$b, agent:$$a}')"
                  HTTP="$$(curl -sS --max-time 30 -o /tmp/send.out -w '%{http_code}' \
                            -H 'Content-Type: application/json' -d "$$REQ" \
                            http://notify-mcp.mcp-system:8060/send)" || {
                    echo "FATAL: notify-mcp /send request errored"
                    exit 1
                  }
                  case "$$HTTP" in
                    2??) echo "themed drift digest emailed (HTTP $$HTTP)";;
                    *) echo "FATAL: notify-mcp /send returned HTTP $$HTTP"; cat /tmp/send.out; exit 1;;
                  esac
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
              # No secrets: the digest reaches Rob via notify-mcp /send (which
              # holds the recipient) and has no Pushover branch.
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
