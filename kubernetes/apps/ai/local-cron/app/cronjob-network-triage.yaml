---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-network-triage
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # Autonomous in-cluster-network watcher. Every 6h it asks the kagent
  # `network-operator` agent (read-only, local qwen) to check BGP / policy-drops
  # / cert-expiry / DNS / gateway health and propose next steps, then pages ONLY
  # when notable ("ALL CLEAR" → no Pushover). :45 slot — staggered off the other
  # every-6h watchers. Scope is in-cluster only; Omada/AP/VLAN are out of scope.
  schedule: "45 */6 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: triage
              image: docker.io/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                # Flux postBuild envsubst runs STRICT over this manifest: every
                # shell `$` is doubled (`$$`) so the rendered manifest carries a
                # literal `$` for /bin/sh. Same convention as the sibling jobs.
                - |
                  AGENT="http://network-operator.ai:8080/"
                  DAY="$$(date -u +%Y-%m-%d)"

                  REQ="$$(jq -n '{
                    jsonrpc:"2.0", id:1, method:"message/send",
                    params:{ message:{
                      role:"user",
                      parts:[{kind:"text", text:"Using your read-only tools, check both network layers. In-cluster: Cilium BGP peering and advertised routes, CiliumNetworkPolicy drop signal (by protocol/endpoint), cert-manager Certificates inside or past their renewal window, DNS health, gateway/LoadBalancer reachability. Physical (read-only, Omada): AP/gateway/WAN health, flapping or rogue APs, WAN degradation, active threats, and recent site alerts. Triage the notable ones: for each, say whether it is a real loss or a known benign artifact (restart/ARP/QUIC/reconcile), the likely cause, and the single next step you would propose (flag anything that points at physical/core infra as human-only). If any of your tools errors or times out, do NOT emit generic troubleshooting steps or ask for more information — nobody can reply. Diagnose the failure yourself with your OTHER read-only tools (the failing component's pod health, recent events, logs, and related metrics) and report the SPECIFIC finding: which tool / service / datasource failed, the exact error, and what your own check showed. A failed tool is something to investigate, never to hand back. Classify overall urgency and BEGIN your reply with exactly one tag: URGENT: for a finding needing same-day attention (real outage, data-loss risk, or safety issue), or FYI: for something noteworthy but not urgent (worth knowing, no rush). If nothing is notable, reply with EXACTLY: ALL CLEAR (no tag). After the tag, state findings and the single proposed next step as declaratives. This is a one-way notification — never ask a question or request confirmation (nobody can reply). Keep the entire reply under 900 characters. You may use light markdown — **bold**, `code`, `- bullets`, short `#`/`##` headings, [links](url) — it is rendered into a themed HTML email; do not use tables or images."}],
                      messageId:"triage-cron", kind:"message"
                    }}
                  }')"

                  RESP="$$(curl -sS --max-time 400 -X POST "$$AGENT" \
                            -H 'Content-Type: application/json' \
                            -H 'Accept: application/json, text/event-stream' \
                            -d "$$REQ")" || {
                    echo "FATAL: agent A2A call errored"
                    exit 1
                  }

                  TEXT="$$(printf '%s' "$$RESP" | jq -r '
                    [ (.result.artifacts[]?.parts[]? // empty),
                      (.result.status.message.parts[]? // empty) ]
                    | map(select(.kind=="text") | .text) | last // empty')"
                  STATE="$$(printf '%s' "$$RESP" | jq -r '.result.status.state // "?"')"

                  if [ -z "$$TEXT" ]; then
                    echo "FATAL: no agent text (state=$$STATE)"
                    printf '%s' "$$RESP" | head -c 600
                    exit 1
                  fi

                  echo "----- network-operator triage (state=$$STATE) -----"
                  printf '%s\n' "$$TEXT"

                  # Route by urgency tag (the agent begins its reply with one):
                  #   ALL CLEAR -> silent (nothing sent)
                  #   URGENT:   -> Pushover pager (same-day-urgent)
                  #   otherwise (FYI / noteworthy-not-urgent) -> themed email via notify-mcp /send
                  # Triage findings are Internal-tier cluster state (namespace /
                  # app names) — fine for the private Pushover channel AND for the
                  # guardrailed agent-notify relay (recipient-locked to Rob). The
                  # FYI path was previously Pushover-only; routing it to mail keeps
                  # the pager reserved for genuinely same-day-urgent signal.
                  case "$$TEXT" in
                    *"ALL CLEAR"*) echo "ALL CLEAR — nothing sent"; exit 0;;
                  esac

                  # Positive gate (inbox-spam fix): only output carrying a
                  # recognized urgency tag may reach a sink. Anything else —
                  # untagged local-model garbage, a wrong-language reply, or a
                  # tool-init error string ("failed to extract tools" / "session
                  # not found") — is malformed; log a snippet and exit clean so a
                  # bad run can NEVER notify Rob. (ALL CLEAR handled above.)
                  case "$$TEXT" in
                    *"URGENT:"*|*"FYI:"*) : ;;
                    *)
                      echo "no URGENT:/FYI: tag — malformed agent output, not notifying"
                      printf '%s\n' "$$TEXT" | head -c 300 || true
                      exit 0
                      ;;
                  esac

                  # 1000-char cap (Pushover limit; also keeps the mail terse).
                  MSG="$$(printf '%s' "$$TEXT" | cut -c1-1000)"

                  case "$$TEXT" in
                    *"URGENT:"*)
                      # Same-day-urgent -> ONE Pushover notification (pager sink).
                      HTTP="$$(curl -sS --max-time 30 -o /tmp/pushover.out -w '%{http_code}' \
                                --form-string "token=$${PUSHOVER_TOKEN}" \
                                --form-string "user=$${PUSHOVER_USER}" \
                                --form-string "title=kagent network triage (URGENT) $${DAY}" \
                                --form-string "message=$${MSG}" \
                                https://api.pushover.net/1/messages.json)" || {
                        echo "FATAL: Pushover request errored"
                        exit 1
                      }
                      case "$$HTTP" in
                        2??) echo "Pushover pager sent (HTTP $$HTTP)";;
                        *) echo "FATAL: Pushover returned HTTP $$HTTP"; cat /tmp/pushover.out; exit 1;;
                      esac
                      ;;
                    *)
                      # Noteworthy-not-urgent -> ONE themed, per-agent HTML email
                      # via notify-mcp /send. It renders the markdown body in this
                      # agent's theme and holds the SAME relay recipient-lock, so it
                      # can still only ever email Rob. jq -n builds the JSON body so
                      # the finding is safely escaped.
                      REQ="$$(jq -n --arg s "network triage — $${DAY}" \
                                    --arg b "$$TEXT" --arg a "network-operator" \
                                '{subject:$$s, body:$$b, agent:$$a}')"
                      HTTP="$$(curl -sS --max-time 30 -o /tmp/send.out -w '%{http_code}' \
                                -H 'Content-Type: application/json' -d "$$REQ" \
                                http://notify-mcp.mcp-system:8060/send)" || {
                        echo "FATAL: notify-mcp /send request errored"
                        exit 1
                      }
                      case "$$HTTP" in
                        2??) echo "themed FYI emailed (HTTP $$HTTP)";;
                        *) echo "FATAL: notify-mcp /send returned HTTP $$HTTP"; cat /tmp/send.out; exit 1;;
                      esac
                      ;;
                  esac
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
              envFrom:
                - secretRef:
                    name: local-cron-secret
                    optional: false
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
