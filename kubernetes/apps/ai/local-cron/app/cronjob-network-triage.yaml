---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-network-triage
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # Autonomous in-cluster-network watcher. Every 6h it asks the kagent
  # `network-operator` agent (read-only, local qwen) to check BGP / policy-drops
  # / cert-expiry / DNS / gateway health and propose next steps, then pages ONLY
  # when notable ("ALL CLEAR" → silent). :45 slot — staggered off the other
  # every-6h watchers. Scope is in-cluster only; Omada/AP/VLAN are out of scope.
  #
  # The A2A call + send-gate live in the shared /app/triage_run.py (poll-to-
  # terminal a2a_client): a slow/empty agent degrades to a SILENT skipped run
  # instead of a KubeJobFailed page. This cron supplies only the domain prompt.
  schedule: "45 */6 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      # 900s (> the client's 800s budget) so the client's own graceful timeout
      # fires first and exits 0 (silent), rather than the Job deadline killing it.
      activeDeadlineSeconds: 2100
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: triage
              image: docker.io/library/python:3.14
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - exec python3 /app/triage_run.py
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
                - name: AGENT_URL
                  value: http://network-operator.ai:8080/
                - name: AGENT_NAME
                  value: network-operator
                - name: TITLE
                  value: network triage
                - name: BUDGET_SECONDS
                  value: "800"
                - name: PROMPT
                  value: >-
                    Using your read-only tools, check both network layers.
                    In-cluster: Cilium BGP peering and advertised routes,
                    CiliumNetworkPolicy drop signal (by protocol/endpoint),
                    cert-manager Certificates inside or past their renewal
                    window, DNS health, gateway/LoadBalancer reachability.
                    Physical (read-only, Omada): AP/gateway/WAN health, flapping
                    or rogue APs, WAN degradation, active threats, and recent
                    site alerts. Triage the notable ones: for each, say whether
                    it is a real loss or a known benign artifact
                    (restart/ARP/QUIC/reconcile), the likely cause, and the
                    single next step you would propose (flag anything that
                    points at physical/core infra as human-only).
              envFrom:
                - secretRef:
                    name: local-cron-secret
                    optional: false
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: local-cron-scripts
                defaultMode: 0o555
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
