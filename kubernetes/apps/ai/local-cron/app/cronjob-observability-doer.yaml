---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-observability-doer
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # Write-gate DOER (PR-only) for observability — second domain after storage. Same
  # deterministic pipeline (doer_pipeline.py); ALLOWED_ACTIONS=set_for. It asks the
  # read-only observability-operator (on the 35B) to find a flapping alert rule that
  # lacks a `for:` clause and propose adding one; the pipeline validates + applies a
  # minimal edit (add/lengthen the rule's `for:`) + opens a PR + NEVER merges.
  #
  # LIVE as of 2026-09-23 — set_for verified end-to-end (controlled test opened a clean
  # PR; the semantic-noop fix in home-ops#14390 prevents cosmetic quote churn). Opens a
  # PR ONLY when it finds a flapping rule that genuinely needs a `for:`; silent/Pushover
  # otherwise. To pause without tearing down, set `suspend: true`.
  suspend: false
  schedule: "40 8 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: doer
              # Full python image (has git via buildpack-deps); -slim would break the clone.
              image: docker.io/library/python:3.12
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - |
                  pip install --quiet --no-cache-dir --target /tmp/pylib 'ruamel.yaml>=0.18,<0.19'
                  exec python3 /app/doer_pipeline.py
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
                - name: PYTHONPATH
                  value: /tmp/pylib
                - name: AGENT_URL
                  value: http://observability-operator.ai:8080/
                - name: AGENT_NAME
                  value: observability
                - name: ALLOWED_ACTIONS
                  value: set_for
                - name: REPO
                  value: rwlove/home-ops
                - name: PATH_PREFIX
                  value: kubernetes/apps/
                - name: GIT_USER_NAME
                  value: kagent-doer
                - name: GIT_USER_EMAIL
                  value: kagent-doer@users.noreply.github.com
                - name: DOER_PROMPT
                  value: |
                    Using your read-only tools, look for a PrometheusRule alert that flaps
                    because it lacks a `for:` clause (or has one shorter than 5m) on a metric
                    that can be transient. Give a terse triage first. THEN, only if there is a
                    clearly-flapping rule that should have a longer `for:`, append a fenced
                    ```json block with EXACTLY these keys:
                    {"action":"set_for","target":"<alert name>","new_value":"<duration like 5m>","rationale":"<one sentence>"}.
                    Only ADD or LENGTHEN a for: clause (never shorten it, never below 5m). If
                    nothing clearly needs it, emit NO json block. Never propose deleting,
                    muting, or disabling a rule or receiver.
              envFrom:
                - secretRef:
                    name: local-cron-secret
                    optional: false
                - secretRef:
                    name: kagent-doer-secret
                    optional: false
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: doer-pipeline
                defaultMode: 0o555
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
