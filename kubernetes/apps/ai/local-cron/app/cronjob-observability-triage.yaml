---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-observability-triage
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # Phase 3d — autonomous observability watcher. Every 6h it asks the
  # kagent `observability-operator` agent (read-only, local qwen) to triage
  # currently firing/flapping alerts and propose next steps, then pages ONLY
  # when there's something notable ("ALL CLEAR" → no Pushover). This is the
  # scheduled-pull form; an AlertManager-webhook push form is a later upgrade.
  # Governed by the claude-runner trial policy — re-add `suspend: true` to
  # pause without tearing down. 6h cadence + ALL-CLEAR suppression keeps the
  # notification surface (and P40 load) low.
  schedule: "0 */6 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # The only slow leg is the agent's local-model inference (~1-2 min on
      # the P40, plus its tool round-trips). 10 min is a comfortable cap.
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          # amd64 image; ai ns also has arm64 Spark nodes — pin so the pod
          # can't land on Spark and hit an exec-format error.
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: triage
              # Carries curl + jq. Same image the other local-cron jobs use.
              image: docker.io/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                # Flux postBuild runs envsubst in STRICT mode over this
                # manifest: a bare ${VAR} is read as a Flux substitution and
                # fails the whole Kustomization. Every shell `$` is doubled
                # (`$$`) so the rendered manifest carries a literal `$` for
                # /bin/sh. Same convention as cronjob-loki-error-skim.yaml.
                - |
                  # observability-operator agent A2A endpoint (intra-namespace;
                  # the ai baseline allow-intra-namespace covers this hop, same
                  # as the ollama call in the loki-error-skim job).
                  AGENT="http://observability-operator.ai:8080/"
                  DAY="$$(date -u +%Y-%m-%d)"

                  # Ask the agent (read-only, local qwen) to triage current
                  # alerts using its own tools. jq -n builds the A2A
                  # message/send body so the prompt is safely JSON-escaped.
                  REQ="$$(jq -n '{
                    jsonrpc:"2.0", id:1, method:"message/send",
                    params:{ message:{
                      role:"user",
                      parts:[{kind:"text", text:"Using your read-only tools, check the cluster for alerts that are currently firing or flapping. Triage the notable ones: for each, say whether it is a real signal or transient noise, the likely cause, and the single next step you would propose. If any of your tools errors or times out, do NOT emit generic troubleshooting steps or ask for more information — nobody can reply. Diagnose the failure yourself with your OTHER read-only tools (the failing component's pod health, recent events, logs, and related metrics) and report the SPECIFIC finding: which tool / service / datasource failed, the exact error, and what your own check showed. A failed tool is something to investigate, never to hand back. Classify overall urgency and BEGIN your reply with exactly one tag: URGENT: for a finding needing same-day attention (real outage, data-loss risk, or safety issue), or FYI: for something noteworthy but not urgent (worth knowing, no rush). If nothing is notable, reply with EXACTLY: ALL CLEAR (no tag). After the tag, state findings and the single proposed next step as declaratives. This is a one-way notification — never ask a question or request confirmation (nobody can reply). Keep the entire reply under 900 characters. You may use light markdown — **bold**, `code`, `- bullets`, short `#`/`##` headings, [links](url) — it is rendered into a themed HTML email; do not use tables or images."}],
                      messageId:"triage-cron", kind:"message"
                    }}
                  }')"

                  RESP="$$(curl -sS --max-time 400 -X POST "$$AGENT" \
                            -H 'Content-Type: application/json' \
                            -H 'Accept: application/json, text/event-stream' \
                            -d "$$REQ")" || {
                    echo "FATAL: agent A2A call errored"
                    exit 1
                  }

                  # A2A returns a task; the answer is in result.artifacts[].parts[]
                  # or result.status.message.parts[]. Take the last text part.
                  TEXT="$$(printf '%s' "$$RESP" | jq -r '
                    [ (.result.artifacts[]?.parts[]? // empty),
                      (.result.status.message.parts[]? // empty) ]
                    | map(select(.kind=="text") | .text) | last // empty')"
                  STATE="$$(printf '%s' "$$RESP" | jq -r '.result.status.state // "?"')"

                  if [ -z "$$TEXT" ]; then
                    echo "FATAL: no agent text (state=$$STATE)"
                    printf '%s' "$$RESP" | head -c 600
                    exit 1
                  fi

                  echo "----- observability-operator triage (state=$$STATE) -----"
                  printf '%s\n' "$$TEXT"

                  # Route by urgency tag (the agent begins its reply with one):
                  #   ALL CLEAR -> silent (nothing sent)
                  #   URGENT:   -> Pushover pager (same-day-urgent)
                  #   otherwise (FYI / noteworthy-not-urgent) -> themed email via notify-mcp /send
                  # Triage findings are Internal-tier cluster state (namespace /
                  # app names) — fine for the private Pushover channel AND for the
                  # guardrailed agent-notify relay (recipient-locked to Rob). The
                  # FYI path was previously Pushover-only; routing it to mail keeps
                  # the pager reserved for genuinely same-day-urgent signal.
                  case "$$TEXT" in
                    *"ALL CLEAR"*) echo "ALL CLEAR — nothing sent"; exit 0;;
                  esac

                  # Positive gate (inbox-spam fix): only output carrying a
                  # recognized urgency tag may reach a sink. Anything else —
                  # untagged local-model garbage, a wrong-language reply, or a
                  # tool-init error string ("failed to extract tools" / "session
                  # not found") — is malformed; log a snippet and exit clean so a
                  # bad run can NEVER notify Rob. (ALL CLEAR handled above.)
                  case "$$TEXT" in
                    *"URGENT:"*|*"FYI:"*) : ;;
                    *)
                      echo "no URGENT:/FYI: tag — malformed agent output, not notifying"
                      printf '%s\n' "$$TEXT" | head -c 300 || true
                      exit 0
                      ;;
                  esac

                  # 1000-char cap (Pushover limit; also keeps the mail terse).
                  MSG="$$(printf '%s' "$$TEXT" | cut -c1-1000)"

                  case "$$TEXT" in
                    *"URGENT:"*)
                      # Same-day-urgent -> ONE Pushover notification (pager sink).
                      HTTP="$$(curl -sS --max-time 30 -o /tmp/pushover.out -w '%{http_code}' \
                                --form-string "token=$${PUSHOVER_TOKEN}" \
                                --form-string "user=$${PUSHOVER_USER}" \
                                --form-string "title=kagent obs triage (URGENT) $${DAY}" \
                                --form-string "message=$${MSG}" \
                                https://api.pushover.net/1/messages.json)" || {
                        echo "FATAL: Pushover request errored"
                        exit 1
                      }
                      case "$$HTTP" in
                        2??) echo "Pushover pager sent (HTTP $$HTTP)";;
                        *) echo "FATAL: Pushover returned HTTP $$HTTP"; cat /tmp/pushover.out; exit 1;;
                      esac
                      ;;
                    *)
                      # Noteworthy-not-urgent -> ONE themed, per-agent HTML email
                      # via notify-mcp /send. It renders the markdown body in this
                      # agent's theme and holds the SAME relay recipient-lock, so it
                      # can still only ever email Rob. jq -n builds the JSON body so
                      # the finding is safely escaped.
                      REQ="$$(jq -n --arg s "obs triage — $${DAY}" \
                                    --arg b "$$TEXT" --arg a "observability-operator" \
                                '{subject:$$s, body:$$b, agent:$$a}')"
                      HTTP="$$(curl -sS --max-time 30 -o /tmp/send.out -w '%{http_code}' \
                                -H 'Content-Type: application/json' -d "$$REQ" \
                                http://notify-mcp.mcp-system:8060/send)" || {
                        echo "FATAL: notify-mcp /send request errored"
                        exit 1
                      }
                      case "$$HTTP" in
                        2??) echo "themed FYI emailed (HTTP $$HTTP)";;
                        *) echo "FATAL: notify-mcp /send returned HTTP $$HTTP"; cat /tmp/send.out; exit 1;;
                      esac
                      ;;
                  esac
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
              envFrom:
                - secretRef:
                    name: local-cron-secret
                    optional: false
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
