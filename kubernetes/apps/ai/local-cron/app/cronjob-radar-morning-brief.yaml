---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-radar-morning-brief
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # Daily morning brief (kagent tier). 06:50 ET — deliberately staggered off
  # the ~06:00/:15/:30/:45 ET block of 6-hourly operator triage crons
  # (observability-triage 06:00, smart-home-triage 06:15, ml-triage 06:30,
  # network-triage 06:45 — see cronjob-*-triage.yaml) and the 06:30 ET
  # crusher-weight-sync, so this never collides with them on the shared
  # kagent-controller MCP endpoint. It invokes the in-cluster `radar`
  # chief-of-staff agent over A2A (local model, qwen3.6-35b-a3b on the Spark
  # via LiteLLM, modelConfig `strong`) and asks it to assemble, from its
  # READ-ONLY tools (vikunja-mcp for the Fleet Todos backlog — this brief's
  # primary content — calendar-mcp for today's + this week's concierge-
  # calendar events, github-mcp for open home-ops PRs as an informational
  # footer), ONE ranked morning brief — then DELIVERS it to Robert as a
  # themed HTML email via notify-mcp (/send) — the same private sink the
  # sibling local-cron digests use; notify-mcp holds the recipient-lock, so
  # it can only email Robert. Unlike the problem-only triage crons this
  # ALWAYS sends the daily digest; a slow/empty/unreachable agent degrades to
  # a SILENT skipped run (a2a_client never raises) — never a KubeJobFailed
  # page. ALL reasoning stays in-cluster except the short brief text in the
  # email notify-mcp relays to Robert; never a public sink, never a remote
  # model. No memory-mcp tool is wired to this agent (see agent-radar.yaml's
  # header comment) — don't reintroduce a "check memory-mcp" instruction here.
  #
  # Vikunja wiring (2026-11-16, home-ops #15962 + this PR): the Fleet Todos
  # store is now federated via vikunja-mcp and is the brief's lead content —
  # Today/This week rank Vikunja tasks ahead of calendar/PRs; open PRs moved
  # to a plain, unranked footer section. Local plan files (the laptop
  # `whats-next` skill's Source 2) remain laptop-only with no in-cluster MCP
  # tool, but that source never fed `whats-next --brief` mode either, so
  # there is no gap to carry for it.
  #
  # LIVE on merge (2026-11-16, Robert's call — approved shipping directly
  # rather than the suspended-then-unsuspend staging crusher-review used,
  # since PR review is itself the human gate and a failed run degrades to a
  # SILENT skip, never a crash or outage). Optional ad-hoc validation any
  # time after merge, scheduled run or not:
  #   kubectl -n ai create job --from=cronjob/local-cron-radar-morning-brief radar-brief-test
  # verify the notify-mcp email digest + the RADAR_BRIEF_RESULT= log line.
  suspend: false
  schedule: "50 6 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # > the client's 800s A2A budget so the client's graceful timeout fires
      # first and exits 0 (silent), rather than the Job deadline killing it.
      activeDeadlineSeconds: 1000
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: brief
              image: docker.io/library/python:3.15@sha256:46837ed3105db0029b6d656816185c6258e3b39690532fb782428e0a5fd76182
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - exec python3 /app/radar_brief.py
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
                - name: AGENT_URL
                  # kagent 1.0 ATE removed the per-agent Service + A2A endpoint;
                  # invocation now goes through the controller's own MCP interface
                  # (kagent-dev/kagent#1160), shared by every agent.
                  value: http://kagent-controller.ai:8083/mcp
                - name: AGENT
                  value: radar
                - name: AGENT_NAME
                  value: radar
                - name: TITLE
                  value: morning brief
                - name: BUDGET_SECONDS
                  value: "800"
                # Runner-side count of completed Fleet Todos still awaiting
                # their Claude-persona follow-up review (done since
                # REVIEW_SINCE, no `followup-reviewed` label). Appended as one
                # deterministic line; the agent never computes it.
                - name: VIKUNJA_URL
                  value: http://vikunja.collab.svc.cluster.local:3456/api/v1
                - name: VIKUNJA_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: radar-vikunja-secret
                      key: VIKUNJA_TOKEN
                - name: REVIEW_SINCE
                  value: "2026-11-21T00:00:00Z"
                - name: PROMPT
                  value: >-
                    This is today's morning brief. Follow your systemPrompt's
                    gather/rank method exactly: pull the Vikunja Fleet Todos
                    backlog (your primary content — tasks due today/overdue,
                    then due within the next 7 days), pull today's and this
                    week's concierge-calendar events, and pull open home-ops
                    PRs (CI state where available) for the footer. Rank per
                    your systemPrompt (Today: Vikunja due-today/overdue then
                    today's calendar; This week: Vikunja due within 7 days
                    then calendar in that window; Open PRs awaiting you: a
                    plain unranked footer list). If nothing is actionable
                    today, say so in one line.
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: local-cron-scripts
                defaultMode: 0o555
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
