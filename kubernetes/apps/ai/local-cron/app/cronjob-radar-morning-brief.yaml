---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-radar-morning-brief
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # Daily morning brief (kagent tier). 06:50 ET — deliberately staggered off
  # the ~06:00/:15/:30/:45 ET block of 6-hourly operator triage crons
  # (observability-triage 06:00, smart-home-triage 06:15, ml-triage 06:30,
  # network-triage 06:45 — see cronjob-*-triage.yaml) and the 06:30 ET
  # crusher-weight-sync, so this never collides with them on the shared
  # kagent-controller MCP endpoint. It invokes the in-cluster `radar`
  # chief-of-staff agent over A2A (local model, qwen3.6-35b-a3b on the Spark
  # via LiteLLM, modelConfig `strong`) and asks it to assemble, from its
  # READ-ONLY tools (calendar-mcp for today's concierge-calendar events,
  # github-mcp for open home-ops PRs + CI state, memory-mcp for prior-brief
  # context), ONE ranked morning brief — then DELIVERS it to Robert as a
  # themed HTML email via notify-mcp (/send) — the same private sink the
  # sibling local-cron digests use; notify-mcp holds the recipient-lock, so
  # it can only email Robert. Unlike the problem-only triage crons this
  # ALWAYS sends the daily digest; a slow/empty/unreachable agent degrades to
  # a SILENT skipped run (a2a_client never raises) — never a KubeJobFailed
  # page. ALL reasoning stays in-cluster except the short brief text in the
  # email notify-mcp relays to Robert; never a public sink, never a remote
  # model.
  #
  # Known gap (2026-11-16, see agent-radar.yaml's header comment): the
  # Vikunja Fleet Todos store and local plan files (the laptop `whats-next`
  # skill's Source 2 + Source 3) have NO in-cluster MCP backend federated
  # yet, so this brief covers only calendar + PRs. The agent's systemPrompt
  # requires it to state that gap by name every run rather than invent or
  # silently drop the fleet-todo backlog — see the email body's "Backlog"
  # line. Standing up a vikunja-mcp backend + federating it is tracked
  # separately (a new-backend onboarding, not a tool-scope tweak); do not
  # treat its absence as a bug in this job.
  #
  # Ship SUSPENDED for Robert's review (new outbound-email agent). Ad-hoc
  # test run before unsuspending:
  #   kubectl -n ai create job --from=cronjob/local-cron-radar-morning-brief radar-brief-test
  # verify the notify-mcp email digest + the RADAR_BRIEF_RESULT= log line,
  # then flip suspend to false in a follow-up PR (mirrors the
  # crusher-review rollout: #15007 suspended -> #15013 unsuspended).
  suspend: true
  schedule: "50 6 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # > the client's 800s A2A budget so the client's graceful timeout fires
      # first and exits 0 (silent), rather than the Job deadline killing it.
      activeDeadlineSeconds: 1000
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: brief
              image: docker.io/library/python:3.15
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - exec python3 /app/radar_brief.py
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
                - name: AGENT_URL
                  # kagent 1.0 ATE removed the per-agent Service + A2A endpoint;
                  # invocation now goes through the controller's own MCP interface
                  # (kagent-dev/kagent#1160), shared by every agent.
                  value: http://kagent-controller.ai:8083/mcp
                - name: AGENT
                  value: radar
                - name: AGENT_NAME
                  value: radar
                - name: TITLE
                  value: morning brief
                - name: BUDGET_SECONDS
                  value: "800"
                - name: PROMPT
                  value: >-
                    This is today's morning brief. Follow your systemPrompt's
                    gather/rank/output method exactly: pull today's concierge-
                    calendar events plus the next 3 days, pull open home-ops
                    PRs (CI state where available), and check memory-mcp for
                    any prior-brief context worth carrying forward. Rank per
                    your systemPrompt (today's calendar, then CI-red PRs, then
                    CI-green PRs, then the 3-day lookahead), and end with the
                    one required Backlog line stating the Vikunja/todo backlog
                    is not visible from this tier. If nothing is actionable
                    today, say so in one line.
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: local-cron-scripts
                defaultMode: 0o555
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
