---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-renovate-pr-digest
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # ACTIVE. Governed by the claude-runner trial policy
  # (.agents/instructions/claude-runner-routing.md) — re-add `suspend: true`
  # to pause without tearing down objects.
  #
  # ACTION-ONLY (narrowed 2026-10-21). This used to email the WHOLE open
  # Renovate queue every day, which just duplicated the GitHub Renovate
  # dashboard — a daily roster, not a problem (see
  # feedback_digests_problems_only_no_allclear_roster). It now emails ONLY
  # when a Renovate PR is STUCK: open longer than ${STALE_DAYS} days, meaning
  # automerge did not take it (failing checks, conflict, or a major awaiting
  # manual review). Silent on any day with nothing stuck. The full queue lives
  # on the dashboard; this surface exists solely to push the subset waiting on
  # Rob. Deterministic formatting — no local model needed for a 0-few item
  # stuck list, which also removes any roster-narration adherence risk.
  #
  # 30 12 * * * UTC = 08:30 EDT / 07:30 EST, daily. Daily is still correct:
  # the check is a single unauth GitHub call and is silent unless something is
  # actually stuck, so a quiet day costs no notification.
  schedule: "30 12 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # 5 min hard cap: one GitHub REST call + jq. No model call anymore.
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          # amd64 image; ai ns also has arm64 Spark nodes — pin so the pod
          # can't land on Spark and hit an exec-format error.
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: digest
              # Carries curl + jq (alpine/k8s). NOTE: `date` is busybox — the
              # PR-age math is done in jq (`now` + `fromdateiso8601`), not with
              # `date -d`.
              image: docker.io/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                # Flux postBuild runs envsubst in STRICT mode over this
                # manifest: a bare ${VAR} is read as a Flux substitution and
                # fails the whole Kustomization with "variable not set".
                # Every shell `$` is doubled (`$$`) so the rendered manifest
                # carries a literal `$` for /bin/sh. Same convention as the
                # other shell-based crons here.
                - |
                  GITHUB_API="https://api.github.com/repos/rwlove/home-ops/pulls"
                  DAY="$$(date -u +%Y-%m-%d)"
                  # A Renovate PR open longer than this is "stuck" — automerge
                  # would have taken a healthy minor/patch well before now.
                  STALE_DAYS=7

                  # (1) Fetch open PRs. home-ops is a PUBLIC repo, so this is
                  # UNAUTHENTICATED — no token, no secret. Unauth GitHub REST
                  # is 60 req/hr, far above one daily call. api.github.com is
                  # reached over the existing world:443 egress; no CNP change was
                  # needed.
                  PRS="$$(curl -sSG --max-time 60 \
                            -H 'Accept: application/vnd.github+json' \
                            -H 'X-GitHub-Api-Version: 2022-11-28' \
                            "$$GITHUB_API" \
                            --data-urlencode "state=open" \
                            --data-urlencode "per_page=100")" || {
                    echo "FATAL: GitHub API request failed"
                    exit 1
                  }

                  # Hard-fail on a non-array payload (rate-limit / error
                  # object) so a broken job is VISIBLE instead of looking
                  # like an empty queue.
                  if ! printf '%s' "$$PRS" | jq -e 'type=="array"' >/dev/null 2>&1; then
                    echo "FATAL: GitHub API did not return a PR array"
                    printf '%s' "$$PRS" | head -c 300
                    exit 1
                  fi

                  # (2) Keep only Renovate-authored PRs STUCK past STALE_DAYS,
                  # oldest first. Flag likely MAJOR bumps (leading version number
                  # increases across the "old -> new" in the title) as needing
                  # review. Unparseable titles (digest bumps, "to vX") still
                  # list, just unflagged. jq computes age from created_at.
                  # jq-internal variables ($$stale/$$ms/$$flag) are DOUBLED like
                  # every other `$` here: Flux envsubst expands the bare dollar
                  # form too, not only the braced form, so an undoubled jq var
                  # would be clobbered (or fail strict substitution). After
                  # envsubst the manifest carries a literal $stale/$ms/$flag.
                  LIST="$$(printf '%s' "$$PRS" | jq -r --argjson stale "$$STALE_DAYS" '
                    [ .[]
                      | select(.user.login | test("renovate"; "i"))
                      | { number, title,
                          age: (((now - (.created_at | fromdateiso8601)) / 86400) | floor) }
                      | select(.age > $$stale)
                    ]
                    | sort_by(-.age)
                    | .[]
                    | ( [ .title | capture("v?(?<old>[0-9]+)(?:\\.[0-9]+)*\\s*(?:→|->)\\s*v?(?<new>[0-9]+)") ] ) as $$ms
                    | ( if ($$ms|length) > 0 and (($$ms[0].new|tonumber) > ($$ms[0].old|tonumber)) then "[MAJOR] " else "" end ) as $$flag
                    | "#\(.number) [\(.age)d] \($$flag)\(.title)"
                  ')"

                  # (3) Nothing stuck → silent. This is the whole point of the
                  # narrowing: no email on a healthy queue.
                  if [ -z "$$LIST" ]; then
                    echo "No Renovate PRs stuck past $${STALE_DAYS}d. Nothing to report."
                    exit 0
                  fi

                  COUNT="$$(printf '%s\n' "$$LIST" | grep -c '^#' || true)"
                  echo "Stuck Renovate PRs ($$COUNT):"
                  printf '%s\n' "$$LIST"

                  BODY="$$(printf '%s stuck Renovate PR(s) open > %sd — automerge has not taken them, needs review:\n\n%s\n\nFull queue: GitHub Renovate dashboard.' \
                            "$$COUNT" "$$STALE_DAYS" "$$LIST")"

                  # (4) Send ONE themed HTML email via notify-mcp /send
                  # (agent=homeops-operator — repo/release-hygiene domain, same
                  # sender as the homeops-hygiene digest). notify-mcp renders the
                  # body in that theme and holds the relay recipient-lock, so this
                  # can only ever email Rob. jq -n escapes the body safely.
                  MSG="$$(printf '%s' "$$BODY" | cut -c1-3800)"
                  REQ="$$(jq -n --arg s "renovate: $${COUNT} stuck PR(s) need review $${DAY}" \
                                --arg b "$$MSG" --arg a "homeops-operator" \
                            '{subject:$$s, body:$$b, agent:$$a}')"
                  HTTP="$$(curl -sS --max-time 30 -o /tmp/send.out -w '%{http_code}' \
                            -H 'Content-Type: application/json' -d "$$REQ" \
                            http://notify-mcp.mcp-system:8060/send)" || {
                    echo "FATAL: notify-mcp /send request errored"
                    exit 1
                  }
                  case "$$HTTP" in
                    2??) echo "digest emailed (HTTP $$HTTP)";;
                    *) echo "FATAL: notify-mcp /send returned HTTP $$HTTP"; cat /tmp/send.out; exit 1;;
                  esac
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
              # No secretRef: the digest reaches Rob via notify-mcp /send, which holds
              # the relay recipient-lock and needs no credentials. (GitHub is read
              # unauthenticated — home-ops is public.)
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
