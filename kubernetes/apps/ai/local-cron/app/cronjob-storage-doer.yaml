---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-storage-doer
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # Write-gate DOER pilot (PR-only). The deterministic pipeline (doer_pipeline.py)
  # asks the read-only storage-operator agent to triage AND emit a structured intent
  # proposal; it validates (schema + path allowlist + action allowlist=set_cron),
  # applies the intent to a fresh clone (the PIPELINE writes the diff, not the model),
  # opens a PR with a scoped token, and NEVER merges. Invalid/absent/no-op → Pushover
  # only. The local-model agent never holds the token. See
  # ~/.claude-personal/plans/kagent-write-gate-design.md.
  #
  # LIVE as of 2026-09-23 (home-ops#14385 hardening verified: 35B emits clean
  # proposals, applier produces a minimal 1-line diff, git image opens the PR). It
  # opens a PR ONLY when it finds a real, safe, config-level fix, and is silent (or
  # Pushover-only) otherwise. To pause without tearing down, set `suspend: true`.
  suspend: false
  schedule: "50 7 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: doer
              # Full python image (NOT -slim) — it bundles git (via buildpack-deps),
              # which the pipeline's clone/branch/push needs. -slim lacks git and the
              # pipeline dies with FileNotFoundError on the git binary.
              image: docker.io/library/python:3.12
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - |
                  pip install --quiet --no-cache-dir --target /tmp/pylib 'ruamel.yaml>=0.18,<0.19'
                  exec python3 /app/doer_pipeline.py
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
                - name: PYTHONPATH
                  value: /tmp/pylib
                - name: AGENT_URL
                  value: http://storage-operator.ai:8080/
                - name: AGENT_NAME
                  value: storage
                - name: ALLOWED_ACTIONS
                  value: set_cron,set_retain
                - name: REPO
                  value: rwlove/home-ops
                - name: PATH_PREFIX
                  value: kubernetes/apps/
                - name: GIT_USER_NAME
                  value: kagent-doer
                - name: GIT_USER_EMAIL
                  value: kagent-doer@users.noreply.github.com
              envFrom:
                # Pushover (notify sink).
                - secretRef:
                    name: local-cron-secret
                    optional: false
                # GitHub PR-create token (GITHUB_PR_TOKEN) — ONLY this cron gets it.
                - secretRef:
                    name: kagent-doer-secret
                    optional: false
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: doer-pipeline
                defaultMode: 0o555
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
