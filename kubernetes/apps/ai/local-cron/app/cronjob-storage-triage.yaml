---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-storage-triage
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # Autonomous storage-durability watcher. Daily it asks the kagent
  # `storage-operator` agent (read-only, local qwen) to sweep for backup/capacity
  # risks and propose next steps, then pages ONLY when notable ("ALL CLEAR" →
  # silent). 07:20 ET — off the 6h watchers' cadence.
  #
  # The A2A call + send-gate live in the shared /app/triage_run.py (poll-to-
  # terminal a2a_client): a slow/empty agent degrades to a SILENT skipped run
  # instead of a KubeJobFailed page. This cron supplies only the domain prompt.
  schedule: "20 7 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      # 900s (> the client's 800s budget) so the client's own graceful timeout
      # fires first and exits 0 (silent), rather than the Job deadline killing it.
      activeDeadlineSeconds: 2100
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: triage
              image: docker.io/library/python:3.15
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - exec python3 /app/triage_run.py
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
                - name: AGENT_URL
                  value: http://storage-operator.ai:8080/
                - name: AGENT_NAME
                  value: storage-operator
                - name: TITLE
                  value: storage triage
                - name: BUDGET_SECONDS
                  value: "800"
                - name: PROMPT
                  value: >-
                    Using your read-only tools, sweep the cluster for
                    storage-durability risks: Longhorn volumes with a stale
                    lastBackupAt vs their schedule, CNPG clusters whose Barman WAL
                    archiving is falling behind, PVCs near capacity, and orphaned
                    volumes. Triage the notable ones: for each, say whether it is
                    a real gap or a schedule/timezone artifact, the likely cause,
                    and the single next step you would propose (name the backup
                    precondition for any destructive fix).
                    A detached Longhorn volume with no pod owner is NOT
                    automatically a zombie. Before flagging one for deletion,
                    look up its PersistentVolume: a PV with reclaimPolicy=Retain
                    in phase Released is an INTENTIONAL retained rollback/migration
                    copy (the repo keeps the old volume after a dynamic->static or
                    XFS->ext4 cutover), not an orphan. Classify these as
                    "intentionally retained -- not a durability gap"; do NOT
                    propose deleting them as zombies, at most note them as
                    retirement candidates pending owner confirmation. A "unknown"
                    robustness on a detached volume means Longhorn has not attached
                    it to count replicas, not that replicas are lost. Only a
                    detached volume whose PV is absent, or a PV in phase Released
                    with reclaimPolicy=Delete, is a true orphan worth surfacing.
                    For the CNPG/Barman check: Postgres Clusters live in the
                    `databases` namespace (NOT `postgresql`), and CNPG PGData on
                    ceph-block is the STANDARD durable pattern -- a ceph-backed
                    Postgres PVC is CNPG, not evidence against it. Do NOT judge
                    backup recency by `Cluster.status.lastSuccessfulBackup`: the
                    Barman Cloud Plugin does not populate it (it reads empty, or
                    frozen at a pre-plugin date, while backups are completing
                    fine), so that field will mislead in BOTH directions. Assess
                    recency instead via each cluster's ScheduledBackup
                    lastScheduleTime plus recent Backup CRs in phase completed, and
                    read the Cluster ContinuousArchiving condition for WAL-stream
                    health. Only flag a cluster whose scheduled backups have
                    actually stopped completing or whose ContinuousArchiving is
                    not True.
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: local-cron-scripts
                defaultMode: 0o555
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
