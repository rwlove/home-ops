---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-vila-warranty-digest
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # vila (property/utilities steward) — weekly warranty-expiry + maintenance-due
  # watch. Reads HomeBox entities (warrantyExpires) and Grocy chores/batteries
  # (next-estimated) AT RUNTIME (so no private property facts live in this PUBLIC
  # repo) and emails Rob ONE ACTIONABLE message PER concern via notify-mcp /send
  # (agent=vila): what to do, the step-by-step PROCEDURE (pulled from the Grocy
  # chore's own description), and how to clear it, with deep links. Silent when
  # nothing is due. Deterministic: no LLM, no k8s API.
  #
  # HomeBox here is the sysadminsmedia fork (v0.26): API is /api/v1/entities
  # (+ per-entity detail for warrantyExpires), NOT the classic /api/v1/items.
  #
  # Tested 2026-11-03 → unsuspended.
  suspend: false
  schedule: "0 8 * * 1"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: digest
              image: docker.io/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                # Flux postBuild envsubst runs STRICT: EVERY shell `$` is doubled
                # (`$$`) so the rendered manifest carries a literal `$`. Only the
                # ${SECRET_DOMAIN} in the env block below is a REAL Flux var (single
                # `$`). Do NOT use positional params (`$1`,`${2}`) in-script.
                - |
                  HB="http://homebox.selfhosted:7745"
                  GR="http://grocy.selfhosted:80"
                  WINDOW=90           # days-ahead to flag an upcoming expiry/due
                  MAX=15              # hard cap on emails per run
                  NOW="$$(date +%s)"
                  TAB="$$(printf '\t')"
                  : > /tmp/due.tsv     # rows: KIND<TAB>NAME<TAB>DETAIL<TAB>ID

                  # ---- HomeBox: entities whose warranty expires within WINDOW --
                  ENTS="$$(curl -sS --max-time 30 \
                            -H "Authorization: Bearer $${HOMEBOX_TOKEN}" \
                            "$$HB/api/v1/entities?pageSize=500")" || {
                    echo "FATAL: HomeBox /api/v1/entities request errored"; exit 1; }
                  IDS="$$(printf '%s' "$$ENTS" | jq -r '(.items // .)[]?.id' 2>/dev/null || echo '')"
                  [ -z "$$IDS" ] && echo "NOTE: HomeBox returned no entities (empty or auth?)"
                  for ID in $$IDS; do
                    D="$$(curl -sS --max-time 20 \
                           -H "Authorization: Bearer $${HOMEBOX_TOKEN}" \
                           "$$HB/api/v1/entities/$$ID")" || continue
                    printf '%s' "$$D" | jq -r '
                      select((.lifetimeWarranty // false) == false)
                      | select((.warrantyExpires // "") | test("[0-9]{4}-[0-9]{2}-[0-9]{2}"))
                      | [ .name, (.warrantyExpires | .[0:10]) ] | @tsv' 2>/dev/null \
                    | while IFS="$$TAB" read -r NAME WEXP; do
                        [ -z "$$WEXP" ] && continue
                        EPOCH="$$(date -d "$$WEXP" +%s 2>/dev/null || echo '')"
                        [ -z "$$EPOCH" ] && continue
                        DAYS="$$(( (EPOCH - NOW) / 86400 ))"
                        if [ "$$DAYS" -le "$$WINDOW" ]; then
                          if [ "$$DAYS" -lt 0 ]; then STATE="EXPIRED"; else STATE="expiring"; fi
                          printf 'warranty\t%s\t%s (%s, %s days)\t%s\n' \
                            "$$NAME" "$$STATE" "$$WEXP" "$$DAYS" "$$ID" >> /tmp/due.tsv
                        fi
                      done
                  done

                  # ---- Grocy chores due within WINDOW (keep chore_id) ---------
                  CH="$$(curl -sS --max-time 30 -H "GROCY-API-KEY: $${GROCY_API_KEY}" \
                          "$$GR/api/chores")" || CH='[]'
                  printf '%s' "$$CH" | jq -r '.[]? | [ (.next_estimated_execution_time // ""), (.chore_name // ""), ((.chore_id|tostring) // "") ] | @tsv' 2>/dev/null > /tmp/gr.tsv || : > /tmp/gr.tsv
                  while IFS="$$TAB" read -r WHEN NAME CID; do
                    [ -z "$$WHEN" ] && continue
                    WD="$${WHEN%% *}"
                    EPOCH="$$(date -d "$$WD" +%s 2>/dev/null || echo '')"
                    [ -z "$$EPOCH" ] && continue
                    DAYS="$$(( (EPOCH - NOW) / 86400 ))"
                    if [ "$$DAYS" -le "$$WINDOW" ]; then
                      if [ "$$DAYS" -lt 0 ]; then STATE="OVERDUE"; else STATE="due"; fi
                      printf 'chore\t%s\t%s (%s, %s days)\t%s\n' "$$NAME" "$$STATE" "$$WD" "$$DAYS" "$$CID" >> /tmp/due.tsv
                    fi
                  done < /tmp/gr.tsv

                  # ---- Grocy batteries due for charge within WINDOW ----------
                  BA="$$(curl -sS --max-time 30 -H "GROCY-API-KEY: $${GROCY_API_KEY}" \
                          "$$GR/api/batteries")" || BA='[]'
                  printf '%s' "$$BA" | jq -r '.[]? | [ (.next_estimated_charge_time // ""), ((.battery.name) // (.battery_id|tostring) // "battery"), ((.battery_id|tostring) // "") ] | @tsv' 2>/dev/null > /tmp/ba.tsv || : > /tmp/ba.tsv
                  while IFS="$$TAB" read -r WHEN NAME BID; do
                    [ -z "$$WHEN" ] && continue
                    WD="$${WHEN%% *}"
                    EPOCH="$$(date -d "$$WD" +%s 2>/dev/null || echo '')"
                    [ -z "$$EPOCH" ] && continue
                    DAYS="$$(( (EPOCH - NOW) / 86400 ))"
                    if [ "$$DAYS" -le "$$WINDOW" ]; then
                      if [ "$$DAYS" -lt 0 ]; then STATE="OVERDUE"; else STATE="due"; fi
                      printf 'battery\t%s\t%s (%s, %s days)\t%s\n' "$$NAME" "$$STATE" "$$WD" "$$DAYS" "$$BID" >> /tmp/due.tsv
                    fi
                  done < /tmp/ba.tsv

                  # ---- emit one ACTIONABLE email per concern -----------------
                  DUE="$$(awk 'NF{n++} END{print n+0}' /tmp/due.tsv 2>/dev/null)"
                  [ -n "$$DUE" ] || DUE=0
                  echo "----- vila warranty/maintenance watch ($$DUE concern(s)) -----"
                  if [ "$$DUE" = "0" ]; then
                    echo "ALL CLEAR — nothing expiring/due; no email sent"; exit 0
                  fi
                  if [ "$$DUE" -gt "$$MAX" ]; then
                    echo "NOTE: $$DUE concerns exceed cap $$MAX — sending first $$MAX"
                    head -n "$$MAX" /tmp/due.tsv > /tmp/due.capped && mv /tmp/due.capped /tmp/due.tsv
                  fi

                  SENT=0; FAILED=0
                  while IFS="$$TAB" read -r KIND NAME DETAIL ID; do
                    [ -z "$$NAME" ] && continue
                    printf 'DUE  %-10s | %-30s | %s\n' "$$KIND" "$$NAME" "$$DETAIL"
                    case "$$KIND" in
                      chore)
                        SUBJECT="Vila: $$NAME — $$DETAIL"
                        # Procedure comes from the chore's own Grocy description
                        # (Vila maintains it there — the single source of truth).
                        PROC=""
                        if [ -n "$$ID" ]; then
                          PROC="$$(curl -sS --max-time 15 -H "GROCY-API-KEY: $${GROCY_API_KEY}" \
                                    "$$GR/api/objects/chores/$$ID" 2>/dev/null | jq -r '.description // ""' 2>/dev/null)"
                        fi
                        [ -z "$$PROC" ] && PROC="_(No procedure recorded yet — ask Vila to add one to this chore in Grocy.)_"
                        BODY="$$(printf '**Do now:** %s  (%s)\n\n**Procedure:**\n%s\n\n**When done — clear it:** open Grocy -> Chores overview, find "%s", and click *Track execution of now* (this resets the next-due date).\n[Grocy chores](%s/choresoverview)' \
                          "$$NAME" "$$DETAIL" "$$PROC" "$$NAME" "$$GR_PUB")"
                        ;;
                      warranty)
                        SUBJECT="Vila: $$NAME — warranty $$DETAIL"
                        case "$$DETAIL" in
                          EXPIRED*)
                            BODY="$$(printf '**Heads-up:** the warranty on **%s** has %s.\n\n**What to do:** this item is now out of warranty — if it fails, plan for repair/replacement (no manufacturer coverage to fall back on). If you believe a longer term should apply, find the warranty certificate and update the record so this clears.\n\n**Record:** [HomeBox](%s) -> open the "%s" asset and set the real warranty date, or mark lifetime/replaced.' \
                              "$$NAME" "$$DETAIL" "$$HB_PUB" "$$NAME")" ;;
                          *)
                            BODY="$$(printf '**Act soon:** the warranty on **%s** is %s.\n\n**What to do:** if this item has any fault, schedule warranty service BEFORE it lapses; note any renewal/extension options. Then update the record.\n\n**Record:** [HomeBox](%s) -> the "%s" asset.' \
                              "$$NAME" "$$DETAIL" "$$HB_PUB" "$$NAME")" ;;
                        esac
                        ;;
                      battery)
                        SUBJECT="Vila: battery $$NAME — $$DETAIL"
                        BODY="$$(printf '**Do now:** replace / charge the battery for **%s**  (%s).\n\n**When done — clear it:** open Grocy -> Batteries overview, find "%s", and *Track charge cycle*.\n[Grocy batteries](%s/batteriesoverview)' \
                          "$$NAME" "$$DETAIL" "$$NAME" "$$GR_PUB")"
                        ;;
                      *)
                        SUBJECT="Vila: $$NAME — $$DETAIL"
                        BODY="$$(printf '**Item:** %s\n**Concern:** %s' "$$NAME" "$$DETAIL")"
                        ;;
                    esac

                    REQ="$$(jq -n --arg s "$$SUBJECT" --arg b "$$BODY" --arg a "vila" \
                              '{subject:$$s, body:$$b, agent:$$a}')"
                    HTTP="$$(curl -sS --max-time 30 -o /tmp/send.out -w '%{http_code}' \
                              -H 'Content-Type: application/json' -d "$$REQ" \
                              http://notify-mcp.mcp-system:8060/send)"
                    case "$$HTTP" in
                      2??) SENT=$$((SENT + 1));;
                      *) echo "FATAL: notify-mcp /send HTTP $$HTTP for '$$SUBJECT'"; cat /tmp/send.out; FAILED=$$((FAILED + 1));;
                    esac
                  done < /tmp/due.tsv
                  echo "----- sent $$SENT email(s); $$FAILED failed -----"
                  [ "$$FAILED" -eq 0 ] || exit 1
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
                # Public URLs for the email deep links. ${SECRET_DOMAIN} is a REAL
                # Flux postBuild var (single $) — the public repo only shows the
                # placeholder, never the actual domain.
                - name: HB_PUB
                  value: "https://homebox.${SECRET_DOMAIN}"
                - name: GR_PUB
                  value: "https://grocy.${SECRET_DOMAIN}"
              envFrom:
                - secretRef:
                    name: vila-digest-secret
                    optional: false
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
