---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-vila-warranty-digest
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # vila (property/utilities steward) — weekly warranty-expiry + maintenance-due
  # watch. Reads HomeBox entities (warrantyExpires) and Grocy chores/batteries
  # AT RUNTIME (so no private property facts live in this PUBLIC repo) and
  # emails Rob ONE ACTIONABLE message PER concern via notify-mcp /send
  # (agent=vila): what to do, the step-by-step PROCEDURE (pulled from the Grocy
  # chore's own description), and how to clear it, with deep links. Silent when
  # nothing is due. Deterministic: no LLM, no k8s API.
  #
  # Sensor-backed chores are CHECKED BEFORE EMAILING: a due chore whose Grocy
  # `ha_check` userfield holds a Jinja template is rendered against live Home
  # Assistant (POST /api/template). A render starting "OK" means the equipment
  # already satisfies the chore -> the digest tracks the execution in Grocy and
  # sends nothing. Any other render is put in the email as "Live from HA"; an
  # unreachable HA falls back to the plain email. The template (and its
  # serial-bearing entity IDs) lives in Grocy, not in this public repo.
  #
  # HomeBox here is the sysadminsmedia fork (v0.26): API is /api/v1/entities
  # (+ per-entity detail for warrantyExpires), NOT the classic /api/v1/items.
  #
  # Chore due-ness is SELF-COMPUTED (see the inline NOTE at the chore block
  # below) rather than trusted from Grocy's next_estimated_execution_time,
  # which this build nulls out the moment a chore is ever tracked. Batteries
  # still read next_estimated_charge_time — unaffected, untouched here.
  #
  # Tested 2026-11-03 → unsuspended. Chore-due logic fixed + re-verified
  # against live data 2026-11-16 (see memory
  # feedback_grocy_chore_next_due_null_after_execution).
  suspend: false
  schedule: "0 8 * * 1"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: digest
              image: docker.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                # Flux postBuild envsubst runs STRICT: EVERY shell `$` is doubled
                # (`$$`) so the rendered manifest carries a literal `$`. Only the
                # ${SECRET_DOMAIN} in the env block below is a REAL Flux var (single
                # `$`). Do NOT use positional params (`$1`,`${2}`) in-script.
                - |
                  HB="http://homebox.selfhosted:7745"
                  GR="http://grocy.selfhosted:80"
                  HA="http://home-assistant.home:8123"
                  # Weekly cron (Mon 08:00 ET). Warranty reminders fire in two
                  # ~1-week-wide bands sized to the weekly cadence so each is
                  # caught by exactly one run: ~90 days out, and ~7 days out.
                  # Already-expired warranties (DAYS<0) are never emailed --
                  # Robert doesn't want an ongoing "it's expired" nag, just the
                  # two pre-expiry heads-ups.
                  WARN_FAR_LO=84      # 90-day heads-up band, low bound
                  WARN_FAR_HI=90      # 90-day heads-up band, high bound
                  WARN_NEAR_LO=0      # 7-day heads-up band, low bound
                  WARN_NEAR_HI=7      # 7-day heads-up band, high bound
                  CHORE_WINDOW=6      # chores/batteries: "Do now" only within this week's run (incl. overdue)
                  MAX=15              # hard cap on emails per run
                  NOW="$$(date +%s)"
                  TAB="$$(printf '\t')"
                  : > /tmp/due.tsv     # rows: KIND<TAB>NAME<TAB>DETAIL<TAB>ID

                  # ---- HomeBox: entities whose warranty is ~90d or ~7d out ----
                  ENTS="$$(curl -sS --max-time 30 \
                            -H "Authorization: Bearer $${HOMEBOX_TOKEN}" \
                            "$$HB/api/v1/entities?pageSize=500")" || {
                    echo "FATAL: HomeBox /api/v1/entities request errored"; exit 1; }
                  IDS="$$(printf '%s' "$$ENTS" | jq -r '(.items // .)[]?.id' 2>/dev/null || echo '')"
                  [ -z "$$IDS" ] && echo "NOTE: HomeBox returned no entities (empty or auth?)"
                  for ID in $$IDS; do
                    D="$$(curl -sS --max-time 20 \
                           -H "Authorization: Bearer $${HOMEBOX_TOKEN}" \
                           "$$HB/api/v1/entities/$$ID")" || continue
                    printf '%s' "$$D" | jq -r '
                      select((.lifetimeWarranty // false) == false)
                      | select((.warrantyExpires // "") | test("[0-9]{4}-[0-9]{2}-[0-9]{2}"))
                      | [ .name, (.warrantyExpires | .[0:10]) ] | @tsv' 2>/dev/null \
                    | while IFS="$$TAB" read -r NAME WEXP; do
                        [ -z "$$WEXP" ] && continue
                        EPOCH="$$(date -d "$$WEXP" +%s 2>/dev/null || echo '')"
                        [ -z "$$EPOCH" ] && continue
                        DAYS="$$(( (EPOCH - NOW) / 86400 ))"
                        if { [ "$$DAYS" -ge "$$WARN_FAR_LO" ] && [ "$$DAYS" -le "$$WARN_FAR_HI" ]; } \
                           || { [ "$$DAYS" -ge "$$WARN_NEAR_LO" ] && [ "$$DAYS" -le "$$WARN_NEAR_HI" ]; }; then
                          printf 'warranty\t%s\texpiring (%s, %s days)\t%s\n' \
                            "$$NAME" "$$WEXP" "$$DAYS" "$$ID" >> /tmp/due.tsv
                        fi
                        # Outside both bands (including DAYS<0, already-expired)
                        # is intentionally silent -- no EXPIRED nag.
                      done
                  done

                  # ---- Grocy chores due within CHORE_WINDOW (keep chore_id) ---
                  # NOTE (2026-11-16): this Grocy build's /api/chores
                  # next_estimated_execution_time goes NULL the moment a
                  # chore has ANY tracked execution (confirmed across
                  # period_type/period_config combos on live chore 9
                  # "Gutters -- clean" + a disposable test chore -- an
                  # app bug, not a config error; see memory
                  # feedback_grocy_chore_next_due_null_after_execution).
                  # Before any execution that field is just start_date
                  # verbatim, not a real projection either. So: self-
                  # compute due-ness from the fields that ARE reliable --
                  #   due = last_tracked_time (or start_date if never
                  #   tracked) + one period step, where the step comes
                  #   from period_type/period_interval/period_days.
                  CH="$$(curl -sS --max-time 30 -H "GROCY-API-KEY: $${GROCY_API_KEY}" \
                          "$$GR/api/chores")" || CH='[]'
                  CFG="$$(curl -sS --max-time 30 -H "GROCY-API-KEY: $${GROCY_API_KEY}" \
                          "$$GR/api/objects/chores")" || CFG='[]'
                  jq -n --argjson ch "$$CH" --argjson cfg "$$CFG" -r '
                    ($$cfg | map({(.id|tostring): .}) | add) as $$cfgmap
                    | $$ch[]?
                    | ($$cfgmap[(.chore_id|tostring)]) as $$c
                    | select($$c != null)
                    | select(($$c.active // 1) == 1)
                    | [ (.chore_name // ""),
                        ($$c.period_type // "-"),
                        (($$c.period_interval // 1) | tostring),
                        (($$c.period_days // 0) | tostring),
                        ($$c.start_date // "-"),
                        ((.last_tracked_time // "") | if length > 10 then .[0:10] else "-" end),
                        (.chore_id | tostring) ]
                    | @tsv
                  ' 2>/dev/null > /tmp/gr.tsv || : > /tmp/gr.tsv
                  while IFS="$$TAB" read -r NAME PTYPE PINT PDAYS SDATE LTRACK CID; do
                    [ -z "$$NAME" ] && continue
                    [ "$$LTRACK" = "-" ] && LTRACK=""
                    [ "$$SDATE" = "-" ] && SDATE=""
                    BASE="$$LTRACK"; [ -z "$$BASE" ] && BASE="$$SDATE"
                    [ -z "$$BASE" ] && continue
                    if [ -z "$$LTRACK" ]; then
                      # never executed -- due date is the raw start_date
                      WD="$$BASE"
                    else
                      case "$$PTYPE" in
                        daily|dynamic-regular)
                          STEP="$${PDAYS:-1}"
                          WD="$$(date -d "$$BASE + $$((STEP * PINT)) days" +%F 2>/dev/null || echo '')"
                          ;;
                        weekly)
                          WD="$$(date -d "$$BASE + $$((7 * PINT)) days" +%F 2>/dev/null || echo '')"
                          ;;
                        monthly)
                          WD="$$(date -d "$$BASE + $$PINT months" +%F 2>/dev/null || echo '')"
                          ;;
                        yearly)
                          WD="$$(date -d "$$BASE + $$PINT years" +%F 2>/dev/null || echo '')"
                          ;;
                        manually|*)
                          WD=""  # no automatic schedule -- never auto-flagged
                          ;;
                      esac
                    fi
                    [ -z "$$WD" ] && continue
                    EPOCH="$$(date -d "$$WD" +%s 2>/dev/null || echo '')"
                    [ -z "$$EPOCH" ] && continue
                    DAYS="$$(( (EPOCH - NOW) / 86400 ))"
                    if [ "$$DAYS" -le "$$CHORE_WINDOW" ]; then
                      if [ "$$DAYS" -lt 0 ]; then STATE="OVERDUE"; else STATE="due"; fi
                      printf 'chore\t%s\t%s (%s, %s days)\t%s\n' "$$NAME" "$$STATE" "$$WD" "$$DAYS" "$$CID" >> /tmp/due.tsv
                    fi
                  done < /tmp/gr.tsv

                  # ---- Grocy batteries due for charge within CHORE_WINDOW ----
                  BA="$$(curl -sS --max-time 30 -H "GROCY-API-KEY: $${GROCY_API_KEY}" \
                          "$$GR/api/batteries")" || BA='[]'
                  printf '%s' "$$BA" | jq -r '.[]? | [ (.next_estimated_charge_time // ""), ((.battery.name) // (.battery_id|tostring) // "battery"), ((.battery_id|tostring) // "") ] | @tsv' 2>/dev/null > /tmp/ba.tsv || : > /tmp/ba.tsv
                  while IFS="$$TAB" read -r WHEN NAME BID; do
                    [ -z "$$WHEN" ] && continue
                    WD="$${WHEN%% *}"
                    EPOCH="$$(date -d "$$WD" +%s 2>/dev/null || echo '')"
                    [ -z "$$EPOCH" ] && continue
                    DAYS="$$(( (EPOCH - NOW) / 86400 ))"
                    if [ "$$DAYS" -le "$$CHORE_WINDOW" ]; then
                      if [ "$$DAYS" -lt 0 ]; then STATE="OVERDUE"; else STATE="due"; fi
                      printf 'battery\t%s\t%s (%s, %s days)\t%s\n' "$$NAME" "$$STATE" "$$WD" "$$DAYS" "$$BID" >> /tmp/due.tsv
                    fi
                  done < /tmp/ba.tsv

                  # ---- emit one ACTIONABLE email per concern -----------------
                  DUE="$$(awk 'NF{n++} END{print n+0}' /tmp/due.tsv 2>/dev/null)"
                  [ -n "$$DUE" ] || DUE=0
                  echo "----- vila warranty/maintenance watch ($$DUE concern(s)) -----"
                  if [ "$$DUE" = "0" ]; then
                    echo "ALL CLEAR — nothing expiring/due; no email sent"; exit 0
                  fi
                  if [ "$$DUE" -gt "$$MAX" ]; then
                    echo "NOTE: $$DUE concerns exceed cap $$MAX — sending first $$MAX"
                    head -n "$$MAX" /tmp/due.tsv > /tmp/due.capped && mv /tmp/due.capped /tmp/due.tsv
                  fi

                  SENT=0; FAILED=0; AUTO=0
                  while IFS="$$TAB" read -r KIND NAME DETAIL ID; do
                    [ -z "$$NAME" ] && continue
                    printf 'DUE  %-10s | %-30s | %s\n' "$$KIND" "$$NAME" "$$DETAIL"
                    case "$$KIND" in
                      chore)
                        SUBJECT="Vila: $$NAME — $$DETAIL"
                        # Procedure comes from the chore's own Grocy description
                        # (Vila maintains it there — the single source of truth).
                        PROC=""
                        if [ -n "$$ID" ]; then
                          PROC="$$(curl -sS --max-time 15 -H "GROCY-API-KEY: $${GROCY_API_KEY}" \
                                    "$$GR/api/objects/chores/$$ID" 2>/dev/null | jq -r '.description // ""' 2>/dev/null)"
                        fi
                        [ -z "$$PROC" ] && PROC="_(No procedure recorded yet — ask Vila to add one to this chore in Grocy.)_"
                        # Check before emailing: render the chore's ha_check
                        # userfield (if any) against live HA. "OK..." -> track
                        # the execution in Grocy and skip the email.
                        LIVE=""
                        HCT=""
                        if [ -n "$$ID" ]; then
                          HCT="$$(curl -sS --max-time 15 -H "GROCY-API-KEY: $${GROCY_API_KEY}" \
                                   "$$GR/api/userfields/chores/$$ID" 2>/dev/null | jq -r '.ha_check // ""' 2>/dev/null)" || HCT=""
                        fi
                        if [ -n "$$HCT" ]; then
                          if HR="$$(curl -sSf --max-time 20 -X POST \
                                     -H "Authorization: Bearer $${HA_TOKEN}" -H 'Content-Type: application/json' \
                                     -d "$$(jq -n --arg t "$$HCT" '{template:$$t}')" "$$HA/api/template")"; then
                            case "$$HR" in
                              OK*)
                                if curl -sSf --max-time 20 -o /dev/null -X POST \
                                     -H "GROCY-API-KEY: $${GROCY_API_KEY}" -H 'Content-Type: application/json' \
                                     -d '{}' "$$GR/api/chores/$$ID/execute"; then
                                  echo "AUTO-VERIFIED via HA: $$NAME -- $$HR (tracked in Grocy, no email)"
                                  AUTO=$$((AUTO + 1))
                                  continue
                                fi
                                LIVE="HA reads healthy ($$HR) but the Grocy auto-track failed -- track it by hand."
                                ;;
                              *) LIVE="$$HR" ;;
                            esac
                          else
                            LIVE="_(HA check unavailable -- verify by hand.)_"
                          fi
                        fi
                        # ($$(...) strips trailing newlines, so the HA line's
                        # separator lives in the format string, not in LIVE.)
                        HAFMT=''
                        [ -n "$$LIVE" ] && HAFMT='**Live from HA:** %s\n\n'
                        BODY="$$(printf "**Do now:** %s  (%s)\n\n$${HAFMT}**Procedure:**\n%s\n\n**When done — clear it:** open Grocy -> Chores overview, find \"%s\", and click *Track execution of now* (this resets the next-due date).\n[Grocy chores](%s/choresoverview)" \
                          "$$NAME" "$$DETAIL" $${LIVE:+"$$LIVE"} "$$PROC" "$$NAME" "$$GR_PUB")"
                        ;;
                      warranty)
                        # DETAIL is always "expiring (...)" now -- already-
                        # expired warranties never reach this branch (see the
                        # WARN_FAR_*/WARN_NEAR_* bands above), so there is no
                        # EXPIRED-vs-expiring split to make here any more.
                        SUBJECT="Vila: $$NAME — warranty $$DETAIL"
                        BODY="$$(printf '**Act soon:** the warranty on **%s** is %s.\n\n**What to do:** if this item has any fault, schedule warranty service BEFORE it lapses; note any renewal/extension options. Then update the record.\n\n**Record:** [HomeBox](%s) -> the "%s" asset.' \
                          "$$NAME" "$$DETAIL" "$$HB_PUB" "$$NAME")"
                        ;;
                      battery)
                        SUBJECT="Vila: battery $$NAME — $$DETAIL"
                        BODY="$$(printf '**Do now:** replace / charge the battery for **%s**  (%s).\n\n**When done — clear it:** open Grocy -> Batteries overview, find "%s", and *Track charge cycle*.\n[Grocy batteries](%s/batteriesoverview)' \
                          "$$NAME" "$$DETAIL" "$$NAME" "$$GR_PUB")"
                        ;;
                      *)
                        SUBJECT="Vila: $$NAME — $$DETAIL"
                        BODY="$$(printf '**Item:** %s\n**Concern:** %s' "$$NAME" "$$DETAIL")"
                        ;;
                    esac

                    REQ="$$(jq -n --arg s "$$SUBJECT" --arg b "$$BODY" --arg a "vila" \
                              '{subject:$$s, body:$$b, agent:$$a}')"
                    if [ -n "$${DRY_RUN:-}" ]; then
                      printf 'DRY_RUN would send:\n%s\n' "$$REQ"; continue
                    fi
                    HTTP="$$(curl -sS --max-time 30 -o /tmp/send.out -w '%{http_code}' \
                              -H 'Content-Type: application/json' -d "$$REQ" \
                              http://notify-mcp.mcp-system:8060/send)"
                    case "$$HTTP" in
                      2??) SENT=$$((SENT + 1));;
                      *) echo "FATAL: notify-mcp /send HTTP $$HTTP for '$$SUBJECT'"; cat /tmp/send.out; FAILED=$$((FAILED + 1));;
                    esac
                  done < /tmp/due.tsv
                  echo "----- sent $$SENT email(s); $$AUTO auto-verified via HA; $$FAILED failed -----"
                  [ "$$FAILED" -eq 0 ] || exit 1
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
                # Public URLs for the email deep links. ${SECRET_DOMAIN} is a REAL
                # Flux postBuild var (single $) — the public repo only shows the
                # placeholder, never the actual domain.
                - name: HB_PUB
                  value: "https://homebox.${SECRET_DOMAIN}"
                - name: GR_PUB
                  value: "https://grocy.${SECRET_DOMAIN}"
              envFrom:
                - secretRef:
                    name: vila-digest-secret
                    optional: false
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
