---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-warren-plan-refresh
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # warren (financial advisor, in-cluster tier) — MONTHLY retirement-plan
  # refresh. Once a month it asks the kagent `warren` agent (strong tier,
  # qwen3.6-35b-a3b on the Spark) to re-pull the live portfolio (Ghostfolio) +
  # the finance model/prior plan (memory) and RE-SOLVE the retirement plan with
  # Owl, PERSISTING the refreshed plan back into the finance memory namespace.
  #
  # Data classification (critical): everything warren touches is RESTRICTED.
  # All figures (balances, spend, lifetime totals, conversion amounts) are
  # written by the agent ITSELF into memory-mcp (finance namespace) — the
  # designated in-cluster Restricted store. This cron sends NO Pushover and NO
  # email, and warren is instructed to reply with a FIGURE-FREE status token
  # only, because this job's stdout is shipped to Loki (indexed). Rob reads the
  # refreshed plan through the frontend / Ghostfolio, never from a log or mail.
  #
  # Persist-first: a monthly Owl solve is heavy and can outlast a synchronous
  # A2A call. warren's system prompt already writes the result entity + inputs
  # FIRST, then solves, then appends outputs — so even if this cron's curl
  # times out, the plan is still saved. The cron failing then is the correct,
  # visible last-run signal (failedJobsHistoryLimit).
  #
  # Governed by the claude-runner trial policy — re-add `suspend: true` to
  # pause without tearing down. Shipped SUSPENDED; manual-test then unsuspend.
  suspend: true
  schedule: "0 9 1 * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # An Owl solve (Monte Carlo + MILP tax optimization) plus the agent's
      # tool round-trips can run for minutes on the Spark. 30 min is a
      # comfortable ceiling; persist-first means a timeout still saves the plan.
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          # amd64 image; ai ns also has arm64 Spark nodes — pin so the pod
          # can't land on Spark and hit an exec-format error.
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: refresh
              # Carries curl + jq. Same image the other local-cron jobs use.
              image: docker.io/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                # Flux postBuild runs envsubst in STRICT mode over this
                # manifest: a bare $${VAR} is read as a Flux substitution and
                # fails the whole Kustomization. Every shell `$` is doubled
                # (`$$`) so the rendered manifest carries a literal `$` for
                # /bin/sh. Same convention as the triage/skim jobs.
                - |
                  # warren agent A2A endpoint (intra-namespace; the ai baseline
                  # allow-intra-namespace covers this hop, same as the triage
                  # jobs' calls to the operator agents).
                  AGENT="http://warren.ai:8080/"

                  # Ask warren to re-solve + PERSIST the plan itself. The reply
                  # must be figure-free (this stdout is logged). jq -n builds
                  # the A2A message/send body so the prompt is JSON-escaped.
                  REQ="$$(jq -n '{
                    jsonrpc:"2.0", id:1, method:"message/send",
                    params:{ message:{
                      role:"user",
                      parts:[{kind:"text", text:"You are invoked by an unattended MONTHLY cron to refresh Robert every retirement plan. Do the full refresh yourself with your tools, following your persist-first rule strictly: (1) FIRST create-or-update the plan result entity in the finance memory namespace with today date and the inputs you already know; (2) pull current portfolio state from Ghostfolio and the finance model plus prior plan from memory; (3) re-solve the retirement plan with Owl; (4) append the solved outputs (retire age, solvent-to age, spend, Roth-conversion schedule, flagged assumptions) as observations on that same entity. ALL figures stay in memory (finance namespace) — that is the Restricted store. This is a one-way unattended run: never ask a question. Your REPLY to THIS message is written to an in-cluster log, so it must contain NO figures, balances, or dollar amounts. Reply with EXACTLY one line: REFRESHED ok on success, or ERROR: followed by a short non-numeric reason if you could not complete and persist the plan."}],
                      messageId:"warren-plan-refresh", kind:"message"
                    }}
                  }')"

                  RESP="$$(curl -sS --max-time 1500 -X POST "$$AGENT" \
                            -H 'Content-Type: application/json' \
                            -H 'Accept: application/json, text/event-stream' \
                            -d "$$REQ")" || {
                    echo "FATAL: warren A2A call errored or timed out"
                    echo "NOTE: persist-first means the plan may still be saved in memory; check the finance namespace."
                    exit 1
                  }

                  # A2A returns a task; the answer is in result.artifacts[].parts[]
                  # or result.status.message.parts[]. Take the last text part.
                  TEXT="$$(printf '%s' "$$RESP" | jq -r '
                    [ (.result.artifacts[]?.parts[]? // empty),
                      (.result.status.message.parts[]? // empty) ]
                    | map(select(.kind=="text") | .text) | last // empty')"
                  STATE="$$(printf '%s' "$$RESP" | jq -r '.result.status.state // "?"')"

                  # Reply MUST be figure-free by contract; guard anyway. Only a
                  # small allowlisted status vocabulary is echoed to the log so
                  # a misbehaving reply can never leak a balance into Loki.
                  case "$$TEXT" in
                    *"REFRESHED ok"*)
                      echo "warren-plan-refresh: REFRESHED ok (state=$$STATE)"
                      exit 0;;
                    *"ERROR:"*)
                      # Echo only the fixed prefix, not warren's free text, to
                      # keep any stray figures out of the log.
                      echo "warren-plan-refresh: warren reported ERROR (state=$$STATE) — check the finance memory namespace"
                      exit 1;;
                    "")
                      echo "warren-plan-refresh: empty reply (state=$$STATE) — likely persisted via persist-first; check memory"
                      exit 1;;
                    *)
                      echo "warren-plan-refresh: unexpected non-token reply (state=$$STATE) — not echoed (may contain figures); check memory"
                      exit 1;;
                  esac
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
              # No secretRef: this job sends NO Pushover and NO email. warren
              # holds its own tool credentials in-cluster; the cron only pokes it.
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
