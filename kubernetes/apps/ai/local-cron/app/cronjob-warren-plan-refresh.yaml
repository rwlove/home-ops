---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: local-cron-warren-plan-refresh
  labels:
    app.kubernetes.io/name: local-cron
spec:
  # warren (financial advisor, in-cluster tier) — MONTHLY retirement-plan
  # refresh. Once a month it asks the kagent `warren` agent (strong tier,
  # qwen3.6-35b-a3b on the Spark) to re-pull the live portfolio (Ghostfolio) +
  # the finance model/prior plan (memory) and RE-SOLVE the retirement plan with
  # Owl, PERSISTING the refreshed plan back into the finance memory namespace.
  #
  # Data classification (critical): everything warren touches is RESTRICTED.
  # All figures (balances, spend, lifetime totals, conversion amounts) are
  # written by the agent ITSELF into memory-mcp (finance namespace) — the
  # designated in-cluster Restricted store. This cron sends NO Pushover and NO
  # email, and warren is instructed to reply with a FIGURE-FREE status token
  # only, because this job's stdout is shipped to Loki (indexed). Rob reads the
  # refreshed plan through the frontend / Ghostfolio, never from a log or mail.
  #
  # Persist-first: a monthly Owl solve is heavy and can outlast a synchronous
  # A2A call. warren's system prompt already writes the result entity + inputs
  # FIRST, then solves, then appends outputs — so even if this cron's call
  # times out, the plan is still saved. The cron failing then is the correct,
  # visible last-run signal (failedJobsHistoryLimit).
  #
  # Governed by the claude-runner trial policy — re-add `suspend: true` to
  # pause without tearing down. Unsuspended 2026-09-25 (Rob) — the warren agent +
  # Owl + memory-write path were already proven end-to-end this session, so it
  # goes live directly. Next scheduled run: the 1st at 09:00 ET.
  #
  # Mechanics: the A2A call + the figure-free status gate live in the shared,
  # tested resources/warren_plan_refresh.py (over resources/a2a_client.py); this
  # cron supplies only the domain prompt. Migrated 2026-11-16 off the dead
  # kagent-1.0 per-agent endpoint (`http://warren.ai:8080/`, removed by kagent's
  # ATE rewrite) onto the controller's shared MCP interface — see
  # resources/a2a_client.py's module docstring. That move also drops a fixed
  # messageId that risked pinning an eternal stale Session; a2a_client appends a
  # per-run nonce instead.
  suspend: false
  schedule: "0 9 1 * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # An Owl solve (Monte Carlo + MILP tax optimization) plus the agent's
      # tool round-trips can run for minutes on the Spark. 30 min is a
      # comfortable ceiling; persist-first means a timeout still saves the plan.
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: local-cron
          annotations:
            k8tz.io/inject: "false"
        spec:
          # amd64 image; ai ns also has arm64 Spark nodes — pin so the pod
          # can't land on Spark and hit an exec-format error.
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: local-cron
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: refresh
              # Stdlib-only runner (resources/warren_plan_refresh.py) — no more
              # curl/jq, so this is the same python image every other
              # kagent-tier local-cron job uses.
              image: docker.io/library/python:3.15@sha256:c3f4160f1cceaf4daa49e2b0b693cae9bb2405efe9e8f8f519dde1ea6c831248
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - exec python3 /app/warren_plan_refresh.py
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
                - name: AGENT_URL
                  # kagent 1.0 ATE removed the per-agent Service + A2A endpoint;
                  # invocation now goes through the controller's own MCP interface
                  # (kagent-dev/kagent#1160), shared by every agent.
                  value: http://kagent-controller.ai:8083/mcp
                - name: AGENT
                  value: warren
                - name: AGENT_NAME
                  value: warren
                - name: BUDGET_SECONDS
                  value: "1500"
                - name: PROMPT
                  value: >-
                    You are invoked by an unattended MONTHLY cron to refresh Robert every retirement plan. Do the full refresh yourself with your tools, following your persist-first rule strictly: (1) FIRST create-or-update the plan result entity in the finance memory namespace with today date and the inputs you already know; (2) pull current portfolio state from Ghostfolio and the finance model plus prior plan from memory; (3) re-solve the retirement plan with Owl; (4) append the solved outputs (retire age, solvent-to age, spend, Roth-conversion schedule, flagged assumptions) as observations on that same entity. ALL figures stay in memory (finance namespace) — that is the Restricted store. This is a one-way unattended run: never ask a question. Your REPLY to THIS message is written to an in-cluster log, so it must contain NO figures, balances, or dollar amounts. Reply with EXACTLY one line: REFRESHED ok on success, or ERROR: followed by a short non-numeric reason if you could not complete and persist the plan.
              # No secretRef: this job sends NO Pushover and NO email. warren
              # holds its own tool credentials in-cluster; the cron only pokes it.
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: local-cron-scripts
                defaultMode: 0o555
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
