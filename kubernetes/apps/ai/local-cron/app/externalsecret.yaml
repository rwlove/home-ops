---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: local-cron
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: local-cron-secret
    creationPolicy: Owner
  data:
    # Pushover — the digest sink (private). Reuses the same 1P `Pushover`
    # item the alertmanager path uses (see
    # observability/kube-prometheus-stack/app/externalsecret.yaml). Because
    # it is a private channel to Rob, the digest can safely carry
    # namespace/app names that a public GitHub artifact must not.
    #
    # There is DELIBERATELY no ANTHROPIC_API_KEY / CLAUDE_CODE_OAUTH_TOKEN
    # here — summarization runs on the in-cluster local Ollama, per
    # HOMELAB-SPEC Layer 6 (the whole point of this tier is to not burn
    # Anthropic tokens on summarize/classify/log-triage work).
    - secretKey: PUSHOVER_TOKEN
      remoteRef:
        key: Pushover
        property: alertmanager_token
    - secretKey: PUSHOVER_USER
      remoteRef:
        key: Pushover
        property: userkey
---
# GitHub PR-creation token for the DOER pipeline (write-gate tier). Kept in its OWN
# target Secret (kagent-doer-secret), mounted ONLY into the doer CronJob(s) — the
# read-only triage/skim/digest jobs never see a write credential (least privilege).
# Fine-grained PAT scoped to rwlove/home-ops, Contents:write + PullRequests:write only
# (no merge; `main` is branch-protected). The local-model AGENT NEVER sees this — only
# the deterministic pipeline holds it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-doer
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kagent-doer-secret
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_PR_TOKEN
      remoteRef:
        key: kagent-doer
        property: pr_token
---
# LubeLogger Viewer-scoped API key for the cooter recall-watch (read-only).
# Kept in its OWN target Secret (cooter-recall-secret), mounted ONLY into the
# recall CronJob — the read-only triage/skim/digest jobs never see it (least
# privilege, same pattern as the doer PR token above). Rob must mint a
# Viewer-scoped API key in LubeLogger (Settings > API) and store it on the
# existing 1Password `lubelogger` item as property `api_key`. Viewer scope is
# read-only: it can list vehicles but cannot mutate any record.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cooter-recall
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cooter-recall-secret
    creationPolicy: Owner
  data:
    - secretKey: LUBELOGGER_API_KEY
      remoteRef:
        key: lubelogger
        property: api_key
