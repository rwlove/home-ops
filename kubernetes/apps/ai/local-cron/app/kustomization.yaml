---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cnp-allow.yaml
  - ./cronjob-cooter-recall.yaml
  - ./cronjob-cooter-reminder-digest.yaml
  - ./cronjob-homeops-hygiene.yaml
  - ./cronjob-loki-error-skim.yaml
  - ./cronjob-ml-doer.yaml
  - ./cronjob-ml-triage.yaml
  - ./cronjob-network-triage.yaml
  - ./cronjob-observability-doer.yaml
  - ./cronjob-observability-triage.yaml
  - ./cronjob-renovate-pr-digest.yaml
  - ./cronjob-smart-home-doer.yaml
  - ./cronjob-smart-home-triage.yaml
  - ./cronjob-storage-doer.yaml
  - ./cronjob-storage-triage.yaml
  - ./cronjob-warren-plan-refresh.yaml
  - ./externalsecret.yaml
  - ./rbac.yaml
configMapGenerator:
  - name: local-cron-scripts
    files:
      - a2a_client.py=./resources/a2a_client.py
      - doer_pipeline.py=./resources/doer_pipeline.py
      - triage_run.py=./resources/triage_run.py
generatorOptions:
  disableNameSuffixHash: true
