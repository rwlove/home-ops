---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cnp-allow.yaml
  - ./cronjob-cooter-recall.yaml
  - ./cronjob-loki-error-skim.yaml
  - ./cronjob-ml-doer.yaml
  - ./cronjob-ml-triage.yaml
  - ./cronjob-network-triage.yaml
  - ./cronjob-observability-doer.yaml
  - ./cronjob-observability-triage.yaml
  - ./cronjob-renovate-pr-digest.yaml
  - ./cronjob-smart-home-doer.yaml
  - ./cronjob-smart-home-triage.yaml
  - ./cronjob-storage-doer.yaml
  - ./cronjob-storage-triage.yaml
  - ./externalsecret.yaml
  - ./rbac.yaml
configMapGenerator:
  - name: doer-pipeline
    files:
      - doer_pipeline.py=./resources/doer_pipeline.py
generatorOptions:
  disableNameSuffixHash: true
