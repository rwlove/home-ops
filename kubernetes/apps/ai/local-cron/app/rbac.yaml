---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/serviceaccount-v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-cron
# Zero Kubernetes API access by design. This job reads log state via the
# Loki HTTP API (read-only), summarizes with the in-cluster Ollama HTTP
# API, and posts one email via notify-mcp (/send) — none of which touch the
# k8s API. So there is no Role or RoleBinding. If a future workflow genuinely
# needs the k8s API, give it a narrowly-scoped read-only Role here (a hard
# boundary) — never the MCP broker (see ./cnp-allow.yaml and ./README.md).
automountServiceAccountToken: false
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/serviceaccount-v1.json
# Scoped read identity for ONLY the storage-triage Longhorn backup-recency
# backstop (cronjob-storage-triage.yaml). The matching Role/RoleBinding live
# in kubernetes/apps/longhorn-system/longhorn/config/ (Roles are namespace-
# scoped to the namespace they grant access IN, not to the SA's own
# namespace -- see that file's comment). automountServiceAccountToken stays
# false here; only that one CronJob's pod spec overrides it to true.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-cron-storage-verify
automountServiceAccountToken: false
