---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: memory-sync-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: memory-sync
  # Additive — the ai ns default-deny is the lockdown; these punch holes.
  # DNS egress is covered by the baseline allow-dns component. Both callees
  # re-add the matching INGRESS in their own app's cnp-allow.yaml.
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    # obsidian-couchdb (collab ns) — the vault-bridge sidecar materializes the
    # `claude` DB from here (:5984). Service name is the app-template controller
    # name obsidian-couchdb.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: collab
            app.kubernetes.io/name: obsidian-couchdb
      toPorts:
        - ports:
            - port: "5984"
              protocol: TCP
    # memory-mcp (mcp-system ns) — the ingest writes entities/observations here
    # over its MCP HTTP API (:8070).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: memory-mcp
      toPorts:
        - ports:
            - port: "8070"
              protocol: TCP
