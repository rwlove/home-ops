---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: memory-sync
  labels:
    app.kubernetes.io/name: memory-sync
spec:
  # Verified 2026-09-23 (manual test-run: 31 notes ingested, 0 failed, graph
  # 36→67, new entities searchable) → unsuspended. Weekly (memory changes
  # slowly): Sun 05:00 UTC. Re-add `suspend: true` to pause without teardown.
  schedule: "0 5 * * 0"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # Materialize (~30s) + ingest ~50 notes over the MCP API (each triggers a
      # bge-m3 embed). 15 min is comfortable.
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: memory-sync
          annotations:
            k8tz.io/inject: "false"
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: memory-sync
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          initContainers:
            # NATIVE SIDECAR (restartPolicy: Always) — the official livesync-cli
            # daemon materializes the `claude` vault into the shared scratch dir
            # for the life of the ingest container; kubelet terminates it once
            # the Job completes (native-sidecar semantics, k8s >= 1.29). Verbatim
            # from ai/claude-runner (same bridge, same secret shape).
            - name: vault-bridge
              image: ghcr.io/vrtmrz/livesync-cli:1.0.17-cli
              restartPolicy: Always
              imagePullPolicy: IfNotPresent
              args:
                - --settings
                - /config/settings.json
                - --vault
                - /vault
                - daemon
              env:
                - name: LIVESYNC_DB_PATH
                  value: /db
                - name: TZ
                  value: America/New_York
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 25m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: vault-scratch
                  mountPath: /db
                  subPath: db
                - name: vault-scratch
                  mountPath: /vault
                  subPath: vault
                - name: bridge-config
                  mountPath: /config
                  readOnly: true
                - name: bridge-tmp
                  mountPath: /tmp
          containers:
            - name: ingest
              # stdlib-only ingest (urllib) — no pip, so no pypi egress needed.
              # docker.io/library/python is allowlisted.
              image: docker.io/library/python:3.14-slim
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                # Flux postBuild envsubst is STRICT — every shell `$` is doubled
                # ($$) so the rendered manifest carries a literal `$`.
                - |
                  # Wait for the vault-bridge sidecar to materialize the memory
                  # notes before ingesting.
                  i=0
                  until [ -n "$$(ls /vault/projects/home-ops/memory/*.md 2>/dev/null | head -n1)" ]; do
                    i=$$((i + 1))
                    if [ "$$i" -gt 60 ]; then
                      echo "FATAL: vault not materialized after ~300s"; exit 1
                    fi
                    echo "waiting for vault materialization ($$i)..."
                    sleep 5
                  done
                  echo "vault materialized; settling 10s"
                  sleep 10
                  exec python3 /app/ingest.py
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
                - name: MEMORY_MCP_URL
                  value: http://memory-mcp.mcp-system.svc.cluster.local:8070/mcp
                - name: VAULT_DIR
                  value: /vault
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: vault-scratch
                  mountPath: /vault
                  subPath: vault
                  readOnly: true
                - name: ingest-script
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: vault-scratch
              emptyDir:
                sizeLimit: 1Gi
            - name: bridge-config
              secret:
                secretName: memory-sync-vault-bridge-secret
            - name: bridge-tmp
              emptyDir:
                medium: Memory
                sizeLimit: 128Mi
            - name: ingest-script
              configMap:
                name: memory-sync-ingest
                defaultMode: 0o555
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
