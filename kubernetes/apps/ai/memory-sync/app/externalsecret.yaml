---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memory-sync-vault-bridge
spec:
  # Same livesync-cli settings.json as ai/claude-runner + ai/hermes: mounts the
  # in-cluster CouchDB `claude` DB read-only into the bridge sidecar. Reuses the
  # 1P `obsidian` item (couchdb_username/password). encrypt:false — the `claude`
  # DB is not E2EE (plaintext-path doc IDs).
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: memory-sync-vault-bridge-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        settings.json: |-
          {
            "couchDB_URI": "http://obsidian-couchdb.collab.svc.cluster.local:5984",
            "couchDB_USER": "{{ .couchdb_username }}",
            "couchDB_PASSWORD": "{{ .couchdb_password }}",
            "couchDB_DBNAME": "claude",
            "encrypt": false,
            "passphrase": "",
            "liveSync": true,
            "syncOnSave": true,
            "syncOnStart": true,
            "usePluginSync": false,
            "isConfigured": true
          }
  dataFrom:
    - extract:
        key: obsidian
