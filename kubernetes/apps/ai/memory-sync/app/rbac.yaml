---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: memory-sync
# Zero Kubernetes API access by design. The job reads the materialized vault
# (from the livesync-cli bridge, over CouchDB) and writes to memory-mcp over its
# MCP HTTP API — neither touches the k8s API. So there is no Role or RoleBinding.
automountServiceAccountToken: false
