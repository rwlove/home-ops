---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: ai
  labels:
    # kagent 1.0: lets the kagent-controller reach the ate-system ate-api-server
    # (Agent Substrate). Required for the managed-kagent Harness + WorkerPool.
    ate.dev/api-access: "true"
    goldilocks.fairwinds.com/enabled: "true"
    kustomize.toolkit.fluxcd.io/prune: disabled
    # PSS ramp (audit+warn now, enforce per phase): baseline (see docs/src/pod_security_audit.md).
    # Mostly stateless app-template HRs (khoj, comfyui);
    # already partially hardened (PR #11604). Ramp: audit -> warn -> enforce.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
