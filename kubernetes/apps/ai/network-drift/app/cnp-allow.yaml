---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# Egress allows for the network-drift NetBox-freshness sweep (ai ns). Additive —
# the ai namespace default-deny enforces both directions; these punch the holes.
# DNS egress is provided cluster-wide by the baseline network-policy component,
# so it is not repeated here.
#
# Deterministic and READ-ONLY, so the egress set stays tight: the read-only MCP
# backends it diffs (netbox/omada/github) and the notify sink. The Phase 2
# k8s/Cilium collectors reach the kube-apiserver via the baseline allow-apiserver
# rule (not repeated here). NO world:443 (stdlib Python, no npm/API install).
#
# The matching INGRESS on the MCP backends is granted by the shared mcp-system
# `kagent-mcp-read-allow` CNP (which already lists network-drift for :8000/:3000/
# :8080/:8060). Tool scoping is the MCP services' own read-only posture (omada-mcp
# all:r; netbox-mcp read token) + the SA's read-only RBAC, not this L4 policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: network-drift-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: network-drift
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    # NetBox MCP (record) — read-only IPAM/DCIM.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: netbox-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Omada MCP (live reality) — read-only SDN inventory (all:r).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: omada-mcp
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # GitHub MCP (the lovenet-network-configuration repo) — read-only file fetch
    # for the dhcpd + DNS-zone collectors (Phase 2).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: github-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # NOTE: kube-apiserver egress (the Phase 2 k8s/Cilium collectors) is already
    # granted cluster-wide by the baseline `allow-apiserver` (reserved:kube-
    # apiserver entity, :6443) — not repeated here. See
    # components/network-policy/baseline.
    #
    # Phase 4 ONLY (network-drift-upsert, shares this label): the gated auto-write
    # hits the NetBox REST API at https://netbox.${SECRET_DOMAIN}, which resolves
    # to the external envoy LB (container :10443, same path netbox-mcp uses). The
    # read-only DETECTOR never connects here (no write token); this rule is inert
    # for it.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
            - port: "10443"
              protocol: UDP
            - port: "443"
              protocol: TCP
    #
    # notify-mcp — the ONLY notification channel: the sweep POSTs a themed HTML
    # digest to /send:8060; the relay recipient-locks it to Rob.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: notify-mcp
      toPorts:
        - ports:
            - port: "8060"
              protocol: TCP
