---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
# Egress allows for the network-drift NetBox-freshness sweep (ai ns). Additive —
# the ai namespace default-deny enforces both directions; these punch the holes.
# DNS egress is provided cluster-wide by the baseline network-policy component,
# so it is not repeated here.
#
# Phase 1 is deterministic and READ-ONLY, so the egress set is tight: the two
# read-only MCP backends it diffs + the notify sink. NO world:443 (no npm/API
# install — stdlib Python) and NO github-mcp yet (the dhcpd/DNS repo collectors
# arrive in Phase 2, which re-adds github-mcp:8080 here).
#
# The matching INGRESS on the MCP backends is granted by the shared mcp-system
# `kagent-mcp-read-allow` CNP (which already lists network-drift for :8000/:3000/
# :8060). Tool scoping is the MCP services' own read-only posture (omada-mcp
# all:r; netbox-mcp read token), not this L4 policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: network-drift-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: network-drift
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    # NetBox MCP (record) — read-only IPAM/DCIM.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: netbox-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Omada MCP (live reality) — read-only SDN inventory (all:r).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: omada-mcp
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # notify-mcp — the ONLY notification channel: the sweep POSTs a themed HTML
    # digest to /send:8060; the relay recipient-locks it to Rob.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: notify-mcp
      toPorts:
        - ports:
            - port: "8060"
              protocol: TCP
