---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: network-drift
  labels:
    app.kubernetes.io/name: network-drift
spec:
  # Continuous NetBox-freshness sweep — Loop B, Phase 1 (deterministic detector).
  # Pulls LIVE reality (Omada) and NetBox (record), diffs them in deterministic
  # Python (ZERO LLM tokens), and emails Rob ONLY when the drift picture CHANGES.
  # NetBox is an observer/mirror: this sweep NEVER writes NetBox, Omada, or any
  # device — it is detect-only. The LLM/kagent residual (classify unknowns,
  # compose narrative) and any auto-write are Phase 4 and ship OFF.
  #
  # Reads go through the per-backend READ-ONLY MCP services (netbox-mcp:8000,
  # omada-mcp:3000 — omada-mcp is OMADA_TOOL_CATEGORIES=all:r) over plain JSON-RPC,
  # NOT the mcp-gateway broker. Credentials stay in those services; this job holds
  # none. Because the diff is cheap, the sweep runs DAILY (the old monolithic LLM
  # reconcile ran monthly).
  #
  # State-change-aware: a drift that is already known stays SILENT on later runs;
  # the ack-list (acked.txt, Git-editable) suppresses planned items entirely.
  # "No change" -> sends nothing, so a healthy network never emails.
  #
  # SHIPPED SUSPENDED (behavior changed from the LLM monolith). Rob manual-tests
  #   kubectl -n ai create job --from=cronjob/network-drift network-drift-test
  # verifies the digest (or clean silence), then flips suspend:false.
  suspend: true
  schedule: "30 7 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # Deterministic, stdlib-only — no npm/pip install, a handful of HTTP reads.
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: network-drift
          annotations:
            k8tz.io/inject: "false"
        spec:
          # amd64: the ai ns also has arm64 Spark nodes — pin so the pod can't
          # land on Spark and hit an exec-format error.
          nodeSelector:
            kubernetes.io/arch: amd64
          # Scoped read-only SA (get/list nodes/services/ciliumloadbalancerippools
          # — see rbac.yaml) for the Phase 2 k8s/Cilium collectors. Token IS
          # mounted here because cluster read is needed; the SA itself grants no
          # write, no secrets.
          serviceAccountName: network-drift
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            # Non-root write to the ceph-block state PVC.
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: sweep
              # stdlib-only Python (no pip install) — matches the local-cron jobs.
              image: docker.io/library/python:3.15
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - exec python3 /config/netbox_sync.py
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: STATE_DIR
                  value: /state
                - name: MCP_CONFIG
                  value: /config/mcp.json
                - name: ACKED_FILE
                  value: /config/acked.txt
                - name: NOTIFY_URL
                  value: http://notify-mcp.mcp-system:8060/send
                - name: AGENT
                  value: network-operator
                # Phase 2 collectors: dhcpd + DNS from the config repo (github),
                # and k8s nodes + LB Service IPs + Cilium LB pools (scoped SA).
                - name: ENABLE_GITHUB
                  value: "true"
                - name: ENABLE_K8S
                  value: "true"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: state
                  mountPath: /state
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: network-drift-config
                defaultMode: 0o555
            - name: state
              persistentVolumeClaim:
                claimName: network-drift-state
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
