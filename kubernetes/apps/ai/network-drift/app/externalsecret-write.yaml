---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# SCOPED NetBox WRITE token for the Phase 4 gated auto-write (autowrite.py).
# This is deliberately its OWN narrow token — NOT the read token netbox-mcp uses.
#
# OFF-GATE BY CONSTRUCTION: the 1Password property below does NOT exist until Rob
# creates it, so this ExternalSecret stays NotReady and the (already-suspended)
# upsert CronJob cannot start. Creating it is one of the deliberate steps to turn
# Phase 4 on; it does nothing until AUTOWRITE_APPLY is also flipped to "true".
#
# PROVISIONING (Rob, when enabling Phase 4):
#   1. In NetBox, create an API token for a service account whose object-based
#      permissions grant WRITE on ONLY: ipam | ip-address, ipam | prefix,
#      ipam | vlan, dcim | device, dcim | interface. NEVER global write, NEVER
#      users/permissions/secrets. (Phase 4's shipped SAFE set only needs ipam |
#      ip-address; the wider scope is for broadening later.)
#   2. Store that token on the 1Password `netbox` item as property
#      `netbox_sync_write_token`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: network-drift-write
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: network-drift-write-secret
  data:
    - secretKey: NETBOX_TOKEN
      remoteRef:
        key: netbox
        property: netbox_sync_write_token
