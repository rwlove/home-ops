---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Claude MAX subscription OAuth token for the headless `claude` CLI (output of
# `claude setup-token`, ~1yr TTL). SUBSCRIPTION ONLY — never an Anthropic API key
# (Rob's hard constraint; same posture as the hermes escalation skill). Its OWN
# 1Password item so nothing else shares its blast radius.
#
# PROVISIONING (Rob, one-time): run `claude setup-token` on an authenticated
# machine, then store the token on a NEW 1Password `network-drift` item as
# property `claude_code_oauth_token`. Until it exists this ExternalSecret stays
# NotReady and the CronJob (shipped suspended anyway) cannot run.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: network-drift
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: network-drift-secret
    creationPolicy: Owner
  data:
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: network-drift
        property: claude_code_oauth_token
