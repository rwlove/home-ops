---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cnp-allow.yaml
  - ./cronjob.yaml
  - ./externalsecret.yaml
configMapGenerator:
  - name: network-drift-config
    files:
      - mcp.json=./resources/mcp.json
      - reconcile-prompt.txt=./resources/reconcile-prompt.txt
      - allowed-tools.txt=./resources/allowed-tools.txt
generatorOptions:
  disableNameSuffixHash: true
