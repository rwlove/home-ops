---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cnp-allow.yaml
  - ./cronjob.yaml
  - ./pvc.yaml
configMapGenerator:
  - name: network-drift-config
    files:
      - netbox_sync.py=./resources/netbox_sync.py
      - mcp_http.py=./resources/mcp_http.py
      - mcp.json=./resources/mcp.json
      - acked.txt=./resources/acked.txt
generatorOptions:
  disableNameSuffixHash: true
