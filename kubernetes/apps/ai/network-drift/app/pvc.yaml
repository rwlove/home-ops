---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/persistentvolumeclaim-v1.json
# Durable drift-state store for the NetBox-freshness sweep: holds seen.json, the
# set of drift fingerprints observed on the previous run. This is what makes the
# digest STATE-CHANGE-aware — the sweep emails only when the set changes, never
# the same pending item every day. Regenerable (a lost store just re-emails the
# current active drift once), so ceph-block per the storage-class durability rule
# for regenerable state — NOT Longhorn.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: network-drift-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ceph-block
