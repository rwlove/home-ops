---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app network-drift
spec:
  # Continuous NetBox-freshness sweep — Loop B, Phase 1 (deterministic detector).
  # Daily, read-only diff of LIVE reality (Omada) vs NetBox (record) in stdlib
  # Python, ZERO LLM tokens; emails Rob only when the drift picture CHANGES.
  # Detect-only — never writes NetBox/Omada/devices. Replaced the monthly
  # monolithic-LLM reconcile (the LLM/kagent residual + any auto-write are Phase 4
  # and ship OFF). Needs no secret: the read-only MCP backends hold their own
  # creds. Ships SUSPENDED pending Rob's log-verified test run.
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: ai
  path: ./kubernetes/apps/ai/network-drift/app
  interval: 1h
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: home-ops-kubernetes
    namespace: flux-system
