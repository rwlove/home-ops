---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama-spark
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    controllers:
      backend:
        pod:
          nodeSelector:
            node-role.kubernetes.io/gpu: blackwell

          tolerations:
            # Spark is tainted kubernetes.io/arch=arm64:NoSchedule to keep
            # amd64-only workloads off it (the scheduler doesn't validate
            # image arch pre-binding; the kubelet only catches mismatches at
            # pull time — too late). This HR is arm64-native (ollama image
            # is multi-arch), so we tolerate it explicitly.
            - key: kubernetes.io/arch
              operator: Equal
              value: arm64
              effect: NoSchedule
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule

          priorityClassName: ai-gpu-critical

        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        containers:
          main:
            image:
              repository: docker.io/ollama/ollama
              tag: 0.32.3@sha256:ec24bcaa2a810eb74171ce7c517813ef4821ed678988845e8d76cf62467036d4

            env:
              OLLAMA_HOST: 0.0.0.0
              OLLAMA_ORIGINS: "*"
              OLLAMA_LOG_LEVEL: info
              OLLAMA_MODELS: &pvc /models
              # qwen3.5:122b-a10b (q4_K_M, ~81 GB) is the reasoning tier. Its
              # cold-load off the ceph PVC + hybrid-arch init exceeds the 20m
              # bound tuned for the smaller qwen3-next it replaced; 30m gives
              # headroom. KNOWN DOWNSIDE: a cold-load (pod restart / eviction)
              # stalls the reasoning tier for >10m — the MAX_LOADED keep-warm
              # below makes cold-loads rare, but can't make them fast.
              OLLAMA_LOAD_TIMEOUT: 30m
              OLLAMA_KV_CACHE_TYPE: q8_0
              OLLAMA_FLASH_ATTENTION: 1
              OLLAMA_CONTEXT_LENGTH: 16384
              OLLAMA_NUM_PARALLEL: 4
              # Never idle-unload. MAX_LOADED lets the working set co-reside,
              # but the default 5m keep-alive would unload qwen3.5 between
              # bursts on this low-traffic fleet — and its cold-load is >10m.
              # -1 pins the loaded set (qwen3.5 + coder + embedders) warm so
              # cold-loads happen only on an actual pod restart, not every idle.
              OLLAMA_KEEP_ALIVE: "-1"
              # Working set after the qwen3-next -> qwen3.5:122b-a10b swap:
              #   qwen3.5:122b-a10b            -- fleet reasoning + Open WebUI
              #                                   + LightRAG (one shared model)
              #   qwen2.5-coder:32b            -- coder / reviewer agents
              #   bge-m3 + nomic-embed-text    -- RAG + wedge probe (always-warm)
              # = 4 distinct models steady-state → MAX_LOADED 4 (was 5 to cover
              # the prior transition; that headroom is gone under the 81 GB
              # model). TIGHTER BUDGET (accepted): worst-case unified-memory
              # residence ~qwen3.5(81) + coder(20) + embedders(1.3) + q8 KV ~
              # 105-115 GB of 128 GB — deliberately tighter than the ~90-105 GB
              # qwen3-next set. qwen3.5's GQA(2 KV heads) + linear-attention
              # layers keep KV modest. CUDA-mapped weights on Grace-Blackwell
              # unified memory don't bill against the kubelet's pod RSS (~14 GB
              # observed), so the 80Gi pod limit (runtime + KV headroom) holds.
              OLLAMA_MAX_LOADED_MODELS: 4

            resources:
              requests:
                memory: 32Gi
                cpu: 2000m
                nvidia.com/gpu: 1
              limits:
                memory: 80Gi
                nvidia.com/gpu: 1

            # GPU access is via the device plugin (nvidia.com/gpu: 1),
            # not privileged mode — /dev/nvidia* devices are mode 666
            # and injected by the kubelet. ollama does no chown/useradd
            # at startup, unlike comfyui, so privileged is not needed.
            # Baseline hardening applied minus runAsNonRoot (ollama's
            # config paths under /root remain root-owned) and minus
            # readOnlyRootFilesystem (models cached under /root/.ollama
            # backed by the PVC; CUDA compiles under /root/.cache).
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    service:
      backend:
        controller: backend
        ports:
          http:
            port: &httpPort 11434

    route:
      main:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: backend
                port: *httpPort

    persistence:
      data:
        existingClaim: ollama-spark-data-pvc
        advancedMounts:
          backend:
            main:
              - path: /.ollama

      models:
        existingClaim: ollama-spark-models-pvc
        advancedMounts:
          backend:
            main:
              - path: *pvc

      tmp:
        type: emptyDir
        enabled: true
        medium: Memory
        globalMounts:
          - path: /tmp
