---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    disableWait: true
  interval: 30m
  upgrade:
    disableWait: true
  values:
    controllers:
      backend:
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nvidia.com/gpu.present
                        operator: In
                        values:
                          - "true"

          nodeSelector:
            nvidia.com/gpu.present: "true"

          priorityClassName: ai-gpu-critical

        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        containers:
          main:
            image:
              repository: docker.io/ollama/ollama
              tag: 0.32.6@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42

            env:
              # LIBVA_DRIVER_NAME: i965
              OLLAMA_HOST: 0.0.0.0
              OLLAMA_ORIGINS: "*"
              OLLAMA_LOG_LEVEL: info
              OLLAMA_MODELS: &pvc /models
              OLLAMA_LOAD_TIMEOUT: 10m
              # https://github.com/ollama/ollama/blob/main/docs/faq.md#how-can-i-set-the-quantization-type-for-the-kv-cache
              OLLAMA_KV_CACHE_TYPE: q8_0
              OLLAMA_FLASH_ATTENTION: 1
              # Raised from ollama's 5m default on 2026-07-26. Frigate's
              # GenAI VLM was aging out between detections, so real
              # descriptions paid ~38s of cold load (vision projector
              # included) against ~1.5s warm.
              #
              # This is GLOBAL — ollama has no per-model TTL — so it also
              # pins bge-m3 and qwen2.5-coder for longer. That is the real
              # cost: the resident FLOOR rises, where previously models
              # decayed between bursts, and that floor eats Immich CLIP
              # burst headroom on a GPU that also serves Renee's whisper.
              # The measured ceiling is unchanged at 7.99 GiB.
              #
              # 30m rather than infinite: long enough that the 5-min
              # ollama-vlm-warm probe always lands inside the window, short
              # enough that a genuinely idle stretch still releases VRAM.
              # The two are a PAIR — changing the probe cadence or this TTL
              # without re-checking the other reintroduces the cold-load
              # penalty (cadence must stay well inside TTL).
              OLLAMA_KEEP_ALIVE: 30m
              # Tightened 2026-05-18 (Phase 0d audit caught CPU-spill from
              # P40 VRAM exhaustion): NUM_PARALLEL=4 × KV cache at 16384
              # context blew past 24 GiB VRAM headroom after immich-ml
              # workloads landed. NUM_PARALLEL=1 + CONTEXT=8192 keeps
              # qwen2.5:7b + KV cache fully GPU-resident (~5.7 GiB total).
              # See docs/src/audit/post-spark-tool-call-leakage-2026-05-18.md.
              OLLAMA_CONTEXT_LENGTH: 8192
              OLLAMA_NUM_PARALLEL: 1
              # Raised 1→2 on 2026-07-25. The old comment claimed the cap
              # was "safe — there's nothing to evict", but that stopped
              # being true once bge-m3 landed here: the ollama-embed
              # blackbox probe reloads bge-m3 every 5 min while opencode's
              # small_model pulls a chat model, so with a 1-model cap the
              # two evicted each other continuously. Observed 2026-07-25:
              # bge-m3 08:18 → qwen2.5:7b 09:26 → bge-m3 09:28, each a
              # cold GGUF load, `loaded runners count=1` every time.
              #
              # 2 let the embedder and the coder stay co-resident:
              # bge-m3 (0.62 GiB measured) + qwen2.5-coder:7b (4.58 GiB
              # measured) = 5.2 GiB of the ~13 GiB the P40 has free after
              # whisper / immich-ml / pet-tagger, leaving ~7.9 GiB for
              # Immich CLIP bursts.
              #
              # Raised 2→3 on 2026-07-26 to seat Frigate's GenAI VLM.
              # The earlier "deliberately NOT 3" reasoning was scoped to a
              # third 7b-class model (~10.7 GiB resident, ~2.3 GiB left —
              # the 2026-05-18 VRAM-exhaustion zone, see
              # docs/src/audit/post-spark-tool-call-leakage-2026-05-18.md).
              # That still holds; this third model is far smaller.
              # MEASURED, not predicted, on this GPU:
              #   bge-m3        0.62 GiB
              #   qwen2.5-coder 4.58 GiB
              #   qwen2.5vl:3b  2.79 GiB   <- the VLM (3.2 GB on disk)
              #   ------------------------
              #   total         7.99 GiB   -> ~4.2 GiB left for CLIP bursts
              # Roughly double the headroom of the incident configuration,
              # but meaningfully tighter than the 2-model layout. If Immich
              # CLIP starts spilling to CPU, this is the first thing to
              # reconsider.
              #
              # Heavy coding still routes to the Spark vLLM driver.
              OLLAMA_MAX_LOADED_MODELS: 3

            resources:
              requests:
                memory: 6G
                cpu: 2000m
                nvidia.com/gpu: 1
              limits:
                memory: 6G
                nvidia.com/gpu: 1

            # GPU access is via the device plugin (nvidia.com/gpu: 1),
            # not privileged mode — /dev/nvidia* devices are mode 666
            # and injected by the kubelet. ollama does no chown/useradd
            # at startup, unlike comfyui, so privileged is not needed.
            # Baseline hardening applied minus runAsNonRoot (ollama's
            # config paths under /root remain root-owned) and minus
            # readOnlyRootFilesystem (models cached under /root/.ollama
            # backed by the PVC; CUDA compiles under /root/.cache).
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    service:
      backend:
        controller: backend
        ports:
          http:
            port: &httpPort 11434

    route:
      main:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: backend
                port: *httpPort

    persistence:
      data:
        existingClaim: ollama-data-pvc
        advancedMounts:
          backend:
            main:
              - path: /.ollama

      # PV needs to be on the node running Ollama. I'm currently using a Longhorn volume with 1 replica
      # and locality set to 'strict-local' so that I ensure it gets scheduled onto the right node. If
      # I don't do this then I get model loading timeouts from the clients: https://github.com/ollama/ollama/issues/9016
      models:
        existingClaim: ollama-models-pvc
        advancedMounts:
          backend:
            main:
              - path: *pvc

      tmp:
        type: emptyDir
        enabled: true
        medium: Memory
        globalMounts:
          - path: /tmp
