---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: opencode-oauth2-proxy-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: opencode-oauth2-proxy
  # Additive — default-deny is what triggers the lockdown; these rules
  # punch holes through it.
  enableDefaultDeny:
    egress: false
    ingress: false
  ingress:
    # HTTPRoute on internal gateway → opencode-oauth2-proxy:4180
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
  egress:
    # OIDC discovery + token exchange against Authelia at
    # auth.${SECRET_DOMAIN}. Same split-horizon → envoy socket-lb rewrite
    # to the envoy pod on container port 10443 as the khoj-oauth2-proxy
    # CNP (see project_cilium_l4_port_targetport.md). Upstream →
    # opencode.ai.svc.cluster.local:4096 is intra-namespace, covered by
    # baseline allow-intra-namespace.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
