---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: opencode-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: opencode
  # Additive — default-deny (ai ns) is what triggers the lockdown; these
  # rules punch holes through it.
  enableDefaultDeny:
    egress: false
    ingress: false
  # No ingress rules: opencode-oauth2-proxy is the only door, and the
  # baseline allow-intra-namespace already permits oauth2-proxy -> opencode.
  # No external clients hit opencode directly.
  #
  # ---- BLAST-RADIUS BOUNDARY ----
  # This egress block is the *real* MCP boundary. The Kuadrant broker's
  # internal svc has no JWT check, so reachability = network policy. Remove
  # the mcp-gateway rule below and the pod cannot reach ANY aggregated tool.
  # Because the broker fronts mutating backends (kubectl/omada/ha) with no
  # per-tool authz, allowing it at all grants the full surface once a
  # session lifts the client-side `lovenet-gateway_*: false` gate. Accepted
  # under Plan C (interactive, Rob-only via oauth2-proxy). Do not point an
  # unattended loop at this pod until per-tool authz lands.
  egress:
    # Lovenet MCP gateway (Kuadrant broker) — internal svc, no token.
    # NOTE(network-operator): confirm the broker pod's actual label with
    #   kubectl -n mcp-system get pod --show-labels
    # The broker is deployed by the mcp-controller; adjust the selector if
    # it is not app.kubernetes.io/name: mcp-gateway.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: mcp-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Model providers at *.thesteamedcrab.com resolve via split-horizon
    # DNS to the envoy LB IP; Cilium socket-lb rewrites to the envoy pod +
    # targetPort 10443 before policy eval, so allow the envoy pod on 10443
    # (NOT world:443 for these — same mechanics as the oauth2-proxy CNP).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    # Genuinely-external HTTPS: npm (oh-my-openagent plugin install on first
    # run) + whatever the `bash` tool legitimately needs (git, pip, etc.).
    # A coding agent needs broad egress to be useful; this is part of the
    # accepted Plan-C surface. matchPattern FQDN pinning is inert here (A-only
    # records / socket-lb) per project_cilium_matchpattern_fqdn_limits.md, so
    # this collapses to world:443 — the repo precedent (khoj, comfyui).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
