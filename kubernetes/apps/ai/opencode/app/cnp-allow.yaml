---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: opencode-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: opencode
  # Additive — default-deny (ai ns) is what triggers the lockdown; these
  # rules punch holes through it.
  enableDefaultDeny:
    egress: false
    ingress: false
  ingress:
    # Internal gateway (envoy) → opencode:4096. Auth is enforced at the
    # gateway by the extAuth SecurityPolicy (opencode-extauth); opencode's
    # own basic-auth is the second gate for direct in-cluster callers.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "4096"
              protocol: TCP
  # ---- BLAST-RADIUS BOUNDARY ----
  # The egress to the MCP broker below is the *real* MCP boundary. The
  # Kuadrant broker's internal svc has no JWT check, so reachability =
  # network policy. Remove the mcp-gateway rule and the pod cannot reach
  # ANY aggregated tool. Because the broker fronts mutating backends
  # (kubectl/omada/ha) with no per-tool authz, allowing it at all grants
  # the full surface once a session lifts the client-side
  # `lovenet-gateway_*: false` gate. Accepted under Plan C (interactive,
  # Rob-only via extAuth). Do not point an unattended loop at this pod
  # until per-tool authz lands.
  egress:
    # Lovenet MCP gateway — the ISTIO-managed gateway service, not the
    # broker. The broker (app.kubernetes.io/name: mcp-gateway) accepts
    # ingress only from the istio gateway pod, so addressing it directly is
    # dropped by mcp-gateway-broker-allow — which is why MCP was silently
    # dead here. In-cluster clients hit mcp-gateway-istio.mcp-system:8080 by
    # DNS, which mcp-gateway-istio-allow permits via `fromEntities: cluster`.
    # Namespace-wide selector matches the langgraph-agents precedent (the
    # reference in-cluster MCP client named in that policy's comment).
    #
    # 8070 is memory-mcp, addressed DIRECTLY rather than through the broker.
    # It predates the gateway being usable and is kept because it is cheap
    # (14 tools / ~3.2k tokens) and avoids paying the broker's full
    # tools/list fetch just to reach memory.
    #
    # The gateway is DISABLED again. It was enabled 2026-07-26 and reverted
    # the same day: see the token-budget note below.
    # Its tools/list is 1,266 tools
    # / 1.34 MB ≈ 334k tokens, far past vLLM's hard max_model_len of 65536 —
    # which is what silently killed every turn when it was last on. The fix
    # is opencode's own tools filter: it is applied CLIENT-SIDE BEFORE the
    # model call, so an allowlisted agent sends ~12k tokens of schemas, not
    # 334k. Measured LOCALLY (--pure, plugins off): 18.8k input tokens with
    # the whole gateway attached.
    #
    # That local figure does NOT hold in-cluster. Here the oh-my-openagent
    # plugin injects six more MCP servers and the baseline is already
    # 53-57k input tokens before any gateway tools. Adding ~12k of
    # allowlisted kubectl exceeded max_model_len and vLLM returned 400 on
    # every turn. The baseline must be cut before the gateway can be
    # enabled at ANY allowlist size.
    #
    # This means broker-side filtering (Kuadrant AuthPolicy — see
    # docs/src/mcp_tool_authz_design.md) is NOT required to make the gateway
    # usable; it is still required to make the restriction *enforceable*.
    # The allowlist in opencode.json is a context-budget control that also
    # happens to narrow reach — it is not a security boundary, because the
    # session could lift it. That is why the blast-radius note above still
    # stands and why this remains Plan C (interactive, Rob-only).
    #
    # Caveat: the filter saves context, not bandwidth. The pod still fetches
    # the full 1.34 MB tools/list on every session start.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8070"
              protocol: TCP
    # Model providers (vllm-driver-spark, vllm-coder-spark, ollama) are
    # in-cluster Services in THIS namespace — reached via the baseline
    # allow-intra-namespace rule, so no egress hole is needed here (this
    # replaced the previous *.thesteamedcrab.com + envoy:10443 path).
    #
    # Genuinely-external HTTPS: npm (oh-my-openagent plugin install on
    # first run) + whatever the `bash` tool legitimately needs (git, pip).
    # A coding agent needs broad egress to be useful; matchPattern FQDN
    # pinning is inert (A-only records) per
    # project_cilium_matchpattern_fqdn_limits.md, so this collapses to
    # world:443 (repo precedent: khoj, comfyui). This is a broader surface
    # than khoj/comfyui because the pod runs `bash` — arbitrary outbound
    # 443, not just registries. Accepted under Plan C (interactive,
    # Rob-only via extAuth); signed off by Rob 2026-07-24.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
