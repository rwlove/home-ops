---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencode
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: opencode-secret
    creationPolicy: Owner
    template:
      data:
        # Belt-and-suspenders behind extAuth (#12767, was oauth2-proxy):
        # opencode's own HTTP basic-auth guards the API/SDK surface even for
        # callers that bypass the browser SSO path. That second gate matters
        # more than the comment implied: `allow-intra-namespace` in this ns
        # is endpointSelector:{} / fromEndpoints:[{}] with no toPorts, so
        # EVERY pod in `ai` can already reach opencode:4096 directly. This
        # basic-auth is the only thing standing in front of a pod that runs
        # `bash`, holds four git deploy keys and can reach the MCP broker's
        # mutating surface. Do not remove it without replacing the boundary
        # at the network layer.
        #
        # Both fields must hold the credentials of an LLDAP user in
        # `group:lldap_admin` — the subject on the opencode.${SECRET_DOMAIN}
        # rule in authelia's access_control (policy: one_factor). Because
        # `one_factor` accepts HTTP Basic Auth, a single Authorization header
        # then satisfies BOTH gates: Authelia at the gateway and opencode
        # itself. That is what lets a headless client use the HTTPRoute:
        #
        #   opencode attach https://opencode.${SECRET_DOMAIN} -u <user> -p <pass>
        #
        # and is why the kubectl port-forward is no longer needed.
        #
        # USERNAME is not optional here. opencode defaults it to `opencode`
        # when unset, which passes its own gate but fails Authelia's — the
        # exact 401 seen while diagnosing this. Verified against the server:
        # wrong-user + right-password returns 401, so the username is
        # checked, not decorative.
        OPENCODE_SERVER_USERNAME: "{{ .SERVER_USERNAME }}"
        OPENCODE_SERVER_PASSWORD: "{{ .SERVER_PASSWORD }}"
  dataFrom:
    - extract:
        key: opencode
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Read-only GitHub deploy keys for the two private repos the agents clone.
# Deploy keys rather than a PAT: they are per-repository and carry a
# repo-side read_only flag, so the credential cannot push even if the pod is
# compromised (verified: `git push` is rejected by GitHub). A key cannot be
# reused across repos, hence one per repo. home-ops is public and needs none.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencode-git
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: opencode-git-secret
    creationPolicy: Owner
    template:
      data:
        SSH_KEY_LOVENET: "{{ .SSH_KEY_LOVENET }}"
        SSH_KEY_CONTAINERS: "{{ .SSH_KEY_CONTAINERS }}"
        SSH_KEY_ANSIBLE: "{{ .SSH_KEY_ANSIBLE }}"
        SSH_KEY_HOME_ASSISTANT_CONFIG: "{{ .SSH_KEY_HOME_ASSISTANT_CONFIG }}"
        KNOWN_HOSTS: "{{ .KNOWN_HOSTS }}"
  dataFrom:
    - extract:
        key: opencode-git
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Standing rules + skills, sourced from the vault via 1Password rather than
# committed. This repo is PUBLIC, and HOMELAB-SPEC names the media-download
# stacks (L2 invariant #2) — so it must not land in git. Delivering it as a
# Secret keeps the content in-cluster while still giving agents the rules
# they are expected to operate under.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencode-instructions
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: opencode-instructions-secret
    creationPolicy: Owner
    template:
      data:
        HOMELAB_SPEC: "{{ .HOMELAB_SPEC }}"
        PERSONA_BASE: "{{ .PERSONA_BASE }}"
        SKILLS_TGZ_B64: "{{ .SKILLS_TGZ_B64 }}"
  dataFrom:
    - extract:
        key: opencode-instructions
