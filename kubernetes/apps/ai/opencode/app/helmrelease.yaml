---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opencode
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      opencode:
        annotations:
          reloader.stakater.com/auto: "true"
        # Community image (ghcr.io/felixclements/opencode-server-docker).
        # Its docker-entrypoint.sh puts EVERYTHING under /data:
        #   DATA_DIR=/data, CONFIG_DIR=/data/config, OPENCODE_DIR=/data/.opencode
        # and then symlinks /root/.config/opencode -> /data/config (plus
        # /home/node/.local/share/opencode -> /data/.opencode). So the PVC
        # mounts at /data and nothing may be mounted at /root/.config/opencode
        # — a mount there blocks the symlink the entrypoint needs to create.
        # Runs as root; readOnlyRootFilesystem stays off because opencode +
        # node + the `bash` tool write across the rootfs.
        pod:
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
        type: deployment
        replicas: 1
        strategy: Recreate  # single-replica, RWO PVC
        initContainers:
          # ConfigMaps cannot be mounted inside the PVC path, so stage them
          # from a read-only mount into /data/config, reproducing the exact
          # layout that works on the workstation (~/.config/opencode/):
          #   opencode.json, oh-my-openagent.json, agent/*.md
          # Idempotent: re-copied every start so a ConfigMap change wins
          # (paired with reloader annotation above).
          stage-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
            command:
              - /bin/sh
              - -ceu
              - |
                mkdir -p /data/config/agent /data/.opencode
                # The entrypoint's `ln -sf /data/config /root/.config/opencode`
                # lands *inside* the mounted dir, leaving a self-referential
                # /data/config/config -> /data/config. Harmless but confusing;
                # clear it each start.
                rm -f /data/config/config
                cp -f /src/config/opencode.json        /data/config/opencode.json
                cp -f /src/config/oh-my-openagent.json /data/config/oh-my-openagent.json
                rm -f /data/config/agent/*.md
                cp -f /src/agents/*.md /data/config/agent/
                echo "staged opencode config + $(ls -1 /data/config/agent/*.md | wc -l) agent personas"
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
          # Clone/refresh the repos the agents work against. Uses the opencode
          # image itself (already digest-pinned, already has git 2.39.5) so no
          # extra image enters the supply chain.
          #
          # Deliberately NON-FATAL: a clone failure must never stop the server
          # from starting. home-ops is public and clones without credentials;
          # the two private repos are skipped with a message until the
          # opencode-git-secret exists (optional secretRef below).
          #
          # The token is passed as a transient `-c http.extraheader` so it is
          # never written into .git/config on the PVC — no credential at rest.
          stage-repos:
            image:
              repository: ghcr.io/felixclements/opencode-server-docker
              tag: upstream-v1.17.4@sha256:daff7a4ea70ea43634640d7303a5cf0731abb7522fd7368d7513025a0b8d8352
            command:
              - /bin/bash
              - -cu
              # Flux postBuild runs envsubst over this manifest, so EVERY shell
              # variable must be escaped as $$VAR / $${VAR} to survive as $VAR
              # in the rendered output. An unescaped ${AUTH[@]} fails the whole
              # Kustomization build with "missing closing brace" (see the same
              # warning in mcp-system/mcp-gateway/app/rotator-cronjob.yaml).
              - |
                AUTH=()
                if [ -n "$${GH_TOKEN:-}" ]; then
                  B64=$$(printf 'x-access-token:%s' "$${GH_TOKEN}" | base64 -w0)
                  AUTH=(-c "http.extraheader=AUTHORIZATION: basic $${B64}")
                  echo "git credentials: present"
                else
                  echo "git credentials: absent — public repos only"
                fi
                for r in home-ops lovenet-network-configuration containers; do
                  if [ -d "/workspace/$${r}/.git" ]; then
                    if git "$${AUTH[@]}" -C "/workspace/$${r}" fetch --all --prune --quiet 2>/dev/null; then
                      echo "  fetched $${r}"
                    else
                      echo "  SKIP $${r} (fetch failed — credentials?)"
                    fi
                  elif git "$${AUTH[@]}" clone --quiet "https://github.com/rwlove/$${r}.git" "/workspace/$${r}" 2>/dev/null; then
                    echo "  cloned $${r}"
                  else
                    echo "  SKIP $${r} (clone failed — private repo needs credentials)"
                  fi
                done
                echo "workspace: $$(ls -1 /workspace 2>/dev/null | tr '\n' ' ')"
                exit 0
            envFrom:
              - secretRef:
                  name: opencode-git-secret
                  optional: true          # absent until the PAT is created
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
        containers:
          app:
            image:
              # Community build (no official opencode server image). Tags
              # mirror upstream opencode as `upstream-v<ver>`, sha-pinned.
              # NOTE(renovate): the `upstream-v` prefix needs a custom
              # datasource/extractVersion to auto-bump — track as follow-up.
              repository: ghcr.io/felixclements/opencode-server-docker
              tag: upstream-v1.17.4@sha256:daff7a4ea70ea43634640d7303a5cf0731abb7522fd7368d7513025a0b8d8352
            # The image's entrypoint ends with `exec opencode $COMMAND "$@"`,
            # where $COMMAND is the flag string it builds from PORT/HOSTNAME
            # and "$@" is the image CMD (["serve"]). Left alone that yields
            # `opencode serve --port 4096 --hostname 0.0.0.0 serve` — a
            # duplicate positional, so opencode printed help and exited.
            # Setting `command` with no `args` makes Kubernetes ignore the
            # image CMD, so "$@" is empty. Verified in-cluster: the server
            # then logs "opencode server listening on http://0.0.0.0:4096".
            command:
              - /usr/local/bin/docker-entrypoint.sh
            env:
              PORT: &port "4096"
              HOSTNAME_OVERRIDE: 0.0.0.0
              # Config + agents delivered via ConfigMap mounts below; the
              # oh-my-openagent plugin self-installs from npm on first run.
            envFrom:
              - secretRef:
                  name: opencode-secret  # OPENCODE_SERVER_PASSWORD
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4096
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4096
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              # First start runs `npm i` for the oh-my-openagent plugin;
              # wide startup budget covers the cold cache.
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4096
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 40
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: opencode
        ports:
          http:
            port: *port
    persistence:
      # Durable server state: sessions (chat history) + auth.json.
      # Longhorn (numberOfReplicas 2) per storage-class rule 3 — session
      # history is irreplaceable accumulated state, not regenerable.
      # Backed up via Longhorn's auto-`default` recurring-job group. See
      # pvc.yaml. (storage-operator review, 2026-07-24.)
      # Mounted at /data — the entrypoint's DATA_DIR. It holds config/
      # (symlinked to /root/.config/opencode) and .opencode/ (sessions,
      # auth.json), so this one claim covers all durable state.
      state:
        existingClaim: opencode-state
        advancedMounts:
          opencode:
            stage-config:
              - path: /data
            app:
              - path: /data
      # /root/.config/opencode is a REAL directory baked into the image (it
      # ships an opencode.jsonc), so the entrypoint's
      #   ln -sf /data/config /root/.config/opencode
      # does not replace it — it creates the symlink *inside*, and opencode
      # then loads the image's stock opencode.jsonc instead of ours. Mounting
      # the PVC's config/ subdir directly over that path is what actually
      # puts our opencode.json + agent/*.md where opencode looks, mirroring
      # the workstation layout (~/.config/opencode/).
      state-config:
        existingClaim: opencode-state
        advancedMounts:
          opencode:
            app:
              - path: /root/.config/opencode
                subPath: config
      # opencode creates isolated per-session copies natively — its v2
      # `projectCopy.create` API with `strategy: git_worktree` — rooted at
      # `<data_dir>/worktree`, i.e. /root/.local/share/opencode/worktree.
      # That path would otherwise land on the *state* PVC while the parent
      # repos live on the *workspace* PVC; a git worktree stores an absolute
      # pointer back into its parent's .git, so a restore of one volume
      # without the other leaves dangling worktrees. Mount the worktree root
      # from the workspace claim so a repo and its worktrees always share one
      # volume (and one backup). Satisfies worktree-isolation.md without any
      # bespoke worktree machinery.
      worktrees:
        existingClaim: opencode-workspace
        advancedMounts:
          opencode:
            app:
              - path: /root/.local/share/opencode/worktree
                subPath: .worktrees
      # The entrypoint unconditionally does `mkdir -p /home/node/.local/share`
      # (a vestige of the image's node-user design). /home/node is owned by
      # uid 1000, and root cannot write there because `drop: ALL` removes
      # CAP_DAC_OVERRIDE — this is what crashed the pod. A writable emptyDir
      # satisfies it without granting the capability back. Nothing durable
      # lands here; the symlink it creates points into /data/.opencode.
      node-home:
        type: emptyDir
        advancedMounts:
          opencode:
            app:
              - path: /home/node/.local
      # The entrypoint symlinks /home/node/.local/share/opencode but NOT
      # /root/.local/share/opencode — yet the Dockerfile sets no USER/HOME,
      # so opencode runs as root with HOME=/root and writes sessions +
      # auth.json to /root/.local/share/opencode. Without this mount that
      # state would sit on the ephemeral rootfs and vanish on restart.
      # Bind the same PVC subdir the entrypoint uses, so both paths agree.
      state-opencode:
        existingClaim: opencode-state
        advancedMounts:
          opencode:
            app:
              - path: /root/.local/share/opencode
                subPath: .opencode
      # Read-only staging sources — initContainer only, never the app.
      # Mounting these under /root/.config/opencode would block the
      # entrypoint's symlink; they are copied into /data/config instead.
      config-src:
        type: configMap
        name: opencode-config
        advancedMounts:
          opencode:
            stage-config:
              - path: /src/config
                readOnly: true
      agents-src:
        type: configMap
        name: opencode-agents
        advancedMounts:
          opencode:
            stage-config:
              - path: /src/agents
                readOnly: true
      # Agent working tree — Longhorn PVC (see workspace-pvc.yaml). Holds the
      # repo clones plus accumulated in-flight work, which unattended agents
      # make unreconstructable. Mounted into stage-repos (to clone/fetch) and
      # the app (to work in).
      workspace:
        existingClaim: opencode-workspace
        advancedMounts:
          opencode:
            stage-repos:
              - path: /workspace
            app:
              - path: /workspace
