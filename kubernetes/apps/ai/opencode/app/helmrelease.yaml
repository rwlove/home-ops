---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opencode
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  # strategy: Recreate on an RWO Longhorn PVC means every rollout is:
  # terminate old pod -> Longhorn detach -> schedule -> attach -> run two
  # initContainers (one of which clones three git repos) -> start. That
  # routinely outruns helm-controller's 5m wait, which failed the upgrade
  # and rolled back in a loop. disableWait matches the documented repo
  # pattern (see khoj + project_helmrelease_disablewait.md).
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      opencode:
        annotations:
          reloader.stakater.com/auto: "true"
        # Our own image (containers repo, opencode-server) leaves opencode's native
        # paths alone — config at $HOME/.config/opencode, data at
        # $HOME/.local/share/opencode — so volumes mount directly with no /data
        # indirection and no symlinks. Runs as root; readOnlyRootFilesystem stays
        # off because opencode, node and the `bash` tool write across the rootfs.
        pod:
          # ghcr.io/rwlove/opencode-server publishes linux/amd64 only, and
          # spark is arm64 — without this the pod would schedule there on any
          # reschedule and fail. Keeping the agent off spark is desirable
          # anyway: that node is the GPU/inference host, and a coding agent
          # has no business competing for it. Revisit if the image goes
          # multi-arch.
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch
        type: deployment
        replicas: 1
        strategy: Recreate  # single-replica, RWO PVC
        initContainers:
          # ConfigMaps cannot be mounted inside a PVC path, so stage them from a
          # read-only mount into the config volume (mounted here at /stage, and at
          # $HOME/.config/opencode in the app container). Reproduces the layout that
          # works on the workstation: opencode.json, oh-my-openagent.json, agent/*.md.
          # Idempotent — re-copied each start so a ConfigMap change wins, paired with
          # the reloader annotation above.
          stage-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            command:
              - /bin/sh
              - -ceu
              - |
                mkdir -p /stage/agent
                cp -f /src/config/opencode.json        /stage/opencode.json
                cp -f /src/config/oh-my-openagent.json /stage/oh-my-openagent.json
                rm -f /stage/agent/*.md
                cp -f /src/agents/*.md /stage/agent/
                echo "staged opencode config + $(ls -1 /stage/agent/*.md | wc -l) agent personas"
                # Standing rules + skills come from a Secret, not git: this
                # repo is public and HOMELAB-SPEC names the media-download
                # stacks (L2 #2). Without these the agents run with no
                # standing rules and no skills at all.
                mkdir -p /stage/instructions /stage/skills
                if [ -s /secrets/HOMELAB_SPEC ]; then
                  cp -f /secrets/HOMELAB_SPEC /stage/instructions/HOMELAB-SPEC.md
                fi
                if [ -s /secrets/PERSONA_BASE ]; then
                  cp -f /secrets/PERSONA_BASE /stage/instructions/persona-base.md
                fi
                # The bundle's root entry is already `skills/`, so extract it
                # as-is. An earlier --strip-components=1 removed that prefix
                # and scattered each skill loose into /stage; the loop
                # below clears any such strays left by that version.
                if [ -s /secrets/SKILLS_TGZ_B64 ]; then
                  if base64 -d < /secrets/SKILLS_TGZ_B64 > /tmp/skills.tgz 2>/dev/null; then
                    for s in $(tar -tzf /tmp/skills.tgz 2>/dev/null | sed -n 's|^skills/\([^/]*\)/$|\1|p'); do
                      [ -d "/stage/$${s}" ] && rm -rf "/stage/$${s}"
                    done
                    rm -rf /stage/skills
                    tar -xzf /tmp/skills.tgz -C /stage 2>/dev/null
                    rm -f /tmp/skills.tgz
                  fi
                fi
                echo "staged $(ls -1 /stage/instructions 2>/dev/null | wc -l) instruction files, $(ls -1 /stage/skills 2>/dev/null | wc -l) skills"
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
          # Clone/refresh the repos the agents work against. Uses the opencode
          # image itself (already digest-pinned, already has git 2.39.5) so no
          # extra image enters the supply chain.
          #
          # Deliberately NON-FATAL: a clone failure must never stop the server
          # from starting. home-ops is public and clones over HTTPS with no
          # credential; the two private repos use per-repo read-only deploy
          # keys and are skipped with a message if opencode-git-secret is
          # absent (optional secretRef below).
          #
          # SSH goes to ssh.github.com:443, NOT github.com:22 — the CNP only
          # permits world:443, and opening port 22 for a pod that runs `bash`
          # buys nothing when GitHub already serves SSH on 443.
          stage-repos:
            image:
              repository: ghcr.io/rwlove/opencode-server
              tag: v1.18.27@sha256:18e3d19e79189d68e140259b1ea8715af8a2ecf77a97737988fb96e6bad40ad1
            command:
              - /bin/bash
              - -cu
              # Flux postBuild runs envsubst over this manifest, so EVERY shell
              # variable must be escaped as $$VAR / $${VAR} to survive as $VAR
              # in the rendered output. An unescaped ${AUTH[@]} fails the whole
              # Kustomization build with "missing closing brace" (see the same
              # warning in mcp-system/mcp-gateway/app/rotator-cronjob.yaml).
              - |
                # Deploy keys land in the container's ephemeral /tmp, never on
                # the workspace PVC — private keys must not end up in a
                # Longhorn backup.
                SSHD=/tmp/ssh
                mkdir -p "$${SSHD}"; chmod 700 "$${SSHD}"
                [ -n "$${KNOWN_HOSTS:-}" ] && printf '%s\n' "$${KNOWN_HOSTS}" > "$${SSHD}/known_hosts"
                if [ -n "$${SSH_KEY_LOVENET:-}" ]; then
                  printf '%s\n' "$${SSH_KEY_LOVENET}" > "$${SSHD}/lovenet"; chmod 600 "$${SSHD}/lovenet"
                fi
                if [ -n "$${SSH_KEY_CONTAINERS:-}" ]; then
                  printf '%s\n' "$${SSH_KEY_CONTAINERS}" > "$${SSHD}/containers"; chmod 600 "$${SSHD}/containers"
                fi
                if [ -n "$${SSH_KEY_ANSIBLE:-}" ]; then
                  printf '%s\n' "$${SSH_KEY_ANSIBLE}" > "$${SSHD}/ansible"; chmod 600 "$${SSHD}/ansible"
                fi
                if [ -n "$${SSH_KEY_HOME_ASSISTANT_CONFIG:-}" ]; then
                  printf '%s\n' "$${SSH_KEY_HOME_ASSISTANT_CONFIG}" > "$${SSHD}/home-assistant-config"; chmod 600 "$${SSHD}/home-assistant-config"
                fi
                # PUMP and home-ops are public (HTTPS, no credential); the rest
                # are private and use their own read-only deploy key. A key
                # cannot be shared across repos, hence one file each.
                # NOTE: ansible's default branch is `master`, not `main` —
                # plain `git clone` follows the remote HEAD, so nothing special
                # is needed, but do not hardcode a branch here.
                for r in home-ops PUMP lovenet-network-configuration containers ansible home-assistant-config; do
                  KEY=""
                  case "$${r}" in
                    home-ops|PUMP) URL="https://github.com/rwlove/$${r}.git" ;;
                    lovenet-network-configuration) URL="ssh://git@ssh.github.com:443/rwlove/$${r}.git"; KEY="$${SSHD}/lovenet" ;;
                    containers) URL="ssh://git@ssh.github.com:443/rwlove/$${r}.git"; KEY="$${SSHD}/containers" ;;
                    ansible) URL="ssh://git@ssh.github.com:443/rwlove/$${r}.git"; KEY="$${SSHD}/ansible" ;;
                    home-assistant-config) URL="ssh://git@ssh.github.com:443/rwlove/$${r}.git"; KEY="$${SSHD}/home-assistant-config" ;;
                  esac
                  if [ -n "$${KEY}" ] && [ ! -f "$${KEY}" ]; then
                    echo "  SKIP $${r} (no deploy key)"; continue
                  fi
                  if [ -n "$${KEY}" ]; then
                    export GIT_SSH_COMMAND="ssh -i $${KEY} -o IdentitiesOnly=yes -o UserKnownHostsFile=$${SSHD}/known_hosts -o StrictHostKeyChecking=yes"
                  else
                    unset GIT_SSH_COMMAND
                  fi
                  if [ -d "/workspace/$${r}/.git" ]; then
                    git -C "/workspace/$${r}" remote set-url origin "$${URL}" 2>/dev/null
                    if git -C "/workspace/$${r}" fetch --all --prune --quiet 2>/dev/null; then
                      echo "  fetched $${r}"
                    else
                      echo "  SKIP $${r} (fetch failed)"
                    fi
                  elif git clone --quiet "$${URL}" "/workspace/$${r}" 2>/dev/null; then
                    echo "  cloned $${r}"
                  else
                    echo "  SKIP $${r} (clone failed)"
                  fi
                  # Belt-and-braces alongside the GIT_* env vars on the app
                  # container: some tooling reads `git config user.email`
                  # directly rather than honouring the environment.
                  if [ -d "/workspace/$${r}/.git" ]; then
                    git -C "/workspace/$${r}" config user.name  "opencode-agent" 2>/dev/null
                    git -C "/workspace/$${r}" config user.email "opencode-agent@${SECRET_DOMAIN}" 2>/dev/null
                  fi
                done
                echo "workspace: $$(ls -1 /workspace 2>/dev/null | tr '\n' ' ')"
                exit 0
            envFrom:
              - secretRef:
                  name: opencode-git-secret
                  optional: true          # absent until the PAT is created
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
        containers:
          app:
            image:
              # Our own build (containers repo, opencode-server). Replaces the
              # community image, whose newest tag was upstream-v1.17.4: on that
              # version the server accepted prompts and never executed a turn —
              # zero model calls, zero messages — and there was no newer tag to
              # bump to. Verified by A/B against a local 1.18.4 server, which
              # answered the identical prompt in ~20s.
              repository: ghcr.io/rwlove/opencode-server
              tag: v1.18.27@sha256:18e3d19e79189d68e140259b1ea8715af8a2ecf77a97737988fb96e6bad40ad1
            env:
              # No PORT/HOSTNAME_OVERRIDE: those were the community
              # entrypoint's contract. Our image has an explicit CMD binding
              # 0.0.0.0:4096, so nothing needs to be assembled at runtime.
              # Agents could not commit at all without an identity. Kept
              # deliberately distinct from Rob's so agent-authored commits
              # are identifiable in history rather than indistinguishable
              # from human ones. Git honours these without a config file,
              # so they apply in every repo including ones cloned later.
              GIT_AUTHOR_NAME: &gitName opencode-agent
              GIT_COMMITTER_NAME: *gitName
              GIT_AUTHOR_EMAIL: &gitEmail opencode-agent@${SECRET_DOMAIN}
              GIT_COMMITTER_EMAIL: *gitEmail
              # Config + agents delivered via ConfigMap mounts below; the
              # oh-my-openagent plugin self-installs from npm on first run.
            envFrom:
              - secretRef:
                  name: opencode-secret  # OPENCODE_SERVER_PASSWORD
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4096
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4096
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              # First start runs `npm i` for the oh-my-openagent plugin;
              # wide startup budget covers the cold cache.
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 4096
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 40
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: opencode
        ports:
          http:
            # Matches the port in the image's CMD.
            port: 4096
    persistence:
      # Durable server state: sessions (chat history) + auth.json.
      # Longhorn (numberOfReplicas 2) per storage-class rule 3 — session
      # history is irreplaceable accumulated state, not regenerable.
      # Backed up via Longhorn's auto-`default` recurring-job group. See
      # pvc.yaml. (storage-operator review, 2026-07-24.)
      # /root/.config/opencode is a REAL directory baked into the image (it
      # ships an opencode.jsonc), so the entrypoint's
      #   ln -sf /stage /root/.config/opencode
      # does not replace it — it creates the symlink *inside*, and opencode
      # then loads the image's stock opencode.jsonc instead of ours. Mounting
      # the PVC's config/ subdir directly over that path is what actually
      # puts our opencode.json + agent/*.md where opencode looks, mirroring
      # the workstation layout (~/.config/opencode/).
      # One volume, two views: stage-config writes it at /stage, the app reads
      # it at opencode's native config path. subPath `config` is the same
      # directory the previous /data-mounted layout used, so existing content
      # carries over untouched.
      state-config:
        existingClaim: opencode-state
        advancedMounts:
          opencode:
            stage-config:
              - path: /stage
                subPath: config
            app:
              - path: /root/.config/opencode
                subPath: config
      # opencode creates isolated per-session copies natively — its v2
      # `projectCopy.create` API with `strategy: git_worktree` — rooted at
      # `<data_dir>/worktree`, i.e. /root/.local/share/opencode/worktree.
      # That path would otherwise land on the *state* PVC while the parent
      # repos live on the *workspace* PVC; a git worktree stores an absolute
      # pointer back into its parent's .git, so a restore of one volume
      # without the other leaves dangling worktrees. Mount the worktree root
      # from the workspace claim so a repo and its worktrees always share one
      # volume (and one backup). Satisfies worktree-isolation.md without any
      # bespoke worktree machinery.
      worktrees:
        existingClaim: opencode-workspace
        advancedMounts:
          opencode:
            app:
              - path: /root/.local/share/opencode/worktree
                subPath: .worktrees
      # The entrypoint symlinks /home/node/.local/share/opencode but NOT
      # /root/.local/share/opencode — yet the Dockerfile sets no USER/HOME,
      # so opencode runs as root with HOME=/root and writes sessions +
      # auth.json to /root/.local/share/opencode. Without this mount that
      # state would sit on the ephemeral rootfs and vanish on restart.
      # Bind the same PVC subdir the entrypoint uses, so both paths agree.
      state-opencode:
        existingClaim: opencode-state
        advancedMounts:
          opencode:
            app:
              - path: /root/.local/share/opencode
                subPath: .opencode
      # Read-only staging sources — initContainer only, never the app.
      # Mounting these under /root/.config/opencode would block the
      # entrypoint's symlink; they are copied into /stage instead.
      config-src:
        type: configMap
        name: opencode-config
        advancedMounts:
          opencode:
            stage-config:
              - path: /src/config
                readOnly: true
      agents-src:
        type: configMap
        name: opencode-agents
        advancedMounts:
          opencode:
            stage-config:
              - path: /src/agents
                readOnly: true
      # Vault-sourced standing rules + skills bundle (see externalsecret).
      # initContainer only — the app reads the copies staged onto the PVC.
      instructions-src:
        type: secret
        name: opencode-instructions-secret
        advancedMounts:
          opencode:
            stage-config:
              - path: /secrets
                readOnly: true
      # Agent working tree — Longhorn PVC (see workspace-pvc.yaml). Holds the
      # repo clones plus accumulated in-flight work, which unattended agents
      # make unreconstructable. Mounted into stage-repos (to clone/fetch) and
      # the app (to work in).
      workspace:
        existingClaim: opencode-workspace
        advancedMounts:
          opencode:
            stage-repos:
              - path: /workspace
            app:
              - path: /workspace
