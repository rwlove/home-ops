---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
#
# Single UI route carrying the extAuth SecurityPolicy (Authelia, #12767).
# No /api carve-out for v1: the whole surface is gated at the gateway
# (Rob-only) AND opencode's own basic-auth (OPENCODE_SERVER_PASSWORD)
# guards direct in-cluster callers. A token-auth carve-out for the
# opencode SDK/desktop client (like khoj's /api route) is a follow-up.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencode
  annotations:
    glance/name: "opencode"
    glance/show: "true"
    glance/id: "AI"
spec:
  hostnames:
    - opencode.${SECRET_DOMAIN}
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: opencode
          port: 4096
