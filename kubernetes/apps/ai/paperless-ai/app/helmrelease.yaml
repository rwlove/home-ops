---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ai
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      paperless-ai:
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        type: statefulset

        containers:
          app:
            image:
              repository: ghcr.io/clusterzx/paperless-ai
              tag: 3.0.9@sha256:2b65888163fd59716f1c8285b31c5bd0b30c9c3c192c42b516688e3887d4ba60

            resources:
              requests:
                cpu: 11m
                memory: 1536Mi
              limits:
                memory: 4G
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: paperless-ai
        ports:
          http:
            port: &httpPort 3000

    route:
      app:
        annotations:
          glance/name: "Paperless AI"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/paperless-ai.png"
          glance/id: "AI"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort

    persistence:
      library:
        existingClaim: paperless-data-pvc
        advancedMounts:
          paperless-ai:
            app:
              - path: /app/data
      logs:
        type: emptyDir
        advancedMounts:
          paperless-ai:
            app:
              - path: /app/logs
      openapi:
        type: emptyDir
        advancedMounts:
          paperless-ai:
            app:
              - path: /app/OPENAPI
    networkpolicies:
      allow:
        type: cilium
        forceRename: paperless-ai-allow
        # Explicit endpointSelector preserves the pre-inline selector
        # instead of the chart's controller-derived default, keeping the
        # policy byte-identical across the migration.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: paperless-ai
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # HTTPRoute on internal gateway → paperless-ai:3000
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "3000"
                    protocol: TCP
        egress:
          # paperless-ai's whole purpose is enriching documents in paperless
          # via the paperless REST API. Paperless lives in collab ns.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: collab
                  app.kubernetes.io/name: paperless
            toPorts:
              - ports:
                  - port: "8000"
                    protocol: TCP
          # Ollama in same ns — paperless-ai defaults to ollama for local
          # tagging unless the user configures OpenAI/Anthropic/etc in its
          # web UI. Baseline allow-intra-namespace already covers; explicit
          # here for grep-ability.
          #
          # External LLM providers — paperless-ai's UI lets the user pick
          # OpenAI, Mistral, Anthropic, etc. as the tagging backend. Today
          # it's ollama only; add toFQDNs egress here when config changes.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: ollama
            toPorts:
              - ports:
                  - port: "11434"
                    protocol: TCP
          # RAG subsystem downloads nltk corpora (punkt, punkt_tab, stopwords)
          # from raw.githubusercontent.com/nltk/nltk_data on startup. Without
          # this hole the app runs but RAG features are degraded.
          - toFQDNs:
              - matchName: raw.githubusercontent.com
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
