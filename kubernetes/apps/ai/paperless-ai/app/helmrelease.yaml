---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ai
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      paperless-ai:
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        type: statefulset

        containers:
          app:
            image:
              repository: ghcr.io/clusterzx/paperless-ai
              tag: 3.0.9

            resources:
              requests:
                cpu: 11m
                memory: 1536Mi
              limits:
                memory: 4G
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: false
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: paperless-ai
        ports:
          http:
            port: &httpPort 3000

    route:
      app:
        annotations:
          glance/name: "Paperless AI"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/paperless-ai.png"
          glance/id: "AI"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort

    persistence:
      library:
        existingClaim: paperless-data-pvc
        advancedMounts:
          paperless-ai:
            app:
              - path: /app/data
      logs:
        type: emptyDir
        advancedMounts:
          paperless-ai:
            app:
              - path: /app/logs
      openapi:
        type: emptyDir
        advancedMounts:
          paperless-ai:
            app:
              - path: /app/OPENAPI
