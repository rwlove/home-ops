---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pump-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    controllers:
      pump-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        type: deployment
        replicas: 1
        containers:
          app:
            image:
              repository: docker.io/bytebase/dbhub
              tag: 1.6.0@sha256:ccb6afc0bc1f05c143e15c3c927eb11e8103d49b06947900c33e337f2453f5e3
            # Read-only via the health_ro DB role (SELECT only on api.v_weight) —
            # dbhub's own --readonly flag was removed upstream (it hard-fails), and
            # the RO role is the real guard. Serves streamable-HTTP at /mcp on
            # 0.0.0.0:8000. Replaces crystaldba/postgres-mcp:0.3.0, whose MCP SDK was
            # too old for kagent 1.0's server/discover (protocolVersion 2026-07-28 →
            # DiscoveryFailed); dbhub's SDK 2.0 negotiates 2026-07-28 natively.
            args:
              - --transport=http
              - --port=8000
            env:
              TZ: America/New_York
              # dbhub's DNS-rebinding guard 403s a Service-DNS caller unless the Host
              # is allow-listed. The pump-mcp-allow CNP (ingress from ns ai only) plus
              # the read-only DB role are the real guards here, so disable the check.
              DBHUB_ALLOWED_HOSTS: "*"
            # DATABASE_URI (health_ro → postgres-pump) from 1P via the ExternalSecret.
            envFrom:
              - secretRef:
                  name: pump-mcp-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8000
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  failureThreshold: 3
            resources:
              requests:
                cpu: 15m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              # readOnlyRootFilesystem left OFF for bring-up: the Python image's
              # cache/write paths are unverified (same caution as ghostfolio-mcp).
              # /tmp is an emptyDir below; tighten to true after soak.
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: pump-mcp
        ports:
          http:
            port: *port
    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          pump-mcp:
            app:
              - path: /tmp
    externalSecrets:
      pump-mcp:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: pump-mcp-secret
          template:
            data:
              # dbhub reads the connection string from env `DSN` (resolveDSN order:
              # --dsn flag → DSN env → DB_* parts). Env DSN alone is the clean path.
              DSN: "postgresql://health_ro:{{ .RO_DB_PASS }}@postgres-pump-ro.databases.svc.cluster.local:5432/pump"
        dataFrom:
          - extract:
              key: health
    networkpolicies:
      allow:
        type: cilium
        forceRename: pump-mcp-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: pump-mcp
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # kagent (ai ns) calls the MCP over streamable-HTTP (/mcp) on :8000.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
            toPorts:
              - ports:
                  - port: "8000"
                    protocol: TCP
          # mcp-gateway federation: the Kuadrant broker (the mcp-gateway APP pod in
          # mcp-system) dials this backend DIRECTLY over Service DNS to serve the
          # federated pump_ tools. ai is default-deny, so without this ingress the
          # broker->backend SYN is dropped ("context deadline exceeded") and the
          # broker removes the tools.
          #
          # SECOND selector added 2026-11-14 — CORRECTS the claim above. The
          # .mcp.local HTTPRoute is NOT just declarative config the broker reads;
          # every backend's HTTPRoute (the mcp-gateway `mcps` listener) is
          # actually dispatched per tool call by the Istio data-plane pod
          # itself. The "verified via Hubble, mcp-system has no sidecars" check
          # only ever observed the broker's own health-ping/registration dial,
          # not the real per-call data path. home-ops#15904 fixed that pod's
          # egress side; this adds the matching ingress half here (destination
          # side), mirroring the two-selector shape already proven in
          # media/music-assistant-allow. Root-caused on health-mcp-rw via Tempo
          # trace 51dc161b71ac0d3e8c8ddef903f4c9f5 (3x 10s connect-timeout/UF) +
          # a live `Policy denied` drop spike on the backend's own node during
          # the incident window. Full rationale:
          # kubernetes/apps/ai/calendar-mcp/app/cnp-allow.yaml.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  app.kubernetes.io/name: mcp-gateway
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  gateway.networking.k8s.io/gateway-name: mcp-gateway
            toPorts:
              - ports:
                  - port: "8000"
                    protocol: TCP
        egress:
          # → PUMP CNPG read replica in the databases ns.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  cnpg.io/cluster: postgres-pump
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
