---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tei-embed-spark-rules
spec:
  groups:
    # GB10 DCGM utilization counters are broken on this arch — see
    # reference_dcgm_gb10_broken_counters.md / ollama-spark
    # prometheusrule.yaml. POWER_USAGE / SM_CLOCK are the only reliable
    # signals on Spark, and this embedder shares the GPU with tei-spark
    # and the vLLM fleet, so a power heuristic would conflate workloads —
    # skipped on purpose. Pod liveness + request-success rate cover the
    # failure modes we can act on.
    - name: tei-embed-spark.availability
      rules:
        # Pod-level failure. Live as of the 2026-07-25 embedding cutover —
        # Open WebUI RAG and LightRAG now embed here, so this covers
        # user-visible RAG degradation, not just infra failure
        # (image-pull, OOM, GPU-bind, node loss). memory-mcp and the
        # paperless-RAG Windmill flow follow in the non-git cutover.
        - alert: SparkTeiEmbedPodDown
          annotations:
            summary: tei-embed-spark Pod not Ready (embedding surface unavailable)
            description: |
              Pod {{ $labels.namespace }}/{{ $labels.pod }} on Spark
              has been not-Ready for >5 minutes. Inspect with
              `kubectl -n ai describe pod {{ $labels.pod }}` and
              `kubectl -n ai logs {{ $labels.pod }} --previous`.
              Post-cutover impact: RAG embedding is unavailable —
              Open WebUI / LightRAG / memory-mcp / paperless-RAG
              retrieval and ingest degrade or stall.
          expr: |-
            kube_pod_status_ready{namespace="ai",pod=~"tei-embed-spark-.*",condition="true"} == 0
          for: 5m
          labels:
            severity: critical
        # Synthetic-probe wedge detector — the sister of SparkOllamaWedged,
        # and the reason the cutover doesn't leave the new embedding path
        # blind. Pod-Ready above cannot distinguish "TEI is serving" from
        # "TEI is up but failing every request"; the tei-embed-spark-embed
        # Probe (blackbox-exporter/app/probes.yaml, 1-min cadence) POSTs a
        # real /v1/embeddings call and asserts the OpenAI response shape.
        #
        # Companion alert: the generic BlackboxProbeFailed also fires on
        # this probe. Same dupe trade as ollama-spark's rule — two
        # notifications for one root cause, accepted for the runbook
        # context below.
        - alert: SparkTeiEmbedWedged
          annotations:
            summary: tei-embed-spark synthetic embed probe failing (RAG embedding unavailable)
            description: |
              The tei-embed-spark-embed Probe (POST /v1/embeddings) has
              been failing for ≥3 minutes. The pod may report Ready
              while TEI is not actually serving. Impact: Open WebUI RAG
              retrieval and LightRAG ingest/query both stall. Checks:
              (1) `kubectl -n ai logs deploy/tei-embed-spark --tail=200`
                  — CUDA OOM is the likeliest cause, the GB10 is shared
                  with the vLLM driver and comfyui;
              (2) confirm the model is resident —
                  `curl tei-embed-spark.ai:3000/info` should return
                  BAAI/bge-m3;
              (3) if wedged rather than crashed,
                  `kubectl -n ai rollout restart deploy/tei-embed-spark`;
              (4) rollback path — the P40 `ollama` also carries bge-m3 and
                  vectors are interchangeable (cosine ≥0.999995), so
                  flipping RAG_EMBEDDING_ENGINE back to ollama in
                  open-webui and EMBEDDING_BINDING back to ollama in
                  lightrag still works. Point them at `ollama.ai.svc`,
                  NOT ollama-spark — that was decommissioned 2026-07-26.
                  Treat it as short-term: the P40 has only ~3.7 GiB spare,
                  so bge-m3 there competes with Immich CLIP bursts.
          expr: |-
            probe_success{instance=~"https?://tei-embed-spark.*"} == 0
          for: 3m
          labels:
            severity: critical
    - name: tei-embed-spark.errors
      rules:
        # Elevated request-failure rate. TEI exposes te_request_count
        # (total) and te_request_success separately; the difference over
        # a rate window is the failure rate. Guarded by request_count
        # rate > 0 so the alert is inert without traffic (the pre-cutover
        # dark-capacity window).
        #
        # 5% over 10m matches "user-visible RAG quality degradation"
        # rather than transient blips — a sustained embed failure rate
        # translates to retrieval quality loss across every RAG consumer.
        - alert: SparkTeiEmbedErrorRate
          annotations:
            summary: tei-embed-spark embedding error rate elevated (>5% for 10m)
            description: |
              tei-embed-spark embedding requests are failing at >5% over
              the last 10 minutes. Check `kubectl -n ai logs
              deploy/tei-embed-spark` for backend errors (CUDA OOM,
              tokenizer faults, model eviction). Sustained failures
              degrade retrieval across all RAG consumers.
          expr: |-
            sum(rate(te_request_count{job="tei-embed-spark"}[5m])) > 0
            and
            (
              sum(rate(te_request_count{job="tei-embed-spark"}[5m]))
              -
              sum(rate(te_request_success{job="tei-embed-spark"}[5m]))
            )
            /
            sum(rate(te_request_count{job="tei-embed-spark"}[5m]))
            > 0.05
          for: 10m
          labels:
            severity: warning
