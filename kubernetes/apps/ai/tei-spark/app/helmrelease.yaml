---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tei-spark
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    controllers:
      tei:
        pod:
          nodeSelector:
            nvidia.com/gpu.family: blackwell

          # Spark taints: arm64 (keeps amd64-only workloads off — kubelet
          # only catches arch mismatch at pull time, too late) and the
          # nvidia.com/gpu reservation. Mirrors ollama-spark.
          tolerations:
            - key: kubernetes.io/arch
              operator: Equal
              value: arm64
              effect: NoSchedule
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule

          priorityClassName: ai-gpu-critical

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

        type: deployment

        containers:
          app:
            image:
              # sm_121 / Blackwell 12.1 arm64 (DGX Spark GB10) build. The
              # `121-` prefix is TEI's compute-family tag; #840 (sm_121) +
              # #852 (12.1 arm64-restricted) first shipped in a release tag
              # with v1.9.4 (2026-09-15), retiring the former main-branch
              # digest pin (home-ops#12477). Renovate-tracked again.
              repository: ghcr.io/huggingface/text-embeddings-inference
              tag: 121-1.9.4@sha256:a8f7f1b33b18a8a8d87b9f16268803ce83c9b4dd33fc05424b3b5375bf18c85c

            env:
              MODEL_ID: BAAI/bge-reranker-v2-m3
              HOSTNAME: 0.0.0.0
              # TEI's HTTP variant serves /metrics on the main API port;
              # --prometheus-port / PROMETHEUS_PORT does NOT open a
              # separate listener (verified live against 121-sha-5bc4d88
              # — port 9000 connect-refused while /metrics on 3000 works).
              # Single port keeps the Service + CNP + ServiceMonitor
              # surface coherent.
              PORT: &httpPort 3000
              HUGGINGFACE_HUB_CACHE: &cachePath /data
              # FP16 — bge-reranker-v2-m3 is XLM-RoBERTa (568M params);
              # FP16 halves VRAM use and is the default for CUDA backends.
              DTYPE: float16
              # Truncate over-long inputs rather than 413 the client.
              # Default-true upstream; pinned here for clarity.
              AUTO_TRUNCATE: "true"
              JSON_OUTPUT: "true"
              # OTLP traces → the collector in observability. Same
              # mechanics as tei-embed-spark: gRPC only (the exporter is
              # hardcoded to `.tonic()`, so 4318 will not work) and a
              # fixed Sampler::AlwaysOn with no sampling knob.
              #
              # Rerank volume is far below embed volume — this only fires
              # once per RAG query, not once per indexed document.
              OTLP_ENDPOINT: http://opentelemetry-collector.observability.svc.cluster.local:4317
              OTLP_SERVICE_NAME: tei-spark

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *httpPort
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *httpPort
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              # Generous startup budget: bge-reranker-v2-m3 cold start
              # is HF Hub download (~570 MB) + safetensors load to GPU.
              # 60 * 5s = 5 min, refined in PR-2 once we have wall-clock
              # numbers from Spark.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *httpPort
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60

            resources:
              requests:
                cpu: 500m
                memory: 4Gi
                nvidia.com/gpu: 1
              limits:
                memory: 12Gi
                nvidia.com/gpu: 1

            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

    service:
      app:
        controller: tei
        ports:
          http:
            port: *httpPort

    persistence:
      cache:
        existingClaim: tei-spark-cache-pvc
        advancedMounts:
          tei:
            app:
              - path: *cachePath

      # TEI extracts safetensors / tokenizers and uses /tmp for the
      # internal gRPC UDS socket. Read-only rootfs requires a writable
      # /tmp; emptyDir is the established pattern (langgraph-agents,
      # see helmrelease.security.md).
      tmp:
        type: emptyDir
        advancedMounts:
          tei:
            app:
              - path: /tmp
    networkpolicies:
      allow:
        type: cilium
        forceRename: tei-spark-allow
        # Explicit endpointSelector preserves the pre-inline selector
        # instead of the chart's controller-derived default, keeping the
        # policy byte-identical across the migration.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: tei-spark
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # API + metrics share port 3000 — TEI's HTTP variant serves
          # /metrics on the main HTTP port; --prometheus-port does NOT open
          # a separate listener (verified live against 121-sha-5bc4d88).
          # Stream 2d cutover lands the corresponding egress rule on the
          # open-webui CNP for the rerank path.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: collab
                  app.kubernetes.io/name: open-webui
              - matchLabels:
                  io.kubernetes.pod.namespace: observability
                  app.kubernetes.io/name: prometheus
            toPorts:
              - ports:
                  - port: "3000"
                    protocol: TCP
        egress:
          # HuggingFace Hub model download — bge-reranker-v2-m3 weights pulled
          # to the model cache PVC on first start. Reuses the same world:443
          # pattern as ollama-spark for the same reason (HF / CDN IPs are not
          # FQDN-stable enough for toFQDNs).
          - toEntities: [world]
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
          # OTLP trace export to the collector in observability. Without this
          # the export is a silent drop — TEI logs nothing and no span ever
          # reaches Tempo, the same failure shape as the blackbox-exporter
          # label trap in #13264.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: observability
                  app.kubernetes.io/name: opentelemetry-collector
            toPorts:
              - ports:
                  - port: "4317"
                    protocol: TCP
