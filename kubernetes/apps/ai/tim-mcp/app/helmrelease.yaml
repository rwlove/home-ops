---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tim-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    controllers:
      tim-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        type: deployment
        replicas: 1
        containers:
          app:
            image:
              repository: docker.io/ckanthony/openapi-mcp
              tag: 0.1.0@sha256:50f1bf68ce58724b9569142468ea038da67b22c778697388a0af7c416af5e5cc
            # Generic OpenAPI->MCP bridge over SSE (GET/POST /mcp, binds
            # 0.0.0.0:8080). Wardrowbe serves a real OpenAPI doc but ONLY when
            # settings.dev_mode is on (it is off in prod — OIDC is configured),
            # so /openapi.json is 404 in-cluster. The spec baked below is the
            # app's own schema extracted from the running backend via
            # app.openapi(), downconverted 3.1.0 -> 3.0.3 (kin-openapi in this
            # image rejects 3.1 type:null / contentMediaType). --base-url points
            # at the in-cluster backend; --include-tag scopes tool generation to
            # tim's wardrobe surface (71 of 110 ops). The static identity Bearer
            # is injected via REQUEST_HEADERS (from the secret).
            args:
              - --spec
              - /spec/wardrowbe.json
              - --base-url
              - http://wardrowbe.selfhosted.svc.cluster.local:8000
              - --name
              - Wardrowbe
              - --include-tag
              - Items
              - --include-tag
              - Outfits
              - --include-tag
              - Pairings
              - --include-tag
              - Analytics
              - --include-tag
              - Weather
              - --include-tag
              - Preferences
              - --include-tag
              - Learning
            env:
              TZ: America/New_York
            # REQUEST_HEADERS=Authorization:Bearer <tim_bearer> from 1P via the ES.
            envFrom:
              - secretRef:
                  name: tim-mcp-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: tim-mcp
        ports:
          http:
            port: *port
    persistence:
      # Hand-baked OpenAPI spec (configMapGenerator in kustomization.yaml).
      spec:
        type: configMap
        name: tim-mcp-spec
        advancedMounts:
          tim-mcp:
            app:
              - path: /spec/wardrowbe.json
                subPath: wardrowbe.json
                readOnly: true
      # godotenv probes <specdir>/.env on start; give it a writable tmp and keep
      # the root filesystem read-only.
      tmp:
        type: emptyDir
        advancedMounts:
          tim-mcp:
            app:
              - path: /tmp
    externalSecrets:
      tim-mcp:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: tim-mcp-secret
          template:
            data:
              REQUEST_HEADERS: "Authorization:Bearer {{ .tim_bearer }}"
        dataFrom:
          - extract:
              key: wardrowbe
    networkpolicies:
      allow:
        type: cilium
        forceRename: tim-mcp-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: tim-mcp
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # kagent (ai ns) calls the MCP over SSE on :8080.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        egress:
          # -> Wardrowbe backend in the selfhosted ns (tool calls), :8000.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: selfhosted
                  app.kubernetes.io/name: wardrowbe
            toPorts:
              - ports:
                  - port: "8000"
                    protocol: TCP
