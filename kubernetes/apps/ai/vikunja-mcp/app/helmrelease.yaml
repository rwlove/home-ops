---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vikunja-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    controllers:
      vikunja-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        type: deployment
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/rwlove/mcp-openapi-proxy
              tag: v0.4.0-1@sha256:b14a27595e3ce818d428c88eadd2ea85874a026fc4bd5445f22cec9711041f51
            # Generic OpenAPI->MCP bridge (streamable-http, GET/POST /mcp, binds
            # 0.0.0.0:8080). OPENAPI_SPEC_URL points at the hand-authored,
            # READ-ONLY Vikunja Fleet Todos subset baked in via the configMap
            # below (projects/tasks/labels GET only — no create/update/delete
            # path is declared, so this bridge cannot mutate the fleet todo
            # store); SERVER_URL_OVERRIDE overrides the spec's server to the
            # in-cluster Vikunja service. The Authorization: Bearer header is
            # injected into every upstream request via API_KEY (from the
            # secret), reusing the same `fleet_token` the laptop
            # `_shared/vikunja.py` curl helper uses. Bound by the `radar` kagent
            # agent (morning-brief assembler).
            env:
              TZ: America/New_York
              OPENAPI_SPEC_URL: file:///spec/vikunja.json
              SERVER_URL_OVERRIDE: http://vikunja.collab.svc.cluster.local:3456
            envFrom:
              - secretRef:
                  name: vikunja-mcp-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: vikunja-mcp
        ports:
          http:
            port: *port
    persistence:
      # Hand-authored OpenAPI spec (configMapGenerator in kustomization.yaml).
      spec:
        type: configMap
        name: vikunja-mcp-spec
        advancedMounts:
          vikunja-mcp:
            app:
              - path: /spec/vikunja.json
                subPath: vikunja.json
                readOnly: true
      # godotenv probes <specdir>/.env on start; give it a writable tmp and keep
      # the root filesystem read-only.
      tmp:
        type: emptyDir
        advancedMounts:
          vikunja-mcp:
            app:
              - path: /tmp
    externalSecrets:
      vikunja-mcp:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: vikunja-mcp-secret
          template:
            data:
              # matthewhand sends Authorization: Bearer <API_KEY> by default —
              # exactly what Vikunja's API-token auth expects.
              API_KEY: "{{ .fleet_token }}"
        dataFrom:
          - extract:
              key: vikunja
    networkpolicies:
      allow:
        type: cilium
        forceRename: vikunja-mcp-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: vikunja-mcp
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # mcp-gateway federation: the Kuadrant broker (mcp-gateway app pod,
          # mcp-system) dials this backend directly over Service DNS to serve the
          # federated tools. ai is default-deny; backend-ingress half of the
          # cross-ns pattern (#15826).
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  app.kubernetes.io/name: mcp-gateway
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        egress:
          # -> Vikunja in the collab ns (spec fetch + tool calls), :3456.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: collab
                  app.kubernetes.io/name: vikunja
            toPorts:
              - ports:
                  - port: "3456"
                    protocol: TCP
