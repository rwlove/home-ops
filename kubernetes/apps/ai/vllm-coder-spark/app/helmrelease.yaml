---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vllm-coder-spark
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    controllers:
      vllm:
        # PARKED 2026-07-23: Qwen3.6-27B (dense, ~34 GiB at 0.28) cannot
        # co-reside with vllm-driver-spark on the GB10 — the driver's real
        # footprint is ~97 GiB (caching allocator), leaving only ~24 GiB free.
        # Confirmed by a reclaim test (stopping the coder freed nothing → no
        # leak, the driver genuinely holds ~97). replicas:0 stops the crashloop
        # + Flux revert drift. Coder decision pending (drop, or small coder on
        # the P40's free ~12 GiB) — see vllm_spark_migration_plan.md.
        replicas: 0
        annotations:
          reloader.stakater.com/auto: "true"

        # StatefulSet for the same reason as vllm-driver-spark / ollama-spark:
        # RWO cache PVC + never two pods contending for the GPU slice.
        type: statefulset

        pod:
          nodeSelector:
            node-role.kubernetes.io/gpu: blackwell

          tolerations:
            - key: kubernetes.io/arch
              operator: Equal
              value: arm64
              effect: NoSchedule
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule

          priorityClassName: ai-gpu-critical

        containers:
          app:
            image:
              # workaround: https://github.com/vllm-project/vllm/issues/36821
              #   — remove when upstream vLLM publishes an official sm_121
              #   (GB10) arm64 image (#36821 / #31128). Same community image
              #   + pinning rationale as vllm-driver-spark; keep the two
              #   instances on the same digest so they upgrade in lockstep.
              # Base image has no entrypoint (Cmd=bash) → `command` below.
              repository: ghcr.io/timothystewart6/vllm-gb10
              tag: v0.25.1-cu13.2-torch2.11-gb10.3@sha256:30e70a376ff076f4dc3e1e5fd5ee5f99f36a8ba274f6f590fa1d7894045a66d8

            command: ["vllm", "serve"]
            args:
              # Qwen3.6-27B is the DENSE flagship coder (higher code quality
              # than the MoE driver; slower single-stream since it reads all
              # 27B/token — the accepted tradeoff for the coder role).
              - Qwen/Qwen3.6-27B-FP8
              - --served-model-name
              - qwen3.6-27b
              - --host
              - 0.0.0.0
              - --port
              - "8000"
              - --max-model-len
              - "32768"
              # TUNED FROM LIVE MEASUREMENT (2026-07-23): 0.28 ≈ 34 GiB
              # (27 weights + ~7 KV). Was 0.35, which failed to init —
              # with the driver holding 0.42 only 38.74 GiB was free vs
              # the 42.57 GiB 0.35 wanted. Driver also dropped to 0.36 so
              # the pair + ~32 GiB of co-tenants + ~12 GiB comfyui-burst
              # headroom fit the 121.63 GiB vLLM sees.
              - --gpu-memory-utilization
              - "0.28"
              - --kv-cache-dtype
              - fp8
              - --reasoning-parser
              - qwen3
              - --tool-call-parser
              - qwen3_xml
              - --enable-auto-tool-choice

            env:
              HF_HOME: &cachePath /data
              VLLM_LOGGING_LEVEL: INFO

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &httpPort 8000
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *httpPort
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              # First start downloads ~27 GB FP8 + loads to GPU. 120 * 15s =
              # 30 min; disableWait means Flux won't block on it.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *httpPort
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 120

            resources:
              requests:
                cpu: 1000m
                memory: 12Gi
                nvidia.com/gpu: 1
              limits:
                # Generous ceiling; unified-memory cgroup accounting is
                # validated/tightened in Phase 3 (see vllm-driver-spark).
                memory: 48Gi
                nvidia.com/gpu: 1

            securityContext:
              # Root image + vLLM compiles/writes caches → runAsNonRoot /
              # readOnlyRootFilesystem off (same as vllm-driver-spark /
              # ollama-spark). Rest of the baseline hardening kept.
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: vllm
        ports:
          http:
            port: *httpPort

    # Internal (LAN-only) route — opencode's coder model points here at
    # cutover. Mirrors vllm-driver-spark / ollama-spark.
    route:
      main:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort

    persistence:
      cache:
        existingClaim: vllm-coder-spark-cache-pvc
        advancedMounts:
          vllm:
            app:
              - path: *cachePath

      # vLLM needs a larger /dev/shm than the default 64 MB.
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 8Gi
        advancedMounts:
          vllm:
            app:
              - path: /dev/shm

      tmp:
        type: emptyDir
        advancedMounts:
          vllm:
            app:
              - path: /tmp
