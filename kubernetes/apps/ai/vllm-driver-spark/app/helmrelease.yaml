---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vllm-driver-spark
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    controllers:
      vllm:
        annotations:
          reloader.stakater.com/auto: "true"

        # StatefulSet (not Deployment) for the same reason as ollama-spark:
        # the weight-cache PVC is RWO and we must never have two pods
        # contending for the single GPU slice — a StatefulSet terminates
        # the old pod before starting the new one.
        type: statefulset

        pod:
          nodeSelector:
            nvidia.com/gpu.family: blackwell

          # Spark taints: arm64 (keeps amd64-only workloads off) + the
          # nvidia.com/gpu reservation. Mirrors ollama-spark / tei-spark.
          tolerations:
            - key: kubernetes.io/arch
              operator: Equal
              value: arm64
              effect: NoSchedule
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule

          priorityClassName: ai-gpu-critical

        containers:
          app:
            image:
              # workaround: https://github.com/vllm-project/vllm/issues/36821
              #   — remove when upstream vLLM publishes an official sm_121
              #   (GB10) arm64 image. Tracked upstream in #36821 / #31128;
              #   until then this community image (Techno Tim, built via
              #   GitHub Actions on a Spark runner, every input SHA-pinned)
              #   tracks upstream vLLM releases directly. Renovate-held —
              #   bump deliberately, validate on-box before merging.
              # Base image has no entrypoint (Cmd=bash), so `command`
              # below invokes vLLM explicitly.
              #
              # NOTE: the tag says v0.25.1 but the engine inside reports
              # v0.25.2.dev0+g752a3a504 — the community image ships a dev
              # build, not the tagged release. The digest below is the real
              # pin; treat the tag as a label, not a version. Confirmed
              # 2026-07-31 from the running EngineCore banner. Relevant when
              # correlating behaviour against upstream issues: match on the
              # dev SHA, not on v0.25.1.
              # NVFP4 needs vLLM >=0.28. Renovate-held — it will re-pin the
              # digest; the bare tag is confirmed to exist in the repo.
              repository: ghcr.io/timothystewart6/vllm-gb10
              tag: v0.28.0-gb10.2

            command: ["vllm", "serve"]
            args:
              # NVFP4 (Blackwell-native 4-bit) — ~2x FP8 throughput on GB10.
              - unsloth/Qwen3.6-35B-A3B-NVFP4
              # Single-GPU: sidesteps the #41725 marlin/TP=2 AllReduce hang
              # entirely (that failure needs 2-node AllReduce; there is none
              # at TP=1). NEVER marlin — flashinfer_b12x is both faster and off
              # the hang path (Unsloth model card: marlin is 2x slower).
              - --tensor-parallel-size
              - "1"
              - --moe-backend
              - flashinfer_b12x
              - --linear-backend
              - flashinfer_b12x
              - --attention-backend
              - flashinfer
              # #40969 is a FULL_AND_PIECEWISE cudagraph-capture hang and is
              # TP-agnostic — NVFP4 keeps graphs on, so it would hit the same
              # path. FULL_DECODE_ONLY keeps decode-path graphs (throughput
              # ~unchanged) and drops the spin-looping full-graph capture.
              - --compilation-config
              - '{"cudagraph_mode":"FULL_DECODE_ONLY"}'
              # Consumers reference this name (Open WebUI DEFAULT_MODELS,
              # LightRAG LLM_MODEL, Hermes). HARD INVARIANT across model/image
              # bumps — the webui.db chat connection pins this string.
              - --served-model-name
              - qwen3.6-35b-a3b
              - --host
              - 0.0.0.0
              - --port
              - "8000"
              # Context raise, tuned on-box (2026-07-24). Started at 131072 but
              # Qwen3.6's hybrid Gated-DeltaNet (Mamba) layers profiled to only
              # 1.44x KV concurrency + 95 Mamba cache blocks at 128k — under the
              # default max_num_seqs (256), so CUDA graph capture failed to init.
              # 131072. Native max is 262144, and the KV cache already
              # allocated at gpu-memory-utilization 0.36 holds 505,563 tokens
              # (vLLM startup log), so this costs no additional memory — 65536
              # was leaving 4x on the table.
              #
              # Sized from measurement, not guesswork. opencode's in-cluster
              # baseline is 39,821 tokens with the read-only kubectl MCP set
              # (49,582 with tools loaded). 65536 leaves ~16k to work in and
              # cannot fit an operator persona's domain tools at all: ha is
              # ~57k, omada ~53k. At 131072 the ml-, storage- and
              # observability-operator personas fit whole (~98-102k each).
              #
              # Cost is prefill latency: ~5,070 tok/s measured, so a full
              # context is ~26s to first token (vs ~13s at 65536). Concurrency
              # drops 7.71x -> 3.86x, still ample for a ~1-3 concurrent fleet.
              # max-num-seqs stays 32, under the Mamba cache-block limit of 95
              # at this length.
              #
              # 262144 would additionally fit network- and smart-home-operator
              # but doubles prefill to ~52s. Not worth it until a persona
              # actually needs omada_*/ha_* in-cluster.
              - --max-model-len
              - "131072"
              # Cap concurrent sequences well under the Mamba cache-block limit
              # (95 at 128k, more at 65k). 32 is ample for this low-traffic
              # fleet (~1-3 concurrent) and lets CUDA graph capture proceed.
              # 24 (down from FP8's 32) to leave decode headroom for ComfyUI /
              # TEI on the shared GB10 under the higher NVFP4 gpu-mem-util.
              - --max-num-seqs
              - "24"
              # Explicit cap. TUNED FROM LIVE MEASUREMENT (2026-07-23):
              # vLLM sees 121.63 GiB total; the non-vLLM co-tenants
              # (comfyui, tei x2, pump-cv, av1corrector, bge-m3, CUDA
              # contexts) hold ~32 GiB. 0.36 ≈ 44 GiB (35 weights + ~9 KV);
              # with coder 0.28 that leaves ~12 GiB for comfyui image-gen
              # bursts. Was 0.42 — dropped because 0.42+0.35 overshot free
              # memory and the coder failed to init.
              # NVFP4 weights are ~26.5 GiB (vs FP8's ~35). Start at 0.45 and
              # raise on-box only if ComfyUI/TEI headroom holds — NOT 0.80
              # (the community default): node MemFree is tight and the GB10 is
              # shared. Re-measure against live co-tenant usage.
              - --gpu-memory-utilization
              - "0.45"
              # FP8 KV cache REMOVED 2026-07-31. It halved the KV footprint to
              # fit two instances, but vllm-coder-spark has been parked at
              # replicas:0 since 2026-07-23 (Qwen3.6-27B cannot co-reside with
              # the driver on the GB10) — so there is no second instance and
              # the footprint saving buys nothing. Measured KV cache usage on
              # a live agentic session was 2.4–9.5%.
              #
              # What it cost: fp8 kv-cache is incompatible with prefix caching,
              # so vLLM silently set enable_prefix_caching=False and every
              # request reported "Prefix cache hit rate: 0.0%". The driver's
              # workload is an agentic tool-calling loop that re-sends an
              # ~85k-token prefix on every step, which is the best possible
              # case for prefix caching; instead each step re-prefilled the
              # whole context (observed: +95,993 prompt tokens per step at
              # ~9.9k tok/s, so ~10s of pure prefill before any output).
              #
              # It also silenced correctness: the engine warned "Using
              # uncalibrated q_scale 1.0 and/or prob_scale 1.0 with fp8
              # attention. This may cause accuracy issues" because the
              # checkpoint ships no q/prob scaling factors. Removing this
              # drops that risk too, and is a suspect (unproven) in the
              # decode-hang tracked in #13342.
              #
              # Restore ONLY if a second instance is genuinely co-scheduled
              # here, and re-measure prefix hit rate before accepting it.
              # Reasoning + tool-calling parsers (vLLM Qwen3.6 recipe).
              # tool-call support is the whole point of the driver role —
              # opencode/LightRAG drive tools through it.
              - --reasoning-parser
              - qwen3
              - --tool-call-parser
              - qwen3_xml
              - --enable-auto-tool-choice
              # OTLP traces → the collector in observability. One
              # `llm_request` span per request, backdated to arrival time,
              # carrying time_to_first_token / time_in_queue /
              # time_in_model_prefill / time_in_model_decode and prompt +
              # completion token counts. That queue-vs-prefill-vs-decode
              # split is the whole reason to trace this hop: it is the
              # difference between "the model is slow" and "the request
              # waited". Inbound W3C traceparent is honoured, so an
              # open-webui span links straight through to this one.
              #
              # `grpc://` per vLLM's own examples. The exporter hardcodes
              # insecure=True on the gRPC path, so no TLS opt-out is
              # needed here (unlike open-webui).
              #
              # VERIFIED BEFORE ENABLING: this flag is startup-FATAL if
              # the OTel packages are missing —
              # ObservabilityConfig._validate_otlp_traces_endpoint raises
              # rather than degrading. Upstream bundles them in
              # requirements/common.txt, but this image is a third-party
              # GB10 rebuild, so it was checked in-container:
              # opentelemetry-exporter-otlp 1.42.0, Required-by: vllm.
              # Re-check on any image bump that changes the base.
              #
              # NOT adding --collect-detailed-traces: upstream warns it
              # involves "possibly costly and or blocking operations".
              - --otlp-traces-endpoint
              - grpc://opentelemetry-collector.observability.svc.cluster.local:4317

            env:
              # HF Hub cache on the PVC so the ~35 GB FP8 download survives
              # pod restarts (re-download otherwise, and it fails under
              # default-deny without the world:443 egress in cnp-allow).
              HF_HOME: &cachePath /data
              VLLM_LOGGING_LEVEL: INFO
              # GB10 (Blackwell sm_121a) — required by the flashinfer b12x
              # kernels used for NVFP4.
              CUTE_DSL_ARCH: sm_121a
              # Read by the OTel SDK itself, not by vLLM — vLLM sets no
              # service name of its own, so without this every span lands
              # in Tempo as `unknown_service` and cannot be told apart
              # from any other uninstrumented producer.
              OTEL_SERVICE_NAME: vllm-driver-spark

            probes:
              # /health returns 200 once the engine is up and the model is
              # loaded. Fast once warm.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &httpPort 8000
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *httpPort
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              # Very generous startup budget: FIRST start downloads ~35 GB
              # FP8 weights from HF + loads to GPU + compiles CUDA graphs.
              # 120 * 15s = 30 min. disableWait above means Flux won't block
              # on this. Refine once we have Spark cold-start wall-clock.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *httpPort
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 120

            resources:
              requests:
                cpu: 1000m
                memory: 16Gi
                nvidia.com/gpu: 1
              limits:
                # Generous ceiling. On GB10 unified memory it's unclear how
                # much of vLLM's CUDA allocation bills against the cgroup
                # (ollama-spark observed ~14 GB RSS for a 50 GB model). Set
                # high to avoid a cgroup OOMKill; validated/tightened in
                # Phase 3.
                memory: 64Gi
                nvidia.com/gpu: 1

            securityContext:
              # Image runs as root and vLLM compiles CUDA graphs + writes
              # the HF cache, so runAsNonRoot / readOnlyRootFilesystem are
              # off (same rationale as ollama-spark). Keep the rest of the
              # baseline hardening.
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
                # workaround: https://github.com/vllm-project/vllm/issues/41725
                #   — remove when the GB10 (sm_121) CUDA kernel hang is fixed
                #   upstream and py-spy is no longer needed to diagnose it.
                #   py-spy ships in the image but needs ptrace to attach.
                #   Without it a wedged EngineCore can't be introspected: on
                #   2026-07-31 the engine held two requests with the GPU pinned
                #   at 96%, all 130 threads sleeping and every token counter
                #   frozen, and `py-spy dump` failed with EPERM — leaving the
                #   hang unpinned and a pod restart as the only recourse.
                #   #41725 is the closest upstream match (same platform, same
                #   GPU-pinned-96%-no-error signature) but is NOT confirmed to
                #   be the same bug: that repro is 2-node TP=2 NVFP4/marlin,
                #   ours is single-node TP=1 FP8 with CUDA graphs enabled.
                #   Scoped to ptrace only; allowPrivilegeEscalation stays false.
                add: ["SYS_PTRACE"]
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: vllm
        ports:
          http:
            port: *httpPort

    # Internal (LAN-only) route so off-cluster consumers reach the OpenAI
    # /v1 endpoint — opencode on Rob's workstation points its ollama-spark
    # provider baseURL here at cutover. Mirrors ollama-spark's route.
    route:
      main:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort

    persistence:
      cache:
        existingClaim: vllm-driver-spark-cache-pvc
        advancedMounts:
          vllm:
            app:
              - path: *cachePath

      # vLLM uses /dev/shm for intra-process IPC; the default 64 MB is too
      # small and causes cryptic startup failures. 8 Gi emptyDir(Memory).
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 8Gi
        advancedMounts:
          vllm:
            app:
              - path: /dev/shm

      # Writable /tmp for compilation scratch (torch.compile / CUDA graphs).
      tmp:
        type: emptyDir
        advancedMounts:
          vllm:
            app:
              - path: /tmp
