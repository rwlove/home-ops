---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/persistentvolumeclaim-v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-llm4decompile-spark-cache-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      # HF cache for LLM4Binary/llm4decompile-9b-v2 (4 safetensors shards,
      # ~17.7 GB) plus tokenizer/config and torch.compile artifacts. 40 Gi
      # leaves headroom for an in-place model bump (e.g. a future -v3)
      # without a resize. Regenerable from HF — ceph-block per
      # storage-class.instructions rule 2, matching vllm-driver-spark /
      # vllm-coder-spark's cache PVCs (no static Longhorn Volume CR needed).
      storage: 40Gi
