---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No global `namespace:` here: this group owns TWO Namespace objects
# (ate-system + podcertificate-controller-system), and the kustomize namespace
# transformer rewrites a Namespace kind's own name — which would collide them.
resources:
  - ./namespace.yaml
  - ./namespace-podcert.yaml
  - ./substrate/ks.yaml
