---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: ate-system
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # kagent 1.0 Agent Substrate (ate.dev). The `atelet` DaemonSet runs as UID 0
    # with hostPath (/dev, /var/lib/kubelet, /var/lib/ate) + caps and is
    # privileged-by-design, so this namespace is PSS `privileged` (it cannot meet
    # baseline/restricted). Blast radius is contained: atelet is pinned to the
    # `spark` node only (see the WorkerPool / substrate-atelet nodeSelector).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
    # Substrate requires the kagent namespace labelled ate.dev/api-access=true;
    # ate-system itself hosts the control plane. (The kagent ns label is applied
    # with the kagent 1.0 cutover, not here.)
