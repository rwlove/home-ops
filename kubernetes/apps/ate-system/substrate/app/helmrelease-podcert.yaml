---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate-podcert
  namespace: podcertificate-controller-system
spec:
  chartRef:
    kind: OCIRepository
    name: substrate-podcert
  interval: 1h
  dependsOn:
    - name: substrate-crds
      namespace: ate-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # TODO(verify): value KEY names against charts/substrate-podcert/values.yaml
  # @ v1.0.0 before merge. Values below are from the deploy brief, not yet
  # diffed against the chart schema.
  values:
    createNamespace: false
    workersPerSigner: 1
    postgresClientNamespace: ate-system
    postgresClientServiceAccount: ate-api-server
