---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate
  namespace: ate-system
spec:
  chartRef:
    kind: OCIRepository
    name: substrate
  interval: 1h
  dependsOn:
    - name: substrate-podcert
      namespace: podcertificate-controller-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # TODO(verify): value KEY names/shape against charts/substrate/values.yaml
  # @ v1.0.0 before merge. Values below are transcribed from the deploy brief,
  # NOT yet diffed against the chart schema (esp. objectStorePlugin.extraEnv
  # list shape and postgres.*SecretRef key names).
  values:
    # atelet + rustfs ship as subcharts of `substrate`; we disable them here
    # and run atelet from its own HelmRelease (spark-pinned) and object store
    # from Garage instead of the bundled rustfs.
    atelet:
      enabled: false
    rustfs:
      enabled: false
    createNamespace: false
    postgres:
      ownerConnectionStringSecretRef:
        name: substrate-postgres-owner
        key: ownerConnectionString
      readWriteConnectionStringSecretRef:
        name: substrate-postgres-readwrite
        key: readWriteConnectionString
      ownerRole: substrate_owner
      readWriteRole: substrate_readwrite
      schema: substrate
      clientCertificates:
        enabled: false
    ateApi:
      # TODO(verify): brief says a gs:// URL, but this cluster's object store
      # is Garage (S3). Confirm whether snapshotLocation must be an s3:// path
      # against Garage, or whether ate-api treats this as an opaque bucket URI.
      snapshotLocation: "gs://ate-snapshots/"
      authorization:
        bootstrapOwners:
          - "system:serviceaccount:ai:kagent-controller"
    atenetRouter:
      ingressAllowedSPIFFEIDs:
        - "spiffe://cluster.local/ns/ai/sa/kagent-controller"
    objectStorePlugin:
      extraEnv:
        - name: AWS_REGION
          value: garage
        - name: AWS_ENDPOINT_URL
          value: http://garage.storage.svc.cluster.local:3900
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: garage-substrate-creds
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: garage-substrate-creds
              key: AWS_SECRET_ACCESS_KEY
  # ate-api-server binds :443; the chart requests NET_BIND_SERVICE but ships
  # allowPrivilegeEscalation:false, so on CRI-O (no_new_privs) the cap is not
  # ambient for the non-root process and the bind fails (cloud nodes default
  # ip_unprivileged_port_start=0 and sidestep this). Flip it on just this
  # container (ate-system is PSS privileged).
  # ate-api-server binds :443 as non-root. Added caps aren't ambient on CRI-O,
  # so grant the pod the safe sysctl that lets non-root bind low ports (what
  # cloud nodes default to). Scoped to this Deployment's pods only.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: ate-api-server
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ate-api-server
              spec:
                template:
                  spec:
                    securityContext:
                      sysctls:
                        - name: net.ipv4.ip_unprivileged_port_start
                          value: "0"
