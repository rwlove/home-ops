---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate
  namespace: ate-system
spec:
  chartRef:
    kind: OCIRepository
    name: substrate
  interval: 1h
  dependsOn:
    - name: substrate-podcert
      namespace: podcertificate-controller-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # TODO(verify): value KEY names/shape against charts/substrate/values.yaml
  # @ v1.0.0 before merge. Values below are transcribed from the deploy brief,
  # NOT yet diffed against the chart schema (esp. objectStorePlugin.extraEnv
  # list shape and postgres.*SecretRef key names).
  values:
    # atelet + rustfs ship as subcharts of `substrate`; we disable them here
    # and run atelet from its own HelmRelease (spark-pinned) and object store
    # from Garage instead of the bundled rustfs.
    atelet:
      enabled: false
    rustfs:
      enabled: false
    createNamespace: false
    # Preview gates (passed to ate-api as --preview). kagent 1.0's controller
    # ALWAYS sets a per-template snapshot storage_location and a golden egress
    # policy on every ActorTemplate; with these gates off, ate-api rejects both
    # fields ("actor_template.snapshot_config.storage_location: Forbidden,
    # actor_template.golden_egress_policy: Forbidden") and no agent reaches Ready.
    # These two gates are the documented kagent-1.0 <-> substrate-1.0 pairing.
    preview:
      - PerTemplateSnapshotLocation
      - GoldenEgressPolicy
    postgres:
      ownerConnectionStringSecretRef:
        name: substrate-postgres-owner
        key: ownerConnectionString
      readWriteConnectionStringSecretRef:
        name: substrate-postgres-readwrite
        key: readWriteConnectionString
      ownerRole: substrate_owner
      readWriteRole: substrate_readwrite
      schema: substrate
      clientCertificates:
        enabled: false
    ateApi:
      # TODO(verify): brief says a gs:// URL, but this cluster's object store
      # is Garage (S3). Confirm whether snapshotLocation must be an s3:// path
      # against Garage, or whether ate-api treats this as an opaque bucket URI.
      snapshotLocation: "gs://ate-snapshots/"
      authorization:
        # The kagent controller authenticates to ate-api via its pod certificate
        # (mTLS, substrateClientCertificate), so its authz principal is its SPIFFE
        # ID — NOT the system:serviceaccount form (that is only the principal for
        # ServiceAccount-token auth). With the SA form here the controller's real
        # (SPIFFE) principal was not a bootstrap owner -> "permission denied:
        # ... lacks can_get on actor_template". Bootstrap owners hold owner on the
        # global scope and are evaluated at ate-api startup.
        bootstrapOwners:
          - "spiffe://cluster.local/ns/ai/sa/kagent-controller"
    atenetRouter:
      ingressAllowedSPIFFEIDs:
        - "spiffe://cluster.local/ns/ai/sa/kagent-controller"
    objectStorePlugin:
      extraEnv:
        # Garage validates the SigV4 credential-scope region and expects
        # us-east-1 (its default s3_region) — NOT "garage". With value: garage it
        # rejected every snapshot request "400 Bad Request, Authorization header
        # malformed, unexpected scope ... expected us-east-1", so no golden
        # snapshot could upload. Match Garage's expected region.
        - name: AWS_REGION
          value: us-east-1
        - name: AWS_ENDPOINT_URL
          value: http://garage.storage.svc.cluster.local:3900
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        # AWS SDK Go v2 (smithy) defaults to proactive CRC32 upload checksums,
        # which it sends as an `aws-chunked` streaming body with a trailer
        # (x-amz-content-sha256: STREAMING-UNSIGNED-PAYLOAD-TRAILER). Garage stalls
        # on that chunked PUT: the snapshot upload hung client-side and never
        # reached Garage (garage saw only GETs, no PUT), timing out the golden
        # build "object-store plugin upload ... DeadlineExceeded". Force the SDK to
        # only checksum when the API requires it → a plain PUT with a computed
        # payload hash, which Garage accepts.
        - name: AWS_REQUEST_CHECKSUM_CALCULATION
          value: when_required
        - name: AWS_RESPONSE_CHECKSUM_VALIDATION
          value: when_required
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: garage-substrate-creds
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: garage-substrate-creds
              key: AWS_SECRET_ACCESS_KEY
    # Gate in front of EgressPolicy (api.kagent.dev): an EgressPolicy CR only
    # shapes WHICH header/secret an egress destination gets, it does not grant
    # the underlying permission to resolve ANY secret. That permission is this
    # static namespace-policy, rendered by the chart into the
    # k8s-credential-provider-namespace-policy ConfigMap
    # (/etc/k8s-credential-provider/namespace-policy.yaml). Confirmed live:
    # with this empty (the 1.0.0 cutover default), k8s-credential-provider
    # denied EVERY secret resolution for the `ai` atespace ("atespace \"ai\" is
    # not permitted to resolve secrets in namespace \"ai\"") regardless of any
    # EgressPolicy CR or Agent egressPolicyRefs — every agent's LLM + MCP-tool
    # call failed "OpenAI API error: 403 Forbidden" fleet-wide since the
    # cutover.
    #
    # KEY PATH VERIFIED (this block only — unlike the generic TODO(verify)
    # banner above, which predates this and never covered it): rendered this
    # exact values block through `helm template` against the pinned
    # substrate OCIRepository tag (1.0.1, oci://ghcr.io/kagent-dev/substrate/
    # helm/substrate — see ocirepository.yaml) and confirmed the
    # k8s-credential-provider-namespace-policy ConfigMap comes out as
    # `policies: [{"allowedNamespaces":["ai"],"atespace":"ai"}]` — i.e. this
    # key path is not silently dropped. The chart's own README documents
    # `credentialProvider.namespacePolicies` (default `[]`) as "Default-deny
    # atespace-to-namespace grants; the chart includes get-only Secret RBAC
    # for the provider" — namespace is the finest grain this mechanism
    # offers (the generated ClusterRole grants `get` on all secrets
    # cluster-wide with no resourceNames restriction; the actual enforcement
    # is 100% in the credential-provider binary's namespace-policy-file, not
    # K8s RBAC). The EgressPolicy CRs (egresspolicy-llm.yaml,
    # egresspolicy-mcp-tools.yaml) are what narrow it further, per secret
    # name. Scope kept minimal within what the mechanism allows: one
    # atespace, its own namespace only.
    credentialProvider:
      namespacePolicies:
        - atespace: ai
          allowedNamespaces:
            - ai
  # ate-api-server binds :443; the chart requests NET_BIND_SERVICE but ships
  # allowPrivilegeEscalation:false, so on CRI-O (no_new_privs) the cap is not
  # ambient for the non-root process and the bind fails (cloud nodes default
  # ip_unprivileged_port_start=0 and sidestep this). Flip it on just this
  # container (ate-system is PSS privileged).
  # ate-api-server binds :443 as non-root. Added caps aren't ambient on CRI-O,
  # so grant the pod the safe sysctl that lets non-root bind low ports (what
  # cloud nodes default to). Scoped to this Deployment's pods only.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: ate-api-server
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ate-api-server
              spec:
                template:
                  spec:
                    securityContext:
                      sysctls:
                        - name: net.ipv4.ip_unprivileged_port_start
                          value: "0"
