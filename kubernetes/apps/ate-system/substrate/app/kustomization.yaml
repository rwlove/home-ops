  - ./externalsecret-podcert-ca-pools.yaml
  - ./externalsecret-postgres-conn.yaml
  - ./helmrelease-atelet.yaml
  - ./helmrelease-crds.yaml
  - ./helmrelease-podcert.yaml
  - ./helmrelease.yaml
  - ./ocirepository-atelet.yaml
  - ./ocirepository-crds.yaml
  - ./ocirepository-podcert.yaml
  - ./ocirepository.yaml
