---
# TODO: apply schema
# WorkerPool for the kagent agent fleet. Lives in `ai` (where the kagent
# controller + agents run). Workers are gVisor-sandboxed ateworkers pinned to
# the Spark node, matching the atelet DaemonSet placement.
# TODO(verify): field names/shape against the substrate-crds WorkerPool CRD
#               (api/infra/k8s/ate/v1/workerpool_types.go @ v1.0.0).
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: kagent-default
  namespace: ai
spec:
  replicas: 1
  workerImage: ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1.0.0
  sandboxClasses:
    - name: gvisor
  template:
    nodeSelector:
      kubernetes.io/hostname: spark.thesteamedcrab.com
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
