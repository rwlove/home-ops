---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lldap
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      lldap:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            # /data is an emptyDir (key material via env); fsGroup keeps
            # it writable for the non-root UID.
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app

        annotations:
          reloader.stakater.com/auto: "true"

        # Two replicas with topology spread expresses HA intent, but
        # without a PDB a node drain can take both at once.
        podDisruptionBudget:
          minAvailable: 1

        replicas: 2
        strategy: RollingUpdate

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom: &envFrom
              - secretRef:
                  name: *app
            securityContext: &hardened
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

        containers:
          app:
            image:
              repository: ghcr.io/lldap/lldap
              tag: v0.6.3@sha256:2a8454b668c1aba7157e832eab0e242e1e7eb5fb7591d7e7774ba05286511ca8
            env:
              LLDAP_HTTP_PORT: &httpPort 8080
              LLDAP_HTTP_URL: "https://lldap.${SECRET_DOMAIN}"
              LLDAP_LDAP_BASE_DN: "dc=${SECRET_DOMAIN/./,dc=}"
              LLDAP_LDAP_PORT: &ldapPort 3893
              LLDAP_SMTP_OPTIONS__ENABLE_PASSWORD_RESET: true
              LLDAP_SMTP_OPTIONS__FROM: LLDAP Admin <{{ .Release.Name }}@${SECRET_DOMAIN}>
              LLDAP_SMTP_OPTIONS__PORT: 2525
              LLDAP_SMTP_OPTIONS__SERVER: smtp-relay.home.svc.cluster.local
              LLDAP_SMTP_OPTIONS__SMTP_ENCRYPTION: NONE
              LLDAP_VERBOSE: "true"

            envFrom: *envFrom

            # Bypass the image entrypoint: it chowns /app + copies a
            # template config into /data before gosu-dropping to $UID,
            # which dies under runAsNonRoot + readOnlyRootFilesystem
            # (PR #12785 rollout halted on this). The binary itself is
            # rootless-clean — config is fully env-driven, the missing
            # config file is tolerated, and the server key comes from
            # LLDAP_SERVER_KEY_SEED (verified live in-pod 2026-07-02).
            command: ["/app/lldap", "run"]

            resources:
              requests:
                cpu: 15m
                memory: 64M
              limits:
                memory: 64M
            securityContext: *hardened

    service:
      app:
        controller: lldap
        ports:
          http:
            port: *httpPort
          ldap:
            port: *ldapPort

    route:
      app:
        annotations:
          glance/name: "LLDAP"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/lldap.png"
          glance/id: "Security"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort

    persistence:
      data:
        type: emptyDir
    externalSecrets:
      lldap:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: lldap
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              # App
              LLDAP_JWT_SECRET: "{{ .LLDAP_JWT_SECRET }}"
              LLDAP_LDAP_USER_PASS: "{{ .LLDAP_LDAP_USER_PASS }}"
              LLDAP_USER_DN: "{{ .LLDAP_USER_DN }}"
              LLDAP_LDAP_USER_EMAIL: "{{ .LLDAP_LDAP_USER_EMAIL }}"
              LLDAP_SERVER_KEY_SEED: "{{ .LLDAP_SERVER_KEY_SEED }}"
              LLDAP_DATABASE_URL: "postgres://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@postgres-lldap-rw.databases.svc.cluster.local/lldap"
              # Postgres Init
              INIT_POSTGRES_DBNAME: lldap
              INIT_POSTGRES_HOST: postgres-lldap-rw.databases.svc.cluster.local
              INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
              INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
              INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        dataFrom:
          - extract:
              key: lldap
          - extract:
              key: cloudnative-pg
    networkpolicies:
      allow:
        type: cilium
        forceRename: lldap-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: lldap
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # HTTPRoute on internal gateway → lldap:8080 (web UI for user/group
          # management). Both `external` and `internal` envoy deployments
          # share app.kubernetes.io/name: envoy.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        # LDAP (3893) from authelia is intra-ns and is covered by the baseline
        # allow-intra-namespace policy. No other in-cluster LDAP clients
        # (confirmed via repo grep — zulip helmrelease only mentions LLDAP in
        # a comment).
        egress:
          # CNPG cluster `postgres-lldap` in databases ns (Pattern B).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  cnpg.io/cluster: postgres-lldap
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
          # SMTP relay for password-reset emails — Maddy in home ns on port
          # 2525 (Pattern E). LLDAP_SMTP_OPTIONS__ENABLE_PASSWORD_RESET=true
          # in helmrelease.yaml; LLDAP_SMTP_OPTIONS__SERVER points at
          # smtp-relay.home.svc.cluster.local.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: home
                  app.kubernetes.io/name: smtp-relay
            toPorts:
              - ports:
                  - port: "2525"
                    protocol: TCP
