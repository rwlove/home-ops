---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adventurelog
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: adventurelog-secret
    template:
      data:
        # Django secret key — stable across restarts (don't rotate; it keys
        # signed sessions/tokens). Auto-generated by the image if unset, but we
        # pin it so pod restarts don't invalidate sessions.
        SECRET_KEY: "{{ .SECRET_KEY }}"
        # First-boot Django superuser password (username `admin`).
        DJANGO_ADMIN_PASSWORD: "{{ .DJANGO_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: adventurelog
