---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adventurelog
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      adventurelog:
        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: ghcr.io/seanmorley15/adventurelog
              tag: v0.14.0@sha256:9b375cba3ba49cca2d020c0b0b6932a3153d8e3dbc08075c1c9384bfd4797807
            env:
              # Single public URL — derives ORIGIN / FRONTEND_URL / PUBLIC_URL /
              # CSRF_TRUSTED_ORIGINS when those are unset.
              SITE_URL: "https://adventurelog.${SECRET_DOMAIN}"
              # Internal frontend port (monolith nginx fronts the app on :80).
              PORT: "3000"
              # Local signups off — accounts come via Authelia OIDC (SSO) or the
              # first-boot admin; this is an internal-only, household app.
              DISABLE_REGISTRATION: "True"
              # Database — host/db are deterministic; user/pass from the CNPG
              # app secret reflected into this namespace.
              PGHOST: postgres-adventurelog-rw.databases.svc.cluster.local.
              POSTGRES_DB: adventurelog
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: postgres-adventurelog-app
                    key: username
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: postgres-adventurelog-app
                    key: password
              # First-boot Django superuser (log in, then add the OIDC Social
              # Application + per-user Immich link in the admin panel).
              DJANGO_ADMIN_USERNAME: admin
              DJANGO_ADMIN_EMAIL: "admin@${SECRET_DOMAIN}"
              DJANGO_ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: adventurelog-secret
                    key: DJANGO_ADMIN_PASSWORD
              SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: adventurelog-secret
                    key: SECRET_KEY

            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                # 2Gi for the first-boot world-geography import; steady-state ~1Gi.
                memory: 2Gi

            securityContext:
              # v0.13.1 is a single monolith image that runs as root under
              # supervisor (nginx + memcached + gunicorn + SvelteKit) and drops
              # its workers to `nobody` (65534). First-boot audit: a drop-ALL /
              # non-root config FATALs nginx + memcached at boot
              # (chown "/var/lib/nginx/body" + setuid/setgroups to nobody =>
              # "Operation not permitted"). It needs CHOWN/SETUID/SETGID/SETPCAP
              # to drop privileges, DAC_OVERRIDE/FOWNER for its runtime dirs, and
              # NET_BIND_SERVICE for :80, with privilege-escalation allowed and a
              # writable rootfs. Documented deviation from helmrelease.security.md
              # (upstream image is not non-root/read-only-rootfs capable).
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - SETGID
                  - SETUID
                  - SETPCAP
                  - NET_BIND_SERVICE
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: adventurelog
        ports:
          http:
            port: &httpPort 80

    route:
      app:
        annotations:
          glance/name: "AdventureLog"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/png/adventurelog.png"
          glance/id: "Collaboration"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort

    persistence:
      media:
        existingClaim: adventurelog-media-pvc
        globalMounts:
          - path: /code/media
