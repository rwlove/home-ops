---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app atuin
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      atuin:
        pod:
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch

            runAsGroup: 568
            runAsNonRoot: true
            runAsUser: 568
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app

        annotations:
          reloader.stakater.com/auto: "true"

        # Two replicas with topology spread expresses HA intent, but
        # without a PDB a node drain can take both at once.
        podDisruptionBudget:
          minAvailable: 1

        replicas: 2
        type: statefulset

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719

            envFrom: &envFrom
              - secretRef:
                  name: atuin

        containers:
          app:
            image:
              repository: ghcr.io/atuinsh/atuin
              tag: 18.24.3@sha256:aed6e5efed2b5b6a7d5e5d77e07b122613ea1cafe65f9f7e0193a4ef760961ba

            args:
              - start

            env:
              ATUIN_HOST: 0.0.0.0
              ATUIN_METRICS__ENABLE: true
              ATUIN_METRICS__HOST: 0.0.0.0
              ATUIN_METRICS__PORT: &metricsPort 8081
              ATUIN_OPEN_REGISTRATION: true
              ATUIN_PORT: &httpPort 8080
              RUST_LOG: debug,atuin_server=debug

            envFrom: *envFrom

            resources:
              requests:
                cpu: 15m
                memory: 64M
              limits:
                memory: 64M

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: atuin
        ports:
          http:
            port: *httpPort
          metrics:
            port: *metricsPort
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort

    persistence:
      config:
        type: emptyDir


        enabled: true
    externalSecrets:
      atuin:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: atuin
          template:
            data:
              ATUIN_DB_URI: |-
                postgres://{{ .ATUIN_DB_USER }}:{{ .ATUIN_DB_PASS }}@postgres-atuin-rw.databases.svc.cluster.local/atuin
              INIT_POSTGRES_DBNAME: atuin
              INIT_POSTGRES_HOST: postgres-atuin-rw.databases.svc.cluster.local
              INIT_POSTGRES_USER: "{{ .ATUIN_DB_USER }}"
              INIT_POSTGRES_PASS: "{{ .ATUIN_DB_PASS }}"
              INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        dataFrom:
          - extract:
              key: atuin
          - extract:
              key: cloudnative-pg
    networkpolicies:
      allow:
        type: cilium
        forceRename: atuin-allow
        # Explicit endpointSelector preserves the pre-inline selector
        # (app.kubernetes.io/name) instead of the chart's controller-derived
        # default, keeping the policy byte-identical across the migration.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: atuin
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # HTTPRoute on internal gateway → atuin:8080. Metrics port 8081 is
          # scraped by Prometheus, already covered by allow-monitoring-scrape.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        egress:
          # CNPG cluster postgres-atuin in databases ns (Pattern B).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  cnpg.io/cluster: postgres-atuin
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
        serviceName: *app
