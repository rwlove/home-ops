---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bentopdf
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      bentopdf:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
            fsGroupChangePolicy: OnRootMismatch
        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/alam00000/bentopdf
              tag: 2.8.8@sha256:6ef493c8e3bdbaa26c9bfcec330377ae95116fa00660ca0342769063197b1952

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: *app
        ports:
          http:
            port: 80
            targetPort: *port

    route:
      app:
        annotations:
          glance/name: "BentoPDF"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/bentopdf.png"
          glance/id: "Collaboration"
        hostnames:
          - bentopdf.${SECRET_DOMAIN}
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 80

    # nginx-unprivileged needs writable temp paths under a read-only
    # rootfs. Mirrors the bentopdf upstream chart's volumes:
    # /etc/nginx/tmp (pid file), /var/cache/nginx, /var/run.
    persistence:
      nginx-tmp:
        type: emptyDir
        advancedMounts:
          bentopdf:
            app:
              - path: /etc/nginx/tmp
      nginx-cache:
        type: emptyDir
        advancedMounts:
          bentopdf:
            app:
              - path: /var/cache/nginx
      nginx-run:
        type: emptyDir
        advancedMounts:
          bentopdf:
            app:
              - path: /var/run
    networkpolicies:
      allow:
        type: cilium
        forceRename: bentopdf-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: bentopdf
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # HTTPRoute on internal gateway (bentopdf.${SECRET_DOMAIN}) →
          # bentopdf:8080
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        # No egress holes needed — BentoPDF is a pure client-side toolkit
        # (PDF processing via WASM: pymupdf, ghostscript, cpdf, tesseract
        # OCR). The container only serves static assets. DNS + apiserver
        # are covered by baseline.
