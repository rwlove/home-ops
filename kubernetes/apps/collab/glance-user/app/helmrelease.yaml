---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app glance-user
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      glance-user:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000

        containers:
          glance:
            image:
              repository: docker.io/glanceapp/glance
              tag: v0.8.6@sha256:9dfb09470b207dcb67ac715994bdb1929374ba3f9c0d7df7462c24adf10fd073

            env:
              # glance.yml uses ${SECRET_DOMAIN} which glance expands at
              # runtime from the env. ConfigMap substitution is disabled
              # so Flux leaves the ${...} placeholders for glance to expand.
              SECRET_DOMAIN: ${SECRET_DOMAIN}

            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                memory: 64Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}

    service:
      app:
        controller: glance-user
        ports:
          http:
            port: 8081

    route:
      app:
        hostnames:
          - "start.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - kind: Service
                name: glance-user
                port: 8081

    persistence:
      config-file:
        type: configMap
        name: glance-user-configmap
        globalMounts:
          - path: /app/config/glance.yml
            subPath: glance.yml
            readOnly: true
    networkpolicies:
      allow:
        type: cilium
        forceRename: glance-user-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: glance-user
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal gateway (envoy) → glance-user:8081. Auth is enforced at the
          # gateway by the extAuth SecurityPolicy (#12767); the oauth2-proxy
          # hop is retired.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8081"
                    protocol: TCP
        egress:
          # Family-dashboard widgets call out to whatever feeds the user
          # configured (weather, news, sports, calendars, RSS, etc.). Same
          # rationale as glance: widget set evolves outside this repo, so
          # allow broad HTTPS egress. No kube-apiserver access (no
          # k8s-extension sidecar on this instance).
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "80"
                    protocol: TCP
