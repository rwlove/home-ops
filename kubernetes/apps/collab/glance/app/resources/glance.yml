---
server:
  port: 8081
  proxied: true
theme:
  background-color: 240 21 15
  contrast-multiplier: 1.2
  primary-color: 217 92 83
  positive-color: 115 54 76
  negative-color: 347 70 65
pages:
  - name: Startpage
    width: default
    hide-desktop-navigation: true
    center-vertically: true
    columns:
      - size: full
        widgets:
          - type: search
            search-engine: https://search.${SECRET_DOMAIN}/search?q={QUERY}
            autofocus: true

          # Cluster vitals from kromgo, which fronts a curated set of
          # PromQL queries (kromgo/app/resources/config.yaml) so glance
          # never needs Prometheus credentials or PromQL of its own.
          #
          # kromgo v0.10.0 serves `GET /<metric>` as shields.io endpoint
          # JSON: `message` is the already-formatted value (the config's
          # suffix is applied server-side) and `color` is the threshold
          # bucket. So the template only formats — it never does math.
          #
          # The top-level `url` populates `.JSON`; the rest come from
          # `newRequest`, which glance issues concurrently. Widen this by
          # adding a metric to kromgo's config first, then a tile here.
          #
          # NOTE: kromgo's `cluster_alert_count` is deliberately NOT
          # surfaced — its query reads grafana_alerting_alertmanager_alerts,
          # which counts Grafana-managed alerts, not the kube-prometheus-stack
          # Alertmanager that actually pages. It would render a confident
          # "0" while alerts are firing. See the PR notes.
          - type: custom-api
            title: Cluster
            cache: 1m
            url: http://kromgo.observability.svc.cluster.local:8080/cluster_node_count
            template: |
              {{ $base := "http://kromgo.observability.svc.cluster.local:8080/" }}
              {{ $pods := newRequest (concat $base "cluster_pod_count") | getResponse }}
              {{ $cpu := newRequest (concat $base "cluster_cpu_usage") | getResponse }}
              {{ $mem := newRequest (concat $base "cluster_memory_usage") | getResponse }}
              {{ $power := newRequest (concat $base "cluster_power_usage") | getResponse }}
              {{ $age := newRequest (concat $base "cluster_age_days") | getResponse }}
              {{ $version := newRequest (concat $base "kubernetes_version") | getResponse }}
              {{ $cpuColor := $cpu.JSON.String "color" }}
              {{ $memColor := $mem.JSON.String "color" }}
              {{ $powerColor := $power.JSON.String "color" }}
              <div class="flex justify-between text-center">
                <div>
                  <div class="color-highlight size-h3">{{ .JSON.String "message" }}</div>
                  <div class="size-h6 uppercase">Nodes</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ $pods.JSON.String "message" }}</div>
                  <div class="size-h6 uppercase">Pods</div>
                </div>
                <div>
                  <div class="size-h3 {{ if eq $cpuColor "green" }}color-positive{{ else }}color-negative{{ end }}">{{ $cpu.JSON.String "message" }}</div>
                  <div class="size-h6 uppercase">CPU</div>
                </div>
                <div>
                  <div class="size-h3 {{ if eq $memColor "green" }}color-positive{{ else }}color-negative{{ end }}">{{ $mem.JSON.String "message" }}</div>
                  <div class="size-h6 uppercase">Memory</div>
                </div>
                <div>
                  <div class="size-h3 {{ if eq $powerColor "green" }}color-positive{{ else }}color-negative{{ end }}">{{ $power.JSON.String "message" }}</div>
                  <div class="size-h6 uppercase">Power</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ $age.JSON.String "message" }}</div>
                  <div class="size-h6 uppercase">Uptime</div>
                </div>
              </div>
              <div class="size-h6 color-subdue text-center margin-top-10">
                Kubernetes {{ $version.JSON.String "message" }}
              </div>

          # Auto-discovered apps split into one widget per glance/id
          # category. Each block renders as its own card on the page so
          # every link is visible without tabbing. Add a category by
          # copying a block and changing the title + show-if filter.
          - &apps-by-id
            type: extension
            title: AI
            url: http://glance-k8s-extension:8080/extension/apps
            allow-potentially-dangerous-html: true
            cache: 5m
            parameters:
              show-if: |
                namespace != "kube-system" and
                annotations["glance/id"] == "AI" and
                ("glance/hide" in annotations || annotations["glance/show"] == "true")
          - <<: *apps-by-id
            title: Automation
            parameters:
              show-if: |
                namespace != "kube-system" and
                annotations["glance/id"] == "Automation" and
                ("glance/hide" in annotations || annotations["glance/show"] == "true")
          - <<: *apps-by-id
            title: Collaboration
            parameters:
              show-if: |
                namespace != "kube-system" and
                annotations["glance/id"] == "Collaboration" and
                ("glance/hide" in annotations || annotations["glance/show"] == "true")
          - <<: *apps-by-id
            title: Databases
            parameters:
              show-if: |
                namespace != "kube-system" and
                annotations["glance/id"] == "Databases" and
                ("glance/hide" in annotations || annotations["glance/show"] == "true")
          - <<: *apps-by-id
            title: Downloads
            parameters:
              show-if: |
                namespace != "kube-system" and
                annotations["glance/id"] == "Downloads" and
                ("glance/hide" in annotations || annotations["glance/show"] == "true")
          - <<: *apps-by-id
            title: Home Automation
            parameters:
              show-if: |
                namespace != "kube-system" and
                annotations["glance/id"] == "Home Automation" and
                ("glance/hide" in annotations || annotations["glance/show"] == "true")
          - <<: *apps-by-id
            title: Media
            parameters:
              show-if: |
                namespace != "kube-system" and
                annotations["glance/id"] == "Media" and
                ("glance/hide" in annotations || annotations["glance/show"] == "true")
          - <<: *apps-by-id
            title: Network
            parameters:
              show-if: |
                namespace != "kube-system" and
                annotations["glance/id"] == "Network" and
                ("glance/hide" in annotations || annotations["glance/show"] == "true")
          - <<: *apps-by-id
            title: Observability
            parameters:
              show-if: |
                namespace != "kube-system" and
                annotations["glance/id"] == "Observability" and
                ("glance/hide" in annotations || annotations["glance/show"] == "true")
          - <<: *apps-by-id
            title: Private
            parameters:
              show-if: |
                namespace != "kube-system" and
                annotations["glance/id"] == "Private" and
                ("glance/hide" in annotations || annotations["glance/show"] == "true")
          - <<: *apps-by-id
            title: Renovate
            parameters:
              show-if: |
                namespace != "kube-system" and
                annotations["glance/id"] == "Renovate" and
                ("glance/hide" in annotations || annotations["glance/show"] == "true")
          - <<: *apps-by-id
            title: Security
            parameters:
              show-if: |
                namespace != "kube-system" and
                annotations["glance/id"] == "Security" and
                ("glance/hide" in annotations || annotations["glance/show"] == "true")
          # Storage block carries a name-based carve-out for Rook's HA
          # mgr pair: rook-ceph-mgr-{a,b} both have `mgr_role=active` on
          # their deployment template labels (only the pod's mgr_role
          # flips dynamically). The dashboard Service selects on that
          # label, and glance-k8s v0.5.0's workload matcher uses
          # deployment-template labels, so both mgr deployments match
          # the same HTTPRoute → the same `glance/name: Rook` annotation
          # gets merged in → two cards. Until upstream fixes the matcher,
          # we exclude one mgr by its stable instance name. Doesn't matter
          # which active pod backs the dashboard at any given moment —
          # the Service handles that.
          - <<: *apps-by-id
            title: Storage
            parameters:
              show-if: |
                namespace != "kube-system" and
                annotations["glance/id"] == "Storage" and
                ("glance/hide" in annotations || annotations["glance/show"] == "true") and
                name != "rook-ceph-mgr-b"

          - type: extension
            url: http://glance-k8s-extension:8080/extension/nodes
            allow-potentially-dangerous-html: true
            cache: 5m

          - type: bookmarks
            groups:
              - title: Infrastructure
                color: 200 50 50
                links:
                  - title: Cloudflare
                    url: https://dash.cloudflare.com/
                  - title: Pi-Hole (Unbound)
                    url: https://pihole.${SECRET_DOMAIN}/admin/
                    icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/pi-hole-unbound.png
                  - title: Home-Ops Repo
                    url: https://github.com/rwlove/home-ops

              - title: Kubernetes
                color: 115 60 30
                links:
                  - title: k8s-at-home Search
                    url: https://nanne.dev/k8s-at-home-search/

              - title: DNS & Networking
                color: 180 60 45
                links:
                  - title: DNSChecker
                    url: https://dnschecker.org
                  - title: ViewDNS
                    url: https://viewdns.info
                  - title: BGP View
                    url: https://bgp.he.net

              - title: Utilities
                color: 270 50 50
                links:
                  - title: Dashboard Icons
                    url: https://dashboardicons.com/

  - name: News
    head-widgets:
      - type: markets
        hide-header: true
        symbol-link-template: https://www.google.com/search?tbm=nws&q={SYMBOL}
        chart-link-template: https://www.tradingview.com/chart/?symbol={SYMBOL}
        markets:
          - symbol: VOO
            name: Vanguard S&P 500
          - symbol: ETH-USD
            name: Ethereum USD
            chart-link: https://www.tradingview.com/chart/?symbol=INDEX:ETHUSD
          - symbol: IBM
            name: IBM
          - symbol: BNMR
            name: Bitmine Immersion Technologies
    columns:
      - size: full
        widgets:
          - type: group
            widgets:
              - type: lobsters
                sort-by: hot
                limit: 18
                collapse-after: 10
              - type: reddit
                subreddit: selfhosted
                show-thumbnails: true
                sort-by: "top"
                limit: 15
                collapse-after: 10
                comments-url-template: "https://redlib.lol/{POST-PATH}"
              - type: reddit
                subreddit: kubernetes
                show-thumbnails: true
                sort-by: "top"
                limit: 15
                collapse-after: 10
                comments-url-template: "https://redlib.lol/{POST-PATH}"
              - type: reddit
                subreddit: NonCredibleDefense
                show-thumbnails: true
                sort-by: "top"
                limit: 15
                collapse-after: 10
                comments-url-template: "https://redlib.lol/{POST-PATH}"
