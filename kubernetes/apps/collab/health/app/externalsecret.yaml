---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: health
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: health-secret
    template:
      engineVersion: v2
      data:
        # PostgREST connects AS the read-only health_ro role (authenticator ==
        # anon role), so every request runs read-only. RO_DB_PASS is the 1Password
        # "health" item field; the role + api.* views are created by db-setup.sql.
        DB_URI_MK: postgres://health_ro:{{ .RO_DB_PASS }}@postgres-medikeep-ro.databases.svc.cluster.local:5432/medikeep
        DB_URI_PUMP: postgres://health_ro:{{ .RO_DB_PASS }}@postgres-pump-ro.databases.svc.cluster.local:5432/pump
  dataFrom:
    - extract:
        key: health
