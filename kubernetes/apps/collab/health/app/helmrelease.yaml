---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app health
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      health:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault

        containers:
          # Static charts page + reverse-proxy to the two PostgREST sidecars.
          nginx:
            image:
              repository: ghcr.io/nginxinc/nginx-unprivileged
              tag: 1.27.4-alpine@sha256:e234d4f7e346c098f7b22245690372382aded5be988611eb2c53ae62231eece7
            securityContext: &hardened
              runAsUser: 101
              runAsGroup: 101
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi

          # Read-only JSON over postgres-medikeep (BP + medication dose views).
          postgrest-mk:
            image:
              repository: ghcr.io/postgrest/postgrest
              tag: v16.3@sha256:ec0e25a4e24b0a3bc5e4f011369bfc736bd1b19f513bd01079b86329a7636962
            env:
              PGRST_DB_SCHEMAS: api
              PGRST_DB_ANON_ROLE: health_ro
              PGRST_SERVER_PORT: "3001"
              PGRST_DB_POOL: "2"
              PGRST_LOG_LEVEL: warn
              PGRST_DB_URI:
                valueFrom:
                  secretKeyRef:
                    name: health-secret
                    key: DB_URI_MK
            securityContext:
              <<: *hardened
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 96Mi

          # Read-only JSON over postgres-pump (weight view).
          postgrest-pump:
            image:
              repository: ghcr.io/postgrest/postgrest
              tag: v16.3@sha256:ec0e25a4e24b0a3bc5e4f011369bfc736bd1b19f513bd01079b86329a7636962
            env:
              PGRST_DB_SCHEMAS: api
              PGRST_DB_ANON_ROLE: health_ro
              PGRST_SERVER_PORT: "3002"
              PGRST_DB_POOL: "2"
              PGRST_LOG_LEVEL: warn
              PGRST_DB_URI:
                valueFrom:
                  secretKeyRef:
                    name: health-secret
                    key: DB_URI_PUMP
            securityContext:
              <<: *hardened
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 96Mi

    service:
      app:
        controller: health
        ports:
          http:
            port: 8080

    route:
      app:
        annotations:
          glance/name: "Health"
          glance/show: "true"
          glance/id: "Collaboration"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080

    persistence:
      web:
        type: configMap
        name: health-web
        advancedMounts:
          health:
            nginx:
              - path: /usr/share/nginx/html/index.html
                subPath: index.html
                readOnly: true
              - path: /usr/share/nginx/html/uPlot.iife.min.js
                subPath: uPlot.iife.min.js
                readOnly: true
              - path: /usr/share/nginx/html/uPlot.min.css
                subPath: uPlot.min.css
                readOnly: true
      nginx-conf:
        type: configMap
        name: health-nginx
        advancedMounts:
          health:
            nginx:
              - path: /etc/nginx/conf.d/default.conf
                subPath: default.conf
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          health:
            nginx:
              - path: /tmp
      nginx-cache:
        type: emptyDir
        advancedMounts:
          health:
            nginx:
              - path: /var/cache/nginx
      nginx-run:
        type: emptyDir
        advancedMounts:
          health:
            nginx:
              - path: /var/run
    externalSecrets:
      health:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: health-secret
          template:
            engineVersion: v2
            data:
              # PostgREST connects AS the read-only health_ro role (authenticator ==
              # anon role), so every request runs read-only. RO_DB_PASS is the 1Password
              # "health" item field; the role + api.* views are created by db-setup.sql.
              DB_URI_MK: postgres://health_ro:{{ .RO_DB_PASS }}@postgres-medikeep-ro.databases.svc.cluster.local:5432/medikeep
              DB_URI_PUMP: postgres://health_ro:{{ .RO_DB_PASS }}@postgres-pump-ro.databases.svc.cluster.local:5432/pump
        dataFrom:
          - extract:
              key: health
    networkpolicies:
      allow:
        type: cilium
        forceRename: health-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: health
        # Additive holes through the collab default-deny. DNS is covered by the
        # baseline component. extAuth is envoy->authelia (not from this pod), so no
        # authelia egress rule is needed here.
        enableDefaultDeny:
          egress: false
          ingress: false
        egress:
          # Read-only PostgREST -> postgres-medikeep (BP + dose views). The CNPG pods
          # carry cnpg.io/cluster regardless of the -ro/-rw service used.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  cnpg.io/cluster: postgres-medikeep
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
          # Read-only PostgREST -> postgres-pump (weight view).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  cnpg.io/cluster: postgres-pump
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
        ingress:
          # Internal Gateway -> nginx :8080 (admin-only via the extAuth SecurityPolicy).
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
