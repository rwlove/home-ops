---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app health
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      health:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault

        containers:
          # Static charts page + reverse-proxy to the two PostgREST sidecars.
          nginx:
            image:
              repository: ghcr.io/nginxinc/nginx-unprivileged
              tag: 1.27.4-alpine@sha256:8f2f521d9dd4b047c9d5a759d36a0c0d09d02cda037581edc27d946e87eb70f0
            securityContext: &hardened
              runAsUser: 101
              runAsGroup: 101
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi

          # Read-only JSON over postgres-medikeep (BP + medication dose views).
          postgrest-mk:
            image:
              repository: ghcr.io/postgrest/postgrest
              tag: v16.2@sha256:14997390c81d3962621e683e30500fc5d9bdff2d3ca2c59fa0c09292b97b7e77
            env:
              PGRST_DB_SCHEMAS: api
              PGRST_DB_ANON_ROLE: health_ro
              PGRST_SERVER_PORT: "3001"
              PGRST_DB_POOL: "2"
              PGRST_LOG_LEVEL: warn
              PGRST_DB_URI:
                valueFrom:
                  secretKeyRef:
                    name: health-secret
                    key: DB_URI_MK
            securityContext:
              <<: *hardened
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 96Mi

          # Read-only JSON over postgres-pump (weight view).
          postgrest-pump:
            image:
              repository: ghcr.io/postgrest/postgrest
              tag: v16.2@sha256:14997390c81d3962621e683e30500fc5d9bdff2d3ca2c59fa0c09292b97b7e77
            env:
              PGRST_DB_SCHEMAS: api
              PGRST_DB_ANON_ROLE: health_ro
              PGRST_SERVER_PORT: "3002"
              PGRST_DB_POOL: "2"
              PGRST_LOG_LEVEL: warn
              PGRST_DB_URI:
                valueFrom:
                  secretKeyRef:
                    name: health-secret
                    key: DB_URI_PUMP
            securityContext:
              <<: *hardened
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 96Mi

    service:
      app:
        controller: health
        ports:
          http:
            port: 8080

    route:
      app:
        annotations:
          glance/name: "Health"
          glance/show: "true"
          glance/id: "Collaboration"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080

    persistence:
      web:
        type: configMap
        name: health-web
        advancedMounts:
          health:
            nginx:
              - path: /usr/share/nginx/html/index.html
                subPath: index.html
                readOnly: true
              - path: /usr/share/nginx/html/uPlot.iife.min.js
                subPath: uPlot.iife.min.js
                readOnly: true
              - path: /usr/share/nginx/html/uPlot.min.css
                subPath: uPlot.min.css
                readOnly: true
      nginx-conf:
        type: configMap
        name: health-nginx
        advancedMounts:
          health:
            nginx:
              - path: /etc/nginx/conf.d/default.conf
                subPath: default.conf
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          health:
            nginx:
              - path: /tmp
      nginx-cache:
        type: emptyDir
        advancedMounts:
          health:
            nginx:
              - path: /var/cache/nginx
      nginx-run:
        type: emptyDir
        advancedMounts:
          health:
            nginx:
              - path: /var/run
