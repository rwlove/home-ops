---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./securitypolicy.yaml
  - ./cnp-allow.yaml
configMapGenerator:
  - name: health-web
    files:
      - index.html=./resources/index.html
      - uPlot.iife.min.js=./resources/uPlot.iife.min.js
      - uPlot.min.css=./resources/uPlot.min.css
  - name: health-nginx
    files:
      - default.conf=./resources/default.conf
generatorOptions:
  disableNameSuffixHash: true
