# nginx (unprivileged, :8080) — serves the static charts page and reverse-proxies
# the two read-only PostgREST sidecars over localhost. Single origin so the page's
# fetch() calls stay same-origin behind the Authelia-gated route.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # medikeep read-only PostgREST (BP + medication dose views)
    location /api/mk/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
    }
    # pump read-only PostgREST (weight view)
    location /api/pump/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
