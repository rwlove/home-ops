---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kitchenowl
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      kitchenowl:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        type: statefulset

        containers:
          app:
            image:
              repository: docker.io/tombursch/kitchenowl
              tag: v0.7.10@sha256:bd821a41b8cb27fd7fcf429acd1fc67e9f889485a2cd1193d68c2d804a8e1bef

            env:
              FRONT_URL: https://kitchenowl.${SECRET_DOMAIN}
              # OIDC SSO via Authelia
              OIDC_ISSUER: https://auth.${SECRET_DOMAIN}
              OIDC_CLIENT_ID: kitchenowl
              # JWT_SECRET_KEY + OIDC_CLIENT_SECRET via envFrom secret
            envFrom:
              - secretRef:
                  name: kitchenowl-secret

            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: kitchenowl
        ports:
          http:
            port: &httpPort 8080

    route:
      app:
        annotations:
          glance/name: "KitchenOwl"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/kitchenowl.png"
          glance/id: "Collaboration"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      data:
        existingClaim: kitchenowl-data-pvc
        globalMounts:
          - path: /data
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
    externalSecrets:
      kitchenowl:
        refreshInterval: 5m
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: kitchenowl-secret
          creationPolicy: Owner
          template:
            data:
              JWT_SECRET_KEY: "{{ .JWT_SECRET_KEY }}"
              OIDC_CLIENT_SECRET: "{{ .OAUTH_CLIENT_SECRET }}"
        dataFrom:
          - extract:
              key: kitchenowl
    networkpolicies:
      allow:
        type: cilium
        forceRename: kitchenowl-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: kitchenowl
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # HTTPRoute on internal gateway → kitchenowl:8080. No oauth2-proxy
          # in front of this one — kitchenowl handles OIDC natively against
          # Authelia (OIDC_ISSUER env).
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        egress:
          # OIDC discovery + token exchange against Authelia at
          # auth.${SECRET_DOMAIN} (OIDC_ISSUER). kitchenowl is configured
          # with the external issuer URL, so every OIDC request hits
          # split-horizon DNS which returns the envoy LB IP (10.45.0.13).
          # Cilium's socket-lb rewrites the connect() to the envoy pod IP +
          # targetPort 10443 BEFORE policy evaluation (per memory
          # project_cilium_l4_port_targetport.md), so the policy must allow
          # the envoy pod on its container port, NOT world:443 (which doesn't
          # match cluster LB IPs) and NOT authelia:9091 directly (which
          # kitchenowl never connects to because of how it's configured).
          # Mirrors pump-oauth2-proxy PR #11559.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "10443"
                    protocol: TCP
