---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: medikeep-ingest
  labels:
    app.kubernetes.io/name: medikeep-ingest
spec:
  # Deterministic Google-Sheet -> Medikeep importer (readings -> vitals, dose
  # -> treatment periods). Read-only service account on the sheet side; writes
  # to Medikeep via its REST API as the patient's own account (single-patient
  # => patient_id 1). Idempotent + read-back-verified; the script is generic
  # and all subject-specific values come from the restricted secret at runtime.
  #
  # SHIPPED SUSPENDED + DRY_RUN=true: manual-test first
  # (`kubectl -n collab create job --from=cronjob/medikeep-ingest medikeep-ingest-test`),
  # inspect the planned writes in the logs, tune the parse, then flip DRY_RUN to
  # "false" and set suspend: false.
  suspend: true
  schedule: "0 6 * * 1"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: medikeep-ingest
          annotations:
            k8tz.io/inject: "false"
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: ingest
              # uv on GHCR (no Docker Hub dependency); pure-Python deps are
              # resolved ephemerally at run time via `uv run --with`.
              image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - |
                  export HOME=/tmp
                  export UV_CACHE_DIR=/tmp/uv
                  export XDG_CACHE_HOME=/tmp/.cache
                  uv run --no-project \
                    --with gspread --with google-auth --with requests --with python-dateutil \
                    /config/ingest.py
              env:
                - name: TZ
                  value: America/New_York
                - name: MEDIKEEP_URL
                  value: http://medikeep.collab.svc.cluster.local:8000
                # Default-safe: never writes until explicitly flipped to "false".
                - name: DRY_RUN
                  value: "true"
                - name: DOSE_TAB
                  value: Dosage
                - name: PATIENT_ID
                  value: "1"
                - name: VITALS_SOURCE
                  value: sheet-vitals
                - name: DOSE_SOURCE
                  value: sheet-dose
              # GOOGLE_SA_KEY, MEDIKEEP_USER/PASS, READINGS_SHEET_ID,
              # DOSE_SHEET_ID, TREATMENT_NAME, TREATMENT_TYPE — restricted,
              # from 1Password via the ExternalSecret (never in this repo).
              envFrom:
                - secretRef:
                    name: medikeep-ingest-secret
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
            - name: config
              configMap:
                name: medikeep-ingest-config
