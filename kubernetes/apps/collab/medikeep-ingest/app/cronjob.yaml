---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: medikeep-ingest
  labels:
    app.kubernetes.io/name: medikeep-ingest
spec:
  # Deterministic Google-Sheet -> Medikeep importer (readings -> vitals, dose
  # -> treatment periods). Read-only service account on the sheet side; writes
  # to Medikeep via its REST API as the patient's own account (single-patient
  # => patient_id 1). Idempotent + read-back-verified; the script is generic
  # and all subject-specific values come from the restricted secret at runtime.
  #
  # LIVE: DRY_RUN=false and unsuspended. Validated 2026-10-14 — a clean import
  # (57 vitals + 18 dose periods, read-back-verified) followed by an idempotent
  # re-run (0 added). Weekly Monday 06:00 ET; writes are idempotent + additive.
  suspend: false
  schedule: "0 6 * * 1"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: medikeep-ingest
          annotations:
            k8tz.io/inject: "false"
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: ingest
              # uv on GHCR (no Docker Hub dependency); pure-Python deps are
              # resolved ephemerally at run time via `uv run --with`.
              image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - |
                  export HOME=/tmp
                  export UV_CACHE_DIR=/tmp/uv
                  export XDG_CACHE_HOME=/tmp/.cache
                  uv run --no-project \
                    --with gspread --with google-auth --with requests --with python-dateutil \
                    /config/ingest.py
              env:
                - name: TZ
                  value: America/New_York
                - name: MEDIKEEP_URL
                  value: http://medikeep.collab.svc.cluster.local:8000
                # Writes enabled. Still suspend:true — the first write is a
                # controlled manual run, verified, before the weekly schedule
                # is enabled (separate change to suspend: false).
                - name: DRY_RUN
                  value: "false"
                - name: PATIENT_ID
                  value: "1"
                - name: VITALS_SOURCE
                  value: sheet-vitals
                - name: DOSE_SOURCE
                  value: sheet-dose
                # Read-only PUMP weight view (health svc, /api/pump/) for
                # per-reading bodyweight enrichment. Unset => weight left null.
                - name: WEIGHT_SOURCE_URL
                  value: http://health.collab.svc.cluster.local:8080
                # DEVICE_DEFAULT (the home BP-monitor model) is intentionally NOT
                # set here: it is subject-specific metadata and belongs in the
                # crusher-bp-ingest 1Password item + ExternalSecret, not this
                # public repo. Until it is sourced from the secret, device_used is
                # left null. Clinic/office readings stay null regardless.
              # GOOGLE_SA_KEY, MEDIKEEP_USER/PASS, READINGS_SHEET_ID,
              # DOSE_SHEET_ID, TREATMENT_NAME, TREATMENT_TYPE — restricted,
              # from 1Password via the ExternalSecret (never in this repo).
              envFrom:
                - secretRef:
                    name: medikeep-ingest-secret
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
            - name: config
              configMap:
                name: medikeep-ingest-config
