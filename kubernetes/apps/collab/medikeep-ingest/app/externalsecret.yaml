---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: medikeep-ingest
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: medikeep-ingest-secret
    creationPolicy: Owner
  data:
    # Read-only Google service-account key (scoped to the two shared sheets).
    - secretKey: GOOGLE_SA_KEY
      remoteRef:
        key: crusher-bp-ingest
        property: GOOGLE_SA_KEY
    # Sheet ids + treatment labels are subject-specific (Restricted) — kept out
    # of Git, resolved from 1Password at runtime.
    - secretKey: READINGS_SHEET_ID
      remoteRef:
        key: crusher-bp-ingest
        property: READINGS_SHEET_ID
    - secretKey: DOSE_SHEET_ID
      remoteRef:
        key: crusher-bp-ingest
        property: DOSE_SHEET_ID
    - secretKey: TREATMENT_NAME
      remoteRef:
        key: crusher-bp-ingest
        property: TREATMENT_NAME
    - secretKey: TREATMENT_TYPE
      remoteRef:
        key: crusher-bp-ingest
        property: TREATMENT_TYPE
    # Medikeep app login (the patient's own account => patient_id 1).
    - secretKey: MEDIKEEP_USER
      remoteRef:
        key: medikeep
        property: MEDIKEEP_USER
    - secretKey: MEDIKEEP_PASS
      remoteRef:
        key: medikeep
        property: MEDIKEEP_PASS
