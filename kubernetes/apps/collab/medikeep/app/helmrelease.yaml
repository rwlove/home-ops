---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app medikeep
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      medikeep:
        pod:
          securityContext:
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch

            runAsGroup: 999
            # runAsNonRoot: true
            runAsUser: 999
        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b

            envFrom: &envFrom
              - secretRef:
                  name: medikeep

        containers:
          app:
            image:
              repository: ghcr.io/afairgiant/medikeep
              tag: v0.70.0@sha256:4c28334f3c796ccb470bbe3eb3454575e0c2462cdc7b07c8221a6d6d84235742

            env:
              LOG_LEVEL: "info"
              SSO_ENABLED: "false"
              PUID: 999
              PGID: 999
              MPLCONFIGDIR: /app/matplotlib

            envFrom: *envFrom
            probes:
              startup:
                enabled: false


            resources:
              requests:
                cpu: 15m
                memory: 320M
              limits:
                memory: 320M

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: medikeep
        ports:
          react:
            port: &reactPort 8000
          fast:
            port: &fastAPI 8005

    route:
      app:
        annotations:
          glance/name: "MediKeep"
          glance/show: "true"
          # glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/paperless-ngx.png"
          glance/id: "Collaboration"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *reactPort

    persistence:
      backups:
        type: emptyDir
        globalMounts:
          - path: /app/backups
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/logs
      matplotlib:
        type: emptyDir
        globalMounts:
          - path: /app/matplotlib
      uploads:
        # Uploaded medical documents (lab-result PDFs, patient photos) are stored
        # on disk here — irreplaceable, so Longhorn (survives cluster loss via the
        # NFS backup target) not emptyDir, which lost them on every pod reschedule.
        # Auto-covered by Longhorn's `default` recurring-job group (daily snapshot
        # + weekly/monthly backup). MediKeep runs as 999 and the pod already sets
        # fsGroup 999, so the volume root is writable.
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: longhorn
        globalMounts:
          - path: /app/uploads

    externalSecrets:
      medikeep:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: medikeep
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              DB_HOST: postgres-medikeep-rw.databases.svc.cluster.local
              DB_PORT: "5432"
              DB_NAME: medikeep
              DB_USER: "{{ .POSTGRES_USER }}"
              DB_PASSWORD: "{{ .POSTGRES_PASS }}"
              SECRET_KEY: "{{ .secret_key }}"
              INIT_POSTGRES_DBNAME: medikeep
              INIT_POSTGRES_HOST: postgres-medikeep-rw.databases.svc.cluster.local
              INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
              INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
              INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        dataFrom:
          - extract:
              key: medikeep
          - extract:
              key: cloudnative-pg
    networkpolicies:
      allow:
        type: cilium
        forceRename: medikeep-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: medikeep
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # HTTPRoute on internal gateway → medikeep:8000 (React frontend).
          # The FastAPI port (8005) is in-pod only.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8000"
                    protocol: TCP
        egress:
          # CNPG cluster postgres-medikeep in databases ns (Pattern B).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  cnpg.io/cluster: postgres-medikeep
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
          # Paperless-ngx integration: medikeep dials the external paperless
          # FQDN, which split-horizon DNS resolves to the envoy LB IP. Cilium's
          # socket-lb rewrites the connect() to the envoy pod on its container
          # port 10443 BEFORE policy evaluation (per memory
          # project_cilium_l4_port_targetport.md), so the policy must allow the
          # envoy pod on its container port, NOT world:443 (which doesn't match
          # cluster LB IPs). Mirrors paperless's own OIDC egress rule.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "10443"
                    protocol: TCP
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
