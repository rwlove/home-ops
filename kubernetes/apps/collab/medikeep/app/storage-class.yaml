---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/storageclass-storage-v1.json
#
# Binding-only StorageClass for the static Longhorn PV/PVC pair in
# longhorn-pvc.yaml. Never used for dynamic provisioning -- the PV already
# carries the real csi.volumeAttributes (fsType, numberOfReplicas,
# staleReplicaTimeout) and binds via volumeName. Previously this name was only a
# binding label with no backing SC object; made a real object for the per-app
# contract during the 2026-10 rename-via-copy migration. Mirrors
# lubelogger-data-storage-class / wardrowbe-uploads-storage-class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: medikeep-uploads-storage-class
provisioner: driver.longhorn.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
