---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app monica
spec:
  chart:
    spec:
      # renovate: registryUrl=https://monicahq.github.io/helm chart=monica
      chart: monica
      sourceRef:
        kind: HelmRepository
        name: *app
      version: 1.0.15
  interval: 30m
  values:
    # Chart default is the unreleased monica-next:main (moving tag).
    # Pinned to the classic Monica v5 apache image instead. NOTE: v5 is
    # still pre-GA upstream — the only immutable v5 apache tags are
    # betas, and `5.0-apache` is a MOVING pointer over them. Pinning the
    # explicit `5.0.0-beta.5-apache` (identical bits to `5.0-apache`
    # today) so the tag can't drift under us. Renovate tracks
    # docker.io/library/monica and will bump beta.N → GA when it lands.
    #
    # NOT digest-pinned: this chart stamps image.tag verbatim into the
    # `app.kubernetes.io/version` label (_helpers.tpl), and a
    # `<tag>@sha256:...` value is both >63 bytes and contains illegal
    # label characters, which fails server-side apply. Immutable tag is
    # the best available substitute for a digest here.
    image:
      repository: docker.io/library/monica
      tag: 5.0.0-beta.5-apache
      pullPolicy: IfNotPresent

    replicaCount: 1

    # Auth + TLS are handled at the internal gateway (httproute.yaml +
    # securitypolicy.yaml extAuth → Authelia). No in-chart ingress.
    ingress:
      enabled: false

    monica:
      host: monica.${SECRET_DOMAIN}
      # enabled: true stops the chart from generating its own APP_KEY
      # Secret. The chart then reads APP_KEY from a Secret hardcoded to
      # name=`monica` (release fullname), key=`appkey` — supplied by the
      # externalsecret.yaml ExternalSecret from 1Password. The
      # secretName/appKey fields are ignored by the chart for APP_KEY,
      # so they are intentionally omitted.
      existingSecret:
        enabled: true
      # Trust the Envoy gateway as a reverse proxy so Laravel honors its
      # X-Forwarded-Proto: https and emits https:// asset/redirect URLs.
      # Without this, Monica falls back to the plain-http pod request
      # scheme and the Vite bundle URLs render as http:// — the browser
      # blocks them as mixed content on the https page → blank login.
      # `*` is safe: the CNP only admits the Envoy pod to this container.
      extraEnv:
        - name: APP_TRUSTED_PROXIES
          value: "*"
      # Laravel scheduler (reminders, cleanup, stats).
      cronjob:
        enabled: true
      # SMTP via the cluster's shared internal relay (Maddy → Mailgun),
      # the same target lldap/authelia/zulip use. The relay needs no auth
      # and speaks plain SMTP on 2525, so MAIL_ENCRYPTION="". The chart
      # always wires MAIL_USERNAME/PASSWORD from the monica secret when
      # mail.enabled, so externalsecret.yaml supplies empty
      # smtp-username/smtp-password keys. Egress opened in cnp-allow.yaml.
      mail:
        enabled: true
        fromAddress: monica@${SECRET_DOMAIN}
        replyToAddress: monica@${SECRET_DOMAIN}
        smtp:
          host: smtp-relay.home.svc.cluster.local
          port: 2525
          encryption: ""

    # SQLite off — Monica uses the dedicated CNPG postgres-monica cluster.
    internalDatabase:
      enabled: false

    externalDatabase:
      enabled: true
      type: postgresql
      host: postgres-monica-rw.databases.svc.cluster.local
      database: monica
      # username/password from CNPG's generated postgres-monica-app
      # Secret, reflected into collab (see cluster.yaml inheritedMetadata).
      existingSecret:
        enabled: true
        secretName: postgres-monica-app
        usernameKey: username
        passwordKey: password

    # No bundled subcharts — DB is CNPG, no queue/cache/search backends.
    mariadb:
      enabled: false
    postgresql:
      enabled: false
    redis:
      enabled: false
    memcached:
      enabled: false
    meilisearch:
      enabled: false

    # Uploaded files (avatars, contact documents) — irreplaceable, so
    # Longhorn with recurring backups (longhorn-pvc.yaml), not ceph-block.
    persistence:
      enabled: true
      existingClaim: monica-data-pvc

    service:
      type: ClusterIP
      port: 8080

    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
  # The chart mounts monica-data-pvc (RWO Longhorn, single-node attach)
  # into both the web Deployment and the every-minute scheduler CronJob,
  # but hardcodes the cron jobTemplate pod spec with no affinity — so the
  # cron pod wedged in PodInitializing whenever it scheduled onto a node
  # other than the web pod. There is no chart value for cron affinity, so
  # inject a required podAffinity via post-render: pin the cron pod to
  # whatever node currently runs the web pod (component=app). Evaluated at
  # schedule time, so it follows the web pod across reschedules.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CronJob
              name: monica-cron
            patch: |
              - op: add
                path: /spec/jobTemplate/spec/template/spec/affinity
                value:
                  podAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - labelSelector:
                          matchLabels:
                            app.kubernetes.io/instance: monica
                            app.kubernetes.io/component: app
                        topologyKey: kubernetes.io/hostname
