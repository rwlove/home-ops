---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nametag
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      nametag:
        pod:
          # image USER is 1001 — match it (baseline default 1000 would
          # fight the image's chown'd /app files).
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom: &envFrom
              - secretRef:
                  name: nametag-secret
            securityContext: &hardened
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

        containers:
          app:
            image:
              repository: ghcr.io/mattogodoy/nametag
              tag: 0.63.0@sha256:fd7e17bd0aace5ad9e3493dcac4076e99dd6275624f92e4fef3aa2a346d36563
            env:
              LOG_LEVEL: debug
              NEXTAUTH_URL: http://localhost:3000
              NEXT_PUBLIC_APP_URL: http://localhost:3000
              REDIS_URL: redis://dragonfly.databases.svc.cluster.local:6379/6 # own db index (db6); no longer shares db0

            envFrom: *envFrom

            resources:
              requests:
                cpu: 15m
                memory: 200Mi
              limits:
                memory: 200Mi
            securityContext: *hardened

    service:
      app:
        controller: nametag
        ports:
          http:
            port: &httpPort 3000

    route:
      app:
        annotations:
          glance/name: "Nametag"
          glance/show: "true"
          # glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/paperless-ngx.png"
          glance/id: "Collaboration"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
    externalSecrets:
      nametag:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: nametag-secret
          template:
            engineVersion: v2
            data:
              # App
              NEXTAUTH_SECRET: "{{ .NEXTAUTH_SECRET }}"
              CRON_SECRET: "{{ .CRON_SECRET }}"
              # REDIS_PASSWORD: "{{ .REDIS_PASSWORD }}"
              DATABASE_URL: postgres://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@postgres-nametag-rw.databases.svc.cluster.local:5432/nametag
              # Postgres Init
              INIT_POSTGRES_DBNAME: nametag
              INIT_POSTGRES_HOST: postgres-nametag-rw.databases.svc.cluster.local
              INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
              INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
              INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        dataFrom:
          - extract:
              key: cloudnative-pg
          - extract:
              key: nametag
    networkpolicies:
      allow:
        type: cilium
        forceRename: nametag-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: nametag
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # HTTPRoute on internal gateway → nametag:3000
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "3000"
                    protocol: TCP
        egress:
          # CNPG cluster postgres-nametag in databases ns (Pattern B).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  cnpg.io/cluster: postgres-nametag
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
          # Redis via shared dragonfly (REDIS_URL env).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  app.kubernetes.io/name: dragonfly
            toPorts:
              - ports:
                  - port: "6379"
                    protocol: TCP
