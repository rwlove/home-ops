---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nametag
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      nametag:
        pod:
          # image USER is 1001 — match it (baseline default 1000 would
          # fight the image's chown'd /app files).
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom: &envFrom
              - secretRef:
                  name: nametag-secret
            securityContext: &hardened
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

        containers:
          app:
            image:
              repository: ghcr.io/mattogodoy/nametag
              tag: 0.61.0@sha256:044b7702f728dbd77e7742c114b2d07c173825781a8a240ab1b2a9d33127a3f1
            env:
              LOG_LEVEL: debug
              NEXTAUTH_URL: http://localhost:3000
              NEXT_PUBLIC_APP_URL: http://localhost:3000
              REDIS_URL: redis://dragonfly.databases.svc.cluster.local:6379/6 # own db index (db6); no longer shares db0

            envFrom: *envFrom

            resources:
              requests:
                cpu: 15m
                memory: 200Mi
              limits:
                memory: 200Mi
            securityContext: *hardened

    service:
      app:
        controller: nametag
        ports:
          http:
            port: &httpPort 3000

    route:
      app:
        annotations:
          glance/name: "Nametag"
          glance/show: "true"
          # glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/paperless-ngx.png"
          glance/id: "Collaboration"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
