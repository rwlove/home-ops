---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app nocodb
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      nocodb:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate # RWO ceph-block data PVC must not be double-attached on rollout
        type: deployment
        initContainers:
          # Creates the `nocodb` role + database in the CNPG cluster before the
          # app starts (Pattern B, mirrors medikeep). Uses the super password
          # from the shared cloudnative-pg 1P item + the app's own DB user/pass.
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom: &envFrom
              - secretRef:
                  name: nocodb-secret
        containers:
          app:
            image:
              repository: docker.io/nocodb/nocodb
              tag: 2026.10.1@sha256:8c2dd06896d95e750d55010e529972c22c1ee73b22dce321b1d2de2e7d5cd6ae
            env:
              TZ: America/New_York
              NC_PUBLIC_URL: https://{{ .Release.Name }}.${SECRET_DOMAIN}
              NC_DISABLE_TELE: "true"
              PORT: &port 8080
            # NC_DB (pg:// connection incl. password) + NC_AUTH_JWT_SECRET come
            # from the ExternalSecret below — never inline plaintext.
            envFrom: *envFrom
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  failureThreshold: 6
              readiness: *probe
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              # NocoDB's upstream image is not hardened for a read-only rootfs
              # (writes a local tool cache + sqlite scratch under the app dir);
              # the durable data (the Policies/Claims tables) lives in the CNPG
              # Postgres, Barman-backed to Garage — not on this filesystem.
              # Revisit if upstream adds ro-rootfs support.
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: nocodb
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          glance/name: "NocoDB (Insurance Register)"
          glance/show: "true"
          glance/id: "Collaboration"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      # Attachments / local tool cache. The authoritative policy facts live in
      # Postgres (CNPG, Barman→Garage DR); source documents live in Paperless.
      # This volume is secondary, so ceph-block (durable-in-cluster) not Longhorn.
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: ceph-block
        advancedMounts:
          nocodb:
            app:
              - path: /usr/app/data
    externalSecrets:
      nocodb:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: nocodb-secret
          template:
            data:
              # NocoDB meta + all user tables (the register) live in the CNPG DB.
              NC_DB: "pg://postgres-nocodb-rw.databases.svc.cluster.local:5432?u={{ .NOCODB_DB_USER }}&p={{ .NOCODB_DB_PASS }}&d=nocodb"
              NC_AUTH_JWT_SECRET: "{{ .nc_auth_jwt_secret }}"
              # postgres-init bootstrap
              INIT_POSTGRES_DBNAME: nocodb
              INIT_POSTGRES_HOST: postgres-nocodb-rw.databases.svc.cluster.local
              INIT_POSTGRES_USER: "{{ .NOCODB_DB_USER }}"
              INIT_POSTGRES_PASS: "{{ .NOCODB_DB_PASS }}"
              INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        dataFrom:
          - extract:
              key: nocodb
          - extract:
              key: cloudnative-pg
    networkpolicies:
      allow:
        type: cilium
        forceRename: nocodb-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: nocodb
        # Additive — the collab default-deny is what enforces the lockdown.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # HTTPRoute on the internal (LAN-only) gateway → nocodb:8080.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          # lloyd-mcp bridge (ai ns) → NocoDB REST API :8080 (the register
          # read/write surface the kagent `lloyd` agent uses).
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: lloyd-mcp
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        egress:
          # CNPG cluster postgres-nocodb in the databases ns.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  cnpg.io/cluster: postgres-nocodb
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
