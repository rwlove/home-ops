---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obsidian-couchdb
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      obsidian-couchdb:
        pod:
          securityContext:
            fsGroup: ${APP_GID}
            fsGroupChangePolicy: "OnRootMismatch"

            runAsGroup: ${APP_GID}
            runAsUser: ${APP_UID}
        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        initContainers:
          init-config:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.38@sha256:7e2c04dd50ede647bf4a7a4c8dbd629dd4971cd139b9b88fb22bfc3c7a6c13df
              pullPolicy: IfNotPresent
            command:
              - "/bin/sh"
              - "-c"
              - "cp /tmp/config/*.ini /opt/couchdb/etc/default.d/; ls -lrt /opt/couchdb/etc/default.d;"

        containers:
          app:
            image:
              repository: docker.io/library/couchdb
              tag: 3.5.2@sha256:8cf5f8442585c346d2717ff0ad95605731d2f19f67b8367840baa8d3b24ebc31
            env:
              COUCHDB_USER:
                valueFrom:
                  secretKeyRef:
                    name: obsidian-couchdb-secret
                    key: couchdb-user
              COUCHDB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: obsidian-couchdb-secret
                    key: couchdb-password
            resources:
              requests:
                cpu: 15m
                memory: 512Mi
              limits:
                memory: 512Mi

    service:
      app:
        controller: obsidian-couchdb
        ports:
          http:
            port: &httpPort 5984

    route:
      app:
        hostnames:
          - "obsidian.${SECRET_DOMAIN}"
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort

    persistence:
      config:
        type: configMap
        name: obsidian-couchdb-configmap
        advancedMounts:
          obsidian-couchdb:
            init-config:
              - path: /tmp/config
      config-storage:
        type: emptyDir
        globalMounts:
          - path: /opt/couchdb/etc/default.d
      data:
        existingClaim: obsidian-data-pvc
        advancedMounts:
          obsidian-couchdb:
            app:
              - path: /opt/couchdb/data
    externalSecrets:
      obsidian-couchdb:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: obsidian-couchdb-secret
          creationPolicy: Owner
        data:
          - secretKey: couchdb-user
            remoteRef:
              key: obsidian
              property: couchdb_username
          - secretKey: couchdb-password
            remoteRef:
              key: obsidian
              property: couchdb_password
    networkpolicies:
      allow:
        type: cilium
        forceRename: obsidian-couchdb-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: obsidian-couchdb
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # HTTPRoute on the EXTERNAL gateway (obsidian.${SECRET_DOMAIN}
          # via cloudflared) → obsidian-couchdb:5984. Both internal and
          # external envoy pods carry app.kubernetes.io/name=envoy in the
          # network ns, so the selector covers both.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "5984"
                    protocol: TCP
          # Hermes vault-bridge (ai/hermes) LiveSync ↔ the `claude` DB. Re-adds the
          # ingress the retired claude-runner had (removed in #14043); Hermes is the
          # successor in-cluster vault client.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: hermes
            toPorts:
              - ports:
                  - port: "5984"
                    protocol: TCP
        # No egress holes needed — CouchDB is self-contained for this
        # single-node setup. No remote replication peers configured.
