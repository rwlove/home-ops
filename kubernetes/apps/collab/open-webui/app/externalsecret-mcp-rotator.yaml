---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# client_credentials creds for the mcp-openwebui Authelia OIDC client,
# minted into a bearer token by the rotator CronJob and pushed into
# open-webui's tool_server config via its admin API.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-mcp-authelia-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: open-webui-mcp-authelia-client
    template:
      data:
        OIDC_CLIENT_ID: "{{ .client_id }}"
        OIDC_CLIENT_SECRET: "{{ .client_secret }}"
  dataFrom:
    - extract:
        key: mcp-openwebui-authelia
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# open-webui admin API key (Settings > Account > API Keys, as an admin user).
# The rotator authenticates to POST /api/v1/configs/tool_servers with it.
# MANUAL: create a 1P item `open-webui-mcp-admin` with field `api_key`
# before unsuspending the rotator. Until then this ES is NotReady (benign).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-mcp-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: open-webui-mcp-admin
    template:
      data:
        OPENWEBUI_API_KEY: "{{ .api_key }}"
  dataFrom:
    - extract:
        key: open-webui-mcp-admin
