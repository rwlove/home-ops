---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    timeout: 20m
    remediation:
      retries: 3
  upgrade:
    # Open WebUI runs forward-only Alembic migrations at startup against the
    # SQLite DB in open-webui-data-pvc, so rolling back the *image* cannot
    # un-migrate the *schema*. Combined with Helm's 5m default timeout (this
    # release does not set disableWait), a slow image pull is enough to fail
    # the upgrade, trigger remediation, and leave an older image running
    # against a newer schema.
    #
    # That is exactly how romm wedged on 2026-07-31: the 5.0.0 -> 5.1.0 bump
    # timed out behind a queued image pull, Flux rolled back, and 5.0.0 could
    # not locate the Alembic revision 5.1.0 had already written. Every
    # subsequent remediation re-applied the same unstartable version. See
    # #13383.
    #
    # timeout: 20m stops a slow pull from being read as a failure.
    # retries: 0 disables reversion -- for forward-only migrations, failing
    # forward and surfacing Ready=False is strictly safer than returning to a
    # version that can no longer read its own schema.
    #
    # Note: immich, khoj and prowlarr also pair rollback remediation with a
    # database, but all three set disableWait: true, so Helm never waits, never
    # times out, and remediation cannot trip. They are deliberately unchanged.
    timeout: 20m
    cleanupOnFail: true
    remediation:
      retries: 0
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        # runAsNonRoot: live-verified 2026-07-04. Data PVC top level was
        # 0:0 (subdirs/db already writable by any owner); fsGroup below
        # handles the one-time kubelet chown on next mount (standard
        # k8s mechanism, not a manual migration). Two real blockers
        # found and fixed:
        #   1. start.sh writes ./.webui_secret_key relative to the
        #      image's /app/backend cwd (root-owned, unwritable as
        #      1000) — WEBUI_SECRET_KEY_FILE below redirects it onto
        #      the PVC. Bonus: this also fixes a pre-existing bug where
        #      every pod restart silently regenerated the secret key
        #      and force-logged-out all users (the file was never
        #      persisted before).
        #   2. Startup tries to overlay custom static assets onto
        #      /app/backend/open_webui/static (image-baked, read-only
        #      to 1000) — these raise caught "Permission denied"
        #      errors in the log but are non-fatal; app boots and
        #      serves normally past them.
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f

            securityContext:
              allowPrivilegeEscalation: false
              # RO rootfs stays off: Python app writes to /tmp and may
              # pip-install extras at runtime.
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

            env:
              # HOME=/root is unwritable as UID 1000; several deps
              # (huggingface/langchain caches, matplotlib config) fall
              # back to $HOME for scratch/config dirs.
              HOME: /tmp
              # See pod-level comment above — persists the secret key
              # on the PVC instead of the unwritable image cwd.
              WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
              # P40 ollama only, as of the 2026-07-26 ollama-spark
              # decommission. ollama-spark was removed from this list in the
              # SAME change that deleted it — Open WebUI polls every entry
              # here for /api/tags (2347 hits in 24h), so a stale entry
              # means it polls a dead Service indefinitely.
              # Primary chat LLM moved to vLLM (Qwen3.6-35B-A3B, OpenAI /v1)
              # 2026-07-24 — that connection lives in webui.db (openai.*),
              # since Open WebUI's persistent config overrides env for
              # connections. RAG embeddings moved to tei-embed-spark 07-25.
              OLLAMA_BASE_URLS: http://ollama.ai.svc.cluster.local:11434
              # Default model for new chats. webui.db ui.default_models is
              # authoritative (set to qwen3.6-35b-a3b at cutover); this env
              # is kept aligned for DR / persistent-config-off scenarios.
              DEFAULT_MODELS: qwen3.6-35b-a3b
              ENABLE_RAG_WEB_SEARCH: true
              # Embeddings cut over 2026-07-25 from ollama-spark/bge-m3 to
              # tei-embed-spark, the dedicated TEI embedder. TEI speaks the
              # OpenAI embeddings API, so the engine flips ollama → openai
              # and RAG_OLLAMA_BASE_URL retires.
              #
              # Same weights (BAAI/bge-m3) → EXISTING KNOWLEDGE COLLECTIONS
              # STAY VALID. Parity measured over 5 inputs (incl. multilingual
              # + a single char): cosine ≥0.999995 vs the ollama path,
              # identical 1024 dim, both L2-normalised, identical retrieval
              # rank order. No re-embed needed — unlike the nomic → bge-m3
              # move below, this one is non-destructive.
              RAG_EMBEDDING_ENGINE: openai
              # These RAG_OPENAI_* vars are read only by the RAG embedder;
              # they do NOT touch the chat OpenAI connection (that lives in
              # webui.db openai.*, pointed at vllm-driver-spark).
              RAG_OPENAI_API_BASE_URL: http://tei-embed-spark.ai.svc.cluster.local:3000/v1
              # TEI requires no auth; Open WebUI sends the header regardless,
              # so a placeholder satisfies the client.
              RAG_OPENAI_API_KEY: tei
              # Phase A benchmark (2026-05-20, 50-doc Paperless eval)
              # showed bge-m3 (1024-dim) beats nomic-embed-text (768) by
              # +23 MRR@10 pts. The cluster moves to bge-m3 for new
              # embedding work; both models live on ollama-spark.
              # Note: this is destructive to any existing Open WebUI
              # Knowledge Base collection embedded with nomic — those
              # need a re-embed from the UI. The first such collection
              # (Paperless) doesn't exist yet, so this PR has no
              # in-flight re-index cost.
              #
              # Deliberately UNCHANGED across the 2026-07-25 TEI cutover.
              # TEI serves one model and ignores the request's `model` field
              # (verified: any string returns BAAI/bge-m3), so this string is
              # free to stay `bge-m3` — which matters because Open WebUI
              # treats a changed RAG_EMBEDDING_MODEL as a re-index trigger
              # for existing knowledge collections.
              RAG_EMBEDDING_MODEL: bge-m3
              # Cross-encoder reranker — external mode via TEI on Spark
              # (PR-3 of Stream 2). RAG_RERANKING_MODEL is informational;
              # TEI loads the model server-side. In-process sentence-transformers
              # no longer runs in this pod — memory limit dropped 6Gi → 2Gi.
              RAG_RERANKING_ENGINE: external
              RAG_EXTERNAL_RERANKER_URL: http://tei-spark.ai.svc.cluster.local:3000/rerank
              RAG_RERANKING_MODEL: BAAI/bge-reranker-v2-m3
              RAG_TOP_K_RERANKER: "5"
              RAG_WEB_SEARCH_ENGINE: searxng
              QDRANT_URI: http://qdrant.databases.svc.cluster.local:6333
              SEARXNG_QUERY_URL: http://searxng.collab.svc.cluster.local:8080/search?q=<query>
              VECTOR_DB: qdrant
              AUDIO_OPENAI_API_BASE_URL: https://piper.${SECRET_DOMAIN}/v1
              AUDIO_OPENAI_API_KEY: sk-111111111111 # fake key needed to make ui happy
              # OpenTelemetry traces → the collector in observability,
              # which batches and forwards to Tempo. Tempo and the
              # collector have been deployed and idle since they landed;
              # this is the first real trace producer in the cluster.
              #
              # BOTH gates are required. ENABLE_OTEL only gates the
              # import in main.py; ENABLE_OTEL_TRACES separately gates
              # tracer setup. Setting one alone silently produces no
              # spans and logs nothing.
              ENABLE_OTEL: true
              ENABLE_OTEL_TRACES: true
              OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetry-collector.observability.svc.cluster.local:4317
              # MANDATORY for a plaintext collector — the `http://` above
              # is NOT sufficient on its own. Open WebUI always passes
              # `insecure=` to the SDK as a real bool, which dead-codes
              # the SDK's own scheme-based auto-detection. Left at its
              # default of false, the exporter opens a TLS channel
              # against a cleartext listener and every export fails.
              OTEL_EXPORTER_OTLP_INSECURE: true
              # Protocol selector. NOT the standard
              # OTEL_EXPORTER_OTLP_PROTOCOL — Open WebUI never reads
              # that one. If ever switched to `http`, the endpoint above
              # must also gain an explicit `/v1/traces` path: Open WebUI
              # passes `endpoint=` straight through, which makes the SDK
              # skip appending the signal path, and a bare host 404s.
              OTEL_OTLP_SPAN_EXPORTER: grpc
              OTEL_SERVICE_NAME: open-webui
              # Metrics and logs deliberately left off — Prometheus
              # already scrapes this pod and logs reach Loki via Vector.
              # ENABLE_OTEL_LOGS in particular builds its exporter at
              # import time, so a bad endpoint there surfaces at first
              # log write rather than at startup.
              # OIDC SSO via Authelia
              ENABLE_OAUTH_SIGNUP: true
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: true
              OAUTH_PROVIDER_NAME: Authelia
              OAUTH_CLIENT_ID: open-webui
              # OAUTH_CLIENT_SECRET via envFrom secret
              OPENID_PROVIDER_URL: https://auth.${SECRET_DOMAIN}/.well-known/openid-configuration
              OPENID_REDIRECT_URI: https://open-webui.${SECRET_DOMAIN}/oauth/oidc/callback
              OAUTH_SCOPES: "openid email profile groups"
              OAUTH_USERNAME_CLAIM: preferred_username
              OAUTH_EMAIL_CLAIM: email
              # First user becomes admin automatically; promote others via UI
              WEBUI_URL: https://open-webui.${SECRET_DOMAIN}
              # External tool servers — discovered + exposed as LLM tools
              TOOL_SERVER_CONNECTIONS: |-
                [
                  {
                    "url": "http://mcp-gateway.mcp-system.svc.cluster.local:8080/mcp",
                    "type": "mcp",
                    "auth_type": "none",
                    "config": {"enable": true},
                    "info": {
                      "id": "lovenet-gateway",
                      "name": "Lovenet MCP Gateway",
                      "description": "Aggregated MCP tools: kubectl, grafana, ha, paperless, prometheus, frigate, omada, netbox, *arr, searxng, memory (knowledge-graph search across all agents)"
                    }
                  }
                ]
            envFrom:
              - secretRef:
                  name: open-webui-secret

            resources:
              requests:
                cpu: 15m
                memory: 1Gi
              limits:
                memory: 2Gi

    service:
      app:
        controller: open-webui
        ports:
          http:
            port: &httpPort 8080

    route:
      main:
        annotations:
          glance/name: "Open Web UI"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/open-webui.png"
          glance/id: "Collaboration"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      config:
        existingClaim: open-webui-data-pvc
        globalMounts:
          - path: /app/backend/data
    externalSecrets:
      open-webui:
        refreshInterval: 5m
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: open-webui-secret
          creationPolicy: Owner
          template:
            data:
              OAUTH_CLIENT_SECRET: "{{ .OAUTH_CLIENT_SECRET }}"
        dataFrom:
          - extract:
              key: open-webui
    networkpolicies:
      allow:
        type: cilium
        forceRename: open-webui-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: open-webui
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # HTTPRoute on internal gateway → open-webui:8080. OIDC SSO is
          # handled in-app against Authelia (no oauth2-proxy sidecar).
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        egress:
          # ai/vllm-driver-spark — primary chat LLM (OpenAI /v1) as of the
          # 2026-07-24 cutover. Configured as an Open WebUI OpenAI connection
          # (webui.db openai.api_base_urls); DEFAULT_MODELS = qwen3.6-35b-a3b.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: vllm-driver-spark
            toPorts:
              - ports:
                  - port: "8000"
                    protocol: TCP
          # ai/ollama (P40, qwen2.5:7b selectable) for OLLAMA_BASE_URLS model
          # listing. The ollama-spark hole retires with the service itself
          # (decommissioned 2026-07-26): RAG embeddings left it on 07-25, chat
          # moved to vllm-driver-spark on 07-24, and the vision model it once
          # justified turned out to be unloadable on that arch anyway.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: ollama
            toPorts:
              - ports:
                  - port: "11434"
                    protocol: TCP
          # ai/tei-spark — external reranker (RAG_RERANKING_ENGINE=external,
          # RAG_EXTERNAL_RERANKER_URL points at tei-spark:3000/rerank).
          # ai/tei-embed-spark — RAG embeddings (RAG_EMBEDDING_ENGINE=openai,
          # RAG_OPENAI_API_BASE_URL points at tei-embed-spark:3000/v1) as of the
          # 2026-07-25 cutover. Same port, same namespace — one rule.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: tei-spark
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: tei-embed-spark
            toPorts:
              - ports:
                  - port: "3000"
                    protocol: TCP
          # databases/qdrant — vector store (VECTOR_DB=qdrant, QDRANT_URI).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  app.kubernetes.io/name: qdrant
            toPorts:
              - ports:
                  - port: "6333"
                    protocol: TCP
          # mcp-system/mcp-gateway — TOOL_SERVER_CONNECTIONS includes the
          # gateway at mcp-gateway.mcp-system:8080/mcp. Select the whole ns
          # (matches the langgraph-agents convention) — the mcp-system ns
          # is itself default-deny locked-down.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          # External tool egress: open-webui's web-search backend (searxng,
          # in-cluster — covered intra-ns via baseline), plus an open list
          # of user-configured external integrations (image gen APIs, image
          # fetches for RAG citations, model registry pulls, OpenAI/Mistral/
          # Anthropic if the user wires them in via the UI). Config lives in
          # the open-webui SQLite DB (not in git), so the surface is broad
          # by design. Err on the side of permitting HTTPS world egress.
          #
          # NOTE: world:443 does NOT cover the OIDC path to Authelia or TTS
          # via piper.${SECRET_DOMAIN} — both resolve via split-horizon DNS
          # to the cluster LB IP, which the `world` entity excludes. See the
          # network/envoy:10443 rule below for that.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
          # OIDC discovery + token exchange against Authelia + TTS via
          # piper.${SECRET_DOMAIN}. open-webui is configured with the
          # external issuer URL, so every OIDC request hits split-horizon
          # DNS which returns the envoy LB IP (10.45.0.13). Cilium's
          # socket-lb rewrites the connect() to the envoy pod IP +
          # targetPort 10443 BEFORE policy evaluation (per memory
          # project_cilium_l4_port_targetport.md), so the policy must allow
          # the envoy pod on its container port, NOT world:443 (which
          # doesn't match cluster LB IPs) and NOT authelia:9091 directly
          # (which open-webui never connects to because of how it's
          # configured). Mirrors pump-oauth2-proxy PR #11559.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "10443"
                    protocol: TCP
          # OTLP trace export to the collector in observability. Without this
          # the export is a silent drop — Open WebUI logs nothing and no span
          # reaches Tempo, the same failure shape as the blackbox-exporter
          # label trap in #13264.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: observability
                  app.kubernetes.io/name: opentelemetry-collector
            toPorts:
              - ports:
                  - port: "4317"
                    protocol: TCP
        # Intra-ns to searxng:8080 (SEARXNG_QUERY_URL) is covered by
        # baseline allow-intra-namespace.
