---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
#
# open-webui MCP-gateway token rotator (API-push).
#
# open-webui's TOOL_SERVER_CONNECTIONS is PersistentConfig: seeded from env
# on first boot, then DB-authoritative (open-webui config.py seed_defaults —
# "existing DB values take precedence"). So a rotating bearer token CANNOT be
# delivered via env/reloader; it must be written to the DB through the admin
# API. This job mints a short-lived JWT from the `mcp-openwebui` Authelia
# client (client_credentials) and POSTs it into open-webui's tool_server
# config, which activates it live without a pod restart.
#
# SHIPPED SUSPENDED. Before unsuspending:
#   1. Create 1P item `open-webui-mcp-admin` (field `api_key`) from an
#      open-webui admin user's API key.
#   2. Ensure the `mcp-openwebui` Authelia client is live (force the authelia
#      ExternalSecret sync; Reloader restarts Authelia to load it).
#   3. Manual test: kubectl -n collab create job --from=cronjob/open-webui-mcp-jwt-rotator owui-mcp-rotate-test
#      Verify open-webui's gateway tools still enumerate, then flip suspend.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: open-webui-mcp-jwt-rotator
spec:
  schedule: "0 5 * * *"
  timeZone: "Etc/UTC"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: open-webui-mcp-jwt-rotator
          annotations:
            k8tz.io/inject: "false"
        spec:
          serviceAccountName: open-webui-mcp-jwt-rotator
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: rotator
              image: docker.io/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
              command:
                - /bin/sh
                - -ceu
                # Flux postBuild envsubst substitutes ${VAR}; escape shell
                # vars as $${VAR} so the rendered manifest keeps ${VAR} for sh.
                # ${SECRET_DOMAIN} is a genuine Flux var — left single-$.
                - |
                  TOKEN=$(curl -fsSL -X POST "$${OIDC_TOKEN_ENDPOINT}" \
                    -H "Content-Type: application/x-www-form-urlencoded" \
                    --data-urlencode "grant_type=client_credentials" \
                    --data-urlencode "client_id=$${OIDC_CLIENT_ID}" \
                    --data-urlencode "client_secret=$${OIDC_CLIENT_SECRET}" \
                    --data-urlencode "scope=mcp-gateway" \
                    --data-urlencode "audience=mcp-gateway" | jq -er '.access_token')

                  CUR=$(curl -fsSL "$${OWUI_URL}/api/v1/configs/tool_servers" \
                    -H "Authorization: Bearer $${OPENWEBUI_API_KEY}" \
                    | jq '.TOOL_SERVER_CONNECTIONS // []')

                  ENTRY=$(jq -n --arg url "$${GATEWAY_MCP_URL}" --arg key "$${TOKEN}" '{
                    url: $url, type: "mcp", auth_type: "bearer", key: $key,
                    config: {enable: true},
                    info: {id: "lovenet-gateway", name: "Lovenet MCP Gateway",
                           description: "Aggregated MCP tools (JWT-authenticated via mcp-openwebui client)"}
                  }')

                  NEW=$(printf '%s' "$${CUR}" | jq --argjson e "$${ENTRY}" \
                    '[ .[] | select((.info.id // "") != "lovenet-gateway") ] + [ $e ]')

                  curl -fsSL -X POST "$${OWUI_URL}/api/v1/configs/tool_servers" \
                    -H "Authorization: Bearer $${OPENWEBUI_API_KEY}" \
                    -H "Content-Type: application/json" \
                    -d "$(jq -n --argjson c "$${NEW}" '{TOOL_SERVER_CONNECTIONS: $c}')" >/dev/null

                  echo "Pushed lovenet-gateway tool server with fresh bearer; $(printf '%s' "$${NEW}" | jq 'length') connection(s) total."
              env:
                - name: OIDC_TOKEN_ENDPOINT
                  value: "https://auth.${SECRET_DOMAIN}/api/oidc/token"
                - name: OWUI_URL
                  value: "http://open-webui.collab.svc.cluster.local:8080"
                - name: GATEWAY_MCP_URL
                  value: "https://mcp.${SECRET_DOMAIN}/mcp"
              envFrom:
                - secretRef:
                    name: open-webui-mcp-authelia-client
                - secretRef:
                    name: open-webui-mcp-admin
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
