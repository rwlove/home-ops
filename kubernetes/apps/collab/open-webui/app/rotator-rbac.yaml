---
# Zero-RBAC service account. The rotator talks only to Authelia (token
# mint) and open-webui (config push) over HTTP — it never touches the
# kube API, so it gets no Role/RoleBinding and no mounted SA token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: open-webui-mcp-jwt-rotator
automountServiceAccountToken: false
