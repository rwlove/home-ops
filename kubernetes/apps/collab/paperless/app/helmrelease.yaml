---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      paperless:
        pod:
          # paperless-ngx is s6-overlay based: its preinit refuses to start
          # unless /run is owned by uid 1000. fsGroup only sets the GID, so
          # the chown-runtime-dirs initContainer (root + CAP_CHOWN) fixes the
          # UID ownership of the /run and /tmp emptyDirs before app boot.
          # See issue #12851 / #12846 (first attempt crashlooped ~16h).
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        initContainers:
          chown-runtime-dirs:
            image:
              repository: public.ecr.aws/docker/library/busybox
              tag: "1.38@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616"
            command:
              - sh
              - -c
              - chown 1000:1000 /run /tmp
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN"]
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom: &envFrom
              - secretRef:
                  name: paperless-secret

        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.1.1@sha256:73a1d0bcc5b50cb501f084da795722aa5e2988c6bc9b26ca1ae493a57a490c06
            env:
              # Configure application
              PAPERLESS_URL: "https://paperless.${SECRET_DOMAIN}"
              PAPERLESS_PORT: "8000"
              PAPERLESS_TIME_ZONE: "America/New_York"
              PAPERLESS_WEBSERVER_WORKERS: "2"
              PAPERLESS_TASK_WORKERS: "2"
              # OIDC via Authelia. PAPERLESS_SOCIALACCOUNT_PROVIDERS (the
              # JSON config with the client secret embedded) comes from the
              # externalsecret.
              PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
              PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL: "https"
              # Configure folders
              PAPERLESS_CONSUMPTION_DIR: /library/consume
              PAPERLESS_DATA_DIR: /library/data
              PAPERLESS_EXPORT_DIR: /library/export
              PAPERLESS_MEDIA_ROOT: /library/media
              # Configure folder importer
              PAPERLESS_CONSUMER_POLLING: "60"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              # Configure OCR
              PAPERLESS_OCR_LANGUAGE: eng
              # Configure redis integration (celery broker). Own db index
              # (db7) so it no longer shares db0 with other tenants.
              PAPERLESS_REDIS: redis://dragonfly.databases.svc.cluster.local:6379/7

            envFrom: *envFrom

            resources:
              requests:
                cpu: 15m
                memory: 2Gi
              limits:
                # 4Gi -> 5Gi: a transient OCR/indexing spike OOMKilled the
                # pod once (1 restart in 7d; steady-state ~1.5Gi). Slight
                # headroom bump for the rare large-document burst.
                memory: 5Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: paperless
        ports:
          http:
            port: &httpPort 8000

    route:
      app:
        annotations:
          glance/name: "Paperless"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/paperless-ngx.png"
          glance/id: "Collaboration"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      library:
        existingClaim: paperless-library-pvc
      # s6-overlay writes supervision state to /run; readOnlyRootFilesystem
      # forces these onto tmpfs. chown-runtime-dirs sets uid-1000 ownership.
      run:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /run
      tmp:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp
