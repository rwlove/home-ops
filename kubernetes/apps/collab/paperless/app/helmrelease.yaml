---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      paperless:
        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        # runAsNonRoot: live-verified 2026-07-04 against the real
        # image+tag (not just docs). paperless-ngx is s6-overlay based
        # (same family as the wyoming-services whisper deferral above)
        # but its entrypoint has first-class non-root support: it
        # detects a non-zero start UID and logs "Running as non-root
        # user (1000:1000), skipping UID/GID remapping" — no PUID/PGID
        # dance needed. USERMAP_UID/GID below are a documented no-op in
        # that mode (upstream logs a warning) but kept for clarity/
        # back-compat if non-root is ever reverted. The PVC's actual
        # document subdirs (consume/data/media) were ALREADY 1000:1000
        # owned in prod before this change — only the /library mount
        # root itself was 0:0, so fsGroup's OnRootMismatch does a one-
        # time recursive chown (standard k8s mechanism, not a manual
        # migration) rather than a bulk ownership flip on already-
        # correct data.
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4.0@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
            envFrom: &envFrom
              - secretRef:
                  name: paperless-secret

        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 2.20.15

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

            env:
              # USERMAP_UID/GID are a no-op once the pod runs fully
              # non-root (upstream skips remapping and warns) — kept
              # for documentation/back-compat.
              USERMAP_UID: "1000"
              USERMAP_GID: "1000"
              # Configure application
              PAPERLESS_URL: "https://paperless.${SECRET_DOMAIN}"
              PAPERLESS_PORT: "8000"
              PAPERLESS_TIME_ZONE: "America/New_York"
              PAPERLESS_WEBSERVER_WORKERS: "2"
              PAPERLESS_TASK_WORKERS: "2"
              # OIDC via Authelia. PAPERLESS_SOCIALACCOUNT_PROVIDERS (the
              # JSON config with the client secret embedded) comes from the
              # externalsecret.
              PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
              PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL: "https"
              # Configure folders
              PAPERLESS_CONSUMPTION_DIR: /library/consume
              PAPERLESS_DATA_DIR: /library/data
              PAPERLESS_EXPORT_DIR: /library/export
              PAPERLESS_MEDIA_ROOT: /library/media
              # Configure folder importer
              PAPERLESS_CONSUMER_POLLING: "60"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              # Configure OCR
              PAPERLESS_OCR_LANGUAGE: eng
              # Configure redis integration
              PAPERLESS_REDIS: redis://dragonfly.databases.svc.cluster.local:6379/0

            envFrom: *envFrom

            resources:
              requests:
                cpu: 15m
                memory: 2Gi
              limits:
                # 4Gi -> 5Gi: a transient OCR/indexing spike OOMKilled the
                # pod once (1 restart in 7d; steady-state ~1.5Gi). Slight
                # headroom bump for the rare large-document burst.
                memory: 5Gi

    service:
      app:
        controller: paperless
        ports:
          http:
            port: &httpPort 8000

    route:
      app:
        annotations:
          glance/name: "Paperless"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/paperless-ngx.png"
          glance/id: "Collaboration"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      library:
        existingClaim: paperless-library-pvc

      tmp:
        type: emptyDir
        advancedMounts:
          paperless:
            app:
              - path: /tmp

      run:
        # s6-overlay preinit wants to own /run; under readOnlyRootFilesystem
        # this needs an explicit writable (tmpfs) mount or the container
        # can't even get through its init stage. Live-verified 2026-07-04.
        type: emptyDir
        advancedMounts:
          paperless:
            app:
              - path: /run
