---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      paperless:
        pod:
          # paperless-ngx is s6-overlay based: its preinit refuses to start
          # unless /run is owned by uid 1000. fsGroup only sets the GID, so
          # the chown-runtime-dirs initContainer (root + CAP_CHOWN) fixes the
          # UID ownership of the /run and /tmp emptyDirs before app boot.
          # See issue #12851 / #12846 (first attempt crashlooped ~16h).
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        initContainers:
          chown-runtime-dirs:
            image:
              repository: public.ecr.aws/docker/library/busybox
              tag: "1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4"
            command:
              - sh
              - -c
              - chown 1000:1000 /run /tmp
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN"]
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 19.0.0@sha256:b49e2f1f373d932ab41614633ac89fa506e5d21bb13cc18d9c96ca026e51f502
            envFrom: &envFrom
              - secretRef:
                  name: paperless-secret

        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.5.1@sha256:8508853b8a0f8394074260957d0be186c8c64f346973b24a7583de4580f306b9
            env:
              # Configure application
              PAPERLESS_URL: "https://paperless.${SECRET_DOMAIN}"
              # From the 3.5.0 upgrade (2026-11-17) the default ALLOWED_HOSTS
              # stopped accepting the Service name, so in-cluster callers (the
              # Windmill RAG workflows, scanservjs upload) got Django
              # DisallowedHost → HTTP 400.
              # Setting this replaces the derived list, so the external host
              # must stay in it.
              PAPERLESS_ALLOWED_HOSTS: "paperless.${SECRET_DOMAIN},paperless.collab.svc.cluster.local,paperless.collab.svc,paperless.collab,paperless,localhost"
              PAPERLESS_PORT: "8000"
              PAPERLESS_TIME_ZONE: "America/New_York"
              PAPERLESS_WEBSERVER_WORKERS: "2"
              PAPERLESS_TASK_WORKERS: "2"
              # OIDC via Authelia. PAPERLESS_SOCIALACCOUNT_PROVIDERS (the
              # JSON config with the client secret embedded) comes from the
              # externalsecret.
              PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
              PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL: "https"
              # Configure folders
              PAPERLESS_CONSUMPTION_DIR: /library/consume
              PAPERLESS_DATA_DIR: /library/data
              PAPERLESS_EXPORT_DIR: /library/export
              PAPERLESS_MEDIA_ROOT: /library/media
              # Configure folder importer
              PAPERLESS_CONSUMER_POLLING: "60"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              # Configure OCR
              PAPERLESS_OCR_LANGUAGE: eng
              # Configure redis integration (celery broker). Own db index
              # (db7) so it no longer shares db0 with other tenants.
              PAPERLESS_REDIS: redis://dragonfly.databases.svc.cluster.local.:6379/7
              # Native paperless-ngx AI (v3.1.x). Hybrid GPU routing keeps the
              # steady embedding load on the cheap, already-warm P40 path and
              # sends only occasional generation to the Spark 35B:
              #   embeddings -> P40 ollama bge-m3        (native ollama API)
              #   generation -> Spark vLLM qwen3.6-35b-a3b (OpenAI /v1)
              # Both endpoints are in-cluster ONLY — paperless documents are
              # internal-tier and must never reach a remote API (key below is a
              # placeholder, not a secret). CNP holes: this app's egress in
              # cnp-allow.yaml + ingress in ai/ollama and ai/vllm-driver-spark.
              PAPERLESS_AI_ENABLED: "true"
              # Generation -> Spark vLLM (OpenAI-compatible; api_base needs /v1).
              # Model is the driver's --served-model-name, stable across image
              # bumps.
              PAPERLESS_AI_LLM_BACKEND: openai-like
              PAPERLESS_AI_LLM_MODEL: qwen3.6-35b-a3b
              PAPERLESS_AI_LLM_ENDPOINT: http://vllm-driver-spark.ai.svc.cluster.local:8000/v1
              # vLLM enforces no key; a non-empty placeholder stops the
              # OpenAI-compatible client refusing to send with an empty key.
              # NOT a secret — never leaves the cluster.
              PAPERLESS_AI_LLM_API_KEY: not-needed
              # Embeddings -> P40 ollama bge-m3 (native ollama API, bare root,
              # NO /v1). Reuses the embedder already resident + validated for
              # this corpus.
              PAPERLESS_AI_LLM_EMBEDDING_BACKEND: ollama
              PAPERLESS_AI_LLM_EMBEDDING_MODEL: bge-m3
              PAPERLESS_AI_LLM_EMBEDDING_ENDPOINT: http://ollama.ai.svc.cluster.local:11434

            envFrom: *envFrom

            resources:
              requests:
                cpu: 15m
                memory: 2Gi
              limits:
                # 4Gi -> 5Gi: a transient OCR/indexing spike OOMKilled the
                # pod once (1 restart in 7d; steady-state ~1.5Gi). Slight
                # headroom bump for the rare large-document burst.
                memory: 5Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: paperless
        ports:
          http:
            port: &httpPort 8000

    route:
      app:
        annotations:
          glance/name: "Paperless"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/paperless-ngx.png"
          glance/id: "Collaboration"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      library:
        existingClaim: paperless-library-pvc
      # s6-overlay writes supervision state to /run; readOnlyRootFilesystem
      # forces these onto tmpfs. chown-runtime-dirs sets uid-1000 ownership.
      run:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /run
      tmp:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp
