---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pump-voltra
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    controllers:
      pump-voltra:
        annotations:
          reloader.stakater.com/auto: "true"

        # The Voltra accepts exactly ONE BLE central. Two replicas — or a
        # RollingUpdate that briefly runs old and new together — would fight
        # over the connection and neither would log reliably. Recreate is
        # load-bearing, not a preference.
        replicas: 1
        strategy: Recreate

        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000

        containers:
          pump-voltra:
            image:
              repository: ghcr.io/rwlove/pump-voltra
              tag: v0.1.9@sha256:4dcf60da11f75d6ae5ef3c7c8bda3ab9fd574c49091581c5f0ff1ed39b2e07e9

            env:
              VOLTRA_ENABLED: "true"
              # The ESPHome bluetooth_proxy bridging gym-BLE to LAN-TCP
              # (M5Stack ATOM Lite, bluetooth-proxy-gym, IoT VLAN). Addressed
              # by IP rather than hostname so the pod needs no egress to
              # brain's DNS — the cnp-allow rule pins the same /32.
              VOLTRA_PROXY_HOST: 10.10.20.69
              PUMP_API_BASE_URL: http://pump-api:8851
              # Written on sets logged before the athlete has logged any set
              # for a Voltra-flagged exercise that day. Such sets are marked
              # pending so the name gets corrected in the UI; normally the
              # name is inherited and this is unused.
              VOLTRA_DEFAULT_EXERCISE: Voltra
              # Ceiling on any weight written to the motor; requests above it
              # are clamped. Same as the image default — stated here because
              # from v0.1.7 this sidecar commands the motor, and a physical
              # safety limit should be reviewable in the manifest rather than
              # inherited invisibly from the image.
              VOLTRA_MAX_LOAD_LB: "130"

            envFrom:
              - secretRef:
                  name: pump-voltra-secret

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 3
              # Readiness is deliberately DISABLED. /readyz reports 503
              # whenever the trainer isn't connected, which is the normal
              # state of an empty gym — wiring it would leave the pod
              # NotReady most of the day and make a healthy service look
              # broken. Nothing routes traffic to this pod, so readiness
              # buys nothing. Connection state is observable on /metrics
              # (pump_voltra_connected).
              readiness:
                enabled: false

            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    # This app exposes /metrics (pump_voltra_connected) but had no
    # Service at all, so nothing could reach it — the only signal for a
    # sidecar that commands a motor under a physical load clamp was its
    # liveness probe. Port 8080 is the same HTTP server the liveness
    # probe hits (/healthz); the container declares no ports and the
    # image is private, so this is inferred rather than read from
    # source. Blast radius is nil (nothing routes here), and a wrong
    # port shows up immediately as a down scrape target.
    service:
      app:
        controller: pump-voltra
        ports:
          metrics:
            port: 8080

    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
        serviceName: pump-voltra

    # Deliberately NO alert on `pump_voltra_connected == 0`. Disconnected
    # is the NORMAL state of an empty gym — the readiness probe is
    # disabled for exactly that reason — so alerting on it would fire
    # most of the day. The metric is for dashboards and post-hoc
    # debugging; a useful alert would need to key off an active session,
    # which there is no signal for yet.
