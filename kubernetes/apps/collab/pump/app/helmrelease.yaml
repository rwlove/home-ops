---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pump
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      pump:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            # /clips is a shared RWX PVC (also mounted by pump-cv);
            # fsGroup keeps it writable for the non-root pump process.
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b

            envFrom: &envFrom
              - secretRef:
                  name: pump-secret
            securityContext: &hardened
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
        # trigger renovate
        containers:
          pump:
            image:
              repository: ghcr.io/rwlove/pump
              tag: v0.2.10@sha256:dd51e75264230725690504d462b183a06b8c6cf21d2ed73080b98d97ded46a17

            env:
              # Activates the /api/cv/* proxy in pump (see internal/web/exercise.go).
              # The wall page's live camera previews and the admin panel both
              # depend on this being reachable.
              PUMP_CV_URL: http://pump-cv:8080
              # Static-serve the per-set clip mp4s pump-cv writes here. Shared
              # RWX volume (pump-clips-pvc, declared in pump-cv/app/clips-pvc.yaml).
              PUMP_CLIPS_DIR: /clips
              # Treadmill cardio auto-capture. PUMP subscribes to the gym
              # treadmill's Z-Wave metering smart plug — its wattage is
              # published to EMQX by zwave-js-ui (no Home Assistant in the
              # path) — detects each workout, and logs it as a cardio session.
              # Credentials TREADMILL_MQTT_USERNAME/PASSWORD come from
              # pump-secret (1Password "emqx" item). Threshold matches HA's
              # binary_sensor.treadmill helper (threshold upper=100 W,
              # hysteresis 0 on sensor.treadmill_electric_w_value).
              TREADMILL_MQTT_ENABLED: "true"
              TREADMILL_MQTT_BROKER: tcp://emqx-headless.home.svc.cluster.local:1883
              TREADMILL_MQTT_TOPIC: zwave/Gym/Treadmill/50/0/value/66049
              TREADMILL_WATTS_THRESHOLD: "100"
              # Accept set writes from the pump-voltra sidecar, which reads
              # rep count and real resistance off the Beyond Power VOLTRA I
              # over BLE. Without this pump 403s every Source: "voltra" write.
              #
              # It also flips the workout page to per-set saves. That matters:
              # in bulk mode the page rewrites the whole day from the browser
              # DOM, which would delete sidecar-written sets on the next
              # autosave. Env-only — there is no Settings toggle for it, unlike
              # CVAutoLog.
              VOLTRA_AUTOLOG: "true"
              # Self-hosted speech-to-text for set-note dictation. The workout
              # page captures mic audio, downsamples to 16 kHz mono PCM, and
              # POSTs it to pump's /api/stt, which relays it to this Wyoming
              # faster-whisper service — audio never leaves the network (the
              # browser's cloud Web Speech API is what this replaced). Egress
              # to home ns :10300 is punched in cnp-allow.yaml.
              WHISPER_WYOMING_ADDR: wyoming-services-whisper.home.svc.cluster.local:10300

            envFrom:
              - secretRef:
                  name: pump-secret

            # The Go server shipped with NO probes — a wedged server (a
            # deadlock, a goroutine parked on a dead DB connection, pool
            # starvation) stayed Running and served nothing, with nothing to
            # restart it. `/api/ping` is a static 200 that only answers once the
            # HTTP listener is up, which is AFTER MigratePostgres runs at boot —
            # so a startup probe on it doubles as "migrations finished", and its
            # generous failureThreshold keeps a slow migration from being killed
            # mid-run (the migration runner has no context deadline). Liveness
            # then takes over. Readiness is left to app-template's TCP default;
            # a DB-aware /readyz is a follow-up.
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ping
                    port: 8080
                  # 40 × 5s = up to ~200s for boot + migrations before the
                  # pod is declared failed.
                  periodSeconds: 5
                  failureThreshold: 40
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ping
                    port: 8080
                  periodSeconds: 30
                  failureThreshold: 3

            resources:
              requests:
                cpu: 15m
                # Request stays at the idle footprint; the limit is raised to
                # give burst headroom. request==limit==128M left ZERO room for a
                # spike (a large health-ingest batch, many concurrent SSE
                # clients, image/QR generation) — the next spike OOMKills the
                # server and drops every SSE connection. Burstable QoS with a
                # 320M ceiling absorbs the spike while keeping the scheduler
                # footprint small.
                memory: 128M
              limits:
                memory: 320M
            securityContext: *hardened

    service:
      frontend:
        ports:
          http:
            port: &httpPort 8080
      api:
        ports:
          http:
            port: &apiPort 8851
            targetPort: 8080

    route:
      frontend:
        annotations:
          glance/name: "PUMP"
          glance/show: "true"
          glance/id: "Collaboration"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          # Inbound auth is enforced at the gateway by the extAuth
          # SecurityPolicy (securitypolicy.yaml, admin-only via Authelia).
          # pump itself ships with no inbound APIKeyMiddleware as of
          # v0.0.83+ — this route must never lose its SecurityPolicy.
          - backendRefs:
              - kind: Service
                name: pump-frontend
                port: 8080

      # Public PWA carve-out. The rest of this hostname is behind Authelia
      # extAuth (securitypolicy.yaml, admin-only). But the Android/Brave
      # WebAPK icon minter fetches the manifest and icons from a REMOTE
      # Brave/Google service that has no Authelia session — so it was bounced
      # to the login page and fell back to a generic monogram instead of the
      # PUMP logo on the installed home-screen shortcut. These static files
      # (the manifest + brand images — no user data) are served without
      # extAuth so the minter can read them. Exact-path matches take Gateway
      # API precedence over the frontend route's "/" PathPrefix, and the
      # SecurityPolicy targets the pump-frontend route only, so this route is
      # naturally unauthenticated. Everything else stays admin-only.
      pwa:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /manifest.json
              - path:
                  type: Exact
                  value: /fs/public/manifest.json
              - path:
                  type: Exact
                  value: /fs/public/icon-192.png
              - path:
                  type: Exact
                  value: /fs/public/icon-maskable.png
              - path:
                  type: Exact
                  value: /fs/public/favicon.png
              - path:
                  type: Exact
                  value: /fs/public/favicon.svg
            backendRefs:
              - kind: Service
                name: pump-frontend
                port: 8080

      # Off-cluster ingest path. Bypasses gateway extAuth and goes straight
      # to pump-api:8851. Scoped by path match to /api/weight and POST
      # /api/health — all other /api/* endpoints on this hostname 404.
      # App-side auth is WEIGHT_INGEST_KEY / HEALTH_INGEST_KEY (env from
      # pump-secret), enforced by the weightIngestAuth / healthIngestAuth
      # middleware on the respective POST routes (pump v0.0.91+ / v0.0.93+).
      # Callers: the bt-scale ESPHome device (weight) and the Android
      # Health Connect HC Webhook bridge on Rob's S26 (health).
      ingest:
        hostnames:
          - "pump-ingest.${SECRET_DOMAIN}"
        # Attached to BOTH http:80 and https:443 on the internal Gateway.
        # NOTE: the Gateway's http listener redirects to HTTPS (301), so in
        # practice only HTTPS is served. The bt-scale ESPHome firmware was
        # originally HTTP-only because MbedTLS crashed on the M5 Atom (320 KB
        # RAM / ~4 KB BLE task stack). The firmware was fixed in 2026-05-26:
        #   - sram1_as_iram: true (+40 KB IRAM headroom)
        #   - deferred post_weight_to_pump script (handshake runs on main loop)
        # The device now posts to https:// without crashing. Auth enforced at
        # the app layer via WEIGHT_INGEST_KEY.
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
          - name: internal
            namespace: network
            sectionName: http
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api/weight
            backendRefs:
              - kind: Service
                name: pump-api
                port: 8851
          # Wearable metrics from Android Health Connect. Scoped to POST so
          # GET /api/health (unauthenticated health-record read) is NOT
          # reachable off-cluster — tighter than the weight rule above
          # because health data is more sensitive.
          - matches:
              - path:
                  type: PathPrefix
                  value: /api/health
                method: POST
            backendRefs:
              - kind: Service
                name: pump-api
                port: 8851

    persistence:
      # Per-set clip mp4s written by pump-cv. Same RWX volume on both
      # apps; declared in collab/pump-cv/app/clips-pvc.yaml.
      clips:
        type: persistentVolumeClaim
        existingClaim: pump-clips-pvc
        advancedMounts:
          pump:
            pump:
              - path: /clips
    externalSecrets:
      pump:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: pump-secret
          template:
            engineVersion: v2
            data:
              # App
              POSTGRES_DSN: postgres://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@postgres-pump-rw.databases.svc.cluster.local:5432/pump
              API_KEY: "{{ .API_KEY }}"
              # Required header value for off-cluster POST /api/weight (e.g. the
              # bt-scale ESPHome device reaching pump-ingest.${SECRET_DOMAIN}).
              # Add a "WEIGHT_INGEST_KEY" field to the 1Password "pump" item.
              WEIGHT_INGEST_KEY: "{{ .WEIGHT_INGEST_KEY }}"
              # Required header value for off-cluster POST /api/health (the Android
              # Health Connect "HC Webhook" bridge on Rob's S26 → pump-ingest).
              # Add a "HEALTH_INGEST_KEY" field to the 1Password "pump" item; set
              # the same value as the webhook app's X-Api-Key custom header.
              HEALTH_INGEST_KEY: "{{ .HEALTH_INGEST_KEY }}"
              # Treadmill cardio auto-capture: PUMP subscribes to the Z-Wave
              # smart-plug wattage that zwave-js-ui publishes to the EMQX broker.
              # Credentials come from the shared 1Password "emqx" item — the same
              # user every other in-cluster MQTT consumer (zigbee2mqtt, mqtt-exporter)
              # uses.
              TREADMILL_MQTT_USERNAME: "{{ .user_1_username }}"
              TREADMILL_MQTT_PASSWORD: "{{ .user_1_password }}"

              # Postgres Init
              INIT_POSTGRES_DBNAME: pump
              INIT_POSTGRES_HOST: postgres-pump-rw.databases.svc.cluster.local
              INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
              INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
              INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        dataFrom:
          - extract:
              key: cloudnative-pg
          - extract:
              key: pump
          # Shared EMQX broker credentials (user_1_username / user_1_password) for
          # the treadmill MQTT consumer — same item the other consumers extract.
          - extract:
              key: emqx
    networkpolicies:
      allow:
        type: cilium
        forceRename: pump-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: pump
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it. Inbound rides via the internal gateway
        # (extAuth SecurityPolicy, #12767). pump-cv → pump-api:8851 is
        # same-ns (baseline allow-intra-namespace).
        enableDefaultDeny:
          egress: false
          ingress: false
        egress:
          # CNPG cluster postgres-pump in databases ns (Pattern B).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  cnpg.io/cluster: postgres-pump
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
          # EMQX broker in home ns — the treadmill cardio consumer subscribes to
          # the Z-Wave smart-plug wattage zwave-js-ui publishes here (1883).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: home
                  app.kubernetes.io/name: emqx
            toPorts:
              - ports:
                  - port: "1883"
                    protocol: TCP
          # Wyoming faster-whisper in home ns — set-note dictation relays
          # browser-captured PCM through pump's /api/stt to this ASR service
          # (WHISPER_WYOMING_ADDR), so audio stays on the network. The
          # controller label pins it to the whisper sub-service, not kokoro/
          # openwakeword which share app.kubernetes.io/name: wyoming-services.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: home
                  app.kubernetes.io/name: wyoming-services
                  app.kubernetes.io/controller: whisper
            toPorts:
              - ports:
                  - port: "10300"
                    protocol: TCP
        # Intra-ns pump-cv:8080 (PUMP_CV_URL admin/preview proxy) is
        # covered by baseline allow-intra-namespace.
        ingress:
          # Internal Gateway → pump pod :8080, two paths:
          # - route.ingest (pump-ingest.${SECRET_DOMAIN}/api/weight): identity
          #   gating at the app layer via WEIGHT_INGEST_KEY.
          # - frontend UI (pump.${SECRET_DOMAIN}): admin-only extAuth
          #   SecurityPolicy at the gateway (#12767, oauth2-proxy retired).
          # The Gateway terminates TLS; source IP at the pod is the Gateway
          # pod, not the original client.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
