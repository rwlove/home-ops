---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pump-rules
spec:
  groups:
    - name: pump.availability
      rules:
        # The wedge that silently killed a workout's auto-load: pump-voltra's
        # probe server stayed up while its work loop stalled on a hung BLE /
        # proxy await, so the pod looked healthy and the kubelet never
        # restarted it. The sidecar now stamps a heartbeat every loop tick;
        # `time() - heartbeat` catches a stall the frozen gauges can't.
        # The in-pod liveness watchdog restarts at 600s, so a stale heartbeat
        # surviving 10m means auto-recovery itself failed (crashloop, bad
        # config, or the probe wedged too) — that is the page-worthy case.
        - alert: PumpVoltraSidecarWedged
          annotations:
            summary: pump-voltra work loop wedged (Voltra auto-load unavailable)
            description: |
              pump-voltra's heartbeat has been stale >10m — its control loop
              has stalled and the Voltra will not load mid-workout, even though
              the pod may report healthy. The in-pod liveness watchdog should
              have restarted it at ~600s; if this is firing, auto-recovery is
              not working. Manual recovery:
              `kubectl -n collab rollout restart deploy/pump-voltra`, then check
              logs for a hung ESPHome-proxy/BLE await or a dead work task.
          expr: |-
            time() - pump_voltra_heartbeat_timestamp_seconds{job="pump-voltra"} > 600
          for: 10m
          labels:
            severity: critical
        # Metrics endpoint unreachable: pod crashed, OOMKilled, crashlooping,
        # or unschedulable. 15m tolerates a normal rolling deploy.
        - alert: PumpVoltraScrapeDown
          annotations:
            summary: pump-voltra metrics target down (>15m)
            description: |
              Prometheus cannot scrape pump-voltra for >15m — the pod is likely
              crashed, OOMKilled, crashlooping, or unschedulable (longer than a
              deploy). `kubectl -n collab get pod -l app.kubernetes.io/name=pump-voltra`
              and `kubectl -n collab logs -l app.kubernetes.io/name=pump-voltra --previous`.
          expr: |-
            up{job="pump-voltra"} == 0
          for: 15m
          labels:
            severity: warning
        # A single unexpected drop of the always-on gym ESPHome BLE proxy — the
        # ESP32 resetting or a network blip out from under a live BLE session.
        # This is the failure that silently dropped a mid-workout LOAD on
        # 2026-09-30: pressing LOAD in PUMP applied no weight because the sidecar
        # had lost its path to the trainer. The PumpVoltraProxyFlapping Loki
        # alert only catches the *repeated* case (>=2/15m); this catches the
        # first one. The counter never increments on the trainer being powered
        # off (the normal idle state) or on a planned reconnect/shutdown — only
        # on_stop expected=False — so it cannot false-fire on an idle gym.
        - alert: PumpVoltraProxyDisconnected
          annotations:
            summary: pump-voltra lost its BLE proxy unexpectedly
            description: |
              The gym ESPHome bluetooth proxy (bluetooth-proxy-gym-poe, 10.10.20.59)
              dropped its session unexpectedly in the last 15m. If this happened
              mid-workout, pressing LOAD in PUMP would not have applied weight —
              the sidecar self-heals in a few minutes but the load request is
              lost. Usually a transient ESP32 reset / network blip; if it recurs,
              check the gym proxy's PoE power and ethernet link. `kubectl -n collab logs
              -l app.kubernetes.io/name=pump-voltra | grep -i "proxy"`.
          expr: |-
            increase(pump_voltra_proxy_disconnects_total{job="pump-voltra"}[15m]) >= 1
          for: 5m
          labels:
            severity: warning
        # The server (pump-0) and camera sidecar (pump-cv) carry real readiness
        # probes; a sustained not-Ready means the UI/ingest (pump-0) or CV
        # capture (pump-cv) is down. pump-voltra is excluded here — its
        # readiness probe is disabled, so PumpVoltraSidecarWedged covers it.
        - alert: PumpPodNotReady
          annotations:
            summary: pump pod {{ $labels.pod }} not Ready (>10m)
            description: |
              {{ $labels.pod }} in collab has been not-Ready for >10m. pump-0
              not Ready = the workout UI and all ingest are down; pump-cv not
              Ready = camera auto-logging is down. `kubectl -n collab describe
              pod {{ $labels.pod }}` and `kubectl -n collab logs {{ $labels.pod }} --previous`.
          expr: |-
            kube_pod_status_ready{namespace="collab", pod=~"pump-0|pump-cv-.*", condition="true"} == 0
          for: 10m
          labels:
            severity: critical
        # Any pump pod stuck in CrashLoopBackOff. For pump-voltra this most
        # likely means the new fail-fast is restart-looping on a persistent
        # fault (dead proxy, unusable config) rather than recovering.
        - alert: PumpPodCrashLooping
          annotations:
            summary: pump pod {{ $labels.pod }} crash-looping
            description: |
              {{ $labels.pod }} in collab has been in CrashLoopBackOff for >10m.
              If it is pump-voltra, the liveness/fail-fast recovery is looping on
              a persistent fault rather than healing. `kubectl -n collab logs
              {{ $labels.pod }} --previous` for the crash cause.
          expr: |-
            kube_pod_container_status_waiting_reason{namespace="collab", pod=~"pump-.*", reason="CrashLoopBackOff"} == 1
          for: 10m
          labels:
            severity: critical
    - name: pump.data
      rules:
        # A completed set the sidecar could not write to PUMP — the rep count
        # and resistance for that set are lost. Rare and worth a look, not a
        # page: warning severity.
        - alert: PumpVoltraSetWriteFailures
          annotations:
            summary: pump-voltra failed to write a set to PUMP
            description: |
              pump-voltra could not write ≥1 completed set to PUMP in the last
              hour — that set's reps/resistance may be lost. Check the sidecar
              logs and pump-0's /api/sets handler.
          expr: |-
            increase(pump_voltra_sets_failed_total{job="pump-voltra"}[1h]) > 0
          for: 5m
          labels:
            severity: warning
        # The scale (or its ingest path) silently stopped logging for 16 days
        # in Nov 2026 and nothing alerted. Rob weighs in every ~2-5 days; over
        # the prior 200 days the longest normal gap was 9 days (plus one 29-day
        # outlier), so >10 days with no new reading is a real stall, not a
        # skipped week. Signal is the latest weigh-in `date` (not recorded_at,
        # which a manual backfill would reset), exported by the CNPG custom
        # query in databases/cloudnative-pg/config/pump/monitoring-configmap.yaml.
        # max() collapses the per-instance series so a failover/replica lag
        # cannot flap it. Warning only: nothing is on fire, the data is just
        # not arriving.
        - alert: PumpWeightReadingStale
          annotations:
            summary: no PUMP body-weight reading in >10 days
            description: |
              The newest body-weight reading in PUMP is more than 10 days old
              (normal cadence is every 2-5 days, longest normal gap ~9). The
              scale or its ingest path (the bluetooth-proxy-gym-poe ESPHome
              device POSTing to pump-ingest) has probably stopped logging.
              Check that device's power/link and its scale config, then pump-0
              logs for rejected weight posts (WEIGHT_INGEST_KEY). The age is
              `time() - max(cnpg_pump_weight_last_reading_timestamp_seconds)`.
          expr: |-
            time() - max(cnpg_pump_weight_last_reading_timestamp_seconds{namespace="databases"}) > 10 * 86400
          for: 6h
          labels:
            severity: warning
        # Guard for the alert above: if the custom query or exporter breaks
        # the metric vanishes and PumpWeightReadingStale would go silently
        # quiet (absent series never compares true). 1h rides out a CNPG
        # switchover / rolling restart.
        - alert: PumpWeightMetricAbsent
          annotations:
            summary: PUMP weigh-in freshness metric missing (>1h)
            description: |
              cnpg_pump_weight_last_reading_timestamp_seconds is not being
              exported, so PumpWeightReadingStale cannot fire. Check the
              postgres-pump-monitoring ConfigMap, the postgres-pump-metrics
              PodMonitor, and the postgres-pump instance logs for
              "Error collecting user query" (query pump_weight). A failing
              user query does NOT raise cnpg_collector_last_collection_error,
              which stays 0. "permission denied for table weight" means the
              pg_monitor grant (PUMP migration v26) is missing.
          expr: |-
            absent(cnpg_pump_weight_last_reading_timestamp_seconds{namespace="databases"})
          for: 1h
          labels:
            severity: warning
