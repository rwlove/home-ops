---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scanservjs
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: scanservjs-secret
    template:
      engineVersion: v2
      data:
        # paperless-ngx API token used by the "Scan to Paperless" pipeline
        # (config.local.js) to POST /api/documents/post_document/.
        #
        # TODO(rob): add a field named SCAN_UPLOAD_TOKEN to the existing
        # 1Password "paperless" item (paperless UI -> user -> API token).
        # Until then this renders empty and uploads return 401 — scanservjs
        # still starts and its web UI works; only the paperless hand-off
        # waits on the token.
        PAPERLESS_TOKEN: "{{ .SCAN_UPLOAD_TOKEN }}"
  dataFrom:
    - extract:
        key: paperless
