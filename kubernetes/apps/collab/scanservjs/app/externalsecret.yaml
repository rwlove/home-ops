---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scanservjs
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: scanservjs-secret
    template:
      engineVersion: v2
      data:
        # paperless-ngx API token used by the "Scan to Paperless" pipeline
        # (config.local.js) to POST /api/documents/post_document/.
        #
        # TODO(rob): add a field named SCAN_UPLOAD_TOKEN to the existing
        # 1Password "paperless" item (paperless UI -> user -> API token).
        #
        # `index . "SCAN_UPLOAD_TOKEN"` (not `.SCAN_UPLOAD_TOKEN`) is
        # deliberate: ESO renders templates with missingkey=error, so a bare
        # field access hard-fails the whole ExternalSecret when the field is
        # absent (SecretSyncedError → the secret is never created → the pod's
        # secret volume can't mount). `index` returns empty for a missing key
        # instead, so the secret is always created (empty token) and scanservjs
        # boots; the paperless upload just 401s until the field is added, at
        # which point Reloader restarts the pod.
        PAPERLESS_TOKEN: '{{ index . "SCAN_UPLOAD_TOKEN" | default "" }}'
  dataFrom:
    - extract:
        key: paperless
