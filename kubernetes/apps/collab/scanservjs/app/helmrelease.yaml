---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scanservjs
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      scanservjs:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          # Run as the image's own scanservjs user (uid 102), which owns
          # /var/lib/scanservjs (the writable data dir: device cache, temp,
          # output). The image's entrypoint runs as root and relies on
          # CAP_DAC_OVERRIDE to write that dir — but we drop ALL caps, so root
          # gets EACCES there. Running as the owning uid needs no caps and no
          # root. gid 100 (users) = the data dir's group; fsGroup 100 makes the
          # mounted secret + tmp readable/writable. eSCL scanning is pure HTTP,
          # so no privilege is required.
          securityContext:
            runAsNonRoot: true
            runAsUser: 102
            runAsGroup: 100
            fsGroup: 100
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: ghcr.io/sbs20/scanservjs
              tag: v3.3.0@sha256:7a0c0dfd546f483c2fe8c5ccdcd8fc96301a41fb0d4309747fc8268108defb6a
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              # scanservjs writes runtime state (config merge, per-scan
              # working files) into its app dir + /tmp; it is not
              # read-only-rootfs clean. Scratch is ephemeral (scans are
              # uploaded to paperless then discarded), so this is low-risk.
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: scanservjs
        ports:
          http:
            port: 8080

    persistence:
      # In-container scratch for the SANE scan + pipeline (imagemagick,
      # curl). Ephemeral: the assembled PDF is POSTed to paperless and
      # dropped.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      config:
        type: configMap
        name: scanservjs-config
        advancedMounts:
          scanservjs:
            app:
              - path: /etc/scanservjs/config.local.js
                subPath: config.local.js
                readOnly: true
              - path: /etc/scanservjs/upload-to-paperless.js
                subPath: upload-to-paperless.js
                readOnly: true
              - path: /etc/sane.d/airscan.conf
                subPath: airscan.conf
                readOnly: true
      # paperless API token, read by the pipeline as $(cat /secrets/
      # PAPERLESS_TOKEN). The ExternalSecret always creates scanservjs-secret
      # (the 1Password paperless item exists); the value is empty until the
      # SCAN_UPLOAD_TOKEN field is added, at which point Reloader restarts.
      secret:
        type: secret
        name: scanservjs-secret
        advancedMounts:
          scanservjs:
            app:
              - path: /secrets
                readOnly: true
