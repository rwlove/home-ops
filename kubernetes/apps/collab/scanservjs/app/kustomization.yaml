---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/repos/app-template
configMapGenerator:
  - name: scanservjs-config
    files:
      - config.local.js=./resources/config.local.js
      - airscan.conf=./resources/airscan.conf
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ./cnp-allow.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
