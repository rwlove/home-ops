; sane-airscan — pin the Brother MFC-J1170DW by IP.
;
; mDNS/DNS-SD discovery does not cross from the printer's VLAN to the
; cluster pod network, so auto-discovery is disabled and the eSCL
; endpoint is declared manually. The device reservation is stable
; (94:dd:f8:64:e5:0e -> 192.168.5.29); eSCL lives on :80 at /eSCL.
[devices]
"Brother MFC-J1170DW" = http://192.168.5.29/eSCL

[options]
discovery = disable
model-is-netname = disable
