---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      searxng:
        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/searxng/searxng
              tag: 2025.8.19-25647c2@sha256:81084f251c63f62b79ca15c25d29f7159812cfd06b6dc8ef720e007e6d4f8ad8
            env:
              SEARXNG_BASE_URL: https://search.${SECRET_DOMAIN}
              SEARXNG_URL: https://search.${SECRET_DOMAIN}
              SEARXNG_PORT: &httpPort 8080
            envFrom:
              - secretRef:
                  name: searxng-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /stats
                    port: *httpPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
            resources:
              requests:
                cpu: 15m
                memory: 384Mi
              limits:
                memory: 768Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - SETGID
                  - SETUID
                  - DAC_OVERRIDE
    service:
      app:
        controller: searxng
        ports:
          http:
            port: *httpPort
    route:
      app:
        annotations:
          glance/name: "Searxng"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/searxng.png"
          glance/id: "Collaboration"

        hostnames:
          - "search.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      config:
        type: configMap
        name: searxng-configmap
        advancedMounts:
          searxng:
            app:
              - path: /etc/searxng/settings.yml
                subPath: settings.yml
                readOnly: true
              - path: /etc/searxng/limiter.toml
                subPath: limiter.toml
                readOnly: true

      tmpfs:
        type: emptyDir
        enabled: true
        globalMounts:
          - path: /tmp
    externalSecrets:
      searxng:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: searxng-secret
          template:
            engineVersion: v2
            data:
              SEARXNG_SECRET: "{{ .SEARXNG_SECRET }}"
        dataFrom:
          - extract:
              key: searxng
    networkpolicies:
      allow:
        type: cilium
        forceRename: searxng-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: searxng
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # HTTPRoute on internal gateway (search.${SECRET_DOMAIN}) →
          # searxng:8080. In-cluster callers (open-webui via SEARXNG_QUERY_URL,
          # khoj via KHOJ_SEARXNG_URL, mcp-system/searxng-mcp) hit the
          # cluster Service directly; the same-ns and cross-ns paths are
          # listed below for grep-ability.
          - fromEndpoints:
              # External users via internal gateway
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
              # In-cluster callers (cross-ns; same-ns open-webui covered by
              # baseline allow-intra-namespace)
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: khoj
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  app.kubernetes.io/name: searxng-mcp
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        egress:
          # searxng's entire purpose is fan-out queries to every search
          # engine the operator has enabled in settings.yml (Google, Bing,
          # Wikipedia, GitHub, Stack Overflow, Reddit, … — dozens of
          # upstreams, each on different ports and FQDNs). Enumeration is
          # not maintainable; allow broad world HTTPS + HTTP egress (some
          # engines still 80→301).
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "80"
                    protocol: TCP
