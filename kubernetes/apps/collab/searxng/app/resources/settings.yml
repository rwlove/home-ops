---
use_default_settings: true

server:
  limiter: false
  image_proxy: true

# No redis: the limiter is off, so searxng needs no shared cache. The
# prior `redis:` stanza pointed at dragonfly db10 but searxng-allow never
# permitted egress to databases:6379, so it was unreachable dead config
# (0 live keys). Removed rather than wired up — fewer moving parts.

search:
  safe_search: 0
  autocomplete: brave
  formats:
    - html
    - json

general:
  instance_name: HansonSearch

ui:
  static_use_hash: true
  default_theme: simple
  theme_args:
    simple_style: dark
  infinite_scroll: true
  results_on_new_tab: true

enabled_plugins:
  - Basic Calculator
  - Hash plugin
  - Hostnames plugin
  - Open Access DOI rewrite
  - Self Informations
  - Tracker URL remover
  - Unit converter plugin

hostnames:
  high_priority:
    - (.*)\/blog\/(.*)
    - (.*\.)?wikipedia.org$
    - (.*\.)?github.com$
    - (.*\.)?reddit.com$
    - (.*\.)?linuxserver.io$
    - (.*\.)?docker.com$
    - (.*\.)?archlinux.org$
    - (.*\.)?stackoverflow.com$
    - (.*\.)?askubuntu.com$
    # replace:
    #   (www\.)?reddit\.com$: red.hsn.dev
    - (.*\.)?superuser.com$
