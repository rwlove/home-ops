---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/storageclass-storage-v1.json
#
# Per-app Longhorn StorageClass for Vikunja's /files mount (user-uploaded
# attachments/avatars). These are irreplaceable per the storage-class decision
# tree (rule 3) — the DB (postgres-vikunja, ceph-block + Barman) is the source
# of truth for task data, but it only has pointers to the files; the file
# bytes themselves have no other copy. Hence Longhorn (survives Ceph/cluster
# loss via the NFS backup target), not ceph-block.
#
# Dynamic provisioning (the PVC in longhorn-pvc.yaml carries no volumeName),
# so Longhorn creates a fresh volume on first bind — mirrors grocy-config /
# homebox-data. It auto-joins the `default` recurring-job group (daily
# snapshot + weekly + monthly backup to the NFS target), which is what rule 3
# asks for; a dynamically-created Volume CR has no labels to pre-seed the way
# a static PV's did (and PV labels never propagated to the Volume CR anyway —
# see storage-class.instructions.md). numberOfReplicas 2 → a single node loss
# is not data loss.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: vikunja-data
provisioner: driver.longhorn.io
reclaimPolicy: Retain
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "2880"
  fsType: xfs
  dataLocality: disabled
  unmapMarkSnapChainRemoved: ignored
