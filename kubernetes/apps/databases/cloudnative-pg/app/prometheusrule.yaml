---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: cloudnative-pg.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 10m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: Pod {{ $labels.pod  }} has been waiting for longer than 5 minutes
            summary: If a backend is waiting for longer than 5 minutes
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 10m
          labels:
            severity: warning
        - alert: PGDatabase
          annotations:
            description: Over 150,000,000 transactions from frozen xid on pod {{ $labels.pod  }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 150000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 300 seconds (5 minutes)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 10m
          labels:
            severity: warning
        # delta()[5m] false-fires on every CNPG pod restart: the gauge
        # resets then re-emits the persisted last-failed timestamp, which
        # reads as a positive delta even when the failure is weeks old
        # (same restart re-emission class as BackupFailed below). Gate on
        # the failure timestamp being genuinely recent (<1h) instead. The
        # metric is -1 when archiving has never failed, so the >0 guard
        # excludes that case.
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed recently for {{ $labels.pod }}
            summary: CNPG WAL archiving failed within the last hour.
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time > 0)
            and
            (time() - cnpg_pg_stat_archiver_last_failed_time < 3600)
          for: 5m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: More than 10 deadlocks in the last hour on {{ $labels.pod }} ({{ $labels.datname }})
            summary: Active deadlock rate is elevated
          expr: |-
            increase(cnpg_pg_stat_database_deadlocks[1h]) > 10
          for: 5m
          labels:
            severity: warning
        # WALArchivingStalled — catches a stopped/stuck archiver that the CR's
        # ContinuousArchiving condition cannot: that condition is a "has ever
        # worked" flag, set True on first success and never re-evaluated for
        # freshness (postgres-netbox has shown True since 2026-05-08 with no
        # bearing on current state).
        #
        # DELIBERATELY NOT time-since-last-archive. An idle database (no
        # writes) legitimately stops archiving forever: with nothing to flush,
        # Postgres never forces a WAL segment switch even with archive_timeout
        # set (confirmed on postgres-netbox: 0 writes since ~2026-06-23,
        # archive_timeout=300s, failed_count=0, pg_current_wal_lsn() sitting
        # exactly on a segment boundary — this is correct, healthy behaviour,
        # not staleness). A "last_archived_time older than N hours" alert
        # fires permanently on every quiet cluster and trains the pager to be
        # ignored. DO NOT convert this alert to that shape.
        #
        # Instead we watch cnpg_collector_pg_wal_archive_status{value="ready"}
        # — the count of WAL segments sitting in pg_wal/archive_status marked
        # .ready (produced, not yet archived). An idle cluster always reports
        # 0 here: there's nothing pending, so there's nothing to fall behind
        # on. A cluster whose archiver has genuinely stopped keeps producing
        # segments under any write load and the backlog grows monotonically.
        # max by (job, namespace) collapses per-pod series (each replica in
        # the Cluster reports its own value; only the primary actually
        # archives, but this is agnostic to which pod is currently primary,
        # including across a failover).
        #
        # Threshold and for: are set from a live 7d replay across all 22
        # clusters (2026-07-26): every cluster's ready-count sits at 0
        # almost always, with brief single-digit blips (max observed: 7,
        # on postgres-home-assistant, the highest-write-volume cluster in
        # the fleet) lasting on the order of one to a few 1-minute scrapes
        # while the archiver catches up under burst load. Threshold of 10
        # sits above that observed ceiling; for: 15m requires the backlog
        # to stay elevated across ~15 consecutive scrapes, which a transient
        # catch-up blip never does but a stopped archiver always will
        # (segments keep accumulating instead of draining).
        - alert: WALArchivingStalled
          annotations:
            description: Cluster {{ $labels.job }} in {{ $labels.namespace }} has 10+ WAL segments pending archival, sustained for 15+ minutes. This is a backlog under active write load, not an idle database (idle clusters report 0 pending). Check pg_stat_archiver and the archive command/plugin target.
            summary: CNPG WAL archiver has a growing unarchived backlog.
          expr: |-
            max by (job, namespace) (
              cnpg_collector_pg_wal_archive_status{value="ready"}
            ) >= 10
          for: 15m
          labels:
            severity: warning
        # BackupStale — no successful backup in too long, complementary to
        # BackupFailed (which catches recent explicit failures). Signal is
        # kube-state-metrics CRSM over Cluster.status.conditions: the metric
        # cnpg_cluster_condition_last_transition_time carries lastTransitionTime
        # (epoch seconds) labeled by condition type+status. We watch the
        # LastBackupSucceeded condition. cnpg_collector_last_available_backup_timestamp
        # is unreliable for plugin-method clusters — it freezes at the migration
        # timestamp instead of advancing per successful backup (verified 2026-05-25,
        # all 6 "stale" clusters were actually healthy). See #12075.
        #
        # No-data-on-failure edge case: CRSM emits one series per condition
        # reflecting its CURRENT status, so the {status="True"} series DISAPPEARS
        # the moment a backup is failing. A naive `time() - max(...{status="True"})`
        # would then go empty and silently miss a stuck-failing cluster. We instead
        # alert on staleness of the LastBackupSucceeded transition REGARDLESS of
        # status (drop the status label with max by), so a cluster stuck at
        # status="False" whose last success is >8d old still trips. Once a backup
        # succeeds again the transition time advances and the alert clears.
        #
        # Threshold is 8 days, not 26h: every cluster backs up @weekly (168h) via
        # the shared cnpg-app-database component's ScheduledBackup — no cluster is
        # on a daily cadence. A 26h threshold false-fires ~6 of every 7 days on a
        # healthy weekly cluster. 8d = one full week + 24h grace, so it only trips
        # on a genuinely missed cycle. Fast detection of a backup that RAN AND
        # FAILED is already covered by BackupFailed below (<24h on the failure
        # timestamp); BackupStale is the backstop for "nothing happened at all".
        - alert: BackupStale
          annotations:
            description: Cluster {{ $labels.cluster }} in {{ $labels.namespace }} has had no successful backup in over 8 days.
            summary: CNPG cluster backup is stale.
          expr: |-
            time() - max by (cluster, namespace) (
              cnpg_cluster_condition_last_transition_time{type="LastBackupSucceeded"}
            ) > 8 * 24 * 3600
          for: 30m
          labels:
            severity: warning
        # changes()[25h] false-fires when the gauge is re-emitted after a CNPG
        # pod restart, even when the last failure is weeks old (same gauge
        # re-emission problem documented for BackupStale above). Gate on the
        # failure timestamp being genuinely recent (<24h) instead.
        - alert: BackupFailed
          annotations:
            description: Cluster {{ $labels.job }} in {{ $labels.namespace }} has a recent backup failure.
            summary: CNPG cluster backup failed recently.
          expr: |-
            (cnpg_collector_last_failed_backup_timestamp > 0)
            and
            (time() - cnpg_collector_last_failed_backup_timestamp < 86400)
          for: 10m
          labels:
            severity: warning
