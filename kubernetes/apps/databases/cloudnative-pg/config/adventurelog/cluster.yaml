---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-adventurelog
spec:
  instances: 3

  # PostGIS-enabled CNPG operand image — AdventureLog is a GeoDjango app.
  # PG 18 MAJOR upgrade from 16 (one-way once the pg_upgrade job swaps
  # directories). Same distro (bookworm) and same PostGIS minor (3.7.0), so a
  # direct 16 -> 18 hop is allowed. Rollback BEFORE the swap / on job failure:
  # revert imageName + serverName. After success: restore the pre-upgrade
  # physical backup (old serverName archive) into a new PG16 cluster, or
  # pg_restore the off-cluster dump.
  imageName: ghcr.io/cloudnative-pg/postgis:18.7-3.7.0-standard-bookworm@sha256:b4e37c903a215a2b8d888f532ad20a16f0fb0cd359f08ffbe194f2e094653ed9

  primaryUpdateStrategy: unsupervised

  failoverDelay: 30

  replicationSlots:
    highAvailability:
      enabled: true

  postgresql:
    parameters:
      timezone: "America/New_York"

  storage:
    size: 8Gi
    storageClass: ceph-block

  walStorage:
    size: 8Gi
    storageClass: ceph-block

  resources:
    requests:
      cpu: 50m
      memory: 320Mi
    limits:
      memory: 1Gi

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg

  bootstrap:
    initdb:
      database: adventurelog
      owner: adventurelog
      # The app's migrations need PostGIS in the application DB, but the
      # non-superuser owner can't CREATE EXTENSION. Create it here as the
      # bootstrap superuser against the application database.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis;

  # CNPG generates the `postgres-adventurelog-app` Secret (username/password/
  # host/dbname) in this namespace. The AdventureLog HelmRelease consumes it
  # cross-namespace from `collab` via emberstack reflector — these annotations
  # propagate to the generated Secret through inheritedMetadata so a future
  # cluster rebuild re-establishes the mirror.
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: collab
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: collab

  # PodMonitor comes from the cnpg-app-database component; enablePodMonitor
  # is deprecated in CloudNativePG 1.30.
  monitoring:
    enablePodMonitor: false

  plugins:
    - enabled: true
      isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: garage-adventurelog
        # Bumped from postgres-adventurelog-backup for the 16->18 major
        # upgrade: pg_upgrade resets the timeline / system ID, so post-upgrade
        # WAL and base backups must land under a fresh serverName. The old
        # archive stays intact at postgres-adventurelog-backup as the
        # pre-upgrade restore point (PG16 data: restore it onto a PG16 image);
        # externalClusters below pointed (until its -v18 repoint) at it. A fresh base backup must
        # be taken into the new path right after.
        serverName: postgres-adventurelog-backup-v18

  externalClusters:
    # Repointed to the PG18 archive (-v18) after its first base backup landed.
    # The pre-upgrade archive (postgres-adventurelog-backup) is kept as-is; see
    # docs/src/cnpg_operations.md.
    - name: postgres-adventurelog-backup
      plugin:
        enabled: true
        isWALArchiver: false
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage-adventurelog
          serverName: postgres-adventurelog-backup-v18
