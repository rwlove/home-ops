---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-authelia
spec:
  instances: 3

  # PG 18 MAJOR upgrade (one-way once the pg_upgrade job swaps directories).
  # Rollback BEFORE the swap / on job failure: revert imageName + serverName.
  # After success: restore the pre-upgrade physical backup (old serverName
  # archive) into a new PG17 cluster, or pg_restore the off-cluster dump.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie

  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised

  # Guarantee the 3 instances never co-locate on one node. CNPG defaults to the
  # softer `preferred`, which lets the scheduler stack two replicas on one node
  # under pressure; `required` means a single node loss can take at most one of
  # the 3 replicas. Scoped to higher-value clusters (SSO is a cluster-wide SPOF).
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  failoverDelay: 30

  replicationSlots:
    highAvailability:
      enabled: true

  postgresql:
    parameters:
      timezone: "America/New_York"

  storage:
    size: 5Gi
    storageClass: ceph-block

  walStorage:
    size: 8Gi
    storageClass: ceph-block

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg

  # PodMonitor comes from the cnpg-app-database component; enablePodMonitor
  # is deprecated in CloudNativePG 1.30.
  monitoring:
    enablePodMonitor: false

  plugins:
    - enabled: true
      isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: garage-authelia
        # Bumped from postgres-authelia-backup for the 17->18 major upgrade:
        # pg_upgrade resets the timeline / system ID, so post-upgrade WAL and
        # base backups must land under a fresh serverName. The old archive stays
        # intact at postgres-authelia-backup as the pre-upgrade restore point (PG17
        # data: restore it onto a PG17 image); `source` below pointed (until its -v18 repoint) at
        # it. A fresh base backup must be taken into the new path right after.
        serverName: postgres-authelia-backup-v18

  externalClusters:
    - name: postgres-authelia-backup
      plugin:
        enabled: true
        isWALArchiver: false
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage-authelia
          serverName: postgres-authelia-backup-v18
