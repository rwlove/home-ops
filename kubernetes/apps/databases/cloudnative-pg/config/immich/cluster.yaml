---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-immich
spec:
  instances: 3

  # Hop 1 of the PG14 -> 18 program (minor + VectorChord bump on PG14):
  # 14.17-0.3.0 -> 14.24-1.1.1. After the rolling update run (not declarative),
  # with the app scaled down: ALTER EXTENSION vchord UPDATE; ALTER EXTENSION
  # vector UPDATE; REINDEX INDEX face_index; REINDEX INDEX clip_index (old
  # vchordrq indexes error "bad version number" until rebuilt). The legacy
  # pgvecto.rs `vectors` extension is dropped before this hop (zero dependents
  # re-checked after the pre-hop backup; not shipped for PG18). Hop 2 is the
  # 18.6-1.1.1 major upgrade.
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:14.24-1.1.1@sha256:86dec1dbc2bc72df7478ab58abf724e706ed04001bcc65adeaf728c88096441f

  primaryUpdateStrategy: unsupervised

  # Guarantee the 3 instances never co-locate on one node. CNPG defaults to the
  # softer `preferred`, which lets the scheduler stack two replicas on one node
  # under pressure; `required` means a single node loss can take at most one of
  # the 3 replicas. Scoped to higher-value clusters.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  failoverDelay: 30

  replicationSlots:
    highAvailability:
      enabled: true

  postgresql:
    shared_preload_libraries: ["vchord.so"]
    parameters:
      timezone: "America/New_York"
      max_slot_wal_keep_size: 10GB
      shared_buffers: 512MB

  storage:
    size: 50Gi
    storageClass: ceph-block

  walStorage:
    size: 16Gi
    storageClass: ceph-block

  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 2Gi

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg

  monitoring:
    enablePodMonitor: true

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: &params
        barmanObjectName: garage-immich
        serverName: postgres-immich-backup

  bootstrap:
    recovery:
      source: source

  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters: *params
