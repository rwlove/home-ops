---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-immich
spec:
  instances: 3

  # PG 18 MAJOR upgrade (one-way once the pg_upgrade job swaps directories),
  # hop 2 of the PG14 -> 18 program (hop 1 was 14.17-0.3.0 -> 14.24-1.1.1 plus
  # ALTER EXTENSION vchord/vector UPDATE and REINDEX of face_index and
  # clip_index; the legacy pgvecto.rs `vectors` extension was dropped first).
  # Same distro (bookworm) and same VectorChord (1.1.1). Rollback BEFORE the
  # swap / on job failure: revert imageName + serverName. After success:
  # restore the pre-upgrade physical backup (old serverName archive) into a new
  # PG14 cluster, or pg_restore the off-cluster dump.
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1@sha256:c7672bc011351a587cc292a94aac7eeebb593ed2e120077bd9c9944c9467db93

  primaryUpdateStrategy: unsupervised

  # Guarantee the 3 instances never co-locate on one node. CNPG defaults to the
  # softer `preferred`, which lets the scheduler stack two replicas on one node
  # under pressure; `required` means a single node loss can take at most one of
  # the 3 replicas. Scoped to higher-value clusters.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  failoverDelay: 30

  replicationSlots:
    highAvailability:
      enabled: true

  postgresql:
    shared_preload_libraries: ["vchord.so"]
    parameters:
      timezone: "America/New_York"
      max_slot_wal_keep_size: 10GB
      shared_buffers: 512MB

  storage:
    size: 50Gi
    storageClass: ceph-block

  walStorage:
    size: 16Gi
    storageClass: ceph-block

  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 2Gi

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg

  # PodMonitor comes from the cnpg-app-database component; enablePodMonitor
  # is deprecated in CloudNativePG 1.30.
  monitoring:
    enablePodMonitor: false

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage-immich
        # Bumped from postgres-immich-backup for the 14->18 major upgrade:
        # pg_upgrade resets the timeline / system ID, so post-upgrade WAL and
        # base backups must land under a fresh serverName. The old archive
        # stays intact at postgres-immich-backup as the pre-upgrade restore
        # point (PG14 data: restore it onto a PG14 vectorchord image;
        # 14.24-1.1.1 for WAL after hop 1). `externalClusters.source` below
        # keeps pointing at it (the YAML anchor was broken on purpose). A
        # fresh base backup must be taken into the new path right after.
        serverName: postgres-immich-backup-v18

  bootstrap:
    recovery:
      source: source

  externalClusters:
    # Repointed to the PG18 archive (-v18) after its first base backup landed.
    # The pre-upgrade archive (postgres-immich-backup) is kept as-is; see
    # docs/src/cnpg_operations.md.
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage-immich
          serverName: postgres-immich-backup-v18
