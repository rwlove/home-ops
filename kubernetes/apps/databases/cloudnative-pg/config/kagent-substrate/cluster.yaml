---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-kagent-substrate
spec:
  # Adopting into GitOps a cluster that was created imperatively (kubectl apply)
  # during the kagent 1.0 cutover (home-ops#15735). Every user-settable field
  # below matches the live cluster's kubectl.kubernetes.io/last-applied-configuration
  # exactly, so Flux's server-side apply claims no field another manager already
  # set to a conflicting value (the CNPG operator keeps defaulting everything not
  # listed here). The ONLY intentional additions are the mandatory Barman->Garage
  # DR backup (storage-class.instructions.md: no CNPG cluster without it) and the
  # PodMonitor; adding the barman-cloud plugin injects a sidecar, so CNPG does one
  # switchover-safe rolling update on first reconcile (brief client blip, no data
  # loss). superuserSecret is deliberately omitted — the consumer (kagent
  # controller, ns ai) connects as the `ate` app user via its own
  # kagent-postgres-owner/-readwrite ExternalSecrets, not the superuser.
  instances: 2

  # PG 18 MAJOR upgrade (one-way once the pg_upgrade job swaps directories).
  # Rollback BEFORE the swap / on job failure: revert imageName + serverName.
  # After success: restore the pre-upgrade physical backup (old serverName
  # archive) into a new PG17 cluster, or pg_restore the off-cluster dump.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie

  primaryUpdateStrategy: unsupervised

  storage:
    size: 10Gi
    storageClass: ceph-block

  walStorage:
    size: 8Gi
    storageClass: ceph-block

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

  enableSuperuserAccess: true

  bootstrap:
    initdb:
      database: ate
      owner: ate

  monitoring:
    enablePodMonitor: true

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage-kagent-substrate
        # Bumped from postgres-kagent-substrate-backup for the 17->18 major upgrade:
        # pg_upgrade resets the timeline / system ID, so post-upgrade WAL and
        # base backups must land under a fresh serverName. The old archive stays
        # intact at postgres-kagent-substrate-backup as the pre-upgrade restore point (PG17
        # data: restore it onto a PG17 image); `source` below pointed (until its -v18 repoint) at
        # it. A fresh base backup must be taken into the new path right after.
        serverName: postgres-kagent-substrate-backup-v18

  externalClusters:
    # Repointed to the PG18 archive (-v18) after its first base backup landed.
    # The PG17-era archives (postgres-kagent-substrate-backup[-v17]) are kept as-is; see
    # docs/src/cnpg_operations.md.
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage-kagent-substrate
          serverName: postgres-kagent-substrate-backup-v18
