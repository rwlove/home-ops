---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-khoj
spec:
  instances: 3

  # Khoj stores embeddings via pgvector. Reuse the same vectorchord image
  # langgraph-memory + immich use (mature in this cluster, ships pgvector).
  # Hop 1 of the PG14 -> 18 program (minor + VectorChord bump on PG14):
  # 14.17-0.3.0 -> 14.24-1.1.1. After the rolling update run (not
  # declarative): ALTER EXTENSION vector UPDATE. This DB has no vchord
  # extension (only the preloaded library) and no vchordrq index. Hop 2 is the
  # 18.6-1.1.1 major upgrade.
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:14.24-1.1.1@sha256:86dec1dbc2bc72df7478ab58abf724e706ed04001bcc65adeaf728c88096441f

  primaryUpdateStrategy: unsupervised

  failoverDelay: 30

  replicationSlots:
    highAvailability:
      enabled: true

  postgresql:
    shared_preload_libraries: ["vchord.so"]
    parameters:
      timezone: "America/New_York"

  storage:
    size: 10Gi
    storageClass: ceph-block

  walStorage:
    size: 8Gi
    storageClass: ceph-block

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg

  bootstrap:
    initdb:
      database: khoj
      owner: khoj
      postInitApplicationSQL:
        - "CREATE EXTENSION IF NOT EXISTS vector;"

  monitoring:
    enablePodMonitor: true

  plugins:
    - enabled: true
      isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: garage-khoj
        serverName: postgres-khoj-backup

  externalClusters:
    - name: postgres-khoj-backup
      plugin:
        enabled: true
        isWALArchiver: false
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage-khoj
          serverName: postgres-khoj-backup
