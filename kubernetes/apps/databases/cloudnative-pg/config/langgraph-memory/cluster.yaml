---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-langgraph-memory
spec:
  instances: 3

  # vectorchord = pgvector + vchord (HNSW + IVF + multi-vector). Same image
  # immich uses for its CLIP retrieval; mature in this cluster.
  # PG 18 MAJOR upgrade (one-way once the pg_upgrade job swaps directories),
  # hop 2 of the PG14 -> 18 program (hop 1 was 14.17-0.3.0 -> 14.24-1.1.1 plus
  # ALTER EXTENSION vchord/vector UPDATE and REINDEX). Same distro (bookworm)
  # and same VectorChord (1.1.1). Rollback BEFORE the swap / on job failure:
  # revert imageName + serverName. After success: restore the pre-upgrade
  # physical backup (old serverName archive) into a new PG14 cluster, or
  # pg_restore the off-cluster dump.
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1@sha256:c7672bc011351a587cc292a94aac7eeebb593ed2e120077bd9c9944c9467db93

  primaryUpdateStrategy: unsupervised

  failoverDelay: 30

  replicationSlots:
    highAvailability:
      enabled: true

  postgresql:
    shared_preload_libraries: ["vchord.so"]
    parameters:
      timezone: "America/New_York"

  storage:
    size: 10Gi
    storageClass: ceph-block

  walStorage:
    size: 4Gi
    storageClass: ceph-block

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg

  bootstrap:
    initdb:
      database: langgraph_memory
      owner: langgraph
      postInitApplicationSQL:
        - "CREATE EXTENSION IF NOT EXISTS vector;"
        - "CREATE EXTENSION IF NOT EXISTS vchord;"

  # CNPG generates `postgres-langgraph-memory-app` in this namespace.
  # Two consumers need it cross-namespace via emberstack reflector:
  # - ai/langgraph-agents — already consumes today (ad-hoc annotation
  #   on the live Secret; making it durable here).
  # - mcp-system/memory-mcp — Phase 0 of the memory-mcp deploy.
  # Pattern: project_cnpg_cross_namespace_reflector.
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "ai,mcp-system"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "ai,mcp-system"

  monitoring:
    enablePodMonitor: true

  plugins:
    - enabled: true
      isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: garage-langgraph-memory
        # Bumped from postgres-langgraph-memory-backup for the 14->18 major
        # upgrade: pg_upgrade resets the timeline / system ID, so post-upgrade
        # WAL and base backups must land under a fresh serverName. The old
        # archive stays intact at postgres-langgraph-memory-backup as the
        # pre-upgrade restore point (PG14 data: restore it onto a PG14 vectorchord image; 14.24-1.1.1 for WAL after hop 1);
        # externalClusters below pointed (until its -v18 repoint) at it. A fresh base backup must
        # be taken into the new path right after.
        serverName: postgres-langgraph-memory-backup-v18

  externalClusters:
    # Repointed to the PG18 archive (-v18) after its first base backup landed.
    # The pre-upgrade archive (postgres-langgraph-memory-backup) is kept as-is; see
    # docs/src/cnpg_operations.md.
    - name: postgres-langgraph-memory-backup
      plugin:
        enabled: true
        isWALArchiver: false
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage-langgraph-memory
          serverName: postgres-langgraph-memory-backup-v18
