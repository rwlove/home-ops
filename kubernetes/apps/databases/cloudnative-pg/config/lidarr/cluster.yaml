---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-lidarr
spec:
  instances: 3

  # PG 18 MAJOR upgrade (one-way once the pg_upgrade job swaps directories).
  # Rollback BEFORE the swap / on job failure: revert imageName + serverName.
  # After success: restore the pre-upgrade physical backup (old serverName
  # archive) into a new PG17 cluster, or pg_restore the off-cluster dump.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie

  primaryUpdateStrategy: unsupervised

  failoverDelay: 30

  replicationSlots:
    highAvailability:
      enabled: true

  postgresql:
    parameters:
      timezone: "America/New_York"
      max_slot_wal_keep_size: 10GB
      shared_buffers: 256MB
      # Out-of-Git DB state (documented 2026-08-13). The application database is
      # "lidarr-main" (the CNPG default "app" DB is empty/unused). Tables
      # "Tracks", "TrackFiles" and "AlbumReleases" in lidarr-main carry per-table
      # autovacuum reloptions applied directly via psql — CNPG has no declarative
      # field for per-table reloptions:
      #   ALTER TABLE "Tracks"        SET (autovacuum_analyze_scale_factor=0.02, autovacuum_analyze_threshold=500);
      #   ALTER TABLE "TrackFiles"    SET (autovacuum_analyze_scale_factor=0.02, autovacuum_analyze_threshold=200);
      #   ALTER TABLE "AlbumReleases" SET (autovacuum_analyze_scale_factor=0.02, autovacuum_analyze_threshold=100);
      # They keep planner stats fresh enough to avoid intermittent read timeouts
      # on the ArtistStatistics aggregate (a million-row three-way join). These
      # reloptions do NOT survive a bootstrap.recovery onto a fresh cluster —
      # reapply them after any restore.

  storage:
    size: 20Gi
    storageClass: ceph-block

  walStorage:
    size: 16Gi
    storageClass: ceph-block

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg

  # PodMonitor comes from the cnpg-app-database component; enablePodMonitor
  # is deprecated in CloudNativePG 1.30.
  monitoring:
    enablePodMonitor: false

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage-lidarr
        # Bumped from postgres-lidarr-backup for the 17->18 major upgrade:
        # pg_upgrade resets the timeline / system ID, so post-upgrade WAL and
        # base backups must land under a fresh serverName. The old archive stays
        # intact at postgres-lidarr-backup as the pre-upgrade restore point (PG17
        # data: restore it onto a PG17 image); `source` below pointed (until its -v18 repoint) at
        # it. A fresh base backup must be taken into the new path right after.
        serverName: postgres-lidarr-backup-v18

  # bootstrap:
  #   recovery:
  #     source: source

  externalClusters:
    # Repointed to the PG18 archive (-v18) after its first base backup landed.
    # The PG17-era archives (postgres-lidarr-backup[-v17]) are kept as-is; see
    # docs/src/cnpg_operations.md.
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage-lidarr
          serverName: postgres-lidarr-backup-v18
