---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-nametag
spec:
  instances: 3

  # History: 16 -> 17.7 via declarative offline in-place pg_upgrade --link
  # (#15806), then 17.11 -> 17.12-standard-trixie (distro hop).
  # Now: PG 18 MAJOR upgrade, same procedure (one-way once the pg_upgrade job swaps directories).
  # Rollback BEFORE the swap / on job failure: revert imageName + serverName.
  # After success: restore the pre-upgrade physical backup (the -v17 archive)
  # into a new PG17 cluster, or pg_restore the off-cluster dump.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie

  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised

  failoverDelay: 30

  replicationSlots:
    highAvailability:
      enabled: true

  postgresql:
    parameters:
      timezone: "America/New_York"

  storage:
    size: 10Gi
    storageClass: ceph-block

  walStorage:
    size: 8Gi
    storageClass: ceph-block

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg

  # PodMonitor comes from the cnpg-app-database component; enablePodMonitor
  # is deprecated in CloudNativePG 1.30.
  monitoring:
    enablePodMonitor: false

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage-nametag
        # Bumped from postgres-nametag-backup for the 16->17 major upgrade: a
        # major upgrade resets the PG timeline, so post-upgrade WAL/backups must
        # land under a fresh serverName or the new timeline-1 segments collide
        # with the pre-upgrade archive (CNPG major-upgrade docs). The old
        # archive stays intact at postgres-nametag-backup as the pre-upgrade
        # restore point; `source` below pointed (until its -v18 repoint) at it. A fresh base backup
        # must be taken into this new path immediately after the upgrade.
        #
        # Bumped again (-v17 -> -v18) for the 17->18 major upgrade, same reason
        # (timeline/system-ID reset). `source` below now points at -v17: the
        # PG17 archive is the pre-upgrade restore point (the old
        # postgres-nametag-backup archive is PG16 data from before the 16->17
        # upgrade). A fresh base backup must be taken into -v18 immediately
        # after the upgrade.
        serverName: postgres-nametag-backup-v18

  externalClusters:
    # Repointed to the PG18 archive (-v18) after its first base backup landed.
    # The PG17-era archives (postgres-nametag-backup[-v17]) are kept as-is; see
    # docs/src/cnpg_operations.md.
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage-nametag
          serverName: postgres-nametag-backup-v18
