---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-paperless
spec:
  instances: 3

  # PG 18 MAJOR upgrade (one-way once the pg_upgrade job swaps directories).
  # Rollback BEFORE the swap / on job failure: revert imageName + serverName.
  # After success: restore the pre-upgrade physical backup (old serverName
  # archive) into a new PG17 cluster, or pg_restore the off-cluster dump.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie

  primaryUpdateStrategy: unsupervised

  # Guarantee the 3 instances never co-locate on one node. CNPG defaults to the
  # softer `preferred`, which lets the scheduler stack two replicas on one node
  # under pressure; `required` means a single node loss can take at most one of
  # the 3 replicas. Scoped to higher-value clusters.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  failoverDelay: 30

  replicationSlots:
    highAvailability:
      enabled: true

  postgresql:
    parameters:
      timezone: "America/New_York"
      # Buffer WAL locally on the Primary
      wal_keep_size: "1GB"
      max_slot_wal_keep_size: "2GB"

  storage:
    size: 40Gi
    storageClass: ceph-block

  walStorage:
    size: 16Gi
    storageClass: ceph-block

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg

  monitoring:
    enablePodMonitor: true

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage-paperless
        # Bumped from postgres-paperless-backup for the 17->18 major upgrade:
        # pg_upgrade resets the timeline / system ID, so post-upgrade WAL and
        # base backups must land under a fresh serverName. The old archive stays
        # intact at postgres-paperless-backup as the pre-upgrade restore point (PG17
        # data: restore it onto a PG17 image); `source` below still points at
        # it. A fresh base backup must be taken into the new path right after.
        serverName: postgres-paperless-backup-v18

  bootstrap:
    recovery:
      source: source

  externalClusters:
    # Repointed to the PG18 archive (-v18) after its first base backup landed.
    # The PG17-era archives (postgres-paperless-backup[-v17]) are kept as-is; see
    # docs/src/cnpg_operations.md.
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage-paperless
          serverName: postgres-paperless-backup-v18
