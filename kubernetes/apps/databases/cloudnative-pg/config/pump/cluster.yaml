---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-pump
spec:
  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:17.11

  primaryUpdateStrategy: unsupervised

  postgresql:
    parameters:
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
      timezone: "America/New_York"
      max_slot_wal_keep_size: 10GB
      shared_buffers: 512MB
      # Record per-transaction commit timestamps so row commit times are
      # recoverable via pg_xact_commit_timestamp()/xmin. postmaster-context
      # param: CNPG applies it with a rolling restart + one primary switchover.
      track_commit_timestamp: "on"

  storage:
    size: 10Gi
    storageClass: ceph-block

  walStorage:
    size: 16Gi
    storageClass: ceph-block

  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 2Gi

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg

  # Declarative login role for laptop Arnold's read-all / write-plan MCP
  # (pump-mcp-arnold). CNPG manages ONLY the role + password; the GRANTs are not
  # CNPG-managed — see ./grants-arnold.sql (applied once as superuser, re-run
  # if the cluster is ever rebuilt). `health_ro` is intentionally NOT declared
  # here (hand-created, see collab/health/app/resources/db-setup.sql).
  managed:
    roles:
      - name: arnold
        ensure: present
        comment: laptop Arnold - SELECT all PUMP tables, write prescription layer only
        login: true
        inherit: true
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        connectionLimit: 5
        passwordSecret:
          name: postgres-pump-arnold

  monitoring:
    enablePodMonitor: true

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: &params
        barmanObjectName: garage-pump
        serverName: postgres-pump-backup

  # bootstrap:
  #   recovery:
  #     source: source

  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters: *params
