---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-pump
spec:
  instances: 3

  # PG 18 MAJOR upgrade (one-way once the pg_upgrade job swaps directories).
  # Rollback BEFORE the swap / on job failure: revert imageName + serverName.
  # After success: restore the pre-upgrade physical backup (old serverName
  # archive) into a new PG17 cluster, or pg_restore the off-cluster dump.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie

  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised

  postgresql:
    parameters:
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
      timezone: "America/New_York"
      max_slot_wal_keep_size: 10GB
      shared_buffers: 512MB
      # Record per-transaction commit timestamps so row commit times are
      # recoverable via pg_xact_commit_timestamp()/xmin. postmaster-context
      # param: CNPG applies it with a rolling restart + one primary switchover.
      track_commit_timestamp: "on"

  storage:
    size: 10Gi
    storageClass: ceph-block

  walStorage:
    size: 16Gi
    storageClass: ceph-block

  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 2Gi

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg

  # Declarative login role for laptop Arnold's read-all / write-plan MCP
  # (pump-mcp-arnold). CNPG manages ONLY the role + password; the GRANTs are not
  # CNPG-managed — see ./grants-arnold.sql (applied once as superuser, re-run
  # if the cluster is ever rebuilt). `health_ro` is intentionally NOT declared
  # here (hand-created, see collab/health/app/resources/db-setup.sql).
  managed:
    roles:
      - name: arnold
        ensure: present
        comment: laptop Arnold - SELECT all PUMP tables, write prescription layer only
        login: true
        inherit: true
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        connectionLimit: 5
        passwordSecret:
          name: postgres-pump-arnold

  # PodMonitor comes from the cnpg-app-database component; enablePodMonitor
  # is deprecated in CloudNativePG 1.30.
  monitoring:
    enablePodMonitor: false
    # The stock cnpg-default-monitoring queries are kept in the list alongside
    # the PUMP weigh-in query so the default exporter metrics are unaffected.
    customQueriesConfigMap:
      - name: cnpg-default-monitoring
        key: queries
      - name: postgres-pump-monitoring
        key: queries

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage-pump
        # Bumped from postgres-pump-backup for the 17->18 major upgrade:
        # pg_upgrade resets the timeline / system ID, so post-upgrade WAL and
        # base backups must land under a fresh serverName. The old archive stays
        # intact at postgres-pump-backup as the pre-upgrade restore point (PG17
        # data: restore it onto a PG17 image); `source` below pointed (until its -v18 repoint) at
        # it. A fresh base backup must be taken into the new path right after.
        serverName: postgres-pump-backup-v18

  # Bootstrap is already done; this block is inert for the running cluster
  # EXCEPT that the instance manager runs every default (non target_databases)
  # monitoring query against bootstrap.initdb.database. Left unset, CNPG
  # defaults it to "app", which does not exist on this cluster (the real
  # database is "pump"), so cnpg_backends_total, cnpg_pg_replication_lag,
  # cnpg_pg_database_size_bytes, cnpg_pg_postmaster_start_time and
  # cnpg_pg_settings_setting were never exported. Only `database` is set:
  # the existing postgres-pump-app Secret is not regenerated by this change
  # (CNPG only patches its metadata), and nothing consumes it.
  bootstrap:
    initdb:
      database: pump
  #   recovery:
  #     source: source

  externalClusters:
    # Repointed to the PG18 archive (-v18) after its first base backup landed.
    # The PG17-era archives (postgres-pump-backup[-v17]) are kept as-is; see
    # docs/src/cnpg_operations.md.
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage-pump
          serverName: postgres-pump-backup-v18
