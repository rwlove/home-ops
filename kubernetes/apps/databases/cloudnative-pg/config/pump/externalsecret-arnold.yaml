---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-pump-arnold
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: postgres-pump-arnold
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # CNPG re-applies the managed role's password when this Secret changes.
          cnpg.io/reload: "true"
      data:
        username: arnold
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: pump-arnold-db
