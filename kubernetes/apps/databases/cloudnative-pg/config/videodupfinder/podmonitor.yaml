---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/podmonitor_v1.json
# Replaces the operator-generated PodMonitor: spec.monitoring.enablePodMonitor
# is deprecated in CloudNativePG 1.30. Same selector and port as the generated
# one. The name differs, so the scrape job label becomes
# databases/postgres-videodupfinder-metrics (only WALArchivingStalled uses job,
# as a grouping label). Canary for the fleet-wide move into the
# cnpg-app-database component.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres-videodupfinder-metrics
  labels:
    cnpg.io/cluster: postgres-videodupfinder
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres-videodupfinder
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
