---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-vikunja
spec:
  instances: 3

  # PG 18 MAJOR upgrade (one-way once the pg_upgrade job swaps directories).
  # Rollback BEFORE the swap / on job failure: revert imageName + serverName.
  # After success: restore the pre-upgrade physical backup (old serverName
  # archive) into a new PG17 cluster, or pg_restore the off-cluster dump.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie

  primaryUpdateStrategy: unsupervised

  failoverDelay: 30

  replicationSlots:
    highAvailability:
      enabled: true

  postgresql:
    parameters:
      timezone: "America/New_York"

  storage:
    size: 10Gi
    storageClass: ceph-block

  walStorage:
    size: 8Gi
    storageClass: ceph-block

  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1Gi

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg

  bootstrap:
    initdb:
      database: vikunja
      owner: vikunja

  # CNPG generates the `postgres-vikunja-app` Secret (username/password/
  # host/dbname) in this namespace. The Vikunja HelmRelease consumes it
  # cross-namespace from `collab` via emberstack reflector — these
  # annotations propagate to the generated Secret through inheritedMetadata
  # so a future cluster rebuild re-establishes the mirror. Pattern:
  # project_cnpg_cross_namespace_reflector (same as postgres-monica).
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: collab
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: collab

  monitoring:
    enablePodMonitor: true

  plugins:
    - enabled: true
      isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: garage-vikunja
        # Bumped from postgres-vikunja-backup for the 17->18 major upgrade:
        # pg_upgrade resets the timeline / system ID, so post-upgrade WAL and
        # base backups must land under a fresh serverName. The old archive stays
        # intact at postgres-vikunja-backup as the pre-upgrade restore point (PG17
        # data: restore it onto a PG17 image); `source` below pointed (until its -v18 repoint) at
        # it. A fresh base backup must be taken into the new path right after.
        serverName: postgres-vikunja-backup-v18

  externalClusters:
    - name: postgres-vikunja-backup
      plugin:
        enabled: true
        isWALArchiver: false
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage-vikunja
          serverName: postgres-vikunja-backup-v18
