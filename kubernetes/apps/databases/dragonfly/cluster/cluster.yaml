---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
spec:
  labels:
    dragonflydb.io/cluster: dragonfly
  image: ghcr.io/dragonflydb/dragonfly:v2.1.0@sha256:94891bb22ce2fb0f7a5a3ff1bb3b2fbbc5830e2523293e47723d87fa3e5b1184
  replicas: 3
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 1Gi
  # --maxmemory governs Dragonfly's data budget; RSS sits on top of it
  # (threads, network buffers, snapshot/replication). Keep it strictly
  # below cgroup limits.memory or background activity OOM-kills the pod.
  args:
    - "--maxmemory=768Mi"
    - "--proactor_threads=2"
    - "--cluster_mode=emulated"
    - "--default_lua_flags=allow-undeclared-keys"

  # Scope the spread selector to THIS instance's own replicas (`app:
  # dragonfly`), not the operator's shared `app.kubernetes.io/part-of:
  # dragonfly` — that label is stamped identically on every Dragonfly
  # instance (dragonfly, -auth, -cache, -immich), so selecting on it
  # pools all instances under one constraint. The descheduler's
  # RemovePodsViolatingTopologySpreadConstraint plugin then evicts the
  # single-replica -immich/-cache pods every ~5 min whenever they share a
  # node with these replicas. Same shared-label class as the CNP trap in
  # #13733, different key. See reference_descheduler_evicts_dragonfly_singletons.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: "DoNotSchedule"
      labelSelector:
        matchLabels:
          app: dragonfly
