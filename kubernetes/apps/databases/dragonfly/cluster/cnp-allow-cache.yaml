---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dragonfly-cache-allow
spec:
  # The dragonfly-operator stamps app.kubernetes.io/name=dragonfly on EVERY
  # instance and puts the instance name in `app` (mirrors the Service
  # selector). Selecting on app.kubernetes.io/name=dragonfly-cache matched
  # zero pods, so this policy was a no-op and renovate's cross-namespace
  # connections were default-denied (silent drop → 5s timeout → every
  # renovate run failed since the split landed, #13733).
  endpointSelector:
    matchLabels:
      app: dragonfly-cache
  # Additive — default-deny is what triggers the lockdown; these rules
  # punch holes through it.
  enableDefaultDeny:
    egress: false
    ingress: false
  ingress:
    # Consumer of `dragonfly-cache.databases.svc.cluster.local:6379`:
    #   renovate/renovate-operator — repository cache. Namespace-scoped
    #   (renovate ns is single-purpose): the ephemeral renovate JOB pods
    #   carry no app/app.kubernetes.io label — only
    #   renovate-operator.mogenius.com/* + a batch job-name — so a per-app
    #   selector can't match them. Confirmed via RENOVATE_REDIS_URL (idle in
    #   the Hubble window). Admin port 6380 stays default-denied.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: renovate
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
