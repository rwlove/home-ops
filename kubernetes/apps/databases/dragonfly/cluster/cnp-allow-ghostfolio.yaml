---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dragonfly-ghostfolio-allow
spec:
  # Select on `app: <instance>` — see cnp-allow-auth.yaml for the label
  # trap this avoids (#13733).
  endpointSelector:
    matchLabels:
      app: dragonfly-ghostfolio
  # Additive — default-deny is what triggers the lockdown; these rules
  # punch holes through it.
  enableDefaultDeny:
    egress: false
    ingress: false
  ingress:
    # Consumer of `dragonfly-ghostfolio.databases.svc.cluster.local:6379`:
    #   selfhosted/ghostfolio — Bull market-data queue + quote/session cache.
    #   Hubble-verified 2026-10-02. selfhosted ns hosts other apps, so scope
    #   to ghostfolio specifically. Admin port 6380 stays default-denied.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: selfhosted
            app.kubernetes.io/name: ghostfolio
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
