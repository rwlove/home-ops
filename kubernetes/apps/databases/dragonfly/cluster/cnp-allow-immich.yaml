---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dragonfly-immich-allow
spec:
  # Select on `app: <instance>` — see cnp-allow-auth.yaml for the label
  # trap this avoids (#13733).
  endpointSelector:
    matchLabels:
      app: dragonfly-immich
  # Additive — default-deny is what triggers the lockdown; these rules
  # punch holes through it.
  enableDefaultDeny:
    egress: false
    ingress: false
  ingress:
    # Consumer of `dragonfly-immich.databases.svc.cluster.local:6379`:
    #   media/immich — BullMQ task queue (db1). Scoped to the core immich
    #   stack via app.kubernetes.io/instance=immich (server + ML +
    #   microservices share `instance`; `name` differs per component).
    #   Hubble-verified 2026-10-02 (only immich-server active). Admin port
    #   6380 stays default-denied (only 6379 is allowed here).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: media
            app.kubernetes.io/instance: immich
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
