---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dragonfly-romm-allow
spec:
  # Select on `app: <instance>` — see cnp-allow-auth.yaml for the label
  # trap this avoids (#13733).
  endpointSelector:
    matchLabels:
      app: dragonfly-romm
  # Additive — default-deny is what triggers the lockdown; these rules
  # punch holes through it.
  enableDefaultDeny:
    egress: false
    ingress: false
  ingress:
    # Consumer of `dragonfly-romm.databases.svc.cluster.local:6379`:
    #   media/romm — python-rq task queue + LaunchBox metadata cache.
    #   Hubble-verified 2026-10-02. media ns also hosts immich, so scope
    #   to romm specifically. Admin port 6380 stays default-denied.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: romm
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
