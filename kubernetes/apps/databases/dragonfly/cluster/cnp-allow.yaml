---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dragonfly-allow
spec:
  # Select on `app: dragonfly` (the shared instance), NOT
  # app.kubernetes.io/name=dragonfly — the operator stamps that shared
  # label on EVERY instance, so this policy previously over-matched all 6
  # and made the per-instance CNPs moot. `app` carries the instance name
  # (#13733 label trap — see cnp-allow-auth.yaml).
  endpointSelector:
    matchLabels:
      app: dragonfly
  # Additive — default-deny is what triggers the lockdown; these rules
  # punch holes through it.
  enableDefaultDeny:
    egress: false
    ingress: false
  ingress:
    # Durable tier (small queues + caches, noeviction). Hubble-verified
    # consumers (2026-10-02) of `dragonfly.databases.svc:6379`:
    #   home/netbox      db3 task queue / db4 django cache
    #   collab/paperless db7 celery broker
    #   collab/nametag   db6 session / cache
    # (romm moved to the dedicated dragonfly-romm instance — the old
    # comment listing it here was stale; the heavy immich BullMQ tenant
    # and the auth SPOF were split to dragonfly-immich / dragonfly-auth;
    # renovate is on dragonfly-cache.)
    # Tightened from fromEntities:cluster now that hubble confirms the
    # edge (the follow-up the prior comment called for). Admin port 6380
    # stays default-denied.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: home
            app.kubernetes.io/name: netbox
        - matchLabels:
            io.kubernetes.pod.namespace: collab
            app.kubernetes.io/name: paperless
        - matchLabels:
            io.kubernetes.pod.namespace: collab
            app.kubernetes.io/name: nametag
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
  # Peer dragonfly replication (intra-ns 3-replica StatefulSet) covered
  # by baseline allow-intra-namespace. Dragonfly-operator probes covered
  # by allow-intra-namespace. Egress only goes to apiserver (baseline)
  # and DNS (baseline).
