---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jdownloader2
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m

  # disableWait — the gluetun sidecar must finish its WireGuard handshake
  # (startupProbe) before the app starts, which can outlast helm-controller's
  # 5-min default wait. Without this, the timed-out upgrade is marked
  # Failed and helm-controller rolls back; the rollback ALSO waits for
  # Ready and ALSO times out, leaving the release stuck and silently
  # reverting the spec that was just applied (without the configMap fix
  # this app needs). Recovery: suspend the HR, delete the failed/pending
  # sh.helm.release.v1.* secrets, resume.
  install:
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    disableWait: true
    remediation:
      retries: -1

  values:
    controllers:
      jdownloader2:
        pod:
          # All DNS goes to gluetun's DoT resolver on the shared pod loopback,
          # i.e. through the tunnel. This app needs no cluster DNS names.
          dnsConfig:
            nameservers:
              - 127.0.0.1
          dnsPolicy: None
          # Opt out of the pod-gateway admission webhook (gatewayDefault:
          # true for the namespace); gluetun below owns this pod's egress.
          # Drop once the namespace loses its routed-gateway label.
          labels:
            setGateway: "false"
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1001
            # runAsNonRoot: true
            # runAsUser: 100
        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        initContainers:
          # Native sidecar (restartPolicy: Always): starts before the app,
          # gates it on a healthy tunnel via startupProbe, and stays up for
          # the pod's lifetime. gluetun's firewall is the primary
          # kill-switch; the CNP below (egress default-deny, world UDP/51820
          # only) is the second.
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            # A sidecar restart keeps the pod netns, so policy rules from the
            # previous run survive and gluetun fails with "file exists".
            # Clear them before exec (gluetun-wiki setup/advanced/kubernetes).
            command:
              - /bin/sh
              - -c
              - |
                while ip rule del table 51820 2>/dev/null; do :; done
                while ip -6 rule del table 51820 2>/dev/null; do :; done
                exec /gluetun-entrypoint
            env:
              # Inbound on eth0 is dropped unless listed: the web UI port
              # (envoy route + kubelet probes).
              FIREWALL_INPUT_PORTS: "5800"
              # Pod + service CIDRs and the LAN stay off-tunnel so replies to
              # envoy and kubelet route via eth0. Does not overlap Mullvad's
              # 10.64.0.0/10 tunnel range.
              FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/16,10.43.0.0/16,192.168.0.0/16
              # The default malicious-host block list is downloaded and built
              # in memory at start and every DNS_UPDATE_PERIOD (24h, which also
              # restarts the DNS server). That spike OOM-killed a sidecar at
              # its limit; it adds nothing to leak protection, so it's off.
              BLOCK_MALICIOUS: "off"
              DNS_UPDATE_PERIOD: "0"
              VPN_INTERFACE: wg0
              # SERVER_HOSTNAMES comes from this app's own 1P field (see
              # externalsecret.yaml) — a relay distinct from every other pod
              # sharing the Mullvad key.
            envFrom:
              - secretRef:
                  name: jdownloader2-vpn
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /gluetun-entrypoint
                      - healthcheck
                  failureThreshold: 30
                  periodSeconds: 5
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /gluetun-entrypoint
                      - healthcheck
                  failureThreshold: 6
                  periodSeconds: 30
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            restartPolicy: Always
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
        containers:
          app:
            image:
              repository: ghcr.io/jlesage/jdownloader-2
              tag: v26.09.1@sha256:bd6cd2fdc72818f30207e677b33cd7f1b425048c4e7132624e541e99f992be4c

            env:
              # jlesage's baseimage handles user creation/drop via these env vars.
              # Container starts as root, init scripts create user 1107:1001
              # and run jdownloader as that user.
              USER_ID: "1107"
              GROUP_ID: "1001"

            resources:
              requests:
                cpu: 100m
                memory: 768Mi
              # limit is sized for the NFS write-back page-cache balloon,
              # not the app RSS (~619Mi working set). The /output volume is
              # direct NFS; its dirty page cache is unreclaimable under the
              # cgroup limit and counts toward usage_bytes (peaked 997Mi at
              # the old 1G ceiling → OOM exit 137), while working_set hides
              # it. Same failure mode as the nzb downloader — give it +2Gi
              # headroom. See reference_nzb_downloader_incomplete_nfs_pagecache_oom.
              limits:
                memory: 3G

    service:
      app:
        controller: jdownloader2
        ports:
          http:
            port: &httpPort 5800

    route:
      app:
        annotations:
          glance/name: "JDownloader"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/jdownloader2.png"
          glance/id: "Downloads"
        hostnames:
          - "downloader.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - kind: Service
                name: jdownloader2
                port: 5800
    persistence:
      config:
        existingClaim: jdownloader-config-pvc
        globalMounts:
          - path: /config

      downloads:
        existingClaim: jdownloader-downloads-pvc
        globalMounts:
          - path: /output

      # The image's /etc/cont-init.d/10-init-users.sh runs `rm -f /etc/passwd
      # /etc/group /etc/shadow` to reset them before recreation. With runAsGroup
      # 1001 (which doesn't exist in the image), CRI-O auto-mounts /etc/group
      # and /etc/passwd from /containers/storage/.../userdata/, making them
      # mount points that rm can't delete (EBUSY). The script aborts via set -e.
      # Override with a copy that uses `: > FILE` (truncate) instead of rm+touch.
      # Chart v4.6.2 doesn't accept `type: configMap`; use custom + volumeSpec.
      init-users-fix:
        type: custom
        volumeSpec:
          configMap:
            name: jdownloader2-init-users-fix
            defaultMode: 0755
        advancedMounts:
          jdownloader2:
            app:
              - path: /etc/cont-init.d/10-init-users.sh
                subPath: 10-init-users.sh
    networkpolicies:
      allow:
        type: cilium
        forceRename: jdownloader2-allow
        # Explicit endpointSelector preserves the pre-inline selector
        # (app.kubernetes.io/name) instead of the chart's controller-derived
        # default, keeping the policy byte-identical across the migration.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: jdownloader2
        # Ingress stays additive (namespace default-deny comes in a later
        # phase). Egress is deny-by-default for this endpoint: the only
        # allowed egress is the WireGuard handshake, so a gluetun firewall
        # failure cannot leak cleartext.
        enableDefaultDeny:
          egress: true
          ingress: false
        ingress:
          # Internal gateway (envoy) → jdownloader2:5800. Auth is enforced at the
          # gateway by the extAuth SecurityPolicy (#12767); the oauth2-proxy
          # hop is retired.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "5800"
                    protocol: TCP
        # The namespace baseline allow-dns lets every pod reach CoreDNS, which
        # resolves outside the tunnel. This pod resolves via gluetun DoT on
        # 127.0.0.1 and needs no cluster DNS, so deny CoreDNS outright (deny
        # beats any allow) — no plaintext lookup can leave off-tunnel.
        egressDeny:
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: kube-system
                  k8s-app: kube-dns
        egress:
          # WireGuard handshake + tunnel to the Mullvad relay. Every other
          # external flow (DNS via gluetun DoT, hoster HTTPS) is inside this
          # tunnel. Replaces the pod-gateway VXLAN/4789 + ICMP allows.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "51820"
                    protocol: UDP
