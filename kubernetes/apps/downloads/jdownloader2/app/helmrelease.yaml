---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jdownloader2
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m

  # disableWait — pod-gateway-routed pods need the gateway-init VPN
  # handshake before the app starts, which can outlast helm-controller's
  # 5-min default wait. Without this, the timed-out upgrade is marked
  # Failed and helm-controller rolls back; the rollback ALSO waits for
  # Ready and ALSO times out, leaving the release stuck and silently
  # reverting the spec that was just applied (without the configMap fix
  # this app needs). Recovery: suspend the HR, delete the failed/pending
  # sh.helm.release.v1.* secrets, resume.
  install:
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    disableWait: true
    remediation:
      retries: -1

  values:
    controllers:
      jdownloader2:
        pod:
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1001
            # runAsNonRoot: true
            # runAsUser: 100
        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/jlesage/jdownloader-2
              tag: v26.09.1@sha256:bd6cd2fdc72818f30207e677b33cd7f1b425048c4e7132624e541e99f992be4c

            env:
              # jlesage's baseimage handles user creation/drop via these env vars.
              # Container starts as root, init scripts create user 1107:1001
              # and run jdownloader as that user.
              USER_ID: "1107"
              GROUP_ID: "1001"

            resources:
              requests:
                cpu: 100m
                memory: 768Mi
              # limit is sized for the NFS write-back page-cache balloon,
              # not the app RSS (~619Mi working set). The /output volume is
              # direct NFS; its dirty page cache is unreclaimable under the
              # cgroup limit and counts toward usage_bytes (peaked 997Mi at
              # the old 1G ceiling → OOM exit 137), while working_set hides
              # it. Same failure mode as the nzb downloader — give it +2Gi
              # headroom. See reference_nzb_downloader_incomplete_nfs_pagecache_oom.
              limits:
                memory: 3G

    service:
      app:
        controller: jdownloader2
        ports:
          http:
            port: &httpPort 5800

    route:
      app:
        annotations:
          glance/name: "JDownloader"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/jdownloader2.png"
          glance/id: "Downloads"
        hostnames:
          - "downloader.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - kind: Service
                name: jdownloader2
                port: 5800
    persistence:
      config:
        existingClaim: jdownloader-config-pvc
        globalMounts:
          - path: /config

      downloads:
        existingClaim: jdownloader-downloads-pvc
        globalMounts:
          - path: /output

      # The image's /etc/cont-init.d/10-init-users.sh runs `rm -f /etc/passwd
      # /etc/group /etc/shadow` to reset them before recreation. With runAsGroup
      # 1001 (which doesn't exist in the image), CRI-O auto-mounts /etc/group
      # and /etc/passwd from /containers/storage/.../userdata/, making them
      # mount points that rm can't delete (EBUSY). The script aborts via set -e.
      # Override with a copy that uses `: > FILE` (truncate) instead of rm+touch.
      # Chart v4.6.2 doesn't accept `type: configMap`; use custom + volumeSpec.
      init-users-fix:
        type: custom
        volumeSpec:
          configMap:
            name: jdownloader2-init-users-fix
            defaultMode: 0755
        advancedMounts:
          jdownloader2:
            app:
              - path: /etc/cont-init.d/10-init-users.sh
                subPath: 10-init-users.sh
    networkpolicies:
      allow:
        type: cilium
        forceRename: jdownloader2-allow
        # Explicit endpointSelector preserves the pre-inline selector
        # (app.kubernetes.io/name) instead of the chart's controller-derived
        # default, keeping the policy byte-identical across the migration.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: jdownloader2
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal gateway (envoy) → jdownloader2:5800. Auth is enforced at the
          # gateway by the extAuth SecurityPolicy (#12767); the oauth2-proxy
          # hop is retired.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "5800"
                    protocol: TCP
        egress:
          # VPN egress. The pod-gateway webhook injected `setGateway=true`
          # routing into this pod's iptables, so ALL non-cluster traffic
          # exits via the VXLAN tunnel (UDP/4789) to the gateway pod, which
          # in turn forwards via WireGuard. From Cilium's perspective the
          # only egress packet is the encapsulated VXLAN UDP/4789 to the
          # gateway pod's endpoint identity. DNS (172.16.1.1) and ALL
          # external connectivity (hoster HTTPS, etc.) are tunneled inside
          # this single VXLAN flow.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: vpn
                  app.kubernetes.io/instance: downloads-gateway
                  app.kubernetes.io/name: pod-gateway
                  app.kubernetes.io/controller: main
            toPorts:
              - ports:
                  - port: "4789"
                    protocol: UDP
          # workaround: https://github.com/angelnu/helm-charts/issues/414 — drop this ICMP-echo allow when pod-gateway liveness mechanic changes or pod-gateway is replaced
          # Tracking: home-ops#11829
          # The gateway-sidecar init container (angelnu/pod-gateway
          # client_init.sh v7+) runs an ICMP liveness check against the
          # gateway pod IP before declaring the tunnel up. Without this,
          # init fails → CrashLoopBackOff under default-deny.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: vpn
                  app.kubernetes.io/instance: downloads-gateway
                  app.kubernetes.io/name: pod-gateway
                  app.kubernetes.io/controller: main
            icmps:
              - fields:
                  - type: 8  # echo request
                    family: IPv4
