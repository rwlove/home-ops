---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: downloads
components:
  - ../../components/network-policy/baseline
  # default-deny re-enabled 2026-11-21 (#11829): pod-gateway's
  # DHCP-over-VXLAN, which broke under default-deny, is gone. Every app
  # egresses via its own gluetun sidecar with a per-app CNP (egress
  # default-deny, relay /32 only). Pre-flight ingress audit: every
  # cross-ns caller's egress rule (internal gateway, the media managers,
  # the Soulseek orchestrator, the media-stack MCP backend) has a
  # matching per-app ingress allow; scrape, probes and
  # intra-ns are covered by baseline.
  - ../../components/network-policy/default-deny
resources:
  - ./namespace.yaml
  - ./jdownloader2/ks.yaml
  - ./prowlarr/ks.yaml
  - ./qbittorrent/ks.yaml
  - ./sabnzbd/ks.yaml
  - ./slskd/ks.yaml
