---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: downloads
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    goldilocks.fairwinds.com/enabled: "true"
    routed-gateway: "true"
    # PSS ramp (audit+warn now, enforce per phase): baseline (see docs/src/pod_security_audit.md).
    # pod-gateway-sidecar in every *arr pod runs as UID 0 with NET_ADMIN
    # (audit doc C2). restricted would fire on every pod; baseline is
    # the realistic ceiling here.
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: latest
