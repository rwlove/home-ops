---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app prowlarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m

  # disableWait — pod-gateway-routed pods need the gateway-init VPN
  # handshake before the app starts, which can outlast helm-controller's
  # 5-min default wait. Without this, the timed-out upgrade is marked
  # Failed and helm-controller rolls back; the rollback ALSO waits for
  # Ready and ALSO times out, leaving the release stuck and silently
  # reverting the spec that was just applied. Recovery: suspend the HR,
  # delete the failed/pending sh.helm.release.v1.* secrets, resume.
  install:
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    disableWait: true
    remediation:
      retries: -1

  values:
    controllers:
      prowlarr:
        pod:
          securityContext:
            fsGroup: 1104
            fsGroupChangePolicy: "OnRootMismatch"

            runAsGroup: 1104
            runAsUser: 1104
        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/prowlarr
              tag: rolling@sha256:6152751c3ea2e7751564f5952173d5e83eed0e09f3fabd2cb6bdb58690c39e2f

            env:
              PROWLARR__INSTANCE_NAME: Prowlarr
              PROWLARR__LOG__DBENABLED: "False"
              PROWLARR__LOG_LEVEL: info
              PROWLARR__SERVER__PORT: &port 9696

            envFrom:
              - secretRef:
                  name: *app

            resources:
              requests:
                cpu: 15m
                memory: 300M
              limits:
                memory: 300M

    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          glance/name: "Prowlarr"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/prowlarr.png"
          glance/id: "Downloads"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - kind: Service
                name: prowlarr
                port: 9696

    persistence:
      config:
        existingClaim: prowlarr-config-pvc
    externalSecrets:
      prowlarr:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: prowlarr
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              PROWLARR__API_KEY: "{{ .PROWLARR__API_KEY }}"
              PROWLARR__POSTGRES__HOST: postgres-prowlarr-rw.databases.svc.cluster.local
              PROWLARR__POSTGRES__PORT: "5432"
              PROWLARR__POSTGRES__USER: "{{ .POSTGRES_USER }}"
              PROWLARR__POSTGRES__PASSWORD: "{{ .POSTGRES_PASS }}"
              PROWLARR__POSTGRES__MAINDB: prowlarr-main
              # Garage S3 creds for the cnpg-app-database backup ObjectStore
              # (consumed by prowlarr-secret in databases namespace, kept here too
              # so a single 1P item drives both)
              GARAGE_AWS_ACCESS_KEY_ID: "{{ .GARAGE_AWS_ACCESS_KEY_ID }}"
              GARAGE_AWS_SECRET_ACCESS_KEY: "{{ .GARAGE_AWS_SECRET_ACCESS_KEY }}"
        dataFrom:
          - extract:
              key: prowlarr
    networkpolicies:
      allow:
        type: cilium
        forceRename: prowlarr-allow
        # Explicit endpointSelector preserves the pre-inline selector
        # (app.kubernetes.io/name) instead of the chart's controller-derived
        # default, keeping the policy byte-identical across the migration.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: prowlarr
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal gateway (envoy) → prowlarr:9696. Auth is enforced at the
          # gateway by the extAuth SecurityPolicy (#12767); the oauth2-proxy
          # hop is retired.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "9696"
                    protocol: TCP
          # Cross-ns *arr callers hitting the prowlarr indexer API directly
          # (NOT via oauth2-proxy — internal service URL).
          #   media/sonarr   — http://prowlarr.downloads.svc.cluster.local:9696
          #   media/radarr   — http://prowlarr.downloads.svc.cluster.local:9696
          #   media/lidarr   — http://prowlarr.downloads.svc.cluster.local:9696
          #   mcp-system/arr-mcp — PROWLARR_URL env (see arr-mcp/cnp-allow.yaml)
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: sonarr
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: radarr
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: lidarr
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  app.kubernetes.io/name: arr-mcp
            toPorts:
              - ports:
                  - port: "9696"
                    protocol: TCP
        egress:
          # VPN egress. The pod-gateway webhook injected `setGateway=true`
          # routing, so ALL non-cluster traffic (indexer probes, FlareSolverr
          # if configured to point outside the cluster, etc.) exits via the
          # VXLAN tunnel (UDP/4789) to the gateway pod. From Cilium's
          # perspective the only egress packet is encapsulated VXLAN UDP/4789.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: vpn
                  app.kubernetes.io/instance: downloads-gateway
                  app.kubernetes.io/name: pod-gateway
                  app.kubernetes.io/controller: main
            toPorts:
              - ports:
                  - port: "4789"
                    protocol: UDP
          # workaround: https://github.com/angelnu/helm-charts/issues/414 — drop this ICMP-echo allow when pod-gateway liveness mechanic changes or pod-gateway is replaced
          # Tracking: home-ops#11829
          # The gateway-sidecar init container (angelnu/pod-gateway
          # client_init.sh v7+) runs an ICMP liveness check against the
          # gateway pod IP before declaring the tunnel up. Without this,
          # init fails → CrashLoopBackOff under default-deny.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: vpn
                  app.kubernetes.io/instance: downloads-gateway
                  app.kubernetes.io/name: pod-gateway
                  app.kubernetes.io/controller: main
            icmps:
              - fields:
                  - type: 8  # echo request
                    family: IPv4
          # Cross-ns: FlareSolverr in media ns proxies Cloudflare-protected
          # indexer fetches for prowlarr. Same-cluster Service call:
          # http://flaresolverr.media.svc.cluster.local:8191
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: flaresolverr
            toPorts:
              - ports:
                  - port: "8191"
                    protocol: TCP
          # Cross-ns: *arr API push-backs. Prowlarr sync-app feature pushes
          # indexer config to each *arr instance over its API.
          #   media/sonarr:8989
          #   media/radarr:7878
          #   media/lidarr:8686
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: sonarr
            toPorts:
              - ports:
                  - port: "8989"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: radarr
            toPorts:
              - ports:
                  - port: "7878"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: lidarr
            toPorts:
              - ports:
                  - port: "8686"
                    protocol: TCP
