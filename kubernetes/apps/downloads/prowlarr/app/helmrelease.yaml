---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app prowlarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m

  # disableWait — the gluetun sidecar must finish its WireGuard handshake
  # (startupProbe) before the app starts, which can outlast helm-controller's
  # 5-min default wait. Without this, the timed-out upgrade is marked
  # Failed and helm-controller rolls back; the rollback ALSO waits for
  # Ready and ALSO times out, leaving the release stuck and silently
  # reverting the spec that was just applied. Recovery: suspend the HR,
  # delete the failed/pending sh.helm.release.v1.* secrets, resume.
  install:
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    disableWait: true
    remediation:
      retries: -1

  values:
    controllers:
      prowlarr:
        pod:
          # All DNS goes to gluetun's DoT resolver on the shared pod loopback,
          # i.e. through the tunnel, so no lookup (indexer sites included)
          # can resolve off-tunnel. The few in-cluster names this app uses are
          # pinned below instead of resolved via CoreDNS (which is denied).
          dnsConfig:
            nameservers:
              - 127.0.0.1
          dnsPolicy: None
          # Exact hostnames as configured in the app (DB env + app-sync +
          # download-client settings). ClusterIPs are stable for a Service's
          # lifetime; if one is ever recreated, that connection fails closed
          # (visible in the app's health page) until the IP here is updated:
          #   kubectl get svc -n <ns> <name> -o jsonpath='{.spec.clusterIP}'
          hostAliases:
            - ip: 10.43.176.163  # databases/postgres-prowlarr-rw
              hostnames:
                - postgres-prowlarr-rw.databases.svc.cluster.local
            - ip: 10.43.172.207  # media/lidarr
              hostnames:
                - lidarr.media
            - ip: 10.43.78.194  # media/radarr
              hostnames:
                - radarr.media
            - ip: 10.43.243.63  # media/sonarr
              hostnames:
                - sonarr.media
            - ip: 10.43.213.60  # downloads/qbittorrent
              hostnames:
                - qbittorrent
          # Opt out of the pod-gateway admission webhook (gatewayDefault:
          # true for the namespace); gluetun owns this pod's egress.
          # Drop once the namespace loses its routed-gateway label.
          labels:
            setGateway: "false"
          securityContext:
            fsGroup: 1104
            fsGroupChangePolicy: "OnRootMismatch"

            runAsGroup: 1104
            runAsUser: 1104
        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        initContainers:
          # Native sidecar (restartPolicy: Always): starts before the app,
          # gates it on a healthy tunnel via startupProbe, and stays up for
          # the pod's lifetime. gluetun's firewall is the primary
          # kill-switch; the CNP below (egress default-deny, world UDP/51820
          # only, CoreDNS denied) is the second.
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            # A sidecar restart keeps the pod netns, so policy rules from the
            # previous run survive and gluetun fails with "file exists".
            # Clear them before exec (gluetun-wiki setup/advanced/kubernetes).
            command:
              - /bin/sh
              - -c
              - |
                while ip rule del table 51820 2>/dev/null; do :; done
                while ip -6 rule del table 51820 2>/dev/null; do :; done
                exec /gluetun-entrypoint
            env:
              # Inbound on eth0 is dropped unless listed: the web UI/API port
              # (envoy route, in-cluster callers, metrics scrape, probes).
              FIREWALL_INPUT_PORTS: "9696"
              # Pod + service CIDRs and the LAN stay off-tunnel so replies to
              # envoy and kubelet route via eth0. Does not overlap Mullvad's
              # 10.64.0.0/10 tunnel range.
              FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/16,10.43.0.0/16,192.168.0.0/16
              # The default malicious-host block list is downloaded and built
              # in memory at start and every DNS_UPDATE_PERIOD (24h, which also
              # restarts the DNS server). That spike OOM-killed a sidecar at
              # its limit; it adds nothing to leak protection, so it's off.
              BLOCK_MALICIOUS: "off"
              DNS_UPDATE_PERIOD: "0"
              # gluetun's Go heap spikes transiently at start (server-data
              # build) and OOM-killed a sidecar at a 256Mi limit despite a
              # ~110Mi steady state. GOMEMLIMIT makes the GC work before the
              # cgroup ceiling; keep it ~75% of limits.memory below.
              GOMEMLIMIT: 384MiB
              VPN_INTERFACE: wg0
              # SERVER_HOSTNAMES comes from this app's own 1P field (see
              # externalsecret.yaml) — a relay distinct from every other pod
              # sharing the Mullvad key, and present in gluetun's baked list.
            envFrom:
              - secretRef:
                  name: prowlarr-vpn
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /gluetun-entrypoint
                      - healthcheck
                  failureThreshold: 30
                  periodSeconds: 5
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /gluetun-entrypoint
                      - healthcheck
                  failureThreshold: 6
                  periodSeconds: 30
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            restartPolicy: Always
            # gluetun must run as root to manage routes/iptables; overrides the
            # pod-level non-root default for this container only.
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
              runAsGroup: 0
              runAsNonRoot: false
              runAsUser: 0
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/prowlarr
              tag: rolling@sha256:58fa5dbed20738ce0a72077315e818eeb731cb4b4a5173c4a837d343a9573750

            env:
              # UI auth is delegated to Authelia extAuth at the gateway
              # (securitypolicy.yaml, #12780). External disables Prowlarr's
              # own login so a rolling-image change to the "local address"
              # bypass can't re-enable the native Forms prompt. Internal API
              # callers use the API key and are unaffected.
              PROWLARR__AUTH__METHOD: External
              PROWLARR__INSTANCE_NAME: Prowlarr
              PROWLARR__LOG__DBENABLED: "False"
              PROWLARR__LOG_LEVEL: info
              PROWLARR__SERVER__PORT: &port 9696

            envFrom:
              - secretRef:
                  name: *app

            resources:
              requests:
                cpu: 15m
                memory: 300M
              limits:
                memory: 300M

    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          glance/name: "Prowlarr"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/prowlarr.png"
          glance/id: "Downloads"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - kind: Service
                name: prowlarr
                port: 9696

    persistence:
      config:
        existingClaim: prowlarr-config-ext4-pvc
    externalSecrets:
      prowlarr:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: prowlarr
          template:
            data:
              PROWLARR__API_KEY: "{{ .PROWLARR__API_KEY }}"
              PROWLARR__POSTGRES__HOST: postgres-prowlarr-rw.databases.svc.cluster.local
              PROWLARR__POSTGRES__PORT: "5432"
              PROWLARR__POSTGRES__USER: "{{ .POSTGRES_USER }}"
              PROWLARR__POSTGRES__PASSWORD: "{{ .POSTGRES_PASS }}"
              PROWLARR__POSTGRES__MAINDB: prowlarr-main
              # Garage S3 creds for the cnpg-app-database backup ObjectStore
              # (consumed by prowlarr-secret in databases namespace, kept here too
              # so a single 1P item drives both)
              GARAGE_AWS_ACCESS_KEY_ID: "{{ .GARAGE_AWS_ACCESS_KEY_ID }}"
              GARAGE_AWS_SECRET_ACCESS_KEY: "{{ .GARAGE_AWS_SECRET_ACCESS_KEY }}"
        dataFrom:
          - extract:
              key: prowlarr
    networkpolicies:
      allow:
        type: cilium
        forceRename: prowlarr-allow
        # Explicit endpointSelector preserves the pre-inline selector
        # (app.kubernetes.io/name) instead of the chart's controller-derived
        # default, keeping the policy byte-identical across the migration.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: prowlarr
        # Ingress stays additive (namespace default-deny comes in a later
        # phase). Egress is deny-by-default for this endpoint: only the
        # WireGuard handshake leaves the cluster, plus the in-cluster
        # dependencies listed below.
        enableDefaultDeny:
          egress: true
          ingress: false
        ingress:
          # Internal gateway (envoy) → prowlarr:9696. Auth is enforced at the
          # gateway by the extAuth SecurityPolicy (#12767); the oauth2-proxy
          # hop is retired.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "9696"
                    protocol: TCP
          # Cross-ns *arr callers hitting the prowlarr indexer API directly
          # (NOT via oauth2-proxy — internal service URL).
          #   media/sonarr   — http://prowlarr.downloads.svc.cluster.local:9696
          #   media/radarr   — http://prowlarr.downloads.svc.cluster.local:9696
          #   media/lidarr   — http://prowlarr.downloads.svc.cluster.local:9696
          #   mcp-system/arr-mcp — PROWLARR_URL env (see arr-mcp/cnp-allow.yaml)
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: sonarr
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: radarr
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: lidarr
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  app.kubernetes.io/name: arr-mcp
            toPorts:
              - ports:
                  - port: "9696"
                    protocol: TCP
        # The namespace baseline allow-dns lets every pod reach CoreDNS, which
        # resolves outside the tunnel. This pod resolves via gluetun DoT on
        # 127.0.0.1 and pins its cluster names via hostAliases, so deny
        # CoreDNS outright (deny beats any allow).
        egressDeny:
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: kube-system
                  k8s-app: kube-dns
        egress:
          # WireGuard handshake + tunnel to the Mullvad relay. Every indexer
          # fetch is inside this tunnel. Replaces the pod-gateway
          # VXLAN/4789 + ICMP allows.
          #
          # Deliberately NO FlareSolverr allow: it runs in the media ns
          # outside the VPN, so any indexer routed through it would fetch
          # from the home IP. Zero indexers use it today; leaving it
          # unreachable makes that fail closed instead of leaking.
          # Pinned to THIS app's relay entry IP (us-nyc-wg-606), not any world
          # host: while gluetun restarts, Cilium is the only egress gate, and
          # "any host on UDP/51820" would let cleartext UDP reach a stranger
          # listening on that port. Entry IPs are per-server and stable;
          # a relay failover is now: pick relay -> set its ipv4_addr_in here
          # (api.mullvad.net/www/relays/wireguard/) -> edit the 1P field.
          # A mismatch fails closed (no tunnel) and fires the outage alert.
          - toCIDR:
              - 146.70.168.194/32
            toPorts:
              - ports:
                  - port: "51820"
                    protocol: UDP
          # Own CNPG database (primary).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  cnpg.io/cluster: postgres-prowlarr
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
          # App-sync push to each *arr API. The torrent download client in
          # this namespace is covered by the baseline allow-intra-namespace.
          #   media/sonarr:8989
          #   media/radarr:7878
          #   media/lidarr:8686
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: sonarr
            toPorts:
              - ports:
                  - port: "8989"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: radarr
            toPorts:
              - ports:
                  - port: "7878"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: lidarr
            toPorts:
              - ports:
                  - port: "8686"
                    protocol: TCP
