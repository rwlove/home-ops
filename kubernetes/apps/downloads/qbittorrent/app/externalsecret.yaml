---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-vpn
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: qbittorrent-vpn
    template:
      data:
        VPN_SERVICE_PROVIDER: "{{ .SERVICE_PROVIDER }}"
        VPN_TYPE: "{{ .TYPE }}"
        # Shared Mullvad key (one device slot for every pod), so each pod
        # MUST pin a relay no other pod uses. Deliberately no SERVER_CITIES
        # fallback: a missing field fails the sync and the pod stays down
        # rather than landing on a relay another pod already holds.
        SERVER_HOSTNAMES: "{{ .QBITTORRENT_SERVER_HOSTNAMES }}"
        WIREGUARD_ADDRESSES: "{{ .WIREGUARD_ADDRESSES }}"
        WIREGUARD_PRIVATE_KEY: "{{ .WIREGUARD_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: vpn
