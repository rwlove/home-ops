---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      qbittorrent:
        pod:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values: ["sabnzbd"]
                  topologyKey: kubernetes.io/hostname
          # All DNS goes to gluetun's DoT resolver on the shared pod loopback,
          # i.e. through the tunnel. This app needs no cluster DNS names.
          dnsConfig:
            nameservers:
              - 127.0.0.1
          dnsPolicy: None
          # Opt out of the pod-gateway admission webhook (gatewayDefault:
          # true for the namespace); gluetun owns this pod's egress.
          # Drop once the namespace loses its routed-gateway label.
          labels:
            setGateway: "false"
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1105

        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        initContainers:
          # Pin the BitTorrent session to gluetun's tunnel interface on every
          # start (third leak guard: with wg0 down the session has nothing to
          # use). Declarative rather than a one-off API write, so a WebUI change
          # cannot silently re-bind it to eth0. Empty address = all wg0 addrs.
          bind-wg0:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.3.0@sha256:5a858e61f94cf2712391db32ed03556576c700858f3e62c4c6fcde262443ebd8
            command:
              - /bin/sh
              - -c
              - |
                conf=/config/qBittorrent/qBittorrent.conf
                [ -f "$$conf" ] || exit 0
                sed -i \
                  -e 's/^Session\\Interface=.*/Session\\Interface=wg0/' \
                  -e 's/^Session\\InterfaceName=.*/Session\\InterfaceName=wg0/' \
                  -e 's/^Session\\InterfaceAddress=.*/Session\\InterfaceAddress=/' \
                  "$$conf"
                grep '^Session\\Interface' "$$conf"
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
          # Native sidecar (restartPolicy: Always): starts before the app,
          # gates it on a healthy tunnel via startupProbe, and stays up for
          # the pod's lifetime. gluetun's firewall is the primary
          # kill-switch; the CNP below (egress default-deny, world UDP/51820
          # only, CoreDNS denied) is the second.
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            # A sidecar restart keeps the pod netns, so policy rules from the
            # previous run survive and gluetun fails with "file exists".
            # Clear them before exec (gluetun-wiki setup/advanced/kubernetes).
            command:
              - /bin/sh
              - -c
              - |
                while ip rule del table 51820 2>/dev/null; do :; done
                while ip -6 rule del table 51820 2>/dev/null; do :; done
                exec /gluetun-entrypoint
            env:
              # Inbound on eth0 is dropped unless listed: the web UI/API port
              # (envoy route, in-cluster callers, metrics scrape, probes).
              FIREWALL_INPUT_PORTS: "8080"
              # Pod + service CIDRs and the LAN stay off-tunnel so replies to
              # envoy and kubelet route via eth0. Does not overlap Mullvad's
              # 10.64.0.0/10 tunnel range.
              FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/16,10.43.0.0/16,192.168.0.0/16
              # The default malicious-host block list is downloaded and built
              # in memory at start and every DNS_UPDATE_PERIOD (24h, which also
              # restarts the DNS server). That spike OOM-killed a sidecar at
              # its limit; it adds nothing to leak protection, so it's off.
              BLOCK_MALICIOUS: "off"
              DNS_UPDATE_PERIOD: "0"
              # gluetun's Go heap spikes transiently at start (server-data
              # build) and OOM-killed a sidecar at a 256Mi limit despite a
              # ~110Mi steady state. GOMEMLIMIT makes the GC work before the
              # cgroup ceiling; keep it ~75% of limits.memory below.
              GOMEMLIMIT: 384MiB
              VPN_INTERFACE: wg0
              # SERVER_HOSTNAMES comes from this app's own 1P field (see
              # externalsecret.yaml) — a relay distinct from every other pod
              # sharing the Mullvad key, and present in gluetun's baked list.
            envFrom:
              - secretRef:
                  name: qbittorrent-vpn
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /gluetun-entrypoint
                      - healthcheck
                  failureThreshold: 30
                  periodSeconds: 5
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /gluetun-entrypoint
                      - healthcheck
                  failureThreshold: 6
                  periodSeconds: 30
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            restartPolicy: Always
            # gluetun must run as root to manage routes/iptables; overrides the
            # pod-level non-root default for this container only.
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
              runAsGroup: 0
              runAsNonRoot: false
              runAsUser: 0
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.3.0@sha256:5a858e61f94cf2712391db32ed03556576c700858f3e62c4c6fcde262443ebd8

            env:
              # WebUI settings (alternative UI, auth subnet whitelist,
              # localhost auth bypass) live in the qBittorrent.conf file in
              # the PVC — this image's entrypoint doesn't translate
              # QBT_Preferences__WebUI__* env vars at runtime. Manage them
              # via the WebUI or POST /api/v2/app/setPreferences.
              # Network interface binding is NOT env-driven (this image's
              # entrypoint doesn't translate QBT_BitTorrent__* vars): it lives
              # in qBittorrent.conf, set via the WebUI/API to wg0 (gluetun's
              # tunnel) with an empty interface address — a third leak guard:
              # with the tunnel down, the session has no interface to use.
              # Listen port only: Mullvad dropped port forwarding in 2023, so
              # nothing reaches it from outside.
              QBT_TORRENTING_PORT: ${WIREGUARD_FORWARD_PORT:-24589}
              QBT_WEBUI_PORT: &httpPort 8080

            # In-place resize (k8s 1.35 GA): a live memory/CPU bump applies
            # without restarting the container. libtorrent 2.x relies on the OS
            # page cache for disk IO; disabling it (O_DIRECT) crippled write
            # throughput on the NFS download paths, so OS cache is re-enabled in
            # the WebUI. Disk IO type stays POSIX (not mmap): POSIX buffered
            # pages are reclaimable and dirty-page writeback self-throttles, so
            # the cache stays bounded rather than the unbounded whole-file mmap
            # balloon that caused the original OOM. With cache on, page cache
            # fills memory.current to the ceiling while working set stays ~110
            # MiB (the cache is invisible to working-set metrics). 6Gi gives that
            # reclaimable cache + recheck spikes ("Outstanding memory when
            # checking" = 32 MiB x concurrent) headroom off the wall, still well
            # under the ~9 GiB the mmap balloon hit. Request stays 1Gi — the
            # cache is reclaimable, not a reservation. Watching memory.current.
            resizePolicy:
              - resourceName: cpu
                restartPolicy: NotRequired
              - resourceName: memory
                restartPolicy: NotRequired

            resources:
              requests:
                cpu: 35m
                memory: 1Gi
              limits:
                memory: 6Gi

            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        forceRename: "{{ .Release.Name }}"
        ports:
          http:
            port: *httpPort
        primary: true

    route:
      app:
        annotations:
          glance/name: "QBittorrent"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/qbittorrent.png"
          glance/id: "Downloads"
        hostnames:
          - "bt.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - kind: Service
                name: qbittorrent
                port: 8080

    persistence:
      config:
        existingClaim: qbittorrent-config-pvc

      downloads:
        existingClaim: qbittorrent-downloads

      incomplete:
        existingClaim: qbittorrent-incomplete

      media:
        existingClaim: qbittorrent-media
    networkpolicies:
      allow:
        type: cilium
        forceRename: qbittorrent-allow
        # Explicit endpointSelector preserves the pre-inline selector
        # (app.kubernetes.io/name) instead of the chart's controller-derived
        # default, keeping the policy byte-identical across the migration.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: qbittorrent
        # Ingress stays additive (namespace default-deny comes in a later
        # phase). Egress is deny-by-default for this endpoint: the only
        # allowed egress is the WireGuard handshake, so a gluetun firewall
        # failure cannot leak cleartext.
        enableDefaultDeny:
          egress: true
          ingress: false
        ingress:
          # Internal gateway (envoy) → qbittorrent:8080. Auth is enforced at the
          # gateway by the extAuth SecurityPolicy (#12767); the oauth2-proxy
          # hop is retired.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          # Cross-ns *arr download-client callers. Each *arr posts torrents +
          # polls download status against the qbittorrent WebUI API.
          #   media/sonarr / radarr / lidarr → qbittorrent.downloads:8080
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: sonarr
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: radarr
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: lidarr
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        # The namespace baseline allow-dns lets every pod reach CoreDNS, which
        # resolves outside the tunnel. This pod resolves via gluetun DoT on
        # 127.0.0.1 and needs no cluster DNS, so deny CoreDNS outright (deny
        # beats any allow) — no plaintext lookup can leave off-tunnel.
        egressDeny:
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: kube-system
                  k8s-app: kube-dns
        egress:
          # WireGuard handshake + tunnel to the Mullvad relay. Every other
          # external flow is inside this tunnel. Replaces the pod-gateway
          # VXLAN/4789 + ICMP allows.
          # Pinned to THIS app's relay entry IP (us-nyc-wg-605), not any world
          # host: while gluetun restarts, Cilium is the only egress gate, and
          # "any host on UDP/51820" would let cleartext UDP reach a stranger
          # listening on that port. Entry IPs are per-server and stable;
          # a relay failover is now: pick relay -> set its ipv4_addr_in here
          # (api.mullvad.net/www/relays/wireguard/) -> edit the 1P field.
          # A mismatch fails closed (no tunnel) and fires the outage alert.
          - toCIDR:
              - 146.70.171.130/32
            toPorts:
              - ports:
                  - port: "51820"
                    protocol: UDP
