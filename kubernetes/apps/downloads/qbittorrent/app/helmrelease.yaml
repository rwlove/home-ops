---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      qbittorrent:
        pod:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values: ["sabnzbd"]
                  topologyKey: kubernetes.io/hostname

          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1105

        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.3@sha256:4fcf15b7f265c2c8d7bc2a7e13240a07e0593c326f3cf3b5b9bb69eec5b79299

            env:
              QBT_BitTorrent__Session__Interface: vxlan0
              QBT_BitTorrent__Session__InterfaceAddress:
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              QBT_BitTorrent__Session__InterfaceName: vxlan0
              # WebUI settings (alternative UI, auth subnet whitelist,
              # localhost auth bypass) live in the qBittorrent.conf file in
              # the PVC — this image's entrypoint doesn't translate
              # QBT_Preferences__WebUI__* env vars at runtime. Manage them
              # via the WebUI or POST /api/v2/app/setPreferences.
              # Mullvad's WireGuard port-forward, sourced from the 1P 'vpn'
              # item via the qbittorrent-secret (Flux postBuild substitution).
              # downloads-gateway reads the same field — both must agree, so
              # source from one place.
              QBT_TORRENTING_PORT: ${WIREGUARD_FORWARD_PORT:-24589}
              QBT_WEBUI_PORT: &httpPort 8080

            # In-place resize (k8s 1.35 GA): a live memory/CPU bump applies
            # without restarting the container. libtorrent 2.x relies on the OS
            # page cache for disk IO; disabling it (O_DIRECT) crippled write
            # throughput on the NFS download paths, so OS cache is re-enabled in
            # the WebUI. Disk IO type stays POSIX (not mmap): POSIX buffered
            # pages are reclaimable and dirty-page writeback self-throttles, so
            # the cache stays bounded rather than the unbounded whole-file mmap
            # balloon that caused the original OOM. With cache on, page cache
            # fills memory.current to the ceiling while working set stays ~110
            # MiB (the cache is invisible to working-set metrics). 6Gi gives that
            # reclaimable cache + recheck spikes ("Outstanding memory when
            # checking" = 32 MiB x concurrent) headroom off the wall, still well
            # under the ~9 GiB the mmap balloon hit. Request stays 1Gi — the
            # cache is reclaimable, not a reservation. Watching memory.current.
            resizePolicy:
              - resourceName: cpu
                restartPolicy: NotRequired
              - resourceName: memory
                restartPolicy: NotRequired

            resources:
              requests:
                cpu: 35m
                memory: 1Gi
              limits:
                memory: 6Gi

            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        forceRename: "{{ .Release.Name }}"
        ports:
          http:
            port: *httpPort
        primary: true

      bittorrent:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.45.0.14 # SVC_QBITTORRENT_ADDR
        externalTrafficPolicy: Local
        ports:
          bittorrent:
            port: ${WIREGUARD_FORWARD_PORT:-24589}
            protocol: TCP
    route:
      app:
        annotations:
          glance/name: "QBittorrent"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/qbittorrent.png"
          glance/id: "Downloads"
        hostnames:
          - "bt.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - kind: Service
                name: qbittorrent
                port: 8080

    persistence:
      config:
        existingClaim: qbittorrent-config-pvc

      downloads:
        existingClaim: qbittorrent-downloads

      incomplete:
        existingClaim: qbittorrent-incomplete

      media:
        existingClaim: qbittorrent-media
    networkpolicies:
      allow:
        type: cilium
        forceRename: qbittorrent-allow
        # Explicit endpointSelector preserves the pre-inline selector
        # (app.kubernetes.io/name) instead of the chart's controller-derived
        # default, keeping the policy byte-identical across the migration.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: qbittorrent
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal gateway (envoy) → qbittorrent:8080. Auth is enforced at the
          # gateway by the extAuth SecurityPolicy (#12767); the oauth2-proxy
          # hop is retired.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          # Cross-ns *arr download-client callers. Each *arr posts torrents +
          # polls download status against the qbittorrent WebUI API.
          #   media/sonarr / radarr / lidarr → qbittorrent.downloads:8080
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: sonarr
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: radarr
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: lidarr
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        egress:
          # VPN egress. ALL torrent traffic (peer connections, tracker
          # announces, DHT) routes through the VXLAN tunnel to the gateway
          # pod, then out via WireGuard. The Mullvad port-forward delivers
          # inbound BT peer connections through the same WireGuard tunnel,
          # which arrives at vxlan0 on this pod (so it's the same flow's
          # return path — no separate ingress rule needed).
          #
          # The qbittorrent-bittorrent LoadBalancer Service (10.45.0.14:24589)
          # exists in the chart for legacy reasons but has no endpoints
          # because the pod listens on vxlan0, not eth0 (verified
          # 2026-05-17). External BT ingress flows via VPN, NOT via LB.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: vpn
                  app.kubernetes.io/instance: downloads-gateway
                  app.kubernetes.io/name: pod-gateway
                  app.kubernetes.io/controller: main
            toPorts:
              - ports:
                  - port: "4789"
                    protocol: UDP
          # workaround: https://github.com/angelnu/helm-charts/issues/414 — drop this ICMP-echo allow when pod-gateway liveness mechanic changes or pod-gateway is replaced
          # Tracking: home-ops#11829
          # The gateway-sidecar init container (angelnu/pod-gateway
          # client_init.sh v7+) runs an ICMP liveness check against the
          # gateway pod IP before declaring the tunnel up. Without this,
          # init fails → CrashLoopBackOff under default-deny.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: vpn
                  app.kubernetes.io/instance: downloads-gateway
                  app.kubernetes.io/name: pod-gateway
                  app.kubernetes.io/controller: main
            icmps:
              - fields:
                  - type: 8  # echo request
                    family: IPv4
