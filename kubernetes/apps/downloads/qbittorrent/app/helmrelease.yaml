---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      qbittorrent:
        pod:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values: ["sabnzbd"]
                  topologyKey: kubernetes.io/hostname

          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1105

        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.3@sha256:4fcf15b7f265c2c8d7bc2a7e13240a07e0593c326f3cf3b5b9bb69eec5b79299

            env:
              QBT_BitTorrent__Session__Interface: vxlan0
              QBT_BitTorrent__Session__InterfaceAddress:
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              QBT_BitTorrent__Session__InterfaceName: vxlan0
              # WebUI settings (alternative UI, auth subnet whitelist,
              # localhost auth bypass) live in the qBittorrent.conf file in
              # the PVC — this image's entrypoint doesn't translate
              # QBT_Preferences__WebUI__* env vars at runtime. Manage them
              # via the WebUI or POST /api/v2/app/setPreferences.
              # Mullvad's WireGuard port-forward, sourced from the 1P 'vpn'
              # item via the qbittorrent-secret (Flux postBuild substitution).
              # downloads-gateway reads the same field — both must agree, so
              # source from one place.
              QBT_TORRENTING_PORT: ${WIREGUARD_FORWARD_PORT:-24589}
              QBT_WEBUI_PORT: &httpPort 8080

            # In-place resize (k8s 1.35 GA): a live memory/CPU bump applies
            # without restarting the container. The OOM cause was libtorrent
            # 2.x mmap disk IO + OS cache on the NFS download paths (working set
            # ballooned to ~9 GiB of page cache while RSS stayed ~110 MB); fixed
            # live in the WebUI (Disk IO type=POSIX, read/write mode=Disable OS
            # cache) so it now holds ~110 MiB. 1Gi/3Gi replaces the old 8G/12G
            # headroom that only existed for that eliminated balloon — 3Gi still
            # covers recheck spikes ("Outstanding memory when checking" = 32 MiB
            # x concurrent). Watching for OOM at the smaller ceiling.
            resizePolicy:
              - resourceName: cpu
                restartPolicy: NotRequired
              - resourceName: memory
                restartPolicy: NotRequired

            resources:
              requests:
                cpu: 35m
                memory: 1Gi
              limits:
                memory: 3Gi

            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        forceRename: "{{ .Release.Name }}"
        ports:
          http:
            port: *httpPort
        primary: true

      bittorrent:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.45.0.14 # SVC_QBITTORRENT_ADDR
        externalTrafficPolicy: Local
        ports:
          bittorrent:
            port: ${WIREGUARD_FORWARD_PORT:-24589}
            protocol: TCP
    route:
      app:
        annotations:
          glance/name: "QBittorrent"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/qbittorrent.png"
          glance/id: "Downloads"
        hostnames:
          - "bt.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - kind: Service
                name: qbittorrent
                port: 8080

    persistence:
      config:
        existingClaim: qbittorrent-config-pvc

      downloads:
        existingClaim: qbittorrent-downloads

      incomplete:
        existingClaim: qbittorrent-incomplete

      media:
        existingClaim: qbittorrent-media
