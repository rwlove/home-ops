---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sabnzbd-vpn
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sabnzbd-vpn
    template:
      data:
        VPN_SERVICE_PROVIDER: "{{ .SERVICE_PROVIDER }}"
        VPN_TYPE: "{{ .TYPE }}"
        # Shared Mullvad key (one device slot for every pod), so each pod
        # MUST pin a relay no other pod uses — and this one must be a
        # 1:1-NAT DataPacket relay (newsgroup provider 2-IP cap).
        # Deliberately no SERVER_CITIES fallback: a missing field fails the
        # sync and the pod stays down rather than landing on a relay another
        # pod already holds.
        SERVER_HOSTNAMES: "{{ .SABNZBD_SERVER_HOSTNAMES }}"
        # IPv4 tunnel address only (the 1P field is "v4,v6"): no IPv6 egress,
        # so the provider's 2-source-IP cap only ever sees the relay's one
        # IPv4 egress address.
        WIREGUARD_ADDRESSES: '{{ index (splitList "," .WIREGUARD_ADDRESSES) 0 | trim }}'
        WIREGUARD_PRIVATE_KEY: "{{ .WIREGUARD_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: vpn
