---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sabnzbd
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m

  values:
    controllers:
      sabnzbd:
        pod:
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1001
            runAsUser: 1106
            runAsNonRoot: true

        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        initContainers:
          # ceph-block provisions fresh ext4, whose mkfs creates lost+found as
          # root:root mode-700. fsGroup chowns it to gid 1001 but leaves mode
          # 700, so the non-root app (uid 1106) EACCES's when it enumerates the
          # /incomplete root for resumable jobs at startup. chmod it readable.
          fix-lost-found:
            image:
              repository: docker.io/library/busybox
              tag: "1.38.0"
            command:
              - /bin/sh
              - -c
              - "chmod 755 /incomplete/lost+found 2>/dev/null || true"
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: true
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: rolling@sha256:b1795982db498ed5691a7b1231f0fac7eed2a1d53e9c81b8e834d02695e76104

            env:
              HAS_IPV6: "false"
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd,
                sabnzbd.downloads,
                sabnzbd.downloads.svc,
                sabnzbd.downloads.svc.cluster,
                sabnzbd.downloads.svc.cluster.local,
                sabnzbd.${SECRET_DOMAIN}
              SABNZBD__PORT: &httpPort 8080

            envFrom:
              - secretRef:
                  name: *app

            probes:
              # SABnzbd is single-threaded on its API; heavy assemble/par2/unpack
              # bursts block /api for several seconds. A 1s timeout / 3-failure
              # probe SIGKILLs the container mid-assembly, orphaning the queue
              # __ADMIN__ files and causing "Error importing NzbFile" on restart.
              # ~50s tolerance (5 × 10s) rides out an unpack burst while still
              # catching a truly hung process.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *httpPort
                  failureThreshold: 5
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness: *probes
              startup:
                enabled: false

            # In-place resize (k8s 1.35 GA): apply a live memory/CPU bump
            # without restarting the container, so raising memory under a heavy
            # unpack/repair load doesn't interrupt in-flight jobs.
            resizePolicy:
              - resourceName: cpu
                restartPolicy: NotRequired
              - resourceName: memory
                restartPolicy: NotRequired

            # Assembly writes to the incomplete dir balloon dirty page cache
            # against the cgroup limit faster than write-back drains it, OOM-
            # killing the container mid-job (working_set stays ~200Mi but the
            # hard limit counts un-flushed pages). ceph-block flushes far faster
            # than the old NFS path, but keep 2Gi headroom for repair/unpack
            # spikes; resizePolicy above lets this apply without a restart.
            resources:
              requests:
                cpu: 15m
                memory: 512Mi
              limits:
                memory: 2Gi

    service:
      app:
        ports:
          http:
            port: *httpPort
    route:
      app:
        annotations:
          glance/name: "Sabnzbd"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/sabnzbd.png"
          glance/id: "Downloads"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - kind: Service
                name: sabnzbd
                port: 8080

    persistence:
      complete:
        existingClaim: sabnzbd-complete-pvc

      config:
        existingClaim: sabnzbd-config-pvc

      downloads:
        existingClaim: sabnzbd-downloads-pvc

      incomplete:
        existingClaim: sabnzbd-incomplete
    externalSecrets:
      sabnzbd:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: sabnzbd
          creationPolicy: Owner
        dataFrom:
          - extract:
              # SABNZBD__API_KEY, SABNZBD__NZB_KEY
              key: sabnzbd
    networkpolicies:
      allow:
        type: cilium
        forceRename: sabnzbd-allow
        # Explicit endpointSelector preserves the pre-inline selector
        # (app.kubernetes.io/name) instead of the chart's controller-derived
        # default, keeping the policy byte-identical across the migration.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: sabnzbd
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal gateway (envoy) → sabnzbd:8080. Auth is enforced at the
          # gateway by the extAuth SecurityPolicy (#12767); the oauth2-proxy
          # hop is retired.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          # Cross-ns *arr download-client callers. Each *arr posts NZBs +
          # polls download status against the sabnzbd WebUI API.
          #   media/sonarr / radarr / lidarr → sabnzbd.downloads:8080
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: sonarr
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: radarr
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: lidarr
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        egress:
          # VPN egress. ALL newsgroup connections (news.newsgroup.ninja, etc.)
          # route through the VXLAN tunnel to the gateway pod, then out via
          # WireGuard. The DataPacket NY pin (us-nyc-wg-301) is what keeps
          # the 2-IP-cap-sensitive newsgroup provider from rejecting flows
          # — see memory project_mullvad_nat_egress_topology.md.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: vpn
                  app.kubernetes.io/instance: downloads-gateway
                  app.kubernetes.io/name: pod-gateway
                  app.kubernetes.io/controller: main
            toPorts:
              - ports:
                  - port: "4789"
                    protocol: UDP
          # workaround: https://github.com/angelnu/helm-charts/issues/414 — drop this ICMP-echo allow when pod-gateway liveness mechanic changes or pod-gateway is replaced
          # Tracking: home-ops#11829
          # The gateway-sidecar init container (angelnu/pod-gateway
          # client_init.sh v7+) runs an ICMP liveness check against the
          # gateway pod IP before declaring the tunnel up. Without this,
          # init fails → CrashLoopBackOff under default-deny.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: vpn
                  app.kubernetes.io/instance: downloads-gateway
                  app.kubernetes.io/name: pod-gateway
                  app.kubernetes.io/controller: main
            icmps:
              - fields:
                  - type: 8  # echo request
                    family: IPv4
