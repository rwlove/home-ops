---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sabnzbd
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m

  values:
    controllers:
      sabnzbd:
        pod:
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1001
            runAsUser: 1106
            runAsNonRoot: true
          # All DNS goes to gluetun's DoT resolver on the shared pod loopback,
          # i.e. through the tunnel. This app needs no cluster DNS names.
          dnsConfig:
            nameservers:
              - 127.0.0.1
          dnsPolicy: None
          # Opt out of the pod-gateway admission webhook (gatewayDefault:
          # true for the namespace); gluetun owns this pod's egress.
          # Drop once the namespace loses its routed-gateway label.
          labels:
            setGateway: "false"
        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        initContainers:
          # ceph-block provisions fresh ext4, whose mkfs creates lost+found as
          # root:root mode-700. fsGroup chowns it to gid 1001 but leaves mode
          # 700, so the non-root app (uid 1106) EACCES's when it enumerates the
          # /incomplete root for resumable jobs at startup. chmod it readable.
          fix-lost-found:
            image:
              repository: docker.io/library/busybox
              tag: "1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4"
            command:
              - /bin/sh
              - -c
              - "chmod 755 /incomplete/lost+found 2>/dev/null || true"
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: true
          # Native sidecar (restartPolicy: Always): starts before the app,
          # gates it on a healthy tunnel via startupProbe, and stays up for
          # the pod's lifetime. gluetun's firewall is the primary
          # kill-switch; the CNP below (egress default-deny, world UDP/51820
          # only, CoreDNS denied) is the second.
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            # A sidecar restart keeps the pod netns, so policy rules from the
            # previous run survive and gluetun fails with "file exists".
            # Clear them before exec (gluetun-wiki setup/advanced/kubernetes).
            command:
              - /bin/sh
              - -c
              - |
                while ip rule del table 51820 2>/dev/null; do :; done
                while ip -6 rule del table 51820 2>/dev/null; do :; done
                exec /gluetun-entrypoint
            env:
              # Inbound on eth0 is dropped unless listed: the web UI/API port
              # (envoy route, in-cluster callers, metrics scrape, probes).
              FIREWALL_INPUT_PORTS: "8080"
              # Pod + service CIDRs and the LAN stay off-tunnel so replies to
              # envoy and kubelet route via eth0. Does not overlap Mullvad's
              # 10.64.0.0/10 tunnel range.
              FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/16,10.43.0.0/16,192.168.0.0/16
              # The default malicious-host block list is downloaded and built
              # in memory at start and every DNS_UPDATE_PERIOD (24h, which also
              # restarts the DNS server). That spike OOM-killed a sidecar at
              # its limit; it adds nothing to leak protection, so it's off.
              BLOCK_MALICIOUS: "off"
              DNS_UPDATE_PERIOD: "0"
              # gluetun's Go heap spikes transiently at start (server-data
              # build) and OOM-killed a sidecar at a 256Mi limit despite a
              # ~110Mi steady state. GOMEMLIMIT makes the GC work before the
              # cgroup ceiling; keep it ~75% of limits.memory below.
              GOMEMLIMIT: 384MiB
              VPN_INTERFACE: wg0
              # SERVER_HOSTNAMES comes from this app's own 1P field (see
              # externalsecret.yaml). It MUST be a DataPacket-hosted relay with
              # 1:1 NAT (one stable egress IP): the newsgroup provider caps the
              # account at 2 simultaneous source IPs, and M247 relays pool
              # egress. WIREGUARD_ADDRESSES is IPv4-only there for the same
              # reason — a tunneled IPv6 flow would be a second source IP.
            envFrom:
              - secretRef:
                  name: sabnzbd-vpn
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /gluetun-entrypoint
                      - healthcheck
                  failureThreshold: 30
                  periodSeconds: 5
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /gluetun-entrypoint
                      - healthcheck
                  failureThreshold: 6
                  periodSeconds: 30
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            restartPolicy: Always
            # gluetun must run as root to manage routes/iptables; overrides the
            # pod-level non-root default for this container only.
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
              runAsGroup: 0
              runAsNonRoot: false
              runAsUser: 0
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: rolling@sha256:07790a7829201d9ea302e8b862078beac4b1a07003fe8359e3f069b6bcd84a95

            env:
              HAS_IPV6: "false"
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd,
                sabnzbd.downloads,
                sabnzbd.downloads.svc,
                sabnzbd.downloads.svc.cluster,
                sabnzbd.downloads.svc.cluster.local,
                sabnzbd.${SECRET_DOMAIN}
              SABNZBD__PORT: &httpPort 8080

            envFrom:
              - secretRef:
                  name: *app

            probes:
              # SABnzbd is single-threaded on its API; heavy assemble/par2/unpack
              # bursts block /api for several seconds. A 1s timeout / 3-failure
              # probe SIGKILLs the container mid-assembly, orphaning the queue
              # __ADMIN__ files and causing "Error importing NzbFile" on restart.
              # ~50s tolerance (5 × 10s) rides out an unpack burst while still
              # catching a truly hung process.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *httpPort
                  failureThreshold: 5
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness: *probes
              # A startup probe gates liveness/readiness: k8s does not run them
              # until startup first succeeds. Without one (and with liveness
              # initialDelaySeconds: 0), a slow cold start — SABnzbd's
              # single-threaded Python init on a resource-constrained/throttled
              # node can take well over the 5×10s liveness window to bind :8080 —
              # trips the liveness probe and SIGKILLs the container before it ever
              # listens, an unbreakable crashloop (ob.: reads its INI, then killed
              # ~44s later, port never bound). 30×10s gives cold start up to ~5min
              # to come up on a struggling node; once it binds, liveness takes over
              # at its normal (tight) cadence.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *httpPort
                  failureThreshold: 30
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5

            # In-place resize (k8s 1.35 GA): apply a live memory/CPU bump
            # without restarting the container, so raising memory under a heavy
            # unpack/repair load doesn't interrupt in-flight jobs.
            resizePolicy:
              - resourceName: cpu
                restartPolicy: NotRequired
              - resourceName: memory
                restartPolicy: NotRequired

            # Assembly writes to the incomplete dir balloon dirty page cache
            # against the cgroup limit faster than write-back drains it, OOM-
            # killing the container mid-job (working_set stays ~200Mi but the
            # hard limit counts un-flushed pages). ceph-block flushes far faster
            # than the old NFS path, but keep 4Gi headroom for repair/unpack
            # spikes; 2Gi still OOM-killed on large 2160p post-proc sets.
            # resizePolicy above lets this apply without a restart.
            resources:
              requests:
                cpu: 15m
                memory: 512Mi
              limits:
                memory: 4Gi

    service:
      app:
        ports:
          http:
            port: *httpPort
    route:
      app:
        annotations:
          glance/name: "Sabnzbd"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/sabnzbd.png"
          glance/id: "Downloads"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - kind: Service
                name: sabnzbd
                port: 8080

    persistence:
      complete:
        existingClaim: sabnzbd-complete-pvc

      config:
        existingClaim: sabnzbd-config-pvc

      downloads:
        existingClaim: sabnzbd-downloads-pvc

      incomplete:
        existingClaim: sabnzbd-incomplete
    externalSecrets:
      sabnzbd:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: sabnzbd
        dataFrom:
          - extract:
              # SABNZBD__API_KEY, SABNZBD__NZB_KEY
              key: sabnzbd
    networkpolicies:
      allow:
        type: cilium
        forceRename: sabnzbd-allow
        # Explicit endpointSelector preserves the pre-inline selector
        # (app.kubernetes.io/name) instead of the chart's controller-derived
        # default, keeping the policy byte-identical across the migration.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: sabnzbd
        # Ingress stays additive (namespace default-deny comes in a later
        # phase). Egress is deny-by-default for this endpoint: the only
        # allowed egress is the WireGuard handshake, so a gluetun firewall
        # failure cannot leak cleartext.
        enableDefaultDeny:
          egress: true
          ingress: false
        ingress:
          # Internal gateway (envoy) → sabnzbd:8080. Auth is enforced at the
          # gateway by the extAuth SecurityPolicy (#12767); the oauth2-proxy
          # hop is retired.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          # Cross-ns *arr download-client callers. Each *arr posts NZBs +
          # polls download status against the sabnzbd WebUI API.
          #   media/sonarr / radarr / lidarr → sabnzbd.downloads:8080
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: sonarr
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: radarr
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: lidarr
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        # The namespace baseline allow-dns lets every pod reach CoreDNS, which
        # resolves outside the tunnel. This pod resolves via gluetun DoT on
        # 127.0.0.1 and needs no cluster DNS, so deny CoreDNS outright (deny
        # beats any allow) — no plaintext lookup can leave off-tunnel.
        egressDeny:
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: kube-system
                  k8s-app: kube-dns
        egress:
          # WireGuard handshake + tunnel to the Mullvad relay. Every other
          # external flow is inside this tunnel. Replaces the pod-gateway
          # VXLAN/4789 + ICMP allows.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "51820"
                    protocol: UDP
