---
directories:
  downloads: /media/complete
  incomplete: /media/incomplete
flags:
  no_version_check: true
metrics:
  enabled: true
  url: /metrics
  authentication:
    disabled: true
remote_configuration: false
shares:
  directories:
    - /media/shared
  filters:
    - \.ini$
    - Thumbs.db$
    - \.DS_Store$
# slskd 0.26 moved download-permissions under transfers.download.destination
# (single mode for files+dirs). See slskd/slskd#1756. 770 keeps downloads
# group-writable so soularr can rename into Lidarr's artist-album layout.
transfers:
  download:
    destination:
      permissions:
        mode: 770
