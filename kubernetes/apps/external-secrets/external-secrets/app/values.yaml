---
installCRDs: true
leaderElect: true
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 512Mi
serviceMonitor:
  enabled: true
  interval: 1m
# PSS-restricted prereq (external-secrets ns): the chart's container
# securityContext already runs non-root (runAsUser 1000, drop ALL, seccomp),
# but its podSecurityContext ships identity-less (only `enabled: true`), so the
# k8tz-injected init container has no pod-level runAsNonRoot to inherit and
# fails restricted. Stamp a non-root pod identity on each component so the init
# container inherits it. Matches the already-live container UID — additive, no
# behaviour change for the main containers.
podSecurityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
webhook:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi
  serviceMonitor:
    enabled: true
    interval: 1m
certController:
  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi
  serviceMonitor:
    enabled: true
    interval: 1m
grafanaDashboard:
  enabled: true
