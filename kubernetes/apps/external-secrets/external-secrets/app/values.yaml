    cpu: 50m
    memory: 256Mi
  limits:
    memory: 512Mi
serviceMonitor:
  enabled: true
  interval: 1m
webhook:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi
  serviceMonitor:
    enabled: true
    interval: 1m
certController:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi
  serviceMonitor:
    enabled: true
    interval: 1m
grafanaDashboard:
  enabled: true
