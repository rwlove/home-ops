---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cluster-secrets
  # Only the fields the manifests substitute. The webhook copies every key of
  # this Secret into every Kustomization spec, which anything that can read
  # Kustomizations can see, so a whole-item `extract` leaked the item's own
  # credential fields into 310 specs. Add a field here only when a manifest
  # uses it as ${VAR}.
  data:
    - secretKey: EMAIL
      remoteRef:
        key: homelab
        property: EMAIL
    - secretKey: NFS_HOST_0
      remoteRef:
        key: homelab
        property: NFS_HOST_0
    - secretKey: NFS_HOST_2
      remoteRef:
        key: homelab
        property: NFS_HOST_2
    - secretKey: NFS_HOST_SECURITY
      remoteRef:
        key: homelab
        property: NFS_HOST_SECURITY
    - secretKey: SECRET_DOMAIN
      remoteRef:
        key: homelab
        property: SECRET_DOMAIN
