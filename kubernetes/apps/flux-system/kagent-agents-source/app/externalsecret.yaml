---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-agents-git-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  # target.name intentionally omitted: it defaults to metadata.name
  # (kagent-agents-git-auth) at runtime, so the produced Secret is unchanged —
  # but flate's producer-aware scan keys on spec.target.name / template
  # metadata.name, so omitting it keeps flate from marking the GitRepository
  # "Ready". With --allow-missing-secrets the source is then "skipped" in CI and
  # the skip propagates to the kagent-agents Kustomization (which flate cannot
  # build, since its ./agents path lives on the unreachable Forgejo source).
  target:
    template:
      engineVersion: v2
      data:
        # Flux GitRepository basic-auth keys. The 1Password item stores a
        # read-only Forgejo access token as `token`; map it to `password`.
        username: "{{ .username }}"
        password: "{{ .token }}"
  dataFrom:
    - extract:
        key: kagent-agents-git
