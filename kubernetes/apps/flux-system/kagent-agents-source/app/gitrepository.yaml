---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/gitrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kagent-agents
spec:
  interval: 1h
  ref:
    branch: main
  # Read-only Forgejo token (windmill) from the in-repo ExternalSecret beside
  # this file. The repo is anonymously cloneable on the LAN-only forge, but the
  # secretRef is deliberate: it is what makes flate (flux-local) CI auto-skip
  # this source — CI runners cannot reach the in-cluster forge, and flate skips
  # a source whose secretRef is declared by an in-repo ExternalSecret.
  secretRef:
    name: kagent-agents-git-auth
  # In-cluster service URL — source-controller resolves it via cluster DNS
  # (CNP allows flux-system -> forgejo.tools:3000).
  url: http://forgejo.tools.svc.cluster.local:3000/windmill/kagent-agents.git
