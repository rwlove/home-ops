---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# The webhook copies every key of the Secrets it watches into the inline
# postBuild.substitute of every Kustomization it admits, where anything that
# can read Kustomizations sees them. cluster-secrets extracts the whole
# 1Password item, credential fields included, so the webhook gets this copy
# with only the keys manifests substitute instead. Add a key here only when a
# manifest uses it as ${VAR}. (cluster-secrets stays a whole-item extract:
# the tier parents substitute from it, and declaring its keys makes flate
# model the ExternalSecret as its producer, a dependency cycle.)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kustomize-webhook-substitutions
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kustomize-webhook-substitutions
  data:
    - secretKey: EMAIL
      remoteRef:
        key: homelab
        property: EMAIL
    - secretKey: NFS_HOST_0
      remoteRef:
        key: homelab
        property: NFS_HOST_0
    - secretKey: NFS_HOST_2
      remoteRef:
        key: homelab
        property: NFS_HOST_2
    - secretKey: NFS_HOST_SECURITY
      remoteRef:
        key: homelab
        property: NFS_HOST_SECURITY
    - secretKey: SECRET_DOMAIN
      remoteRef:
        key: homelab
        property: SECRET_DOMAIN
