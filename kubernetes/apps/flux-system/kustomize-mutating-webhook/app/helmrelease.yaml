---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kustomize-mutating-webhook
spec:
  chartRef:
    kind: OCIRepository
    name: kustomize-mutating-webhook
  interval: 15m
  install:
    crds: CreateReplace
    createNamespace: true
    replace: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    timeout: 10m
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
      strategy: rollback
  driftDetection:
    mode: enabled
  maxHistory: 3
  rollback:
    cleanupOnFail: true
    force: true
    recreate: true
  test:
    enable: true
  uninstall:
    keepHistory: false
  valuesFrom:
    - kind: ConfigMap
      name: kustomization-mutating-webhook-values
