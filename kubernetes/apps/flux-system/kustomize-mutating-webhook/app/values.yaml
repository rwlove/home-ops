---
image:
  repository: ghcr.io/xunholy/kustomize-mutating-webhook
  tag: 0.12.0@sha256:004c1d33626891260ded4d826848a3451792bbcd02824250d7a1fbda08192c20
# Raised 1 -> 3 on 2026-07-26. This webhook is a hard dependency of every
# Flux Kustomization apply (rules: kustomizations CREATE/UPDATE, and
# failurePolicy: Fail), so a single replica made it a single point of
# failure for ALL GitOps. It failed four separate times on 2026-07-25/26
# — tempo, goldilocks, memory-mcp, vector-agent — each surfacing as
#   "failed calling webhook ...: the server has received too many
#    requests and has asked us to try again later"
# and each halting cluster-apps until it happened to succeed on retry.
#
# ROOT CAUSE — corrected. #13292 originally claimed this was latency:
# client-go's rate limiter queueing requests past the 10s webhook timeout,
# inferred from the pod's own debug logs (median 0.70s, max 4.92s).
# THAT WAS WRONG, and the apiserver's own instrumentation disproves it:
#
#   apiserver_admission_webhook_admission_duration_seconds p95
#     before the change: 0.0219s      after: 0.0226s
#
# Admission latency is ~22ms, unchanged, and never remotely near the 10s
# timeout. The 0.70s figure was an artefact of LOG_LEVEL=debug, which
# serialises the entire generated patch on every request — the logging
# was most of the measured "latency", so the instrument was the problem.
#
# What actually happened is explicit rejections, per
# apiserver_admission_webhook_rejection_count:
#   rejection_code 503 = 107     rejection_code 429 = 93
# 503 is "no ready endpoint" — with ONE replica, any restart, eviction or
# momentary unreadiness returns 503 to every Kustomization apply in
# flight. 429 is the webhook's own overload response under burst.
#
# Replicas remain the correct fix, but for that reason rather than the
# one first given: 3 pods mean a single pod restarting never empties the
# endpoint list, and burst capacity is 3x. Latency was never the issue,
# so CPU/memory tuning would have achieved nothing.
#
# Lesson worth keeping: measure admission webhooks from the APISERVER
# side (apiserver_admission_webhook_*), not from the webhook's own logs.
# The apiserver sees rejections and timeouts the pod does not log at all.
replicas: 3
certManager:
  enabled: true
configMaps:
  - create: false
    name: cluster-config
secrets:
  - create: false
    name: cluster-secrets
env:
  # debug -> info on 2026-07-26. At debug this logs the ENTIRE generated
  # patch on every mutation — a ~2 KB JSON blob, 702 times per 30 min —
  # which is both latency on the hot path and a large amount of Loki
  # ingestion for no steady-state value. Raise it back temporarily when
  # actually debugging substitution behaviour.
  LOG_LEVEL: info
# Chart NP egress uses ipBlock 0.0.0.0/0 for 443/6443, which Cilium does
# not match against the kube-apiserver (host-network identity, separate
# from `world`). With it enabled, the 0.11.0 informer hangs on its
# initial LIST/WATCH and /ready never returns 200.
networkpolicy:
  create: false
# Re-enabled 2026-07-26, restoring the chart default (enabled,
# minAvailable: 1). It was almost certainly disabled *because* replicas
# was 1: minAvailable 1 against a single replica makes that node
# permanently undrainable, which is worse than having no PDB. At 3
# replicas the same setting is correct — it allows draining two at once
# while guaranteeing the admission path never reaches zero pods, which
# matters a lot here because failurePolicy is Fail.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    memory: 256Mi
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
service:
  headless: false
