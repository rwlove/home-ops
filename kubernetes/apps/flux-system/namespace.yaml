---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
  labels:
    goldilocks.fairwinds.com/enabled: "true"
    kustomize.toolkit.fluxcd.io/prune: disabled
    # PSS: warn/audit=restricted ONLY. Deliberately NEVER enforce — if
    # admission rejected a Flux controller pod we could not GitOps the
    # fix (the reconciler is what would be down). See
    # docs/src/pod_security_audit.md §SPOF.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
