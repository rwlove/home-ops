---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: emqx
spec:
  chart:
    spec:
      chart: emqx
      # renovate: registryUrl=https://repos.emqx.io/charts
      sourceRef:
        kind: HelmRepository
        name: emqx-charts

      version: 5.8.9
  interval: 30m
  values:
    affinity:
      podAntiAffinity:
        # Hard spread across nodes. The `preferred` rule (in place since Dec
        # 2025) was ignored under scheduling pressure and 2-of-3 brokers
        # colocated on worker3; when that node flapped (2026-08-22) it wedged
        # MQTT and took HA↔Z-Wave down. `required` forces each of the 3
        # brokers onto a distinct node — always satisfiable (11 nodes), and no
        # rolling-update deadlock (a replaced pod has 8 free nodes to land on).
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: ["emqx"]
            topologyKey: kubernetes.io/hostname
    emqxConfig:
      EMQX_ALLOW_ANONYMOUS: "false"
      EMQX_AUTH__MNESIA__PASSWORD_HASH: plain
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin

    # Mount a custom acl.conf over EMQX's default authz file source
    # (/opt/emqx/etc/acl.conf). Adds a sandbox rule for the deck-light
    # controller; the rest is EMQX stock. See the emqx-acl ConfigMap.
    extraVolumes:
      - name: acl
        configMap:
          name: emqx-acl
    extraVolumeMounts:
      - name: acl
        mountPath: /opt/emqx/etc/acl.conf
        subPath: acl.conf

    image:
      repository: public.ecr.aws/emqx/emqx

    metrics:
      enabled: false

    persistence:
      enabled: true
      size: 1Gi

      storageClassName: ceph-block
    priorityClassName: home-cluster-critical

    recreatePods: true

    replicaCount: 3
    resources:
      limits:
        memory: 700M

      requests:
        cpu: 30m
        memory: 700M
    service:
      annotations:
        lbipam.cilium.io/ips: ${SVC_EMQX_ADDR}
      externalTrafficPolicy: Cluster

      type: LoadBalancer
  valuesFrom:
    - kind: Secret
      name: emqx
      targetPath: emqxConfig.EMQX_DASHBOARD__DEFAULT_PASSWORD
      valuesKey: admin_password
    - kind: Secret
      name: emqx
      targetPath: emqxConfig.EMQX_AUTH__USER__1__USERNAME
      valuesKey: user_1_username
    - kind: Secret
      name: emqx
      targetPath: emqxConfig.EMQX_AUTH__USER__1__PASSWORD
      valuesKey: user_1_password
