---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/persistentvolumeclaim-v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: esphome-config-ceph
spec:
  # Replaces the Longhorn `esphome-config` PVC for /config. Per storage-class
  # rules this is regenerable config (device YAMLs come from the esphome-devices
  # ConfigMap, secrets.yaml from 1Password/ExternalSecret, build cache lives on
  # the separate `buildcache` PVC), so ceph-block is the correct tier — not
  # Longhorn (which is for irreplaceable data). RWO: esphome-0 is a single pod.
  # The old Longhorn PVC is retained (Reclaim: Retain) as rollback until this is
  # proven, then removed in a follow-up.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: ceph-block
