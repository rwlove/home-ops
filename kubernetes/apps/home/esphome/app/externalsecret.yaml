---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: esphome-secrets
spec:
  # Moves /config/secrets.yaml off the PVC and into 1Password. The entire file
  # is stored verbatim in one 1P field (item `esphome`, field `secretsyaml`) so
  # the rendered Secret is byte-identical to the original — ESPHome reads it at
  # compile time. Mounted read-only at /config/secrets.yaml by the HelmRelease,
  # same pattern as the git-tracked device configs (the dashboard no longer
  # edits secrets; 1Password is the source of truth).
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: esphome-secrets
    template:
      data:
        secrets.yaml: "{{ .secretsyaml }}"
  dataFrom:
    - extract:
        key: esphome
