---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: esphome
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 2000
        runAsUser: 2000

    controllers:
      esphome:
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node.network/vlan-iot
                        operator: In
                        values:
                          - "true"

          annotations:
            k8s.v1.cni.cncf.io/networks: esphome-iot-static

          # IOT VLAN (20)
          priorityClassName: home-cluster-critical

        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/esphome
              tag: 2026.9.0@sha256:a467b53ce970d96d54045f417c3ee57928e904f44b400ec908ae31a94bbb519c


            env:
              ESPHOME_DASHBOARD_USE_PING: true
              ESPHOME__INSTANCE_NAME: ESPHome
              ESPHOME__PORT: &httpPort 6052
              ESPHOME__APPLICATION_URL: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
              ESPHOME__LOG_LEVEL: info

            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false

            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 6Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"], add: ["NET_RAW"]}
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${SVC_ESPHOME_ADDR}
        controller: esphome
        externalTrafficPolicy: Cluster
        ports:
          http:
            port: *httpPort

    route:
      app:
        annotations:
          glance/name: "ESPHome"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/esphome.png"
          glance/id: "Home Automation"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      buildcache:
        accessMode: ReadWriteOnce
        size: 50Gi
        suffix: buildcache
        advancedMounts:
          esphome:
            app:
              - path: /cache
      config:
        existingClaim: esphome-config
        globalMounts:
          - path: /config
      tmpfs:
        type: emptyDir
        advancedMounts:
          esphome:
            app:
              - path: /tmp
                subPath: esphome-tmp
    networkpolicies:
      allow:
        type: cilium
        forceRename: esphome-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: esphome
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal HTTPRoute (envoy → esphome:6052) for the ESPHome dashboard.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "6052"
                    protocol: TCP
          # esphome-mcp (mcp-system) drives the dashboard API — list/edit/validate
          # over HTTP and compile/flash/logs over WebSocket, all on 6052.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  app.kubernetes.io/name: esphome-mcp
            toPorts:
              - ports:
                  - port: "6052"
                    protocol: TCP
        egress:
          # NOTE: ESPHome devices on the IoT VLAN are reached via the multus-
          # attached secondary NIC (esphome-iot-static). That traffic bypasses
          # Cilium entirely — these CNPs only govern eth0 (Pod CIDR) traffic.
          # ESPHome compiles firmware on-demand and reaches out to the public
          # internet during compile: PlatformIO package index, GitHub for
          # libraries / boards, ESPHome release server, PyPI, etc. The set is
          # broad and changes per-device config — toEntities:world is the only
          # practical option here. Documented as intentional.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "80"
                    protocol: TCP
