---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: esphome
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 2000
        runAsUser: 2000

    controllers:
      esphome:
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node.network/vlan-iot
                        operator: In
                        values:
                          - "true"

          annotations:
            k8s.v1.cni.cncf.io/networks: esphome-iot-static

          # IOT VLAN (20)
          priorityClassName: home-cluster-critical

        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/esphome
              tag: 2026.9.1@sha256:0265799120febd13a2952edfee30ff4c5ab50c0758ad95e802b1257dcd94c9e0


            env:
              ESPHOME_DASHBOARD_USE_PING: true
              ESPHOME__INSTANCE_NAME: ESPHome
              ESPHOME__PORT: &httpPort 6052
              ESPHOME__APPLICATION_URL: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
              ESPHOME__LOG_LEVEL: info
              # Put the ESP-IDF toolchain (framework + tools, ~2.5G) on the
              # regenerable `/cache` PVC (50Gi) instead of `/config` (10Gi).
              # ESPHome resolves its cache via platformdirs user_cache_dir, i.e.
              # $XDG_CACHE_HOME/esphome (falling back to $HOME/.cache/esphome =
              # /config/.cache/esphome when unset). The image already routes
              # build/pio/data to /cache (ESPHOME_BUILD_PATH, PLATFORMIO_CORE_DIR,
              # ESPHOME_DATA_DIR) but NOT this; so the IDF toolchain was landing
              # on /config and was destroyed when the /config→ceph migration
              # started /config fresh, and the auto-reinstall came down missing
              # `ninja` → every esp-idf compile failed. Keeping the toolchain on
              # /cache means a /config reset can never break compiles again.
              XDG_CACHE_HOME: /cache/.cache

            # workaround: https://github.com/esphome/esphome/pull/19871 — remove
            # when the esphome image is >= 2026.10 (that PR runs cmake/ninja
            # directly instead of through idf.py). esp-idf 5.5.5 pins ninja
            # 1.12.1 at a managed path (tools/ninja/1.12.1/ninja), but this image
            # ships ninja 1.13.0 only on PATH (/usr/local/bin/ninja) and esphome
            # 2026.9.1 builds via idf.py, which references the managed path and
            # never installs it → every esp-idf compile dies with "no such file
            # or directory". Symlink the PATH ninja into the managed path on
            # every pod start; the toolchain lives on the regenerable /cache PVC,
            # so this is also re-created after any cache reset. Best-effort
            # (|| true): a failure here must never crash the dashboard — the
            # reconciler's compile gate is the backstop. Tracked: home-ops#15085.
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - mkdir -p /cache/.cache/esphome/idf/tools/ninja/1.12.1 && ln -sf /usr/local/bin/ninja /cache/.cache/esphome/idf/tools/ninja/1.12.1/ninja || true

            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false

            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 6Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"], add: ["NET_RAW"]}
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${SVC_ESPHOME_ADDR}
        controller: esphome
        externalTrafficPolicy: Cluster
        ports:
          http:
            port: *httpPort

    route:
      app:
        annotations:
          glance/name: "ESPHome"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/esphome.png"
          glance/id: "Home Automation"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      buildcache:
        accessMode: ReadWriteOnce
        size: 50Gi
        suffix: buildcache
        advancedMounts:
          esphome:
            app:
              - path: /cache
      config:
        # Migrated off the Longhorn `esphome-config` PVC to ceph-block (the
        # regenerable-config tier — /config is derived state: configs come from
        # git via the `esphome-devices` ConfigMap, secrets from 1Password, build
        # cache from the separate `buildcache` PVC, and the dashboard rebuilds
        # its device list from the mounted configs on start). The old Longhorn
        # PVC+PV were removed; its `esphome-config-xfs` volume (Reclaim: Retain)
        # is kept detached as the rollback point until the cutover is proven.
        existingClaim: esphome-config-ceph
        globalMounts:
          - path: /config
      # Git-tracked device configs. Read-only subPath mounts layered over the
      # ceph /config PVC above — the dashboard can no longer edit these 12
      # devices; bumps are Renovate/hand PRs instead.
      devices:
        type: configMap
        name: esphome-devices
        globalMounts:
          - path: /config/apollo-msr-2-296890.yaml
            subPath: apollo-msr-2-296890.yaml
            readOnly: true
          - path: /config/bluetooth-proxy-gym.yaml
            subPath: bluetooth-proxy-gym.yaml
            readOnly: true
          - path: /config/bluetooth-proxy-wifi-1.yaml
            subPath: bluetooth-proxy-wifi-1.yaml
            readOnly: true
          - path: /config/bluetooth-proxy-wifi-2.yaml
            subPath: bluetooth-proxy-wifi-2.yaml
            readOnly: true
          - path: /config/bt-scale.yaml
            subPath: bt-scale.yaml
            readOnly: true
          - path: /config/hass-voice-bedroom.yaml
            subPath: hass-voice-bedroom.yaml
            readOnly: true
          - path: /config/hass-voice-familyroom.yaml
            subPath: hass-voice-familyroom.yaml
            readOnly: true
          - path: /config/hass-voice-gym.yaml
            subPath: hass-voice-gym.yaml
            readOnly: true
          - path: /config/konnected-9d7cc0.yaml
            subPath: konnected-9d7cc0.yaml
            readOnly: true
          - path: /config/pool-controller.yaml
            subPath: pool-controller.yaml
            readOnly: true
          - path: /config/ratgdo_primary-1bb40c.yaml
            subPath: ratgdo_primary-1bb40c.yaml
            readOnly: true
          - path: /config/ratgdo_secondary-1bc561.yaml
            subPath: ratgdo_secondary-1bc561.yaml
            readOnly: true
      # secrets.yaml sourced from 1Password via the esphome-secrets
      # ExternalSecret (item `esphome` / field `secretsyaml`), rendered
      # byte-identical and mounted read-only — no longer stored on the PVC.
      secrets:
        type: secret
        name: esphome-secrets
        globalMounts:
          - path: /config/secrets.yaml
            subPath: secrets.yaml
            readOnly: true
      tmpfs:
        type: emptyDir
        advancedMounts:
          esphome:
            app:
              - path: /tmp
                subPath: esphome-tmp
    networkpolicies:
      allow:
        type: cilium
        forceRename: esphome-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: esphome
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal HTTPRoute (envoy → esphome:6052) for the ESPHome dashboard.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "6052"
                    protocol: TCP
          # esphome-mcp (mcp-system) drives the dashboard API — list/edit/validate
          # over HTTP and compile/flash/logs over WebSocket, all on 6052.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  app.kubernetes.io/name: esphome-mcp
            toPorts:
              - ports:
                  - port: "6052"
                    protocol: TCP
        egress:
          # NOTE: ESPHome devices on the IoT VLAN are reached via the multus-
          # attached secondary NIC (esphome-iot-static). That traffic bypasses
          # Cilium entirely — these CNPs only govern eth0 (Pod CIDR) traffic.
          # ESPHome compiles firmware on-demand and reaches out to the public
          # internet during compile: PlatformIO package index, GitHub for
          # libraries / boards, ESPHome release server, PyPI, etc. The set is
          # broad and changes per-device config — toEntities:world is the only
          # practical option here. Documented as intentional.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "80"
                    protocol: TCP
