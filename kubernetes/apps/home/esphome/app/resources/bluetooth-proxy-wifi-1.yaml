esphome:
  name: bluetooth-proxy-wifi-1
  friendly_name: bluetooth-proxy-wifi-1
  #name_add_mac_suffix: true
  project:
    name: esphome.bluetooth-proxy-wifi-1
    version: "1.0"

esp32: 
  board: m5stack-atom
  framework:
    type: esp-idf

# Enable logging
logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain
  fast_connect: true

# Enable Home Assistant API
api:
  encryption:
    key: !secret bluetooth_proxy_wifi_1_api_key

ota:
  platform: esphome

#captive_portal:

improv_serial:

dashboard_import:
  package_import_url: github://esphome/firmware/bluetooth-proxy/esp32-generic.yaml@main

esp32_ble_tracker:
  scan_parameters:
    # We currently use the defaults to ensure Bluetooth
    # can co-exist with WiFi In the future we may be able to
    # enable the built-in coexistence logic in ESP-IDF
    active: true
    #interval: 1100ms
    #window: 1100ms

bluetooth_proxy:
  active: true

#web_server:
#  port: 80

