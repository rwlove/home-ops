substitutions:
  name: konnected-9d7cc0
  friendly_name: Alarm Panel Pro 9d7cc0
packages:
  # PINNED 2026-07-26. Was a floating branch ref: builds were non-reproducible
  # (ESPHome re-fetches branch packages on a timer, so identical local YAML could
  # produce different firmware day to day). Bump this tag deliberately.
  konnected.alarm-panel-pro-ethernet: github://konnected-io/konnected-esphome/alarm-panel-pro-esp32-ethernet.yaml@2026.6.0
esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
api:
  encryption:
    key: !secret konnected_api_key
esp32: 
  board: m5stack-atom
  framework:
    type: esp-idf
# Enable logging
logger:

# Bad-flash / boot-loop fallback. This device is the ALARM PANEL and has no AP
# fallback (it is ethernet-only), so without this a firmware that crashes before
# it stays up for 30s is only recoverable by physically walking to the panel with
# a USB cable, with the door/window sensors down until then. After 3 such fast
# crashes the board boots network+OTA only, so a fixed build can be pushed over
# ethernet. Added 2026-07-26; mirrors pool-controller's settings.
safe_mode:
  num_attempts: 3
  boot_is_good_after: 30s
  reboot_timeout: 5min

ethernet:
  domain: !secret wifi_domain
  use_address: konnected.thesteamedcrab.com
