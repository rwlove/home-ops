substitutions:
  name: ratgdo-secondary-1bc561
  friendly_name: ratgdo-secondary 1bc561
packages:
  # PINNED 2026-07-26. Was a floating branch ref: builds were non-reproducible
  # (ESPHome re-fetches branch packages on a timer, so identical local YAML could
  # produce different firmware day to day). Bump this tag deliberately.
  ratgdo.esphome: github://ratgdo/esphome-ratgdo/v25iboard.yaml@v1535
esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
api:
  encryption:
    key: !secret ratgdo_secondary_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain
  fast_connect: true
  use_address: ratgdo-secondary.thesteamedcrab.com