---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: esphome-code
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  dependsOn:
    - name: esphome
      namespace: home

  values:
    controllers:
      esphome-code:
        pod:
          # Match the esphome app's UID (2000) so files created via the
          # web editor are readable by esphome without a chown; the
          # shared /config PVC is already world-writable and populated
          # with 2000:2000 ownership, so no data migration is needed.
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        containers:
          app:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.126.0@sha256:e1f03b5faaefd63ba6c7173a5290c6ec0526ac907f23acfe6bc949dd965279e4

            env:
              # code-server writes $HOME/.config/code-server/config.yaml at
              # startup; point HOME at the shared PVC so runAsUser 2000
              # can write it. Prior default was /root (unwritable non-root).
              HOME: /config
            args:
              - --auth
              - none
              - --user-data-dir
              - /config/.vscode
              - --extensions-dir
              - /config/.vscode
              - --port
              - "8080"
              - /config

            resources:
              requests:
                cpu: 15m
                memory: 120M
              limits:
                memory: 120M

    service:
      app:
        controller: esphome-code
        ports:
          http:
            port: &httpPort 8080

    route:
      app:
        annotations:
          glance/name: "ESPHome Code"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/vscode.png"
          glance/id: "Home Automation"

        hostnames:
          - "esphome-code.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      config:
        existingClaim: esphome-config
        globalMounts:
          - path: /config
