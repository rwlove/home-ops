---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: esphome-reconciler
  labels:
    app.kubernetes.io/name: esphome-reconciler
spec:
  # ───────────────────────────────── LIVE ────────────────────────────────────
  # Went live 2026-10-18. Both OFF gates are now off: suspend: false (fires on
  # schedule) and DRY_RUN=false (env below — real OTA permitted). The ninja
  # compile workaround (#15086) + one-time esp-idf build-cache clean unblocked
  # green compiles first.
  # First run after go-live SEEDS a per-device baseline hash and flashes NOTHING
  # (no state file yet + no config/version drift on the online fleet). Real OTA
  # happens only on a later config-hash change (Renovate @tag bump / hand edit)
  # or core-version drift, one device at a time, compile-gated and verified.
  # To PAUSE reconciliation: set suspend: true. To keep running but compile-only
  # (no OTA, no state writes): set DRY_RUN=true. Prefer a Git edit here over
  # `kubectl edit` — Flux reverts hand edits to this CronJob.
  # One-time backlog convergence (pending external-component @tag bumps on
  # konnected / ratgdo ×2 that version-drift detection can't see because the
  # dashboard only tracks the esphome CORE version): set FORCE_DEVICES to those
  # configs for a single run (capped at MAX_PER_RUN), then clear it — see README.
  # pool-controller stays EXCLUDED (winterized) — un-exclude in spring.
  suspend: false
  # Daily, overnight quiet window — an OTA briefly reboots the device (garage,
  # alarm panel, voice, pool), so flash when the household is idle.
  schedule: "30 3 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # Bounds a worst-case run: MAX_PER_RUN devices × (compile+upload+verify)
      # plus the pip install. A hung compile is killed here, never left running.
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: esphome-reconciler
          annotations:
            k8tz.io/inject: "false"
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: esphome-reconciler
          # Required: the reconciler authenticates to the kube-apiserver with
          # its scoped SA token to open the exec stream into esphome-0.
          automountServiceAccountToken: true
          restartPolicy: Never
          containers:
            - name: reconciler
              image: docker.io/library/python:3.15@sha256:5acd826ebc4a7bb4cc50ff2dd0dc479043fab0ae40c4f1661018980374df00b3
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - |
                  pip install --quiet --no-cache-dir --target /tmp/pylib kubernetes
                  exec python3 /app/esphome_reconcile.py
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: America/New_York
                - name: PYTHONPATH
                  value: /tmp/pylib
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: NAMESPACE
                  value: home
                - name: POD
                  value: esphome-0
                - name: CONTAINER
                  value: app
                - name: MAX_PER_RUN
                  value: "3"
                - name: FORCE_DEVICES
                  value: ""
                # Never touched — not even a candidate. pool-controller is
                # winterized/offline (see memory project_pool_winterized_*); it
                # would otherwise drift on core version and be skipped-offline
                # every run. UN-EXCLUDE in spring when the pool comes back up.
                - name: EXCLUDE_DEVICES
                  value: "pool-controller.yaml"
                # ───── THE OFF TOGGLE ─────  "false" permits real OTA flashing.
                # LIVE since 2026-10-18. Set back to "true" for compile-only.
                - name: DRY_RUN
                  value: "false"
                - name: NOTIFY_URL
                  value: http://notify-mcp.mcp-system:8060/send
                - name: AGENT
                  value: smart-home-operator
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: esphome-reconciler-scripts
                defaultMode: 0o555
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 512Mi
