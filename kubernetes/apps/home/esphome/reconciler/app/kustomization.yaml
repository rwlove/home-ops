---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cnp-allow.yaml
  - ./cronjob.yaml
  - ./rbac.yaml
configMapGenerator:
  - name: esphome-reconciler-scripts
    files:
      - esphome_reconcile.py=./resources/esphome_reconcile.py
generatorOptions:
  disableNameSuffixHash: true
