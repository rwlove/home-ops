---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      frigate:
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: frigate-security-static

          # Lower ndots from the cluster default (5) to 2 so a 2-label
          # external name like api.frigate.video is queried directly
          # instead of being search-domain-expanded first. Under ndots:5
          # the resolver tried api.frigate.video.home.svc.cluster.local
          # first, which resolved to the real ELB IPs; Cilium's DNS proxy
          # then bound those IPs to the search-suffixed name, which does
          # NOT match the `*.frigate.video` toFQDNs selector in
          # cnp-allow.yaml — so Frigate+ egress was POLICY_DENIED and
          # FrigateUnauthorizedEgressAttempt false-fired. ndots:2 keeps
          # 1-label in-cluster short names (e.g. emqx) expanding normally.
          dnsConfig:
            options:
              - name: ndots
                value: "2"

          nodeSelector:
            google.feature.node.kubernetes.io/coral-usb: "true"
            intel.feature.node.kubernetes.io/gpu: "true"
            node.network/vlan-security: "true"

          priorityClassName: home-cluster-critical

        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        initContainers:
          # Native sidecar (restartPolicy: Always). Snapshots config.yml to git
          # on every pod startup so version-bump auto-migrations are captured
          # the moment they happen. The daily CronJob handles ongoing UI edits.
          snapshot:
            image:
              # Must be an image WITH git (matches the snapshot CronJob).
              # Plain alpine has no git → the startup snapshot silently
              # failed `git: not found` (only the daily CronJob committed).
              repository: docker.io/alpine/git
              tag: "v2.54.0@sha256:ae0f6f4bce38d2b8c40becc0d6241a08d9f57186ea03029de2189a2b5e722d94"
            command: ["/bin/sh", "/opt/snapshot/snapshot.sh"]
            env:
              # Wait for Frigate to finish auto-migration before snapshotting.
              WAIT_BEFORE: "120"
              # Any positive value puts the script in sidecar mode (sleep
              # forever after the attempt so the pod stays Ready, even if the
              # snapshot itself failed — the daily CronJob will retry).
              SLEEP_AFTER: "1"
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            restartPolicy: Always

        containers:
          app:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.18.0@sha256:9678a83a76e4730ac7d9ea7428370e32ae656d6b312aaad30d6c69f3fef14d35

            env:
              # Semantic Search's jina-clip-v1 model is fully cached on the
              # config PVC (/config/model_cache/jinaai/jina-clip-v1). Offline
              # mode makes huggingface_hub skip the startup HEAD to
              # huggingface.co — that egress is denied by the frigate CNP and
              # was firing FrigateUnauthorizedEgressAttempt for ~4 min on every
              # restart (5x retry then fall back to cache anyway). Search keeps
              # working from cache. Flip to "0" if a model_size change or
              # reindex needs to pull a new model.
              HF_HUB_OFFLINE: "1"
              # Memory-leak experiment (issue #12327): testing the legacy
              # i965 VAAPI driver in place of iHD. The upstream ffmpeg leak
              # rides the HW-decode path; both drivers ship in the 0.17.1
              # image and all cameras are H.264, which i965 decodes fine on
              # this Kaby Lake (i7-7700) node. Revert to iHD if decode
              # regresses or the 14d working-set trend is unchanged.
              LIBVA_DRIVER_NAME: i965
              # LIBVA_DRIVER_NAME: iHD
              # surpress error message documented here: https://github.com/blakeblackshear/frigate/discussions/15362
              OPENCV_LOG_LEVEL: FATAL

            envFrom:
              - secretRef:
                  name: frigate

            probes:
              liveness: &probes
                enabled: false
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: &unsecurePort 5000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 7
                  failureThreshold: 30
              readiness: *probes
              startup:
                enabled: false
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: *unsecurePort
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 30

            resources:
              requests:
                gpu.intel.com/i915: "1"
                cpu: 3
                memory: 7Gi
              limits:
                gpu.intel.com/i915: "1"
                memory: 14Gi

            securityContext:
              privileged: true
              capabilities: {drop: ["ALL"]}

    service:
      app:
        controller: frigate
        ports:
          http:
            port: &securePort 8971
          rtsp:
            port: 8554
          go2rtc-tcp:
            enabled: true
            primary: false
            port: 1984
            protocol: TCP
            targetPort: 1984
          go2rtc-udp:
            enabled: true
            primary: false
            port: 1984
            protocol: UDP
            targetPort: 1984
          unsecure:
            port: *unsecurePort


    route:
      app:
        annotations:
          glance/name: "Frigate"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/frigate.png"
          glance/id: "Security"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - kind: Service
                name: frigate
                port: 5000
    persistence:
      cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        globalMounts:
          - path: /dev/shm

      clips:
        existingClaim: frigate-clips-pvc
        globalMounts:
          - path: /media/frigate/clips

      config:
        enabled: true
        existingClaim: frigate-config-pvc
        globalMounts:
          - path: /config

      exports:
        existingClaim: frigate-exports-pvc
        globalMounts:
          - path: /media/frigate/exports

      recordings:
        existingClaim: frigate-recordings-pvc
        globalMounts:
          - path: /media/frigate/recordings

      snapshot-script:
        type: configMap
        name: frigate-snapshot-script
        defaultMode: 0555
        advancedMounts:
          frigate:
            snapshot:
              - path: /opt/snapshot
                readOnly: true

      snapshot-ssh:
        type: secret
        name: frigate-snapshot
        defaultMode: 0400
        advancedMounts:
          frigate:
            snapshot:
              - path: /ssh
                readOnly: true

      usb:
        type: hostPath
        hostPath: /dev/bus/usb
        hostPathType: Directory
        advancedMounts:
          frigate:
            app:
              - path: /dev/bus/usb
    externalSecrets:
      frigate:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: frigate
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              # App
              PLUS_API_KEY: "{{ .PLUS_API_KEY }}"
              FRIGATE_AMCREST_RTSP_PASSWORD: "{{ .FRIGATE_AMCREST_RTSP_PASSWORD }}"
              FRIGATE_WYZECAM_RTSP_PASSWORD: "{{ .FRIGATE_WYZECAM_RTSP_PASSWORD }}"
              FRIGATE_REOLINK_RTSP_PASSWORD: "{{ .reolink_password }}"
              FRIGATE_LORYTA_RTSP_PASSWORD: "{{ .loryta_password }}"
              FRIGATE_BIRDCAM_RTSP_PASSWORD: "{{ .FRIGATE_BIRDCAM_RTSP_PASSWORD }}"
              # FRIGATE_PLUS_MODEL — intentionally NOT injected. Frigate can't
              # env-substitute model.path (plain str, not EnvString), so the id
              # stays literal in the live config and is redacted at snapshot time.
              # # FRIGATE_PLUS_MODEL: "{{ .frigate_plus_custom_model }}"
              # go2rtc publish: target — substituted into rtmp://.../live2/{BIRDCAM_YOUTUBE_KEY}
              BIRDCAM_YOUTUBE_KEY: "{{ .BIRDCAM_STREAM_KEY }}"
              # EMQX
              FRIGATE_MQTT_USERNAME: "{{ .user_1_username }}"
              FRIGATE_MQTT_PASSWORD: "{{ .user_1_password }}"
        dataFrom:
          - extract:
              key: emqx
          - extract:
              key: frigate
          - extract:
              key: youtube
      frigate-snapshot:
        forceRename: frigate-snapshot
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: frigate-snapshot
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              id_ed25519: "{{ .private_key }}"
        dataFrom:
          - extract:
              key: frigate-snapshot-deploy-key
    networkpolicies:
      allow:
        type: cilium
        forceRename: frigate-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: frigate
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal gateway (envoy) → frigate:5000. Auth is enforced at the
          # gateway by the extAuth SecurityPolicy (#12767); the oauth2-proxy
          # hop is retired.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "5000"
                    protocol: TCP
          # home-assistant native Frigate integration polls the Frigate API
          # (port 5000) and pulls go2rtc streams (1984 TCP/UDP, 8554 RTSP).
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: home
                  app.kubernetes.io/name: home-assistant
            toPorts:
              - ports:
                  - port: "5000"
                    protocol: TCP
                  - port: "1984"
                    protocol: TCP
                  - port: "1984"
                    protocol: UDP
                  - port: "8554"
                    protocol: TCP
                  - port: "8971"
                    protocol: TCP
        # NOTE: most cameras live on the SECURITY VLAN and are reached via
        # the multus-attached secondary NIC (frigate-security-static).
        # Those pulls bypass Cilium entirely.
        #
        # birdcam is the exception — it sits on the main LAN at
        # 192.168.1.31, so its RTSP + HTTP pulls go via eth0 and ARE
        # governed by Cilium. Explicit toCIDR egress required after the
        # home-namespace default-deny rollout (PR #11592, 2026-05-18).
        egress:
          - toCIDR:
              - 192.168.1.31/32
            toPorts:
              - ports:
                  - port: "554"
                    protocol: TCP
                  - port: "80"
                    protocol: TCP
          # Frigate+ cloud API. Used for model submission, license verification,
          # and pulling custom-trained models (model_path `plus://<id>` in the
          # Frigate config). Three hostnames in active use:
          #   * api.frigate.video  — REST API (AWS us-east-2 ELB)
          #   * plus.frigate.video — portal UI (CloudFront)
          #   * frigate.video      — apex (AWS us-east-2)
          # matchPattern only matches one DNS label (see
          # [[project_cilium_matchpattern_fqdn_limits]]), so the apex needs an
          # explicit matchName. DNS resolution is via the Cilium DNS proxy
          # provisioned by the baseline allow-dns component.
          - toFQDNs:
              - matchName: frigate.video
              - matchPattern: "*.frigate.video"
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
          # Frigate+ serves model blobs and snapshot uploads from an S3 bucket in
          # us-east-2 (api.frigate.video hands back a presigned S3 URL). That host
          # isn't covered by *.frigate.video, so the fetch was POLICY_DENIED and
          # fired FrigateUnauthorizedEgressAttempt. matchPattern only matches one
          # DNS label (see [[project_cilium_matchpattern_fqdn_limits]]), so the
          # path-style host needs an explicit matchName while the virtual-hosted
          # bucket form (<bucket>.s3.us-east-2.amazonaws.com) needs the pattern.
          # NOTE: Frigate caches DNS, so a fresh resolution (pod restart) is
          # required for the cached S3 IPs to bind to this rule — same caveat as
          # the YouTube RTMP path above.
          - toFQDNs:
              - matchName: s3.us-east-2.amazonaws.com
              - matchPattern: "*.s3.us-east-2.amazonaws.com"
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
          # go2rtc birdcam publish destination — RTMP to YouTube Live
          # (rtmp://a.rtmp.youtube.com/live2/{BIRDCAM_YOUTUBE_KEY} in
          # snapshots/config.yml). YouTube ingest IPs are AWS-fronted Google
          # load balancers (142.x).
          #
          # NOTE: A toFQDNs(matchPattern "*.rtmp.youtube.com") rule was tried
          # first (PR #11786) but didn't take effect — frigate's long-lived
          # DNS cache predates the Cilium DNS proxy interception, so the
          # cached IPs are never bound to the FQDN policy. Falling back to
          # toEntities:world+1935 is broader (any 1935 destination), but
          # since 1935 is RTMP-specific and frigate doesn't have other RTMP
          # destinations, the actual exposure is unchanged.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "1935"
                    protocol: TCP
          # Frigate genai integration — Ollama VLM descriptions for detection
          # events. Retargeted 2026-07-26 from ollama-spark to the P40 `ollama`
          # (small VLM, ~3.2 GiB) as part of retiring ollama-spark.
          #
          # This rule is why GenAI never worked. The policy halves were authored
          # for DIFFERENT targets at different times and never matched:
          #   frigate egress → ollama-spark : present     ollama-spark ingress ← frigate : ABSENT
          #   frigate egress → ollama       : ABSENT      ollama       ingress ← frigate : present
          # Cilium silently dropped every request, Frigate's provider timed out
          # at init and never retried, and the DB accumulated 13,017 events with
          # ZERO descriptions. `ai/ollama`'s ingress has carried a frigate rule
          # (commented "Frigate genai integration") the whole time — only this
          # egress side was missing, so this closes the pair.
          #
          # The old comment argued the P40 was too full for an 11b VLM. That was
          # correct for 11b: measured today, the P40 has ~12.7 GiB free and
          # coder(4.6) + bge-m3(0.6) + an 11b(7.3) leaves ~0 for Immich CLIP
          # bursts. A ~3 GiB VLM fits with ~5.5 GiB of burst headroom, which is
          # what makes the P40 viable now where it wasn't before.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: ollama
            toPorts:
              - ports:
                  - port: "11434"
                    protocol: TCP
          # SSH to github.com for the `snapshot` NATIVE SIDECAR that runs inside
          # frigate-0 (initContainers.snapshot, restartPolicy: Always). It is a
          # different pod from the nightly CronJob, so it does NOT inherit
          # frigate-snapshot-allow — that policy selects
          # `app.kubernetes.io/name: frigate-snapshot`, while the sidecar lives
          # under `app.kubernetes.io/name: frigate` and lands here.
          #
          # Without this the sidecar has never worked. Its git clone was denied,
          # so there was no .git, so every later git call failed with "not a git
          # repository" and it gave up after 5 attempts — then slept forever by
          # design ("so the pod stays Ready"), which is why the pod looked
          # healthy while the startup snapshot silently did nothing. The feature
          # it exists for — capturing a version-bump auto-migration the moment
          # it happens, before the daily CronJob overwrites that state with a
          # later edit — has therefore never once run.
          #
          # Same destination and port the CronJob already reaches, so this
          # widens frigate-0's egress no further than the snapshot path already
          # had cluster-wide.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "22"
                    protocol: TCP
      snapshot-allow:
        type: cilium
        forceRename: frigate-snapshot-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: frigate-snapshot
        # Additive — default-deny in `home` ns is what triggers the lockdown;
        # this rule punches a hole for the nightly snapshot run (init
        # container kubectl-execs into frigate-0, main container pushes to
        # github via SSH).
        enableDefaultDeny:
          egress: false
          ingress: false
        egress:
          # SSH to github.com to commit + push the config snapshot. world:22
          # is narrow enough for this single-purpose pod (mirrors the
          # home-assistant-config-sync-allow pattern).
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "22"
                    protocol: TCP
          # kubectl-exec from the init container hits kube-apiserver — that
          # is covered by the baseline allow-apiserver component (intra-
          # cluster control plane access). No explicit rule needed here.
