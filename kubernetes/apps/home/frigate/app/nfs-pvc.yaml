---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/persistentvolume-v1.json
apiVersion: v1
kind: PersistentVolume
metadata:
  name: frigate-recordings-pv
  labels:
    type: nfs
spec:
  storageClassName: frigate-recordings-storage-class
  capacity:
    storage: 2200G
  accessModes:
    - ReadWriteOnce
  nfs:
    server: "${NFS_HOST_SECURITY}"
    path: /mnt/frigate-media/frigate/recordings
  # Tier B (active camera-write path). security-storage already serves
  # NFSv4.2; nconnect=8 is the throughput lever for continuous recording
  # writes. No aggressive actimeo — Frigate must see file changes promptly.
  mountOptions: ["nfsvers=4.2", "nconnect=8", "hard", "noatime"]

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-recordings-pvc
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 2000G
  volumeName: frigate-recordings-pv
  storageClassName: frigate-recordings-storage-class

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: frigate-clips-pv
  labels:
    type: nfs
spec:
  storageClassName: frigate-clips-storage-class
  capacity:
    storage: 400G
  accessModes:
    - ReadWriteOnce
  nfs:
    server: "${NFS_HOST_SECURITY}"
    path: /mnt/frigate-media/frigate/clips
  # Tier B (active camera-write path). See recordings PV above.
  mountOptions: ["nfsvers=4.2", "nconnect=8", "hard", "noatime"]

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-clips-pvc
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 400G
  volumeName: frigate-clips-pv
  storageClassName: frigate-clips-storage-class

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: frigate-exports-pv
  labels:
    type: nfs
spec:
  storageClassName: frigate-exports-storage-class
  capacity:
    storage: 10G
  accessModes:
    - ReadWriteOnce
  nfs:
    server: "${NFS_HOST_2}"
    path: /mnt/mass_storage/kubernetes/frigate-exports
  # Tier B. beast already serves this at NFSv4.2; low-traffic write-once
  # export path, so nconnect is mostly for consistency with the other mounts.
  mountOptions: ["nfsvers=4.2", "nconnect=8", "hard", "noatime"]

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-exports-pvc
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 10G
  volumeName: frigate-exports-pv
  storageClassName: frigate-exports-storage-class
