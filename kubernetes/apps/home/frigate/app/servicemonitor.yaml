---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frigate
  labels:
    app.kubernetes.io/name: frigate
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: frigate
  endpoints:
    # Prometheus-format metrics are served on the unauthenticated internal
    # API port (5000 / `unsecure`), the same port the probes hit for
    # /api/version. The authenticated TLS port (8971 / `http`) is the proxy
    # front and is not needed here. Native since Frigate 0.16; this cluster
    # runs 0.18.2. No Frigate config required to expose the endpoint.
    - port: unsecure
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - home
