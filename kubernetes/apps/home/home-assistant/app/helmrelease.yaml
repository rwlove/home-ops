---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 1h
  values:
    controllers:
      home-assistant:
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node.network/vlan-iot
                        operator: In
                        values:
                          - "true"
                      - key: node.network/vlan-security
                        operator: In
                        values:
                          - "true"

          annotations:
            k8s.v1.cni.cncf.io/networks: hass-iot-static, hass-security-static

          # IOT VLAN (20), SECURITY VLAN (40)
          priorityClassName: home-cluster-critical

          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 568
            runAsUser: 568
            supplementalGroups:
              - 1001

        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4.0@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec

            envFrom: &envFrom
              - secretRef:
                  name: *app

          venv-reset:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: &hassImage 2026.7.4@sha256:fc3c0b5f7c2ff61a81b3c84dfcc405d3ff28bfc73caf68fb5c31818515f3554e

            args:
              - |
                set -eu
                marker=/config/.hass-image-version
                current="$(python3 -c 'from homeassistant.const import __version__; print(__version__)')"
                previous="$(cat "$marker" 2>/dev/null || true)"
                if [ "$current" != "$previous" ]; then
                  echo "HA image changed ($previous -> $current); wiping /config/.venv"
                  rm -rf /config/.venv/* /config/.venv/.[!.]* 2>/dev/null || true
                  printf '%s' "$current" > "$marker"
                else
                  echo "HA image unchanged ($current); keeping /config/.venv cache"
                fi
            command: ["/bin/bash", "-c"]

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: *hassImage

            env:
              POSTGRES_HOST: postgres-home-assistant-rw.databases.svc.cluster.local
              POSTGRES_DB: home_assistant

            envFrom: *envFrom

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60

            resources:
              requests:
                cpu: 100m
                memory: 1536Mi
              limits:
                memory: 2Gi
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${SVC_HOME_ASSISTANT_ADDR}
        controller: home-assistant
        externalTrafficPolicy: Cluster
        ports:
          http:
            port: &httpPort 8123

    route:
      app:
        annotations:
          glance/name: "Home Assistant"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/home-assistant.png"
          glance/id: "Home Automation"

        hostnames:
          - "hass.${SECRET_DOMAIN}"
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      config:
        existingClaim: home-assistant-config-pvc
        globalMounts:
          - path: /config

      config-cache:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        advancedMounts:
          home-assistant:
            app:
              - path: /config/.venv
            venv-reset:
              - path: /config/.venv

      media:
        existingClaim: home-assistant-media-pvc
        globalMounts:
          - path: /media

      tmp:
        type: emptyDir
