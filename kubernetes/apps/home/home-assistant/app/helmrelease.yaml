---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 1h
  # Home Assistant runs forward-only recorder schema migrations at
  # startup, so rolling the image back cannot un-migrate the database —
  # the same shape that wedged romm for ~2h (#13383). This HelmRelease
  # previously declared no install/upgrade block at all and inherited
  # Helm's 5m default while waiting, with rollback remediation.
  #
  # The recorder DB measures 8.5 GiB live (the 120Gi elsewhere is the
  # provisioned PVC, not the data). An ALTER TABLE on states/events at
  # that size can still run past 5m, and this is household-facing — lights,
  # locks and climate — so failing forward and staying visible as
  # Ready=False beats reverting into a version that cannot read its own
  # schema.
  #
  # retries: 0 is set in the cluster-apps exclusion patch, not here: the
  # cluster-wide HelmRelease patch overrides any retries value declared
  # at this level (see kubernetes/flux/cluster/ks.yaml).
  install:
    timeout: 30m
  upgrade:
    timeout: 30m
    cleanupOnFail: true
  values:
    controllers:
      home-assistant:
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node.network/vlan-iot
                        operator: In
                        values:
                          - "true"
                      - key: node.network/vlan-security
                        operator: In
                        values:
                          - "true"

          annotations:
            k8s.v1.cni.cncf.io/networks: hass-iot-static, hass-security-static

          # IOT VLAN (20), SECURITY VLAN (40)
          priorityClassName: home-cluster-critical

          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 568
            runAsUser: 568
            supplementalGroups:
              - 1001

        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b

            envFrom: &envFrom
              - secretRef:
                  name: *app

          venv-reset:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: &hassImage 2026.9.3@sha256:638c4c8d62caad377e70bfa7beef75f70c9343a49aed64aad824f2cd06843c1c

            args:
              - |
                set -eu
                marker=/config/.hass-image-version
                current="$(python3 -c 'from homeassistant.const import __version__; print(__version__)')"
                previous="$(cat "$marker" 2>/dev/null || true)"
                if [ "$current" != "$previous" ]; then
                  echo "HA image changed ($previous -> $current); wiping /config/.venv"
                  rm -rf /config/.venv/* /config/.venv/.[!.]* 2>/dev/null || true
                  printf '%s' "$current" > "$marker"
                else
                  echo "HA image unchanged ($current); keeping /config/.venv cache"
                fi
            command: ["/bin/bash", "-c"]

            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: *hassImage

            env:
              POSTGRES_HOST: postgres-home-assistant-rw.databases.svc.cluster.local
              POSTGRES_DB: home_assistant

            envFrom: *envFrom

            probes:
              # Liveness is DELIBERATELY far more forgiving than readiness.
              # It previously shared one YAML anchor with readiness — period
              # 10s, timeout 5s, failureThreshold 3 — so 30 seconds of slow
              # responses killed the container. That is well inside normal
              # behaviour for this instance: HA's post-startup phase blocks
              # the event loop while setting up 400+ devices, so `/` can take
              # longer than 5s for a minute at a time.
              #
              # The startup probe does NOT cover that window. It passes as
              # soon as 8123 accepts connections (~40s, "Home Assistant
              # initialized in 39.42s"), which is long before integration
              # setup finishes — so liveness takes over during the single
              # heaviest phase of the boot and kills it mid-work.
              #
              # Observed 2026-07-31: 3 restarts inside ~2 minutes, each
              # "Liveness probe failed: context deadline exceeded" -> Killing
              # -> exit 143. NOT OOM: memory was 946Mi against the 2Gi limit
              # below (46%), and lastState reason was Error/143, not
              # OOMKilled. Every restart flaps every Z-Wave / BLE / MQTT
              # entity in the house `unavailable -> unknown -> off` for ~12s,
              # so a spurious restart is a household-visible event.
              #
              # Now 120s of *sustained* unresponsiveness (12 x 10s) with a
              # 10s per-probe timeout before a kill. A genuine hang still
              # gets restarted; a busy event loop no longer does.
              #
              # Raising the timeout rather than switching to a lighter path
              # is deliberate — the bottleneck is the blocked asyncio event
              # loop, not response size, so no endpoint would answer faster.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 12
              # Readiness stays tight on purpose. Pulling a genuinely
              # unresponsive pod out of the LoadBalancer is cheap and
              # reversible; restarting it is neither. Only the restart
              # decision needed loosening, which is why the shared anchor
              # had to go.
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8123
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60

            resources:
              requests:
                cpu: 100m
                memory: 1536Mi
              limits:
                memory: 2Gi
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${SVC_HOME_ASSISTANT_ADDR}
        controller: home-assistant
        externalTrafficPolicy: Cluster
        ports:
          http:
            port: &httpPort 8123

    route:
      app:
        annotations:
          glance/name: "Home Assistant"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/home-assistant.png"
          glance/id: "Home Automation"

        hostnames:
          - "hass.${SECRET_DOMAIN}"
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      config:
        existingClaim: home-assistant-config-pvc
        globalMounts:
          - path: /config

      config-cache:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        advancedMounts:
          home-assistant:
            app:
              - path: /config/.venv
            venv-reset:
              - path: /config/.venv

      media:
        existingClaim: home-assistant-media-pvc
        globalMounts:
          - path: /media

      tmp:
        type: emptyDir
    externalSecrets:
      home-assistant:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: home-assistant
          creationPolicy: Owner
          template:
            data:
              # App
              HASS_TOKEN: "{{ .HASS_TOKEN }}"
              HASS_POSTGRES_URL: "postgresql://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@postgres-home-assistant-rw.databases.svc.cluster.local/home_assistant"
              # Postgres Init
              INIT_POSTGRES_DBNAME: home_assistant
              INIT_POSTGRES_HOST: postgres-home-assistant-rw.databases.svc.cluster.local
              INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
              INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
              INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        dataFrom:
          - extract:
              key: home-assistant
          - extract:
              key: cloudnative-pg
      home-assistant-config-sync:
        forceRename: home-assistant-config-sync
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: home-assistant-config-sync
          creationPolicy: Owner
          template:
            data:
              ssh-private-key: "{{ index . `ssh-private-key` }}"
              ha-token: "{{ index . `ha-token` }}"
              known-hosts: "{{ index . `known-hosts` }}"
        dataFrom:
          - extract:
              key: home-assistant-config-sync
    networkpolicies:
      allow:
        type: cilium
        forceRename: home-assistant-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: home-assistant
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # HTTPRoute on EXTERNAL gateway (via cloudflared tunnel) →
          # home-assistant:8123. Also reached directly on LAN via the
          # LoadBalancer VIP (SVC_HOME_ASSISTANT_ADDR).
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8123"
                    protocol: TCP
          # LAN clients hitting the LoadBalancer VIP for the HA UI / native
          # app, and the in-cluster prometheus scrape config that uses the
          # HA REST API (not the standard /metrics endpoint, so the baseline
          # allow-monitoring-scrape may not match — explicit here).
          - fromEntities:
              - world
              - host
              - remote-node
              - cluster
            toPorts:
              - ports:
                  - port: "8123"
                    protocol: TCP
          # home-assistant-config-sync CronJob (same ns) calls
          # /api/services/homeassistant/reload_all after a successful `git
          # pull`. Sync pod's egress to HA is the matching half of this hole.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: home
                  app.kubernetes.io/name: home-assistant-config-sync
            toPorts:
              - ports:
                  - port: "8123"
                    protocol: TCP
        egress:
          # Postgres recorder backend (Pattern B — CNPG cluster in databases).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  cnpg.io/cluster: postgres-home-assistant
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
          # smtp-relay in same ns for HA notifications. Intra-namespace, but
          # listed for grep-ability.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: home
                  app.kubernetes.io/name: smtp-relay
            toPorts:
              - ports:
                  - port: "2525"
                    protocol: TCP
          # Media integrations (Pattern E — cross-ns to specific apps):
          # HA's `media_player.jellyfin` integration and the Music Assistant
          # integration both initiate connections from HA → media ns.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: jellyfin
            toPorts:
              - ports:
                  - port: "8096"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: music-assistant
            toPorts:
              - ports:
                  - port: "8095"
                    protocol: TCP
          # Prometheus consumer integration (Pattern E — cross-ns to specific
          # app). HA scrapes kube-prometheus-stack Prometheus for in-cluster
          # metrics (GPU utilization, UPS, Ceph health, etc.) and surfaces
          # them on Lovelace dashboards. Selector matches the Prometheus
          # StatefulSet pod exclusively (not alertmanager, not the operator).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: observability
                  app.kubernetes.io/name: prometheus
            toPorts:
              - ports:
                  - port: "9090"
                    protocol: TCP
          # Home Assistant integrations call out to an unbounded set of cloud
          # APIs (weather, Pushover, OpenAI, voice cloud services, Frigate
          # MQTT/HTTP, calendar, etc.) plus arbitrary user-installed HACS
          # integrations. The set is user-driven and changes per-config;
          # toEntities:world is the only practical option. Documented as
          # intentional per the rollout-plan design decisions.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "80"
                    protocol: TCP
                  - port: "8883"
                    protocol: TCP # external MQTT-TLS brokers
                  - port: "1883"
                    protocol: TCP # external MQTT plain (Mosquitto.org test broker, etc)
          # LAN device polling — these reach physical hosts on the main home
          # subnet via eth0 (Cilium-governed), not via the multus secondary
          # NICs. The IoT/security-VLAN NICs handle discovery/polling on
          # 10.10.20.x / 10.10.40.x and bypass Cilium.
          #
          # TCP 9090 — Kodi JSON-RPC. Five `kodi` integrations are configured
          # in HA (kodi-bedroom .5, kodi-? .6, kodi-? .7, kodi-familyroom .11,
          # kodi-? .14), all polling Kodi's EventServer/JSON-RPC on 9090.
          - toCIDR:
              - 192.168.1.0/24
            toPorts:
              - ports:
                  - port: "9090"
                    protocol: TCP
          # SNMP polling — UPSes on the management subnet (.5.36 = UPS-3000,
          # .5.65 = UPS-1500, SmartConnect cards) and the Dell R730xd iDRAC
          # on the main LAN. Both via SNMP v2c, community `public`.
          # See [[reference_rack_ups_topology]] + [[reference_beast_idrac_power_probes]].
          - toCIDR:
              - 192.168.1.22/32
              - 192.168.5.0/24
            toPorts:
              - ports:
                  - port: "161"
                    protocol: UDP
          # IPP printer (Brother MFC-J895DW) on the management subnet. The
          # `ipp` integration is currently in setup_retry without this rule.
          - toCIDR:
              - 192.168.5.29/32
            toPorts:
              - ports:
                  - port: "631"
                    protocol: TCP
          # LAN integrations that poll over various TCP ports on the main
          # home subnet (192.168.1.0/24):
          #   * 23    — Denon AVR Telnet control protocol (.1.12)
          #   * 8080  — Denon AVR HTTP (denon.${SECRET_DOMAIN} / .1.12)
          #   * 60006 — Denon HEOS protocol (same host as 8080)
          #   * 8043  — Omada Controller HTTPS UI on brain (.1.1)
          #   * 19444 — Hyperion JSON-RPC on kodi-familyroom (.1.11)
          #   * 61208 — Glances on brain (.1.1) + beast (.1.27)
          - toCIDR:
              - 192.168.1.0/24
            toPorts:
              - ports:
                  - port: "23"
                    protocol: TCP
                  - port: "8080"
                    protocol: TCP
                  - port: "60006"
                    protocol: TCP
                  - port: "8043"
                    protocol: TCP
                  - port: "19444"
                    protocol: TCP
                  - port: "61208"
                    protocol: TCP
          # LG webOS TVs on the management subnet expose the WebSocket API
          # on TCP 3000. lg-familyroom (.5.44) + lg-bedroom (.5.26).
          - toCIDR:
              - 192.168.5.0/24
            toPorts:
              - ports:
                  - port: "3000"
                    protocol: TCP
          # In-cluster Ollama (ai/ollama-0:11434). HA's `ollama` custom
          # integration / template REST sensor calls the API for LLM-driven
          # automations and sensor enrichment.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: ollama
            toPorts:
              - ports:
                  - port: "11434"
                    protocol: TCP
          # LAN discovery multicast/broadcast from HA's eth0 interface. HA's
          # `zeroconf` and `ssdp` integrations bind to all interfaces by
          # default and emit periodic discovery on the cilium-governed pod
          # network alongside the multus IoT/SECURITY VLAN NICs. Cilium
          # classifies multicast/broadcast destinations as `world`.
          #
          #   * UDP 5353 — mDNS, dest 224.0.0.251 (zeroconf integration)
          #   * UDP 1900 — SSDP/UPnP, dest 239.255.255.250 (multicast)
          #                + 255.255.255.255 (broadcast) — used by the ssdp
          #                integration to discover Sonos, Roku, smart-TVs,
          #                DLNA renderers, etc.
          #
          # The multus macvlan NICs (hass-iot-static on VLAN 20,
          # hass-security-static on VLAN 40) handle the bulk of real LAN
          # discovery and bypass Cilium entirely. eth0 discovery is allowed
          # here so HA's defaults work without policy noise — without these
          # rules, boot-time scans generate >1000 POLICY_DENIED drops in 2m
          # and trip CiliumPolicyDropBurst.
          #
          # (Background: IGMP membership reports HA sends on eth0 still drop
          # at CT_UNKNOWN_L4_PROTOCOL — cilium conntrack doesn't track IGMP.
          # Below alert thresholds; not fixable via CNP.)
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "5353"
                    protocol: UDP
                  - port: "1900"
                    protocol: UDP
      config-sync-allow:
        type: cilium
        forceRename: home-assistant-config-sync-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: home-assistant-config-sync
        # Additive — default-deny in `home` ns is what triggers the lockdown;
        # these rules punch holes through it for the 5-min git pull + HA
        # reload_all flow.
        enableDefaultDeny:
          egress: false
          ingress: false
        egress:
          # SSH to github.com to fetch + pull config. Cilium FQDN matching for
          # `github.com` is feasible but the SSH session is short-lived and the
          # broader world:22 entity already constrains by port — narrow enough
          # for this single-purpose pod.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "22"
                    protocol: TCP
          # /api/services/homeassistant/reload_all on the home-assistant pod
          # after a successful pull. Intra-namespace, but explicit for
          # grep-ability — and the home-assistant-allow CNP only opens the
          # 8123 ingress to specific labelled clients.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: home
                  app.kubernetes.io/name: home-assistant
            toPorts:
              - ports:
                  - port: "8123"
                    protocol: TCP
