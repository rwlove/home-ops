---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-code
spec:
  # Long-lived HA access token for the Config Helper extension
  # (keesschollaart.vscode-home-assistant), which reads HASS_SERVER/HASS_TOKEN
  # from the environment to validate and autocomplete entities/services.
  # A dedicated token (not the config-sync one) so it can be revoked alone.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: home-assistant-code
    template:
      data:
        HASS_TOKEN: "{{ index . `ha-token` }}"
  dataFrom:
    - extract:
        key: home-assistant-code
