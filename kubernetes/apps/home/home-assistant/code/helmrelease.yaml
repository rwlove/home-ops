---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant-code
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  dependsOn:
    - name: home-assistant
      namespace: home

  values:
    controllers:
      home-assistant-code:
        pod:
          # Match the HA app's UID (568) so files created via the web
          # editor are readable by HA without a chown; the shared
          # /config PVC is already world-writable and populated with
          # 568:568 ownership, so no data migration is needed.
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        containers:
          app:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.135.0@sha256:ccd326184d71efc5ebb94155eda7bb30153902342a35dbc8525450d81aa55012

            env:
              # code-server writes $HOME/.config/code-server/config.yaml at
              # startup; point HOME at the shared PVC so runAsUser 2000
              # can write it. Prior default was /root (unwritable non-root).
              HOME: /config
            args:
              - --auth
              - none
              - --user-data-dir
              - /config/.vscode
              - --extensions-dir
              - /config/.vscode
              - --port
              - "8080"
              - /config

            resources:
              requests:
                cpu: 10m
                memory: 640M
              limits:
                memory: 640M

    service:
      app:
        controller: home-assistant-code
        ports:
          http:
            port: &httpPort 8080

    route:
      app:
        annotations:
          glance/name: "Home Assistant Code"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/vscode.png"
          glance/id: "Home Automation"

        hostnames:
          - "hass-code.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      config:
        existingClaim: home-assistant-config-pvc
        globalMounts:
          - path: /config
