---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant-code
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  dependsOn:
    - name: home-assistant
      namespace: home

  values:
    controllers:
      home-assistant-code:
        pod:
          # Match the HA app's UID (568) so files created via the web
          # editor are readable by HA without a chown; the shared
          # /config PVC is already world-writable and populated with
          # 568:568 ownership, so no data migration is needed.
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        # code-server state lives in /config/.code-server, NOT /config/.vscode:
        # /config is also the opened workspace, so its .vscode/ is the
        # *workspace* settings folder, and sharing it with --user-data-dir made
        # stale workspace settings override the user settings below.
        # The seed step runs as the pod user (568). /config is world-writable,
        # so no root chown is needed (the old init-perms step only reclaimed a
        # one-off 1000-owned /config/.vscode, already 568:568).
        initContainers:
          seed:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.146.0@sha256:fc708b18f6c613b5a9d00f1d1801e58376d3df9c5b5de77f5c02d67b711f99c9
            env:
              HOME: /config
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                data=/config/.code-server/data
                ext=/config/.code-server/extensions
                mkdir -p "$data/User" "$ext"
                # Git wins: user settings are replaced from the ConfigMap on
                # every start. Change them in resources/settings.json.
                cp /seed/settings.json "$data/User/settings.json"
                # Install only what's missing (the running editor auto-updates
                # extensions itself). Additive and best-effort: an Open VSX
                # outage must not keep the editor from starting.
                have=$(code-server --extensions-dir "$ext" --list-extensions 2>/dev/null | tr 'A-Z' 'a-z')
                grep -Ev '^[[:space:]]*(#|$)' /seed/extensions.txt | while read -r id; do
                  lc=$(echo "$id" | tr 'A-Z' 'a-z')
                  echo "$have" | grep -qx "$lc" && continue
                  code-server --user-data-dir "$data" --extensions-dir "$ext" \
                    --install-extension "$id" \
                    || echo "WARN: failed to install $id"
                done

        containers:
          app:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.146.0@sha256:fc708b18f6c613b5a9d00f1d1801e58376d3df9c5b5de77f5c02d67b711f99c9

            env:
              # code-server writes $HOME/.config/code-server/config.yaml at
              # startup; point HOME at the shared PVC so runAsUser 568
              # can write it. Prior default was /root (unwritable non-root).
              HOME: /config
              # Config Helper extension → HA API for entity/service validation.
              # Intra-namespace, so the baseline allow-intra-namespace CNP covers
              # it. HASS_TOKEN comes from envFrom below.
              HASS_SERVER: http://home-assistant.home.svc.cluster.local:8123
            # optional: the editor still starts if the secret is missing.
            envFrom:
              - secretRef:
                  name: home-assistant-code
                  optional: true
            args:
              - --auth
              - none
              - --user-data-dir
              - /config/.code-server/data
              - --extensions-dir
              - /config/.code-server/extensions
              - --port
              - "8080"
              - /config

            # Request trimmed to 14d max_over_time peak (85Mi) * 1.15;
            # limit unchanged at 640M.
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 640M

    service:
      app:
        controller: home-assistant-code
        ports:
          http:
            port: &httpPort 8080

    route:
      app:
        annotations:
          glance/name: "Home Assistant Code"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/vscode.png"
          glance/id: "Home Automation"

        hostnames:
          - "hass-code.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      config:
        existingClaim: home-assistant-config-pvc
        globalMounts:
          - path: /config
      seed:
        type: configMap
        name: home-assistant-code-settings
        advancedMounts:
          home-assistant-code:
            seed:
              - path: /seed
                readOnly: true
    networkpolicies:
      allow:
        type: cilium
        forceRename: home-assistant-code-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: home-assistant-code
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal HTTPRoute (envoy → home-assistant-code:8080) — code-server
          # UI. Runs with --auth none; internal gateway is LAN-only so no oauth.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        egress:
          # code-server fetches extensions / opens a terminal that can pull
          # from the web (git clone, npm install, etc). User-driven, scope
          # unbounded — toEntities:world.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "80"
                    protocol: TCP
