---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant-code
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  dependsOn:
    - name: home-assistant
      namespace: home

  values:
    controllers:
      home-assistant-code:
        pod:
          # Match the HA app's UID (568) so files created via the web
          # editor are readable by HA without a chown; the shared
          # /config PVC is already world-writable and populated with
          # 568:568 ownership, so no data migration is needed.
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        # /config/.vscode (--user-data-dir / --extensions-dir) was created
        # uid=1000(coder):gid=1000 mode 0700 on 2026-07-02 13:20 — the
        # window between #12790 (set runAsUser:568) and #12794 (fixed
        # HOME=/config): the first rollout crashed on an unwritable
        # $HOME/.config and Helm auto-rolled the StatefulSet back to its
        # prior root-uid spec, during which code-server's image ran its
        # fixuid dance and wrote .vscode as the image-native coder user.
        # runAsUser 568 is deliberate (matches HA's UID so web-editor
        # writes need no chown) and the rest of /config is already 568:568
        # — fsGroupChangePolicy:OnRootMismatch never revisits that one
        # leftover dir because its own parent/root already matches.
        # Reclaim just .vscode on startup; idempotent + self-heals, and
        # scoped tightly so it never touches HA's own /config data.
        # Mirrors the established init-perms pattern used by other
        # app-template HelmReleases in this repo for a stale UID that
        # survives an fsGroupChangePolicy:OnRootMismatch skip.
        initContainers:
          init-perms:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.145.0@sha256:992796b850b8b7ec6f7393b8dd2295840a65cf5071981990ff41ef52dd566c43
            command:
              - chown
              - -R
              - 568:568
              - /config/.vscode
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false

        containers:
          app:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.145.0@sha256:992796b850b8b7ec6f7393b8dd2295840a65cf5071981990ff41ef52dd566c43

            env:
              # code-server writes $HOME/.config/code-server/config.yaml at
              # startup; point HOME at the shared PVC so runAsUser 2000
              # can write it. Prior default was /root (unwritable non-root).
              HOME: /config
            args:
              - --auth
              - none
              - --user-data-dir
              - /config/.vscode
              - --extensions-dir
              - /config/.vscode
              - --port
              - "8080"
              - /config

            # Request trimmed to 14d max_over_time peak (85Mi) * 1.15;
            # limit unchanged at 640M.
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 640M

    service:
      app:
        controller: home-assistant-code
        ports:
          http:
            port: &httpPort 8080

    route:
      app:
        annotations:
          glance/name: "Home Assistant Code"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/vscode.png"
          glance/id: "Home Automation"

        hostnames:
          - "hass-code.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      config:
        existingClaim: home-assistant-config-pvc
        globalMounts:
          - path: /config
    networkpolicies:
      allow:
        type: cilium
        forceRename: home-assistant-code-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: home-assistant-code
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal HTTPRoute (envoy → home-assistant-code:8080) — code-server
          # UI. Runs with --auth none; internal gateway is LAN-only so no oauth.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        egress:
          # code-server fetches extensions / opens a terminal that can pull
          # from the web (git clone, npm install, etc). User-driven, scope
          # unbounded — toEntities:world.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "80"
                    protocol: TCP
