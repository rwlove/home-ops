---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/repos/app-template
resources:
  - ./helmrelease.yaml
configMapGenerator:
  - name: home-assistant-code-settings
    files:
      - extensions.txt=./resources/extensions.txt
      - settings.json=./resources/settings.json
generatorOptions:
  disableNameSuffixHash: true
