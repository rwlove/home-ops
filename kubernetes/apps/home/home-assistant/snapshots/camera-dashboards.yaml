# yamllint disable
# ------------------------------------------------------------------------------
# POINT-IN-TIME SNAPSHOT of Home Assistant's storage-mode camera dashboards.
# NOT loaded by HA and NOT part of any kustomization — this is a reviewable /
# rollback reference only. The live source of truth is HA's .storage on the
# home-assistant PVC (storage-mode, UI-edited), which is gitignored in the
# home-assistant-config repo. Regenerate with:
#   kubectl exec -n home home-assistant-0 -c app -- cat /config/.storage/lovelace.lovelace | jq '.data.config.views[] | select(.title=="Cameras")'
#   kubectl exec -n home home-assistant-0 -c app -- cat /config/.storage/lovelace.dashboard_frigage
# Captured 2026-09-13. See review: go2rtc MSE live path; advanced-camera-card.
# ------------------------------------------------------------------------------
sidebar_cameras_dashboard_frigage:
  strategy:
    type: iframe
    url: https://frigate.thesteamedcrab.com
home_dashboard_cameras_view:
  type: sections
  max_columns: 4
  title: Cameras
  path: cameras
  icon: mdi:cctv
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Front Yard
      heading_style: title
    - type: custom:advanced-camera-card
      cameras:
      - camera_entity: camera.amcrest_frontyard
  - type: grid
    cards:
    - type: heading
      heading_style: title
      heading: Garage
    - type: custom:advanced-camera-card
      cameras:
      - camera_entity: camera.amcrest_garage
  - type: grid
    cards:
    - type: heading
      heading: Deck and Back Gate
      heading_style: title
    - type: custom:advanced-camera-card
      cameras:
      - camera_entity: camera.loryta_deck
  - type: grid
    cards:
    - type: heading
      heading: Pool
      heading_style: title
    - type: custom:advanced-camera-card
      cameras:
      - camera_entity: camera.amcrest_pool
  - type: grid
    cards:
    - type: heading
      heading: Front Door
      heading_style: title
    - type: custom:advanced-camera-card
      cameras:
      - camera_entity: camera.reolink_frontdoor
  - type: grid
    cards:
    - type: heading
      heading: Bush
      heading_style: title
    - type: custom:advanced-camera-card
      cameras:
      - camera_entity: camera.reolink_bush
  - type: grid
    cards:
    - type: heading
      heading: Birdcam
      heading_style: title
    - type: custom:advanced-camera-card
      cameras:
      - camera_entity: camera.birdcam
  cards: []
  theme: Mushroom Shadow
