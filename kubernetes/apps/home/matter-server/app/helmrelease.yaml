---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app matter-server
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  dependsOn: []

  install:
    remediation:
      retries: -1

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    controllers:
      *app :
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node.network/vlan-iot
                        operator: In
                        values:
                          - "true"

          annotations:
            k8s.v1.cni.cncf.io/networks: matter-server-iot-static

          # IOT VLAN (20)
          priorityClassName: home-cluster-critical

          securityContext:
            fsGroup: 0
            fsGroupChangePolicy: "OnRootMismatch"
            runAsGroup: 0
            runAsNonRoot: false               # Must be run as root user
            runAsUser: 0                      # Must be run as root user
            supplementalGroups:
              - 34

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          *app :
            image:
              repository: ghcr.io/home-assistant-libs/python-matter-server
              tag: 8.1.0@sha256:170aa093ce91c76cde4cc390918307590f0f5558fcec93f913af3cb019e6562a
              pullPolicy: IfNotPresent

            args:
              - --storage-path=/data
              - --primary-interface=net1
              - --log-level=debug
              - --log-level-sdk=info

            env:
              MATTER_SERVER__INSTANCE_NAME: *app
              MATTER_SERVER__PORT: &httpPort 5580
              MATTER_SERVER__APPLICATION_URL: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
              MATTER_SERVER__LOG_LEVEL: info

            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                # req≠lim on purpose: the CHIP SDK working set peaks well
                # above idle; 100M req==lim OOMKilled (137) under load.
                memory: 512Mi

    service:
      *app :
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${SVC_MATTER_ADDR}
        controller: *app
        externalTrafficPolicy: Local
        ports:
          http:
            port: *httpPort

    route:
      main:
        annotations:
          glance/name: "Matter Server"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/matter.png"
          glance/id: "Home Automation"
          # Point the Glance tile at the LoadBalancer VIP:5580 rather than
          # the https://matter route. The bundled dashboard auto-connects
          # its WebSocket only when the page URL contains ":5580" (or an HA
          # ingress path); on the plain https host it prompts for a WS URL.
          # Hitting the VIP on 5580 makes it self-connect — no prompt.
          glance/url: "http://${SVC_MATTER_ADDR}:5580/"

        hostnames:
          - "matter.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: *app
                port: *httpPort
    persistence:
      data:
        existingClaim: matter-server-data-pvc

      tmp:
        type: emptyDir
        medium: Memory
    networkpolicies:
      allow:
        type: cilium
        forceRename: matter-server-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: matter-server
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it. home-assistant in same ns is the only
        # in-cluster consumer; baseline allow-intra-namespace covers that.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal HTTPRoute (envoy → matter-server:5580) — debug UI.
          # LAN clients hit the LoadBalancer VIP (SVC_MATTER_ADDR) directly.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "5580"
                    protocol: TCP
          - fromEntities:
              - world
              - host
              - remote-node
            toPorts:
              - ports:
                  - port: "5580"
                    protocol: TCP
        # NOTE: Matter devices live on the IoT VLAN and are reached via
        # the multus-attached secondary NIC (matter-server-iot-static,
        # --primary-interface=net1). All device traffic bypasses Cilium
        # entirely.
        egress:
          # PAA root-cert bootstrap (device attestation) + vendor info (DCL),
          # both fetched at startup over the primary (eth0) NIC. Without them
          # the server fetches 0 PAA certs and commissioning CERTIFIED Matter
          # devices fails attestation. The namespace default-deny blocks this
          # by default; the baseline allow-dns L7 rule populates Cilium's FQDN
          # cache so these toFQDNs entries resolve. Widen to toEntities:world
          # on 443 (node-red pattern) only if PAA fetch still reports 0.
          # The dev/test PAA set is listed via api.github.com then each cert is
          # pulled from raw.githubusercontent.com — both are needed, and without
          # the raw host startup stalls ~2min timing out before init completes.
          - toFQDNs:
              - matchName: api.github.com
              - matchName: raw.githubusercontent.com
              - matchName: on.dcl.csa-iot.org
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
