---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbox
  labels:
    # Hand-off to the chart's own httpRoute (next PR). The prune label keeps
    # this object in place when the file goes away, and the Helm ownership
    # metadata lets the netbox release adopt it in place: no route gap.
    kustomize.toolkit.fluxcd.io/prune: disabled
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: netbox
    meta.helm.sh/release-namespace: home
    glance/name: "NetBox"
    glance/show: "true"
    glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/netbox-dark.png"
    glance/id: "Home Automation"
spec:
  hostnames: ["netbox.${SECRET_DOMAIN}"]
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: netbox
          namespace: home
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
