---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app smtp-relay
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      smtp-relay:

        pod:
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch

            runAsGroup: 568
            runAsUser: 568
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app

        annotations:
          reloader.stakater.com/auto: "true"

        replicas: 1

        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/foxcpp/maddy
              tag: 0.9.5@sha256:de42151adff6388edb5e4ee88f60334fa1ab85e309485193ecb1c2db20203315

            env:
              DEBUG: "true"
              SMTP_DOMAIN: "${SECRET_DOMAIN}"
              SMTP_SERVER: "smtp.mailgun.org"
              SMTP_USERNAME: "postmaster@${SECRET_DOMAIN}"
              SMTP_PORT: "465"
              SMTP_RELAY_SMTP_PORT: &port 2525
              # Guardrailed AGENT submission endpoint (Tier 1). Separate port
              # so the additive maddy listener can't touch the :2525 path.
              # AGENT_NOTIFY_RCPT (the only allowed recipient) comes from the
              # smtp-relay secret via envFrom below — kept OUT of git.
              SMTP_RELAY_AGENT_PORT: &agentPort 2526
              SMTP_RELAY_METRICS_PORT: &metricsPort 8080

            envFrom:
              - secretRef:
                  name: *app

            resources:
              requests:
                cpu: 15m
                memory: 64M
              limits:
                memory: 64M

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${SVC_SMTP_RELAY_ADDR}
        externalTrafficPolicy: Local
        ports:
          metrics:
            port: *metricsPort
          smtp:
            port: *port
          smtp-agent:
            port: *agentPort
    persistence:
      cache:
        type: emptyDir
        medium: Memory
      config:
        type: configMap
        name: *app
        globalMounts:
          - path: /data/maddy.conf
            subPath: maddy.conf
            readOnly: true

    externalSecrets:
      smtp-relay:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: smtp-relay
          creationPolicy: Owner
          template:
            data:
              SMTP_PASSWORD: "{{ .SMTP_RELAY_PASSWORD }}"
              # Recipient allowlist for the guardrailed agent endpoint (2526):
              # the ONLY address agents may email. Kept out of git — Rob must
              # add property `agent_notify_rcpt` to the 1Password `smtp-relay`
              # item with his notification address before this endpoint works.
              # Consumed by maddy.conf as {env:AGENT_NOTIFY_RCPT} via the
              # container's envFrom secretRef on this same secret.
              AGENT_NOTIFY_RCPT: "{{ .agent_notify_rcpt }}"
        dataFrom:
          - extract:
              key: smtp-relay
    networkpolicies:
      allow:
        type: cilium
        forceRename: smtp-relay-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: smtp-relay
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # In-cluster SMTP clients post mail to smtp-relay:2525. Known
          # consumers as of 2026-05-17:
          #   auth/lldap         — LLDAP_SMTP_OPTIONS__SERVER
          #   auth/authelia      — Authelia SMTP notifier
          #   home/netbox        — netbox email.server
          #   home/home-assistant — HA notify SMTP integration
          #   home/windmill      — watcher-workflow email notifications
          #   collab/monica      — CRM verification + reminder email
          # Plus LoadBalancer VIP (SVC_SMTP_RELAY_ADDR) so LAN devices
          # / cron scripts on hosts can submit mail too.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: auth
                  app.kubernetes.io/name: lldap
              - matchLabels:
                  io.kubernetes.pod.namespace: auth
                  app.kubernetes.io/name: authelia
              - matchLabels:
                  io.kubernetes.pod.namespace: home
                  app.kubernetes.io/name: netbox
              - matchLabels:
                  io.kubernetes.pod.namespace: home
                  app.kubernetes.io/name: home-assistant
              - matchLabels:
                  io.kubernetes.pod.namespace: home
                  app.kubernetes.io/name: windmill-workers
              - matchLabels:
                  io.kubernetes.pod.namespace: collab
                  app.kubernetes.io/name: monica
            toPorts:
              - ports:
                  - port: "2525"
                    protocol: TCP
          - fromEntities:
              - world
              - host
              - remote-node
            toPorts:
              - ports:
                  - port: "2525"
                    protocol: TCP
          # Guardrailed AGENT submission endpoint (2526) — Tier 1. Only the
          # in-cluster agent tier may reach it; the maddy listener on this port
          # further restricts them to a single recipient + fixed sender + rate
          # cap (see resources/maddy.conf), so admitting a caller here cannot
          # widen what it can send. Sole caller: mcp-system/notify-mcp — the
          # themed notify_rob tool + /send route used by every kagent agent and
          # the local-cron digests (egress in mcp-system/notify-mcp/app/cnp-allow.yaml).
          # Without this, notify-mcp -> relay is silently dropped and NO agent
          # email is ever delivered (the relay is the last hop). Deliberately NOT
          # reachable from world/host — agents post from inside the cluster only.
          # (ai/local-cron no longer hits the relay directly — notify.sh was
          # retired; it now emails via notify-mcp /send.)
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  app.kubernetes.io/name: notify-mcp
            toPorts:
              - ports:
                  - port: "2526"
                    protocol: TCP
        egress:
          # Outbound to Mailgun on the SMTPS submission port (465). See
          # memory project_smtp_relay_broken_since_day1.md — must be
          # `tls://` on 465, NOT starttls.
          #
          # smtp.mailgun.org is a canonical FQDN. Per memory
          # project_cilium_matchpattern_fqdn_limits.md, Cilium 1.19
          # matchPattern silently fails for canonical FQDNs through K8s DNS
          # search-domain augmentation. Use toEntities:world+465, matches the
          # precedent in PRs #11498/#11512/#11517/#11533.
          - toEntities: [world]
            toPorts:
              - ports:
                  - port: "465"
                    protocol: TCP
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: metrics
