state_dir /cache/state
runtime_dir /cache/run

openmetrics tcp://0.0.0.0:{env:SMTP_RELAY_METRICS_PORT} { }

tls off
hostname {env:SMTP_DOMAIN}

smtp tcp://0.0.0.0:{env:SMTP_RELAY_SMTP_PORT} {
    debug {env:DEBUG}
    default_source {
        deliver_to &remote_queue
    }
}

# ---------------------------------------------------------------------------
# Guardrailed AGENT submission endpoint (Tier 1).
#
# A SECOND, additive smtp listener on SMTP_RELAY_AGENT_PORT (2526) for
# in-cluster agents (crons today). It is DELIBERATELY separate from the
# :2525 block above so a bug here can never widen what the shared human/app
# relay accepts. Three guardrails, all confirmed against maddy docs:
#
#   1. Rate limit — `limits { all rate <burst> <period> }`. `all` scope caps
#      TOTAL throughput; period defaults to 1s if omitted, so `20 1h` = 20
#      msgs/hour across every agent. A runaway loop can't blast Mailgun.
#      Ref: https://maddy.email/reference/endpoints/smtp/ (Limits directive).
#
#   2. Sender lock — `modify { replace_sender regexp ".*" "<addr>" }` at the
#      top of the endpoint applies to EVERY message. regexp tables default to
#      `full_match yes`, so ".*" matches the whole envelope-from and rewrites
#      it to a fixed agents@ address regardless of what the client sent.
#      Ref: https://maddy.email/reference/modifiers/envelope/
#           https://maddy.email/reference/table/regexp/ (full_match default)
#
#   3. Recipient allowlist — a `destination {env:AGENT_NOTIFY_RCPT}` rule is
#      the ONLY accepted recipient; `default_destination { reject ... }`
#      refuses everything else. destination/default_destination must nest
#      inside a source block, hence default_source.
#      Ref: https://maddy.email/reference/smtp-pipeline/ (nesting + reject
#           smtp-code enhanced-code "message" syntax)
#
# Accepted mail funnels into the SAME &remote_queue → &remote_smtp → Mailgun
# path as :2525 (unchanged). Env vars: SMTP_RELAY_AGENT_PORT from the HR,
# AGENT_NOTIFY_RCPT from the smtp-relay secret (envFrom); Rob must populate
# it in 1Password (see externalSecrets in helmrelease.yaml).
smtp tcp://0.0.0.0:{env:SMTP_RELAY_AGENT_PORT} {
    debug {env:DEBUG}

    # Guardrail 3 — throughput cap (total, all agents): 20 messages / hour.
    limits {
        all rate 20 1h
    }

    # Guardrail 2 — force the envelope sender to agents@<domain>, always.
    modify {
        replace_sender regexp ".*" "agents@{env:SMTP_DOMAIN}"
    }

    default_source {
        # Guardrail 1 — the ONLY recipient agents may reach is Rob's address.
        destination {env:AGENT_NOTIFY_RCPT} {
            deliver_to &remote_queue
        }
        default_destination {
            reject 550 5.7.1 "agent relay: recipient not permitted"
        }
    }
}

target.queue remote_queue {
    debug {env:DEBUG}
    target &remote_smtp
}

target.smtp remote_smtp {
    debug {env:DEBUG}
    # Mailgun port 465 = SMTPS (implicit TLS from byte 1); use tls:// scheme.
    # Earlier config used tcp:// + `starttls yes` which expects plain TCP →
    # STARTTLS upgrade (port 587 semantics) and hung on port 465 because both
    # sides waited for the other to speak. Symptom: "read tcp ... :465: i/o
    # timeout" with no mail ever leaving the queue.
    auth plain {env:SMTP_USERNAME} {env:SMTP_PASSWORD}
    targets tls://{env:SMTP_SERVER}:{env:SMTP_PORT}
}
