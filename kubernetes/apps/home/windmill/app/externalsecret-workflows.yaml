---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: windmill-workflows
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: windmill-workflows-secret
    creationPolicy: Owner
    template:
      data:
        # Paperless RAG ingest / tombstone workflows. Same 1P item
        # (`paperless` / field `mcp_token`) that mcp-system/paperless-mcp
        # already uses — keeping a single token-rotation surface.
        PAPERLESS_TOKEN: "{{ .paperless_mcp_token }}"
        # LightRAG graph-RAG ingest (lightrag-rag-ingest / -tombstone).
        # api_key from the `lightrag` 1P item — same item the lightrag
        # ExternalSecret in ai ns reads (single rotation surface).
        LIGHTRAG_API_KEY: "{{ .lightrag_api_key }}"
        # Windmill API token used by the windmill-failure-watcher
        # workflow to query its own /api/w/lovenet/jobs/list_completed.
        # Mint via /api/users/tokens/create as admin@windmill.dev and
        # save into the `windmill` 1P item as field `windmill_api_token`.
        # If the field is missing or empty, the watcher fails fast with
        # "WINDMILL_TOKEN env not set" — other workflows are unaffected.
        WINDMILL_TOKEN: "{{ .windmill_api_token }}"
  dataFrom:
    # PAPERLESS_TOKEN (field=mcp_token, prefixed to avoid colliding
    # with the other extracted items below).
    - extract:
        key: paperless
      rewrite:
        - regexp:
            source: "(.*)"
            target: "paperless_$1"
    # LIGHTRAG_API_KEY (field=api_key on the `lightrag` 1P item, prefixed
    # to avoid colliding with other extracted items).
    - extract:
        key: lightrag
      rewrite:
        - regexp:
            source: "(.*)"
            target: "lightrag_$1"
    # windmill_api_token — for self-introspection (see WINDMILL_TOKEN
    # comment above).
    - extract:
        key: windmill
