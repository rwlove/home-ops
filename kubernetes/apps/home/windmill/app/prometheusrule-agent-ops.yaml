---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agent-ops-watchdog-rules
spec:
  groups:
    - name: agent-ops.watchdog
      rules:
        # Primary signal: the agent-ops-watchdog CronJob (sibling
        # agent-ops-watchdog-cronjob.yaml) fails its own run when it finds
        # either (a) >5 failed agent-ops jobs in the last 15m (DLQ-growth
        # proxy) or (b) the oldest queued job is >15m old (stuck-queue
        # proxy). A failed run is visible to Prometheus via
        # kube_job_failed (kube-state-metrics), same mechanism as every
        # other CronJob-shaped health check in this cluster.
        #
        # Deliberately NOT alerting on absence-of-success here (unlike
        # WindmillFailureDetectionStale below) — this check should fire
        # promptly on an actual problem, not only on blindness to one.
        - alert: AgentOpsQueueUnhealthy
          annotations:
            summary: agent-ops Windmill queue is unhealthy (DLQ growth or stuck jobs)
            description: |
              The agent-ops-watchdog CronJob detected either growing DLQ
              (>5 job failures in 15m) or a stuck queue (oldest queued job
              >15m old) in the agent-ops Windmill workspace.

              Check in order:
                kubectl -n home get jobs -l job-name --sort-by=.metadata.creationTimestamp | grep agent-ops-watchdog
                kubectl -n home logs job/<newest-agent-ops-watchdog-job>
                kubectl -n home get pods -l app.kubernetes.io/name=windmill

              Routing note: this routes to the `email` receiver, not
              Pushover (added 2026-10-03 — see
              observability/kube-prometheus-stack/app/alertmanagerconfig.yaml).
              It will not page.
          expr: |
            kube_job_failed{namespace="home", job_name=~"agent-ops-watchdog-.*", condition="true"} > 0
          for: 5m
          labels:
            severity: warning
        # Dead-man's switch, same rationale as WindmillFailureDetectionStale
        # in ../prometheusrule.yaml: if agent-ops-watchdog stops running
        # altogether (CronJob suspended, deleted, or wedged before it can
        # even hit the Windmill API), AgentOpsQueueUnhealthy above has
        # nothing to evaluate and DLQ growth goes undetected.
        - alert: AgentOpsWatchdogStale
          annotations:
            summary: agent-ops-watchdog has not completed successfully recently
            description: |
              No successful agent-ops-watchdog run in over 15 minutes.
              DLQ-growth and stuck-queue detection for the agent-ops
              Windmill workspace is currently blind.

              Check in order:
                kubectl -n home get cronjob agent-ops-watchdog
                kubectl -n home get jobs -l job-name --sort-by=.metadata.creationTimestamp | grep agent-ops-watchdog
                kubectl -n home logs job/<newest-agent-ops-watchdog-job>
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="home",cronjob="agent-ops-watchdog"} > 900
          for: 10m
          labels:
            severity: warning
        # Same "a switch that can vanish silently is not a switch" guard
        # as WindmillWatchdogMissing. Expected to fire briefly on first
        # deploy (15m for covers three */5 attempts) until the CronJob
        # has run at least once.
        - alert: AgentOpsWatchdogMissing
          annotations:
            summary: agent-ops-watchdog CronJob is not reporting to kube-state-metrics
            description: |
              No kube_cronjob_status_last_successful_time series exists for
              home/agent-ops-watchdog. Verify the CronJob exists and has
              run at least once:
                kubectl -n home get cronjob agent-ops-watchdog
          expr: |
            absent(kube_cronjob_status_last_successful_time{namespace="home",cronjob="agent-ops-watchdog"})
          for: 15m
          labels:
            severity: warning
        # Placeholder — pending M4/M6. Long-pending human approval
        # (the Windmill flow suspend step gated on notify-mcp/agent-callback
        # email HITL) has no TTL-expiry signal yet: the flow's approval
        # state is not exposed via any API this watchdog queries, and the
        # task contract's trace_id / approval-state labels don't exist
        # until M4 lands. Do NOT uncomment until a real query backs this —
        # an `expr` here today would either always-fire (absent() on a
        # metric that never existed) or never-fire (a query against a
        # label that's always unset), both of which are the "flap vs mute"
        # failure modes this file exists to avoid.
        # - alert: AgentOpsApprovalPendingTooLong
        #   annotations:
        #     summary: agent-ops task has been awaiting approval longer than its TTL
        #   expr: TODO — needs M4 approval-state exposure (trace_id/approval labels)
        #   for: 0m
        #   labels:
        #     severity: warning
