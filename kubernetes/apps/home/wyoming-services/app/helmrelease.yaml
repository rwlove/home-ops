---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wyoming-services
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      kokoro:
        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        # runAsNonRoot deferred: image ships kokoro-v1.0.onnx and
        # voices-v1.0.bin at mode 0600 root:root baked into the image
        # layer (not a volume, so fsGroup can't fix it). Live-verified
        # 2026-07-04: a UID 1000 process cannot open either file, so
        # the wyoming TTS server fails at startup as non-root. Applying
        # the capability/seccomp/RO hardening that doesn't require a
        # UID change instead; readOnlyRootFilesystem verified OK with
        # tmpfs /tmp (app writes per-request scratch dirs there;
        # synthesis cache itself is in-memory only).
        containers:
          main:
            image:
              repository: ghcr.io/nordwestt/kokoro-wyoming
              tag: 1.0.2@sha256:953b1487f06e1a7df89e80248996c7277dac448526031df31d293f00fadfa89b
            args:
              - --uri
              - tcp://0.0.0.0:10200
              - --voice
              - af_sky

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault

            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 2Gi

      openwakeword:
        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000

        containers:
          main:
            image:
              repository: docker.io/rhasspy/wyoming-openwakeword
              tag: 2.1.0@sha256:52cb1168731a1849fc28cf339c935fde58746bbabc94226668a40ef6ddf5d42b
            args:
              - --preload-model
              - "ok_nabu"
              - --custom-model-dir
              - /custom

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 1Gi

      whisper:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          nodeSelector:
            nvidia.com/gpu.present: "true"
          runtimeClassName: nvidia

        statefulset:
          volumeClaimTemplates:
            - name: data
              accessMode: ReadWriteOnce
              size: 5Gi
              storageClass: ceph-block
              globalMounts:
                - path: /config

        type: statefulset

        # runAsNonRoot + capabilities.drop deferred: this is a
        # linuxserver.io s6-overlay image. Live-verified 2026-07-04
        # two failure modes: (1) plain non-root (runAsUser 1000, no
        # LSIO_NON_ROOT_USER) fails preinit — "/run belongs to uid 0"
        # — even with an explicit tmpfs /run + fsGroup, s6-overlay's
        # privilege-drop step then hits
        # "s6-applyuidgid: fatal: unable to set supplementary group
        # list: Operation not permitted" once capabilities.drop: [ALL]
        # is also applied (setgroups() needs CAP_SETGID, which every
        # LSIO PUID/PGID-switching image needs regardless of pod-level
        # runAsUser). (2) Root + capabilities.drop: [ALL] alone (no UID
        # change) hits the same setgroups failure — this image cannot
        # run under a dropped capability set at all. Confirmed the
        # image DOES boot fine as root with just
        # allowPrivilegeEscalation: false + seccompProfile:
        # RuntimeDefault (no capability changes), which is what's
        # applied below.
        containers:
          main:
            image:
              repository: ghcr.io/linuxserver/faster-whisper
              tag: gpu-legacy-v3.1.0-ls40@sha256:1bbe03a5c77c91a1e9493866220177132fd7938f20d2aba3df314946501e433e
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: America/Chicago
              WHISPER_MODEL: large-v3-turbo
              WHISPER_BEAM: "1"
              WHISPER_LANG: en

            securityContext:
              allowPrivilegeEscalation: false
              seccompProfile:
                type: RuntimeDefault

            resources:
              requests:
                cpu: 500m
                memory: 1536Mi
                nvidia.com/gpu: 1
              limits:
                memory: 4G
                nvidia.com/gpu: 1

    service:
      kokoro:
        # ClusterIP: HA reaches kokoro via cluster DNS
        # (wyoming-services-kokoro.home), so no LB IP is needed.
        type: ClusterIP
        controller: kokoro
        ports:
          http:
            port: 10200
            protocol: TCP

      openwakeword:
        # ClusterIP: HA reaches openwakeword via cluster DNS
        # (wyoming-services-openwakeword.home), no LB needed.
        type: ClusterIP
        controller: openwakeword
        ports:
          http:
            port: 10400

      whisper:
        # ClusterIP: HA reaches whisper via cluster DNS
        # (wyoming-services-whisper.home), no LB needed.
        type: ClusterIP
        controller: whisper
        ports:
          http:
            port: 10300
            protocol: TCP

    persistence:
      openwakeword-config:
        type: configMap
        enabled: true
        name: openwakeword-config
        advancedMounts:
          openwakeword:
            main:
              - path: /custom
                readOnly: true

      kokoro-tmp:
        type: emptyDir
        advancedMounts:
          kokoro:
            main:
              - path: /tmp

      openwakeword-tmp:
        type: emptyDir
        advancedMounts:
          openwakeword:
            main:
              - path: /tmp
