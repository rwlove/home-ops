---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app zwave-js-ui
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      zwave-js-ui:
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nabu.feature.node.kubernetes.io/zwa2
                        operator: In
                        values:
                          - "true"

          nodeSelector:
            nabu.feature.node.kubernetes.io/zwa2: "true"

          priorityClassName: home-cluster-critical

        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/zwave-js/zwave-js-ui
              tag: 11.24.1@sha256:00abebce88205b47c3b611e983bbc692753170e3603c691bc5765f82265cafa4

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &httpPort 8091
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false

            resources:
              requests:
                cpu: 50m
                memory: 746M
              limits:
                memory: 746M

            securityContext:
              privileged: true

    service:
      app:
        controller: zwave-js-ui
        ports:
          http:
            port: *httpPort
          websocket:
            port: 3000

    route:
      app:
        annotations:
          glance/name: "ZWave JS UI"
          glance/show: "true"
          glance/id: "Home Automation"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/z-wave-js-ui.png"

        hostnames:
          - "zwave.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      config:
        existingClaim: zwavejs2mqtt-config-pvc
        globalMounts:
          - path: /usr/src/app/store

      usb:
        type: hostPath
        hostPath: /dev/zwa2
        hostPathType: CharDevice
        globalMounts:
          - path: /dev/zwa2
    networkpolicies:
      allow:
        type: cilium
        forceRename: zwave-js-ui-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: zwave-js-ui
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal HTTPRoute (envoy → zwave-js-ui:8091) — zwave-js UI.
          # home-assistant connects to the websocket on :3000 — intra-ns,
          # covered by baseline allow-intra-namespace.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8091"
                    protocol: TCP
        # No egress holes needed: Z-Wave dongle is on a host /dev path, no
        # network egress.
