---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: istiod
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.31.0
  # Istio is leaving GCP; gcr.io/istio-release is removed Dec 2026 (hard
  # cutoff Jan 1 2027). See https://istio.io/latest/blog/2026/retirement-of-gcr.io/
  url: oci://ghcr.io/istio/release/charts/istiod
