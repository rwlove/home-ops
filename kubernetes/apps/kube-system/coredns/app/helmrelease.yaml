---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  chartRef:
    kind: OCIRepository
    name: coredns
  interval: 30m
  values:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    k8sAppLabelOverride: kube-dns
    priorityClassName: system-cluster-critical
    replicaCount: 3
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    # Three server blocks (most-specific zone wins):
    #  1. cluster.local + reverse zones -- the kubernetes plugin, unchanged
    #     behaviour (AAAA for a Service = NOERROR/empty, missing name = NXDOMAIN).
    #  2. svc. / cluster. / pod. -- pseudo-TLDs that only exist in-cluster.
    #     Answered NXDOMAIN locally so a failed/mistyped cluster name is never
    #     forwarded to brain -> Pi-hole -> the internet.
    #  3. . -- everything else. AAAA is answered NOERROR/empty locally (the
    #     cluster is IPv4-only: Cilium enable-ipv6=false), so no IPv6 lookup
    #     ever leaves the cluster; A is forwarded to brain (authoritative for the
    #     LAN zone) with the beast Pi-hole as fallback, instead of whatever each
    #     control-plane node's DHCP leases put in /etc/resolv.conf.
    # Deliberately NOT done: ndots tuning. Five namespaces (ai, media, network,
    # storage, tools) are real internet TLDs, so absolute-first lookup of a
    # 2-dot relative name like <pod>.<svc>.media would ask the internet first.
    servers:
      - zones:
          - scheme: dns://
            use_tcp: true
            zone: cluster.local.
          - scheme: dns://
            use_tcp: true
            zone: in-addr.arpa.
          - scheme: dns://
            use_tcp: true
            zone: ip6.arpa.
        port: 53
        plugins:
          - name: errors
          - configBlock: |-
              lameduck 5s
            name: health
          - name: ready
          - configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
            name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
          # NOTE: autopath @kubernetes intentionally NOT enabled. It collapses
          # client search-path expansion server-side and returns external
          # names (e.g. api.frigate.video) as a CNAME under the *queried*
          # search-suffixed name. Cilium's toFQDNs DNS proxy matches on the
          # queried name, so the real IPs get bound to
          # `<host>.<ns>.svc.cluster.local` instead of the bare host —
          # silently breaking every toFQDNs egress allow. Cilium docs
          # recommend disabling autopath when using FQDN policies. See
          # reference_cilium_tofqdns_ndots_searchdomain_bind / PR #12456.
          # Reverse lookups the kubernetes plugin doesn't own (LAN PTRs).
          - configBlock: |-
              policy sequential
            name: forward
            parameters: . 192.168.1.1 192.168.6.66
          - configBlock: |-
              prefetch 20
              serve_stale
            name: cache
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - configBlock: |-
              class error
            name: log
      - zones:
          - scheme: dns://
            use_tcp: true
            zone: svc.
          - scheme: dns://
            use_tcp: true
            zone: cluster.
          - scheme: dns://
            use_tcp: true
            zone: pod.
        port: 53
        plugins:
          - name: errors
          - configBlock: |-
              rcode NXDOMAIN
            name: template
            parameters: ANY ANY
          - name: prometheus
            parameters: 0.0.0.0:9153
      - zones:
          - scheme: dns://
            use_tcp: true
            zone: .
        port: 53
        plugins:
          - name: errors
          - configBlock: |-
              rcode NOERROR
            name: template
            parameters: IN AAAA .
          # brain first (authoritative for the LAN zone, forwards on to both
          # Pi-holes); beast Pi-hole only if brain is unhealthy.
          - configBlock: |-
              policy sequential
            name: forward
            parameters: . 192.168.1.1 192.168.6.66
          - configBlock: |-
              prefetch 20
              serve_stale
            name: cache
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - configBlock: |-
              class error
            name: log
    service:
      clusterIP: 10.43.0.10
      name: kube-dns
      annotations:
        # DNS load-balancing = random (not Maglev-sticky), so a retried DNS query
        # lands on a different healthy CoreDNS backend instead of re-pinning to a
        # struggling one during node churn. Requires cilium loadBalancer.algorithmAnnotation
        # (enabled) and takes effect only at Service CREATION (hence the one-time recreate).
        service.cilium.io/lb-algorithm: random
    serviceAccount:
      create: true
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    # Spread the 3 replicas across distinct control-plane nodes so a single node
    # event can't land 2 of 3 on one host (which doubled the blast radius during
    # the 2026-10-03 churn-DNS incident), and keep >=2 available during disruption.
    # Safe part-1 of the Cilium/CoreDNS RCA; the lb-algorithm parts are held for a
    # maintenance window. See reference_stale_cilium_endpoint_coredns_fqdn_proxy_extauth_outage.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            k8s-app: kube-dns
    podDisruptionBudget:
      minAvailable: 2
