---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
spec:
  chartRef:
    kind: OCIRepository
    name: descheduler
  interval: 1h
  values:
    deschedulerPolicy:
      metricsProviders:
        - source: KubernetesMetrics
      profiles:
        - name: Default
          pluginConfig:
            - args:
                nodeFit: true
                # Honor `descheduler.alpha.kubernetes.io/prefer-no-eviction`
                # as a hard exclusion (default is soft "Preferred"). Lets
                # singletons that are expensive/disruptive to reschedule
                # (zot pull-through cache, VPN gateway) opt out of the
                # LowNodeUtilization balance sweep.
                noEvictionPolicy: Mandatory
                podProtections:
                  defaultDisabled:
                    - FailedBarePods
                    - PodsWithLocalStorage
              name: DefaultEvictor
            - args:
                metricsUtilization:
                  source: KubernetesMetrics
                targetThresholds:
                  cpu: 70
                  memory: 70
                  pods: 70
                thresholds:
                  cpu: 30
                  memory: 30
                  pods: 30
              name: LowNodeUtilization
            - args:
                excludeOwnerKinds:
                  - Job
                includingInitContainers: true
                minPodLifetimeSeconds: 1800
                reasons:
                  - ContainerStatusUnknown
                  - NodeAffinity
                  - NodeShutdown
                  - Terminated
                  - UnexpectedAdmissionError
              name: RemoveFailedPods
            - name: RemoveDuplicates
            - name: RemovePodsViolatingInterPodAntiAffinity
            - args:
                nodeAffinityType:
                  - requiredDuringSchedulingIgnoredDuringExecution
              name: RemovePodsViolatingNodeAffinity
            - args:
                # Ignore Cilium's transient CNI-rollout taint. During a
                # cilium-agent restart (every chart upgrade) the node carries
                # `node.cilium.io/agent-not-ready:NoSchedule` until the new
                # agent is Ready; without this exclusion the descheduler
                # evicts every non-tolerating pod on that node, producing a
                # cluster-wide eviction storm (2026-07-18: 50-64 pods/tick,
                # blacked out Immich during the 1.19.6 rollout).
                excludedTaints:
                  - node.cilium.io/agent-not-ready
              name: RemovePodsViolatingNodeTaints
            - name: RemovePodsViolatingTopologySpreadConstraint
          plugins:
            balance:
              enabled:
                - LowNodeUtilization
                - RemoveDuplicates
                - RemovePodsViolatingTopologySpreadConstraint
            deschedule:
              enabled:
                - RemoveFailedPods
                - RemovePodsViolatingInterPodAntiAffinity
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingNodeTaints
    deschedulerPolicyAPIVersion: descheduler/v1alpha2
    # tolerations:
    #  - key: node-role.kubernetes.io/control-plane
    #    operator: Equal
    #    value: NoSchedule
    #    effect: NoSchedule
    kind: Deployment
    leaderElection:
      enabled: true
    priorityClassName: system-cluster-critical
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi
    service:
      enabled: true
    serviceMonitor:
      enabled: true
