---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
spec:
  chart:
    spec:
      chart: gpu-operator
      sourceRef:
        kind: HelmRepository
        name: nvidia-gpu-operator
      version: v26.7.0
  interval: 30m
  install:
    crds: CreateReplace
    # Was disableWait: true, which contradicted ks.yaml's `wait: true`.
    #
    # Eight GPU workloads declare dependsOn gpu-operator: comfyui,
    # comfyui-spark, ollama, tei-spark, tei-embed-spark, vllm-coder-spark,
    # vllm-driver-spark, wyoming-services. That gate only means something if
    # the Kustomization goes Ready when the operator is actually serving.
    # disableWait made it Ready as soon as Helm finished applying, so
    # dependents could start before the device plugin had registered
    # nvidia.com/gpu -- the gate was decorative.
    #
    # A generous timeout keeps the readiness signal while tolerating the slow
    # part of a gpu-operator upgrade (driver / container-toolkit / validator
    # DaemonSet rollouts). Verified 2026-07-31 that every gpu-operator
    # DaemonSet is desired==ready in steady state, including the
    # zero-scheduled mps-control-daemon, so Helm's wait passes today.
    timeout: 20m
  upgrade:
    crds: CreateReplace
    timeout: 20m
  values:
    operator:
      cleanupCRD: false
      upgradeCRD: true
      # The chart default operator affinity *prefers* control-plane nodes, which
      # lands the controller on the memory-tight master VMs. Prefer
      # non-control-plane nodes instead (still allowed on masters as a fallback).
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
    # Tolerations applied to every operand DaemonSet (toolkit,
    # device-plugin, dcgmExporter, gfd, nodeStatusExporter, validator).
    # The chart default tolerates `nvidia.com/gpu` only; appending
    # `kubernetes.io/arch=arm64` lets the NVIDIA stack run on Spark
    # (arm64, NVIDIA Grace-Blackwell) which is tainted to keep generic
    # workloads off but still needs the GPU operands for ollama-spark.
    daemonsets:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
    driver:
      enabled: false
    toolkit:
      enabled: true
      installDir: /usr/local/nvidia
    devicePlugin:
      enabled: true
      config:
        name: gpu-operator-time-slicing-config
        default: any
    dcgmExporter:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
      serviceMonitor:
        enabled: true
    gfd:
      enabled: true
    nfd:
      enabled: false
    mig:
      strategy: none
    migManager:
      enabled: false
    nodeStatusExporter:
      enabled: true
    validator:
      driver:
        env:
          - name: DISABLE_DEV_CHAR_SYMLINK_CREATION
            value: "true"
