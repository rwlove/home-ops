---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gpu.rules
spec:
  groups:
    - name: dcgm-exporter
      rules:
        # DCGM_FI_DEV_GPU_UTIL_RATIO is a gauge (0-1 ratio; dcgm-exporter
        # 4.7 renamed GPU_UTIL 0-100 % to this), not a counter — `rate()`
        # on it is undefined. Original rule has been silenced forever in
        # silence-operator because of this. Scoped to Tesla P40 because
        # GPU_UTIL/MEM_COPY_UTIL/FB_USED are broken on GB10 (Spark uses a
        # separate power-based + synthetic-probe approach — see
        # reference_dcgm_gb10_broken_counters.md).
        # `for: 2h` (not minutes): kagent inference runs on the P40 drive
        # sustained >85% util as expected baseline, so a short window just
        # pages on normal work. 2h keeps this as a runaway-loop net — a
        # genuinely stuck job still fires; an ordinary kagent burst does not.
        - alert: HighGpuUsage
          expr: |
            avg_over_time(DCGM_FI_DEV_GPU_UTIL_RATIO{modelName="Tesla P40"}[15m]) > 0.85
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "High GPU usage on {{ $labels.hostname }} ({{ $labels.modelName }}) for 2+ hours"
            description: "GPU usage on {{ $labels.hostname }} for {{ $labels.modelName }} has averaged over 85% for the past 2 hours."
        # P40 VRAM headroom. The P40 is time-sliced with no memory
        # isolation (Ollama, Immich-ML, pet-tagger, whisper, Frigate GenAI
        # all share its 24 GiB), so a concurrent burst can OOM every
        # tenant at once. 30-day peak was ~70% (2026-11-21); 90% for 5m
        # is outside normal load but leaves time to act before the OOM.
        # P40 only: the GB10 is unified memory and emits no FB_* fields.
        - alert: P40VramNearlyFull
          expr: |
            max by (hostname) (DCGM_FI_DEV_FB_USED_BYTES{modelName="Tesla P40"})
              / max by (hostname) (DCGM_FI_DEV_FB_CAPACITY_BYTES{modelName="Tesla P40"})
              > 0.90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "P40 VRAM above 90% on {{ $labels.hostname }}"
            description: "P40 framebuffer is {{ $value | humanizePercentage }} full. Shared-GPU tenants (ollama, immich-ml, pet-tagger, whisper) risk OOM. Check which models Ollama has loaded (`ollama ps`) and for a concurrent Immich ML re-index or bulk tagging run."
        # Guard against a silent metric-family rename. dcgm-exporter 4.7
        # (gpu-operator v26.7.3) renamed every DCGM_FI_DEV_* series to
        # unit-suffixed names; every consumer went dark for ~3 days with
        # no alert because the exporter itself stayed `up`. Fires when the
        # exporter is scraped but a series the rules depend on is gone.
        - alert: DcgmExpectedMetricsMissing
          expr: |
            (
              absent(DCGM_FI_DEV_GPU_UTIL_RATIO{modelName="Tesla P40"})
              or absent(DCGM_FI_DEV_BOARD_POWER_WATTS{modelName="Tesla P40"})
            )
            and on() (sum(up{job="nvidia-dcgm-exporter"}) > 0)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "dcgm-exporter is up but expected DCGM series are missing"
            description: "DCGM_FI_DEV_GPU_UTIL_RATIO or DCGM_FI_DEV_BOARD_POWER_WATTS for the P40 is absent while the exporter is scraped. Likely an exporter metric rename — check the gpu-operator/dcgm-exporter release notes and update every consumer (PrometheusRules, HA gpu_utilization package, kagent prompts)."
