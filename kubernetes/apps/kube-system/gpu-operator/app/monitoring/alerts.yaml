---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gpu.rules
spec:
  groups:
    - name: dcgm-exporter
      rules:
        # DCGM_FI_DEV_GPU_UTIL is a gauge (0-100 %), not a counter — `rate()`
        # on it is undefined. Original rule has been silenced forever in
        # silence-operator because of this. Scoped to Tesla P40 because
        # GPU_UTIL/MEM_COPY_UTIL/FB_USED are broken on GB10 (Spark uses a
        # separate power-based + synthetic-probe approach — see
        # reference_dcgm_gb10_broken_counters.md).
        # `for: 2h` (not minutes): kagent inference runs on the P40 drive
        # sustained >85% util as expected baseline, so a short window just
        # pages on normal work. 2h keeps this as a runaway-loop net — a
        # genuinely stuck job still fires; an ordinary kagent burst does not.
        - alert: HighGpuUsage
          expr: |
            avg_over_time(DCGM_FI_DEV_GPU_UTIL{modelName="Tesla P40"}[15m]) > 85
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "High GPU usage on {{ $labels.Hostname }} ({{ $labels.modelName }}) for 2+ hours"
            description: "GPU usage on {{ $labels.Hostname }} for {{ $labels.modelName }} has averaged over 85% for the past 2 hours."
