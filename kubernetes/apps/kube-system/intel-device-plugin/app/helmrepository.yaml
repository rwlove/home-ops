---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: intel-device-plugins-operator
spec:
  # Migrated 2026-10-29 off oci://ghcr.io/home-operations/charts-mirror —
  # that mirror dropped (made private) the intel-device-plugins packages, so
  # the OCIRepository failed with ghcr DENIED and blocked all flate/CI. This
  # is the chart's upstream source; the chart content is identical to what the
  # mirror re-hosted, so values are unchanged. No cosign verify: upstream is
  # not signed with the mirror's OIDC identity.
  interval: 1h
  url: https://intel.github.io/helm-charts
