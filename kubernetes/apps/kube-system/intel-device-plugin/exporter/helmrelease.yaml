---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: drm-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: drm-exporter
  interval: 1h
  values:
    fullnameOverride: drm-exporter

    # GPU device nodes come from the Intel device plugin (the
    # gpu.intel.com/i915 request below), not a hostPath /dev/dri: CRI-O's
    # device cgroup only admits nodes the plugin injects, so a hostPath mount
    # in a non-privileged container is unreadable. /sys stays (chart default).
    # /dev/cpu (MSR package temperature) is not mounted, so SYS_RAWIO is
    # dropped from the chart's capability set — PERFMON alone covers i915
    # engine utilization and RAPL power.
    hostAccess:
      devDri: ""
      devCpu: ""

    # Runs as root (chart default): /dev/dri nodes are root:video 0660 and
    # the perf PMU read needs CAP_PERFMON. Non-privileged, read-only rootfs,
    # ALL dropped except PERFMON.
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
        add:
          - PERFMON

    nodeSelector:
      intel.feature.node.kubernetes.io/gpu: "true"

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
        gpu.intel.com/i915: 1
      limits:
        memory: 128Mi
        gpu.intel.com/i915: 1

    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        annotations:
          grafana_folder: Kubernetes
