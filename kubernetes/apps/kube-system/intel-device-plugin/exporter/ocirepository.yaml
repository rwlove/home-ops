---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: drm-exporter
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.3.6
    digest: sha256:167a79ca9783720fcea151614833e1d89762c6db927705eafa38174d3cfd9d7a
  url: oci://ghcr.io/home-operations/charts/drm-exporter
  # Keyless cosign signature from drm-exporter's own release workflow.
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: https://token.actions.githubusercontent.com
        subject: https://github.com/home-operations/drm-exporter.*
