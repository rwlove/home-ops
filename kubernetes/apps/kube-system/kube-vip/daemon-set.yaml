---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/daemonset-apps-v1.json
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  labels:
    app.kubernetes.io/instance: kube-vip
    app.kubernetes.io/name: kube-vip
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: kube-vip
      app.kubernetes.io/name: kube-vip
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: kube-vip
        app.kubernetes.io/name: kube-vip
    spec:
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip:v1.3.2@sha256:50b25c001fe19628a932b42ec6f8ec31bb65a5e1811a723a57ceddbc5cd5aade
          imagePullPolicy: IfNotPresent
          args:
            - manager
          env:
            - name: vip_arp
              value: "true"
            # vip_interface is intentionally OMITTED so kube-vip auto-detects
            # the interface from each node's lowest-metric default route. This
            # is what lets ONE DaemonSet serve every control-plane node despite
            # differing NIC names (previously two DaemonSets: master1 bare-metal
            # enp0s31f6, master2/3 VMs enp1s0). Validated 2026-08-22:
            # master1->enp0s31f6, master2/3->enp1s0 (all metric 100); the VLAN
            # 20/40 sub-interfaces are metric 400/401 so they are never picked.
            # A new/replaced control-plane node now needs no kube-vip change.
            - name: port
              value: "6443"
            - name: vip_cidr
              value: "32"
            - name: cp_enable
              value: "true"
            - name: cp_namespace
              value: kube-system
            # LeaderElection tuning: upstream default 15/10/2 (same as
            # kube-controller-manager / kube-scheduler). Takeover after a hard
            # hang of the leader is ~17s (lease + retry).
            #
            # History: #13727 (2026-08-22) cut this to 5/3/1 (~5s failover)
            # after master1's cri-o froze during the 1.36 upgrade and stranded
            # the VIP. That traded a rare stranded-VIP window for constant
            # false failovers: kube-vip renews through the in-cluster
            # `kubernetes` Service (all three apiservers), and a 3s renew
            # deadline loses the lease whenever one apiserver stalls on etcd —
            # 448 lease transitions, ~3 VIP moves/day (2026-11-21 research:
            # master1's etcd shares a contended budget NVMe with the Ceph mon;
            # renew GETs timed out at 10s). kube-vip restarts on a lost lease
            # by design, so each loss is a brief API-VIP outage.
            # KubeVipLeaderChurn (kube-prometheus-stack addons/alerts) watches it.
            #
            # The VIP intentionally stays on L2/ARP so brain remains OUT of the
            # control-plane datapath — BGP-advertising the /32 would route it
            # through brain and make brain a control-plane SPOF, which ARP
            # (flat 192.168.0.0/16 L2) avoids today.
            - name: vip_leaderelection
              value: "true"
            - name: vip_leaseduration
              value: "15"
            - name: vip_renewdeadline
              value: "10"
            - name: vip_retryperiod
              value: "2"
            - name: svc_enable
              value: "false"
            - name: address
              value: "192.168.6.1"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
      hostAliases:
        - hostnames:
            - kubernetes
          ip: 127.0.0.1
      hostNetwork: true
      serviceAccountName: kube-vip
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
