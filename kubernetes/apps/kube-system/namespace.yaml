---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
  labels:
    goldilocks.fairwinds.com/enabled: "true"
    goldilocks.fairwinds.com/vpa-update-mode: "off"
    kustomize.toolkit.fluxcd.io/prune: disabled
    # PSS: enforce=privileged. CNI/kube-proxy/device plugins need host
    # namespaces + privileged; privileged admits every pod (rejects
    # nothing) and pins intent so an accidental blanket-restricted can
    # never silently reject core control-plane pods.
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
