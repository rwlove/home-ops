---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: node-feature-discovery
spec:
  # Migrated 2026-10-29 off oci://ghcr.io/home-operations/charts-mirror — the
  # mirror dropped (made private) node-feature-discovery, so the OCIRepository
  # failed with ghcr DENIED and blocked all flate/CI. This is the chart's
  # upstream kubernetes-sigs source; content identical to the mirror, values
  # unchanged. No cosign verify: upstream is not signed with the mirror's identity.
  interval: 1h
  url: https://kubernetes-sigs.github.io/node-feature-discovery/charts
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
spec:
  chart:
    spec:
      chart: node-feature-discovery
      version: 0.18.0
      sourceRef:
        kind: HelmRepository
        name: node-feature-discovery
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    gc:
      resources:
        limits:
          memory: 128Mi

        requests:
          cpu: 10m
          memory: 128Mi
    prometheus:
      enable: true

    worker:
      config:
        core:
          sources:
            - pci
            - system
            - usb
        sources:
          usb:
            # Default whitelist omits class 00 (interface-defined).
            # RTL2832U (Nooelec NESDR Mini) reports class 00; add it so
            # the nesdr-mini NodeFeatureRule can match vendor/device.
            deviceClassWhitelist:
              - "00"
              - "0e"
              - "ef"
              - "fe"
              - "ff"

      resources:
        limits:
          memory: 86M
        requests:
          cpu: 20m
          memory: 86M

      # Tolerate Spark's arm64 dedication taint so NFD discovers GPU /
      # PCI features there too — needed by gpu-operator's nodeSelector
      # logic (`nvidia.com/gpu.deploy.*` labels are NFD-driven).
      tolerations:
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
  uninstall:
    keepHistory: false
