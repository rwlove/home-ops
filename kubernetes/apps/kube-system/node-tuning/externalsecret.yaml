---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: node-tuning
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: node-tuning-secret
    creationPolicy: Owner
  data:
    # "<hostname>=<mac> ..." pairs consumed by the static-neighbors container.
    # Kept out of git: the MACs (and the fact of these specific devices) live
    # in the 1Password "node-tuning" item, not the public repo.
    - secretKey: NEIGH
      remoteRef:
        key: node-tuning
        property: neigh
