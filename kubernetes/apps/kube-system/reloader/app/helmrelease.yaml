---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  chartRef:
    kind: OCIRepository
    name: reloader
  interval: 30m
  values:
    deployment:
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 5m
          memory: 320Mi
    podMonitor:
      enabled: true

    reloadStrategy: annotations
