---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m

  install:
    disableWait: true
  upgrade:
    disableWait: true

  values:
    controllers:
      zot:
        pod:
          # Keep zot OFF control-plane nodes. Its integrity scrub reads the
          # whole 500Gi data PVC (rbd); on master1 that saturated the single
          # 1GbE NIC shared with osd.1/mon/control plane for ~35 min nightly
          # → Ceph slow ops, apiserver/kube-vip restarts, cluster DNS
          # timeouts (2026-11-18). Prefer the beast-hosted workers (10GbE
          # uplink, Ceph OSDs local); worker8 is left out (P40 node).
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - worker5.thesteamedcrab.com
                          - worker6.thesteamedcrab.com
                          - worker7.thesteamedcrab.com
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 568
            runAsUser: 568
            supplementalGroups:
              - 65542 # gladius:external-services

        annotations:
          reloader.stakater.com/auto: "true"
          # Pull-through registry cache: a descheduler eviction takes ~4-5min
          # to recover (startup repo-index scan) and 503s block image pulls
          # cluster-wide while it's down. Opt out of the balance sweep.
          descheduler.alpha.kubernetes.io/prefer-no-eviction: "true"

        type: statefulset

        containers:
          app:
            image:
              repository: ghcr.io/project-zot/zot-linux-amd64
              tag: v2.1.23@sha256:b68f727fe35c1eb45b2ae91519dfb0e33192d69b5104882c3e7809b7146c4a02
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v2/
                    port: &httpPort 5000
                  initialDelaySeconds: 5
              readiness: *probe
              # Cold start walks every cached repo before /v2/ answers; with
              # the 3×10s liveness default that crash-loops (see
              # docs/src/failure_mode_runbooks.md "ZOT cold-start recovery").
              # Gate liveness/readiness behind a 30-min startup budget.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v2/
                    port: *httpPort
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 60
            resources:
              requests:
                cpu: 50m
                # Right-sized 2Gi→512Mi: steady working set ~271Mi (13% of
                # the old request); 512Mi keeps ~1.9x headroom. Limit stays
                # 5Gi to absorb large pull-through spikes.
                memory: 512Mi
              limits:
                memory: 5Gi

    service:
      app:
        controller: zot
        ports:
          http:
            port: *httpPort

    route:
      app:
        annotations:
          glance/name: "ZOT Registry"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/zot-registry.png"
          glance/id: "System"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      config-file:
        type: configMap
        name: zot-configmap
        globalMounts:
          - path: /etc/zot/config.json
            subPath: config.json
            readOnly: true

      htpasswd:
        type: secret
        name: zot-secret
        globalMounts:
          - path: /etc/zot/htpasswd
            subPath: htpasswd
            readOnly: true

      data:
        existingClaim: zot-data-ceph
        globalMounts:
          - path: /var/lib/registry
    externalSecrets:
      zot:
        forceRename: zot
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: zot-secret
          template:
            data:
              # htpasswd file consumed by ZOT at /etc/zot/htpasswd. One bcrypt
              # line per user. Anonymous pulls are still allowed (accessControl
              # anonymousPolicy=read in config.json); this gates push only.
              htpasswd: "{{ .HTPASSWD_ENTRY }}"
        dataFrom:
          - extract:
              key: zot
