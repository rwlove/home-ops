---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  chartRef:
    kind: OCIRepository
    name: longhorn
  interval: 30m
  values:
    defaultSettings:
      # Longhorn cannot back up a DETACHED volume on its own — there is
      # no engine to read from — so CronJob-driven and scaled-to-zero
      # workloads missed their window silently, and the recurring job
      # reported nothing wrong because it never had a volume to act on.
      # `beets` sat 88 days with no recovery point this way: its CronJob
      # carries timeZone America/New_York, so "0 */12 * * *" is
      # 04:00/16:00 UTC and never overlapped the 00:00 UTC recurring
      # window. Not a race — 0 of ~88 daily snapshots.
      #
      # With this enabled Longhorn auto-attaches such a volume, runs the
      # job, then detaches again. Upstream caveat: while auto-attached
      # the volume is unavailable to workloads, so one starting mid-job
      # waits for it. That only applies to volumes that were ALREADY
      # detached, so no running workload is interrupted.
      allowRecurringJobWhileVolumeDetached: true
      backupTarget: "nfs://beast:/mnt/mass_storage/longhorn-backups"
      createDefaultDiskLabeledNodes: true
      defaultDataLocality: best-effort
      defaultReplicaCount: 2
      kubernetesClusterAutoscalerEnabled: true

      replicaAutoBalance: best-effort
      storageMinimalAvailablePercentage: 10
    global:
      imageRegistry: docker.io

    longhornManager:
      # Request-only (no memory limit): storage control plane; a tight
      # limit risks OOM during volume recovery. Sized to 14d peak ~1.2Gi.
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
      securityContext:
        privileged: true
    persistence:
      defaultClass: false
      defaultClassReplicaCount: 1
      reclaimPolicy: Retain
  # Scope the chart-shipped `longhorn-support-bundle` ClusterRoleBinding
  # from `cluster-admin` down to `view`. The chart hardcodes the binding
  # with no values knob to disable it (clusterrolebinding.yaml lines
  # 15-27 in longhorn-1.11.2), so we patch it post-render. The SA is
  # only consumed when a support bundle is being collected; if a bundle
  # fails because of insufficient permissions, drop this patch and file
  # an upstream issue.
  # See docs/src/rbac_audit.md §2.1.
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              - op: replace
                path: /roleRef/name
                value: view
            target:
              kind: ClusterRoleBinding
              name: longhorn-support-bundle
