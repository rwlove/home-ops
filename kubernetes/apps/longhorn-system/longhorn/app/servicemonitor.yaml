---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: longhorn
  labels:
    app.kubernetes.io/component: metrics
    app.kubernetes.io/instance: longhorn
    app.kubernetes.io/name: longhorn
    prometheus: kube-prometheus
spec:
  endpoints:
    - interval: 30s
      metricRelabelings:
        # Drop longhorn internal rest-client latency histograms — ~12k
        # series, unused by any dashboard or rule (verified 2026-10-25).
        - action: drop
          regex: longhorn_rest_client_(request|rate_limiter)_latency_seconds_bucket
          sourceLabels: ["__name__"]
      path: /metrics
      port: manager
      scheme: http
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - longhorn-system
  selector:
    matchLabels:
      app: longhorn-manager
