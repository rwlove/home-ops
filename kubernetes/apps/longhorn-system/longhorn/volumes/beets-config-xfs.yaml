---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/longhorn.io/volume_v1beta2.json
apiVersion: longhorn.io/v1beta2
kind: Volume
metadata:
  name: beets-config-xfs
  labels:
    backup-target: default
    longhornvolume: beets-config-xfs
    recurring-job-group.longhorn.io/daily-snapshot: enabled
    recurring-job-group.longhorn.io/default: enabled
    recurring-job-group.longhorn.io/weekly-backup: enabled
spec:
  accessMode: rwo
  backingImage: ""
  backupCompressionMethod: lz4
  backupTargetName: default
  dataEngine: v1
  dataLocality: best-effort
  frontend: blockdev
  numberOfReplicas: 2
  size: "5368709120"
  staleReplicaTimeout: 2880
  unmapMarkSnapChainRemoved: enabled
