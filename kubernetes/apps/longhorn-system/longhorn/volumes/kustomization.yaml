  - ./matter-server-data-xfs.yaml
  - ./medialyze-config-xfs.yaml
  - ./medikeep-uploads-ext4.yaml
  - ./monica-data-xfs.yaml
  - ./music-assistant-data-xfs.yaml
  - ./node-red-data-xfs.yaml
  - ./obsidian-data-xfs.yaml
  - ./ollama-data-xfs.yaml
  - ./ollama-models-xfs.yaml
  - ./open-webui-data-xfs.yaml
