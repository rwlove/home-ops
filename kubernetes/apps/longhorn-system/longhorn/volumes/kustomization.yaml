---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
#
# Backend Longhorn `Volume` CRs for every static-Longhorn PV in the repo.
# Longhorn's CSI driver does NOT auto-create the backend Volume object for a
# statically-provisioned PV (one that binds by volumeName to a readable
# volumeHandle), so each handle needs a matching Volume CR in longhorn-system
# or the PV attach fails `NotFound` (pod stuck Init:0/1). These were previously
# hand-applied via `kubectl apply` and committed nowhere — a DR gap: a cluster
# rebuild recreated the PV/PVC from Flux but not the backend volumes. This
# kustomization closes that gap by putting them under GitOps.
#
# Each file is built to match the LIVE Volume CR exactly (see the longhorn
# README) so adopting an already-attached, data-bearing volume reconciles as a
# no-op. Reconciled by the `longhorn-volumes` Flux Kustomization (../ks.yaml),
# which targets longhorn-system and dependsOn longhorn.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./beets-config-xfs.yaml
  - ./forgejo-data-xfs.yaml
  - ./frigate-config-xfs.yaml
  - ./ghidra-mcp-project-xfs.yaml
  - ./gonic-data-xfs.yaml
  - ./home-assistant-config-xfs.yaml
  - ./home-assistant-media-xfs.yaml
  - ./immich-pet-tagger-data-xfs.yaml
  - ./jdownloader-config-xfs.yaml
  - ./jellyfin-config-xfs.yaml
  - ./kitchenowl-data-xfs.yaml
