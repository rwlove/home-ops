---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/longhorn.io/volume_v1beta2.json
apiVersion: longhorn.io/v1beta2
kind: Volume
metadata:
  name: ollama-models-xfs
  labels:
    backup-target: default
    longhornvolume: ollama-models-xfs
    recurring-job-group.longhorn.io/default: enabled
    recurring-job-group.longhorn.io/weekly-filesystem-trim: enabled
spec:
  accessMode: rwo
  backingImage: ""
  backupCompressionMethod: lz4
  backupTargetName: default
  dataEngine: v1
  dataLocality: disabled
  frontend: blockdev
  numberOfReplicas: 3
  size: "107374182400"
  staleReplicaTimeout: 20
  unmapMarkSnapChainRemoved: enabled
