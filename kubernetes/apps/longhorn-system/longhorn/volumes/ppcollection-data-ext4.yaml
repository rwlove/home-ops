---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/longhorn.io/volume_v1beta2.json
apiVersion: longhorn.io/v1beta2
kind: Volume
metadata:
  name: ppcollection-data-ext4
  labels:
    backup-target: default
    longhornvolume: ppcollection-data-ext4
    recurring-job-group.longhorn.io/default: enabled
    recurring-job-group.longhorn.io/weekly-filesystem-trim: enabled
spec:
  accessMode: rwo
  backingImage: ""
  backupCompressionMethod: lz4
  backupTargetName: default
  dataEngine: v1
  dataLocality: disabled
  frontend: blockdev
  numberOfReplicas: 2
  size: "2147483648"
  staleReplicaTimeout: 2880
  unmapMarkSnapChainRemoved: enabled
