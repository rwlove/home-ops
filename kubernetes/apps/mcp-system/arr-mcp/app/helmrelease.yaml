---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arr-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      arr-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            sidecar.istio.io/inject: "true"
        containers:
          app:
            image:
              repository: ghcr.io/aplaceforallmystuff/mcp-arr
              tag: 1.7.3@sha256:ace72c56448e8695e1d2d060e7437470e3f883fcc9316f1294e3a7f682e1efa1
            env:
              # Stock mcp-arr defaults to stdio transport; the retired
              # v1.6.5-deadlockfix1 image baked HTTP in as its default. Set it
              # explicitly so the pod serves Streamable HTTP on :3000 for the
              # gateway (see #12752, which dropped the custom image).
              MCP_TRANSPORT: http
              HOST: 0.0.0.0
              SONARR_URL: http://sonarr.media.svc.cluster.local:8989
              RADARR_URL: http://radarr.media.svc.cluster.local:7878
              LIDARR_URL: http://lidarr.media.svc.cluster.local:8686
              PROWLARR_URL: http://prowlarr.downloads.svc.cluster.local:9696
            envFrom:
              - secretRef:
                  name: arr-mcp-secret
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: arr-mcp
        ports:
          http:
            port: 3000
    route:
      app:
        hostnames:
          - "arr-mcp.mcp.local"
        parentRefs:
          - name: mcp-gateway
            namespace: mcp-system
            sectionName: mcps
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp
            filters:
              # Strip inbound Authorization before forwarding to the
              # backend MCP server. The Kuadrant mcp-gateway forwards
              # all client headers; the broker-side Bearer (used to
              # authentication can take
              # precedence over the backend's own credential env in
              # any upstream MCP client that honors `Authorization`,
              # causing 401s against the real target service. Backend
              # MCP servers each carry their own env-loaded creds —
              # stripping the broker Bearer at this hop lets those
              # take effect uniformly across the fleet.
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - Authorization
            backendRefs:
              - identifier: app
                port: 3000
    externalSecrets:
      arr-mcp:
        refreshInterval: 5m
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: arr-mcp-secret
          creationPolicy: Owner
          template:
            data:
              SONARR_API_KEY: "{{ .SONARR__API_KEY }}"
              RADARR_API_KEY: "{{ .RADARR__API_KEY }}"
              LIDARR_API_KEY: "{{ .LIDARR__API_KEY }}"
              PROWLARR_API_KEY: "{{ .PROWLARR__API_KEY }}"
        dataFrom:
          - extract:
              key: sonarr
          - extract:
              key: radarr
          - extract:
              key: lidarr
          - extract:
              key: prowlarr
    networkpolicies:
      allow:
        type: cilium
        forceRename: arr-mcp-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: arr-mcp
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it. Ingress from same-ns mcp-gateway broker is
        # covered by baseline allow-intra-namespace.
        enableDefaultDeny:
          egress: false
          ingress: false
        egress:
          # Sonarr / Radarr / Lidarr in media ns (Pattern E). Env vars set:
          #   SONARR_URL: http://sonarr.media.svc.cluster.local:8989
          #   RADARR_URL: http://radarr.media.svc.cluster.local:7878
          #   LIDARR_URL: http://lidarr.media.svc.cluster.local:8686
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: sonarr
            toPorts:
              - ports:
                  - port: "8989"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: radarr
            toPorts:
              - ports:
                  - port: "7878"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: lidarr
            toPorts:
              - ports:
                  - port: "8686"
                    protocol: TCP
          # Prowlarr in downloads ns. Env: PROWLARR_URL points to
          # http://prowlarr.downloads.svc.cluster.local:9696
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: prowlarr
            toPorts:
              - ports:
                  - port: "9696"
                    protocol: TCP
