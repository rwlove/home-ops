---
# TODO: apply schema
apiVersion: mcp.kuadrant.io/v1
kind: MCPServerRegistration
metadata:
  name: ghidra-tools
  labels:
    mcp.kuadrant.io/managed: "true"
spec:
  prefix: ghidra_
  # Targets the HTTPRoute the ghidra-mcp HelmRelease attaches to the mcp-gateway
  # (route key `app` → HTTPRoute `ghidra-mcp`), mirroring comfyui-mcp. The
  # broker fronts the MCP endpoint at ghidra-mcp.mcp.local/mcp (service
  # ghidra-mcp.mcp-system:8081), so mitnick reaches it through lovenet-gateway
  # with no persona edit.
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: ghidra-mcp
