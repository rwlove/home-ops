---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ghostfolio-mcp
spec:
  hostnames:
    - ghostfolio-mcp.mcp.local
  parentRefs:
    - name: mcp-gateway
      namespace: mcp-system
      sectionName: mcps
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Authorization
      backendRefs:
        - name: ghostfolio-mcp
          namespace: ai
          port: 8000
