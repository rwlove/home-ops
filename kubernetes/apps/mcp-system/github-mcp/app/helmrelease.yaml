---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: github-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
    controllers:
      github-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            sidecar.istio.io/inject: "true"
        containers:
          # nginx-unprivileged front: receives broker traffic on 8080,
          # injects the Authorization: Bearer <PAT> header that the
          # github-mcp-server http transport requires, and forwards to
          # the sidecar on 127.0.0.1:8082. Runs as UID 101.
          app:
            image:
              repository: ghcr.io/nginx/nginx-unprivileged
              tag: 1.31.6-alpine@sha256:b54ac358b83fc6c965793fd271839b4ea4cdb6e99895bb19618cbc2ca152d972
            env:
              # envsubst replaces ${GITHUB_PERSONAL_ACCESS_TOKEN} in the
              # template; the secret is materialized by the github-mcp
              # ExternalSecret.
              GITHUB_PERSONAL_ACCESS_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: github-mcp-secret
                    key: GITHUB_PERSONAL_ACCESS_TOKEN
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
          # github-mcp-server in http mode, bound to 8082. The token is
          # supplied per-request by the nginx front, not from env (the
          # env PAT is only honored by the stdio transport), but envFrom
          # is retained harmlessly. --trust-proxy-headers: we sit behind
          # the nginx front.
          github:
            image:
              repository: ghcr.io/github/github-mcp-server
              tag: v1.12.2@sha256:508a0857ec762b1ab1cece29193345b501fab1dd9d1228a7b617062954cecac6
            args:
              - http
              - --port
              - "8082"
              - --base-path
              - /mcp
              - --trust-proxy-headers
              # Least-privilege: expose read-only tools only. This is an
              # internet-adjacent MCP (reachable via the mcp-gateway
              # broker), and the default tool set includes destructive
              # ops like delete_repository. --read-only makes the server
              # skip every write tool (v1.10.0+ fails closed on invalid
              # flags). GitHub writes remain available via `gh` in an
              # interactive session; no automation depends on github-mcp
              # writes (the claude-runner posts issues via its own PAT).
              # Widen to an explicit `--toolsets`/`--tools` allowlist if a
              # write workflow through the broker is ever needed.
              - --read-only
            envFrom:
              - secretRef:
                  name: github-mcp-secret
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: github-mcp
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames:
          - "github-mcp.mcp.local"
        parentRefs:
          - name: mcp-gateway
            namespace: mcp-system
            sectionName: mcps
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp
            filters:
              # Strip inbound Authorization before forwarding to the
              # backend. The Kuadrant mcp-gateway forwards the broker
              # Bearer (an Authelia JWT), which would shadow the GitHub
              # PAT the nginx front injects. Removing it here lets the
              # injected Bearer take effect.
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - Authorization
            backendRefs:
              - identifier: app
                port: 8080
    persistence:
      # Source nginx template — envsubst rewrites this into conf.d at
      # container start. Mounted read-only.
      nginx-templates:
        type: configMap
        name: github-mcp-nginx-config
        advancedMounts:
          github-mcp:
            app:
              - path: /etc/nginx/templates/default.conf.template
                subPath: default.conf.template
                readOnly: true
      # nginx writes the rendered config + pid + cache here. With
      # readOnlyRootFilesystem: true these must be emptyDirs.
      nginx-conf-d:
        type: emptyDir
        advancedMounts:
          github-mcp:
            app:
              - path: /etc/nginx/conf.d
      nginx-cache:
        type: emptyDir
        advancedMounts:
          github-mcp:
            app:
              - path: /var/cache/nginx
      nginx-tmp:
        type: emptyDir
        advancedMounts:
          github-mcp:
            app:
              - path: /tmp
      nginx-run:
        type: emptyDir
        advancedMounts:
          github-mcp:
            app:
              - path: /var/run
      # github-mcp-server scratch under read-only rootfs.
      github-tmp:
        type: emptyDir
        advancedMounts:
          github-mcp:
            github:
              - path: /tmp
    externalSecrets:
      github-mcp:
        refreshInterval: 5m
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: github-mcp-secret
          creationPolicy: Owner
          template:
            data:
              # Fine-grained PAT minted at github.com/settings/personal-access-tokens.
              # Scope to the rwlove/home-ops + rwlove/containers repos only.
              GITHUB_PERSONAL_ACCESS_TOKEN: "{{ .pat }}"
        dataFrom:
          - extract:
              key: github-mcp
    networkpolicies:
      allow:
        type: cilium
        forceRename: github-mcp-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: github-mcp
        # Additive — default-deny is what triggers the lockdown.
        enableDefaultDeny:
          egress: false
          ingress: false
        egress:
          # GitHub API surface. The github-mcp-server proxies REST + GraphQL
          # tools to api.github.com (and the v4 GraphQL endpoint lives at
          # api.github.com/graphql, not a separate hostname). Also touches
          # uploads.github.com for release artifact uploads and
          # codeload.github.com / raw.githubusercontent.com for repo content.
          #
          # api.github.com and codeload.github.com are at their canonical
          # DNS form (A-records only, no CNAME chain), so Cilium 1.19's
          # toFQDNs.matchPattern silently fails — see
          # project_cilium_matchpattern_fqdn_limits.md. PR #11498 originally
          # moved these to toEntities:world; PR #11499 reverted to
          # matchPattern based on PR #11492's pattern; that revert was
          # wrong for canonical FQDNs. Restore world:443.
          #
          # FQDNs covered by the world:443 rule below:
          #   - api.github.com       (canonical, A-only)
          #   - codeload.github.com  (canonical, A-only)
          #
          # graphql.github.com REMOVED — NXDOMAIN, dead rule (GraphQL is
          # actually served from api.github.com/graphql, already covered).
          #
          # uploads.github.com (CNAME → alambic-origin.githubusercontent.com)
          # and *.githubusercontent.com matchPattern entries retained per
          # audit classification (CDN-fronted, CNAME-walk works).
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
          - toFQDNs:
              - matchPattern: "uploads.github.com"
              - matchPattern: "uploads.github.com.*"
              - matchPattern: "*.githubusercontent.com"
              - matchPattern: "*.githubusercontent.com.*"
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
