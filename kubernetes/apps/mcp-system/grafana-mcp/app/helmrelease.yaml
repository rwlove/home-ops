---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      grafana-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            sidecar.istio.io/inject: "true"
        containers:
          app:
            image:
              repository: docker.io/grafana/mcp-grafana
              tag: 1.6.0-alpine@sha256:06410a92ea3192e2dff02d2b3bc6649ab2c47be8e0948837608d42814a3223f5
            args:
              - -t
              - streamable-http
              - --address
              - 0.0.0.0:8000
              # Read/query-only: this MCP is used for observability, not for
              # mutating Grafana. --disable-write drops the create/update
              # tools (dashboards, alert rules, snapshots, etc.), shrinking
              # the tool blast radius. Added mcp-grafana 1.x.
              - --disable-write
              # mcp-grafana 1.1.0 added Host-header allowlisting (DNS-rebinding
              # protection); the default allows only loopback variants of
              # --address, so the mcp-gateway broker's `Host: grafana-mcp.mcp.local`
              # is rejected with 403 "host not allowed" and grafana-tools
              # de-federates. Allow all Host values — cnp-allow.yaml restricts
              # ingress to the broker only (the trusted reverse proxy the flag's
              # own docs require for "*"), so DNS-rebinding isn't reachable. The
              # other MCP backends don't validate Host at all.
              - --allowed-hosts
              - "*"
            env:
              GRAFANA_URL: http://grafana.observability.svc.cluster.local
              # Grafana is single-org (every datasource is orgId: 1) and the SA
              # token is bound to that org anyway. Setting this makes mcp-grafana
              # send X-Grafana-Org-Id explicitly, silencing the per-request
              # "No org ID found ... using default org" WARN it logs ~40x per
              # broker discovery pass. Cosmetic/log-volume only — no behaviour
              # change vs. the implicit default.
              GRAFANA_ORG_ID: "1"
            envFrom:
              - secretRef:
                  name: grafana-mcp-secret
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: grafana-mcp
        ports:
          http:
            port: 8000
    route:
      app:
        hostnames:
          - "grafana-mcp.mcp.local"
        parentRefs:
          - name: mcp-gateway
            namespace: mcp-system
            sectionName: mcps
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp
            filters:
              # Strip inbound Authorization before forwarding to the
              # backend MCP server. The Kuadrant mcp-gateway forwards
              # all client headers; the broker-side Bearer (used to
              # authentication can take
              # precedence over the backend's own credential env in
              # any upstream MCP client that honors `Authorization`,
              # causing 401s against the real target service. Backend
              # MCP servers each carry their own env-loaded creds —
              # stripping the broker Bearer at this hop lets those
              # take effect uniformly across the fleet.
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - Authorization
            backendRefs:
              - identifier: app
                port: 8000
    externalSecrets:
      grafana-mcp:
        refreshInterval: 5m
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: grafana-mcp-secret
          creationPolicy: Owner
          template:
            data:
              GRAFANA_SERVICE_ACCOUNT_TOKEN: "{{ .grafana_mcp_token }}"
        dataFrom:
          - extract:
              key: grafana
            rewrite:
              - regexp:
                  source: "(.*)"
                  target: "grafana_$1"
    networkpolicies:
      allow:
        type: cilium
        forceRename: grafana-mcp-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: grafana-mcp
        # Additive — default-deny is what triggers the lockdown.
        enableDefaultDeny:
          egress: false
          ingress: false
        egress:
          # Grafana in observability ns. Env: GRAFANA_URL points to
          # http://grafana.observability.svc.cluster.local (port 80 svc).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: observability
                  app.kubernetes.io/name: grafana
            toPorts:
              - ports:
                  - port: "3000"
                    protocol: TCP
