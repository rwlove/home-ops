---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ha-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      ha-mcp:
        pod:
          annotations:
            sidecar.istio.io/inject: "true"
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/homeassistant-ai/ha-mcp
              tag: 8.5.0@sha256:e1538bcdadb13a5467bbb8258fba3262a05518585e18115742da638adec7057c
            command:
              - ha-mcp-web
            env:
              HOMEASSISTANT_URL: https://hass.${SECRET_DOMAIN}
            envFrom:
              - secretRef:
                  name: ha-mcp-secret
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    persistence:
      # ha-mcp's data-path resolver scans /tmp, /var/tmp, /usr/tmp, /app
      # and crashes if none are writable. With readOnlyRootFilesystem
      # true, give it an emptyDir at /tmp.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    service:
      app:
        controller: ha-mcp
        ports:
          http:
            port: 8086

    route:
      app:
        hostnames:
          - "ha-mcp.mcp.local"
        parentRefs:
          - name: mcp-gateway
            namespace: mcp-system
            sectionName: mcps
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp
            filters:
              # Strip inbound Authorization before forwarding to the
              # backend MCP server. The Kuadrant mcp-gateway forwards
              # all client headers; the broker-side Bearer (used to
              # authentication can take
              # precedence over the backend's own credential env in
              # any upstream MCP client that honors `Authorization`,
              # causing 401s against the real target service. Backend
              # MCP servers each carry their own env-loaded creds —
              # stripping the broker Bearer at this hop lets those
              # take effect uniformly across the fleet.
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - Authorization
            backendRefs:
              - identifier: app
                port: 8086

    externalSecrets:
      ha-mcp:
        refreshInterval: 5m
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: ha-mcp-secret
          creationPolicy: Owner
          template:
            data:
              HOMEASSISTANT_TOKEN: "{{ .hass_ha_mcp_token }}"
        dataFrom:
          - extract:
              key: home-assistant
            rewrite:
              - regexp:
                  source: "(.*)"
                  target: "hass_$1"
    networkpolicies:
      allow:
        type: cilium
        forceRename: ha-mcp-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: ha-mcp
        # Additive — default-deny is what triggers the lockdown.
        enableDefaultDeny:
          egress: false
          ingress: false
        egress:
          # ha-mcp talks to Home Assistant via HOMEASSISTANT_URL =
          # https://hass.${SECRET_DOMAIN} — which resolves to the external
          # envoy gateway LoadBalancer (10.45.0.13) and inside the cluster
          # actually hits envoy pods on container port 10443. Observed in
          # Hubble: ha-mcp → network/external-* on :10443.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "10443"
                    protocol: TCP
                  # HTTP/3: envoy advertises Alt-Svc on :10443; allow the QUIC (UDP)
                  # sibling so a client upgrade isn't default-denied (would flap the
                  # CiliumPolicyDrop alerts even though QUIC falls back to TCP).
                  - port: "10443"
                    protocol: UDP
                  - port: "443"
                    protocol: TCP
