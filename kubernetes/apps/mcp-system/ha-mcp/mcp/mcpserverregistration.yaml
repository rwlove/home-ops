---
# TODO: apply schema
apiVersion: mcp.kuadrant.io/v1
kind: MCPServerRegistration
metadata:
  name: ha-tools
  labels:
    mcp.kuadrant.io/managed: "true"
spec:
  # workaround: https://github.com/rwlove/home-ops/issues/14453 — remove when the broker serves ha-mcp's shared catalog without a doubling prefix
  # ha-mcp advertises cacheScope:private and the broker 1.0.0+ requires a
  # prefix for private-scope servers (broker-2026-07-28 design: "Private-scope
  # servers require a prefix"), else it excludes their tools from tools/list.
  # ha-mcp already self-prefixes every tool `ha_`, so this prefix double-stacks
  # to `ha_ha_*` — the only way to keep the tools listed for now. The real fix
  # is the cacheScope override (declare ha's catalog Public so it federates
  # without a prefix); tracked in #14453.
  prefix: ha_
  # ha-mcp's server/discover advertises 2026-07-28 only, so the broker serves
  # it on the 2026 route and it is invisible to 2025 clients (Claude negotiates
  # 2025-11-25). ha-mcp does serve 2025-11-25, so declare both versions to place
  # its tools on the 2025 route too. Same TS/SDK under-advertisement class as
  # searxng-mcp; via Kuadrant/mcp-gateway#1515 (v1.0.0).
  supportedProtocolVersions:
    - "2025-11-25"
    - "2026-07-28"
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: ha-mcp
