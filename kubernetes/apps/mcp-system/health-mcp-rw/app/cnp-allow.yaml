---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: health-mcp-rw-broker-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: health-mcp-rw
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: health-mcp-rw-istio-egress
spec:
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: mcp-gateway
      gateway.istio.io/managed: istio.io-gateway-controller
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: health-mcp-rw
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
