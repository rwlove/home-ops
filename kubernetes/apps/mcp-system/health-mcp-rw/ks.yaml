---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app health-mcp-rw
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: mcp-system
  path: ./kubernetes/apps/mcp-system/health-mcp-rw/app
  interval: 1h
  timeout: 5m
  wait: false
  dependsOn:
    - name: mcp-gateway
      namespace: mcp-system
  retryInterval: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app health-mcp-rw-mcpserverregistration
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: mcp-system
  path: ./kubernetes/apps/mcp-system/health-mcp-rw/mcp
  interval: 1h
  timeout: 5m
  wait: false
  dependsOn:
    - name: health-mcp-rw
      namespace: mcp-system
  retryInterval: 2m
