---
apiVersion: mcp.kuadrant.io/v1
kind: MCPServerRegistration
metadata:
  name: health-tools
  labels:
    mcp.kuadrant.io/managed: "true"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: health-mcp
  prefix: health_
  # Sibling of healthrw-tools (same ghcr.io/rwlove/health-mcp image, same
  # `mcp` SDK 1.30.0, same Streamable-HTTP stateless transport) — see that
  # registration's comment for the full rationale (kubectl-mcp-class
  # stateless-discovery risk + the verified real max version). Not yet
  # observed failing in practice (health_ read tools hadn't been exercised
  # past initialize), but it carries the identical wrong "2026-07-28" entry
  # and would break the same way the moment any health_ tool is called.
  supportedProtocolVersions:
    - "2025-11-25"
