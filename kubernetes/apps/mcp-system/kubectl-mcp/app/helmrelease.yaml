---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubectl-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
    controllers:
      kubectl-mcp:
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
            sidecar.istio.io/inject: "true"
          securityContext:
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/rohitg00/kubectl-mcp-server
              tag: 2.0.0@sha256:f1f57aa5d4952f3c49e4d9bb8071a143d0812bdc8253922d51eeca8a2615ea29
            env:
              # 2.0.0 image defaults to stdio transport and a 0.0.0.0 bind, and fails
              # closed on a non-loopback bind without auth. We serve HTTP and opt into
              # unauthenticated-at-backend: the Kuadrant mcp-gateway + CiliumNetworkPolicy
              # are the real gate, and the HTTPRoute strips inbound Authorization.
              MCP_SERVER_TRANSPORT: http
              MCP_SERVER_HOST: 0.0.0.0
              MCP_SERVER_PORT: "8000"
              MCP_ALLOW_UNAUTHENTICATED: "true"
              # Read-only safety mode blocks every state-changing tool server-side
              # (2.0 finally enforces this). Toolsets restore our surface: default
              # (core+helm) = generic kubectl verbs + diagnose_pod_crash; diagnostics =
              # check_pod_health/get_nodes_summary; security = analyze_network_policies;
              # gitops = the Flux/Argo readers.
              MCP_SAFETY_MODE: read-only
              MCP_TOOLSETS: "default,diagnostics,security,gitops"
              MCP_MASK_SECRETS: "true"
              # Gateway forwards a non-loopback Host/Origin; 2.0 defaults these to
              # loopback-only and would 400. Narrow once the forwarded Host is confirmed.
              MCP_ALLOWED_HOSTS: "*"
              MCP_ALLOWED_ORIGINS: "*"
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 768Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: kubectl-mcp
        ports:
          http:
            port: 8000
    route:
      app:
        hostnames:
          - "kubectl-mcp.mcp.local"
        parentRefs:
          - name: mcp-gateway
            namespace: mcp-system
            sectionName: mcps
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp
            filters:
              # Strip inbound Authorization before forwarding to the
              # backend MCP server. The Kuadrant mcp-gateway forwards
              # all client headers; the broker-side Bearer (used to
              # authentication can take
              # precedence over the backend's own credential env in
              # any upstream MCP client that honors `Authorization`,
              # causing 401s against the real target service. Backend
              # MCP servers each carry their own env-loaded creds —
              # stripping the broker Bearer at this hop lets those
              # take effect uniformly across the fleet.
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - Authorization
            backendRefs:
              - identifier: app
                port: 8000

    persistence:
      # readOnlyRootFilesystem is true, so give the non-root (10001) process
      # writable scratch: /tmp plus the HOME subdirs kubectl (discovery cache
      # ~/.kube/cache) and helm (~/.cache, ~/.config) write to at tool-call time.
      tmpfs:
        type: emptyDir
        advancedMounts:
          kubectl-mcp:
            app:
              - path: /tmp
                subPath: tmp
              - path: /home/mcp/.cache
                subPath: cache
              - path: /home/mcp/.config
                subPath: config
              - path: /home/mcp/.kube
                subPath: kube
    rbac:
      bindings:
        kubectl-mcp-read-all:
          type: ClusterRoleBinding
          roleRef:
            identifier: kubectl-mcp-read-all
          subjects:
            - identifier: kubectl-mcp
              serviceAccount: kubectl-mcp
      roles:
        kubectl-mcp-read-all:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: ["pods", "nodes", "services", "namespaces", "configmaps", "persistentvolumes", "persistentvolumeclaims", "endpoints", "resourcequotas", "limitranges", "serviceaccounts", "events"]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["componentstatuses"]
              verbs: ["get", "list"]
            - apiGroups: [""]
              resources: ["pods/log"]
              verbs: ["get", "list"]
            - apiGroups: ["apps"]
              resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["batch"]
              resources: ["jobs", "cronjobs"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["networking.k8s.io"]
              resources: ["ingresses", "networkpolicies"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["gateway.networking.k8s.io"]
              resources: ["gateways", "httproutes", "grpcroutes", "tcproutes", "tlsroutes", "referencegrants"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["storage.k8s.io"]
              resources: ["storageclasses"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["metrics.k8s.io"]
              resources: ["nodes", "pods"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["helm.toolkit.fluxcd.io"]
              resources: ["helmreleases"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["kustomize.toolkit.fluxcd.io"]
              resources: ["kustomizations"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["external-secrets.io"]
              resources: ["externalsecrets"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["postgresql.cnpg.io"]
              resources: ["clusters", "backups", "scheduledbackups"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["barmancloud.cnpg.io"]
              resources: ["objectstores"]
              verbs: ["get", "list", "watch"]
            # Added 2026-08-09. Each of these blocked a verification
            # during the repo-wide audit, forcing findings to be reasoned
            # about from YAML instead of confirmed against live state —
            # which is exactly how this cluster's three silent-drop
            # incidents went unnoticed in the first place. All read-only.
            #
            # cilium.io: resolve a CNP endpointSelector against real
            # endpoints. A selector matching zero pods is a silent drop
            # with nothing in any log; it cannot be caught by reading
            # the manifest.
            - apiGroups: ["cilium.io"]
              resources: ["ciliumnetworkpolicies", "ciliumclusterwidenetworkpolicies", "ciliumendpoints", "ciliumidentities", "ciliumnodes"]
              verbs: ["get", "list", "watch"]
            # ceph.rook.io: read CephCluster health. Needed to confirm
            # the rook-ceph-cluster health gate; had to be inferred by
            # rendering the chart instead.
            - apiGroups: ["ceph.rook.io"]
              resources: ["cephclusters", "cephblockpools", "cephfilesystems", "cephobjectstores"]
              verbs: ["get", "list", "watch"]
            # longhorn.io: recurring-job coverage lives on the Volume CR,
            # NOT the PV — the PV's labels never propagate. Without this
            # there is no way to tell a backed-up volume from an
            # unprotected one.
            - apiGroups: ["longhorn.io"]
              resources: ["volumes", "backups", "snapshots", "recurringjobs", "nodes"]
              verbs: ["get", "list", "watch"]
            # monitoring.coreos.com: confirm a ServiceMonitor/Probe
            # actually selects something, and that a PrometheusRule is
            # loaded rather than merely present in Git.
            - apiGroups: ["monitoring.coreos.com"]
              resources: ["servicemonitors", "podmonitors", "probes", "prometheusrules", "scrapeconfigs", "alertmanagerconfigs"]
              verbs: ["get", "list", "watch"]
            # source.toolkit.fluxcd.io: the other half of Flux state —
            # kustomizations/helmreleases above are useless for
            # diagnosing a stalled source without these.
            - apiGroups: ["source.toolkit.fluxcd.io"]
              resources: ["ocirepositories", "gitrepositories", "helmrepositories", "helmcharts", "buckets"]
              verbs: ["get", "list", "watch"]
            # admissionregistration.k8s.io: a failurePolicy:Fail webhook
            # gates every apply in the cluster (#13292). Reading the
            # configs is how you find out which one.
            - apiGroups: ["admissionregistration.k8s.io"]
              resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
              verbs: ["get", "list", "watch"]
    serviceAccount:
      kubectl-mcp: {}
