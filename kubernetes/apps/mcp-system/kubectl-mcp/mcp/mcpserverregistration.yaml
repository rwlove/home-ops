---
# TODO: apply schema
apiVersion: mcp.kuadrant.io/v1
kind: MCPServerRegistration
metadata:
  name: kubectl-tools
  labels:
    mcp.kuadrant.io/managed: "true"
spec:
  prefix: kubectl_
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: kubectl-mcp
  # kubectl-mcp-server 2.0.0 moved to stateless MCP 2026-07-28 and advertises only
  # ["2026-07-28"] in server/discover, even though it still serves 2025-era (stateful)
  # clients from the same process. The broker trusts server/discover, so it classifies
  # kubectl as 2026-only, takes the stateless/subscriptions-listen path, and silently
  # drops its tools from the aggregated tools/list (negotiates fine, 0 tools federated).
  # Override discover to declare both revisions so the broker serves the tools on the
  # stateful 2025-11-25 path. Same fix/mechanism as searxng-tools; the override is
  # Kuadrant/mcp-gateway #1515 (closed #1483).
  supportedProtocolVersions:
    - "2025-11-25"
    - "2026-07-28"
