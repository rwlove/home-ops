---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lloyd-mcp-broker-egress
spec:
  # Gateway-side egress: the Kuadrant broker (mcp-gateway app pod) dials the
  # cross-ns lloyd-mcp backend directly over Service DNS. The backend-side
  # ingress half lives in ai/lloyd-mcp (networkpolicies.allow.ingress). No
  # istio-egress CNP — the istio Envoy is never on this data path (#15834).
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: lloyd-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
