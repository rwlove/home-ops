---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mcp-conformance
  labels:
    app.kubernetes.io/name: mcp-conformance
spec:
  # Phase 1 of the mcp-platform conformance harness (project design doc,
  # 2026-11-17 Robert-frustration thread: "I want ONE agent that keeps all
  # MCP/gateway/kagent working when we add something"). Protocol-level
  # only -- no LLM, no kagent invocation -- so a 15-min cadence is cheap:
  # ~31 canary tools x up to 3 consumer profiles, each a sub-second HTTP
  # call once the broker is warm.
  #
  # Every canary tool in resources/canary-tools.yaml is read-only/
  # idempotent by hard rule -- never retry into a mutating tool.
  schedule: "*/15 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 0, not 1: the script already confirm-retries each failed canary
      # in-run, and a pod-level retry re-sent the same findings email
      # twice. A real failure gets a fresh attempt from the NEXT scheduled
      # tick (15m later) rather than a retry storm on this one.
      backoffLimit: 0
      # 360: a clean run is ~2m; leaves room for up to 4 in-run confirm
      # retries (~40s worst case each) on a bad day.
      activeDeadlineSeconds: 360
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mcp-conformance
          annotations:
            k8tz.io/inject: "false"
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          serviceAccountName: mcp-conformance
          # Unlike local-cron's zero-RBAC default: Check C genuinely needs
          # the k8s API (read-only, 2 CRD types -- see rbac.yaml). This is
          # the one CronJob in this tier that needs it.
          automountServiceAccountToken: true
          restartPolicy: OnFailure
          containers:
            - name: conformance
              image: docker.io/library/python:3.15@sha256:e4bc83a3314d078d651f06c8440e9a03ba892ee2f6577437f174abd8731fb343
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ceu
                - exec python3 /app/mcp_conformance.py
              env:
                - name: HOME
                  value: /tmp
                - name: TZ
                  value: Etc/UTC
                # Same enforced public hostname every real consumer uses
                # (kagent's RemoteMCPServer, the laptop lovenet-gateway
                # entry, Open WebUI's TOOL_SERVER_CONNECTIONS) -- never a
                # cluster-internal shortcut (Decision 1b,
                # docs/src/mcp_gateway_access_design.md).
                - name: BROKER_HOST
                  value: mcp.${SECRET_DOMAIN}
                - name: AUTH_TOKEN_URL
                  value: https://auth.${SECRET_DOMAIN}/api/oidc/token
              # OIDC_CLIENT_ID / OIDC_CLIENT_SECRET -- the SAME Authelia
              # client-credentials secret the broker's own JWT rotator
              # uses (kubernetes/apps/mcp-system/mcp-gateway/app/
              # externalsecret.yaml). We mint our own short-lived bearer
              # each run; we never borrow a live consumer's token.
              envFrom:
                - secretRef:
                    name: mcp-gateway-authelia-client
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: mcp-conformance-scripts
                defaultMode: 0o555
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
