---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cnp-allow.yaml
  - ./cronjob-mcp-conformance.yaml
  - ./rbac.yaml
configMapGenerator:
  - name: mcp-conformance-scripts
    files:
      - mcp_conformance.py=./resources/mcp_conformance.py
      - canary-tools.yaml=./resources/canary-tools.yaml
generatorOptions:
  disableNameSuffixHash: true
