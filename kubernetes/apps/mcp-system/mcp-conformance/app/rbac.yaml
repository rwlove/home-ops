---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/serviceaccount-v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-conformance
# automountServiceAccountToken is set true on the CronJob's pod spec
# (Check C genuinely needs the k8s API, unlike local-cron's zero-RBAC SAs).
automountServiceAccountToken: false
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/role-rbac-v1.json
#
# Read-only, 2 CRD types, get+list only -- Check C (kagent controller
# discovery-staleness) reading mcpvirtualservers.mcp.kuadrant.io /
# mcpserverregistrations.mcp.kuadrant.io, which both live in THIS
# namespace. Tightened from the original ClusterRole+ClusterRoleBinding
# (2026-11-17 follow-up) to a namespaced Role, matching
# longhorn-system/longhorn/config/rbac-storage-triage-read.yaml's shape --
# the mate for the api.kagent.dev/remotemcpservers half lives in `ai`,
# see ../config-ai/rbac-ai.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-conformance-read
rules:
  - apiGroups: ["mcp.kuadrant.io"]
    resources: ["mcpvirtualservers", "mcpserverregistrations"]
    verbs: ["get", "list"]
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/rolebinding-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-conformance-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-conformance-read
subjects:
  - kind: ServiceAccount
    name: mcp-conformance
    namespace: mcp-system
