{
  "_readme": "Phase 1 MCP federation conformance manifest (mcp-platform). Valid JSON, kept as *.yaml for human skimmability (parsed with Python's stdlib json module — no PyYAML dependency). consumer_profiles are the real, live wiring of the three probed consumers (kagent RemoteMCPServer url+header, the lovenet-gateway laptop entry, the Open WebUI TOOL_SERVER_CONNECTIONS seed) — keep them in lockstep with those resources, not the other way around. Each backends[] entry mirrors one live MCPServerRegistration (36 total). HARD RULE: every canary.tool MUST be read-only/idempotent — verified against each tool's real inputSchema (required args) and description before being added here; a backend with no safe canary carries canary:null and a canary_exclude_reason instead of a guess. Check A (catalog+schema-dialect) runs for every backend regardless of canary; Check B (tools/call) runs only where canary is non-null, and only against a consumer profile whose live tools/list (from that same run's Check A) actually contains the canary tool — scoping is read live, never assumed from this file.",
  "consumer_profiles": [
    {
      "name": "kagent",
      "path": "/mcp/stateful",
      "virtualserver": "mcp-system/kagent",
      "_mirrors": "kubernetes/apps/ai/kagent/app/remotemcpserver-mcp-gateway.yaml"
    },
    {
      "name": "laptop",
      "path": "/mcp",
      "virtualserver": "mcp-system/laptop",
      "_mirrors": "~/.local/bin/mcp-gateway-header (lovenet-gateway client entry)"
    },
    {
      "name": "open-webui",
      "path": "/mcp",
      "virtualserver": null,
      "_mirrors": "kubernetes/apps/collab/open-webui/app/helmrelease.yaml TOOL_SERVER_CONNECTIONS",
      "_full_aggregate_check": "the ONE profile with no VirtualServer scoping — Check A's prefix-presence sub-check (did a whole backend vanish from the catalog) only runs here, since kagent/laptop intentionally curate a subset and an absent prefix there is by design, not a finding"
    }
  ],
  "backends": [
