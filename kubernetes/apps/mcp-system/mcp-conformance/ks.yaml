---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mcp-conformance
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: mcp-system
  path: ./kubernetes/apps/mcp-system/mcp-conformance/app
  interval: 1h
  timeout: 5m
  wait: false
  dependsOn:
    # Needs the broker reachable AND a federated catalog to probe. Not
    # a hard dependsOn on every individual backend ks (that would make
    # this app depend on all 36, re-coupling it to backend churn) — the
    # probe itself tolerates a cold/partial catalog on its first tick
    # and reports what it finds.
    - name: mcp-gateway
      namespace: mcp-system
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
#
# Separate Kustomization purely because it needs a different
# targetNamespace than the app above: the `ai`-namespace half of Check
# C's RBAC (remotemcpservers.api.kagent.dev, read by the mcp-system
# ServiceAccount in the app Kustomization above). Mirrors
# longhorn-system/longhorn/ks.yaml's longhorn-jobs split.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app-ai mcp-conformance-rbac-ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app-ai
  targetNamespace: ai
  path: ./kubernetes/apps/mcp-system/mcp-conformance/config-ai
  interval: 1h
  timeout: 5m
  wait: false
