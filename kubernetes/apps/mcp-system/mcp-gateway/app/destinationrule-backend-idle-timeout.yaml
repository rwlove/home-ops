---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/networking.istio.io/destinationrule_v1.json
# Gateway -> MCP backend upstream idle timeout. Istio's default upstream
# idleTimeout is 1h, but the Python (uvicorn) and Node backends close idle
# keep-alive connections after 5s. Envoy would reuse a pooled connection the
# backend had just closed and return 503 "upstream connect error or
# disconnect/reset before headers. reset reason: connection termination"
# (response flag UC) -- ~1-6/day across comfyui/omada/cooter plus broker
# session-create 500s, 2026-11-21. 3s keeps Envoy the side that closes idle
# connections. Must stay BELOW the lowest backend keep-alive.
#
# One rule per backend Service (from the MCPServerRegistration HTTPRoutes),
# NOT a namespace wildcard: that would also catch the broker's gRPC ext_proc
# service (mcp-gateway:50051) and unrelated media/ai Services. exportTo "."
# scopes them to proxies in mcp-system, i.e. only the mcp-gateway-istio pods.
# New MCP backend? Add its Service here.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: mcp-idle-arr-mcp
spec:
  host: arr-mcp.mcp-system.svc.cluster.local
  exportTo:
    - "."
  trafficPolicy:
    connectionPool:
      http:
        idleTimeout: 3s
---
