---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mcp-gateway
  labels:
    istio: ingressgateway
    gateway.io/name: mcp-gateway
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "${SVC_MCPGATEWAY_ADDR}"
  listeners:
    # Public-facing broker entry. External clients reach this via the
    # envoy internal Gateway (mcp-gateway-internal HTTPRoute) → the
    # mcp-gateway-istio Service. Only mcp-gateway-broker (this ns)
    # attaches here; restricting to Same prevents any other ns from
    # creating a rogue HTTPRoute that would hijack mcp.${SECRET_DOMAIN}.
    - name: mcp
      hostname: "mcp.${SECRET_DOMAIN}"
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
    # Internal MCP-server fan-out. The MCPRouter inside the gateway pod
    # consumes routes attached to *.mcp.local. All MCP servers live in
    # mcp-system today; if that changes, relax to Selector with a
    # namespace label opt-in rather than going back to All.
    - name: mcps
      hostname: "*.mcp.local"
      port: 8080
      protocol: HTTP
      # tls:
      #   certificateRefs:
      #     - kind: Secret
      #       name: "${SECRET_DOMAIN/./-}-tls"
      allowedRoutes:
        namespaces:
          from: Same
    # Authenticated fan-out for unattended in-cluster agents (opencode).
    # ADDITIVE: a Kuadrant AuthPolicy attaches to THIS listener only
    # (sectionName: mcp-authz) so a policy mistake cannot affect the
    # unauthenticated `mcp` listener that langgraph / Open WebUI / Rob's
    # laptop ride. Distinct hostname so the MCPRouter/istio routes by
    # authority: in-cluster clients still dial the mcp-gateway-istio
    # Service by DNS but send Host: mcp-authz.mcp.local to land here.
    # Same port 8080 (one istio Service LB); listener isolation is by
    # hostname + sectionName-scoped policy, not by a separate port.
    - name: mcp-authz
      hostname: "mcp-authz.mcp.local"
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
