---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcp-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: mcp-gateway
  interval: 30m

  values:
    # Default values for mcp-gateway.
    # This is a YAML-formatted file.

    # Image configuration for mcp-gateway broker-router (deployed by controller)
    # workaround: https://github.com/rwlove/home-ops/issues/15717 — remove when a
    # Kuadrant release tag includes Kuadrant/mcp-gateway#1650 (merge commit
    # e5466cd2819884741102b88143b49121485e3d96, closes #1625) and MCP_GATEWAY_REF
    # can move past v1.0.2; then revert to ghcr.io/kuadrant/mcp-gateway.
    # Fix-fork (containers/mcp-gateway) carries #1650 (0001: accepts union types,
    # protocol-version-aware, so a 2025-11-25 client still gets a parseable
    # aggregated tools/list, required by github-mcp-server v2) and a fork-local
    # 0002 (drops outputSchema for 2025 clients on tools listed over a 2026
    # session; github-mcp v2 returns no structuredContent on 2025, which strict
    # TS/Python SDK clients reject). The former draft-07 $schema strip was
    # dropped (Claude Code accepts draft-07). Never deploy fork image v1.0.2-8:
    # it was built with the reverted session-less patch 0003.
    # imageController stays upstream.
    image:
      repository: ghcr.io/rwlove/mcp-gateway
      tag: v1.0.2-11@sha256:32cf90380018c9999fdfebb99305685852f968d2b86878dee59ff54f04832bbe

    # Image configuration for mcp-controller
    # imageController:
    #   repository: ghcr.io/kuadrant/mcp-controller
    #   # tag defaults to Chart.appVersion if empty
    #   tag: ""
    #   pullPolicy: IfNotPresent

    # Controller configuration
    broker:
      # How often (in seconds) the broker pings upstream MCP servers
      pollInterval: 60

    # Gateway configuration
    controller:
      # Enable/disable controller deployment
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi

    # Broker configuration (applied to broker-router deployed by controller)
    gateway:
      create: false
      # used by chart to compute MCPGatewayExtension.privateHost
      # as "<gateway.name>-<gateway.gatewayClassName>.<gateway.namespace>.svc.cluster.local:<gateway.port>"
      namespace: mcp-system
      publicHost: "mcp.${SECRET_DOMAIN}" # required for MCPGatewayExtension

    # MCPGatewayExtension configuration
    mcpGatewayExtension:
      # Manage MCPGatewayExtension out-of-band (see mcpgatewayextension.yaml)
      # so we can set httpRouteManagement: Disabled, which the chart does
      # not expose. We then own the broker HTTPRoute (httproute-broker.yaml)
      # and add external-dns.alpha.kubernetes.io/controller: none on it.
      create: false
