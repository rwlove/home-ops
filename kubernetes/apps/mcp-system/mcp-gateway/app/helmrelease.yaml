---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mcp-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: mcp-gateway
  interval: 30m

  values:
    # Default values for mcp-gateway.
    # This is a YAML-formatted file.

    # Image configuration for mcp-gateway broker-router (deployed by controller)
    # workaround: https://github.com/Kuadrant/mcp-gateway/pull/1656 — remove when the
    # broker normalizes pre-2020-12 $schema upstream (or anthropics/claude-code#88882
    # ships so Claude Code accepts draft-07); then revert to ghcr.io/kuadrant/mcp-gateway.
    # workaround: https://github.com/Kuadrant/mcp-gateway/pull/1650 — remove when a
    # Kuadrant release tag includes this merge commit (e5466cd2819884741102b88143b4912
    # 1485e3d96, closes #1625) and MCP_GATEWAY_REF can move past v1.0.2.
    # Fix-fork (containers/mcp-gateway) strips pre-2020-12 $schema + accepts union types
    # (protocol-version-aware per #1650) so Claude Code keeps the broker's served tools
    # and a 2025-11-25 client still gets a parseable aggregated tools/list.
    # imageController stays upstream.
    image:
      repository: ghcr.io/rwlove/mcp-gateway
      tag: v1.0.2-3@sha256:0a79fafc5d91c0cf2128a1a76d1e528201a4b9480075e0d666a1f4b50b0001cb

    # Image configuration for mcp-controller
    # imageController:
    #   repository: ghcr.io/kuadrant/mcp-controller
    #   # tag defaults to Chart.appVersion if empty
    #   tag: ""
    #   pullPolicy: IfNotPresent

    # Controller configuration
    broker:
      # How often (in seconds) the broker pings upstream MCP servers
      pollInterval: 60

    # Gateway configuration
    controller:
      # Enable/disable controller deployment
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi

    # Broker configuration (applied to broker-router deployed by controller)
    gateway:
      create: false
      # used by chart to compute MCPGatewayExtension.privateHost
      # as "<gateway.name>-<gateway.gatewayClassName>.<gateway.namespace>.svc.cluster.local:<gateway.port>"
      namespace: mcp-system
      publicHost: "mcp.${SECRET_DOMAIN}" # required for MCPGatewayExtension

    # MCPGatewayExtension configuration
    mcpGatewayExtension:
      # Manage MCPGatewayExtension out-of-band (see mcpgatewayextension.yaml)
      # so we can set httpRouteManagement: Disabled, which the chart does
      # not expose. We then own the broker HTTPRoute (httproute-broker.yaml)
      # and add external-dns.alpha.kubernetes.io/controller: none on it.
      create: false
