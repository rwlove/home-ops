---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-gateway-broker
  # No external-dns annotation here on purpose. This route MUST keep
  # mcp.${SECRET_DOMAIN} (the MCP router hair-pins back through the gateway with
  # that exact Host), but it must not publish the istio LB IP (.5). external-dns
  # v0.23.0's gateway-httproute source IGNORES route-level controller/target
  # annotations, so suppression can't happen here — it's done at the GATEWAY:
  # the mcp-gateway Gateway is labelled external-dns/exclude=true and dropped by
  # external-dns-bind's --gateway-label-filter. The public name is served solely
  # by the envoy internal gateway (.12) via the mcp-gateway-internal route.
spec:
  hostnames:
    - mcp.${SECRET_DOMAIN}
  parentRefs:
    - name: mcp-gateway
      sectionName: mcp
  rules:
    - backendRefs:
        - name: mcp-gateway
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /mcp
