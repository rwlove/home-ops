---
# TODO: apply schema
apiVersion: mcp.kuadrant.io/v1
kind: MCPVirtualServer
metadata:
  name: concierge
  labels:
    mcp.kuadrant.io/managed: "true"
spec:
  # Concierge data surface for the personal/concierge personas (cooter, crusher,
  # vila, lloyd, ledger, herman, tim, warren, gordon). Selected via the
  # `X-Mcp-Virtualserver: mcp-system/concierge` header on a dedicated Claude Code
  # client entry, so these personas get a small, reliable surface instead of
  # competing for slots in the full ~940-tool aggregate (which silently dropped
  # paperless from the laptop). ~58 tools; well under the client per-server cap.
  # Part of the per-domain scoping design — see home-ops #15664. v1 exact-names
  # (regenerate on backend tool changes); v2 category-based replacement in #15659.
  tools:
    - memory_add_observation
    - memory_add_observations
    - memory_create_entities
    - memory_create_entity
    - memory_create_relation
    - memory_delete_observation
    - memory_get_entity
    - memory_graph_walk
    - memory_link
    - memory_list_entities
    - memory_recent
    - memory_search
    - memory_update_entity
    - memory_update_observation
    - paperless_bulk_edit_correspondents
    - paperless_bulk_edit_custom_fields
    - paperless_bulk_edit_document_types
    - paperless_bulk_edit_documents
    - paperless_bulk_edit_tags
    - paperless_create_correspondent
    - paperless_create_custom_field
    - paperless_create_document_note
    - paperless_create_document_type
    - paperless_create_mail_rule
    - paperless_create_tag
    - paperless_delete_correspondent
    - paperless_delete_custom_field
    - paperless_delete_document_note
    - paperless_delete_document_type
    - paperless_delete_mail_rule
    - paperless_delete_tag
    - paperless_download_document
    - paperless_get_correspondent
    - paperless_get_custom_field
    - paperless_get_document
    - paperless_get_document_content
    - paperless_get_document_thumbnail
    - paperless_get_document_type
    - paperless_get_mail_account
    - paperless_get_mail_rule
    - paperless_list_correspondents
    - paperless_list_custom_fields
    - paperless_list_document_notes
    - paperless_list_document_types
    - paperless_list_documents
    - paperless_list_mail_accounts
    - paperless_list_mail_rules
    - paperless_list_tags
    - paperless_post_document
    - paperless_process_mail_account
    - paperless_query_documents
    - paperless_search_documents
