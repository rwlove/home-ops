# TODO: apply schema
# Tool scope for the kagent agent fleet consuming the broker through the enforced
# hostname. Selected by the `X-Mcp-Virtualserver: mcp-system/kagent` header on
# kagent's `mcp-gateway` RemoteMCPServer. This is the union of every prefixed tool
# any migrated agent uses; it grows one backend at a time as the migration
# proceeds (Batch A = the 9 already-federated backends; + comfyui for dali). Stays
# well under the ~940-tool federated catalog.
