---
# TODO: apply schema
# Tool scope for the kagent agent fleet consuming the broker through the enforced
# hostname. Selected by the `X-Mcp-Virtualserver: mcp-system/kagent` header on
# kagent's `mcp-gateway` RemoteMCPServer. Kept minimal during the migration pilot
# (memory read only); tools are added here as each agent is migrated off its
# direct per-backend RemoteMCPServer. Keeping the scope small also keeps kagent
# controller discovery well under the ~940-tool federated catalog.
apiVersion: mcp.kuadrant.io/v1
kind: MCPVirtualServer
metadata:
  name: kagent
  labels:
    mcp.kuadrant.io/managed: "true"
spec:
  tools:
    # Batch A union — prefixed tools for the 9 federated backends migrated in this pilot
    - arr_lidarr_add_artist
    - arr_lidarr_get_albums
    - arr_lidarr_get_artists
    - arr_lidarr_get_metadata_profiles
    - arr_lidarr_get_quality_profiles
    - arr_lidarr_get_queue
    - arr_lidarr_get_root_folders
    - arr_lidarr_get_tags
    - arr_lidarr_search
    - arr_lidarr_search_album
    - arr_lidarr_search_missing
    - esphome_check_device_update
    - esphome_get_device_logs
    - esphome_get_device_status
    - esphome_list_devices
    - github_get_commit
    - github_get_file_contents
    - github_get_latest_release
    - github_list_commits
    - github_list_pull_requests
    - github_search_code
    - github_search_pull_requests
    - grafana_alerting_rules_read
    - grafana_alerting_silences_read
    - grafana_list_datasources
    - grafana_list_prometheus_label_names
    - grafana_list_prometheus_label_values
    - grafana_list_prometheus_metric_metadata
    - grafana_list_prometheus_metric_names
    - grafana_query_loki_logs
    - grafana_query_prometheus
    - ha_ha_get_device
    - ha_ha_get_entity
    - ha_ha_get_history
    - ha_ha_get_integration
    - ha_ha_get_logs
    - ha_ha_get_overview
    - ha_ha_get_state
    - ha_ha_get_system_health
    - ha_ha_search
    - memory_add_observations
    - memory_create_entities
    - memory_create_relation
    - memory_get_entity
    - memory_graph_walk
    - memory_list_entities
    - memory_recent
    - memory_search
    - memory_update_entity
    - memory_update_observation
    - netbox_netbox_get_changelogs
    - netbox_netbox_get_object_by_id
    - netbox_netbox_get_objects
    - netbox_netbox_search_objects
    - omada_getGlobalDashboardOverview
    - omada_getRogueAps
    - omada_getThreatList
    - omada_getWanHealthDetail
    - omada_listDevices
    - paperless_download_document
