# TODO: apply schema
apiVersion: mcp.kuadrant.io/v1
kind: MCPVirtualServer
metadata:
  name: laptop
  labels:
    mcp.kuadrant.io/managed: "true"
spec:
  # Curated laptop tool surface selected via the `X-Mcp-Virtualserver:
  # mcp-system/laptop` request header. The broker aggregates ~940+ tools across
  # all backends; a client fed the full set only reliably surfaces a subset, so
  # less-used families silently fail to register. This VS scopes the laptop's
  # gateway connection to the concierge + ops + core families it actually uses
  # (~570 tools), excluding the large network families (omada/netbox/cilium,
  # ~400 tools) that belong to network-operator's own repo/session. The default
  # (no-header) surface is unchanged, so Open WebUI and kagent clients are
  # unaffected.
  #
  # v1 requires EXACT tool names (no wildcards/categories), so this list must be
  # regenerated when a backend adds tools it needs. The v2 category-based
  # replacement is tracked in #15659.
  tools:
    - arr_arr_search_all
