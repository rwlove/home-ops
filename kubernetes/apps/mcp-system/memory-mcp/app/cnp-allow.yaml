---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: memory-mcp-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: memory-mcp
  # Additive — default-deny enforces; these punch holes. Ingress from
  # same-ns mcp-gateway broker is covered by baseline allow-intra-ns.
  enableDefaultDeny:
    egress: false
    ingress: false
  ingress:
    # opencode (ai ns) connects to memory-mcp DIRECTLY rather than through
    # the broker: the aggregating gateway returns ~319k tokens of tool
    # schemas, far past the 65k context of the model that agent runs, so a
    # narrow direct connection is the only way it gets the shared knowledge
    # graph. Intra-namespace callers (the broker) are covered by the
    # baseline allow-intra-namespace rule and need nothing here.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: opencode
      toPorts:
        - ports:
            - port: "8070"
              protocol: TCP
  egress:
    # langgraph-memory CNPG primary in databases ns. Per
    # project_cilium_l4_port_targetport, toPorts matches container port.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: databases
            cnpg.io/cluster: postgres-langgraph-memory
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Embeddings → tei-embed-spark (OpenAI /v1) as of the 2026-07-25
    # cutover. Selector verified against the live pod label rather than
    # assumed — see rwlove/home-ops#13264 and #13269, where two rules in
    # this cluster named pods that don't exist and silently dropped all
    # traffic.
    #
    # The two transitional Ollama rollback holes that sat below this rule
    # are RETIRED as of 2026-07-26. Their stated condition ("drop these
    # once the TEI path has soaked") is met: v0.3.0 has run against
    # tei-embed-spark with 0 restarts and /readyz — which in v0.3.0
    # performs a REAL embed rather than a metadata GET — passing
    # throughout. A rollback would now also require an image revert, so it
    # is a deliberate operation that can carry its own CNP change.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: tei-embed-spark
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
