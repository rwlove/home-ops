---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: memory-mcp-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: memory-mcp
  # Additive — default-deny enforces; these punch holes. Ingress from
  # same-ns mcp-gateway broker is covered by baseline allow-intra-ns.
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    # langgraph-memory CNPG primary in databases ns. Per
    # project_cilium_l4_port_targetport, toPorts matches container port.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: databases
            cnpg.io/cluster: postgres-langgraph-memory
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Embeddings → tei-embed-spark (OpenAI /v1) as of the 2026-07-25
    # cutover. Selector verified against the live pod label rather than
    # assumed — see rwlove/home-ops#13264 and #13269, where two rules in
    # this cluster named pods that don't exist and silently dropped all
    # traffic.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: tei-embed-spark
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Both Ollamas retained purely as a rollback path: reverting this app
    # to v0.2.1 (or setting EMBED_BACKEND=ollama) must not also require a
    # CNP change to recover. bge-m3 still lives on ollama-spark, and the
    # P40 ollama covers a fallback to nomic-embed-text.
    # Drop these once the TEI path has soaked.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: ollama
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: ollama-spark
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
