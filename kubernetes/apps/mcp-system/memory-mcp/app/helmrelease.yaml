---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memory-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      memory-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            sidecar.istio.io/inject: "true"
        containers:
          app:
            image:
              repository: ghcr.io/rwlove/memory-mcp
              tag: v0.3.0@sha256:e6af1677dd6a82f0cd6c8779c6088b2316c6b4a4ab3f44fe2056bfb132644c9a
            env:
              # CNPG-generated app Secret reflected from databases ns
              # via emberstack reflector (see langgraph-memory
              # cluster.yaml inheritedMetadata). Exposes key `uri`.
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-langgraph-memory-app
                    key: uri
              # Embeddings cut from ollama-spark to tei-embed-spark
              # 2026-07-25, the last git-managed consumer of the Spark's
              # Ollama. Requires v0.3.0, which added the openai dialect
              # (rwlove/containers#161) — v0.2.1 could only speak
              # /api/embed, which is why this consumer lagged the others.
              #
              # Same bge-m3 weights, so the pgvector column is unaffected:
              # measured cosine 0.99999941 between the two backends through
              # the server's own embed(). No re-embed of kg.observations.
              EMBED_BACKEND: openai
              EMBED_BASE_URL: http://tei-embed-spark.ai.svc.cluster.local:3000
              # Informational only — TEI serves one model and ignores the
              # request's `model` field. Kept so the config is self-describing.
              EMBED_MODEL: bge-m3
              HOST: "0.0.0.0"
              PORT: "8070"
              TZ: America/New_York
            probes:
              # v0.1.2 server exposes /healthz (DB ping) and /readyz via
              # FastMCP custom_route. Switch from TCP-only to httpGet so the
              # kubelet drops us out of Service rotation if Postgres or the
              # embedder go sideways.
              #
              # v0.3.0 changed what /readyz checks: it now performs a real
              # one-token embed instead of Ollama's `GET /api/tags` (TEI has
              # no equivalent — /api/tags and /v1/models both 404). That
              # makes readiness STRICTER: an embedder that is reachable but
              # not serving now drops this pod from the Service, where
              # before it stayed in. Intended — but if readiness ever flaps
              # on a cold backend, raise READYZ_EMBED_TIMEOUT (default 5s)
              # rather than reverting.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &httpPort 8070
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *httpPort
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *httpPort
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          memory-mcp:
            app:
              - path: /tmp
                subPath: tmp
    service:
      app:
        controller: memory-mcp
        ports:
          http:
            port: *httpPort
    route:
      app:
        hostnames:
          - "memory-mcp.mcp.local"
        parentRefs:
          - name: mcp-gateway
            namespace: mcp-system
            sectionName: mcps
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp
            filters:
              # Strip inbound Authorization before forwarding to the
              # backend MCP server. The Kuadrant mcp-gateway forwards
              # all client headers; the broker-side Bearer (used to
              # authentication can take
              # precedence over the backend's own credential env in
              # any upstream MCP client that honors `Authorization`,
              # causing 401s against the real target service. Backend
              # MCP servers each carry their own env-loaded creds —
              # stripping the broker Bearer at this hop lets those
              # take effect uniformly across the fleet.
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - Authorization
            backendRefs:
              - identifier: app
                port: *httpPort
    networkpolicies:
      allow:
        type: cilium
        forceRename: memory-mcp-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: memory-mcp
        # Additive — default-deny enforces; these punch holes. Ingress from
        # same-ns mcp-gateway broker is covered by baseline allow-intra-ns.
        enableDefaultDeny:
          egress: false
          ingress: false
        # No explicit ingress: the only cross-namespace caller was ai/opencode
        # (retired), which connected directly to bypass the broker's ~319k-token
        # schema payload. The same-ns mcp-gateway broker is covered by the baseline
        # allow-intra-namespace rule. Re-add a narrow fromEndpoints here if a future
        # cross-ns client (e.g. Hermes) needs a direct memory-mcp connection.
        ingress:
          # memory-sync (ai) — the .md → memory-mcp ingest CronJob writes
          # entities/observations here (:8070). Cross-ns, so it needs an explicit
          # hole (the same-ns broker relies on baseline allow-intra-namespace).
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: memory-sync
            toPorts:
              - ports:
                  - port: "8070"
                    protocol: TCP
          # kagent agents (ai/part-of=kagent — agents use part-of, not instance)
          # — the observability-operator reads curated memory (read-only search)
          # to ground its triage.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/part-of: kagent
            toPorts:
              - ports:
                  - port: "8070"
                    protocol: TCP
        egress:
          # langgraph-memory CNPG primary in databases ns. Per
          # project_cilium_l4_port_targetport, toPorts matches container port.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  cnpg.io/cluster: postgres-langgraph-memory
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
          # Embeddings → tei-embed-spark (OpenAI /v1) as of the 2026-07-25
          # cutover. Selector verified against the live pod label rather than
          # assumed — see rwlove/home-ops#13264 and #13269, where two rules in
          # this cluster named pods that don't exist and silently dropped all
          # traffic.
          #
          # The two transitional Ollama rollback holes that sat below this rule
          # are RETIRED as of 2026-07-26. Their stated condition ("drop these
          # once the TEI path has soaked") is met: v0.3.0 has run against
          # tei-embed-spark with 0 restarts and /readyz — which in v0.3.0
          # performs a REAL embed rather than a metadata GET — passing
          # throughout. A rollback would now also require an image revert, so it
          # is a deliberate operation that can carry its own CNP change.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: tei-embed-spark
            toPorts:
              - ports:
                  - port: "3000"
                    protocol: TCP
