---
# TODO: apply schema
apiVersion: mcp.kuadrant.io/v1
kind: MCPServerRegistration
metadata:
  name: memory-tools
  labels:
    mcp.kuadrant.io/managed: "true"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: memory-mcp
  prefix: memory_
  # memory-mcp (FastMCP) advertises 2026-07-28 only, so the broker serves it on
  # the 2026 route and it is invisible to 2025 clients (Claude negotiates
  # 2025-11-25). Verified 2026-10-23: memory-mcp does serve 2025-11-25
  # (initialize negotiated 2025-11-25; tools/list returned 14 tools), so declare
  # both versions to place its tools on the 2025 route too. Same SDK
  # under-advertisement class as ha-mcp/searxng-mcp; via Kuadrant/mcp-gateway#1515.
  supportedProtocolVersions:
    - "2025-11-25"
    - "2026-07-28"
