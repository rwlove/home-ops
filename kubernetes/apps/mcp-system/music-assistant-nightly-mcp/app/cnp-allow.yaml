---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
#
# Mirrors kubernetes/apps/mcp-system/music-assistant-mcp/app/cnp-allow.yaml
# for the nightly backend. Same two-pod reasoning: the broker dials the
# nightly Service directly for registration + the 60s health ping, and
# the istio data-plane pod reaches it via the music-assistant-nightly-mcp
# HTTPRoute on every tool invocation. Paired with the ingress rule in
# music-assistant-nightly-allow (media) and the ReferenceGrant there.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: music-assistant-nightly-mcp-broker-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: music-assistant-nightly
      toPorts:
        - ports:
            - port: "8095"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: music-assistant-nightly-mcp-istio-egress
spec:
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: mcp-gateway
      gateway.istio.io/managed: istio.io-gateway-controller
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: music-assistant-nightly
      toPorts:
        - ports:
            - port: "8095"
              protocol: TCP
