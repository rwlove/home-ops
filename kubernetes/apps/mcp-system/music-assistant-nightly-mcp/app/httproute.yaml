---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
#
# Parallel MCP-gateway backend registration for the throwaway MA nightly
# test instance (music-assistant/support#6023). Exact structural mirror
# of kubernetes/apps/mcp-system/music-assistant-mcp/app/httproute.yaml —
# distinct hostname, distinct backend Service, same mount_path convention
# (the nightly image ships FastMCP mounted at /mcp with require_auth=false,
# same as every other MA tag on this fleet). Does NOT touch the prod
# HTTPRoute, prod's CNP, or prod's ReferenceGrant — fully additive.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: music-assistant-nightly-mcp
spec:
  hostnames:
    - music-assistant-nightly-mcp.mcp.local
  parentRefs:
    - name: mcp-gateway
      namespace: mcp-system
      sectionName: mcps
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Authorization
      backendRefs:
        - name: music-assistant-nightly
          namespace: media
          port: 8095
