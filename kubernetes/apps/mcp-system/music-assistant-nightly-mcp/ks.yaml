---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
#
# THROWAWAY — parallel MCP-gateway backend for music-assistant/support#6023.
# Ships SUSPENDED (both Kustomizations below). Mirrors
# kubernetes/apps/mcp-system/music-assistant-mcp/ks.yaml structurally: one
# Kustomization for the HTTPRoute + CNP, a second depending on the first
# for the MCPServerRegistration. Does not touch prod's two Kustomizations.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app music-assistant-nightly-mcp
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: mcp-system
  path: ./kubernetes/apps/mcp-system/music-assistant-nightly-mcp/app
  interval: 1h
  timeout: 5m
  suspend: true
  wait: false
  dependsOn:
    - name: mcp-gateway
      namespace: mcp-system
  retryInterval: 2m
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app music-assistant-nightly-mcp-mcpserverregistration
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: mcp-system
  path: ./kubernetes/apps/mcp-system/music-assistant-nightly-mcp/mcp
  interval: 1h
  timeout: 5m
  suspend: true
  wait: false
  dependsOn:
    - name: music-assistant-nightly-mcp
      namespace: mcp-system
  retryInterval: 2m
