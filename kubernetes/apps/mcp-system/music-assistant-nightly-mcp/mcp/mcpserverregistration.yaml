---
# TODO: apply schema
#
# Parallel backend, distinct tool prefix (`manightly_`) — the gateway
# exposes manightly_* tools pointed at the nightly instance alongside the
# existing music_assistant_* tools pointed at prod. mcp.kuadrant.io/v1alpha1
# is retired (served: false since mcp-gateway v1.0.0); v1 is the served +
# storage version, matching prod's registration and
# .agents/instructions/schema.correction.md.
apiVersion: mcp.kuadrant.io/v1
kind: MCPServerRegistration
metadata:
  name: music-assistant-nightly-tools
  labels:
    mcp.kuadrant.io/managed: "true"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: music-assistant-nightly-mcp
  prefix: manightly_
