---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: notify-mcp-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: notify-mcp
  # Additive — default-deny is what triggers the lockdown (same posture as
  # paperless-mcp). This only ADDS the smtp-relay egress; it does not lock
  # notify-mcp down, so DNS + the kagent-agent ingress hop keep working.
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    # The ONLY thing notify-mcp talks to: the smtp-relay guardrailed agent
    # submission endpoint (:2526, plain TCP) in the home namespace. The relay
    # itself recipient-locks + rate-limits, so this is a single narrow hop.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: home
            app.kubernetes.io/name: smtp-relay
      toPorts:
        - ports:
            - port: "2526"
              protocol: TCP
