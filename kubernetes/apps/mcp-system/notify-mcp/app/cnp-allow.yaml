---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: notify-mcp-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: notify-mcp
  # Additive — the mcp-system default-deny is what enforces both directions;
  # these rules punch the holes. NOTE: the kagent AGENTS' ingress to :8060 is
  # NOT here — it lives in the shared kagent-mcp-read-allow (mcp-system) added in
  # #14478 after this app shipped without it. This CNP adds notify-mcp's egress
  # to the relay and the local-cron caller's ingress.
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    # The ONLY thing notify-mcp talks to: the smtp-relay guardrailed agent
    # submission endpoint (:2526, plain TCP) in the home namespace. The relay
    # itself recipient-locks + rate-limits, so this is a single narrow hop.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: home
            app.kubernetes.io/name: smtp-relay
      toPorts:
        - ports:
            - port: "2526"
              protocol: TCP
  ingress:
    # local-cron (ai) POSTs the triage FYI digests to /send:8060 for themed,
    # per-agent HTML mail. The kagent agents reach :8060 via kagent-mcp-read-allow
    # (see the note above); this rule is only for the deterministic cron caller.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: local-cron
      toPorts:
        - ports:
            - port: "8060"
              protocol: TCP
