---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notify-mcp
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: notify-mcp-secret
    creationPolicy: Owner
  data:
    # The single recipient the guardrailed smtp-relay :2526 endpoint permits.
    # Same 1P `smtp-relay` item + property maddy reads for its allowlist and
    # notify.sh reads for its To: header, so the MCP tool, the cron helper, and
    # the relay all agree on the one permitted address. Kept out of git.
    - secretKey: AGENT_NOTIFY_RCPT
      remoteRef:
        key: smtp-relay
        property: agent_notify_rcpt
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# SEPARATE from notify-mcp-secret ON PURPOSE: the 1P `agent-callback/hmac_key`
# does not exist until Rob creates it, and a missing property fails the WHOLE
# ExternalSecret it lives in. Keeping it in its own target secret (mounted
# optional in the HelmRelease) means a not-yet-created key can NEVER break
# notify-mcp-secret (AGENT_NOTIFY_RCPT) and dark the fleet — it only leaves
# CALLBACK_HMAC_KEY unset, which drops action buttons (fail-safe).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notify-mcp-callback
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: notify-mcp-callback-secret
    creationPolicy: Owner
  data:
    # Shared HMAC key for signing email action-button tokens — the SAME 1P value
    # the agent-callback service (ai ns) verifies with. SETUP: Rob adds
    # `hmac_key` (openssl rand -hex 32) to the 1Password `agent-callback` item.
    - secretKey: CALLBACK_HMAC_KEY
      remoteRef:
        key: agent-callback
        property: hmac_key
