---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: notify-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      notify-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            sidecar.istio.io/inject: "true"
        containers:
          app:
            image:
              repository: ghcr.io/rwlove/notify-mcp
              tag: v0.3.0@sha256:9803cc2cf7adee15ef2cc5c4470207203fc85d19eeebe1d9e43aed33c442191e
            env:
              PORT: "8060"
              HOST: "0.0.0.0"
              TZ: America/New_York
              # The relay recipient-locks anyway; this envelope sender is
              # cosmetic (the relay rewrites it). ${SECRET_DOMAIN} is a Flux
              # postBuild substitution.
              MAIL_FROM: "agents@${SECRET_DOMAIN}"
              SMTP_RELAY_HOST: smtp-relay.home.svc.cluster.local
              SMTP_RELAY_PORT: "2526"
            envFrom:
              # Supplies AGENT_NOTIFY_RCPT — the single recipient the relay
              # permits (Rob). Same 1P item + property maddy reads for its
              # allowlist, so tool and relay agree on the one address.
              - secretRef:
                  name: notify-mcp-secret
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          notify-mcp:
            app:
              - path: /tmp
                subPath: tmp
    service:
      app:
        controller: notify-mcp
        ports:
          http:
            port: 8060
