---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: notify-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      # Spread the replicas across nodes so a single node loss can't take the
      # whole tool down. Soft (ScheduleAnyway) so it never blocks scheduling.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: notify-mcp
    controllers:
      notify-mcp:
        # HA restored. notify-mcp v0.5.0 sets FastMCP `stateless_http=True` — no
        # per-pod in-memory MCP session, so >1 replica behind a round-robin
        # Service is safe (initialize/tool-call need not hit the same pod). This
        # is what the earlier (stateful) 2-replica attempt lacked, which split the
        # session and darked ~50% of fleet-wide agent tool-inits (home-ops#14511
        # reverted to 1). notify-mcp is bound into EVERY kagent agent, so 2
        # replicas + a zero-maxUnavailable roll + the PDB keep it always-serving
        # across pod loss and its own updates.
        replicas: 2
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            sidecar.istio.io/inject: "true"
        containers:
          app:
            image:
              repository: ghcr.io/rwlove/notify-mcp
              tag: v0.5.0@sha256:46465e32e04bc7fb86176a05c9d07f50eee76c1cb6fc7beb6f89fa2a8ecbd42a
            env:
              PORT: "8060"
              HOST: "0.0.0.0"
              TZ: America/New_York
              # The relay recipient-locks anyway; this envelope sender is
              # cosmetic (the relay rewrites it). ${SECRET_DOMAIN} is a Flux
              # postBuild substitution.
              MAIL_FROM: "agents@${SECRET_DOMAIN}"
              SMTP_RELAY_HOST: smtp-relay.home.svc.cluster.local
              SMTP_RELAY_PORT: "2526"
              # Base URL for email action-button callbacks (agent-callback, ai ns,
              # internal gateway). notify-mcp signs a token and points buttons at
              # <base>/act?t=<token>. ${SECRET_DOMAIN} is a Flux postBuild var.
              CALLBACK_BASE_URL: "https://agent-callback.${SECRET_DOMAIN}"
            envFrom:
              # Supplies AGENT_NOTIFY_RCPT — the single recipient the relay
              # permits (Rob). Same 1P item + property maddy reads for its
              # allowlist, so tool and relay agree on the one address.
              - secretRef:
                  name: notify-mcp-secret
              # CALLBACK_HMAC_KEY for signing email action buttons. optional:true
              # + a SEPARATE ExternalSecret so a not-yet-created 1P key can never
              # break notify-mcp-secret (fleet-critical). Unset -> action buttons
              # are dropped, normal email keeps working.
              - secretRef:
                  name: notify-mcp-callback-secret
                  optional: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          notify-mcp:
            app:
              - path: /tmp
                subPath: tmp
    service:
      app:
        controller: notify-mcp
        ports:
          http:
            port: 8060
