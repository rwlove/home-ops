---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: notify-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      notify-mcp:
        # SINGLE replica — deliberate. notify-mcp is a FastMCP streamable-HTTP
        # server: an MCP session is created in-memory on the pod that answers
        # `initialize`, and every follow-up request (`notifications/initialized`,
        # tool list/call) must reach THAT pod. With >1 replica behind a
        # round-robin Service (sessionAffinity: None) the follow-ups land on the
        # wrong pod → "session not found" → the agent's whole tool-init fails.
        # Because notify-mcp is bound into EVERY kagent agent, 2 replicas darked
        # ~50% of agent tool-inits fleet-wide (regression from the earlier HA
        # attempt; reverted here). Real HA needs FastMCP `stateless_http=True`
        # (no per-pod session) — a server-code change tracked separately, NOT a
        # replica bump. The stateless `/send` HTTP route the local-cron digests
        # use is unaffected either way (single self-contained request).
        replicas: 1
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            sidecar.istio.io/inject: "true"
        containers:
          app:
            image:
              repository: ghcr.io/rwlove/notify-mcp
              tag: v0.4.0@sha256:00665bf6ea05851dbb77a6a688c560793bbfd5c5e99e6b3d19ce31350e162e54
            env:
              PORT: "8060"
              HOST: "0.0.0.0"
              TZ: America/New_York
              # The relay recipient-locks anyway; this envelope sender is
              # cosmetic (the relay rewrites it). ${SECRET_DOMAIN} is a Flux
              # postBuild substitution.
              MAIL_FROM: "agents@${SECRET_DOMAIN}"
              SMTP_RELAY_HOST: smtp-relay.home.svc.cluster.local
              SMTP_RELAY_PORT: "2526"
              # Base URL for email action-button callbacks (agent-callback, ai ns,
              # internal gateway). notify-mcp signs a token and points buttons at
              # <base>/act?t=<token>. ${SECRET_DOMAIN} is a Flux postBuild var.
              CALLBACK_BASE_URL: "https://agent-callback.${SECRET_DOMAIN}"
            envFrom:
              # Supplies AGENT_NOTIFY_RCPT — the single recipient the relay
              # permits (Rob). Same 1P item + property maddy reads for its
              # allowlist, so tool and relay agree on the one address.
              - secretRef:
                  name: notify-mcp-secret
              # CALLBACK_HMAC_KEY for signing email action buttons. optional:true
              # + a SEPARATE ExternalSecret so a not-yet-created 1P key can never
              # break notify-mcp-secret (fleet-critical). Unset -> action buttons
              # are dropped, normal email keeps working.
              - secretRef:
                  name: notify-mcp-callback-secret
                  optional: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          notify-mcp:
            app:
              - path: /tmp
                subPath: tmp
    service:
      app:
        controller: notify-mcp
        ports:
          http:
            port: 8060
