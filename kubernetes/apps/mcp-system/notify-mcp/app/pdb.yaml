---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/poddisruptionbudget-policy-v1.json
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notify-mcp
spec:
  # Keep at least one notify-mcp serving through voluntary disruptions (node
  # drains, evictions). notify-mcp is a hard dependency of every kagent agent's
  # tool-init, so a moment with zero replicas darks the whole fleet.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notify-mcp
