---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      paperless-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            sidecar.istio.io/inject: "true"
        containers:
          app:
            image:
              # workaround: https://github.com/baruchiro/paperless-mcp/pull/140 — revert to ghcr.io/baruchiro/paperless-mcp `latest` once BOTH upstream fixes ship
              # Fork build of baruchiro/paperless-mcp v2.0.1 carrying TWO fixes the
              # Kuadrant broker needs to federate paperless:
              #   1. #138 schema — collapse `type: ["T","null"]` unions (from
              #      `.nullable()`) to scalar; the broker drops the whole backend
              #      otherwise (PR baruchiro/paperless-mcp#140).
              #   2. stateful transport — v2.x ran stateless (empty Mcp-Session-Id,
              #      GET /mcp -> 405); the v0.9.0 broker won't federate a stateless
              #      upstream (same wall as github/windmill/searxng, #13627). The
              #      fork issues a real Mcp-Session-Id + notification stream.
              # Built from rwlove/paperless-mcp `fix/stateful-transport`; tracked in
              # home-ops #13804. Return to baruchiro `latest` when both land upstream.
              repository: ghcr.io/rwlove/paperless-mcp
              tag: fix-138-stateful-20260825@sha256:30b9d7ea0eb99350c1a44aed222da1e0d301454b1f10800296192821e7367882
            # v2.0.x makes a per-request `Authorization: Bearer` mandatory and drops
            # the env-token fallback, so every broker request 401s (the mcp-gateway
            # route strips Authorization so backends use their own env cred). The
            # fork is v2.0.1-based, so this is still required: --no-auth restores the
            # env-token fallback (PAPERLESS_API_KEY, set by the ExternalSecret).
            # Safe here: CNP-gated to broker-only access behind Authelia — the
            # "trusted network" the flag documents. Appends to the image
            # entrypoint `node build/index.js --http --port 3000`.
            args: ["--no-auth"]
            env:
              PAPERLESS_URL: https://paperless.${SECRET_DOMAIN}
            envFrom:
              - secretRef:
                  name: paperless-mcp-secret
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: paperless-mcp
        ports:
          http:
            port: 3000
    route:
      app:
        hostnames:
          - "paperless-mcp.mcp.local"
        parentRefs:
          - name: mcp-gateway
            namespace: mcp-system
            sectionName: mcps
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp
            filters:
              # Strip inbound Authorization before forwarding to the
              # backend MCP server. The Kuadrant mcp-gateway forwards
              # all client headers; the broker-side Bearer (used to
              # authentication can take
              # precedence over the backend's own credential env in
              # any upstream MCP client that honors `Authorization`,
              # causing 401s against the real target service. Backend
              # MCP servers each carry their own env-loaded creds —
              # stripping the broker Bearer at this hop lets those
              # take effect uniformly across the fleet.
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - Authorization
            backendRefs:
              - identifier: app
                port: 3000
