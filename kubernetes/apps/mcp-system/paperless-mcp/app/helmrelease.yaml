---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      paperless-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            sidecar.istio.io/inject: "true"
        containers:
          app:
            image:
              # De-forked to stock 2026-09-25 (#13804). The fork's only remaining
              # patch was stateful transport for the 0.9.0 broker; mcp-gateway
              # 1.0.1 tolerates stateless streamable-HTTP upstreams
              # (Kuadrant/mcp-gateway#1485), so it is no longer needed. Stock
              # v2.2.0 already carries the #138 schema fix (Zod v4 -> anyOf,
              # baruchiro/paperless-mcp#140/#146/#148) and negotiates 2025-11-25
              # natively (SDK >=1.30), so no protocol shim is needed either.
              repository: ghcr.io/baruchiro/paperless-mcp
              tag: 2.2.0@sha256:7c424f8d1e5168140ed14c4e7be2bdae7e781323e96e2fbaac3e2dd57d7ca5a9
            # v2.0.x makes a per-request `Authorization: Bearer` mandatory and drops
            # the env-token fallback, so every broker request 401s (the mcp-gateway
            # route strips Authorization so backends use their own env cred).
            # Stock v2.2.0 keeps this behavior, so --no-auth is still required to
            # restore the env-token fallback (PAPERLESS_API_KEY, set by the ExternalSecret).
            # Safe here: CNP-gated to broker-only access behind Authelia — the
            # "trusted network" the flag documents. Appends to the image
            # entrypoint `node build/index.js --http --port 3000`.
            args: ["--no-auth"]
            env:
              PAPERLESS_URL: https://paperless.${SECRET_DOMAIN}
            envFrom:
              - secretRef:
                  name: paperless-mcp-secret
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: paperless-mcp
        ports:
          http:
            port: 3000
    route:
      app:
        hostnames:
          - "paperless-mcp.mcp.local"
        parentRefs:
          - name: mcp-gateway
            namespace: mcp-system
            sectionName: mcps
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp
            filters:
              # Strip inbound Authorization before forwarding to the
              # backend MCP server. The Kuadrant mcp-gateway forwards
              # all client headers; the broker-side Bearer (used to
              # authentication can take
              # precedence over the backend's own credential env in
              # any upstream MCP client that honors `Authorization`,
              # causing 401s against the real target service. Backend
              # MCP servers each carry their own env-loaded creds —
              # stripping the broker Bearer at this hop lets those
              # take effect uniformly across the fleet.
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - Authorization
            backendRefs:
              - identifier: app
                port: 3000
