---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# The scoped GitHub PR token pr-mcp uses to open PRs. Reuses the SAME 1Password
# `kagent-doer` item + `pr_token` property the doer pipeline uses — a fine-grained
# PAT scoped to rwlove/home-ops, Contents:write + PullRequests:write only (no
# merge; the default branch is protected). Only this service holds it; agents
# never see it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pr-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pr-mcp-secret
  data:
    - secretKey: GITHUB_PR_TOKEN
      remoteRef:
        key: kagent-doer
        property: pr_token
