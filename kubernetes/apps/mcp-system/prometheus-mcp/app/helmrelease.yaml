---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 1000

        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      prometheus-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/pab1it0/prometheus-mcp-server
              tag: 1.6.2@sha256:3c3921301229618d0b00a46a06e3b0c25745b31855f16919cf7b4fa040d47ec6
            env:
              PROMETHEUS_URL: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
              PROMETHEUS_MCP_SERVER_TRANSPORT: http
              PROMETHEUS_MCP_BIND_HOST: 0.0.0.0
              PROMETHEUS_MCP_BIND_PORT: "8080"
              PROMETHEUS_DISABLE_LINKS: true
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: prometheus-mcp
        ports:
          http:
            port: 8080

    route:
      app:
        hostnames:
          - "prometheus-mcp.mcp.local"
        parentRefs:
          - name: mcp-gateway
            namespace: mcp-system
            sectionName: mcps
        rules:
          - filters:
              # Strip inbound Authorization before forwarding to the
              # backend MCP server. See sibling helmreleases for the
              # full rationale — broker Bearer can shadow the
              # backend's own env-loaded credential.
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - Authorization
            backendRefs:
              - identifier: app
                port: 8080
