---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pump-mcp-arnold
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: mcp-system
  path: ./kubernetes/apps/mcp-system/pump-mcp-arnold/app
  interval: 1h
  timeout: 5m
  wait: false
  dependsOn:
    - name: mcp-gateway
      namespace: mcp-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pump-mcp-arnold-mcpserverregistration
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: mcp-system
  path: ./kubernetes/apps/mcp-system/pump-mcp-arnold/mcp
  interval: 1h
  timeout: 5m
  wait: false
  dependsOn:
    - name: pump-mcp-arnold
      namespace: mcp-system
