---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pump-mcp-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pump-mcp
  # Additive — default-deny is what triggers the lockdown. Broker → this
  # backend on :8000 is intra-namespace (baseline allow-intra-namespace).
  # DNS / apiserver / istiod egress are handled cluster-wide (same as
  # paperless-mcp, which carries no istiod rule). The only app-specific
  # hole needed is the cross-ns read to the PUMP CNPG replica.
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    # → PUMP CNPG read replica in the databases ns (read-only health_ro,
    #   api.v_weight). Mirrors the ai/pump-mcp egress.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: databases
            cnpg.io/cluster: postgres-pump
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
