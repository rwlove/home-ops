---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pump-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pump-mcp-secret
    template:
      data:
        # Connect AS the read-only health_ro role (SELECT only api.v_weight).
        # Same cred/role the ai/pump-mcp + health PostgREST already use.
        DATABASE_URI: "postgresql://health_ro:{{ .RO_DB_PASS }}@postgres-pump-ro.databases.svc.cluster.local:5432/pump"
  dataFrom:
    - extract:
        key: health
