---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pump-mcp
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: mcp-system
  # SUSPENDED on ship — gated bring-up (SSE-upstream probe, step 1).
  # Unsuspending this deploys the backend pod + HTTPRoute only; it federates
  # NO tools yet (that is the registration below). Inert: a read-only
  # health_ro reader of api.v_weight plus an unused route.
  suspend: true
  path: ./kubernetes/apps/mcp-system/pump-mcp/app
  interval: 1h
  timeout: 5m
  wait: false
  dependsOn:
    - name: mcp-gateway
      namespace: mcp-system
  retryInterval: 2m
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pump-mcp-mcpserverregistration
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: mcp-system
  # SUSPENDED on ship — gated bring-up (SSE-upstream probe, step 2, AFTER
  # step 1 is verified healthy). Unsuspending this registers pump_* into the
  # broker and is what answers the open question: can the Kuadrant broker
  # consume an SSE upstream (postgres-mcp is SSE-only; every other backend is
  # streamable-HTTP)? It also federates the weight tool to BOTH gateway
  # client_credentials clients (mcp-gateway AND mcp-openwebui), so it stays
  # gated until the behavior is confirmed.
  suspend: true
  path: ./kubernetes/apps/mcp-system/pump-mcp/mcp
  interval: 1h
  timeout: 5m
  wait: false
  dependsOn:
    - name: pump-mcp
      namespace: mcp-system
  retryInterval: 2m
