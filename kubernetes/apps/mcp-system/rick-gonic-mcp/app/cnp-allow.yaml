---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rick-gonic-mcp-broker-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: rick-gonic-mcp
      toPorts:
        - ports:
            - port: "8099"
              protocol: TCP
