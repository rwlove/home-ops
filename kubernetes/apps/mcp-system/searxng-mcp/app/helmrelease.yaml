---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      searxng-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            sidecar.istio.io/inject: "true"
        containers:
          app:
            image:
              repository: docker.io/isokoliuk/mcp-searxng
              # workaround: https://github.com/ihor-sokoliuk/mcp-searxng/issues/256 — remove when 2.0.0 accepts the Kuadrant mcp-gateway broker session handshake (or the broker adds stateless-ping support, Kuadrant/mcp-gateway#1419). 2.0.0's strict streamable-HTTP enforcement de-federates the search tools; held at 1.16.0. Renovate pinned <2.0.0 in .github/renovate/packageRules.json5.
              tag: "1.16.0@sha256:d892b5aede28ab6476ba7ab3ce6b7e2e564ee43888e9c39ac5df52b74e1ca74d"
            env:
              SEARXNG_URL: http://searxng.collab.svc.cluster.local:8080
              # MCP_HTTP_HOST defaults to 127.0.0.1 (loopback-only), so the
              # mcp-gateway broker gets "connection refused" — must bind all
              # interfaces for cluster traffic to reach it.
              MCP_HTTP_HOST: "0.0.0.0"
              MCP_HTTP_PORT: "3000"
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: searxng-mcp
        ports:
          http:
            port: 3000
    route:
      app:
        hostnames:
          - "searxng-mcp.mcp.local"
        parentRefs:
          - name: mcp-gateway
            namespace: mcp-system
            sectionName: mcps
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp
            filters:
              # Strip inbound Authorization before forwarding to the
              # backend MCP server. The Kuadrant mcp-gateway forwards
              # all client headers; the broker-side Bearer (used to
              # authentication can take
              # precedence over the backend's own credential env in
              # any upstream MCP client that honors `Authorization`,
              # causing 401s against the real target service. Backend
              # MCP servers each carry their own env-loaded creds —
              # stripping the broker Bearer at this hop lets those
              # take effect uniformly across the fleet.
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - Authorization
            backendRefs:
              - identifier: app
                port: 3000
