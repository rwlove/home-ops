---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      searxng-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            sidecar.istio.io/inject: "true"
        containers:
          app:
            image:
              repository: docker.io/isokoliuk/mcp-searxng
              # 2.x needs MCP_HTTP_STATELESS=true to federate through the
              # Kuadrant mcp-gateway broker (see the env comment below).
              # Renovate <2.0.0 pin removed 2026-08-22 — 2.x verified working
              # with stateless mode (mcp-searxng#256).
              tag: "2.4.0@sha256:380eee8e96dd1b5299cae3986064bf6fe63e0ad8f648493b3015d99263222c2a"
            env:
              SEARXNG_URL: http://searxng.collab.svc.cluster.local:8080
              # MCP_HTTP_HOST defaults to 127.0.0.1 (loopback-only), so the
              # mcp-gateway broker gets "connection refused" — must bind all
              # interfaces for cluster traffic to reach it.
              MCP_HTTP_HOST: "0.0.0.0"
              MCP_HTTP_PORT: "3000"
              # 2.0.0's rate-limiter needs trust-proxy set, or it logs
              # ERR_ERL_UNEXPECTED_X_FORWARDED_FOR and mis-keys on the mesh's
              # X-Forwarded-For. Trust only in-cluster proxy pods (Cilium pod
              # CIDR) — not spoofable from outside the mesh. Parallels
              # github-mcp-server's --trust-proxy-headers.
              MCP_HTTP_TRUST_PROXY: "10.42.0.0/16"
              # Permanent config, not a workaround: the mcp-gateway broker connects to
              # upstreams with session-less stateless POSTs by design — Kuadrant/mcp-gateway#1419
              # (the request that the broker instead carry a session-ID/protocol-version for a
              # stateful 2026-07-28 handshake) was closed not-planned, so this will not change.
              # searxng-mcp 2.x's strict streamable-HTTP layer rejects a session-less POST
              # (`hasInitializeRequest=false, sessionId=undefined`) unless POST-only stateless
              # mode is enabled; a request/response search tool needs none of the legacy
              # GET/DELETE /mcp subscriptions this drops. Verified working 2026-08-22
              # (mcp-searxng#256).
              MCP_HTTP_STATELESS: "true"
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: searxng-mcp
        ports:
          http:
            port: 3000
    route:
      app:
        hostnames:
          - "searxng-mcp.mcp.local"
        parentRefs:
          - name: mcp-gateway
            namespace: mcp-system
            sectionName: mcps
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp
            filters:
              # Strip inbound Authorization before forwarding to the
              # backend MCP server. The Kuadrant mcp-gateway forwards
              # all client headers; the broker-side Bearer (used to
              # authentication can take
              # precedence over the backend's own credential env in
              # any upstream MCP client that honors `Authorization`,
              # causing 401s against the real target service. Backend
              # MCP servers each carry their own env-loaded creds —
              # stripping the broker Bearer at this hop lets those
              # take effect uniformly across the fleet.
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - Authorization
            backendRefs:
              - identifier: app
                port: 3000
    networkpolicies:
      allow:
        type: cilium
        forceRename: searxng-mcp-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: searxng-mcp
        # Additive — default-deny is what triggers the lockdown.
        enableDefaultDeny:
          egress: false
          ingress: false
        egress:
          # searxng in collab ns. Env: SEARXNG_URL =
          # http://searxng.collab.svc.cluster.local:8080
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: collab
                  app.kubernetes.io/name: searxng
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          # search_web_url_read does a DIRECT fetch from this pod to arbitrary
          # result URLs (not via searxng), so it needs world egress or it aborts
          # on every external host. Same pattern as github-mcp / chrome-mcp;
          # mirrors searxng's own egress in collab/searxng/app/cnp-allow.yaml.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "80"
                    protocol: TCP
