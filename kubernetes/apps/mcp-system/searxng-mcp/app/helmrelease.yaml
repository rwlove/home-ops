---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      searxng-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            sidecar.istio.io/inject: "true"
        containers:
          app:
            image:
              repository: docker.io/isokoliuk/mcp-searxng
              # 2.0.0 needs MCP_HTTP_STATELESS=true to federate through the
              # Kuadrant mcp-gateway broker (workaround annotation is on that
              # env below). Renovate <2.0.0 pin removed 2026-08-22 — 2.0.0
              # verified working with stateless mode (mcp-searxng#256).
              tag: "2.0.0@sha256:485544ea18394c8c971f3db0f4f75d61422f7a95aae64fc72ca86118f4f05ce4"
            env:
              SEARXNG_URL: http://searxng.collab.svc.cluster.local:8080
              # MCP_HTTP_HOST defaults to 127.0.0.1 (loopback-only), so the
              # mcp-gateway broker gets "connection refused" — must bind all
              # interfaces for cluster traffic to reach it.
              MCP_HTTP_HOST: "0.0.0.0"
              MCP_HTTP_PORT: "3000"
              # workaround: https://github.com/Kuadrant/mcp-gateway/issues/1419 — remove when the mcp-gateway broker carries the session-ID/protocol-version for the stateful 2026-07-28 handshake instead of sending a session-less request. Until then 2.0.0's strict streamable-HTTP layer rejects the broker POST as `hasInitializeRequest=false, sessionId=undefined`; POST-only stateless mode accepts it. Dropping this env restores legacy GET/DELETE /mcp + subscriptions + server->client notifications, none of which a request/response search tool needs. Verified working 2026-08-22 (mcp-searxng#256). Tracking issue #13682.
              MCP_HTTP_STATELESS: "true"
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: searxng-mcp
        ports:
          http:
            port: 3000
    route:
      app:
        hostnames:
          - "searxng-mcp.mcp.local"
        parentRefs:
          - name: mcp-gateway
            namespace: mcp-system
            sectionName: mcps
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp
            filters:
              # Strip inbound Authorization before forwarding to the
              # backend MCP server. The Kuadrant mcp-gateway forwards
              # all client headers; the broker-side Bearer (used to
              # authentication can take
              # precedence over the backend's own credential env in
              # any upstream MCP client that honors `Authorization`,
              # causing 401s against the real target service. Backend
              # MCP servers each carry their own env-loaded creds —
              # stripping the broker Bearer at this hop lets those
              # take effect uniformly across the fleet.
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - Authorization
            backendRefs:
              - identifier: app
                port: 3000
