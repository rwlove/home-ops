---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      searxng-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            sidecar.istio.io/inject: "true"
        containers:
          app:
            image:
              repository: docker.io/isokoliuk/mcp-searxng
              # workaround: https://github.com/ihor-sokoliuk/mcp-searxng/issues/256 — 2.0.0 CANARY testing MCP_HTTP_STATELESS=true, the maintainer's suggested compat mode for the Kuadrant mcp-gateway broker's session-less request (bare ping). Stateless mode is POST-only: no legacy GET/DELETE /mcp, cross-request subscriptions, resumability, or server->client notifications — acceptable for a request/response search tool. Remove the env + this note once 2.0.0 federates cleanly (or the broker ships the stateful 2026-07-28 handshake, Kuadrant/mcp-gateway#1419). Renovate still pinned <2.0.0 in .github/renovate/packageRules.json5.
              tag: "2.0.0@sha256:485544ea18394c8c971f3db0f4f75d61422f7a95aae64fc72ca86118f4f05ce4"
            env:
              SEARXNG_URL: http://searxng.collab.svc.cluster.local:8080
              # MCP_HTTP_HOST defaults to 127.0.0.1 (loopback-only), so the
              # mcp-gateway broker gets "connection refused" — must bind all
              # interfaces for cluster traffic to reach it.
              MCP_HTTP_HOST: "0.0.0.0"
              MCP_HTTP_PORT: "3000"
              # CANARY (mcp-searxng#256): POST-only stateless mode so 2.0.0
              # accepts the broker's session-less request instead of rejecting
              # it (hasInitializeRequest=false, sessionId=undefined). Remove
              # with the 1.16.0 pin if the canary is reverted.
              MCP_HTTP_STATELESS: "true"
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: searxng-mcp
        ports:
          http:
            port: 3000
    route:
      app:
        hostnames:
          - "searxng-mcp.mcp.local"
        parentRefs:
          - name: mcp-gateway
            namespace: mcp-system
            sectionName: mcps
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp
            filters:
              # Strip inbound Authorization before forwarding to the
              # backend MCP server. The Kuadrant mcp-gateway forwards
              # all client headers; the broker-side Bearer (used to
              # authentication can take
              # precedence over the backend's own credential env in
              # any upstream MCP client that honors `Authorization`,
              # causing 401s against the real target service. Backend
              # MCP servers each carry their own env-loaded creds —
              # stripping the broker Bearer at this hop lets those
              # take effect uniformly across the fleet.
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - Authorization
            backendRefs:
              - identifier: app
                port: 3000
