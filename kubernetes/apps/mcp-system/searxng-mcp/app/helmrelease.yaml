---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      searxng-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            sidecar.istio.io/inject: "true"
        containers:
          app:
            image:
              repository: docker.io/isokoliuk/mcp-searxng
              # Renovate <2.0.0 pin removed 2026-08-22. Federates through the
              # Kuadrant mcp-gateway broker in full stateful mode (see env).
              tag: "2.1.0@sha256:b4cf227a6459a5071a9b455c060bdd6912ee4fd4d2275abfdb30bc4f9e539136"
            env:
              SEARXNG_URL: http://searxng.collab.svc.cluster.local:8080
              # MCP_HTTP_HOST defaults to 127.0.0.1 (loopback-only), so the
              # mcp-gateway broker gets "connection refused" — must bind all
              # interfaces for cluster traffic to reach it.
              MCP_HTTP_HOST: "0.0.0.0"
              MCP_HTTP_PORT: "3000"
              # 2.0.0's rate-limiter needs trust-proxy set, or it logs
              # ERR_ERL_UNEXPECTED_X_FORWARDED_FOR and mis-keys on the mesh's
              # X-Forwarded-For. Trust only in-cluster proxy pods (Cilium pod
              # CIDR) — not spoofable from outside the mesh. Parallels
              # github-mcp-server's --trust-proxy-headers.
              MCP_HTTP_TRUST_PROXY: "10.42.0.0/16"
              # Runs stateful (full streamable-HTTP: GET/DELETE /mcp +
              # subscriptions + notifications). The MCP_HTTP_STATELESS=true
              # workaround for Kuadrant/mcp-gateway#1419 was dropped once the
              # 0.9.0 broker was verified to carry a valid session to a strict
              # stateful upstream and re-federate across upstream restarts
              # (retested 2026-09-07, broker 0.9.0 + searxng 2.1.0, in-mesh).
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: searxng-mcp
        ports:
          http:
            port: 3000
    route:
      app:
        hostnames:
          - "searxng-mcp.mcp.local"
        parentRefs:
          - name: mcp-gateway
            namespace: mcp-system
            sectionName: mcps
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /mcp
            filters:
              # Strip inbound Authorization before forwarding to the
              # backend MCP server. The Kuadrant mcp-gateway forwards
              # all client headers; the broker-side Bearer (used to
              # authentication can take
              # precedence over the backend's own credential env in
              # any upstream MCP client that honors `Authorization`,
              # causing 401s against the real target service. Backend
              # MCP servers each carry their own env-loaded creds —
              # stripping the broker Bearer at this hop lets those
              # take effect uniformly across the fleet.
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - Authorization
            backendRefs:
              - identifier: app
                port: 3000
