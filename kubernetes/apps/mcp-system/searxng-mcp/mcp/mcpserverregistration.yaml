---
# TODO: apply schema
apiVersion: mcp.kuadrant.io/v1
kind: MCPServerRegistration
metadata:
  name: searxng-tools
  labels:
    mcp.kuadrant.io/managed: "true"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: searxng-mcp
  prefix: search_
  # searxng-mcp runs on the MCP TS SDK v2, whose server/discover advertises only
  # modern (2026-07-28) revisions even though the transport still serves 2025
  # clients — so the broker never learns searxng speaks 2025-11-25 and hides its
  # tools from 2025/Claude clients. Override discover to declare both revisions
  # so the tools federate to 2025 clients. Added upstream in Kuadrant/mcp-gateway
  # #1515 (v1.0.0), which closed #1483.
  supportedProtocolVersions:
    - "2025-11-25"
    - "2026-07-28"
