---
apiVersion: mcp.kuadrant.io/v1
kind: MCPServerRegistration
metadata:
  name: vikunja-tools
  labels:
    mcp.kuadrant.io/managed: "true"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: vikunja-mcp
  prefix: vikunja_
  # Only 2026-07-28 — the broker's 2025-11-25 router ("router-202511")
  # requires a session handshake (Mcp-Session-Id) to succeed before it will
  # proxy a tools/call; mcp-openapi-proxy (this backend's image) is natively
  # session-less under EVERY protocol version it declares (no initialize, no
  # Mcp-Session-Id, Connection: close) per its own docs. Declaring
  # "2025-11-25" here let the broker pick that version for a live client
  # session, which then failed instantly with "failed to get remote session:
  # failed to create client: context canceled" (surfaced to the agent as a
  # misleading "Gateway Timeout") — discovery still worked (catalog polling
  # uses a different, working path), masking this until radar's first real
  # tools/call. Dropping the version this backend can't actually honor forces
  # negotiation onto 2026-07-28, which it fully supports.
  supportedProtocolVersions:
    - "2026-07-28"
