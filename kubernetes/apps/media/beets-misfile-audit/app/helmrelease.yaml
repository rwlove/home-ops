---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app beets-misfile-audit
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      beets-misfile-audit:
        pod:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1109
            runAsGroup: 1001
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroupsPolicy: Strict
        cronjob:
          # Live: the weekly ward loop (detect -> hand to the rick agent ->
          # MusicBrainz-resolve autonomously -> email the action summary).
          # Manual run: kubectl -n media create job \
          #   --from=cronjob/beets-misfile-audit beets-misfile-audit-test.
          suspend: false
          schedule: "0 5 * * 1" # Monday 05:00
          timeZone: America/New_York
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 1
          activeDeadlineSeconds: 3600
          ttlSecondsAfterFinished: 86400
        type: cronjob
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/beets
              tag: 2.14.1@sha256:acef8a6ea96a0e2a391504aaae361f27fe77eac8e448cf14b675b3b64c50465a
            command:
              - /bin/bash
              - -c
              - |
                export PATH="/lsiopy/bin:$PATH"
                python3 /scripts/misfile-audit.py
            env:
              # notify-mcp sender/theme for the findings digest email.
              AGENT_NAME: rick
              # Pass 2 (album-tag) scans everything by default (0) so the first
              # runs clear the existing backlog; raise once backlog is clean to
              # focus weekly runs on new imports.
              ALBUM_LOOKBACK_DAYS: "0"
              LOOKBACK_DAYS: "8"
              MIN_SCORE: "0.90"
              # Findings digest sink (used only when REMEDIATE is off). No artist
              # names in env — identity is decided by the ward agent via
              # MusicBrainz, not a hand-maintained alias list (artist names are
              # restricted-tier, HOMELAB-SPEC L2 #10, and must not be committed).
              NOTIFY_URL: http://notify-mcp.mcp-system.svc.cluster.local:8060/send
              # Weekly loop: hand the candidate dirs to the rick ward agent, which
              # MusicBrainz-resolves and fixes each autonomously (retag / relocate
              # / leave) + rescans, then emails Rob the single action summary. Set
              # false to go back to report-only (audit digest email + log, no
              # remediation).
              REMEDIATE: "true"
              REMEDIATE_AGENT_URL: http://rick.ai.svc.cluster.local:8080/
            resources:
              requests:
                cpu: 100m
                memory: 1G
              limits:
                memory: 2G
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
              seccompProfile: {type: RuntimeDefault}
    persistence:
      media:
        existingClaim: beets-media-pvc
        globalMounts:
          - path: /media
            readOnly: true
      scripts:
        type: configMap
        name: beets-misfile-audit-scripts
        globalMounts:
          - path: /scripts/misfile-audit.py
            subPath: misfile-audit.py
            readOnly: true
    networkpolicies:
      allow:
        type: cilium
        forceRename: beets-misfile-audit-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: beets-misfile-audit
        enableDefaultDeny:
          egress: false
          ingress: false
        egress:
          # AcoustID fingerprint lookups (HTTPS). Redirect CDNs vary, so world.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
          # notify-mcp (mcp-system) for the findings-digest email.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  app.kubernetes.io/name: notify-mcp
            toPorts:
              - ports:
                  - port: "8060"
                    protocol: TCP
          # rick ward agent (ai ns) A2A endpoint — hand album-tag findings off for
          # autonomous HIGH-confidence remediation (the weekly loop). The agent
          # pods carry app.kubernetes.io/part-of: kagent. Ingress half is in
          # ai/kagent/app/cnp-allow.yaml (kagent-agents-allow).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/part-of: kagent
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
