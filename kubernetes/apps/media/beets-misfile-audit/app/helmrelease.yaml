---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app beets-misfile-audit
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      beets-misfile-audit:
        pod:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1109
            runAsGroup: 1001
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroupsPolicy: Strict
        cronjob:
          # Ship SUSPENDED: manual-test first
          # (kubectl -n media create job --from=cronjob/beets-misfile-audit \
          #   beets-misfile-audit-test), verify logs, then flip suspend:false.
          suspend: true
          schedule: "0 5 * * 1" # Monday 05:00
          timeZone: America/New_York
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 1
          activeDeadlineSeconds: 3600
          ttlSecondsAfterFinished: 86400
        type: cronjob
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/beets
              tag: 2.14.1@sha256:ae076820ec34ea5e9ec05a22931e98ab555e9c25e784c5fb001c84f411119c73
            command:
              - /bin/bash
              - -c
              - |
                export PATH="/lsiopy/bin:$PATH"
                python3 /scripts/misfile-audit.py
            env:
              LOOKBACK_DAYS: "8"
              MIN_SCORE: "0.90"
            resources:
              requests:
                cpu: 100m
                memory: 1G
              limits:
                memory: 2G
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
              seccompProfile: {type: RuntimeDefault}
    persistence:
      media:
        existingClaim: beets-media-pvc
        globalMounts:
          - path: /media
            readOnly: true
      scripts:
        type: configMap
        name: beets-misfile-audit-scripts
        globalMounts:
          - path: /scripts/misfile-audit.py
            subPath: misfile-audit.py
            readOnly: true
    networkpolicies:
      allow:
        type: cilium
        forceRename: beets-misfile-audit-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: beets-misfile-audit
        enableDefaultDeny:
          egress: false
          ingress: false
        egress:
          # AcoustID fingerprint lookups (HTTPS). Redirect CDNs vary, so world.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
