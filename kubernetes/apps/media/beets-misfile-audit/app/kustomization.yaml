---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/repos/app-template
resources:
  - ./helmrelease.yaml

configMapGenerator:
  - name: beets-misfile-audit-scripts
    files:
      # a2a_client.py is a synced copy of the shared kagent-invocation client
      # at ai/local-cron/app/resources/a2a_client.py (kagent 1.0's MCP-based
      # invoke_agent contract) — this app lives in a different namespace and
      # kustomization, so it can't reference that file directly.
      - a2a_client.py=./resources/a2a_client.py
      - misfile-audit.py=./resources/misfile-audit.py

generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
