---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m

  values:
    controllers:
      flaresolverr:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
        type: statefulset

        containers:
          app:
            image:
              repository: ghcr.io/flaresolverr/flaresolverr
              tag: v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767

            env:
              LOG_LEVEL: info
              # Redirect $HOME so webdriver-manager and Firefox profile
              # writes land in /tmp (tmpfs) rather than the read-only
              # /app/.local. Image runs as USER 1000 with $HOME=/app.
              HOME: /tmp

            resources:
              requests:
                cpu: 10m
                memory: 500Mi
              limits:
                memory: 500Mi
            # flaresolverr downloads chromedriver into /app/chromedriver
            # at startup and Firefox stores its profile under /app/.local
            # (HOME=/tmp reroute didn't help since chromedriver-manager
            # ignores HOME). Leaving rootfs writable is a considered
            # deviation from the baseline; the rest of the container
            # hardening still applies.
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: flaresolverr
        ports:
          http:
            port: 8191

    persistence:
      # readOnlyRootFilesystem needs writable scratch for Python and the
      # embedded chromedriver / Firefox profile.
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp

    networkpolicies:
      allow:
        type: cilium
        forceRename: flaresolverr-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: flaresolverr
        # Additive — default-deny is what triggers the lockdown. No
        # HTTPRoute, no oauth2-proxy — only callers are cross-ns prowlarr in
        # downloads ns (and same-ns *arr if any directly call it).
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Cross-ns: prowlarr in downloads ns calls flaresolverr to solve CF
          # challenges for indexer fetches.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: prowlarr
            toPorts:
              - ports:
                  - port: "8191"
                    protocol: TCP
        egress:
          # External: full headless-Chromium internet access to solve
          # Cloudflare challenges on whatever indexer URLs prowlarr passes
          # in. Target set is the entire CF-protected indexer corpus.
          # UDP/443 covers HTTP/3 (QUIC) — modern Cloudflare-fronted sites
          # advertise alt-svc: h3 and Chromium prefers it; without UDP/443
          # the browser fails back to TCP/443 after timeouts (and Hubble
          # logs steady POLICY_DENIED on UDP/443 to CF/Google IPs).
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "443"
                    protocol: UDP
                  - port: "80"
                    protocol: TCP
