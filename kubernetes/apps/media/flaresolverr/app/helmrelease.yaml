---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m

  values:
    controllers:
      flaresolverr:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
        type: statefulset

        containers:
          app:
            image:
              repository: ghcr.io/flaresolverr/flaresolverr
              tag: v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47

            env:
              LOG_LEVEL: info
              # Redirect $HOME so webdriver-manager and Firefox profile
              # writes land in /tmp (tmpfs) rather than the read-only
              # /app/.local. Image runs as USER 1000 with $HOME=/app.
              HOME: /tmp

            resources:
              requests:
                cpu: 10m
                memory: 500Mi
              limits:
                memory: 500Mi
            # flaresolverr downloads chromedriver into /app/chromedriver
            # at startup and Firefox stores its profile under /app/.local
            # (HOME=/tmp reroute didn't help since chromedriver-manager
            # ignores HOME). Leaving rootfs writable is a considered
            # deviation from the baseline; the rest of the container
            # hardening still applies.
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: flaresolverr
        ports:
          http:
            port: 8191

    persistence:
      # readOnlyRootFilesystem needs writable scratch for Python and the
      # embedded chromedriver / Firefox profile.
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
