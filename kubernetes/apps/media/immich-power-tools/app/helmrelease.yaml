---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immich-power-tools
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  dependsOn:
    - name: immich
      namespace: media

  values:
    controllers:
      immich-power-tools:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
        type: statefulset

        containers:
          app:
            image:
              repository: ghcr.io/varun-raj/immich-power-tools
              tag: 0.19.1@sha256:8e7a25ed0e99c9c323012e306fde6c97a1004765742c8802ad03c95503679e77

            env:
              IMMICH_URL: http://immich-server.media.svc.cluster.local:2283
              DB_HOST: postgres-immich-rw.databases.svc.cluster.local
              DB_PORT: 5432
              DB_USERNAME: immich
              DB_PASSWORD: immich
              DB_DATABASE_NAME: immich

            envFrom:
              - secretRef:
                  name: *app

            resources:
              requests:
                cpu: 15m
                memory: 200M
              limits:
                memory: 200M
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: immich-power-tools
        ports:
          http:
            port: &httpPort 3000

    route:
      app:
        annotations:
          glance/name: "Immich Power Tools"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/immich-power-tools.png"
          glance/id: "Media"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort

    externalSecrets:
      immich-power-tools:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: immich-power-tools
          creationPolicy: Owner
          template:
            data:
              IMMICH_API_KEY: "{{ .powertools_apikey }}"
              EXTERNAL_IMMICH_URL: "{{ .immich_url }}"
              GOOGLE_MAPS_API_KEY: "{{ .GOOGLE_MAPS_API_KEY }}"
        dataFrom:
          - extract:
              key: immich

    networkpolicies:
      allow:
        type: cilium
        forceRename: immich-power-tools-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: immich-power-tools
        # Additive — default-deny is what triggers the lockdown. Egress to
        # immich-server (same ns, :2283) is covered by baseline
        # allow-intra-namespace.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # HTTPRoute on internal envoy gateway → immich-power-tools:3000.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "3000"
                    protocol: TCP
        egress:
          # CNPG: postgres-immich in databases ns (direct DB queries — uses
          # the same DB as immich-server).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  cnpg.io/cluster: postgres-immich
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
