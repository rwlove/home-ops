---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  chartRef:
    kind: OCIRepository
    name: immich-charts
  interval: 30m

  # disableWait — immich-machine-learning's CLIP+SigLIP2 preload blocks
  # /ping past helm-controller's 5-min default wait. Without this, the
  # timed-out upgrade is marked Failed and helm-controller rolls back;
  # the rollback ALSO waits for Ready and ALSO times out, leaving the
  # release stuck and silently reverting the spec just applied (this is
  # how a probe-tuning edit on 2026-05-04 was lost the first time).
  # Recovery: suspend the HR, delete the failed/pending
  # sh.helm.release.v1.* secrets, resume.
  install:
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    disableWait: true
    remediation:
      retries: -1

  values:
    controllers:
      main:
        containers:
          main:
            image:
              # renovate: datasource=github-releases depName=immich-app/immich
              tag: "v3.0.2@sha256:14390f3dc9512dc3273b12ccee6363d9be16c388699abc3f3fe0498bb9829937"
            env:
              DB_DATABASE_NAME: immich

              DB_HOSTNAME: postgres-immich-rw.databases.svc.cluster.local
              DB_PASSWORD: immich
              DB_USERNAME: immich
              DISABLE_REVERSE_GEOCODING: "false"
              EXTERNAL_PATH: "/external"
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning.media:3003
              # IMMICH_WEB_URL: http://immich-web.media.svc.cluster.local:3000
              IMMICH_SERVER_URL: http://immich-server.media.svc.cluster.local:2283
              LOG_LEVEL: verbose
              IMMICH_CONFIG_FILE: /config/system.json
              PUBLIC_IMMICH_SERVER_URL: https://photos.${SECRET_DOMAIN}
              REDIS_DBINDEX: "1"
              REDIS_HOSTNAME: dragonfly.databases.svc.cluster.local
              REDIS_PORT: "6379"
              REVERSE_GEOCODING_PRECISION: "2"
            envFrom:
              - secretRef:
                  name: immich-secret
    immich:
      # System config (concurrency, oauth, logLevel, passwordLogin,
      # machineLearning model names) is sourced from the mounted
      # /config/system.json (IMMICH_CONFIG_FILE) below — it is
      # authoritative and supersedes chart-rendered config. The v3
      # chart's values schema no longer accepts those keys here anyway;
      # they were dead config under IMMICH_CONFIG_FILE.
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-managed-library-pvc

    machine-learning:
      controllers:
        main:
          containers:
            main:
              env:
                # v3.0.0 split the single CLIP preload var into textual +
                # visual; the old MACHINE_LEARNING_PRELOAD__CLIP is removed.
                MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL: "ViT-SO400M-16-SigLIP2-384__webli"
                MACHINE_LEARNING_PRELOAD__CLIP__VISUAL: "ViT-SO400M-16-SigLIP2-384__webli"

                # Nvidia
                NVIDIA_DRIVER_CAPABILITIES: "all"
                NVIDIA_VISIBLE_DEVICES: "all"
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.0.2-cuda@sha256:cad0c6c38c60bd6a5a1929cbed01eecc105bcb58775682c137497632f8db5adc

              # GPU inference can briefly block the HTTP server; the chart
              # default timeout=1s causes spurious liveness restarts mid-job.
              probes:
                liveness:
                  spec:
                    failureThreshold: 3
                    periodSeconds: 30
                    timeoutSeconds: 10
                readiness:
                  spec:
                    failureThreshold: 3
                    periodSeconds: 10
                    timeoutSeconds: 10
                startup:
                  spec:
                    failureThreshold: 60
                    periodSeconds: 10
                    timeoutSeconds: 10

              resources:
                limits:
                  memory: 8G
                  nvidia.com/gpu: 1

                requests:
                  cpu: 100m
                  memory: 8G
                  nvidia.com/gpu: 1

          pod:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: nvidia.com/gpu.present
                          operator: In
                          values:
                            - "true"

            nodeSelector:
              nvidia.com/gpu.present: "true"

            priorityClassName: ai-gpu-critical

          replicas: 1
          strategy: RollingUpdate
          type: statefulset
    server:
      controllers:
        main:
          containers:
            main:
              # Immich bootstrap runs vchordrq reindexVectorsIfNeeded
              # before HTTP listen(), so /api/server/ping returns
              # connection-refused throughout. targetListCount() in
              # server/src/repositories/database.repository.ts hardcodes
              # lists=1 below 128k rows, so any manual lists rebuild
              # gets reverted on every startup — and the dual
              # clip_index + face_index reindex can exceed the chart's
              # default 5-min startup budget. Bump to 15 min.
              probes:
                startup:
                  spec:
                    failureThreshold: 90
                    periodSeconds: 10

              resources:
                limits:
                  memory: 3Gi

                requests:
                  cpu: 15m
                  memory: 3Gi
          replicas: 1
          strategy: RollingUpdate
          type: statefulset

      persistence:
        external:
          enabled: true
          existingClaim: immich-external-library-pvc
          # readOnly: true
        config:
          type: secret
          name: immich-secret
          globalMounts:
            - path: /config/system.json
              subPath: system.json
