---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immichkiosk-party
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  dependsOn:
    - name: immich
      namespace: media

  values:
    controllers:
      immichkiosk-party:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
        type: statefulset

        containers:
          app:
            image:
              repository: ghcr.io/damongolding/immich-kiosk
              tag: 0.42.0@sha256:96909e1c7f52323e4cd742cc14d2650d9a421fdbf85699f64e065f6aa6fbaa89

            env:
              # Required settings
              # KIOSK_IMMICH_API_KEY: FROM SECRET
              # KIOSK_IMMICH_URL: FROM SECRET
              KIOSK_DEBUG: true
              # Clock
              KIOSK_SHOW_TIME: false
              KIOSK_TIME_FORMAT: 24
              KIOSK_SHOW_DATE: false
              KIOSK_DATE_FORMAT: "DDDD DD MMMM YYYY"
              # Kiosk behaviour
              KIOSK_DURATION: 30
              KIOSK_DISABLE_SCREENSAVER: false
              KIOSK_OPTIMIZE_IMAGES: false
              KIOSK_USE_GPU: true
              # Asset sources — Party Album, cycled in random order with
              # replacement (same model as the main immichkiosk / familyroom
              # frame). No shuffle-without-replacement: the kiosk never
              # exhausts a pool, so it cannot wedge on an empty result set.
              KIOSK_SHOW_ARCHIVED: false
              KIOSK_ALBUMS: "59526fba-9726-4976-a6da-b7f71ebd16cd"
              KIOSK_ALBUM_ORDER: random
              KIOSK_MEMORIES: false
              # FILTER
              KIOSK_DATE_FILTER: ""
              # UI
              KIOSK_DISABLE_NAVIGATION: false
              KIOSK_DISABLE_UI: false
              KIOSK_FRAMELESS: false
              KIOSK_HIDE_CURSOR: false
              KIOSK_FONT_SIZE: 120
              KIOSK_BACKGROUND_BLUR: true
              KIOSK_THEME: fade
              KIOSK_LAYOUT: splitview
              # Sleep mode
              KIOSK_SLEEP_START: 22
              KIOSK_SLEEP_END: 7
              # Transition options
              KIOSK_TRANSITION: cross-fade
              KIOSK_FADE_TRANSITION_DURATION: 1
              KIOSK_CROSS_FADE_TRANSITION_DURATION: 1
              # Image display settings
              KIOSK_SHOW_PROGRESS_BAR: true
              KIOSK_IMAGE_FIT: contain
              KIOSK_IMAGE_EFFECT: smart-zoom
              KIOSK_IMAGE_EFFECT_AMOUNT: 100
              KIOSK_USE_ORIGINAL_IMAGE: true
              # Video display settings
              KIOSK_SHOW_VIDEOS: true
              # KIOSK_EXCLUDE_VIDEOS_OVER: 0  # seconds; 0 = no cap
              # Image metadata
              KIOSK_SHOW_ALBUM_NAME: false
              KIOSK_SHOW_PERSON_NAME: true
              KIOSK_SHOW_IMAGE_TIME: false
              KIOSK_IMAGE_TIME_FORMAT: 12
              KIOSK_SHOW_IMAGE_DATE: true
              KIOSK_IMAGE_DATE_FORMAT: "DDDD, MMMM DD, YYYY"
              KIOSK_SHOW_IMAGE_DESCRIPTION: false
              KIOSK_SHOW_IMAGE_EXIF: false
              KIOSK_SHOW_IMAGE_LOCATION: true
              KIOSK_HIDE_COUNTRIES: "HIDDEN_COUNTRY,HIDDEN_COUNTRY"
              KIOSK_SHOW_IMAGE_ID: false
              KIOSK_SHOW_MORE_INFO: true
              KIOSK_SHOW_MORE_INFO_IMAGE_LINK: true
              KIOSK_SHOW_MORE_INFO_QR_CODE: true
              KIOSK_SHOW_PERSON_AGE: true
              # Kiosk settings — aligned with the main immichkiosk
              # (familyroom): cache on, 1000-asset buffer, asset
              # weighting. Cache hits keep prefetch off the htmx
              # fetch-timeout path, so the ImmichFrame webview doesn't
              # error-reload and escape into a bare browser. Trade-off:
              # newly added Party Album photos appear on the cache's
              # refresh cycle rather than immediately — acceptable now
              # that the curator no longer needs a live unplayed pool.
              KIOSK_WATCH_CONFIG: false
              KIOSK_FETCHED_ASSETS_SIZE: 1000
              KIOSK_HTTP_TIMEOUT: 20
              KIOSK_PASSWORD: ""
              KIOSK_CACHE: true
              KIOSK_PREFETCH: true
              KIOSK_ASSET_WEIGHTING: true
              KIOSK_PORT: 3000
              KIOSK_SHOW_USER: false

            envFrom:
              - secretRef:
                  name: *app

            resources:
              requests:
                cpu: 15m
                memory: 1Gi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: immichkiosk-party
        ports:
          http:
            port: &httpPort 3000

    persistence:
      # kiosk 0.41.0's video manager creates /tmp/immich-kiosk at startup;
      # readOnlyRootFilesystem blocks it. Writable scratch for /tmp.
      tmp:
        type: emptyDir
        advancedMounts:
          immichkiosk-party:
            app:
              - path: /tmp

    route:
      app:
        annotations:
          glance/name: "Party Slideshow"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/immich-kiosk.png"
          glance/id: "Media"
        hostnames:
          - "party-slideshow.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
