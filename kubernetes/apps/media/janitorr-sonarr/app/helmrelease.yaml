---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app janitorr-sonarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1000

    controllers:
      janitorr-sonarr:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/schaka/janitorr
              tag: jvm-stable@sha256:eecb604b6307f4ba5674bec7e3fc142d7212361571a1a9dc1f39e0fd069a4434

            envFrom:
              - secretRef:
                  name: janitorr-sonarr

            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    persistence:
      config:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        advancedMounts:
          janitorr-sonarr:
            app:
              - path: /config

      config-file:
        type: configMap
        name: janitorr-sonarr
        globalMounts:
          - path: /config/application.yml
            subPath: application.yml
            readOnly: true

      data:
        existingClaim: sonarr-media
        globalMounts:
          - path: /data
            readOnly: true

      leaving-soon:
        type: emptyDir
        globalMounts:
          - path: /leaving-soon

      logs:
        type: emptyDir
        globalMounts:
          - path: /logs

      tmp:
        type: emptyDir

    externalSecrets:
      janitorr-sonarr:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: janitorr-sonarr
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              CLIENTS_SONARR_APIKEY: "{{ .SONARR__API_KEY }}"
              CLIENTS_JELLYFIN_APIKEY: "{{ .JELLYFIN__API_KEY }}"
              CLIENTS_JELLYFIN_USERNAME: "{{ .JELLYFIN__USERNAME }}"
              CLIENTS_JELLYFIN_PASSWORD: "{{ .JELLYFIN__PASSWORD }}"
              CLIENTS_JELLYSEERR_APIKEY: "{{ .SEERR__API_KEY }}"
        dataFrom:
          - extract:
              key: sonarr
              property: SONARR__API_KEY
          - extract:
              key: jellyfin
              property: JELLYFIN__API_KEY
          - extract:
              key: jellyfin
              property: JELLYFIN__USERNAME
          - extract:
              key: jellyfin
              property: JELLYFIN__PASSWORD
          - extract:
              key: seerr
              property: SEERR__API_KEY
