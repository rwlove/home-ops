---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m

  values:
    controllers:
      jellyfin:
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: intel.feature.node.kubernetes.io/gpu
                        operator: In
                        values:
                          - "true"

          enableServiceLinks: false

          nodeSelector:
            intel.feature.node.kubernetes.io/gpu: "true"

          priorityClassName: media-cluster-critical

          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: "OnRootMismatch"
            runAsGroup: 1001
            runAsUser: 1111

        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset

        containers:
          app:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 10.11.11@sha256:45f648c382a0c8b552582fcea40e95cb17c5d475473a891cba0eb7523fb92112

            resources:
              requests:
                cpu: 15m
                gpu.intel.com/i915: 1
                memory: 2560Mi
              limits:
                gpu.intel.com/i915: 1
                memory: 10G

    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.45.0.11 # SVC_JELLYFIN_ADDR
        externalTrafficPolicy: Cluster
        ports:
          http:
            port: &httpPort 8096

    route:
      app:
        annotations:
          glance/name: "Jellyfin"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/jellyfin.png"
          glance/id: "Media"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      config:
        existingClaim: jellyfin-config-pvc

      movies:
        existingClaim: jellyfin-movies-pvc

      music:
        existingClaim: jellyfin-music-pvc

      television:
        existingClaim: jellyfin-television-pvc

      transcode:
        type: emptyDir

    networkpolicies:
      allow:
        type: cilium
        forceRename: jellyfin-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: jellyfin
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # 1) HTTPRoute on internal envoy gateway → jellyfin:8096
          #    (jellyfin.${SECRET_DOMAIN}).
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8096"
                    protocol: TCP
          # 2) Cilium LoadBalancer Service at 10.45.0.11:8096. LAN Kodi
          #    clients (kodi-familyroom 192.168.1.11, etc.) and other LAN
          #    consumers connect directly to the LB IP — these arrive at
          #    the pod as `reserved:world`. The household user's primary playback path —
          #    must remain reachable.
          - fromEntities:
              - world
            toPorts:
              - ports:
                  - port: "8096"
                    protocol: TCP
          # 3) In-cluster callers (janitorr → /Users/MediaSegments, etc.)
          #    reach jellyfin via cluster-DNS Service.
          #
          #    janitorr was split into janitorr-radarr + janitorr-sonarr, so
          #    the old `app.kubernetes.io/name: janitorr` selector matched
          #    zero live pods. Same-namespace traffic still flowed — the
          #    baseline `allow-intra-namespace` CNP covers media internally
          #    and Cilium rules are additive — so this was dead config, not an
          #    outage. It still documented an intent it no longer enforced.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: media
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: ["janitorr-radarr", "janitorr-sonarr"]
            toPorts:
              - ports:
                  - port: "8096"
                    protocol: TCP
          # 4) Home Assistant integration: media_player.jellyfin polls + sends
          #    play commands via the local jellyfin Service.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: home
                  app.kubernetes.io/name: home-assistant
            toPorts:
              - ports:
                  - port: "8096"
                    protocol: TCP
          # 5) swiparr (collab ns) reaches jellyfin via
          #    JELLYFIN_URL=http://jellyfin.media:8096. This one IS
          #    cross-namespace, so allow-intra-namespace does not cover it —
          #    swiparr declares the egress but there was no matching ingress
          #    here, making it a genuine silent drop.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: collab
                  app.kubernetes.io/name: swiparr
            toPorts:
              - ports:
                  - port: "8096"
                    protocol: TCP
        egress:
          # Metadata providers. Jellyfin reaches out for movie/show artwork,
          # season metadata, theme music, etc. *arr metadata writers are OFF
          # in this cluster (see project_media_writers_plan.md), so jellyfin
          # is the canonical fetcher.
          # Intended endpoints:
          #   TheMovieDB: api.themoviedb.org, image.tmdb.org
          #   Fanart.tv:  webservice.fanart.tv, assets.fanart.tv
          #   TheTVDB:    api4.thetvdb.com, artworks.thetvdb.com
          #   MusicBrainz / Cover Art Archive
          #   Jellyfin plugin manifest + repo: repo.jellyfin.org
          #
          # musicbrainz.org, coverartarchive.org, repo.jellyfin.org are
          # canonical (no CNAME chain) — Cilium 1.19 matchPattern silently
          # fails for canonical FQDNs through K8s DNS search-domain
          # augmentation (per project_cilium_matchpattern_fqdn_limits.md).
          # CNAME-fronted status uncertain for the TMDb / Fanart / TVDB CDNs;
          # when uncertain default to toEntities:world+443. Matches the
          # precedent in PRs #11498/#11512/#11517/#11533.
          - toEntities: [world]
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
        # NFS mounts (movies, music, television PVs on beast + brain) are
        # opened by the kubelet at the host level, NOT by the pod. The
        # underlying RPC traffic is host networking, so no pod-level egress
        # rule is needed for NFS.
