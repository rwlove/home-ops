---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lidarr-sab-autoimport
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}

    controllers:
      lidarr-sab-autoimport:
        pod:
          automountServiceAccountToken: false
          restartPolicy: Never
        cronjob:
          # Workaround still required — retirement history is MIXED, not a
          # clean "failed twice":
          #   - Sep 2026 (#11854, #14158): sidecar suspended ~3 days against
          #     the LIVE queue; a completed download stuck in importFailed.
          #   - 2026-10-29 (#11854): re-tested on Lidarr 3.2.0 (#15381) with a
          #     controlled single-item batch. INCONCLUSIVE, not a failure: the
          #     native auto-scan DID fire (albumImportIncomplete +9s after the
          #     grab, with THIS sidecar suspended) — a positive signal the
          #     3.1.x scan-never-fired regression may be fixed. The import then
          #     failed on a match-score rejection (50.1% vs 80% threshold) on a
          #     bad probe, NOT the scan regression, so 3.2.0's full import path
          #     was never actually exercised.
          # scan.py compensates for both halves of the original 3.1.x bug
          # (DownloadedAlbumsScan auto-fire + stale 100%-imported queue-row
          # drop). A valid retest needs a probe that both grabs AND matches
          # >=80%; easiest caught opportunistically on the next Lidarr minor
          # bump against a real completed import, not a manufactured probe.
          suspend: false
          schedule: "*/5 * * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 3
          # Retry transient failures (e.g. musl EAI_AGAIN DNS blips) on a
          # fresh pod instead of failing the run on the first hiccup. The
          # script also retries internally; this is the outer net.
          backoffLimit: 2
          activeDeadlineSeconds: 300
          ttlSecondsAfterFinished: 86400
        type: cronjob
        containers:
          app:
            image:
              repository: python
              tag: 3.15-alpine@sha256:20a82dbc2783112ddb91d1534603f802d222a3e63e593cd002eb2ac534e70211

            command:
              - python3
              - /script/scan.py

            env:
              LIDARR_URL: http://lidarr.media.svc.cluster.local:8686

            envFrom:
              - secretRef:
                  name: lidarr

            resources:
              requests:
                cpu: 10m
                memory: 32M
              limits:
                memory: 64M

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}

    persistence:
      script:
        type: configMap
        name: lidarr-sab-autoimport-script
        defaultMode: 0555
        globalMounts:
          - path: /script/scan.py
            subPath: scan.py
            readOnly: true
