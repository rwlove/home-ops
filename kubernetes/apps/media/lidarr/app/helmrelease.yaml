---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lidarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      lidarr:
        pod:
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1103
            # Strict: effective groups = only what's declared here (drops any
            # implicit image /etc/group groups). Media access is via primary GID
            # 1001, so this is safe. Verify via pod status .user.linux after
            # rollout. (k8s 1.35 GA)
            supplementalGroupsPolicy: Strict

        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        # The config PVC was populated when this controller ran as uid 1000;
        # runAsUser is now 1103 and fsGroupChangePolicy:OnRootMismatch skips the
        # recursive fsGroup chown (the PVC root already matches gid 1001), so the
        # stale 0644 uid-1000 files (logs/lidarr.txt, MediaCover/**) aren't
        # writable by 1103. NLog's file target then silently dies — no log file
        # written since the uid switch — and cover-art writes throw
        # "Permission denied". Reclaim /config ownership on startup; idempotent +
        # self-heals. Scoped to /config only — the media/downloads NFS mounts are
        # owned correctly and must not be touched.
        initContainers:
          init-perms:
            image:
              repository: ghcr.io/home-operations/lidarr
              tag: 3.1.6@sha256:b4c60ae24ff264bcdfd8d5562982d99105c17b82c28a6986498f6fb215b7f42e
            command:
              - chown
              - -R
              - 1103:1001
              - /config
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/lidarr
              tag: 3.1.6@sha256:b4c60ae24ff264bcdfd8d5562982d99105c17b82c28a6986498f6fb215b7f42e

            # umask 0002 so new album dirs are group-writable for shared-GID
            # writers (beets, soularr). See per-app-UIDs commit 152c67ef3a.
            command:
              - /usr/bin/catatonit
              - --
              - /bin/bash
              - -c
              - "umask 0002 && exec /entrypoint.sh"

            env:
              LIDARR__APP__INSTANCENAME: Lidarr
              LIDARR__AUTH__METHOD: External
              LIDARR__AUTH__REQUIRED: DisabledForLocalAddresses
              LIDARR__LOG__DBENABLED: "False"
              LIDARR__LOG__LEVEL: info
              LIDARR__SERVER__PORT: &httpPort 8686

            envFrom:
              - secretRef:
                  name: *app


            resources:
              requests:
                cpu: 100m
                memory: 1280Mi
              limits:
                memory: 3Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: lidarr
        ports:
          http:
            port: *httpPort

    route:
      app:
        annotations:
          glance/name: "Lidarr"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/lidarr.png"
          glance/id: "Media"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - kind: Service
                name: lidarr
                port: 8686

    persistence:
      config:
        existingClaim: lidarr-config-pvc

      downloads:
        existingClaim: lidarr-downloads

      media:
        existingClaim: lidarr-media

      sabnzbd:
        existingClaim: lidarr-sabnzbd-downloads

      slskd:
        existingClaim: lidarr-slskd-downloads-pvc

      tmp:
        type: emptyDir
        medium: Memory
    externalSecrets:
      lidarr:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: lidarr
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              LIDARR__API_KEY: "{{ .LIDARR__API_KEY }}"
              LIDARR__POSTGRES__HOST: postgres-lidarr-rw.databases.svc.cluster.local
              LIDARR__POSTGRES__PORT: "5432"
              LIDARR__POSTGRES__USER: "{{ .POSTGRES_USER }}"
              LIDARR__POSTGRES__PASSWORD: "{{ .POSTGRES_PASS }}"
              LIDARR__POSTGRES__MAINDB: lidarr-main
              # Garage S3 creds for the cnpg-app-database backup ObjectStore
              # (consumed by lidarr-secret in databases namespace, kept here too
              # so a single 1P item drives both)
              GARAGE_AWS_ACCESS_KEY_ID: "{{ .GARAGE_AWS_ACCESS_KEY_ID }}"
              GARAGE_AWS_SECRET_ACCESS_KEY: "{{ .GARAGE_AWS_SECRET_ACCESS_KEY }}"
        dataFrom:
          - extract:
              key: lidarr
    networkpolicies:
      allow:
        type: cilium
        forceRename: lidarr-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: lidarr
        # Additive — default-deny is what triggers the lockdown. Ingress on
        # :8686 from lidarr-bridge / soularr (same ns) is covered by
        # baseline allow-intra-namespace.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal gateway (envoy) → lidarr:8686. Auth is enforced at the
          # gateway by the extAuth SecurityPolicy (#12767); the oauth2-proxy
          # hop is retired.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8686"
                    protocol: TCP
          # Cross-ns: prowlarr sync-app pushes indexer config into lidarr.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: prowlarr
            toPorts:
              - ports:
                  - port: "8686"
                    protocol: TCP
          # Cross-ns: arr-mcp MCP server queries this API via
          # LIDARR_URL=http://lidarr.media.svc.cluster.local:8686. Mirrors the
          # arr-mcp source already allowed in prowlarr-allow (downloads ns).
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  app.kubernetes.io/name: arr-mcp
            toPorts:
              - ports:
                  - port: "8686"
                    protocol: TCP
        egress:
          # CNPG: postgres-lidarr in databases ns (Pattern B).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  cnpg.io/cluster: postgres-lidarr
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
          # Cross-ns: download-client APIs in downloads ns (Pattern E).
          #   sabnzbd:8080, qbittorrent:8080 (lidarr uses both depending on
          #   release type — keep both even if currently sab-only).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: sabnzbd
              - matchLabels:
                  io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: qbittorrent
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          # Cross-ns: prowlarr indexer API in downloads ns.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: prowlarr
            toPorts:
              - ports:
                  - port: "9696"
                    protocol: TCP
          # External metadata + indexer probes: lidarr fetches album metadata
          # (MusicBrainz, lidarr-metadata API, etc.) and also probes/contacts
          # indexers directly when prowlarr forwards search calls. Indexer
          # surface is too large and rotates too often to enumerate per-FQDN
          # — use `world` on 443/80.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "80"
                    protocol: TCP
