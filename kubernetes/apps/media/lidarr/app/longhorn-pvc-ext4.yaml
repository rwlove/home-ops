---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/storageclass-storage-v1.json
#
# Dynamic ext4 Longhorn (not the repo's static-PV+volumeHandle pattern),
# mirroring the forgejo-data precedent. Migrated from a static XFS volume on
# 2026-10-05 (fleet move off XFS after an ungraceful detach corrupted radarr's
# XFS config vol: metadata LSN ahead of log, which XFS hard-fails and ext4
# recovers -- see feedback_xfs_longhorn_upgrade_corruption_migrate_ext4). The
# real data lives in CNPG (lidarr-main); this volume is regenerable config.
# Backups are automatic via Longhorn's `default` recurring-job group.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: lidarr-config-ext4
provisioner: driver.longhorn.io
reclaimPolicy: Retain
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "2880"
  fsType: ext4
  dataLocality: disabled
  unmapMarkSnapChainRemoved: ignored
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/persistentvolumeclaim-v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidarr-config-ext4
  labels:
    type: longhorn
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 15Gi
  storageClassName: lidarr-config-ext4
