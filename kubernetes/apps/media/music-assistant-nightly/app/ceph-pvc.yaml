---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/persistentvolumeclaim-v1.json
#
# Fresh, empty scratch volume for the throwaway nightly test instance.
# NEVER the prod longhorn data volume (music-assistant-data-pvc) — this is
# its own PVC, its own storage tier (ceph-block per storage-class.instructions.md
# rule 2: application config / regenerable state), deleted at teardown.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music-assistant-nightly-data-pvc
  labels:
    app.kubernetes.io/name: &name music-assistant-nightly
    app.kubernetes.io/instance: *name
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: ceph-block
