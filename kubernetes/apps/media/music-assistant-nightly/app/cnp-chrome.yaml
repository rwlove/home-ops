---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
#
# THROWAWAY — temporary ingress hole so the in-cluster Playwright browser
# (mcp-system/chrome-mcp) can reach this instance's web UI at :8095 to
# complete the MCP Connect Wizard and register the built-in web player,
# which is the only headless way to exercise support#6023 through the MCP
# gateway on a player. Paired with the chrome-mcp egress allow in
# kubernetes/apps/mcp-system/music-assistant-nightly-mcp/app/cnp-chrome-egress.yaml.
# Pruned with this dir at teardown.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: music-assistant-nightly-chrome-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: music-assistant-nightly
  enableDefaultDeny:
    egress: false
    ingress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mcp-system
            app.kubernetes.io/name: chrome-mcp
      toPorts:
        - ports:
            - port: "8095"
              protocol: TCP
