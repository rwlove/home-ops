---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/referencegrant_v1.json
#
# Permits the music-assistant-nightly-mcp HTTPRoute in mcp-system to use
# this instance's Service as a cross-namespace backend, exactly mirroring
# kubernetes/apps/media/music-assistant/app/referencegrant.yaml for prod.
# Scoped to the one Service; do NOT wildcard. Paired with the egress CNP
# in kubernetes/apps/mcp-system/music-assistant-nightly-mcp/app/cnp-allow.yaml
# and the ingress rule in music-assistant-nightly-allow (helmrelease.yaml,
# this dir).
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: music-assistant-nightly-mcp-gateway
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: mcp-system
  to:
    - group: ""
      kind: Service
      name: music-assistant-nightly
