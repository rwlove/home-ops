---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
#
# THROWAWAY test instance for music-assistant/support#6023 — see the
# HelmRelease header comment for the full why. UNSUSPENDED 2026-10-22
# with Rob's explicit go-ahead for a bounded live test window; expect a
# teardown PR (git rm -r the whole app dir) shortly after the test
# completes — this Kustomization was never meant to stay live.
#
# No dependsOn on longhorn/multus: this instance uses ceph-block (no
# Longhorn dependency needed — see kubernetes/apps/media/seerr/ks.yaml for
# a prod example of a ceph-block PVC with no longhorn dependsOn) and has
# no macvlan net-attach — see README.md in this dir for why the built-in
# web player made the IoT-VLAN route unnecessary, and the risk that route
# would have carried.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app music-assistant-nightly
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: media
  path: ./kubernetes/apps/media/music-assistant-nightly/app
  interval: 30m
  timeout: 5m
  suspend: false
  wait: false
  retryInterval: 2m
