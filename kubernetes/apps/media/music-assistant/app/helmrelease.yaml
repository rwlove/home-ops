---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app music-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  # The MA server image is large (~2.5 GB); a cold pull on a new tag can take
  # 5+ min, exceeding helm-controller's default 5m operation timeout. That
  # caused a failed upgrade + rollback during the 2.10.0b1→b2 bump. Give helm
  # room so a slow first pull can't time out and roll back mid-upgrade.
  timeout: 15m
  values:
    controllers:
      music-assistant:
        pod:
          # Pin to a VLAN-20-capable node — the macvlan master enp1s0.20
          # only exists on nodes labeled node.network/vlan-iot=true.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node.network/vlan-iot
                        operator: In
                        values:
                          - "true"

          # IoT VLAN (20) secondary NIC — gives MA an L2 presence on the IoT
          # VLAN so its AirPlay/zeroconf provider can discover and push audio
          # to the LAN WiiM ("Deck", 10.10.20.26). macvlan net1 bypasses
          # Cilium; AirPlay is push-based so no publish_ip change is needed.
          annotations:
            k8s.v1.cni.cncf.io/networks: music-assistant-iot-static

          securityContext:
            # Tier 2 reader — reads media via the world-readable bit on
            # 2775 dirs / 664 files. NOT a member of the media group; runs
            # under its own UID/GID so it cannot modify media.
            fsGroup: 1113
            fsGroupChangePolicy: "OnRootMismatch"
            runAsGroup: 1113
            runAsNonRoot: true
            runAsUser: 1113

        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        initContainers:
          # Startup-race guard. MA's music library is the OpenSubsonic
          # provider pointed at gonic.media, and its provider loader is
          # one-shot: if gonic isn't answering when MA first pings it on
          # boot — e.g. both pods restart together after a power event and
          # gonic is still initializing — MA marks the provider failed and
          # never auto-retries, so every track is unresolvable ("no
          # playable items found") until someone reloads the provider by
          # hand. Block MA's start until gonic's Subsonic API returns 200.
          # Intra-namespace egress is allowed by the allow-intra-namespace
          # CNP; alpine is multi-arch (MA may land on an arm64 node).
          wait-for-gonic:
            image:
              repository: docker.io/library/alpine
              tag: "3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b"
            command:
              - sh
              - -c
              - |
                until wget -q -T 5 -O /dev/null http://gonic.media/rest/ping.view; do
                  echo "waiting for gonic to serve its API..."
                  sleep 3
                done
                echo "gonic is up"

          # Fix /data ownership so MA (uid 1113) owns its WebRTC cert files.
          # MA's remote-access code rewrites and then chmods
          # /data/webrtc_private_key.pem on every boot. chmod requires the
          # process to OWN the file (uid match) — group-write is not enough —
          # so a file left owned by uid 1000 (from an earlier run's UID) makes
          # MA crash on startup with `PermissionError: Operation not permitted`
          # on both b6 and b7 (crashlooped 221× on 2026-07-22). fsGroup only
          # sets the group, not the owner, so a root chown is the durable fix.
          # Idempotent and cheap (two files); no-ops on a fresh PVC.
          00-fix-webrtc-ownership:
            image:
              repository: docker.io/library/alpine
              tag: "3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b"
            command:
              - sh
              - -c
              - chown 1113:1113 /data/webrtc_private_key.pem /data/webrtc_certificate.pem 2>/dev/null || true
            securityContext:
              runAsUser: 0
              runAsNonRoot: false

        containers:
          app:
            image:
              repository: ghcr.io/music-assistant/server
              # Held on the 2.10.0 beta line: it wrote a schema-52 library DB
              # that stable 2.9.9 cannot read (downgrade to 2.9.9 cleared the
              # DB and crashed — reverted 2026-07-18). Stay on 2.10 and roll
              # FORWARD to the beta where the Settings → Players refactor is
              # complete; do NOT downgrade to stable. Renovate tracks the beta
              # channel (see packageRules.json5).
              # Reverted b7 → b6 during the 2026-07-22 incident, but the
              # version was a red herring: BOTH b6 and b7 crashloop on the
              # WebRTC cert chmod when /data/webrtc_private_key.pem is owned by
              # the wrong UID (see the 00-fix-webrtc-ownership initContainer).
              # With that fix in place either beta boots. Staying on b6 for now
              # to avoid an unnecessary Renee-facing restart; Renovate is free
              # to roll forward to b7+ on the beta channel again.
              tag: 2.10.0b12@sha256:1004dcc1305d855c754313b641549565c5f17a0b18bdc1769132d432310af5e6

            env:
              # Smart Fades' Beat This! beat-tracking model downloads its
              # ~8MB checkpoint via torch.hub → $HOME/.cache/torch. The
              # container has HOME=/ and runs non-root (uid 1113), so the
              # default /.cache is unwritable and the model load fails
              # ("Could not load the checkpoint ... small0"), leaving Smart
              # Fades in a permanent error state. Point the cache at the
              # writable, persistent data PVC (already MA's cache dir) so the
              # model downloads once and survives restarts.
              XDG_CACHE_HOME: /data/.cache

            # Probe the unauthenticated /info webserver endpoint (returns
            # 200 with {"status": "running"}). During the 2026-07-18 failed
            # 2.9.9 downgrade the app crashed in DB setup and never bound
            # :8095, yet the pod still reported Running 1/1 because nothing
            # was probing it — /info would have caught that (connection
            # refused). Startup probe is generous: the ~2.5 GB image can
            # cold-boot slowly, and we don't want liveness killing a healthy
            # slow start.
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /info
                    port: 8095
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /info
                    port: 8095
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60

            # ┌───────────────────────────────────────────────────────────┐
            # │ DO NOT RIGHT-SIZE THESE FROM OBSERVED USAGE.              │
            # │ The memory limit is a FEATURE GATE, not a sizing figure.  │
            # └───────────────────────────────────────────────────────────┘
            #
            # Smart Fades (the smart-crossfade audio analysis provider)
            # refuses to load below 4GB, reading the container's cgroup
            # limit at startup:
            #
            #   "Provider(instance) Smart Fades can not run on this system:
            #    at least 4GB of RAM is required (3.0GB detected)"
            #
            # It is in ACTIVE USE: the player_queues core config sets
            # `crossfade_mode: smart_crossfade` with `crossfade_duration: 8`
            # globally, so every queue (incl. the synced wiim-deck/wiim-pool
            # pair and wiim-yard) depends on the provider being loaded.
            #
            # THE FAILURE IS SILENT. `StreamsController.get_crossfade_mode()`
            # falls back to `CrossfadeMode.STANDARD_CROSSFADE` whenever
            # `smart_fades_available` is false. Nothing errors at playback
            # time and the setting still reads `smart_crossfade` in the UI --
            # you just quietly stop getting beat-aligned crossfades. That is
            # exactly how this went unnoticed under the old 3Gi limit.
            #
            # Idle usage is ~553Mi (~9% of the limit) because the Beat This!
            # model is only exercised during track-transition analysis, so
            # Goldilocks/VPA will look at this pod and recommend cutting the
            # limit by an order of magnitude. Ignore it. Anything under 4GB
            # silently disables the feature; 6Gi keeps headroom for the model
            # rather than sitting on the threshold. See #13390.
            resources:
              requests:
                # 150m (not the old 15m). The same "silent degradation"
                # argument as the memory gate above applies to CPU: Beat
                # This! bursts hard during per-track analysis, and at a 15m
                # request the scheduler placed this pod as though it were
                # idle. Under node CPU contention the analysis burst then
                # loses the race, transitions miss their deadline, and you
                # fall back to a dumb crossfade with nothing logged.
                #
                # Measured 2026-08-08 under live playback (wiim-deck +
                # wiim-pool synced), 2m resolution:
                #   idle                    ~3m
                #   sustained analysis   340-370m
                #   peak burst              376m   (25x the old request)
                # RSS over the same window climbed 560Mi -> 927Mi as the
                # model loaded and stayed resident.
                cpu: 150m
                # 2Gi (not the old 1536Mi) so the pod is not the first
                # eviction candidate once the model is resident -- its node's
                # memory requests sit ~78%.
                memory: 2Gi
              limits:
                # Deliberately NO cpu limit. A limit sized near the request
                # would throttle exactly the analysis burst this request
                # exists to protect, reintroducing the silent degradation
                # from the other direction.
                memory: 6Gi

    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${SVC_MUSIC_ASSISTANT_ADDR}
        controller: music-assistant
        externalTrafficPolicy: Cluster
        ports:
          http:
            port: &httpPort 8095
          http2:
            port: 1780
          slimproto:
            port: 3483
          # Streamserver — serves the audio flow to SlimProto players over
          # the ClusterIP (publish_ip=ClusterIP:8097); intra-namespace only,
          # not in the world ingress allow-list. Retained for any LAN
          # SlimProto clients; the in-cluster squeezelite players were removed.
          streamserver:
            port: 8097
          # Sendspin — the protocol the three Home Assistant Voice PE
          # satellites use to reach MA. Their Universal Player wrappers
          # (up20f83b*) link to protocol players on the `sendspin` provider,
          # and MA binds the Sendspin server on 0.0.0.0:8927.
          #
          # MA advertises itself at the LoadBalancer VIP (base_url =
          # http://${SVC_MUSIC_ASSISTANT_ADDR}:8095), so the satellites dial
          # the VIP — not the macvlan IoT address. With 8927 unpublished they
          # had no path in: after the 2.10.0b6 -> b9 roll on 2026-08-01 the
          # Sendspin server logged zero inbound connections and all three
          # players sat `available: false`, while the WiiM players were
          # unaffected because their Sendspin bridges are created pod-locally.
          sendspin:
            port: 8927

    route:
      app:
        annotations:
          glance/name: "Music Assistant"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/music-assistant.png"
          glance/id: "Media"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              # Route straight to MA: the frontend builds its API WebSocket
              # same-origin (wss://<host>/ws), so the gateway must proxy the
              # /ws upgrade directly. oauth2-proxy removed 2026-06-06 — it
              # broke the wss upgrade and forced the "Server Address"
              # discover screen. MA is already LAN-reachable unauthenticated
              # via the LB VIP :8095; this route is internal-gateway only.
              - identifier: app
                port: *httpPort
    persistence:
      data:
        existingClaim: music-assistant-data-pvc

      media:
        existingClaim: music-assistant-music-pvc

      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /.audio
            subPath: .audio
