---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app radarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      radarr:
        pod:
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1102
            # Strict: effective groups = only what's declared here (drops any
            # implicit image /etc/group groups). Media access is via primary GID
            # 1001, so this is safe. Verify via pod status .user.linux after
            # rollout. (k8s 1.35 GA)
            supplementalGroupsPolicy: Strict

        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        # The config PVC was populated when this controller ran as uid 1000;
        # runAsUser is now 1102 (per-app-UIDs commit 152c67ef3a) and
        # fsGroupChangePolicy:OnRootMismatch skips the recursive fsGroup chown
        # (the PVC root already matches gid 1001), so the stale uid-1000 files
        # (/config/asp DataProtection keyring, MediaCover/**, logs) aren't
        # readable/writable by 1102 — DataProtection keys regenerate every boot
        # and cover-art/log writes throw "Permission denied". Reclaim /config
        # ownership on startup; idempotent + self-heals. Scoped to /config only —
        # the media/downloads NFS mounts are owned correctly and must not be
        # touched. Mirrors the lidarr init-perms pattern.
        initContainers:
          init-perms:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: rolling@sha256:be53998a2d39cfa3c3315b70c7509a6a1f2a10c3aee9337653efc9f4c970430e
            command:
              - chown
              - -R
              - 1102:1001
              - /config
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: rolling@sha256:be53998a2d39cfa3c3315b70c7509a6a1f2a10c3aee9337653efc9f4c970430e

            env:
              RADARR__APP__INSTANCENAME: Radarr
              RADARR__AUTH__METHOD: External
              RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
              RADARR__LOG__DBENABLED: "False"
              RADARR__LOG__LEVEL: info
              RADARR__SERVER__PORT: &httpPort 7878
              RADARR__UPDATE__BRANCH: develop

            envFrom:
              - secretRef:
                  name: *app


            resources:
              requests:
                cpu: 15m
                memory: 1Gi
              limits:
                memory: 1.5Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: radarr
        ports:
          http:
            port: *httpPort

    route:
      app:
        annotations:
          glance/name: "Radarr"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/radarr.png"
          glance/id: "Media"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - kind: Service
                name: radarr
                port: 7878
    persistence:
      config:
        existingClaim: radarr-config-pvc

      downloads:
        existingClaim: radarr-downloads

      media:
        existingClaim: radarr-media

      sabnzbd:
        existingClaim: sonarr-sabnzbd-downloads

      # Writable scratch for readOnlyRootFilesystem: true. DataProtection's
      # atomic key-store writes a temp file via Path.GetTempFileName() (/tmp);
      # without this it fails "Read-only file system" on every boot. Mirrors
      # the lidarr tmpfs mount.
      tmp:
        type: emptyDir
        medium: Memory
    externalSecrets:
      radarr:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: radarr
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              RADARR__API_KEY: "{{ .RADARR__API_KEY }}"
              RADARR__POSTGRES__HOST: postgres-radarr-rw.databases.svc.cluster.local
              RADARR__POSTGRES__PORT: "5432"
              RADARR__POSTGRES__USER: "{{ .POSTGRES_USER }}"
              RADARR__POSTGRES__PASSWORD: "{{ .POSTGRES_PASS }}"
              RADARR__POSTGRES__MAINDB: radarr-main
              # Garage S3 creds for the cnpg-app-database backup ObjectStore
              # (consumed by radarr-secret in databases namespace, kept here too
              # so a single 1P item drives both)
              GARAGE_AWS_ACCESS_KEY_ID: "{{ .GARAGE_AWS_ACCESS_KEY_ID }}"
              GARAGE_AWS_SECRET_ACCESS_KEY: "{{ .GARAGE_AWS_SECRET_ACCESS_KEY }}"
        dataFrom:
          - extract:
              key: radarr
    networkpolicies:
      allow:
        type: cilium
        forceRename: radarr-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: radarr
        # Additive — default-deny is what triggers the lockdown.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal gateway (envoy) → radarr:7878. Auth is enforced at the
          # gateway by the extAuth SecurityPolicy (#12767); the oauth2-proxy
          # hop is retired.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "7878"
                    protocol: TCP
          # Cross-ns: prowlarr sync-app pushes indexer config; janitorr +
          # seerr + suggestarr call radarr API to add/list/remove movies.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: prowlarr
            toPorts:
              - ports:
                  - port: "7878"
                    protocol: TCP
          # Cross-ns: arr-mcp MCP server queries this API via
          # RADARR_URL=http://radarr.media.svc.cluster.local:7878. Mirrors the
          # arr-mcp source already allowed in prowlarr-allow (downloads ns).
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  app.kubernetes.io/name: arr-mcp
            toPorts:
              - ports:
                  - port: "7878"
                    protocol: TCP
        egress:
          # CNPG: postgres-radarr in databases ns (Pattern B).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  cnpg.io/cluster: postgres-radarr
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
          # Cross-ns: download-client APIs in downloads ns (Pattern E).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: sabnzbd
              - matchLabels:
                  io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: qbittorrent
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          # Cross-ns: prowlarr indexer API in downloads ns.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: prowlarr
            toPorts:
              - ports:
                  - port: "9696"
                    protocol: TCP
          # External metadata + indexer probes (TMDb, IMDb, trakt, indexer
          # surface). Indexer set rotates; world on 443/80.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "80"
                    protocol: TCP
