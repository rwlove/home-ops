---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app recyclarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      recyclarr:
        pod:
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch

            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1000
        annotations:
          reloader.stakater.com/auto: "true"

        cronjob:
          schedule: "@daily"

        type: cronjob

        containers:
          app:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 8.7.2@sha256:6e69e009e1cd7493ff6093e8e187b5d3788c75b4a2c0c5127b6a1beda1c19728
            args:
              - sync

            env:
              COMPlus_EnableDiagnostics: "0"

            envFrom:
              - secretRef:
                  name: *app

            resources:
              requests:
                cpu: 10m
                memory: 128M
              limits:
                memory: 128M

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    persistence:
      config:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        advancedMounts:
          recyclarr:
            app:
              - path: /config

      config-file:
        type: configMap
        name: recyclarr
        globalMounts:
          - path: /config/recyclarr.yml
            subPath: recyclarr.yml
            readOnly: true
    externalSecrets:
      recyclarr:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: recyclarr
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              RADARR_API_KEY: "{{ .RADARR__API_KEY }}"
              SONARR_API_KEY: "{{ .SONARR__API_KEY }}"
        dataFrom:
          - extract:
              key: radarr
              property: RADARR__API_KEY
          - extract:
              key: sonarr
              property: SONARR__API_KEY
    networkpolicies:
      allow:
        type: cilium
        forceRename: recyclarr-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: recyclarr
        # Additive — default-deny is what triggers the lockdown. Egress to
        # sonarr/radarr in same ns is covered by baseline allow-intra-namespace.
        enableDefaultDeny:
          egress: false
          ingress: false
        egress:
          # External: clones github.com/recyclarr/config-templates (trash-guides
          # JSON snapshots) at the start of each `recyclarr sync` run; also
          # fetches raw content from raw./codeload./objects.githubusercontent.com.
          #
          # github.com, *.github.com subdomains, and *.githubusercontent.com
          # subdomains all resolve to A-records only (no CNAME chain). Cilium
          # 1.19's toFQDNs.matchPattern only walks one label per `.*` and
          # follows CNAME canonical names — so wildcards and bare
          # matchPatterns against these A-only zones are inert. Coverage is
          # provided by the toEntities: [world]:443 rule below.
          #
          # See project_cilium_matchpattern_fqdn_limits.md for the cluster-
          # wide audit.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
