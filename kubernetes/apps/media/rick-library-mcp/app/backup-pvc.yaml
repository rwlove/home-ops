---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/persistentvolumeclaim-v1.json
# Off-library revert/backup store for rick-library-mcp: original-file copies made
# before each fix + the change ledger (ledger.jsonl). ceph-block (the default
# in-cluster-durable tier) — survives pod restart + node loss, which is the right
# bar for a short-window operational undo store (the ledger is also mirrored to
# the agent's memory; the library has its own backup story). Dynamically
# provisioned; RWO — only the single rick-library-mcp pod mounts it (the
# controller uses strategy: Recreate so RWO handoff on rollout is clean).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rick-library-mcp-backup-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 50Gi
