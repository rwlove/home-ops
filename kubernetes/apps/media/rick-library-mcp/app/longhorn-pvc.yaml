---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/persistentvolumeclaim-v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rick-library-mcp-backup-pvc
  labels:
    type: longhorn
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 50Gi
  volumeName: rick-library-mcp-backup-pv
  storageClassName: rick-library-mcp-backup-storage-class

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rick-library-mcp-backup-pv
  labels:
    type: longhorn
    # The off-library revert store: original-file copies + the change ledger.
    # Irreplaceable-until-revert, so it is backed up (weekly) + snapshotted daily.
    recurring-job-group.longhorn.io/weekly-backup: enabled
    recurring-job-group.longhorn.io/daily-snapshot: enabled
spec:
  capacity:
    storage: 50Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: rick-library-mcp-backup-storage-class
  csi:
    driver: driver.longhorn.io
    fsType: xfs
    volumeAttributes:
      numberOfReplicas: "2"
      staleReplicaTimeout: "2880"
    volumeHandle: rick-library-mcp-backup-xfs
