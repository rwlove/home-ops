---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/persistentvolume-v1.json
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rick-library-mcp-music-pv
  labels:
    type: nfs
spec:
  storageClassName: rick-library-mcp-music-storage-class
  capacity:
    storage: 3Ti
  accessModes:
    - ReadWriteMany
  # Tier B (media-manager-written library): no actimeo — the server must see
  # tag edits promptly and other media apps write the same tree.
  mountOptions: ["nfsvers=4.2", "nconnect=8", "hard", "noatime"]
  nfs:
    server: "${NFS_HOST_2}"
    path: /mnt/mass_storage/storage/MP3s/

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rick-library-mcp-music-pvc
  labels:
    type: nfs
spec:
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  resources:
    requests:
      storage: 3Ti
  volumeName: rick-library-mcp-music-pv
  storageClassName: rick-library-mcp-music-storage-class
