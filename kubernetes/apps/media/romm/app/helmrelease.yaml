---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app romm
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 1h
  install:
    timeout: 20m
    remediation:
      retries: 3
  upgrade:
    # RomM runs forward-only Alembic migrations at startup, so a rollback of
    # the *image* cannot un-migrate the *database*. On 2026-07-31 the 5.0.0 ->
    # 5.1.0 bump exceeded Helm's 5m default timeout (image pulls were queued
    # behind a 40-PR Renovate wave), Flux remediated with strategy: rollback,
    # and 5.0.0 came back up against a DB already stamped at 5.1.0's revision
    # `0103_roms_facets_provider_ids`. It could not locate that revision, so it
    # crashlooped -- and every subsequent rollback attempt re-applied the same
    # unstartable version. The release wedged permanently and needed a spec
    # change to escape.
    #
    # timeout: 20m gives the pull + migration room so remediation is not
    # triggered by slowness alone.
    #
    # retries: 0 disables remediation entirely. For an app with forward-only
    # migrations, failing forward and staying on the new version is strictly
    # safer than rolling back to a version that can no longer read its own
    # database. A failed upgrade stays visible as Ready=False instead of
    # silently reverting into an unrecoverable state.
    timeout: 20m
    cleanupOnFail: true
    remediation:
      retries: 0
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      romm:
        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4.0@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec

            envFrom: &envFrom
              - secretRef:
                  name: romm-secret

        containers:
          app:
            image:
              repository: ghcr.io/rommapp/romm
              tag: 5.1.0@sha256:ce9d86ab531e09fede45d00f426e3bf2d1f5dd14846f94d6360d77a92a413028

            env:
              # Runtime
              ROMM_PORT: &port 8080
              ROMM_DB_DRIVER: postgresql

              # Scrapers / scheduled jobs
              ENABLE_SCHEDULED_RESCAN: "true"
              SCHEDULED_RESCAN_CRON: "0 3 * * *"
              ENABLE_SCHEDULED_UPDATE_SWITCH_TITLEDB: "false"
              ENABLE_SCHEDULED_UPDATE_MAME_XML: "false"
              ENABLE_RESCAN_ON_FILESYSTEM_CHANGE: "true"
              RESCAN_ON_FILESYSTEM_CHANGE_DELAY: 5
              FLASHPOINT_API_ENABLED: true
              HLTB_API_ENABLED: true
              HASHEOUS_API_ENABLED: true
              LAUNCHBOX_API_ENABLED: true
              ENABLE_SCHEDULED_UPDATE_LAUNCHBOX_METADATA: true
              PLAYMATCH_API_ENABLED: true
              # TheGamesDB: keyless public API, capped 1000 req/month for unregistered.
              # Plenty for periodic library scans on a personal collection.
              TGDB_API_ENABLED: true

              # Bump from default 14400 (4h) so a full COMPLETE scan of
              # ~10k ROMs through 10 metadata sources fits in one job
              # without RQ JobTimeoutException.
              SCAN_TIMEOUT: 28800

            envFrom: *envFrom

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10

            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 5Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: romm
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          glance/name: "RomM"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/romm.svg"
          glance/id: "Media"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      config-file:
        type: configMap
        name: romm-config
        advancedMounts:
          romm:
            app:
              - path: /romm/config/config.yml
                subPath: config.yml
                readOnly: true

      romm:
        existingClaim: romm-config-pvc
        advancedMounts:
          romm:
            app:
              - path: /romm/resources
                subPath: resources
              - path: /romm/assets
                subPath: assets
              - path: /romm/config
                subPath: config

      games:
        existingClaim: romm-games-pvc
        advancedMounts:
          romm:
            app:
              - path: /romm/library

      tmp:
        type: emptyDir
        medium: Memory
        advancedMounts:
          romm:
            app:
              - path: /tmp
