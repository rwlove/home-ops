---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app romm
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 1h
  install:
    timeout: 20m
    remediation:
      retries: 3
  upgrade:
    # RomM runs forward-only Alembic migrations at startup, so a rollback of
    # the *image* cannot un-migrate the *database*. On 2026-07-31 the 5.0.0 ->
    # 5.1.0 bump exceeded Helm's 5m default timeout (image pulls were queued
    # behind a 40-PR Renovate wave), Flux remediated with strategy: rollback,
    # and 5.0.0 came back up against a DB already stamped at 5.1.0's revision
    # `0103_roms_facets_provider_ids`. It could not locate that revision, so it
    # crashlooped -- and every subsequent rollback attempt re-applied the same
    # unstartable version. The release wedged permanently and needed a spec
    # change to escape.
    #
    # timeout: 20m gives the pull + migration room so remediation is not
    # triggered by slowness alone.
    #
    # retries: 0 disables remediation entirely. For an app with forward-only
    # migrations, failing forward and staying on the new version is strictly
    # safer than rolling back to a version that can no longer read its own
    # database. A failed upgrade stays visible as Ready=False instead of
    # silently reverting into an unrecoverable state.
    timeout: 20m
    cleanupOnFail: true
    remediation:
      retries: 0
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      romm:
        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b

            envFrom: &envFrom
              - secretRef:
                  name: romm-secret

        containers:
          app:
            image:
              repository: ghcr.io/rommapp/romm
              tag: 5.3.0@sha256:dc586cb3a2c7316fcffb3dc273171b1964523f0f409e989295d26d2199df1d4e

            env:
              # Runtime
              ROMM_PORT: &port 8080
              ROMM_DB_DRIVER: postgresql
              # Redis (host/port from ExternalSecret) — now a dedicated
              # dragonfly-romm instance, so romm is the only tenant. db2 kept
              # for continuity; the index no longer matters for isolation.
              REDIS_DB: "2"

              # Scrapers / scheduled jobs
              ENABLE_SCHEDULED_RESCAN: "true"
              SCHEDULED_RESCAN_CRON: "0 3 * * *"
              ENABLE_SCHEDULED_UPDATE_SWITCH_TITLEDB: "false"
              ENABLE_SCHEDULED_UPDATE_MAME_XML: "false"
              ENABLE_RESCAN_ON_FILESYSTEM_CHANGE: "true"
              RESCAN_ON_FILESYSTEM_CHANGE_DELAY: 5
              FLASHPOINT_API_ENABLED: true
              HLTB_API_ENABLED: true
              HASHEOUS_API_ENABLED: true
              LAUNCHBOX_API_ENABLED: true
              ENABLE_SCHEDULED_UPDATE_LAUNCHBOX_METADATA: true
              PLAYMATCH_API_ENABLED: true
              # TheGamesDB: keyless public API, capped 1000 req/month for unregistered.
              # Plenty for periodic library scans on a personal collection.
              TGDB_API_ENABLED: true

              # Bump from default 14400 (4h) so a full COMPLETE scan of
              # ~10k ROMs through 10 metadata sources fits in one job
              # without RQ JobTimeoutException.
              SCAN_TIMEOUT: 28800

            envFrom: *envFrom

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10

            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 5Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: romm
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          glance/name: "RomM"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/romm.svg"
          glance/id: "Media"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      config-file:
        type: configMap
        name: romm-config
        advancedMounts:
          romm:
            app:
              - path: /romm/config/config.yml
                subPath: config.yml
                readOnly: true

      romm:
        existingClaim: romm-config-pvc
        advancedMounts:
          romm:
            app:
              - path: /romm/resources
                subPath: resources
              - path: /romm/assets
                subPath: assets
              - path: /romm/config
                subPath: config

      games:
        existingClaim: romm-games-pvc
        advancedMounts:
          romm:
            app:
              - path: /romm/library

      tmp:
        type: emptyDir
        medium: Memory
        advancedMounts:
          romm:
            app:
              - path: /tmp
    externalSecrets:
      romm:
        refreshInterval: 15m
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: romm-secret
          template:
            engineVersion: v2
            data:
              # App
              ROMM_AUTH_SECRET_KEY: "{{ .ROMM_AUTH_SECRET_KEY }}"

              # OIDC (Authelia)
              OIDC_ENABLED: "true"
              OIDC_PROVIDER: authelia
              OIDC_CLIENT_ID: romm
              OIDC_CLIENT_SECRET: "{{ .ROMM_OIDC_CLIENT_SECRET }}"
              OIDC_REDIRECT_URI: https://romm.${SECRET_DOMAIN}/api/oauth/openid
              OIDC_SERVER_APPLICATION_URL: https://auth.${SECRET_DOMAIN}
              OIDC_SERVER_METADATA_URL: https://auth.${SECRET_DOMAIN}/.well-known/openid-configuration

              # Database
              DB_HOST: postgres-romm-rw.databases.svc.cluster.local
              DB_PORT: "5432"
              DB_NAME: romm
              DB_USER: "{{ .POSTGRES_USER }}"
              DB_PASSWD: "{{ .POSTGRES_PASS }}"

              # Redis — dedicated dragonfly-romm instance. RomM caches the full
              # LaunchBox Games DB (~760Mi) here to match ROMs; on the shared
              # `dragonfly` that filled the 768Mi noeviction cap and rejected every
              # other tenant's writes. Split off like immich (#13785) / auth
              # (#13787) so romm's cache can only wedge romm.
              REDIS_HOST: dragonfly-romm.databases.svc.cluster.local
              REDIS_PORT: "6379"

              # Postgres init
              INIT_POSTGRES_DBNAME: romm
              INIT_POSTGRES_HOST: postgres-romm-rw.databases.svc.cluster.local
              INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
              INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
              INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"

              # Metadata providers (RomM enables each only when creds are non-empty)
              IGDB_CLIENT_ID: "{{ .IGDB_CLIENT_ID }}"
              IGDB_CLIENT_SECRET: "{{ .IGDB_CLIENT_SECRET }}"
              STEAMGRIDDB_API_KEY: "{{ .STEAMGRIDDB_API_KEY }}"
              RETROACHIEVEMENTS_API_KEY: "{{ .RETROACHIEVEMENTS_API_KEY }}"
              SCREENSCRAPER_USER: "{{ .SCREENSCRAPER_USER }}"
              SCREENSCRAPER_PASSWORD: "{{ .SCREENSCRAPER_PASSWORD }}"
        dataFrom:
          - extract:
              key: cloudnative-pg
          - extract:
              key: romm
    networkpolicies:
      allow:
        type: cilium
        forceRename: romm-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: romm
        # Additive — default-deny is what triggers the lockdown.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # HTTPRoute on internal envoy gateway → romm:8080.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        egress:
          # CNPG: postgres-romm in databases ns (Pattern B). The init-db
          # postgres-init initContainer also needs this on cold start.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  cnpg.io/cluster: postgres-romm
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
          # Dragonfly (Redis) in databases ns — used as romm's task/cache
          # broker.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  app.kubernetes.io/name: dragonfly
            toPorts:
              - ports:
                  - port: "6379"
                    protocol: TCP
          # External: 7+ ROM metadata providers (IGDB, TheGamesDB, Flashpoint,
          # HLTB, Hasheous, Launchbox, PlayMatch, etc.), Switch titleDB
          # updates, MAME XML feed. Provider set rotates; world keeps the
          # policy maintenance-free.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "80"
                    protocol: TCP
          # OIDC discovery + token exchange against Authelia. RomM uses
          # Authlib server-side OIDC with OIDC_SERVER_METADATA_URL pointing
          # at the external issuer auth.${SECRET_DOMAIN}, so every OIDC
          # request hits split-horizon DNS which returns the internal envoy
          # LB IP. Cilium socket-lb rewrites the connect() to the envoy pod
          # IP + targetPort 10443 BEFORE policy evaluation, so the policy
          # must allow the envoy pod on its container port (10443) — NOT
          # world:443 (doesn't match cluster LB IPs) and NOT authelia:9091
          # (RomM never connects there directly given this config). Mirrors
          # the working paperless egress (kubernetes/apps/collab/paperless).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "10443"
                    protocol: TCP
