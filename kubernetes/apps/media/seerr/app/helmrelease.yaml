---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app seerr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      seerr:
        pod:
          # Full identity duplicated from defaultPodOptions: a controller
          # pod.securityContext REPLACES (does not merge with) the inherited
          # defaultPodOptions.securityContext, so seccomp alone would drop
          # fsGroup/runAsUser. See
          # reference_apptemplate_pod_securitycontext_block_clobbers_inherited.
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
            env:
              LOG_LEVEL: "debug"
              PORT: &httpPort 5055
            # envFrom:
            #   - secretRef:
            #       name: seerr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: *httpPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 384Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: seerr
        ports:
          http:
            port: *httpPort

    route:
      app:
        annotations:
          glance/name: "Seer"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/seerr.png"
          glance/id: "Media"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    persistence:
      config:
        existingClaim: seerr-config-pvc
        globalMounts:
          - path: /app/config
      config-cache:
        existingClaim: seerr-cache-pvc
        globalMounts:
          - path: /app/config/cache
      config-logs:
        type: emptyDir
        globalMounts:
          - path: /app/config/logs
      tmp:
        type: emptyDir
    networkpolicies:
      allow:
        type: cilium
        forceRename: seerr-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: seerr
        # Additive — default-deny is what triggers the lockdown. Seerr's
        # HTTPRoute targets the seerr Service directly (no oauth2-proxy
        # sidecar) — ingress from envoy lands here. Egress to intra-ns
        # sonarr/radarr/jellyfin/janitorr is covered by baseline.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # HTTPRoute on internal envoy gateway → seerr:5055
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "5055"
                    protocol: TCP
        egress:
          # External metadata APIs: TMDb, Trakt, Plex.tv (login), TheTVDB,
          # Jellyfin OAuth provider Discord webhook integrations, push
          # notification providers, etc. Surface is too large to enumerate;
          # world on 443/80.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "80"
                    protocol: TCP
