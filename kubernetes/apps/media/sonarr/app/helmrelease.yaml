---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sonarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      sonarr:
        pod:
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1001
            runAsUser: 1101
            # Strict: effective groups = only what's declared here (drops any
            # implicit image /etc/group groups). Media access is via primary GID
            # 1001, so this is safe. Verify via pod status .user.linux after
            # rollout. (k8s 1.35 GA)
            supplementalGroupsPolicy: Strict

        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        # The config PVC was populated when this controller ran as uid 1000;
        # runAsUser is now 1101 (per-app-UIDs commit 152c67ef3a) and
        # fsGroupChangePolicy:OnRootMismatch skips the recursive fsGroup chown
        # (the PVC root already matches gid 1001), so the stale uid-1000 files
        # (/config/asp DataProtection keyring, MediaCover/**, logs) aren't
        # readable/writable by 1101 — DataProtection keys regenerate every boot
        # and cover-art/log writes throw "Permission denied". Reclaim /config
        # ownership on startup; idempotent + self-heals. Scoped to /config only —
        # the media/downloads NFS mounts are owned correctly and must not be
        # touched. Mirrors the lidarr init-perms pattern.
        initContainers:
          init-perms:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: rolling@sha256:1f19eb5e0f421418c1a956bbe01310a0141423afe28bd9a4b1dcb8629ff2bce2
            command:
              - chown
              - -R
              - 1101:1001
              - /config
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: rolling@sha256:1f19eb5e0f421418c1a956bbe01310a0141423afe28bd9a4b1dcb8629ff2bce2

            env:
              SONARR__APP__INSTANCENAME: Sonarr
              SONARR__AUTH__METHOD: External
              SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
              SONARR__LOG__DBENABLED: "False"
              SONARR__LOG__LEVEL: info
              SONARR__SERVER__PORT: &httpPort 8989
              SONARR__UPDATE__BRANCH: develop

            envFrom:
              - secretRef:
                  name: *app


            resources:
              requests:
                cpu: 15m
                memory: 1G
              limits:
                memory: 1.5Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: sonarr
        ports:
          http:
            port: *httpPort

    route:
      app:
        annotations:
          glance/name: "Sonarr"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/sonarr.png"
          glance/id: "Media"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - kind: Service
                name: sonarr
                port: 8989
    persistence:
      config:
        existingClaim: sonarr-config-pvc

      downloads:
        existingClaim: sonarr-downloads

      media:
        existingClaim: sonarr-media

      sabnzbd:
        existingClaim: sonarr-sabnzbd-downloads

      # Writable scratch for readOnlyRootFilesystem: true. DataProtection's
      # atomic key-store writes a temp file via Path.GetTempFileName() (/tmp);
      # without this it fails "Read-only file system" on every boot. Mirrors
      # the lidarr tmpfs mount.
      tmp:
        type: emptyDir
        medium: Memory
    externalSecrets:
      sonarr:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: sonarr
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              SONARR__API_KEY: "{{ .SONARR__API_KEY }}"
              SONARR__POSTGRES__HOST: postgres-sonarr-rw.databases.svc.cluster.local
              SONARR__POSTGRES__PORT: "5432"
              SONARR__POSTGRES__USER: "{{ .POSTGRES_USER }}"
              SONARR__POSTGRES__PASSWORD: "{{ .POSTGRES_PASS }}"
              SONARR__POSTGRES__MAINDB: sonarr-main
              # Garage S3 creds for the cnpg-app-database backup ObjectStore
              # (consumed by sonarr-secret in databases namespace, kept here too
              # so a single 1P item drives both)
              GARAGE_AWS_ACCESS_KEY_ID: "{{ .GARAGE_AWS_ACCESS_KEY_ID }}"
              GARAGE_AWS_SECRET_ACCESS_KEY: "{{ .GARAGE_AWS_SECRET_ACCESS_KEY }}"
        dataFrom:
          - extract:
              key: sonarr
    networkpolicies:
      allow:
        type: cilium
        forceRename: sonarr-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: sonarr
        # Additive — default-deny is what triggers the lockdown.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal gateway (envoy) → sonarr:8989. Auth is enforced at the
          # gateway by the extAuth SecurityPolicy (#12767); the oauth2-proxy
          # hop is retired.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8989"
                    protocol: TCP
          # Cross-ns: prowlarr sync-app + janitorr + seerr/suggestarr push/poll.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: prowlarr
            toPorts:
              - ports:
                  - port: "8989"
                    protocol: TCP
          # Cross-ns: arr-mcp MCP server queries this API via
          # SONARR_URL=http://sonarr.media.svc.cluster.local:8989. Mirrors the
          # arr-mcp source already allowed in prowlarr-allow (downloads ns).
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: mcp-system
                  app.kubernetes.io/name: arr-mcp
            toPorts:
              - ports:
                  - port: "8989"
                    protocol: TCP
        egress:
          # CNPG: postgres-sonarr in databases ns (Pattern B).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  cnpg.io/cluster: postgres-sonarr
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
          # Cross-ns: download-client APIs in downloads ns (Pattern E).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: sabnzbd
              - matchLabels:
                  io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: qbittorrent
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          # Cross-ns: prowlarr indexer API in downloads ns.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: prowlarr
            toPorts:
              - ports:
                  - port: "9696"
                    protocol: TCP
          # External metadata + indexer probes (TVDB, trakt, indexer surface).
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "80"
                    protocol: TCP
