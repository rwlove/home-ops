---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sonarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      sonarr:
        pod:
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1001
            runAsUser: 1101

        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        # The config PVC was populated when this controller ran as uid 1000;
        # runAsUser is now 1101 (per-app-UIDs commit 152c67ef3a) and
        # fsGroupChangePolicy:OnRootMismatch skips the recursive fsGroup chown
        # (the PVC root already matches gid 1001), so the stale uid-1000 files
        # (/config/asp DataProtection keyring, MediaCover/**, logs) aren't
        # readable/writable by 1101 — DataProtection keys regenerate every boot
        # and cover-art/log writes throw "Permission denied". Reclaim /config
        # ownership on startup; idempotent + self-heals. Scoped to /config only —
        # the media/downloads NFS mounts are owned correctly and must not be
        # touched. Mirrors the lidarr init-perms pattern.
        initContainers:
          init-perms:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: rolling@sha256:f9dec0cf69a45b16c698ef2a25fe6c70ff4ec8d0b2315897c0d48b3b5a456c87
            command:
              - chown
              - -R
              - 1101:1001
              - /config
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: rolling@sha256:f9dec0cf69a45b16c698ef2a25fe6c70ff4ec8d0b2315897c0d48b3b5a456c87

            env:
              SONARR__APP__INSTANCENAME: Sonarr
              SONARR__AUTH__METHOD: External
              SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
              SONARR__LOG__DBENABLED: "False"
              SONARR__LOG__LEVEL: info
              SONARR__SERVER__PORT: &httpPort 8989
              SONARR__UPDATE__BRANCH: develop

            envFrom:
              - secretRef:
                  name: *app


            resources:
              requests:
                cpu: 15m
                memory: 1G
              limits:
                memory: 1.5Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: sonarr
        ports:
          http:
            port: *httpPort

    route:
      app:
        annotations:
          glance/name: "Sonarr"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/sonarr.png"
          glance/id: "Media"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - kind: Service
                name: sonarr
                port: 8989
    persistence:
      config:
        existingClaim: sonarr-config-pvc

      downloads:
        existingClaim: sonarr-downloads

      media:
        existingClaim: sonarr-media

      sabnzbd:
        existingClaim: sonarr-sabnzbd-downloads

      # Writable scratch for readOnlyRootFilesystem: true. DataProtection's
      # atomic key-store writes a temp file via Path.GetTempFileName() (/tmp);
      # without this it fails "Read-only file system" on every boot. Mirrors
      # the lidarr tmpfs mount.
      tmp:
        type: emptyDir
        medium: Memory
