---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app soularr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      soularr:
        pod:
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1110

        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        initContainers:
          config-setup:
            image:
              repository: ghcr.io/dmfrey/bash
              tag: 5.2.26-alpine3.20@sha256:7b8f16b5d06b4cd836c81d61990d7d52a08d183e5909dd7accfbc5601471e877
            command:
              - "/usr/local/bin/bash"
              - -c
              - |
                envsubst < /tmp/config.ini > /data/config.ini
                exit 0
            envFrom:
              - secretRef:
                  name: soularr-secret

        containers:
          app:
            image:
              repository: ghcr.io/mrusse/soularr
              tag: 1.2.2@sha256:c4f97924fabfce4e0de539d821ea7d20519b95c4815a707bacfc9d7212597f20

            env:
              # Soularr v1.2.0+ ships a Web UI on port 8265, off by default.
              # Pair with log_to_file=True in config.ini — the UI reads the
              # rotated log file to render activity.
              WEBUI_ENABLED: "true"

            resources:
              requests:
                cpu: 10m
                memory: 768Mi
              limits:
                # 768Mi limit OOMKilled 8× — soularr builds an in-memory
                # user/directory cache while processing large Soulseek search
                # results. 1536Mi gives 2× burst headroom; request/limit gap
                # kept deliberately (req==lim invites OOMKill under spikes).
                memory: 1536Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: soularr
        ports:
          http:
            # Soularr's Web UI listens on 8265 (mrusse/soularr v1.2.0+).
            # Override via WEBUI_PORT env if you ever change it.
            port: 8265

    route:
      app:
        annotations:
          glance/name: "Soularr"
          glance/show: "true"
          glance/id: "Media"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - kind: Service
                name: soularr
                port: 8265

    persistence:
      data:
        existingClaim: soularr-config-pvc

      slskd:
        existingClaim: soularr-slskd-downloads-pvc
        globalMounts:
          - path: /slskd

      config-file:
        type: configMap
        defaultMode: 0775
        name: soularr-configmap
        advancedMounts:
          soularr:
            config-setup:
              - path: /tmp/config.ini
                subPath: config.ini
                readOnly: true

      tmp:
        type: emptyDir
    externalSecrets:
      soularr:
        secretStoreRef:
          name: onepassword-connect
          kind: ClusterSecretStore
        refreshInterval: 15m
        target:
          name: soularr-secret
          template:
            engineVersion: v2
            data:
              LIDARR_API_KEY: "{{ .LIDARR__API_KEY }}"
              SLSKD_API_KEY: "{{ .SLSKD_API_KEY }}"
        dataFrom:
          - extract:
              key: lidarr
          - extract:
              key: slskd
    networkpolicies:
      allow:
        type: cilium
        forceRename: soularr-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: soularr
        # Additive — default-deny is what triggers the lockdown. Egress to lidarr in
        # this ns is covered by baseline allow-intra-namespace.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal gateway (envoy) → soularr:8265. Auth is enforced at the
          # gateway by the extAuth SecurityPolicy (#12767); the oauth2-proxy
          # hop is retired.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8265"
                    protocol: TCP
        egress:
          # Cross-ns: slskd API in downloads ns (Pattern E). Soularr orchestrates
          # Lidarr → Soulseek searches by calling the slskd HTTP API.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: slskd
            toPorts:
              - ports:
                  - port: "5030"
                    protocol: TCP
