[Lidarr]
api_key = ${LIDARR_API_KEY}
host_url = http://lidarr.media.svc.cluster.local:8686
download_dir = /slskd

[Slskd]
api_key = ${SLSKD_API_KEY}
host_url = http://slskd.downloads.svc.cluster.local:5030
url_base = /
download_dir = /slskd/complete
delete_searches = True
stalled_timeout = 3600

[Release Settings]
use_most_common_tracknum = True
allow_multi_disc = True
accepted_countries = Europe,Japan,United Kingdom,United States,[Worldwide],Australia,Canada
accepted_formats = CD,Digital Media,Vinyl

[Search Settings]
search_timeout = 5000
maximum_peer_queue = 50
minimum_peer_upload_speed = 0
# Raised 0.5 -> 0.8: the match is on the peer FILENAME, not the audio. For
# niche artists the source network barely seeds, a same-titled file by a
# different (popular) artist cleared 0.5 and got grabbed, then imported under
# the intended artist's folder (wrong content, right folder). 0.8 forces the
# artist portion of "artist - title" to actually agree before accepting;
# misses fall back to still-wanted rather than grabbing the wrong track.
minimum_filename_match_ratio = 0.8
allowed_filetypes = flac 24/192,flac 16/44.1,flac,mp3 320,mp3
ignored_users = User1,User2,Fred,Bob
search_for_tracks = True
# True so album searches include the artist string, giving the ratio above the
# artist to discriminate on (was False -> title-only match for album grabs).
album_prepend_artist = True
track_prepend_artist = True
search_type = incrementing_page
number_of_albums_to_grab = 10
remove_wanted_on_failure = False
title_blacklist = Word1,word2
search_source = missing

[Logging]
level = DEBUG
format = [%(levelname)s|%(module)s|L%(lineno)d] %(asctime)s: %(message)s
datefmt = %Y-%m-%dT%H:%M:%S%z
# log_to_file is required for the Web UI (port 8265) to render activity.
log_to_file = True
log_file = soularr.log
max_bytes = 1048576
backup_count = 3
