---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app suggestarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      suggestarr:
        pod:
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: "OnRootMismatch"
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1000

        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset
        containers:
          app:
            image:
              repository: docker.io/ciuse99/suggestarr
              tag: v2.15.0@sha256:1e7f274df052d2a2a20bafdd4d730474902258008c1030bb43ba3dcb5daed8d7


            resources:
              requests:
                cpu: 15m
                memory: 384Mi
              limits:
                memory: 512Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: suggestarr
        ports:
          http:
            port: &port 5000

    route:
      app:
        annotations:
          glance/name: "Suggestarr"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/suggest-arr.png"
          glance/id: "Media"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - kind: Service
                name: suggestarr
                port: 5000
    persistence:
      config:
        existingClaim: suggestarr-config-pvc
        globalMounts:
          - path: /app/config/config_files
      tmpfs:
        type: emptyDir
        advancedMounts:
          suggestarr:
            app:
              - path: /tmp
    networkpolicies:
      allow:
        type: cilium
        forceRename: suggestarr-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: suggestarr
        # Additive — default-deny is what triggers the lockdown. Egress to intra-ns
        # sonarr/radarr/seerr is covered by baseline allow-intra-namespace.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal gateway (envoy) → suggestarr:5000. Auth is enforced at the
          # gateway by the extAuth SecurityPolicy (#12767); the oauth2-proxy
          # hop is retired.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "5000"
                    protocol: TCP
        egress:
          # Cross-ns: suggestarr's AI-suggestions feature calls ollama in the
          # ai namespace for LLM-based recommendation reasoning.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: ollama
            toPorts:
              - ports:
                  - port: "11434"
                    protocol: TCP
          # External metadata APIs (TMDb, Trakt, etc.) — surface too broad to
          # enumerate per-FQDN.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "80"
                    protocol: TCP
