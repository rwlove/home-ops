---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app theme-park
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      theme-park:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app

        replicas: 2

        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/theme-park
              tag: rolling@sha256:8087a8c3a81e342014ce2528870bc97a50c86ccd8e316287cac2d200d44e19c1
            resources:
              requests:
                cpu: 15m
                memory: 64M
              limits:
                memory: 64M
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: theme-park
        ports:
          http:
            port: &httpPort 8080

    route:
      app:
        annotations:
          glance/name: "Theme Park"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/themepark.png"
          glance/id: "Media"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort

    persistence:
      # nginx (UID 101) writes its pid + all *_temp_path dirs under /tmp;
      # required scratch under readOnlyRootFilesystem: true. Logs symlink
      # to stdout/stderr and no proxy_cache is configured, so /tmp is the
      # only writable path needed.
      tmp:
        type: emptyDir
        advancedMounts:
          theme-park:
            app:
              - path: /tmp
