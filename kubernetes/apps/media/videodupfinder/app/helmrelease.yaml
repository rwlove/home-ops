---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app videodupfinder
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      videodupfinder:
        enabled: false # disabled 2026-08-23 to relieve memory pressure; revert to re-enable
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b

            envFrom: &envFrom
              - secretRef:
                  name: videodupfinder-secret

        containers:
          app:
            image:
              repository: ghcr.io/rwlove/videodupfinder
              tag: v0.3@sha256:a769866d3a6307869fd1a2172723bf27e1d3b0d3e6cfebb17a1db48597b97005

            env:
              VIDEODUPFINDER_BIN_DIR: /mnt/scan/.videodupfinder-bin
              VIDEODUPFINDER_LOG_FORMAT: json
              VIDEODUPFINDER_LISTEN_ADDR: ":8000"

            envFrom: *envFrom

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &httpPort 8000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false

            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: false
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: videodupfinder
        ports:
          http:
            port: *httpPort

    route:
      app:
        annotations:
          glance/name: "Video Dup Finder"
          glance/show: "true"
          glance/id: "Media"

        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort

    persistence:
      scan:
        type: persistentVolumeClaim
        existingClaim: videodupfinder-scan-pvc
        globalMounts:
          # Read-only enforces "no changes on disk unless approved by the user".
          # Flip to false (or remove this line) when you're ready to act on
          # findings — bin/restore won't work until you do.
          - path: /mnt/scan
            readOnly: true
