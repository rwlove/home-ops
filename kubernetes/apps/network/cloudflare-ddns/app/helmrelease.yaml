---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cloudflare-ddns
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      cloudflare-ddns:
        pod:
          securityContext:
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: docker.io/favonia/cloudflare-ddns
              tag: 1.17.0@sha256:61013368c8f95981c0bb8bf56d962078d8b4e95724a554fa2dabb20d6e478097

            env:
              DOMAINS: vpn.${SECRET_DOMAIN}
              IP4_PROVIDER: cloudflare.trace
              IP6_PROVIDER: none
              PROXIED: "false"
              TZ: ${TIMEZONE}
              UPDATE_CRON: "@every 5m"

            envFrom:
              - secretRef:
                  name: cloudflare-ddns-secret

            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false

            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi

            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
              readOnlyRootFilesystem: true

    externalSecrets:
      cloudflare-ddns:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: cloudflare-ddns-secret
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              CLOUDFLARE_API_TOKEN: "{{ .CLOUDFLARE_TOKEN }}"
        dataFrom:
          - extract:
              key: cloudflare
    networkpolicies:
      allow:
        type: cilium
        forceRename: cloudflare-ddns-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: cloudflare-ddns
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        egress:
          # api.cloudflare.com (zone record updates) + cloudflare.com/cdn-cgi
          # /trace (IP4 detection via IP4_PROVIDER=cloudflare.trace).
          # Cilium matchPattern unreliable for these canonical FQDNs — use
          # `toEntities: [world]` + 443/TCP.
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
