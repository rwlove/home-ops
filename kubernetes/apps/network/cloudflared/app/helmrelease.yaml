---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cloudflared
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      cloudflared:
        pod:
          securityContext:
            runAsGroup: 568
            runAsNonRoot: true

            runAsUser: 568
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app

        annotations:
          reloader.stakater.com/auto: "true"

        # Two replicas with topology spread expresses HA intent, but
        # without a PDB a node drain can take both at once.
        podDisruptionBudget:
          minAvailable: 1

        replicas: 2
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: docker.io/cloudflare/cloudflared
              tag: 2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c

            args:
              - tunnel
              - --config
              - /etc/cloudflared/config/config.yaml
              - run
              - "$(TUNNEL_ID)"

            env:
              NO_AUTOUPDATE: true
              TUNNEL_CRED_FILE: /etc/cloudflared/creds/credentials.json
              TUNNEL_METRICS: 0.0.0.0:8080
              TUNNEL_ORIGIN_ENABLE_HTTP2: true
              TUNNEL_TRANSPORT_PROTOCOL: quic
              TUNNEL_POST_QUANTUM: true
              TUNNEL_ID:
                valueFrom:
                  secretKeyRef:
                    name: cloudflared-tunnel-secret
                    key: TunnelID

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: &httpPort 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false


            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: cloudflared
        ports:
          http:
            port: *httpPort
    persistence:
      config:
        type: configMap
        name: cloudflared-configmap
        globalMounts:
          - path: /etc/cloudflared/config/config.yaml
            subPath: config.yaml
            readOnly: true

      creds:
        type: secret
        name: cloudflared-tunnel-secret
        globalMounts:
          - path: /etc/cloudflared/creds/credentials.json
            subPath: credentials.json
            readOnly: true

    externalSecrets:
      cloudflared-tunnel:
        forceRename: cloudflared-tunnel
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: cloudflared-tunnel-secret
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              credentials.json: |
                {
                  "AccountTag": "{{ .CLOUDFLARE_ACCOUNT_TAG }}",
                  "TunnelSecret": "{{ .CLOUDFLARE_TUNNEL_SECRET }}",
                  "TunnelID": "{{ .CLUSTER_CLOUDFLARE_TUNNEL_ID }}"
                }
              TunnelID: "{{ .CLUSTER_CLOUDFLARE_TUNNEL_ID }}"
        dataFrom:
          - extract:
              key: cloudflared
    networkpolicies:
      allow:
        type: cilium
        forceRename: cloudflared-allow
        # Explicit endpointSelector preserves the pre-inline selector
        # (app.kubernetes.io/name) instead of the chart's controller-derived
        # default, keeping the policy byte-identical across the migration.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: cloudflared
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        # Ingress :8080 (metrics + readiness probe) covered by:
        #   - baseline allow-host-probes (kubelet)
        #   - baseline allow-monitoring-scrape (Prometheus)
        egress:
          # Cloudflare Tunnel control + data planes. Uses QUIC (UDP/7844) by
          # default with TCP/7844 fallback. Connects to many CF edge IPs —
          # `toEntities: [world]` is the standard pattern here; CF's edge
          # IP pool rotates and FQDN matching is unreliable for these
          # connect-by-IP control endpoints. Also include 443/TCP for HTTP/2
          # fallback transport mode and discovery (TUNNEL_TRANSPORT_PROTOCOL
          # in helmrelease is `quic`, but cloudflared may use HTTPS for
          # tunnel registration / config fetch).
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "7844"
                    protocol: TCP
                  - port: "7844"
                    protocol: UDP
                  - port: "443"
                    protocol: TCP
          # Tunnel origin — cloudflared proxies inbound CF traffic to the
          # `external` envoy data plane via the in-cluster Service
          # (https://external.network.svc.cluster.local:443 → pod :10443).
          # Cilium L4 matches the pod targetPort (10443), not the svc port
          # (443) — see project_cilium_l4_port_targetport.md. This is an
          # intra-namespace flow but envoy data planes get caught by their
          # own pod selector under default-deny, so an explicit allow here
          # plus a matching ingress on envoy-proxy-allow is the safe pattern.
          # Baseline allow-intra-namespace covers it but be explicit so
          # this rule is greppable.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "10443"
                    protocol: TCP
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 30s
