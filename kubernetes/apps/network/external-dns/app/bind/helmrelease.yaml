---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-bind
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m

  install:
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  values:
    defaultPodOptions:
      automountServiceAccountToken: true
    controllers:
      external-dns-bind:
        pod:
          priorityClassName: system-cluster-critical

          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true

        annotations:
          reloader.stakater.com/auto: "true"

        serviceAccount:
          identifier: *app

        strategy: Recreate

        containers:
          app:
            image:
              repository: registry.k8s.io/external-dns/external-dns
              tag: v0.23.0@sha256:1854499e2b08cee47c40a08e356bff20dcb192dbcfde8378fc3f900f12cad5a3
            args:
              - --domain-filter=${SECRET_DOMAIN}
              - --interval=1m
              - --rfc2136-min-ttl=60s
              - --log-format=text
              - --log-level=debug
              - --metrics-address=:7979
              - --policy=sync
              - --provider=rfc2136
              - --registry=txt
              - --source=crd
              - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
              - --crd-source-kind=DNSEndpoint
              - --source=service
              - --source=gateway-httproute
              # - --source=gateway-tlsroute
              - --txt-owner-id=homelab
              - --txt-prefix=k8s.
            env:
              EXTERNAL_DNS_RFC2136_HOST: 192.168.1.1
              EXTERNAL_DNS_RFC2136_PORT: "53"
              EXTERNAL_DNS_RFC2136_TSIG_AXFR: "true"
              EXTERNAL_DNS_RFC2136_TSIG_KEYNAME: externaldns-key
              EXTERNAL_DNS_RFC2136_TSIG_SECRET_ALG: hmac-sha256
              EXTERNAL_DNS_RFC2136_ZONE: ${SECRET_DOMAIN}
            envFrom:
              - secretRef:
                  name: external-dns-bind-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 7979
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
            resources:
              # Bumped 140M → 256M after observed peak hit 135M (96%
              # of the previous limit). Memory pressure was stalling
              # the Go GC enough that RFC2136 calls to brain:53 dialed
              # tcp-timeout, external-dns treats that as fatal and
              # exits → kubelet restart → on the next sync the orphan
              # ownership TXT makes external-dns skip republishing the
              # actual CNAME. The langfuse half-state on 2026-05-20
              # was a symptom of this loop.
              requests:
                cpu: 10m
                memory: 256M
              limits:
                memory: 256M
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
              readOnlyRootFilesystem: true

    serviceAccount:
      external-dns-bind: {}

    service:
      app:
        controller: external-dns-bind
        ports:
          http:
            port: *port

    externalSecrets:
      external-dns-bind:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: external-dns-bind-secret
          template:
            engineVersion: v2
            data:
              EXTERNAL_DNS_RFC2136_TSIG_SECRET: "{{ .BIND_MAIN_RNDC_KEY }}"
        dataFrom:
          - extract:
              key: bind
    networkpolicies:
      allow:
        type: cilium
        forceRename: external-dns-bind-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: external-dns-bind
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        # Ingress :7979 (metrics) covered by baseline allow-monitoring-scrape
        # + allow-host-probes.
        egress:
          # bind9 on the home router (brain, 192.168.1.1) — RFC2136 dynamic
          # DNS updates + AXFR zone transfers (TSIG signed). Both TCP and
          # UDP/53 — small updates ride UDP, AXFR forces TCP. CIDR rule
          # because brain is the home router (host-network identity, not a
          # k8s pod), and Cilium's `kube-apiserver` entity matcher won't
          # cover non-cluster LAN hosts.
          - toCIDR:
              - 192.168.1.1/32
            toPorts:
              - ports:
                  - port: "53"
                    protocol: TCP
                  - port: "53"
                    protocol: UDP

    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s

  uninstall:
    keepHistory: false
