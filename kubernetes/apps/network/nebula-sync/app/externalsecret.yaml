---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# nebula-sync needs each Pi-hole's v6 admin web password (full API access, incl.
# gravity). The values embed the target IP + password in nebula-sync's own format:
#   PRIMARY  = http://192.168.6.66|<beast Pi-hole admin password>
#   REPLICAS = http://10.20.20.2|<brain Pi-hole admin password>
# Rob must create a 1Password item named `nebula-sync` (Kubernetes vault) with:
#   - field `primary`  = http://192.168.6.66|<beast admin pw>   (beast's existing pw)
#   - field `replicas` = http://10.20.20.2|<brain admin pw>     (brain's NEW strong pw,
#       the same value used for WEBPASSWORD in the brain pihole quadlet)
# Keep SYNC_CONFIG_* off (see cronjob.yaml) so the primary's weaker password is
# never pushed onto the replica.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nebula-sync
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nebula-sync-secret
  data:
    - secretKey: PRIMARY
      remoteRef:
        key: nebula-sync
        property: primary
    - secretKey: REPLICAS
      remoteRef:
        key: nebula-sync
        property: replicas
