---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# nebula-sync needs each Pi-hole's v6 admin web password (full API access, incl.
# gravity). The values embed the target + password in nebula-sync's own format;
# REPLICAS is a COMMA-SEPARATED list, one entry per replica:
#   PRIMARY  = http://192.168.6.66|<beast Pi-hole admin password>
#   REPLICAS = http://10.20.20.2|<brain pw>,http://pihole.network.svc.cluster.local|<cluster pw>
# Rob must maintain the 1Password item `nebula-sync` (Kubernetes vault) with:
#   - field `primary`  = http://192.168.6.66|<beast admin pw>   (beast's existing pw)
#   - field `replicas` = http://10.20.20.2|<brain pw>,http://pihole.network.svc.cluster.local|<cluster pw>
#   - field `cluster_password` = <cluster pw>   (also consumed by the pihole app's
#       ExternalSecret → FTLCONF_webserver_api_password; same value as above)
# Keep SYNC_CONFIG_* off (see cronjob.yaml) so the primary's weaker password is
# never pushed onto a replica.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nebula-sync
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nebula-sync-secret
  data:
    - secretKey: PRIMARY
      remoteRef:
        key: nebula-sync
        property: primary
    - secretKey: REPLICAS
      remoteRef:
        key: nebula-sync
        property: replicas
