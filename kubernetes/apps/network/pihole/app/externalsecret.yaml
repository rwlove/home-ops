---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# The cluster Pi-hole needs its own v6 admin/API password. It gates the web UI
# and the API that nebula-sync uses to push gravity — it never gates DNS
# filtering. SYNC_CONFIG_* are OFF in nebula-sync, so this password is never
# clobbered by (or copied from) the beast/brain instances.
#
# Rob must add ONE field to the existing 1Password item `nebula-sync`
# (Kubernetes vault):
#   - field `cluster_password` = <a NEW strong password for THIS instance>
# and must APPEND this instance to that item's existing `replicas` field so
# nebula-sync targets it too (see nebula-sync/app/externalsecret.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pihole
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pihole-secret
  data:
    - secretKey: FTLCONF_webserver_api_password
      remoteRef:
        key: nebula-sync
        property: cluster_password
