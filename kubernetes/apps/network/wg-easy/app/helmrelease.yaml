---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app wg-easy
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      wg-easy:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/wg-easy/wg-easy
              tag: "15@sha256:0e7bc9d34e86ddcaa92bc700d4d7dc9b33291dbc07ac8d13382f7c2095f949ec"

            command:
              - /bin/sh
              - -c
              - |
                ln -sf /usr/sbin/iptables-nft /etc/alternatives/iptables
                ln -sf /usr/sbin/ip6tables-nft /etc/alternatives/ip6tables
                exec /usr/local/bin/docker-entrypoint.sh node server/index.mjs

            env:
              INIT_ALLOWED_IPS: "192.168.0.0/16, 10.45.0.0/24"
              INIT_DNS: 192.168.1.1
              INIT_ENABLED: "true"
              INIT_HOST: vpn.${SECRET_DOMAIN}
              INIT_IPV4_CIDR: 10.99.0.0/24
              INIT_PERSISTENT_KEEPALIVE: "25"
              INIT_PORT: &wgPort 51820
              INIT_USERNAME: admin
              PORT: &uiPort 51821

            envFrom:
              - secretRef:
                  name: wg-easy-secret

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *uiPort
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness: *probes
              startup:
                enabled: false

            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

            securityContext:
              privileged: true
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${SVC_WG_EASY_ADDR}
        controller: wg-easy
        externalTrafficPolicy: Cluster
        ports:
          wireguard:
            port: *wgPort
            protocol: UDP
      web:
        type: ClusterIP
        controller: wg-easy
        ports:
          http:
            port: *uiPort

    route:
      web:
        annotations:
          glance/name: "WireGuard Easy"
          glance/show: "true"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/wireguard.png"
          glance/id: "Network"
        hostnames:
          - "wg-easy.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: web
                port: *uiPort
    persistence:
      config:
        existingClaim: wg-easy-config-pvc
        globalMounts:
          - path: /etc/wireguard
    externalSecrets:
      wg-easy:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: wg-easy-secret
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              INIT_PASSWORD_HASH: "{{ .PASSWORD_HASH }}"
        dataFrom:
          - extract:
              key: wg-easy
    networkpolicies:
      allow:
        type: cilium
        forceRename: wg-easy-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: wg-easy
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # WireGuard listener — UDP/51820 from anywhere (this IS the only
          # OOB access path to the cluster per memory `feedback_vpn_gateway_
          # migrations_lan_only.md`; over-restricting risks locking the
          # operator out of remote management). LoadBalancer service routes
          # external WG peers (mobile, laptop) here.
          - fromEntities:
              - world
              - cluster
              - host
              - remote-node
            toPorts:
              - ports:
                  - port: "51820"
                    protocol: UDP
          # Web UI :51821 via envoy `internal` Gateway (vpn.${SECRET_DOMAIN}
          # is published on the internal LB).
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "51821"
                    protocol: TCP
        egress:
          # WG peers terminate inside the pod and their decapsulated packets
          # are forwarded into the cluster + LAN (admin connects from phone
          # over WG, hits HA/Plex/etc.). The set of destinations is broad
          # by design — a VPN gateway needs to reach everywhere a normal
          # client could. Permit cluster + host + remote-node + world.
          - toEntities:
              - cluster
              - host
              - remote-node
              - world
