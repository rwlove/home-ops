---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app whoami
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      whoami:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
        annotations:
          reloader.stakater.com/auto: "true"

        type: statefulset

        containers:
          app:
            image:
              repository: ghcr.io/traefik/whoami
              tag: v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
            args: ["--port=8080"]
            resources:
              requests:
                cpu: 20m
                memory: 80M
              limits:
                memory: 80M
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: whoami
        ports:
          http:
            port: &httpPort 8080

    route:
      app:
        annotations:
          glance/name: "Who Am I?"
          glance/show: "true"
          # glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/cilium.png"
          glance/id: "Network"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort
    networkpolicies:
      allow:
        type: cilium
        forceRename: whoami-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: whoami
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Test echo server — only useful path is envoy → whoami:8080 for
          # debugging HTTPRoute / Gateway connectivity. Permit `cluster` so
          # ad-hoc `curl` from a debug pod in another ns also works.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          - fromEntities:
              - cluster
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        # No egress needed beyond baseline (DNS, intra-ns).
