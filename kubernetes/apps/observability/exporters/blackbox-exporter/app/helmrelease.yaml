---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app blackbox-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter

  interval: 30m
  values:
    # NOTE: `allowIcmp: true` was removed — the chart has no such key
    # (its documented ICMP switch is securityContext.capabilities.add:
    # ["NET_RAW"]). It was silently ignored, yet ICMP probing works:
    # the `devices` job uses the icmp module and probe_success is 1 for
    # ~70 targets live. So this was a no-op, not a broken prober — do
    # not "restore" it by adding NET_RAW without evidence it's needed.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

    config:
      modules:
        http_2xx:
          http:
            follow_redirects: true
            ip_protocol_fallback: false
            preferred_ip_protocol: "ip4"
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          prober: http
          timeout: 5s
        icmp:
          icmp:
            ip_protocol_fallback: false
            preferred_ip_protocol: "ip4"
          prober: icmp
          timeout: 4s
        # Synthetic embed prober for ollama-spark. POSTs a small input
        # against bge-m3 and validates a 200 with an "embeddings" key
        # in the body. 30 s timeout accommodates cold model load (bge-m3
        # eviction is possible under OLLAMA_MAX_LOADED_MODELS=3). Probe
        # CR at probes.yaml; replaces the DCGM power-draw heuristic in
        # ollama-spark's SparkOllamaWedged rule.
        ollama_embed:
          http:
            body: |-
              {"model":"bge-m3","input":"prober heartbeat"}
            fail_if_body_not_matches_regexp:
              - "\"embeddings\""
            headers:
              Content-Type: application/json
            method: POST
            preferred_ip_protocol: "ip4"
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            valid_status_codes: [200]
          prober: http
          timeout: 30s
        # Synthetic embed prober for tei-embed-spark, the TEI embedder that
        # took over RAG embeddings from ollama-spark on 2026-07-25. Sister
        # of ollama_embed, but against the OpenAI surface (/v1/embeddings),
        # so the success assertion is the OpenAI response shape ("data")
        # rather than ollama's ("embeddings").
        #
        # Shorter timeout than ollama_embed (10s vs 30s): TEI loads its one
        # model at startup and never evicts it, so there is no cold-load
        # case to absorb — a slow response here is a real fault, not a
        # warm-up. Keeping 30s would just delay detection.
        tei_embed:
          http:
            body: |-
              {"model":"bge-m3","input":"prober heartbeat"}
            fail_if_body_not_matches_regexp:
              - "\"data\""
            headers:
              Content-Type: application/json
            method: POST
            preferred_ip_protocol: "ip4"
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            valid_status_codes: [200]
          prober: http
          timeout: 10s
        # Generation prober for Frigate's GenAI VLM on the P40. Serves two
        # purposes at once, exactly as ollama_embed does for bge-m3: it is
        # the wedge detector AND the keep-warm heartbeat that holds
        # qwen2.5vl:3b resident, so Frigate's descriptions run at ~1.5s
        # instead of the ~38s cold-load path.
        #
        # Deliberately TEXT-ONLY. A vision request would mean inlining a
        # ~95 KB base64 image into these chart values, and it buys nothing:
        # ollama loads the vision projector as part of the runner
        # (`load_hparams: projector: qwen2.5vl_merger` appears even on a
        # text-only load), so a text prompt keeps the whole model warm.
        #
        # 45s timeout absorbs a genuine cold load; warm calls return in
        # about a second. num_predict=1 keeps the generated work trivial —
        # the point is residency, not output.
        ollama_generate:
          http:
            body: |-
              {"model":"qwen2.5vl:3b","prompt":"ping","stream":false,"options":{"num_predict":1}}
            fail_if_body_not_matches_regexp:
              - "\"response\""
            headers:
              Content-Type: application/json
            method: POST
            preferred_ip_protocol: "ip4"
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            valid_status_codes: [200]
          prober: http
          timeout: 45s
        # Synthetic-decode prober for vllm-driver-spark, the Qwen3.6-35B-A3B
        # reasoning/driver LLM on the Spark. POSTs a 1-token chat completion
        # and asserts the OpenAI response shape ("choices"). This is the
        # wedge detector the endpoint lacked: vLLM returns /health=200 while
        # the EngineCore spin-loops (GPU pinned 96%, decode frozen,
        # num_requests_running stuck) — /health cannot see it, a real decode
        # can. Sister of ollama_generate (also a 1-token generation), but
        # against the OpenAI /v1/chat/completions surface, so the success
        # assertion is the OpenAI shape ("choices") rather than ollama's
        # ("response"). The model id is the served-model-name invariant
        # (qwen3.6-35b-a3b), stable across image/model bumps.
        #
        # 40s timeout absorbs a cold CUDA-graph warm-up after a restart
        # (weights load from the cache PVC, then graphs compile); a warm
        # decode returns in well under a second. The Probe CR (probes.yaml)
        # pairs scrapeTimeout 45s > this 40s so a cold load surfaces as a
        # slow success, not a scrape error (same rule as ollama-vlm-warm).
        vllm_completion:
          http:
            body: |-
              {"model":"qwen3.6-35b-a3b","messages":[{"role":"user","content":"ping"}],"max_tokens":1,"stream":false}
            fail_if_body_not_matches_regexp:
              - "\"choices\""
            headers:
              Content-Type: application/json
            method: POST
            preferred_ip_protocol: "ip4"
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            valid_status_codes: [200]
          prober: http
          timeout: 40s
        # Tool-call prober for vllm-driver-spark. The wedge probe above uses
        # max_tokens:1 and so never exercises the --tool-call-parser qwen3_xml
        # path — but a silent parser regression (leaking tool calls into plain
        # text instead of returning tool_calls, e.g. after an image/model bump
        # to a build that defaults to a wrong parser) is the failure mode most
        # likely to break Hermes' agentic execution loop. This POSTs a request
        # with a tools array and asserts the response carries a "tool_calls"
        # field. tool_choice auto + a clear prompt reliably elicits the call.
        #
        # 30s timeout: this is a reasoning model, so it spends ~200 tokens
        # thinking before emitting the call (~238 completion tokens total,
        # ~8-12s warm). Runs at a low 30-min cadence (Probe CR) — the parser
        # only breaks on a config/image change, not intermittently, so this is
        # a regression canary, not a hot-path detector.
        vllm_toolcall:
          http:
            body: |-
              {"model":"qwen3.6-35b-a3b","messages":[{"role":"user","content":"Get the current weather for Paris using the available tool."}],"tools":[{"type":"function","function":{"name":"get_weather","description":"Get weather for a city","parameters":{"type":"object","properties":{"city":{"type":"string"}},"required":["city"]}}}],"tool_choice":"auto","max_tokens":1024}
            fail_if_body_not_matches_regexp:
              - "\"tool_calls\""
            headers:
              Content-Type: application/json
            method: POST
            preferred_ip_protocol: "ip4"
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            valid_status_codes: [200]
          prober: http
          timeout: 30s
        tcp_connect:
          prober: tcp
          tcp:
            preferred_ip_protocol: ipv4
          timeout: 5s
    fullnameOverride: blackbox-exporter
    image:
      registry: quay.io

    podAnnotations:
      reloader.stakater.com/auto: "true"

    podSecurityContext:
      sysctls:
        - name: net.ipv4.ping_group_range
          value: "0 2147483647"

    prometheusRule:
      additionalLabels:
        app: prometheus-operator
        release: prometheus
      enabled: true
      rules:
        # NB: the two BlackboxSslCertificate* alerts were removed — no
        # probe uses an https module, so probe_ssl_earliest_cert_expiry
        # was never populated and the rules could never fire. Cert
        # expiry is handled by cert-manager. Re-add an https_2xx module
        # + cert-bearing targets first if SSL monitoring is wanted here.
        # Infrastructure reachability — storage NFS path (brain/beast/
        # security-storage:2049) and the two ollama embed heartbeats.
        # These are genuinely page-worthy: a sustained failure means a
        # storage or inference-path outage. The ollama embed probe is
        # intentionally covered here at critical (the OllamaWedged rule in
        # kubernetes/apps/ai/ollama adds runbook context on top of this).
        #
        # ollama-spark-embed removed 2026-07-26 with the service. A
        # decommissioned job left in this matcher would NOT error — its
        # series simply stops existing and the regex quietly matches
        # nothing — so it rots silently. Prune matchers with the workload.
        - alert: BlackboxProbeFailed
          annotations:
            description: |-
              The host {{ $labels.instance }} is currently unreachable
          expr: probe_success{job=~"probe/observability/(nfs|ollama-embed)"} == 0
          for: 5m
          labels:
            severity: critical
        # Device reachability, split into two tiers by how each device
        # legitimately behaves (target lists live in probes.yaml):
        #
        #   strict  — infra that must page fast: UPS/iDRAC/workers, cameras,
        #             ratgdo, konnected, pool/radon/salt ESP devices,
        #             hass-voice, printer. `devices` probe, for:15m.
        #   sleepy  — nap-prone by design: Aqara WiFi presence (radio
        #             power-save), Kodi, Frameo, WiiM, roborock, WLED strips.
        #             `devices-sleepy` + `http` probes, for:12h — long enough
        #             to clear any normal off-cycle so a nap doesn't page,
        #             short enough to still catch a genuinely dead device.
        #
        # Both are warning (demoted from the old critical/5m that flooded the
        # surface — 14 devices fired criticals in one day). Storage stays
        # critical via the nfs TCP probe above; node-down is covered by the
        # Kube*NodeNotReady rules; and a sleepy device that truly dies is
        # also visible in Home Assistant, which tracks those entities more
        # accurately than ICMP. So nothing genuinely page-worthy is lost.
        - alert: BlackboxIoTDeviceUnreachable
          annotations:
            description: |-
              IoT/device {{ $labels.instance }} has been unreachable for 15m
          expr: probe_success{job="probe/observability/devices"} == 0
          for: 15m
          labels:
            severity: warning
        - alert: BlackboxSleepyDeviceUnreachable
          annotations:
            description: |-
              Sleepy device {{ $labels.instance }} has been unreachable for
              12h — longer than any normal sleep/off-cycle, so likely a real
              outage rather than a nap. HA entity availability is the
              authoritative liveness signal for these.
          expr: probe_success{job=~"probe/observability/(devices-sleepy|http)"} == 0
          for: 12h
          labels:
            severity: warning
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        add:
          - NET_RAW

      readOnlyRootFilesystem: true
    serviceMonitor:
      defaults:
        interval: 1m
        scrapeTimeout: 10s

      enabled: true
