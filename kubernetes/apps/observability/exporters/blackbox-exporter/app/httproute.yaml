---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blackbox-exporter
  # Hand-off to the chart-rendered route (next PR): prune-disabled keeps this
  # object when the file is removed; the Helm ownership metadata lets the
  # release adopt it in place (no route gap).
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    app.kubernetes.io/managed-by: Helm
  annotations:
    glance/name: "Blackbox Exporter"
    glance/show: "true"
    # glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/netdata.png"
    glance/id: "Observability"
    meta.helm.sh/release-name: blackbox-exporter
    meta.helm.sh/release-namespace: observability
spec:
  hostnames: ["blackbox.${SECRET_DOMAIN}"]
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: blackbox-exporter
          namespace: observability
          port: 9115
