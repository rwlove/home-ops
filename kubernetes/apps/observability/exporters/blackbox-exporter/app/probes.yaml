---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: devices
spec:
  # 2m cadence: the IoT unreachable alert is for:15m, so 1m granularity
  # buys nothing and 2m halves ICMP + DNS load across the target set.
  interval: 2m
  module: icmp
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - brother
        - ups-1500
        - ups-3000
        - ups-1500-mgmt
        - ups-3000-mgmt
        - idrac
        - ecowitt
        - thermostat
        - worker2-iot
        - worker3-iot
        - worker4-iot
        - worker5-iot
        - worker6-iot
        - worker7-iot
        - worker8-iot
        - worker2-security
        - worker3-security
        - worker4-security
        - worker5-security
        - worker6-security
        - worker7-security
        - worker8-security
        - security-storage
        - amcrest-frontyard
        - reolink-frontdoor
        - reolink-bush
        - amcrest-pool
        - reolink-backyard
        - hass-voice-familyroom
        - hass-voice-bedroom
        - hass-voice-gym
        - ratgdo-primary
        - ratgdo-secondary
        - bluetooth-proxy-wifi-1
        - bluetooth-proxy-wifi-2
        # - bt-scale
        # - birdcam
        # IOT VLAN 20 smart devices — ICMP reachability. HTTP servers are
        # probed via ICMP here (not the http_2xx probe) because most don't
        # return a clean 2xx on `/`; ICMP avoids false-down alerts.
        - refoss
        - droplet
        - shelly-radon
        - elfin-salt
        - pool-light
        - konnected
        - pool-controller
        - bathroom-mmwave

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: devices-sleepy
spec:
  # Nap-prone devices split out of `devices` so a long for:12h alert can
  # tolerate normal sleep instead of paging on it. These legitimately go
  # dark for minutes-to-hours as designed:
  #   - Aqara WiFi presence sensors power-save their radio when a room is
  #     idle (kitchen flapped 2727x over 14d — ICMP down ~48% of the time,
  #     yet presence detection works fine). ICMP is the wrong liveness
  #     signal for them; HA entity availability is authoritative.
  #   - Kodi boxes, Frameo frames, WiiM audio, and roborock vacuums power
  #     off / dock / roam.
  # The BlackboxSleepyDeviceUnreachable alert (for:12h) fires only when one
  # is dark longer than any normal off-cycle. Infra that must page fast
  # stays in `devices` (for:15m). Alert rules live in helmrelease.yaml.
  interval: 2m
  module: icmp
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - aquara-presense-kitchen
        - aquara-presense-office
        - aquara-presense-server-room
        - kodi-familyroom
        - kodi-gym
        - kodi-bedroom
        - frameo-familyroom
        - frameo-basement
        - wiim-pool
        - wiim-deck
        - wiim-yard
        - roborock-mainfloor
        - roborock-upstairs
        - roborock-basement

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: nfs
spec:
  module: tcp_connect
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - brain:2049
        - beast:2049
        - security-storage:2049

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: http
spec:
  # 2m cadence — same rationale as the `devices` probe above.
  # WLED strips get switched off in normal use, so this whole job rides the
  # sleepy alert tier (BlackboxSleepyDeviceUnreachable, for:12h), not the
  # strict 15m one. See helmrelease.yaml alert rules.
  interval: 2m
  module: http_2xx
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - wled-nightlight
        - wled-gym-1
        - wled-gym-3
        - wled-gym-4
        - wled-gym-5
        - wled-hyperion
        - wled-wallcontrol-left
        - wled-wallcontrol-right
        - wled-cabinet-1
        - wled-cabinet-2
        - wled-bar
        - wled-bush

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ollama-embed
spec:
  # Sister of ollama-spark-embed. Same module, different target —
  # this probes the P40 ollama on worker8 (serves ≤8b inference +
  # bge-m3 fallback per .agents/instructions/gpu-routing.md). Same
  # heartbeat side benefit: keeps bge-m3 warm during quiet windows.
  interval: 5m
  scrapeTimeout: 30s
  module: ollama_embed
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://ollama.ai.svc.cluster.local:11434/api/embed

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ollama-vlm-warm
spec:
  # Frigate's GenAI VLM (qwen2.5vl:3b) on the P40. Wedge detector AND
  # keep-warm heartbeat, the same dual role ollama-embed plays for bge-m3.
  #
  # 5m is chosen against OLLAMA_KEEP_ALIVE=30m, not independently: the
  # probe only holds the model resident while its cadence stays well
  # inside the TTL. If either value is changed, re-check the pair —
  # cadence > TTL means the model ages out between probes and every
  # Frigate description pays the ~38s cold load again.
  #
  # 50s scrapeTimeout against the module's 45s: the module must be the
  # thing that times out, so a cold load surfaces as a slow success
  # rather than a scrape error.
  interval: 5m
  scrapeTimeout: 50s
  module: ollama_generate
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://ollama.ai.svc.cluster.local:11434/api/generate

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: tei-embed-spark-embed
spec:
  # Wedge detector for tei-embed-spark, which took over RAG embeddings
  # from ollama-spark on 2026-07-25. Without this the new embedding path
  # — now serving Open WebUI RAG and LightRAG — has no liveness signal
  # beyond pod-Ready, and TEI can report Ready while failing requests.
  #
  # 1m interval (vs ollama's 5m): TEI has no model-eviction problem, so
  # the probe is not doing double duty as a keep-warm heartbeat and is
  # free to be purely a detector. A 1-min cadence cuts worst-case
  # detection latency on the RAG hot path without meaningful cost — the
  # request is ~10ms warm against a model that is always resident.
  interval: 1m
  scrapeTimeout: 15s
  module: tei_embed
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://tei-embed-spark.ai.svc.cluster.local:3000/v1/embeddings
