---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mqtt-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
    controllers:
      mqtt-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/kpetremann/mqtt-exporter
              tag: 1.12.1@sha256:dca3255f35310f6ceb80ed1de94eebd1fe9def7aacaec4107fe37cdaa9eb3be0
            env:
              MQTT_ADDRESS: emqx-headless.home.svc.cluster.local
              # MQTT_TOPIC: zigbee2mqtt/#
              MQTT_V5_PROTOCOL: true
              PROMETHEUS_PORT: &port 3321
              # ZIGBEE2MQTT_AVAILABILITY: true
            envFrom:
              - secretRef:
                  name: mqtt-exporter-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    externalSecrets:
      mqtt-exporter:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: mqtt-exporter-secret
          creationPolicy: Owner
          template:
            engineVersion: v2
            data:
              MQTT_USERNAME: "{{ .user_1_username }}"
              MQTT_PASSWORD: "{{ .user_1_password }}"
        dataFrom:
          - extract:
              key: emqx
    networkpolicies:
      allow:
        type: cilium
        forceRename: mqtt-exporter-allow
        # Explicit endpointSelector preserves the pre-inline selector
        # (app.kubernetes.io/name) instead of the chart's controller-derived
        # default, keeping the policy byte-identical across the migration.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: mqtt-exporter
        enableDefaultDeny:
          egress: false
          ingress: false
        egress:
          # emqx MQTT broker in home ns. Container env points at
          # `emqx-headless.home.svc.cluster.local`. Default MQTT TCP port
          # 1883 (no TLS) — verified container env is bare `MQTT_ADDRESS`
          # with no port (defaults to 1883).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: home
                  app.kubernetes.io/name: emqx
            toPorts:
              - ports:
                  - port: "1883"
                    protocol: TCP
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
