---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: prometheus-node-exporter
  interval: 30m
  values:
    fullnameOverride: node-exporter

    # The node-exporter binary's built-in default for mount-points-exclude
    # is narrow (dev|proc|run/credentials/.+|sys|var/lib/docker/.+|var/lib/containers/storage/.+).
    # It does NOT cover /var/lib/kubelet/pods/.+, so every pod's bind-mounts
    # (k8tz /etc/localtime subpath, local-volume bind-mounts) appear as
    # separate filesystems with the host's fill rate, triggering false
    # CephNodeDiskspaceWarning + HostOutOfDiskSpace alerts per pod.
    # Match the kube-prometheus-stack upstream default to suppress those.
    #
    # fuse(\..*)? added 2026-10-14: the Spark (spark.thesteamedcrab.com) runs
    # DGX OS's full Ubuntu desktop image (GNOME/snap/Firefox/Thunderbird, not
    # a headless server image), which keeps an xdg-document-portal FUSE mount
    # alive at /run/user/<uid>/doc (fstype "fuse.portal") whenever a desktop
    # session is active. The filesystem collector's default fs-types-exclude
    # only skips "fusectl" (the /sys/fs/fuse/connections control fs), not
    # actual "fuse.*"-mounted filesystems, so it ran statfs() against that
    # mount on every scrape. When the portal daemon stalls, that statfs()
    # blocks forever; each new Prometheus scrape piles on another blocked
    # goroutine until node-exporter's own --web.max-requests=40 limiter trips
    # and every request — including future scrapes — gets a permanent 503
    # ("Limit of concurrent requests reached (40)"). The pod stayed
    # Running/Ready throughout because the chart's liveness/readiness probes
    # hit path "/" (the landing page, which never touches collectors), not
    # "/metrics" — so kubelet saw a healthy pod while Prometheus saw
    # up{job="node-exporter",instance="spark.thesteamedcrab.com:9100"} == 0
    # for ~14 days, recovering only for the ~12h after the 10-08 OTA reboot
    # (clean start, portal mount not yet stuck) before re-wedging. Confirmed
    # live 2026-10-14: /metrics 503'd with that exact body from both outside
    # the node and via `kubectl exec ... wget http://localhost:9100/metrics`;
    # `/` returned 200. No other cluster node runs a desktop session or has
    # this mount class. Excluding fuse(\..*)? (not just "fusectl") keeps the
    # collector from ever calling statfs() on this or any future FUSE mount
    # on this host, which is the actual fix — see
    # reference_spark_node_exporter_fuse_portal_hang in memory for the full
    # investigation. Residual gap (not fixed here, flagged for
    # observability-operator): the "/" liveness/readiness probe masks *any*
    # future collector hang the same way; worth a separate look at either
    # probing "/metrics" or adding an alert on sustained
    # up{job="node-exporter"}==0.
    extraArgs:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run/credentials/.+|sys|var/lib/docker/.+|var/lib/containers/storage/.+|var/lib/kubelet/pods/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fuse(\..*)?|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$

    # hostNetwork MUST be true (also the chart default) or the network
    # collector reports the POD's netns, not the host's: every node showed
    # only eth0+lo with a ~253MB lifetime counter, so every per-node network
    # rate() read ~0. CPU/memory/disk were unaffected (hostPath /proc), which
    # is why this went unnoticed — the metric was silently WRONG, not missing,
    # so any node-network panel or alert would never fire. Found 2026-08-08
    # while trying to measure bandwidth during the source-controller outage.
    # dnsPolicy pairs with hostNetwork so the pod still resolves cluster DNS.
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet
    image:
      registry: quay.io
      repository: prometheus/node-exporter

    # RAPL collector needs to read /sys/class/powercap/intel-rapl:*/energy_uj,
    # mode 400 root-only on recent kernels (Platypus side-channel mitigation).
    # CAP_DAC_READ_SEARCH alone is insufficient: on a non-root UID the cap
    # lands in the bounding set but effective/permitted/ambient stay empty
    # (Linux capability model — needs file caps on the binary or the kernel
    # ambient set, neither of which the chart provides). Simplest fix is
    # runAsUser: 0. node-exporter mounts /proc, /sys, /root read-only so
    # root inside the container isn't a meaningful trust escalation.
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
    containerSecurityContext:
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    prometheus:
      monitor:
        enabled: true
        jobLabel: app.kubernetes.io/instance

        relabelings:
          - action: replace
            regex: (.*)
            replacement: $1
            sourceLabels:
              - __meta_kubernetes_pod_node_name
            targetLabel: kubernetes_node
          - action: replace
            regex: (.*)
            replacement: $1
            sourceLabels:
              - __meta_kubernetes_pod_node_name
            targetLabel: nodename
          - action: replace
            regex: (.*)
            replacement: $1:9100
            sourceLabels:
              - kubernetes_node
            targetLabel: instance

    resources:
      limits:
        memory: 100M

      requests:
        cpu: 23m
        memory: 100M
