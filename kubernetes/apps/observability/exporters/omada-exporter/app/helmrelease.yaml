---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app omada-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      omada-exporter:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: docker.io/rcooler/omada_exporter
              tag: 2.4.1@sha256:569b80a3f16904c47081a85d5b75782c80c65c516790686674cf069ceda94d61

            env:
              OMADA_PORT: &port 9202
              OMADA_INSECURE: "true"
              LOG_LEVEL: "info"

            envFrom:
              - secretRef:
                  name: omada-exporter-secret

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: false

            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: omada-exporter
        ports:
          http:
            port: *port

    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            # 5m, not 1m: rcooler/omada_exporter re-queries the Omada
            # controller's HTTPS API (brain:8043) on EVERY scrape, and this
            # controller (v6.2.14.11) leaks the server side of each closed
            # connection into CLOSE-WAIT. Those accumulate until Tomcat's
            # 8043 connector hits maxConnections and stops accepting →
            # OmadaControllerUnreachable + TargetDown (2026-08-01, 2026-09-01
            # ~1:13 PM ET). 1m churn saturated it in ~1 month; 5m cuts the
            # leak rate ~5x. This is a RATE-LIMITER, not the fix — the leak
            # is server-side and unfixable from here; the durable bound is a
            # scheduled omada.service restart on brain. See
            # rwlove/lovenet-network-configuration#51.
            interval: 5m
            scrapeTimeout: 30s
