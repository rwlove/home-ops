---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app smartctl-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: prometheus-smartctl-exporter
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    config:
      # Auto-scan instead of a hard-coded device list. The prior static
      # list (/dev/sda-sdg, /dev/nvme{0,1,2}n1) assumed every node in
      # the DaemonSet has the same 7-SCSI + 3-NVMe inventory. The
      # cluster mixes physical hosts (varying SATA/NVMe counts) with
      # beast-hosted KVM VM nodes whose only disk is /dev/vdb — a
      # virtio block device with no SMART/IDENTIFY path. Every node ran
      # the full static list regardless of fit, so nodes missing an
      # entry logged a per-device ERROR every scrape interval:
      #   Smartctl open device: /dev/sdX failed: No such device
      #   /dev/nvmeXn1 ... did not return an IDENTIFY DEVICE structure
      # The exporter auto-scans when no explicit `devices` are given;
      # device_exclude keeps loop/dm/ram/optical/virtio-block devices
      # out of the scan so it doesn't grow new noise on the VM nodes.
      device_exclude: ^/dev/(loop|dm-|ram|sr|vd)
    fullnameOverride: *app
    image:
      repository: ghcr.io/joryirving/smartctl_exporter
      tag: 0.14.0@sha256:04bf03f15e28330f0fc5ce561e97c3cb3cd0fce22e51a141eccee160c6e736f5
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    prometheusRules:
      enabled: false
    serviceMonitor:
      enabled: true
      relabelings:
        - action: labeldrop
          regex: (pod)
        # - action: replace
        #   separator: ':'
        #   # regex: \b((?:sd[a-z]+|nvme\d+n\d+))\b|\b((?:cp\d+|work\d+|n\d{3}-\d{2}))\b
        #   # replacement: "$1: $2"
        #   sourceLabels:
        #   - device
        #   - __meta_kubernetes_endpoint_node_name
        #   targetLabel: device
        - action: replace
          regex: (.*)
          replacement: $1.${SECRET_DOMAIN}
          sourceLabels:
            - __meta_kubernetes_endpoint_node_name
          targetLabel: instance
  uninstall:
    keepHistory: false
