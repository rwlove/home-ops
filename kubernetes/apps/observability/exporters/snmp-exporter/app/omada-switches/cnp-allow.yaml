---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: snmp-exporter-omada-switches-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: snmp-exporter-omada-switches
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    # SNMP polling of the Omada switches on the 192.168.5.0/24
    # management subnet (switch-core .61, switch-10 .60, switch-poe .48,
    # switch-familyroom .62, switch-basement .2, switch-office .3). LAN
    # hosts, not cluster identities → `world`. SNMP is UDP port 161.
    - toEntities:
        - world
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "161"
              protocol: UDP
