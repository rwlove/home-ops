---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omada-switches-snmp-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: omada-switches-snmp-auth
    template:
      data:
        # snmp_exporter auth block, merged at runtime with the image's
        # built-in module config. Only the MD5 auth password is secret;
        # username/level/protocol match the switch SNMP page and are not
        # sensitive. Password comes from the existing 1Password `omada`
        # item, field `snmpv3_auth_password`.
        snmp.yaml: |
          auths:
            omada_v3:
              version: 3
              username: admin
              security_level: authNoPriv
              auth_protocol: MD5
              password: "{{ .snmpv3_auth_password }}"
  dataFrom:
    - extract:
        key: omada
