---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: snmp-exporter-omada-switches-rules
spec:
  groups:
    - name: snmp-exporter-omada-switches.rules
      rules:
        - alert: SnmpExporterOmadaSwitchesAbsent
          annotations:
            description: The Omada switch SNMP exporter job has disappeared from Prometheus target discovery.
            summary: Omada switch SNMP exporter is down.
          expr: absent(up{job=~".*snmp-exporter-omada-switches.*"})
          for: 5m
          labels:
            severity: critical
        - alert: SnmpExporterOmadaSwitchTargetDown
          annotations:
            description: SNMP polling of switch {{ $labels.target }} ({{ $labels.instance }}) has been failing for 15m; its per-port error and discard counters are unreadable.
            summary: Omada switch SNMP target {{ $labels.target }} is not responding.
          # 15m debounce also covers the initial rollout window before
          # SNMP is enabled on the switches and the 1P auth field exists.
          expr: up{job=~".*snmp-exporter-omada-switches.*"} == 0
          for: 15m
          labels:
            severity: warning
        - alert: SwitchPortErrors
          annotations:
            description: Port {{ $labels.ifName }} on {{ $labels.target }} is logging {{ $value | humanize }} RX+TX interface errors/s. CRC/frame errors point at a bad cable, SFP/DAC, or duplex mismatch — this is the fault class behind the 2026-09-27 inter-switch packet-loss incident.
            summary: Switch port {{ $labels.target }}/{{ $labels.ifName }} is accumulating interface errors.
          # `and on (target, ifName) ifOperStatus == 1` guards against a
          # link-down port emitting phantom error counters (a down,
          # never-cabled port paged on a spurious burst 2026-09-28).
          expr: |
            (
              rate(ifInErrors{job=~".*snmp-exporter-omada-switches.*"}[5m])
              + rate(ifOutErrors{job=~".*snmp-exporter-omada-switches.*"}[5m]) > 1
            )
            and on (target, ifName)
            ifOperStatus{job=~".*snmp-exporter-omada-switches.*"} == 1
          for: 10m
          labels:
            severity: warning
        - alert: SwitchPortDiscards
          annotations:
            description: Port {{ $labels.ifName }} on {{ $labels.target }} is discarding {{ $value | humanize }} packets/s (RX+TX). Sustained discards indicate congestion or buffer exhaustion on that link.
            summary: Switch port {{ $labels.target }}/{{ $labels.ifName }} is discarding packets.
          # `and on (target, ifName) ifOperStatus == 1` guards against a
          # link-down port emitting phantom discard counters (a down,
          # never-cabled port paged on a spurious burst 2026-09-28).
          expr: |
            (
              rate(ifInDiscards{job=~".*snmp-exporter-omada-switches.*"}[5m])
              + rate(ifOutDiscards{job=~".*snmp-exporter-omada-switches.*"}[5m]) > 5
            )
            and on (target, ifName)
            ifOperStatus{job=~".*snmp-exporter-omada-switches.*"} == 1
          for: 15m
          labels:
            severity: warning
        - alert: SwitchPortLinkSpeedDegraded
          annotations:
            description: Port {{ $labels.ifName }} on {{ $labels.target }} is now linked at {{ $value }} Mbps, below its speed an hour ago. A link renegotiated to a lower rate (marginal cable/optic) can inflate latency across the fabric.
            summary: Switch port {{ $labels.target }}/{{ $labels.ifName }} renegotiated to a lower link speed.
          # ifHighSpeed is in Mbps. Fire when an up port's speed dropped
          # versus 1h ago; ignore down ports (speed 0).
          expr: |
            (
              ifHighSpeed{job=~".*snmp-exporter-omada-switches.*"} offset 1h
              > ifHighSpeed{job=~".*snmp-exporter-omada-switches.*"}
            )
            and ifHighSpeed{job=~".*snmp-exporter-omada-switches.*"} > 0
          for: 10m
          labels:
            severity: warning
