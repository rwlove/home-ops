---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kromgo-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kromgo
  enableDefaultDeny:
    egress: false
    ingress: false
  ingress:
    # HTTPRoute on external gateway → kromgo:8080 (no oauth2-proxy,
    # exposes a curated subset of Prometheus queries publicly for
    # external dashboards).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # glance (collab) cluster-vitals widget, server-side fetched. Goes
    # pod-to-pod rather than back out through the external gateway, so
    # it needs its own rule — the envoy rule above does not cover it.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: collab
            app.kubernetes.io/name: glance
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  # Egress: prometheus query API at
  # `kube-prometheus-stack-prometheus.observability.svc:9090` —
  # intra-ns, covered by baseline allow-intra-namespace.
