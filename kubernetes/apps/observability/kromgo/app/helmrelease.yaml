---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kromgo
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    controllers:
      kromgo:
        pod:
          securityContext:
            runAsGroup: 568
            runAsNonRoot: true
            runAsUser: 568
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: kromgo

        annotations:
          reloader.stakater.com/auto: "true"

        # Two replicas with topology spread expresses HA intent, but
        # without a PDB a node drain can take both at once.
        podDisruptionBudget:
          minAvailable: 1

        replicas: 2
        strategy: RollingUpdate

        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/kashalls/kromgo
              tag: v0.10.0@sha256:965ecc92d68dc1a4a969397855367bbc70da03227a941ea607b73bb7e0b78fd6
            env:
              PROMETHEUS_URL: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
            resources:
              requests:
                cpu: 15m
                memory: 64M
              limits:
                memory: 64M

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: kromgo
        ports:
          http:
            port: &httpPort 8080

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *httpPort

    persistence:
      config-file:
        type: configMap
        name: kromgo-configmap
        globalMounts:
          - path: /kromgo/config.yaml
            subPath: config.yaml
            readOnly: true
    networkpolicies:
      allow:
        type: cilium
        forceRename: kromgo-allow
        # Explicit endpointSelector preserves the pre-inline selector
        # (app.kubernetes.io/name) instead of the chart's controller-derived
        # default, keeping the policy byte-identical across the migration.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: kromgo
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # HTTPRoute on external gateway → kromgo:8080 (no oauth2-proxy,
          # exposes a curated subset of Prometheus queries publicly for
          # external dashboards).
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          # glance (collab) cluster-vitals widget, server-side fetched. Goes
          # pod-to-pod rather than back out through the external gateway, so
          # it needs its own rule — the envoy rule above does not cover it.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: collab
                  app.kubernetes.io/name: glance
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
        # Egress: prometheus query API at
        # `kube-prometheus-stack-prometheus.observability.svc:9090` —
        # intra-ns, covered by baseline allow-intra-namespace.
