---
# yaml-language-server: $schema=https://raw.githubusercontent.com/home-operations/kromgo/0.16.4/config.schema.json
# Thresholds reproduce the v0.10.0 inclusive integer ranges (green 0-35,
# orange 36-75, red 76+), so `<=` rather than colorScale's strict `<`.
badges:
  - id: kubernetes_version
    query: kubernetes_build_info{service="kubernetes"}
    valueExpr: labels[?"git_version"].orValue("unknown")

  - id: cluster_node_count
    query: count(count by (node) (kube_node_status_condition{condition="Ready"}))
    valueExpr: humanizeFloat(result)
    colorExpr: '"blue"'

  - id: cluster_pod_count
    query: sum(kube_pod_status_phase{phase="Running"})
    valueExpr: humanizeFloat(result)
    colorExpr: '"blue"'

  - id: cluster_cpu_usage
    query: round(avg(instance:node_cpu_utilisation:rate5m) * 100, 0.1)
    valueExpr: humanizeFloat(result) + "%"
    colorExpr: 'result <= 35 ? "green" : result <= 75 ? "orange" : "red"'

  - id: cluster_memory_usage
    query: round(sum(node_memory_MemTotal_bytes{} - node_memory_MemAvailable_bytes{}) / sum(node_memory_MemTotal_bytes{}) * 100, 0.1)
    valueExpr: humanizeFloat(result) + "%"
    colorExpr: 'result <= 35 ? "green" : result <= 75 ? "orange" : "red"'

  - id: cluster_age_days
    query: round((time() - max(kube_node_created) ) / 86400)
    valueExpr: humanizeFloat(result) + "d"
    colorExpr: '"blue"'

  - id: cluster_power_usage
    title: Power
    query: round(sum(upsAdvOutputActivePower), 0.1)
    valueExpr: humanizeFloat(result) + "w"
    colorExpr: 'result <= 400 ? "green" : result <= 750 ? "orange" : "red"'

  - id: cluster_alert_count
    title: Alerts
    query: grafana_alerting_alertmanager_alerts{state="active"}
    valueExpr: humanizeFloat(result)
    colorExpr: 'result == 0.0 ? "green" : "red"'
