---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-ops-view
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  values:
    defaultPodOptions:
      automountServiceAccountToken: true

    controllers:
      kube-ops-view:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
        serviceAccount:
          identifier: kube-ops-view

        type: statefulset

        containers:
          app:
            image:
              repository: docker.io/hjacobs/kube-ops-view
              tag: 23.5.0@sha256:a4fae38f93d7e0475b2bcef28c72a65d39d824daed22b26c4cef0a6da89aac7e
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 384Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault


    service:
      app:
        controller: kube-ops-view
        ports:
          http:
            port: &httpPort 8080

    route:
      app:
        annotations:
          glance/name: "Kube Ops View"
          glance/show: "true"
          # glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/netdata.png"
          glance/id: "Network"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - kind: Service
                name: kube-ops-view
                port: *httpPort
    serviceAccount:
      kube-ops-view: {}
    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
    networkpolicies:
      allow:
        type: cilium
        forceRename: kube-ops-view-allow
        #
        # Cilium 1.19 requires at least one ingress or egress rule when
        # endpointSelector is set — empty rules with enableDefaultDeny:false
        # failed schema validation and never applied. Same bug class as the
        # goldilocks-allow fix (PR #11597).
        #
        # Explicit endpointSelector preserves the pre-inline selector
        # (app.kubernetes.io/name) instead of the chart's controller-derived
        # default, keeping the policy byte-identical across the migration.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: kube-ops-view
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # HTTPRoute on internal gateway → kube-ops-view:8080. Auth is
          # enforced at the gateway by the extAuth SecurityPolicy
          # (securitypolicy.yaml) — the oauth2-proxy hop was retired in the
          # #12767 pilot.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
