---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-alert
spec:
  groups:
    - name: flux.rules
      rules:
        - alert: FluxComponentAbsent
          annotations:
            summary: Flux component has disappeared from Prometheus target discovery.
          expr: |
            absent(up{job=~".*flux-system.*"} == 1)
          for: 15m
          labels:
            severity: critical
        - alert: FluxHelmReleaseStalled
          annotations:
            summary: >-
              HelmRelease {{ $labels.exported_namespace }}/{{ $labels.name }} is not Ready
              (reason: {{ $labels.reason }}) for more than 10 minutes. This also catches a
              release that Flux auto-rolled-back after a failed install/upgrade: rollback
              reports Ready=False with reason RollbackSucceeded/RollbackFailed, so the
              target chart revision never actually took even though the release recovered.
          expr: |
            max(flux_resource_info{kind="HelmRelease",ready="False"}) by (exported_namespace, name, reason)
          for: 10m
          labels:
            severity: critical
        - alert: FluxReconciliationFailure
          annotations:
            summary: >-
              {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }}
              reconciliation has been failing for more than 15 minutes.
          expr: |
            max(flux_resource_info{ready="False",suspended="False",kind!="HelmRelease"}) by (exported_namespace, name, kind) == 1
          for: 15m
          labels:
            severity: critical
