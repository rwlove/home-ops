---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    groupBy: ["alertname", "job"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 6h
    receiver: "pushover"
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            value: Watchdog
            matchType: "="
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: "="
      # KubePodPendingBrief (warning) is intentionally Grafana-only for
      # trend visibility — it must NOT page. The inhibitRule below can't
      # suppress it (that requires the same alertname as the critical, and
      # the critical is KubePodStuckPending), so route it to null here or
      # every >2m Pending during a routine rollout pages Pushover.
      - receiver: "null"
        matchers:
          - name: alertname
            value: KubePodPendingBrief
            matchType: "="
      # Additive enrichment (Rob-approved 2026-09-25, a knowing override of the
      # 2026-07-06 enrichment removal noted below). Forward FIRING criticals to
      # the in-cluster kagent observability-operator via the alert-agent-bridge
      # webhook. `continue: true` keeps evaluation going so the alert STILL
      # falls through to the root pushover receiver and pages exactly as before
      # — the bridge note is a parallel, priority-0 enrichment, never a
      # replacement for the page. Placed AFTER the null routes so Watchdog /
      # InfoInhibitor / KubePodPendingBrief terminate first and are never
      # forwarded. Scoped to severity=critical to bound enrichment volume.
      - receiver: "agent-bridge"
        continue: true
        matchers:
          - name: severity
            value: critical
            matchType: "="
      # Local-watcher / agent-ops health + dead-man's-switch alerts
      # (Rob-approved 2026-10-03). All five are `severity: warning` —
      # non-paging by design — so route them to email instead of
      # Pushover rather than competing with wake-the-human pages. No
      # `continue: true`: this REPLACES the pushover route for these
      # alertnames, it does not duplicate the notification.
      # WindmillFailureDetectionStale / WindmillWatchdogMissing are the
      # windmill-watchdog dead-man's switch; the three AgentOps* alerts
      # are the M5 agent-ops-watchdog equivalent (PR #14704). Both rule
      # groups live in kubernetes/apps/home/windmill/app/
      # (prometheusrule.yaml and prometheusrule-agent-ops.yaml).
      - receiver: "email"
        matchers:
          - name: alertname
            value: AgentOpsQueueUnhealthy|AgentOpsWatchdogStale|AgentOpsWatchdogMissing|WindmillFailureDetectionStale|WindmillWatchdogMissing
            matchType: "=~"
      # DORMANT by design (Rob-approved 2026-10-03). Forwards firing alerts
      # carrying `queue: agent-ops` to the Windmill agent-ops work-queue
      # ingress (ingest_alert script -> task-contract -> triage flow). No
      # PrometheusRule sets this label today, so this route matches ZERO
      # alerts — it exists to validate the receiver/CNP/secret plumbing
      # without putting a single alert through the live path. `continue:
      # true` so that whenever a rule DOES opt in (by adding
      # `queue: agent-ops` to its labels), the alert still falls through to
      # root `pushover` / the email route above and pages/notifies exactly
      # as it does today — this is a parallel ingestion hook, never a
      # replacement for the human-facing notification. sendResolved:false
      # on the receiver (see below) — ingest firing onset only, not clears.
      # To opt an alert in: add `labels: {queue: agent-ops}` to its
      # PrometheusRule. To validate end-to-end: pick exactly one low-risk
      # alert, add the label, confirm a single ingest_alert job appears in
      # the agent-ops workspace, then decide whether to expand.
      - receiver: "agent-ops-ingest"
        continue: true
        matchers:
          - name: queue
            value: agent-ops
            matchType: "="
  # Routing is by ALERTNAME, not by severity. The routes above are the
  # only suppression/redirection: everything else — critical, warning,
  # and info alike — falls through to the root `pushover` receiver and
  # notifies. If you want an alert to page, no severity label change is
  # needed; if you want one silenced, add an alertname route here; if you
  # want one redirected to a non-paging channel, add it to the email
  # route's regex above (or a new receiver, following the same shape).
  #
  # (HolmesGPT/windmill-investigate enrichment on critical was removed
  # 2026-07-06 — no value delivered.)
  #
  # The inhibitRule below is the one severity-aware behaviour: a firing
  # critical suppresses a warning sharing the same alertname+namespace.
  inhibitRules:
    - equal: ["alertname", "namespace"]
      sourceMatch:
        - name: severity
          value: critical
          matchType: "="
      targetMatch:
        - name: severity
          value: warning
          matchType: "="
  receivers:
    - name: "null"
    # Event-driven agent enrichment (see the agent-bridge route above). Posts the
    # firing group to the in-cluster bridge, which asks observability-operator to
    # triage it (and optionally delegate a domain deep-dive) and sends a
    # supplemental Pushover. sendResolved:false — enrich onset only, not clears.
    - name: "agent-bridge"
      webhookConfigs:
        - url: http://alert-agent-bridge.ai.svc.cluster.local:8080/alerts
          sendResolved: false
    # DORMANT ingress into the agent-ops Windmill work-queue (see the
    # `queue: agent-ops` route above — matches zero alerts today). POSTs
    # Alertmanager's native payload ({alerts:[...], status, ...}) straight
    # to the ingest_alert script, which maps it onto a task-contract and
    # fires the triage flow. Bearer token from the 1P item
    # `windmill-agent-ops-webhook` (field `token`), materialized by the
    # `alertmanager` ExternalSecret in this same directory into
    # `alertmanager-secret` key `agent_ops_webhook_token`. sendResolved:
    # false — ingest firing onset only, not clears (a resolved alert isn't
    # a new task).
    - name: "agent-ops-ingest"
      webhookConfigs:
        - url: http://windmill-app.home.svc.cluster.local:8000/api/w/agent-ops/jobs/run/p/f/agent_ops/ingest_alert
          sendResolved: false
          httpConfig:
            authorization:
              credentials:
                name: alertmanager-secret
                key: agent_ops_webhook_token
    # Non-paging channel for local-watcher / agent-ops warning-tier alerts
    # (see the email route above). Speaks SMTP directly to the in-cluster
    # relay on its unauthenticated plaintext listener — same path the
    # Windmill workflows use (kubernetes/apps/home/windmill/app/helmrelease.yaml
    # workerGroups extraEnv: SMTP_HOST=smtp-relay.home.svc.cluster.local,
    # SMTP_PORT=2525). `requireTLS: false` matches maddy.conf's `tls off`
    # on that listener — Alertmanager defaults to STARTTLS otherwise and
    # the relay doesn't offer it on :2525, so a message would never send.
    - name: "email"
      emailConfigs:
        - to: admin@${SECRET_DOMAIN}
          from: alertmanager@${SECRET_DOMAIN}
          smarthost: smtp-relay.home.svc.cluster.local:2525
          hello: ${SECRET_DOMAIN}
          requireTLS: false
          sendResolved: true
          headers:
            - key: Subject
              value: >-
                [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
                {{ .CommonLabels.alertname }}
          html: |-
            {{- range .Alerts -}}
              <p>
              {{- if .Annotations.description -}}
                {{ .Annotations.description }}
              {{- else if .Annotations.summary -}}
                {{ .Annotations.summary }}
              {{- else -}}
                Alert description not available
              {{- end -}}
              {{- with .Labels.namespace }} <i>ns={{ . }}</i>{{ end -}}
              {{- with .Labels.cronjob }} <i>cronjob={{ . }}</i>{{ end -}}
              {{- with .Labels.job_name }} <i>job={{ . }}</i>{{ end -}}
              </p>
            {{- end -}}
    - name: "pushover"
      pushoverConfigs:
        - html: true
          urlTitle: View in Alertmanager
          url: https://alertmanager.${SECRET_DOMAIN}
          message: |-
            {{- range .Alerts -}}
              {{- if .Annotations.description -}}
                {{ .Annotations.description }}
              {{- else if .Annotations.summary -}}
                {{ .Annotations.summary }}
              {{- else if .Annotations.message -}}
                {{ .Annotations.message }}
              {{- else -}}
                Alert description not available
              {{- end -}}
              {{- with .Labels.namespace }} <i>ns={{ . }}</i>{{ end -}}
              {{- with .Labels.pod }} <i>pod={{ . }}</i>{{ end -}}
              {{- with .Labels.container }} <i>c={{ . }}</i>{{ end -}}
              {{- with .Labels.instance }} <i>i={{ . }}</i>{{ end -}}
              <br>
            {{- end -}}
          monospace: false
          priority: |-
            {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
          sendResolved: true
          sound: gamelan
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
            {{ .CommonLabels.alertname }}
          ttl: 86400s
          token:
            name: alertmanager-secret
            key: pushover_api_token
          userKey:
            name: alertmanager-secret
            key: pushover_api_userkey
