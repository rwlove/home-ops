---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    groupBy: ["alertname", "job"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 6h
    receiver: "pushover"
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            value: Watchdog
            matchType: "="
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: "="
      # KubePodPendingBrief (warning) is intentionally Grafana-only for
      # trend visibility — it must NOT page. The inhibitRule below can't
      # suppress it (that requires the same alertname as the critical, and
      # the critical is KubePodStuckPending), so route it to null here or
      # every >2m Pending during a routine rollout pages Pushover.
      - receiver: "null"
        matchers:
          - name: alertname
            value: KubePodPendingBrief
            matchType: "="
      # Additive enrichment (Rob-approved 2026-09-25, a knowing override of the
      # 2026-07-06 enrichment removal noted below). Forward FIRING criticals to
      # the in-cluster kagent observability-operator via the alert-agent-bridge
      # webhook. `continue: true` keeps evaluation going so the alert STILL
      # falls through to the root pushover receiver and pages exactly as before
      # — the bridge note is a parallel, priority-0 enrichment, never a
      # replacement for the page. Placed AFTER the null routes so Watchdog /
      # InfoInhibitor / KubePodPendingBrief terminate first and are never
      # forwarded. Scoped to severity=critical to bound enrichment volume.
      - receiver: "agent-bridge"
        continue: true
        matchers:
          - name: severity
            value: critical
            matchType: "="
  # Routing is by ALERTNAME, not by severity. The two routes above are
  # the only suppression: everything else — critical, warning, and info
  # alike — falls through to the root `pushover` receiver and notifies.
  # If you want an alert to page, no severity label change is needed; if
  # you want one silenced, add an alertname route here.
  #
  # (HolmesGPT/windmill-investigate enrichment on critical was removed
  # 2026-07-06 — no value delivered.)
  #
  # The inhibitRule below is the one severity-aware behaviour: a firing
  # critical suppresses a warning sharing the same alertname+namespace.
  inhibitRules:
    - equal: ["alertname", "namespace"]
      sourceMatch:
        - name: severity
          value: critical
          matchType: "="
      targetMatch:
        - name: severity
          value: warning
          matchType: "="
  receivers:
    - name: "null"
    # Event-driven agent enrichment (see the agent-bridge route above). Posts the
    # firing group to the in-cluster bridge, which asks observability-operator to
    # triage it (and optionally delegate a domain deep-dive) and sends a
    # supplemental Pushover. sendResolved:false — enrich onset only, not clears.
    - name: "agent-bridge"
      webhookConfigs:
        - url: http://alert-agent-bridge.ai.svc.cluster.local:8080/alerts
          sendResolved: false
    - name: "pushover"
      pushoverConfigs:
        - html: true
          urlTitle: View in Alertmanager
          url: https://alertmanager.${SECRET_DOMAIN}
          message: |-
            {{- range .Alerts -}}
              {{- if .Annotations.description -}}
                {{ .Annotations.description }}
              {{- else if .Annotations.summary -}}
                {{ .Annotations.summary }}
              {{- else if .Annotations.message -}}
                {{ .Annotations.message }}
              {{- else -}}
                Alert description not available
              {{- end -}}
              {{- with .Labels.namespace }} <i>ns={{ . }}</i>{{ end -}}
              {{- with .Labels.pod }} <i>pod={{ . }}</i>{{ end -}}
              {{- with .Labels.container }} <i>c={{ . }}</i>{{ end -}}
              {{- with .Labels.instance }} <i>i={{ . }}</i>{{ end -}}
              <br>
            {{- end -}}
          monospace: false
          priority: |-
            {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
          sendResolved: true
          sound: gamelan
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
            {{ .CommonLabels.alertname }}
          ttl: 86400s
          token:
            name: alertmanager-secret
            key: pushover_api_token
          userKey:
            name: alertmanager-secret
            key: pushover_api_userkey
