---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hass-ll-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        HASS_TOKEN: "{{ .prometheus_token }}"
  dataFrom:
    - extract:
        key: home-assistant

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alertmanager-secret
  data:
    - secretKey: pushover_api_token
      remoteRef:
        key: Pushover
        property: alertmanager_token
    - secretKey: pushover_api_userkey
      remoteRef:
        key: Pushover
        property: userkey
    # Bearer token for the DORMANT agent-ops-ingest webhook receiver (see
    # alertmanagerconfig.yaml). 1P item `windmill-agent-ops-webhook`,
    # field `token` — generate with `openssl rand -base64 32` and store
    # under vault `Kubernetes`. Also needs to match whatever the Windmill
    # `ingest_alert` script validates against (set the same value there).
    - secretKey: agent_ops_webhook_token
      remoteRef:
        key: windmill-agent-ops-webhook
        property: token
