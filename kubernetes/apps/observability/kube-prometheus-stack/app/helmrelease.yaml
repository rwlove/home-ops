---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph

  values:
    alertmanager:
      alertmanagerSpec:
        alertmanagerConfiguration:
          global:
            resolveTimeout: 5m
          name: alertmanager
        externalUrl: https://alertmanager.${SECRET_DOMAIN}
        storage:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 1Gi

              storageClassName: ceph-block
      route:
        main:
          annotations:
            glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/alertmanager.png"
            glance/id: "Observability"

            glance/name: "Alert Manager"
            glance/show: "true"
          enabled: true
          hostnames:
            - alertmanager.${SECRET_DOMAIN}
          parentRefs:
            - name: internal
              namespace: network
              sectionName: https
    cleanPrometheusOperatorObjectNames: true

    ###
    ### Component values
    ###
    crds:
      enabled: false
    defaultRules:
      # Replaced by ./prometheusrule-pv.yaml — the upstream alerts fire
      # once per PVC, which produces N alerts when N PVCs share a single
      # NFS export. The replacement keeps per-PVC granularity for
      # non-NFS PVCs and adds per-nfs_server aggregation.
      disabled:
        # InfoInhibitor only exists as a source for an upstream
        # inhibit_rule that suppresses info-severity alerts. Our
        # alertmanagerconfig defines no such inhibit_rule (its only
        # inhibitRule is critical -> warning), so InfoInhibitor is an
        # unreferenced source that just shows up as constant firing in
        # the Prometheus/AM UIs. Disabling it is still correct.
        #
        # The previous version of this comment was wrong twice and is
        # corrected here: this cluster DOES have info-severity alerts
        # (GPUPowerSustainedHigh, HostRequiresReboot), and the
        # alertmanagerconfig does NOT null-route below `critical` — it
        # null-routes exactly two alertnames. See the routing note in
        # ./alertmanagerconfig.yaml.
        InfoInhibitor: true
        KubePersistentVolumeFillingUp: true
        KubePersistentVolumeInodesFillingUp: true
        # Replaced by ./prometheusrule-node-disk-io.yaml — the upstream
        # rule fires on security-storage's dm-6, whose steady state is
        # bursty NVMe write saturation from the Frigate recording path
        # (expected, not an incident). The replacement excludes that one
        # instance and is otherwise identical to upstream.
        NodeDiskIOSaturation: true
    grafana:
      enabled: false
      forceDeployDashboards: true
      sidecar:
        dashboards:
          annotations:
            grafana_folder: Kubernetes

    ###
    ### Prometheus operator values
    ###
    kubeApiServer:
      enabled: true
      endpoints: ["192.168.1.9", "192.168.4.9", "192.168.4.10"]
      serviceMonitor:
        metricRelabelings:
          # Drop high cardinality labels
          - action: drop
            regex: (apiserver|etcd|rest_client)_request(|_sli|_slo)_duration_seconds_bucket
            sourceLabels: ["__name__"]
          - action: drop
            regex: (apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|apiserver_request_total)
            sourceLabels: ["__name__"]
          - action: drop
            regex: code_verb:apiserver_request_total:increase1h[30d]
            sourceLabels: ["__name__"]
          - action: drop
            regex: ".*apiserver_request_total.*"

            sourceLabels: ["__name__"]
    kubeControllerManager:
      enabled: true
      endpoints: ["192.168.1.9", "192.168.4.9", "192.168.4.10"]

    kubeEtcd:
      enabled: true
      endpoints: ["192.168.1.9", "192.168.4.9", "192.168.4.10"]
    kubeProxy:
      enabled: false

    kubeScheduler:
      enabled: true
      endpoints: ["192.168.1.9", "192.168.4.9", "192.168.4.10"]

    kubeStateMetrics:
      enabled: false


    kubelet:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          # Drop high cardinality labels
          - action: labeldrop
            regex: (uid)
          - action: labeldrop
            regex: (id|name)
          - action: drop
            regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)

            sourceLabels: ["__name__"]
    nodeExporter:
      enabled: false

    prometheus:
      prometheusSpec:
        enableRemoteWriteReceiver: true
        externalUrl: https://prometheus.${SECRET_DOMAIN}
        image:
          registry: docker.io
          repository: prompp/prompp
          # digest MUST stay in a separate `sha` field, not appended to `tag`:
          # prometheus-operator parses `tag` as the Prometheus semver `version`,
          # and a `@sha256:` suffix fails that parse → PrometheusOperatorSyncFailed
          # (all operator reconciliation stalls). See #13091 (bulk digest pin).
          tag: 2.53.2-0.3.3
          sha: df67ff1dc7094940e9d62e9bc318b02e4e35f539893dec5cc6b72d4fee4d8f21
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        # Sized from measured behaviour rather than round numbers.
        #
        # Memory: the 7d peak was 2.64Gi against the old 3G (2.79Gi)
        # ceiling — 94%. That held across three separate container
        # generations (2.34 / 2.36 / 2.64Gi), so it was a routine
        # near-miss, not one spike. p95 is only ~1.7Gi, so what needs
        # covering is query/compaction burst, not steady state. 4G puts
        # the observed peak at ~71%. Revisit if peak/limit climbs back
        # over ~80% — Prometheus memory tracks active series, so this
        # moves with cluster growth.
        #
        # Keeping memory request == limit is deliberate: kubelet ranks
        # eviction by usage *above request*, so a pod that can never
        # exceed its request sits at the bottom of the kill list. That
        # matters here — everything else's alerting depends on this pod.
        #
        # CPU request follows measured 248m sustained; the previous 100m
        # under-requested by 2.5x, which both misinforms the scheduler
        # and weakens the CFS share under node contention. Still NO cpu
        # limit, deliberately: throttling bursty rule evaluation would be
        # worse than the contention it avoids, and matches the repo norm
        # (only 23 of 158 HelmReleases set one).
        resources:
          limits:
            memory: 4G
          requests:
            cpu: 300m
            memory: 4G
        retention: 14d
        retentionSize: 100GB
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        scrapeInterval: 1m # Must match interval in Grafana Helm chart
        securityContext:
          fsGroup: 64535
          runAsGroup: 64535
          runAsNonRoot: true
          runAsUser: 64535
        serviceMonitorSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 110Gi
              storageClassName: ceph-block
      route:
        main:
          annotations:
            glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/prometheus.png"
            glance/id: "Observability"
            glance/name: "Prometheus"
            glance/show: "true"
          enabled: true
          hostnames:
            - "prometheus.${SECRET_DOMAIN}"
          parentRefs:
            - name: internal
              namespace: network
              sectionName: https

    prometheusOperator:
      prometheusConfigReloader:
        # resource config for prometheusConfigReloader
        resources:
          limits:
            memory: 32M
          ###
          ### Prometheus instance values
          ###
          requests:
            cpu: 5m
            memory: 32M
      resources:
        limits:
          memory: 326M

        requests:
          cpu: 35m
          memory: 273M
