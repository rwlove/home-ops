---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-pending-rules
spec:
  groups:
    # Catches workloads stuck in Pending — a state the upstream
    # KubePodNotReady alert doesn't fire on quickly (it waits 15min by
    # default and the symptom is `not Ready`, not `Pending`). Per session
    # 2026-05-18 incident: `ai/langgraph-agents` sat in ImagePullBackOff
    # (Pending) for 62 minutes with no Pushover before a manual probe
    # surfaced it. The arch-taint regression that caused that bug is
    # fixed; this rule catches the next regression of the same class.
    #
    # Critical severity → routes to the pushover receiver per
    # `alertmanagerconfig.yaml`.
    #
    # kube-state-metrics emits a series for EVERY phase of every pod (1 on
    # the current phase, 0 on the rest), so both sides compare `== 1`.
    # Without that, the `unless` matched the 0-valued Running series of
    # every pod and the alert could never fire (dead from 2026-05 until
    # 2026-11-23, when two CI runners sat Pending unseen).
    #
    # `for: 15m` on the critical: the 14-day backtest of the corrected
    # expression gave ~4 pages/day at 5m (rollout init churn, mostly
    # windmill) and 10 incidents at 15m, all real stalls.
    #
    # Exclusions:
    #   - downloads namespace: workloads here are init-gated and
    #     intermittently Pending while their VPN sidecar comes up.
    - name: kube-pod-pending
      rules:
        - alert: KubePodStuckPending
          annotations:
            description: |-
              Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in Pending
              for >15 minutes (current phase: {{ $labels.phase }}). Common
              causes: ImagePullBackOff (missing arch variant, registry auth,
              unknown digest), unschedulable due to taint/toleration mismatch
              or insufficient resources, or stuck waiting on a PVC. See
              `kubectl describe pod -n {{ $labels.namespace }} {{ $labels.pod }}`.
            summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} stuck Pending >15min
          expr: |-
            sum by (namespace, pod, phase) (
              kube_pod_status_phase{phase="Pending", namespace!~"downloads"} == 1
              unless on (namespace, pod) (kube_pod_status_phase{phase=~"Succeeded|Running"} == 1)
            ) == 1
          for: 15m
          labels:
            severity: critical
        # Lower-priority warn variant for shorter stalls (e.g., normal
        # rolling-update transitions). Pure warning — no Pushover noise,
        # just shows up in Grafana for trend visibility.
        - alert: KubePodPendingBrief
          annotations:
            description: |-
              Pod {{ $labels.namespace }}/{{ $labels.pod }} has been Pending
              for >5 minutes. Possibly a normal rollout; escalates to critical
              KubePodStuckPending after 15m if it doesn't resolve.
            summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} Pending >5min
          expr: |-
            sum by (namespace, pod, phase) (
              kube_pod_status_phase{phase="Pending", namespace!~"downloads"} == 1
              unless on (namespace, pod) (kube_pod_status_phase{phase=~"Succeeded|Running"} == 1)
            ) == 1
          for: 5m
          labels:
            severity: warning
