---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki-allow
spec:
  # Loki SingleBinary pods carry `app.kubernetes.io/name: loki`.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  enableDefaultDeny:
    egress: false
    ingress: false
  # Intra-ns callers (Vector aggregator push, Grafana query) are covered
  # by baseline allow-intra-namespace and need no rule. No HTTPRoute
  # exposes Loki publicly. No cross-ns ingress callers remain — the
  # local-cron error-pattern skim was retired 2026-10-17 (home-ops#15048),
  # so its ai→loki:3100 punch-through was removed here and on the egress
  # side in ai/local-cron/app/cnp-allow.yaml.
  egress:
    # Chunk + index storage on Rook Ceph RGW (S3 API). Loki's S3
    # endpoint resolves to the `rook-ceph-rgw-ceph-objectstore` Service
    # (port 80 → targetPort 8080). Cilium L4 egress is evaluated against
    # the post-translation pod port: radosgw starts with
    # `--rgw-frontends=beast port=8080`, so the rule must allow 8080,
    # not the Service port 80. Use Pattern E (cross-ns endpoint match)
    # rather than FQDN — the rook-ceph-rgw selector is stable.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: rook-ceph
            app.kubernetes.io/name: ceph-rgw
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Ruler alerting target — Loki rule evaluations fire alerts at
    # alertmanager-operated:9093 (intra-ns; baseline covers).
    # No external egress required.
