---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alerting-rules
  labels:
    # Picked up by Loki's sidecar (chart default sidecar.rules.label/labelValue)
    # and written to /rules/fake for the ruler to evaluate.
    loki_rule: "1"
data:
  loki-alerting-rules.yaml: |-
    groups:
      # SMART failures - runs from journald on any host with smartmontools
      - name: smart-failure
        rules:
          - alert: SmartFailures
            expr: |
              sum by (hostname) (count_over_time({hostname=~".+"} | json | _SYSTEMD_UNIT = "smartmontools.service" !~ "(?i)previous self-test completed without error" !~ "(?i)Prefailure" |~ "(?i)(error|fail)"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "SMART has reported failures on host {{ $labels.hostname }}"

      - name: zigbee2mqtt
        rules:
          - alert: ZigbeeUnableToReachMQTT
            expr: |
              sum(count_over_time({app="zigbee2mqtt"} |~ "(?i)not connected to mqtt server"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "Zigbee2mqtt is unable to reach MQTT"

      - name: frigate
        rules:
          - alert: FrigateUnableToReachMQTT
            expr: |
              sum(count_over_time({app="frigate"} |~ "(?i)unable to connect to mqtt server"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "Frigate is unable to reach MQTT"
          - alert: FrigateNoSpaceOnShm
            expr: |
              sum(count_over_time({app="frigate"} |~ "(?i)unable to write to /dev/shm"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "Frigate /dev/shm: No space left on device"

      - name: arr
        rules:
          - alert: ArrDatabaseIsLocked
            expr: |
              sum by (app) (count_over_time({app=~".*arr"} |~ "(?i)database is locked"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "{{ $labels.app }} is experiencing locked database issues"
          - alert: ArrDatabaseIsMalformed
            expr: |
              sum by (app) (count_over_time({app=~".*arr"} |~ "(?i)database disk image is malformed"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "{{ $labels.app }} is experiencing malformed database disk image issues"

      - name: home-assistant
        rules:
          - alert: HomeAssistantUnableToReachPostgresql
            expr: |
              sum by (app) (count_over_time({app="home-assistant"} |~ "(?i)error in database connectivity"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "Home Assistant is unable to connect to postgresql"

      - name: node-red
        rules:
          - alert: NodeRedUnableToReachHomeAssistant
            expr: |
              sum by (app) (count_over_time({app="node-red"} |~ "(?i)home assistant.*connecting to undefined"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "Node-Red is unable to connect to Home Assistant"

      # Kuadrant mcp-gateway per-tool-call audit trail (broker v0.9.0+ emits
      # `level=INFO msg="tool call" ... audit=true ... status=<code>`). A
      # sustained burst of non-200 tool calls means an MCP backend is down /
      # erroring, or the tool surface is being probed. Line-filter style (not
      # `| logfmt`) mirrors the other rules here and is robust to the Loki
      # sink's json event encoding. status=200 is the success case; anything
      # else is a failed call. Verified live 2026-08-21: broker on v0.9.0,
      # stream is {app="mcp-gateway", namespace="mcp-system"}.
      - name: mcp-gateway
        rules:
          - alert: MCPGatewayToolCallFailures
            expr: |
              sum(count_over_time({app="mcp-gateway", namespace="mcp-system"} |= "audit=true" != "status=200" [5m])) > 5
            for: 5m
            labels:
              severity: warning
              category: logs
            annotations:
              summary: "mcp-gateway: sustained failed MCP tool calls"
              description: >-
                {{ $value | humanize }} MCP tool calls returned a non-200
                status in the last 5m. Check the mcp-gateway broker logs
                (audit=true lines) for the failing tool/server/status — a
                backend MCP server is likely down or erroring.

      # Backstop for a failure mode invisible to kube_pod_container_status_restarts_total:
      # gluetun (the VPN client sidecar for the download-path egress gateway
      # in the vpn namespace) restarts its own internal WireGuard process on
      # a failed healthcheck WITHOUT the container or pod restarting — CRI-O
      # and the kubelet see a live, Ready, restartCount:0 process throughout.
      # No metrics endpoint is enabled on this deployment (no
      # HTTP_CONTROL_SERVER / METRICS_ENABLED env, no ServiceMonitor), so a
      # Prometheus-metric alert cannot see this signal; log content is the
      # only observable. Confirmed live 2026-08-28 13:01-13:06 ET: gluetun
      # logged `restarting VPN because it failed to pass the healthcheck:
      # ... dial tcp4 1.1.1.1:443: i/o timeout` roughly every 6s across a
      # ~4.5m outage window (~45 occurrences) before self-recovering with no
      # config change on our side — see project_downloads_gateway_gluetun_
      # silent_restart_loop.md.
      #
      # IMPORTANT: this pod runs 3 containers (main, gluetun, netshoot)
      # sharing ONE Loki stream — the vector-agent sink indexes only
      # {app="pod-gateway", namespace="vpn", node, service_name} at the pod
      # level; there is NO indexed `container` label in this cluster's Loki
      # schema (confirmed 2026-08-28 via list_loki_label_names — the shipped
      # v1 of this rule used a nonexistent `container="gluetun"` matcher and
      # silently matched zero streams instead of erroring, per
      # feedback_public_sink_llm_digest_needs_mechanical_restricted_backstop-
      # style "worse than nothing" failure). The per-container name is only
      # inside the JSON-encoded line body as `container_name`, so isolate it
      # with `| json | container_name="gluetun"` instead.
      #
      # A single normal reconnect (the design-intent CONNECTION_RETRY_COUNT
      # recovery baked into the pod-gateway settings) produces at most one
      # or two of these lines before the tunnel comes back — nowhere near
      # threshold. `> 10` in a 5m window requires a genuinely sustained loop
      # (~1 failure/30s sustained, well below today's observed ~1/6s
      # cadence) to fire, so this rule is tuned to catch today's event
      # comfortably (45 >> 10) without paging on routine single retries.
      # `for: 5m` keeps a five-minute matching window so a loop has to
      # persist across the whole window, not just spike once. Verified live
      # against today's outage window (13:01-13:06 ET) post-fix: this exact
      # matcher returns the historical restart-loop lines.
      # PUMP Voltra sidecar (collab ns) drives the Voltra trainer over BLE
      # through an ALWAYS-ON ESPHome bluetooth proxy (bluetooth-proxy-gym,
      # 10.10.20.69, an M5Stack ATOM on the IoT VLAN). On 2026-09-30 ~04:04 ET
      # that proxy dropped its TCP link unexpectedly ([Errno 104] connection
      # reset), the sidecar logged `esphome proxy disconnected expected=False`
      # and then failed the trainer connect, so pressing LOAD applied no
      # weight; it self-healed in ~3 min. No alert caught it.
      #
      # HARD CONSTRAINT: the Voltra trainer is powered OFF ~23h/day, so
      # `pump_voltra_connected==0`, `workout_active==0`, and the sidecar's
      # idle "trainer probably switched off / not advertising / waiting for
      # the trainer" lines are all NORMAL and must NEVER alert. There is NO
      # metric for proxy connect/disconnect state, so this is log-only — the
      # only observable for an always-on-proxy fault. The trainer-off idle
      # lines never carry `expected=False` (verified: 0 overlap over 7d), so
      # matching the unexpected-disconnect line is clean against the OFF state.
      #
      # Tuning: the proxy is very stable — over 14d the max unexpected
      # disconnects in any 15m window was 1 (a single self-healing blip, the
      # 04:04 event). `>= 2 in 15m` therefore does NOT page on one 3-min
      # self-healing blip but DOES fire when the always-on proxy is genuinely
      # flapping (repeated unexpected drops) and auto-load is at risk. warning
      # severity; falls through to the pushover receiver like every pump alert
      # (routing is by alertname, not severity). `for: 5m` keeps the window
      # persistent rather than a single scrape spike. NOTE: this catches a
      # REPEATED/flapping proxy fault; a proper single-blip alert would need
      # a sidecar-exported gauge (pump_voltra_proxy_connected) or counter
      # (pump_voltra_proxy_disconnects_total) — recommended, needs a
      # pump-voltra release.
      - name: pump-voltra
        rules:
          - alert: PumpVoltraProxyFlapping
            expr: |
              sum(count_over_time({namespace="collab", app="pump-voltra"} |~ "esphome proxy disconnected.*expected=False"[15m])) >= 2
            for: 5m
            labels:
              severity: warning
              category: logs
            annotations:
              summary: "pump-voltra: always-on BLE proxy is flapping (Voltra auto-load at risk)"
              description: >-
                {{ $value | humanize }} UNEXPECTED disconnects of the always-on
                gym ESPHome bluetooth proxy (bluetooth-proxy-gym, 10.10.20.69)
                in the last 15m, seen from the pump-voltra sidecar in collab.
                A single self-healing ~3-min blip is normal and does not fire
                this; >=2 means the proxy link is genuinely unstable and the
                Voltra will fail to apply weight when LOAD is pressed. This is
                the always-on proxy faulting — NOT the trainer being powered
                off (that idle state never logs expected=False). Check:
                  kubectl -n collab logs -l app.kubernetes.io/name=pump-voltra --tail=100 | grep -i "esphome proxy\|connection reset\|trainer connect failed"
                and the ESPHome proxy device itself (bluetooth-proxy-gym) for
                Wi-Fi/power instability on the IoT VLAN. There is no proxy-state
                metric yet, so this log-based rule is the only signal.
      - name: vpn-egress-gateway
        rules:
          - alert: DownloadPathVpnGatewayRestartLoop
            expr: |
              sum(count_over_time({namespace="vpn"} | json | container_name="gluetun" |~ "(?i)restarting vpn because it failed to pass the healthcheck"[5m])) > 10
            for: 5m
            labels:
              severity: warning
              category: logs
            annotations:
              summary: "Download-path VPN egress gateway: gluetun stuck in an internal restart loop"
              description: >-
                {{ $value | humanize }} internal gluetun restarts in the
                last 5m in the vpn namespace — the WireGuard tunnel is
                failing its own healthcheck repeatedly and NOT recovering
                on its own. This does not show up as a pod restart (CRI-O
                restartCount stays 0), so this log-based alert is the only
                signal. Every pod routed through this gateway
                (routed_namespaces: [downloads]) has degraded or no
                internet egress while this fires. Check:
                  kubectl -n vpn logs -l app.kubernetes.io/instance=downloads-gateway -c gluetun --tail=100
                If the tunnel is cycling through multiple resolved
                endpoints and failing all of them, this is likely a
                provider-side (Mullvad relay) outage, not a config
                regression — cross-check the pinned SERVER_HOSTNAMES
                relay's status before changing anything.

      # kagent watcher-fleet productivity. Each triage run (local-cron, ns ai)
      # ends with a machine line `TRIAGE_RESULT=<outcome> agent=<name>`.
      # Productive outcomes: sent (problem emailed) / allclear (nothing
      # actionable). Unproductive: empty (agent slow/non-terminal or asked a
      # question with no report), error (transport), malformed (agent replied but
      # broke the PROBLEM:/ALL CLEAR tag contract — the flaky local-model case).
      # The triage crons DELIBERATELY exit 0 and stay silent on an unproductive
      # run (a watcher must never notify just because it could not conclude — see
      # triage_run.py / the a2a_client silent-skip design), so a KubeJobFailed
      # alert can NO LONGER see a persistently-broken watcher. This log-based rule
      # is the backstop, split BY result class so the page names whether it is
      # empty / malformed / error — each has a different root cause + fix. ~17
      # triage runs land per 24h (4 agents every 6h + storage daily), and
      # triage_run.py already re-asks once on a miss, so >= 3 of ONE class in 24h
      # is a real degradation pattern, not routine flakiness. Tune per-class if
      # normal local-model flakiness proves noisier.
      - name: kagent-triage
        rules:
          - alert: KagentTriageUnproductive
            expr: |
              sum by (result) (count_over_time({namespace="ai", app="local-cron"} |~ "TRIAGE_RESULT=(empty|malformed|error)" | regexp `TRIAGE_RESULT=(?P<result>empty|malformed|error) agent=`[24h])) >= 3
            for: 10m
            labels:
              severity: warning
              category: logs
              # agent-ops-ingest pilot (Rob-approved 2026-10-03): the FIRST
              # alert opted into the dormant `queue: agent-ops` route
              # (observability/kube-prometheus-stack/app/alertmanagerconfig.yaml)
              # to validate the end-to-end AlertManager -> Windmill ingest ->
              # triage-router path. Picked for being low-volume (zero fires
              # in the prior 30d before this pilot), warning-tier (non-
              # paging class before this), and purely diagnostic (runbook
              # is "grep logs for which agent" — no restart/delete action
              # implied, so a triage-router response can't cascade into a
              # destructive remediation). `continue: true` on the agent-ops
              # route means this label change is additive only — Pushover
              # notification for this alert is unchanged.
              queue: agent-ops
            annotations:
              summary: "kagent triage watchers producing {{ $labels.result }} output"
              description: >-
                {{ $value | humanize }} kagent triage runs in the last 24h ended
                "{{ $labels.result }}" (TRIAGE_RESULT) instead of a report — that
                watcher class is degraded and silently blind (crons exit 0 by
                design). empty = agent returned no usable text (asked a question /
                non-terminal); malformed = replied but broke the PROBLEM:/ALL CLEAR
                tag (local-model drift / wrong language); error = transport failure
                reaching the agent. triage_run.py already re-asks once before
                giving up, so a sustained count here is a real pattern. Which
                agents:
                  kubectl -n ai logs -l app.kubernetes.io/name=local-cron --tail=200 | grep TRIAGE_RESULT
