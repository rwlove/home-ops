---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alerting-rules
  labels:
    # Picked up by Loki's sidecar (chart default sidecar.rules.label/labelValue)
    # and written to /rules/fake for the ruler to evaluate.
    loki_rule: "1"
data:
  loki-alerting-rules.yaml: |-
    groups:
      # SMART failures - runs from journald on any host with smartmontools
      - name: smart-failure
        rules:
          - alert: SmartFailures
            expr: |
              sum by (hostname) (count_over_time({hostname=~".+"} | json | _SYSTEMD_UNIT = "smartmontools.service" !~ "(?i)previous self-test completed without error" !~ "(?i)Prefailure" |~ "(?i)(error|fail)"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "SMART has reported failures on host {{ $labels.hostname }}"

      - name: zigbee2mqtt
        rules:
          - alert: ZigbeeUnableToReachMQTT
            expr: |
              sum(count_over_time({app="zigbee2mqtt"} |~ "(?i)not connected to mqtt server"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "Zigbee2mqtt is unable to reach MQTT"

      - name: frigate
        rules:
          - alert: FrigateUnableToReachMQTT
            expr: |
              sum(count_over_time({app="frigate"} |~ "(?i)unable to connect to mqtt server"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "Frigate is unable to reach MQTT"
          - alert: FrigateNoSpaceOnShm
            expr: |
              sum(count_over_time({app="frigate"} |~ "(?i)unable to write to /dev/shm"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "Frigate /dev/shm: No space left on device"

      - name: arr
        rules:
          - alert: ArrDatabaseIsLocked
            expr: |
              sum by (app) (count_over_time({app=~".*arr"} |~ "(?i)database is locked"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "{{ $labels.app }} is experiencing locked database issues"
          - alert: ArrDatabaseIsMalformed
            expr: |
              sum by (app) (count_over_time({app=~".*arr"} |~ "(?i)database disk image is malformed"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "{{ $labels.app }} is experiencing malformed database disk image issues"

      - name: home-assistant
        rules:
          - alert: HomeAssistantUnableToReachPostgresql
            expr: |
              sum by (app) (count_over_time({app="home-assistant"} |~ "(?i)error in database connectivity"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "Home Assistant is unable to connect to postgresql"

      - name: node-red
        rules:
          - alert: NodeRedUnableToReachHomeAssistant
            expr: |
              sum by (app) (count_over_time({app="node-red"} |~ "(?i)home assistant.*connecting to undefined"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "Node-Red is unable to connect to Home Assistant"

      # Kuadrant mcp-gateway per-tool-call audit trail (broker v0.9.0+ emits
      # `level=INFO msg="tool call" ... audit=true ... status=<code>`). A
      # sustained burst of non-200 tool calls means an MCP backend is down /
      # erroring, or the tool surface is being probed. Line-filter style (not
      # `| logfmt`) mirrors the other rules here and is robust to the Loki
      # sink's json event encoding. status=200 is the success case; anything
      # else is a failed call. Verified live 2026-08-21: broker on v0.9.0,
      # stream is {app="mcp-gateway", namespace="mcp-system"}.
      - name: mcp-gateway
        rules:
          - alert: MCPGatewayToolCallFailures
            expr: |
              sum(count_over_time({app="mcp-gateway", namespace="mcp-system"} |= "audit=true" != "status=200" [5m])) > 5
            for: 5m
            labels:
              severity: warning
              category: logs
            annotations:
              summary: "mcp-gateway: sustained failed MCP tool calls"
              description: >-
                {{ $value | humanize }} MCP tool calls returned a non-200
                status in the last 5m. Check the mcp-gateway broker logs
                (audit=true lines) for the failing tool/server/status — a
                backend MCP server is likely down or erroring.

      # PUMP Voltra sidecar (collab ns) drives the Voltra trainer over BLE
      # through an ALWAYS-ON ESPHome bluetooth proxy (now bluetooth-proxy-gym-poe,
      # 10.10.20.59, a wired PoE ESP32 on the IoT VLAN; previously the WiFi
      # M5Stack ATOM bluetooth-proxy-gym, 10.10.20.69). On 2026-09-30 ~04:04 ET
      # the ATOM proxy dropped its TCP link unexpectedly ([Errno 104] connection
      # reset), the sidecar logged `esphome proxy disconnected expected=False`
      # and then failed the trainer connect, so pressing LOAD applied no
      # weight; it self-healed in ~3 min. No alert caught it.
      #
      # HARD CONSTRAINT: the Voltra trainer is powered OFF ~23h/day, so
      # `pump_voltra_connected==0`, `workout_active==0`, and the sidecar's
      # idle "trainer probably switched off / not advertising / waiting for
      # the trainer" lines are all NORMAL and must NEVER alert. There is NO
      # metric for proxy connect/disconnect state, so this is log-only — the
      # only observable for an always-on-proxy fault. The trainer-off idle
      # lines never carry `expected=False` (verified: 0 overlap over 7d), so
      # matching the unexpected-disconnect line is clean against the OFF state.
      #
      # Tuning: the proxy is very stable — over 14d the max unexpected
      # disconnects in any 15m window was 1 (a single self-healing blip, the
      # 04:04 event). `>= 2 in 15m` therefore does NOT page on one 3-min
      # self-healing blip but DOES fire when the always-on proxy is genuinely
      # flapping (repeated unexpected drops) and auto-load is at risk. warning
      # severity; falls through to the pushover receiver like every pump alert
      # (routing is by alertname, not severity). `for: 5m` keeps the window
      # persistent rather than a single scrape spike. NOTE: this catches a
      # REPEATED/flapping proxy fault; a proper single-blip alert would need
      # a sidecar-exported gauge (pump_voltra_proxy_connected) or counter
      # (pump_voltra_proxy_disconnects_total) — recommended, needs a
      # pump-voltra release.
      - name: pump-voltra
        rules:
          - alert: PumpVoltraProxyFlapping
            expr: |
              sum(count_over_time({namespace="collab", app="pump-voltra"} |~ "esphome proxy disconnected.*expected=False"[15m])) >= 2
            for: 5m
            labels:
              severity: warning
              category: logs
            annotations:
              summary: "pump-voltra: always-on BLE proxy is flapping (Voltra auto-load at risk)"
              description: >-
                {{ $value | humanize }} UNEXPECTED disconnects of the always-on
                gym ESPHome bluetooth proxy (bluetooth-proxy-gym-poe, 10.10.20.59)
                in the last 15m, seen from the pump-voltra sidecar in collab.
                A single self-healing ~3-min blip is normal and does not fire
                this; >=2 means the proxy link is genuinely unstable and the
                Voltra will fail to apply weight when LOAD is pressed. This is
                the always-on proxy faulting — NOT the trainer being powered
                off (that idle state never logs expected=False). Check:
                  kubectl -n collab logs -l app.kubernetes.io/name=pump-voltra --tail=100 | grep -i "esphome proxy\|connection reset\|trainer connect failed"
                and the ESPHome proxy device itself (bluetooth-proxy-gym-poe) for
                PoE power / ethernet instability on the IoT VLAN. There is no proxy-state
                metric yet, so this log-based rule is the only signal.
      # Download-path VPN: every app in the downloads namespace has its own
      # gluetun sidecar (#11829; this replaced the shared vpn-namespace
      # gateway). gluetun restarts its WireGuard tunnel internally on a
      # failed healthcheck WITHOUT the container restarting, so the
      # restart-count / readiness Prometheus rules (DownloadVpnSidecar*)
      # can't see a tunnel that keeps cycling; the log line is the only
      # signal. Precedent: 2026-08-28, ~45 such lines in ~4.5m (one every
      # ~6s) during a provider-side relay fault.
      #
      # This cluster's Loki has NO indexed `container` label (a matcher on
      # it silently matches zero streams); the container name is only in the
      # JSON line body, hence `| json | container_name="gluetun"`. Streams
      # carry an `app` label, so the rule groups per app.
      #
      # Threshold: a single self-healing blip is ONE line (measured
      # 2026-11-21: tunnel forced down, recovered in ~6s). `> 5` in 15m,
      # held `for: 10m`, needs a loop sustained for most of the window.
      - name: download-vpn-tunnel
        rules:
          - alert: DownloadVpnTunnelRestartLoop
            expr: |
              sum by (app) (count_over_time({namespace="downloads"} | json | container_name="gluetun" |~ "(?i)restarting vpn because it failed to pass the healthcheck"[15m])) > 5
            for: 10m
            labels:
              severity: warning
              category: logs
            annotations:
              summary: "Download VPN tunnel for {{ $labels.app }}: gluetun stuck in an internal restart loop"
              description: >-
                {{ $value | humanize }} internal gluetun VPN restarts in the
                last 15m for {{ $labels.app }} (downloads namespace). Each app
                has its own gluetun sidecar and relay; the tunnel is failing
                its own healthcheck repeatedly and NOT recovering. This is not
                a container restart (the sidecar stays Ready), so this
                log-based rule is the only signal for it. The app fails
                closed: nothing leaks, but its downloads are stalled. A single
                self-healing blip (one restart, recovered in seconds) never
                fires this. Check:
                  kubectl -n downloads logs -l app.kubernetes.io/name={{ $labels.app }} -c gluetun --tail=100
                If several apps fire together, suspect a provider-side outage
                or the shared account/key; if one, check that app's relay
                (status, and that its ipv4_addr_in still matches the CNP
                toCIDR pin) before changing anything. Companion Prometheus
                rules: DownloadVpnSidecarNotReady / DownloadVpnSidecarRestartLoop.

      # kagent watcher-fleet GPU/backend availability. Each triage run (local-cron,
      # ns ai) ends with a machine line `TRIAGE_RESULT=<outcome> agent=<name>`:
      #   sent / allclear   = productive.
      #   empty / malformed = the agent was REACHABLE but unproductive (slow /
      #                       non-terminal, or local-model drift broke the tag
      #                       contract). Logged, NEVER paged.
      #   error             = the model BACKEND (GPU: P40 Ollama / Spark vLLM, via
      #                       LiteLLM) was unreachable for the run's WHOLE requeue
      #                       window.
      # triage_run.py / doer_pipeline.py now REQUEUE on an unreachable backend (back
      # off + re-ask the same agent until the GPU model is back or ~900s is spent),
      # so a transient rollout / cold-start / VRAM blip recovers silently and emits
      # NO error. A terminal `error` therefore already means "GPU unavailable AND the
      # job retried repeatedly and still failed." Per Rob (2026-10-04) we page ONLY
      # on that, and only when it RECURS — >= 2 errors in 6h = a sustained GPU/
      # backend outage with multiple jobs failing, not a one-off exhausted window.
      # empty / malformed are deliberately NOT alerted (a drifting model is visible
      # via `grep TRIAGE_RESULT` but must not page). Tune the window/threshold if a
      # real outage proves to need faster or slower paging.
      - name: kagent-triage
        rules:
          - alert: KagentTriageGpuUnavailable
            expr: |
              sum(count_over_time({namespace="ai", app="local-cron"} |~ "TRIAGE_RESULT=error "[6h])) >= 2
            for: 10m
            labels:
              severity: warning
              category: logs
              # agent-ops-ingest pilot (Rob-approved 2026-10-03): the FIRST
              # alert opted into the dormant `queue: agent-ops` route
              # (observability/kube-prometheus-stack/app/alertmanagerconfig.yaml)
              # to validate the end-to-end AlertManager -> Windmill ingest ->
              # triage-router path. Picked for being low-volume, warning-tier,
              # and purely diagnostic (runbook is "grep logs for which agent +
              # check the GPU serving path" — no restart/delete action implied,
              # so a triage-router response can't cascade into a destructive
              # remediation). `continue: true` on the agent-ops route means this
              # label is additive only — Pushover notification is unchanged.
              queue: agent-ops
            annotations:
              summary: "kagent triage: GPU/model backend repeatedly unavailable"
              description: >-
                {{ $value | humanize }} kagent triage runs in the last 6h ended
                TRIAGE_RESULT=error — the model backend (GPU: P40 Ollama / Spark
                vLLM via LiteLLM) was unreachable for each run's full requeue window,
                on multiple runs. Transient blips self-heal via requeue and are NOT
                counted here, so this is a sustained GPU/backend outage. Which agents
                + why they gave up:
                  kubectl -n ai logs -l app.kubernetes.io/name=local-cron --tail=200 | grep -E "TRIAGE_RESULT=error|backend/model unavailable"
                Then check the GPU serving path in ns ai: ollama (P40 / worker8) and
                the litellm + vllm-*-spark pods.
