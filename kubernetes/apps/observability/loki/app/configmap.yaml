---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alerting-rules
  labels:
    # Picked up by Loki's sidecar (chart default sidecar.rules.label/labelValue)
    # and written to /rules/fake for the ruler to evaluate.
    loki_rule: "1"
data:
  loki-alerting-rules.yaml: |-
    groups:
      # SMART failures - runs from journald on any host with smartmontools
      - name: smart-failure
        rules:
          - alert: SmartFailures
            expr: |
              sum by (hostname) (count_over_time({hostname=~".+"} | json | _SYSTEMD_UNIT = "smartmontools.service" !~ "(?i)previous self-test completed without error" !~ "(?i)Prefailure" |~ "(?i)(error|fail)"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "SMART has reported failures on host {{ $labels.hostname }}"

      - name: zigbee2mqtt
        rules:
          - alert: ZigbeeUnableToReachMQTT
            expr: |
              sum(count_over_time({app="zigbee2mqtt"} |~ "(?i)not connected to mqtt server"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "Zigbee2mqtt is unable to reach MQTT"

      - name: frigate
        rules:
          - alert: FrigateUnableToReachMQTT
            expr: |
              sum(count_over_time({app="frigate"} |~ "(?i)unable to connect to mqtt server"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "Frigate is unable to reach MQTT"
          - alert: FrigateNoSpaceOnShm
            expr: |
              sum(count_over_time({app="frigate"} |~ "(?i)unable to write to /dev/shm"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "Frigate /dev/shm: No space left on device"

      - name: arr
        rules:
          - alert: ArrDatabaseIsLocked
            expr: |
              sum by (app) (count_over_time({app=~".*arr"} |~ "(?i)database is locked"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "{{ $labels.app }} is experiencing locked database issues"
          - alert: ArrDatabaseIsMalformed
            expr: |
              sum by (app) (count_over_time({app=~".*arr"} |~ "(?i)database disk image is malformed"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "{{ $labels.app }} is experiencing malformed database disk image issues"

      - name: home-assistant
        rules:
          - alert: HomeAssistantUnableToReachPostgresql
            expr: |
              sum by (app) (count_over_time({app="home-assistant"} |~ "(?i)error in database connectivity"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "Home Assistant is unable to connect to postgresql"

      - name: node-red
        rules:
          - alert: NodeRedUnableToReachHomeAssistant
            expr: |
              sum by (app) (count_over_time({app="node-red"} |~ "(?i)home assistant.*connecting to undefined"[2m])) > 0
            for: 2m
            labels:
              severity: critical
              category: logs
            annotations:
              summary: "Node-Red is unable to connect to Home Assistant"

      # Kuadrant mcp-gateway per-tool-call audit trail (broker v0.9.0+ emits
      # `level=INFO msg="tool call" ... audit=true ... status=<code>`). A
      # sustained burst of non-200 tool calls means an MCP backend is down /
      # erroring, or the tool surface is being probed. Line-filter style (not
      # `| logfmt`) mirrors the other rules here and is robust to the Loki
      # sink's json event encoding. status=200 is the success case; anything
      # else is a failed call. Verified live 2026-08-21: broker on v0.9.0,
      # stream is {app="mcp-gateway", namespace="mcp-system"}.
      - name: mcp-gateway
        rules:
          - alert: MCPGatewayToolCallFailures
            expr: |
              sum(count_over_time({app="mcp-gateway", namespace="mcp-system"} |= "audit=true" != "status=200" [5m])) > 5
            for: 5m
            labels:
              severity: warning
              category: logs
            annotations:
              summary: "mcp-gateway: sustained failed MCP tool calls"
              description: >-
                {{ $value | humanize }} MCP tool calls returned a non-200
                status in the last 5m. Check the mcp-gateway broker logs
                (audit=true lines) for the failing tool/server/status — a
                backend MCP server is likely down or erroring.

      # Backstop for a failure mode invisible to kube_pod_container_status_restarts_total:
      # gluetun (the VPN client sidecar for the download-path egress gateway
      # in the vpn namespace) restarts its own internal WireGuard process on
      # a failed healthcheck WITHOUT the container or pod restarting — CRI-O
      # and the kubelet see a live, Ready, restartCount:0 process throughout.
      # No metrics endpoint is enabled on this deployment (no
      # HTTP_CONTROL_SERVER / METRICS_ENABLED env, no ServiceMonitor), so a
      # Prometheus-metric alert cannot see this signal; log content is the
      # only observable. Confirmed live 2026-08-28 13:01-13:06 ET: gluetun
      # logged `restarting VPN because it failed to pass the healthcheck:
      # ... dial tcp4 1.1.1.1:443: i/o timeout` roughly every 6s across a
      # ~4.5m outage window (~45 occurrences) before self-recovering with no
      # config change on our side — see project_downloads_gateway_gluetun_
      # silent_restart_loop.md.
      #
      # A single normal reconnect (the design-intent CONNECTION_RETRY_COUNT
      # recovery baked into the pod-gateway settings) produces at most one
      # or two of these lines before the tunnel comes back — nowhere near
      # threshold. `> 10` in a 5m window requires a genuinely sustained loop
      # (~1 failure/30s sustained, well below today's observed ~1/6s
      # cadence) to fire, so this rule is tuned to catch today's event
      # comfortably (45 >> 10) without paging on routine single retries.
      # `for: 5m` keeps a five-minute matching window so a loop has to
      # persist across the whole window, not just spike once.
      - name: vpn-egress-gateway
        rules:
          - alert: DownloadPathVpnGatewayRestartLoop
            expr: |
              sum(count_over_time({namespace="vpn", container="gluetun"} |~ "(?i)restarting vpn because it failed to pass the healthcheck"[5m])) > 10
            for: 5m
            labels:
              severity: warning
              category: logs
            annotations:
              summary: "Download-path VPN egress gateway: gluetun stuck in an internal restart loop"
              description: >-
                {{ $value | humanize }} internal gluetun restarts in the
                last 5m in the vpn namespace — the WireGuard tunnel is
                failing its own healthcheck repeatedly and NOT recovering
                on its own. This does not show up as a pod restart (CRI-O
                restartCount stays 0), so this log-based alert is the only
                signal. Every pod routed through this gateway
                (routed_namespaces: [downloads]) has degraded or no
                internet egress while this fires. Check:
                  kubectl -n vpn logs -l app.kubernetes.io/instance=downloads-gateway -c gluetun --tail=100
                If the tunnel is cycling through multiple resolved
                endpoints and failing all of them, this is likely a
                provider-side (Mullvad relay) outage, not a config
                regression — cross-check the pinned SERVER_HOSTNAMES
                relay's status before changing anything.
