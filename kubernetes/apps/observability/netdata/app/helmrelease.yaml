---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netdata
spec:
  chart:
    spec:
      # renovate: registryUrl=https://netdata.github.io/helmchart/
      chart: netdata
      sourceRef:
        kind: HelmRepository
        name: netdata

      version: 3.7.182
  interval: 30m
  values:
    child:
      enabled: false

    image:
      repository: ghcr.io/netdata/netdata
      tag: "v2.13.0@sha256:176156c6754770e6157cc87394849a8e3047a13b52f393ff021093866f7f9e5c"

    ingress:
      enabled: false

    k8sState:
      enabled: false
    parent:
      alarms:
        storageclass: "ceph-block"
      database:
        storageclass: "ceph-block"

      enabled: true
      resources:
        requests:
          cpu: 25m
          # Request right-sized per 14d working-set peak (~97Mi; PR-sweep
          # batch 2). Limit left at 512Mi — the resulting 4x gap is within
          # the normal Burstable range, not the double-digit gaps batch 1's
          # follow-up capped.
          memory: 128Mi
        limits:
          memory: 512Mi
    httpRoute:
      enabled: true
      annotations:
        glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/netdata.png"
        glance/id: "Network"
        glance/name: "Netdata"
        glance/show: "true"
      hostnames:
        - "netdata.${SECRET_DOMAIN}"
      parentRefs:
        - name: internal
          namespace: network
          sectionName: https
  releaseName: netdata
