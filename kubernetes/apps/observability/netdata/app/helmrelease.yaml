---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netdata
spec:
  chart:
    spec:
      # renovate: registryUrl=https://netdata.github.io/helmchart/
      chart: netdata
      sourceRef:
        kind: HelmRepository
        name: netdata

      version: 3.7.175
  interval: 30m
  values:
    child:
      enabled: false

    image:
      repository: ghcr.io/netdata/netdata
      tag: "v2.12.1@sha256:251a686e30117e7dc937754d2e92d1d38a872ff2380c0b29b0e5b1ac0c2af8c1"

    ingress:
      enabled: false

    k8sState:
      enabled: false
    parent:
      alarms:
        storageclass: "ceph-block"
      database:
        storageclass: "ceph-block"

      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 256Mi
        limits:
          memory: 512Mi
  releaseName: netdata
