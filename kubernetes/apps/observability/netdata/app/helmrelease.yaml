---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netdata
spec:
  chart:
    spec:
      # renovate: registryUrl=https://netdata.github.io/helmchart/
      chart: netdata
      sourceRef:
        kind: HelmRepository
        name: netdata

      version: 3.7.179
  interval: 30m
  values:
    child:
      enabled: false

    image:
      repository: ghcr.io/netdata/netdata
      tag: "v2.12.3@sha256:dea39b58b1892113360f27dffb3afb84bbdbda3b00e03e9e6163d2cfac848e91"

    ingress:
      enabled: false

    k8sState:
      enabled: false
    parent:
      alarms:
        storageclass: "ceph-block"
      database:
        storageclass: "ceph-block"

      enabled: true
      resources:
        requests:
          cpu: 25m
          # Request right-sized per 14d working-set peak (~97Mi; PR-sweep
          # batch 2). Limit left at 512Mi — the resulting 4x gap is within
          # the normal Burstable range, not the double-digit gaps batch 1's
          # follow-up capped.
          memory: 128Mi
        limits:
          memory: 512Mi
  releaseName: netdata
