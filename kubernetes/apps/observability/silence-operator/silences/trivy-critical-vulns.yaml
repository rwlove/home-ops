---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/observability.giantswarm.io/silence_v1alpha2.json
#
# Triage-window flood guard for trivy-operator's first-scan backlog. The first
# full scan surfaced a baseline of 42 images with fixable Critical CVEs
# (measured 2026-09-14). Both trivy critical alerts
# (security/trivy-operator/app/prometheusrule.yaml) are muted while that backlog
# is triaged down:
#   - TrivyImageCriticalVulnerabilities  — per-image, would fire ~42x.
#   - TrivyClusterWideCriticalVulnerabilities — meta-alert at placeholder >15;
#     with a 42 baseline it just fires constantly, so it isn't actionable DURING
#     initial triage (everything looks like a spike). Both resume at expiry.
#
# duration: 14d — mechanically expires (operator sets endsAt = creation +
# duration), so the alerts resume with no revert PR. At expiry (~2026-09-28):
# review the reduced count, RESET the meta-alert threshold from the then-current
# baseline (or redesign it delta-based), and let this lapse or re-scope.
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: trivy-image-critical-vulns-dayone
spec:
  duration: 14d
  matchers:
    - name: alertname
      matchType: "=~"
      value: Trivy(Image|ClusterWide)CriticalVulnerabilities
