---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vector-aggregator
  labels:
    app.kubernetes.io/instance: vector-aggregator
    app.kubernetes.io/name: vector-aggregator
spec:
  chartRef:
    kind: OCIRepository
    name: app-template

  interval: 30m
  # Default 5m HR timeout clips the atomic --wait during the 0.57 roll
  # (2-replica rollout + geoipupdate init pulls a fresh MaxMind DB),
  # tripping the client rate-limiter context-deadline and rolling back.
  timeout: 10m
  values:
    controllers:
      vector-aggregator:

        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app

        annotations:
          reloader.stakater.com/auto: "true"

        # Two replicas with topology spread expresses HA intent, but
        # without a PDB a node drain can take both at once.
        podDisruptionBudget:
          minAvailable: 1

        replicas: 2

        strategy: RollingUpdate

        initContainers:
          init-geoip:
            image:
              repository: ghcr.io/maxmind/geoipupdate
              tag: v8.0.0@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d

            env:
              GEOIPUPDATE_EDITION_IDS: GeoLite2-City
              GEOIPUPDATE_FREQUENCY: "0"
              GEOIPUPDATE_VERBOSE: "1"

            envFrom:
              - secretRef:
                  name: vector-geoipupdate

        containers:
          app:
            image:
              repository: ghcr.io/vectordotdev/vector
              tag: 0.57.0-debian@sha256:ed2134fa8f9844c1ca6405260903c2c2c52f94af9e16bc8fa9de9655134e0b39
            args: ["--config", "/etc/vector/vector.yaml"]
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 768Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        # ClusterIP: vector-agent + Prometheus reach this via cluster DNS
        # (vector-aggregator.observability.svc.cluster.local). The vyos-syslog
        # port was for an external VyOS router we don't run; verified zero
        # traffic in Prometheus before removal.
        type: ClusterIP
        controller: vector-aggregator
        ports:
          http:
            port: 8686
          kubernetes-logs:
            port: 6000
          journald-logs:
            port: 6002

      # External LB for non-cluster Linux hosts (brain, beast, security-storage)
      # shipping journald via Vector binary on the host.
      external:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${SVC_VECTOR_ADDR}
        controller: vector-aggregator
        ports:
          journald-logs:
            port: 6002
            protocol: TCP

    persistence:
      config:
        type: configMap
        name: vector-aggregator-configmap
        globalMounts:
          - path: /etc/vector/vector.yaml
            subPath: vector.yaml
            readOnly: true

      data:
        type: emptyDir
        globalMounts:
          - path: /vector-data-dir

      geoip:
        type: emptyDir
        globalMounts:
          - path: /usr/share/GeoIP
