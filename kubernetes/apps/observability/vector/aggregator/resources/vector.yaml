---
# yamllint disable

data_dir: /vector-data-dir

api:
  enabled: true
  address: 0.0.0.0:8686

# Sources
sources:
  kubernetes_source:
    address: 0.0.0.0:6000
    type: vector
    version: "2"

  journald_source:
    type: vector
    address: 0.0.0.0:6002
    version: "2"

# Transformations
transforms:
  kubernetes_remap:
    type: remap
    inputs:
      - kubernetes_source
    source: |
      # Standardize 'app' index
      .custom_app_name = .pod_labels."app.kubernetes.io/name" || .pod_labels.app || .pod_labels."k8s-app" || "unknown"
      # Drop pod_labels
      del(.pod_labels)

  # Drop gonic's benign unauthenticated-Subsonic-ping log. gonic's readiness
  # probe intentionally hits /rest/ping.view to gate Ready on the API actually
  # serving (Music Assistant's one-shot OpenSubsonic loader must not bind a
  # not-yet-serving gonic) — gonic logs `subsonic error code 10: please
  # provide a "u" parameter` on each probe (~every 10s). The probe is
  # correct-on-purpose; drop the cosmetic line at the collector instead of
  # weakening the probe.
  drop_gonic_ping_noise:
    type: filter
    inputs:
      - kubernetes_remap
    condition: '!(.custom_app_name == "gonic" && contains(to_string(.message) ?? "", "please provide a \"u\" parameter"))'

# Sinks
sinks:
  loki_kubernetes:
    type: loki
    inputs:
      - drop_gonic_ping_noise
    endpoint: http://loki.observability.svc.cluster.local:3100
    encoding:
      codec: json
    out_of_order_action: rewrite_timestamp
    remove_label_fields: true
    remove_timestamp: true
    # vector 0.57 template confinement: Loki label values are legitimately
    # fully dynamic; a literal prefix would mangle the indexed values and
    # break Grafana queries. Opt out to preserve prior behavior.
    # https://github.com/vectordotdev/vector/blob/master/website/content/en/highlights/2026-07-14-0-57-0-upgrade-guide.md
    dangerously_allow_unconfined_template_resolution: true
    labels:
      app: "{{ custom_app_name }}"
      namespace: "{{ kubernetes.pod_namespace }}"
      node: "{{ kubernetes.pod_node_name }}"

  loki_journal:
    type: loki
    endpoint: http://loki.observability.svc.cluster.local:3100
    encoding:
      codec: json
    inputs:
      - journald_source
    out_of_order_action: rewrite_timestamp
    remove_label_fields: true
    remove_timestamp: true
    # vector 0.57 template confinement — see loki_kubernetes above.
    dangerously_allow_unconfined_template_resolution: true
    labels:
      hostname: "{{ host }}"
