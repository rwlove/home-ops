---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: renovate-operator-allow
spec:
  endpointSelector:
    matchLabels:
      app: renovate-operator
  # Additive — default-deny is what triggers the lockdown; these rules
  # punch holes through it. The renovate-operator chart uses a bare
  # `app: renovate-operator` label (NOT `app.kubernetes.io/name`).
  enableDefaultDeny:
    egress: false
    ingress: false
  ingress:
    # HTTPRoute on internal gateway → renovate-operator:8081 (named
    # "http"). renovate.${SECRET_DOMAIN} is the endpoint GitHub repository
    # webhook deliveries reach via cloudflared → envoy → here.
    #
    # Port numbering, since a previous version of this comment had it wrong
    # and the mistake cost a working deploy chain: the container exposes
    # metrics=8080, http=8081, webhook=8082. 8082 is NOT metrics. The
    # baseline allow-monitoring-scrape covers Prometheus on 8080.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # The in-cluster webhook app POSTs /webhook/v1/schedule on 8082 to
    # trigger a RenovateJob — that is how a PUMP release becomes a
    # HelmRelease digest-bump PR. Nothing allowed it, so the call was
    # silently dropped and the chain had never worked end to end.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: selfhosted
            app.kubernetes.io/name: webhook
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
  egress:
    # GitHub API: operator polls api.github.com for repo discovery and
    # PR state. The operator itself does not clone repos — that's the
    # spawned RenovateJob pods (covered by renovate-jobs-allow in
    # ../jobs/).
    #
    # Tightened from toEntities:[world]:443 back to a toFQDNs allow-list
    # (home-ops#11851). The search-domain-augmentation bug (cilium#20191)
    # that forced the world:443 workaround no longer fires: PR #12482
    # removed CoreDNS `autopath @kubernetes`, so Cilium's DNS proxy sees
    # the bare-name query and caches these canonical A-record hosts under
    # the bare name. matchName works (verified on Cilium 1.19.5). L7 DNS
    # proxy visibility is provided namespace-wide by the baseline
    # allow-dns component. NB: regresses if autopath is re-enabled.
    - toFQDNs:
        - matchName: api.github.com
        - matchName: github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
