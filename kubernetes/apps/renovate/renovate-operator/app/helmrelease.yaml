---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 30m
  values:
    fullnameOverride: renovate-operator
    # All RenovateJob CRs in this cluster live in the `renovate`
    # namespace; the operator only reconciles + reads secrets within
    # its own namespace. Scope its RBAC from cluster-wide to namespace-
    # local (Role + RoleBinding) so a compromised operator pod cannot
    # mint / read secrets across the cluster. See docs/src/rbac_audit.md
    # §4 (renovate-operator row).
    rbac:
      ownNamespaceOnly: true
    # 6.0.0 admission policy engine (off by default). Bounds a compromised
    # / maliciously-edited RenovateJob: outbound requests are pinned to the
    # default platform hosts, secrets may only be referenced at Renovate's
    # well-known token keys (requireSecretRefOptIn), the runner image must be
    # an approved renovate/renovate repo, and pods cannot run as root.
    # Verified all three RenovateJobs pass the defaults unchanged — each uses
    # only spec.secretRef + ghcr.io/renovatebot/renovate. Extends the
    # ownNamespaceOnly scoping above. See docs/src/rbac_audit.md §4.
    policy:
      enabled: true
    route:
      enabled: true
      hostnames:
        - renovate.${SECRET_DOMAIN}
      parentRefs:
        - name: internal
          namespace: network
          sectionName: https
      annotations:
        glance/name: "Renovate"
        glance/show: "true"
        glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/renovate.png"
        glance/id: "Renovate"
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi
    webhook:
      enabled: true
