---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/generators.external-secrets.io/githubaccesstoken_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: github-auth-token
spec:
  appID: "2931213"
  installID: "111956727"
  # The installation token is scoped to exactly these repositories, which is
  # narrower than the App installation itself. Renovate's autodiscover can
  # only ever see what the token covers, so a repo missing here is invisible
  # no matter what the App's Repository access says on github.com — that
  # combination cost an afternoon: the App was widened to include PUMP and
  # discovery still returned only the three below.
  #
  # Must match the case GitHub stores: the repo is "PUMP", not "pump".
  repositories: # optional
    - home-ops
    - containers
    - lovenet-network-configuration
    - PUMP
  auth:
    privateKey:
      secretRef:
        name: github-app-pem # reference secret from step 1.
        key: private_key_pem
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-auth-token
spec:
  refreshInterval: "30m0s"
  target:
    name: github-auth-token-secret
    template:
      type: Opaque
      engineVersion: v2
      data:
        GITHUB_COM_TOKEN: "{{ .token }}"
        GITHUB_COM_USER: "cndsb3Zl"
        RENOVATE_TOKEN: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: github-auth-token
