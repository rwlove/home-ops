---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: rwlove-home-ops
  namespace: renovate
spec:
  discoveryFilters:
    - "rwlove/*"
  extraEnv:
    - name: LOG_LEVEL
      value: "info"
    - name: RENOVATE_ALLOWED_COMMANDS
      value: "['pnpm run bundle']"
    - name: RENOVATE_ENDPOINT
      value: https://api.github.com/
    - name: RENOVATE_PLATFORM
      value: github
    - name: RENOVATE_PLATFORM_COMMIT
      value: disabled  # See renovate.json5 — platformCommit trips Repository-has-changed abort.
    - name: DOCKERHUB_USERNAME
      valueFrom:
        secretKeyRef:
          name: renovate-operator-secret
          key: DOCKERHUB_USERNAME
    - name: DOCKERHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: renovate-operator-secret
          key: DOCKERHUB_TOKEN
    - name: RENOVATE_HOST_RULES
      value: >-
        [{"hostType":"docker","matchHost":"docker.io","username":"$(DOCKERHUB_USERNAME)","password":"$(DOCKERHUB_TOKEN)"}]
    - name: RENOVATE_REDIS_URL
      value: redis://dragonfly-cache.databases.svc.cluster.local.:6379
    - name: RENOVATE_REPOSITORY_CACHE
      value: enabled
    - name: RENOVATE_CACHE_PRIVATE_PACKAGES
      value: "true"
    # Renovate caches datasource release lists for a hardcoded 15 min, so an
    # hourly schedule never hits it and every run re-fetches every tag list
    # from the registries. 120 min spans the hourly interval: cached runs skip
    # those registry calls (Docker Hub pull quota) and finish ~13% faster, at
    # the cost of noticing a new release up to 2h late. This does not fix the
    # occasional "lookupUpdates error" on the dashboard; that comes from
    # Renovate's hardcoded 120s package-cache mutex timing out while large
    # tag lists are processed on a single CPU-bound Node thread.
    - name: RENOVATE_CACHE_TTL_OVERRIDE
      value: '{"datasource-releases-*": 120}'
  image: ghcr.io/renovatebot/renovate:44.260.3@sha256:3a3afa18062aa0514f32cd636cdd08f4b6c68cb62e699e5729511d1127ad7b05
  parallelism: 5
  provider:
    name: github
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  schedule: 0 * * * *
  secretRef: github-auth-token-secret
  webhook:
    enabled: true
    authentication:
      enabled: false
