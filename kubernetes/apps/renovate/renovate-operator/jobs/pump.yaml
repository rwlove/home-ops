---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: rwlove-pump
  namespace: renovate
spec:
  discoveryFilters:
    - "rwlove/home-ops"
  extraEnv:
    - name: LOG_LEVEL
      value: "info"
    - name: RENOVATE_ENDPOINT
      value: https://api.github.com/
    - name: RENOVATE_PLATFORM
      value: github
    - name: RENOVATE_PLATFORM_COMMIT
      value: enabled
    - name: RENOVATE_REDIS_URL
      value: redis://dragonfly-cache.databases.svc.cluster.local:6379
    - name: RENOVATE_REPOSITORY_CACHE
      value: enabled
    - name: RENOVATE_CACHE_PRIVATE_PACKAGES
      value: "true"
    # Restrict Renovate to the three PUMP HelmReleases so a webhook-triggered
    # run skips the rest of the repo.
    #
    # This covered only the server until 2026-08-08, so pump-cv and
    # pump-voltra digests were never bumped automatically even when the chain
    # was working — both were rolled by hand every time.
    - name: RENOVATE_INCLUDE_PATHS
      value: >-
        ["kubernetes/apps/collab/pump/app/helmrelease.yaml",
         "kubernetes/apps/collab/pump-cv/app/helmrelease.yaml",
         "kubernetes/apps/collab/pump-voltra/app/helmrelease.yaml"]
    # Don't rewrite the global "Renovate Dashboard 🤖" issue from this
    # narrow run — the rwlove-home-ops job owns it.
    - name: RENOVATE_DEPENDENCY_DASHBOARD
      value: "false"
  image: ghcr.io/renovatebot/renovate:44.234.1@sha256:7f97a190186bbb994ace854b17afe29e3c37c1f672a2b2d28ebd433c17a612df
  parallelism: 1
  provider:
    name: github
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  # Primarily webhook-driven (instant, on a PUMP GitHub Release), with a daily
  # tick as a floor — NOT yearly. History of why:
  #
  # The operator only honors a webhook-triggered /schedule call for a project
  # that job's OWN discovery run has already registered (RenovateProject CRs,
  # scoped per-job since the v6.1.0 chart's RenovateJob→RenovateProject CRD
  # split — home-ops#13951 bumped the chart). Discovery runs on the job's
  # `schedule`; there is no separate discovery-only interval in the CRD. A
  # yearly `schedule` therefore means this job's own discovery (and so its
  # webhook eligibility) effectively never re-runs.
  #
  # That's exactly what happened: the v6.1.0 upgrade (2026-09-01) reset every
  # job's discovered-project state, and this job's yearly schedule meant it
  # never regained its own registration — so every subsequent webhook POST to
  # /webhook/v1/schedule?job=rwlove-pump failed job-resolution ("no matching
  # job owns this project"). Chart v6.1.0 also shipped GHSA-r33m-9688-gqmr,
  # which collapses that *and* a real credential failure into the same
  # generic `401 {"error":"unauthorized"}` (previously 404 for the former) to
  # stop an unauthenticated caller from using the status code to enumerate
  # managed projects/namespaces/job names. The merged 401 is indistinguishable
  # from this job's `webhook.authentication.enabled: false` actually being
  # bypassed — it looked like an auth break; it was a stale-discovery-state
  # break surfaced through a security-hardening status-code change.
  #
  # (The hourly rwlove-home-ops job — unrestricted discoveryFilters, project
  # `rwlove/home-ops` registered and kept fresh every run — picked up the
  # slack the whole time: every PUMP release still got auto-deployed, just
  # ≤1h late via that broader job instead of instantly via this scoped one.
  # No deploys were actually lost.)
  #
  # Fix: give this job a real recurring cadence so its own discovery can
  # never go stale for longer than a day, independent of whether the webhook
  # path is healthy. RENOVATE_INCLUDE_PATHS above keeps a daily run cheap and
  # scoped to only the three PUMP HelmReleases.
  schedule: 45 6 * * *
  secretRef: github-auth-token-secret
  webhook:
    enabled: true
    authentication:
      enabled: false
