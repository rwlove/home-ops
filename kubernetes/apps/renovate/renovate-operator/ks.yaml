---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate-operator
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: renovate-operator
  targetNamespace: renovate
  path: "./kubernetes/apps/renovate/renovate-operator/app"
  interval: 1h
  timeout: 5m
  # KCNP trial (home-ops#13772 §1): this path now includes a
  # ClusterNetworkPolicy CR (cnp-trial-kcnp.yaml), which needs the
  # external CRD from network-policy-api-crds to exist first — same
  # CRD-before-CR ordering as cilium -> cilium-config.
  dependsOn:
    - name: network-policy-api-crds
      namespace: kube-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: renovate-operator
      namespace: renovate

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate-github-auth
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: renovate-github-auth
  targetNamespace: renovate
  path: "./kubernetes/apps/renovate/renovate-operator/auth"
  interval: 1h
  timeout: 5m
  wait: false
  dependsOn:
    - name: renovate-operator

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renovate-operator-jobs
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: renovate-operator
  targetNamespace: renovate
  path: "./kubernetes/apps/renovate/renovate-operator/jobs"
  interval: 1h
  timeout: 5m
  wait: false
  dependsOn:
    - name: renovate-operator
    - name: renovate-github-auth
    - name: dragonfly-cluster
      namespace: databases
