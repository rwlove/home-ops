---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  interval: 1h
  values:
    # CSI driver images are owned by the bundled ceph-csi-operator (v1.1.0 as
    # of rook 1.21): this release's rook-csi-operator-image-set-configmap is
    # left blank and the operator applies its own defaults (cephcsi v3.18.1 +
    # matched sidecars). Do NOT re-pin csi.*.repository/tag here — on rook 1.21
    # the chart does not feed those into the configmap when the operator
    # subchart is installed (verified live: pins present but configmap stayed
    # blank), so a pin is inert at best and a silent downgrade if it ever
    # activated. Override images on the ceph-csi-operator side if ever needed.
    #
    # CSI driver SAs/RBAC, the csiServiceAccountPrefix, and the driver
    # nodePlugin tolerations are all owned by the ceph-csi-drivers
    # HelmRelease now (../../csi-drivers). rook 1.20 removed CSI settings
    # from this chart: csi.pluginTolerations is silently ignored here and
    # the Spark arm64 toleration lives in the drivers chart values. See
    # rook/rook#17644 and reference_rook_1_20_csi_rbac_outage in memory.
    image:
      repository: ghcr.io/rook/ceph

    monitoring:
      enabled: true

    resources:
      limits:
        memory: 768Mi
      requests:
        cpu: 70m
        memory: 768Mi
  timeout: 15m
