---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security
components:
  - ../../components/network-policy/baseline
  # default-deny: this namespace hosts a CVE scanner whose output is
  # restricted-tier audit data (per .agents/instructions/data-classification.md).
  # Baseline gives every pod DNS + apiserver + Prometheus-scrape ingress;
  # the only extra hole is the scan-Job world:443 egress in trivy-operator's
  # cnp-allow.yaml (image + vuln-DB pulls).
  - ../../components/network-policy/default-deny
resources:
  - ./namespace.yaml
  - ./trivy-operator/ks.yaml
