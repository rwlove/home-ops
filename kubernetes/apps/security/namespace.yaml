---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: security
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # PSA audit-only (cluster does not enforce — see docs/src/pod_security_audit.md).
    # baseline, not restricted: the operator pod is hardened to restricted below,
    # but trivy-operator generates scan-Job pods dynamically and their final spec
    # (init containers, cache volumes) is chart-controlled, so restricted could
    # emit audit noise we don't own. Tighten to restricted once the scan-Job spec
    # is observed clean.
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: latest
