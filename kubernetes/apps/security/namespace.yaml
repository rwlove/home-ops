---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/namespace-v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: security
  annotations:
    # Disable k8tz timezone injection namespace-wide. k8tz (cluster-wide
    # mutating webhook, initContainer strategy) injects a `k8tz` init into every
    # pod; trivy scan Jobs inherit a `k8tz` container from the target workload
    # they scan, so the webhook's injected init collides →
    #   spec.initContainers[N].name: Duplicate value: "k8tz"
    # and no scan pod can be created. These pods don't need a timezone. k8tz
    # honors this annotation at the namespace level (precedence Pod → Namespace
    # → defaults), which is reliable — unlike the operator's scanJobAnnotations,
    # which lands on the Job, not the Pod.
    k8tz.io/inject: "false"
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # PSA audit-only (cluster does not enforce — see docs/src/pod_security_audit.md).
    # baseline, not restricted: the operator pod is hardened to restricted below,
    # but trivy-operator generates scan-Job pods dynamically and their final spec
    # (init containers, cache volumes) is chart-controlled, so restricted could
    # emit audit noise we don't own. Tighten to restricted once the scan-Job spec
    # is observed clean.
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: latest
