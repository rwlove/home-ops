---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trivy-operator-egress-allow
spec:
  # Namespace-wide :443 egress. security/ is single-purpose (only trivy runs
  # here) and both of its internet-bound workloads legitimately need it:
  #   - the Trivy SERVER pulls the vuln DB + java-DB from mirror.gcr.io;
  #   - the scan-Job CLIENTS pull each target workload's image from its source
  #     registry (ghcr.io, docker.io, quay.io, registry.k8s.io, mcr, gcr, lscr…).
  # Scan Jobs are created dynamically with churny labels, and the server pod
  # carries chart labels — so endpointSelector:{} (all pods) is both robust to
  # label churn and simpler than two selectors. The operator pod also matches
  # but never egresses :443 (apiserver + embedded policies only), so it's inert.
  #
  # The registry set is open-ended (grows with every new image), so an FQDN
  # allowlist would silently break scans; Cilium 1.19 toFQDNs matchPattern is
  # also unreliable for A-only names (project_cilium_matchpattern_fqdn_limits.md)
  # — use toEntities:[world]:443, matching the khoj-allow / alertmanager-allow
  # precedent. Scan-client → in-cluster server (4975) is covered by baseline
  # allow-intra-namespace; Prometheus scrape by baseline allow-monitoring-scrape.
  endpointSelector: {}
  # Additive — default-deny is what triggers the lockdown.
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
