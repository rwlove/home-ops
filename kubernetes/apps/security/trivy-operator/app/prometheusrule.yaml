---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trivy-vulnerability-alerts
spec:
  groups:
    - name: trivy.vulnerabilities
      rules:
        # trivy_image_vulnerabilities is a per-(namespace, image, severity) gauge
        # exported by the operator (metricsFindingsEnabled) and scraped via the
        # ServiceMonitor. Aggregate to one alert per (namespace, image) — a single
        # vulnerable base image carries many CVEs, and one alert per CVE would be a
        # flood on its own. ignoreUnfixed:true means these are all fix-available.
        #
        # for: 6h is deliberately long — a CVE is not a flapping condition, so
        # there is no flap risk, and the window absorbs the first-scan noise of a
        # freshly rolled image (a same-day Renovate bump can clear it before it
        # ever pages).
        #
        # DAY-ONE FLOOD CONTROL: this alert is muted by a 14-day Silence CR
        # (observability/silence-operator/silences/trivy-critical-vulns.yaml)
        # while the ~100-image backlog is triaged. The cluster-wide meta-alert
        # below is NOT silenced and still pages on a systemic problem.
        - alert: TrivyImageCriticalVulnerabilities
          annotations:
            summary: >-
              {{ $labels.namespace }}/{{ $labels.image_repository }} has
              {{ $value }} fixable Critical CVE(s)
            description: >-
              Trivy found {{ $value }} Critical-severity vulnerabilities (fix
              available) in image {{ $labels.image_repository }}:{{ $labels.image_tag }}
              running in namespace {{ $labels.namespace }}. Inspect:
              kubectl get vulnerabilityreports -n {{ $labels.namespace }}
          expr: |-
            sum by (namespace, image_repository, image_tag) (
              trivy_image_vulnerabilities{severity="Critical"}
            ) > 0
          for: 6h
          labels:
            severity: warning
    - name: trivy.vulnerabilities.clusterwide
      rules:
        # Meta-alert: a high count of distinct vulnerable images cluster-wide
        # signals something systemic (a base-image CVE hitting many apps, or the
        # scanner misbehaving) rather than one app's problem. NOT silenced — this
        # is the escape hatch that still pages while the per-image alert is muted.
        # Threshold 15 is a PLACEHOLDER: reset it from the measured
        # count(...trivy_image_vulnerabilities{severity="Critical"}...) after the
        # first full scan (rollout step).
        - alert: TrivyClusterWideCriticalVulnerabilities
          annotations:
            summary: >-
              {{ $value }} images cluster-wide have fixable Critical CVEs
            description: >-
              Trivy reports Critical vulnerabilities in {{ $value }} distinct
              images cluster-wide — possible systemic base-image issue or scanner
              misconfiguration. Review the Trivy metrics in Grafana.
          expr: |-
            count(
              sum by (namespace, image_repository, image_tag) (
                trivy_image_vulnerabilities{severity="Critical"}
              ) > 0
            ) > 15
          for: 1h
          labels:
            severity: critical
