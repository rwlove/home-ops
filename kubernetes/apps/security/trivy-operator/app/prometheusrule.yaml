---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trivy-vulnerability-alerts
spec:
  groups:
    - name: trivy.vulnerabilities
      rules:
        # trivy_image_vulnerabilities is a per-(namespace, image, severity) gauge
        # exported by the operator (metricsFindingsEnabled) and scraped via the
        # ServiceMonitor. Aggregate to one alert per (namespace, image) — a single
        # vulnerable base image carries many CVEs, and one alert per CVE would be a
        # flood on its own. ignoreUnfixed:true means these are all fix-available.
        #
        # for: 6h is deliberately long — a CVE is not a flapping condition, so
        # there is no flap risk, and the window absorbs the first-scan noise of a
        # freshly rolled image (a same-day Renovate bump can clear it before it
        # ever pages).
        #
        # No silence — these fire live to Pushover (Rob's call 2026-09-14). At the
        # current baseline that's ~42 per-image alerts. The former cluster-wide
        # meta-alert was dropped: with every vulnerable image already paging
        # per-image, a count-of-images alert is pure duplicate noise, and a static
        # threshold just fires constantly at a non-zero baseline.
        - alert: TrivyImageCriticalVulnerabilities
          annotations:
            summary: >-
              {{ $labels.namespace }}/{{ $labels.image_repository }} has
              {{ $value }} fixable Critical CVE(s)
            description: >-
              Trivy found {{ $value }} Critical-severity vulnerabilities (fix
              available) in image {{ $labels.image_repository }}:{{ $labels.image_tag }}
              running in namespace {{ $labels.namespace }}. Inspect:
              kubectl get vulnerabilityreports -n {{ $labels.namespace }}
          expr: |-
            sum by (namespace, image_repository, image_tag) (
              trivy_image_vulnerabilities{severity="Critical"}
            ) > 0
          for: 6h
          labels:
            severity: warning
