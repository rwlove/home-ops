---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app grocy
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      grocy:
        annotations:
          reloader.stakater.com/auto: "true"
        # Single replica over an RWO Longhorn volume — statefulset serializes
        # pod replacement during a rollout.
        type: statefulset
        # Vila uses Grocy's non-food modules: chores + equipment (recurring
        # maintenance — HVAC filters, water-heater anode/flush, pool-chem
        # top-ups, deck seal), batteries, and consumable stock. Food/pantry is
        # Gordon/KitchenOwl — out of scope here.
        containers:
          app:
            image:
              # Renovate pins the sha256 digest on its first pass over this app.
              repository: ghcr.io/linuxserver/grocy
              tag: v4.2.0-ls247
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: America/New_York
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            # DELIBERATE DEVIATION from helmrelease.security.md: this is a
            # linuxserver.io s6-overlay image. Same live-verified constraint as
            # wyoming-services' faster-whisper container — it cannot run
            # non-root and cannot run under capabilities.drop: [ALL]
            # (s6-applyuidgid's setgroups() needs CAP_SETGID). It DOES boot
            # cleanly as root with just allowPrivilegeEscalation: false +
            # seccompProfile: RuntimeDefault (no UID change, no cap changes),
            # dropping to PUID/PGID 1000 itself. Harden later only if LSIO ships
            # a rootless variant.
            securityContext:
              allowPrivilegeEscalation: false
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: grocy
        ports:
          http:
            port: &port 80
    route:
      app:
        annotations:
          glance/name: "Grocy"
          glance/show: "true"
          glance/id: "Self-Hosted"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/grocy.png"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      # Grocy's SQLite DB + uploaded files live under /config — hand-entered and
      # irreplaceable, so Longhorn (survives cluster loss via the NFS backup
      # target), not ceph-block. Dynamic PVC in Git (./longhorn-pvc.yaml) at 2
      # replicas; the Longhorn Volume CR auto-joins the `default` recurring-job
      # group (daily snapshot + weekly + monthly backup).
      data:
        existingClaim: grocy-config-pvc
        globalMounts:
          - path: /config
    networkpolicies:
      allow:
        type: cilium
        forceRename: grocy-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: grocy
        # Additive — selfhosted-ns default-deny triggers the lockdown; these
        # punch holes. DNS + intra-ns covered by the baseline component. No
        # egress (SQLite, no external DB).
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal Gateway (Envoy) → grocy :80.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "80"
                    protocol: TCP
          # ai ns: the grocy-mcp bridge (Vila's kagent tier) + the vila
          # warranty/maintenance-digest local-cron, both READ the REST API.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: ai
            toPorts:
              - ports:
                  - port: "80"
                    protocol: TCP
