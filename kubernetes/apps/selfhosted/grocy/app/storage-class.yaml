---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/storageclass-storage-v1.json
#
# Per-app Longhorn StorageClass for grocy's durable /config (SQLite + uploads).
# Dynamic provisioning (the PVC in longhorn-pvc.yaml carries no volumeName), so
# Longhorn creates a fresh volume on first bind; it auto-joins the `default`
# recurring-job group (daily snapshot + weekly + monthly backup). numberOfReplicas
# 2 → a single node loss is not data loss.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: grocy-config
provisioner: driver.longhorn.io
reclaimPolicy: Retain
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "2880"
  fsType: ext4
  dataLocality: disabled
  unmapMarkSnapChainRemoved: ignored
