---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# HomeBox v0.26 requires HBOX_AUTH_API_KEY_PEPPER (>=32 bytes) or it panics on
# boot. It is a stable secret — rotating it invalidates every issued HomeBox API
# token (incl. the long-lived one the homebox-mcp bridge uses), so it must not
# change. Rob seeds it on the existing 1Password `homebox` item as property
# `auth_api_key_pepper` (generate with `openssl rand -base64 48`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homebox
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: homebox-secret
  data:
    - secretKey: HBOX_AUTH_API_KEY_PEPPER
      remoteRef:
        key: homebox
        property: auth_api_key_pepper
