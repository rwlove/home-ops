---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app konflate
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    config:
      # Forge URI of the repo konflate reviews.
      repo: github://rwlove/home-ops
      # clusterPath empty = repo root, which is correct here: our Flux
      # Kustomizations use root-relative spec.path (./kubernetes/...),
      # and flate follows each KS path from the repo root.
      clusterPath: ""
      logFormat: json
      logLevel: info
      # Periodic re-render backstop (no inbound webhook wired yet).
      refreshInterval: 30m
      # GitHub App client id, paired with KONFLATE_APP_PRIVATE_KEY from the
      # ExternalSecret. konflate treats a configured App as its forge identity
      # for *reads* as well as writes — newGitHubReadClient's precedence is
      # App, then KONFLATE_TOKEN, then anonymous — and re-mints the
      # installation token a minute before expiry, in process. That is what
      # makes the credential self-sustaining; the token path could not be,
      # because envFrom freezes the environment at pod start.
      #
      # Not a secret: a client id is a public identifier (the PEM is the
      # secret), and the App/installation ids were already committed here.
      appClientId: Iv23li1DTAALxhOLqbEx
      # Read-only toward GitHub: no PR comments, no commit-status
      # write-back (Rob's choice — flate already posts the CI diff, as a
      # sticky comment plus the required "flate successful" check).
      prComments: false
      statusChecks: false
      # Fork PRs run untrusted code through flate; keep off. With forks
      # off, konflate's SSRF egress guard also stays off so it can reach
      # the in-cluster ZOT (a private address) to render.
      renderForkPrs: false
    # App PEM supplied by the konflate ExternalSecret (key
    # KONFLATE_APP_PRIVATE_KEY). No KONFLATE_TOKEN — see appClientId above.
    secret:
      existingSecret: konflate-secret
    # Retained as a safety net, not as the fix. konflate-secret now holds
    # only the non-expiring PEM, so this fires approximately never — but if
    # the key is ever rotated in 1Password, the pod still has to restart to
    # read it, because the chart delivers the Secret through envFrom.
    #
    # It *was* the fix in #13541, rolling the pod every 30m to chase an
    # expiring installation token. Moving to App auth removed the expiry, and
    # with it that restart cadence.
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    service:
      port: 8080
    # State (flate caches + git mirror + rendered diffs) is regenerable
    # from git/upstream → ceph-block per the storage-class decision tree
    # (rule 2). Single-instance RWO; chart enforces strategy: Recreate.
    persistence:
      enabled: true
      storageClass: ceph-block
      accessModes:
        - ReadWriteOnce
      size: 5Gi
    monitoring:
      serviceMonitor:
        enabled: true
    # Exposure is via httproute.yaml + extAuth SecurityPolicy; network
    # policy is governed by the selfhosted baseline + cnp-allow.yaml.
    httpRoute:
      enabled: false
    networkPolicy:
      enabled: false
    # The memory limit is konflate's real tuning knob: it derives
    # GOMEMLIMIT (90% of it) so the GC compresses render bursts before
    # the kernel OOM-kills them. Render peaks legitimately allocate far
    # above the ceiling — upstream measured ~2.7GiB uncapped on a
    # routine PR set (home-operations/konflate#331) — so the limit has
    # to leave the GC room to work, not just cover steady state.
    #
    # Back to the chart default. The 2Gi that preceded this was a
    # workaround for OOMKills that upstream root-caused to something else
    # entirely (home-operations/konflate#434): flate #871 taught a
    # `spec.path: ./` Kustomization to match every changed file, so this
    # repo's old bootstrap KS pulled a FULL-CLUSTER render (~170 HRs) into
    # every PR diff. Upstream measured 531MiB peak that way vs 194MiB for
    # the same PR's real scope. #13502 deleted that Kustomization, so the
    # trigger is gone — the sizing problem went with it.
    #
    # Deliberately NOT measured first: GOMEMLIMIT scales with the limit,
    # so at 2Gi Go simply spends the headroom it is handed and the true
    # floor is unobservable from up there. Lowering the ceiling IS the
    # measurement. Observed after the drop-in: ~264MiB working set for a
    # scoped render. If a sweeping PR OOMKills this, raise it back —
    # KubePodOOMKilled and the konflate alerts in prometheusrule.yaml both
    # cover the failure, and the blast radius is one internal review UI.
    #
    # Do not "restore" 512Mi: that was #12803's bulk backfill halving the
    # chart default, and it is what OOMKilled 0.5.0 75 times in 9h.
    #
    # If it recurs, the next levers are config `maxDiffConcurrency`
    # (concurrent PR renders, auto-capped at 4) and `renderConcurrency`
    # (reconcile goroutines *within* one render, auto = NumCPU*4 = 40 on
    # a 10-core node, since no CPU limit is set here).
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
