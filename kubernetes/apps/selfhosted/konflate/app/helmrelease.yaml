---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app konflate
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    config:
      # Forge URI of the repo konflate reviews.
      repo: github://rwlove/home-ops
      # clusterPath empty = repo root, which is correct here: our Flux
      # Kustomizations use root-relative spec.path (./kubernetes/...),
      # and flate follows each KS path from the repo root.
      clusterPath: ""
      logFormat: json
      logLevel: info
      # Periodic re-render backstop (no inbound webhook wired yet).
      refreshInterval: 30m
      # Read-only toward GitHub: no PR comments, no commit-status
      # write-back (Rob's choice — flate already posts the CI diff).
      prComments: false
      statusChecks: false
      # Fork PRs run untrusted code through flate; keep off. With forks
      # off, konflate's SSRF egress guard also stays off so it can reach
      # the in-cluster ZOT (a private address) to render.
      renderForkPrs: false
    # Token supplied by the konflate ExternalSecret (key KONFLATE_TOKEN).
    secret:
      existingSecret: konflate-secret
    # The chart wires existingSecret in via `envFrom`, and environment
    # variables are fixed for the life of a pod. The GithubAccessToken
    # generator mints a GitHub App *installation* token, which GitHub
    # expires after 1 hour — so konflate authenticated for the first hour
    # after each start and then 401'd forever, while ESO rotated the
    # Secret underneath it (182 "secret updated" events over 2d17h, all
    # into a void). Nothing looked wrong: probes are process-level, the
    # pod never restarted, and ESO reported Ready=True the whole time.
    # Only konflate's own counters showed it — 148 of 150 diff jobs
    # erroring, both successes inside the first 20 minutes of uptime.
    #
    # renovate-operator shares this exact App (2931213) and is unaffected
    # because it runs a Job per cycle: every run gets a fresh pod that
    # reads the current Secret at startup. konflate is a long-lived
    # Deployment, so it never re-reads.
    #
    # Reloader rolls the pod when konflate-secret changes, which is the
    # remedy the chart itself documents on this value. Restart cadence
    # therefore equals the ExternalSecret's 30m refreshInterval.
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    service:
      port: 8080
    # State (flate caches + git mirror + rendered diffs) is regenerable
    # from git/upstream → ceph-block per the storage-class decision tree
    # (rule 2). Single-instance RWO; chart enforces strategy: Recreate.
    persistence:
      enabled: true
      storageClass: ceph-block
      accessModes:
        - ReadWriteOnce
      size: 5Gi
    monitoring:
      serviceMonitor:
        enabled: true
    # Exposure is via httproute.yaml + extAuth SecurityPolicy; network
    # policy is governed by the selfhosted baseline + cnp-allow.yaml.
    httpRoute:
      enabled: false
    networkPolicy:
      enabled: false
    # The memory limit is konflate's real tuning knob: it derives
    # GOMEMLIMIT (90% of it) so the GC compresses render bursts before
    # the kernel OOM-kills them. Render peaks legitimately allocate far
    # above the ceiling — upstream measured ~2.7GiB uncapped on a
    # routine PR set (home-operations/konflate#331) — so the limit has
    # to leave the GC room to work, not just cover steady state.
    #
    # The chart default is 1Gi and its values.yaml says to raise it for
    # very large clusters; this repo is ~170 HelmReleases. #12803's bulk
    # resource backfill instead *halved* the default to 512Mi. That held
    # on 0.4.3 (138Mi steady, 207Mi peak) but OOMKilled 0.5.0 75 times in
    # 9h while rendering the repo-wide cilium 1.19.6→1.20.0 bump (#13381)
    # — a sweeping render that fans out across every app in the repo.
    #
    # Going back to the chart's 1Gi default is plain sizing — that part
    # just undoes #12803. The headroom ABOVE 1Gi is the workaround: at
    # 2Gi the render burst measured 1120MiB working set / 833MiB heap
    # before reclaiming to 360MiB, so 0.5.0 no longer renders a sweeping
    # PR inside the shipped default. Caveat kept deliberately: GOMEMLIMIT
    # scales with the limit, so that burst is partly Go spending headroom
    # it was handed. It does NOT prove 1Gi would fail — only that we have
    # not risked it while the upstream question is open.
    # workaround: https://github.com/home-operations/konflate/issues/434 — remove when a konflate release renders a sweeping PR within the chart's 1Gi default
    #
    # If it recurs, the next levers are config `maxDiffConcurrency`
    # (concurrent PR renders, auto-capped at 4) and `renderConcurrency`
    # (reconcile goroutines *within* one render, auto = NumCPU*4 = 40 on
    # a 10-core node, since no CPU limit is set here).
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 2Gi
