---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: konflate
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.7.0
    digest: sha256:ec517ccfb3232cea9c85a21ad01af0e055b3e42ab1f12d723693b0123e36595a
  url: oci://ghcr.io/home-operations/charts/konflate
  # Keyless cosign signature from konflate's own release workflow
  # (.github/workflows/release.yaml), confirmed on the 0.6.6 digest.
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: https://token.actions.githubusercontent.com
        subject: https://github.com/home-operations/konflate.*
