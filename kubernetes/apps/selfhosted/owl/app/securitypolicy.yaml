---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
#
# extAuth via Authelia (#12767) — Owl has no native auth and holds
# Robert's retirement/finance inputs (session-only), so it is gated by
# an Authelia session. failOpen stays false: Authelia down means deny.
# The matching access_control rule (admin-tier, group:lldap_admin) lives
# in kubernetes/apps/auth/authelia/app/configmap.yaml.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: owl-extauth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: owl
  extAuth:
    failOpen: false
    headersToExtAuth:
      - accept
      - cookie
      - authorization
      - proxy-authorization
      - x-forwarded-proto
    http:
      backendRefs:
        - name: authelia
          namespace: auth
          port: 9091
      path: /api/authz/ext-authz/
      headersToBackend:
        - Remote-User
        - Remote-Groups
        - Remote-Name
        - Remote-Email
