---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ppcollection
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      ppcollection:
        pod:
          securityContext:
            # Node/Express app writing its SQLite DB, uploaded photos/PDFs and
            # a self-generated session secret under /data. Non-root (1000);
            # fsGroup 1000 makes the Longhorn volume group-writable.
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
        annotations:
          reloader.stakater.com/auto: "true"
        # Single replica over an RWO Longhorn volume (SQLite) -- statefulset
        # serializes pod replacement so the new pod never races the old one
        # for the volume attachment.
        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/gogorichielab/ppcollection
              tag: 2.10.3@sha256:fe18451bef4ff8dc6a2f251148d59e8f6f1c649a94add6be0ab7786d2993208e
            env:
              TZ: America/New_York
              NODE_ENV: production
              # Behind the HTTPS gateway: without TRUST_PROXY the CSRF cookie
              # is dropped and every write 403s.
              TRUST_PROXY: "true"
              SECURE_COOKIES: "true"
              # ADMIN_PASSWORD / SESSION_SECRET intentionally unset: the admin
              # is created once via the /setup wizard (one-time code in the pod
              # log) and the session secret self-generates onto the PVC.
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                <<: *probe
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                <<: *probe
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 384Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: ppcollection
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          glance/name: "Pew Pew Collection"
          glance/show: "true"
          glance/id: "Self-Hosted"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      # SQLite DB + photos + PDFs + session secret -- irreplaceable records,
      # so Longhorn (static-named, ./longhorn-pvc.yaml), not ceph-block.
      data:
        existingClaim: ppcollection-data-pvc
        globalMounts:
          - path: /data
      # Verified in a local read-only-rootfs run: /tmp is the only scratch path.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    networkpolicies:
      allow:
        type: cilium
        forceRename: ppcollection-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: ppcollection
        # Additive -- the selfhosted-ns default-deny triggers the lockdown;
        # these rules punch holes. DNS + intra-ns are covered by the baseline
        # network-policy component. No egress (SQLite, no external calls).
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal Gateway (Envoy) -> ppcollection :3000.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "3000"
                    protocol: TCP
