---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app reactive-resume
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      reactive-resume:
        annotations:
          reloader.stakater.com/auto: "true"
        # Stateless app logic — resumes/accounts live in Postgres (CNPG); the
        # only local state is the uploads dir (/app/data, a ceph-block PVC), so
        # a Deployment is correct. Single replica: the PVC is RWO.
        type: deployment
        replicas: 1
        strategy: RollingUpdate
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            # Writable /app/data PVC — chown its mount root to the non-root GID.
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          # Creates the `reactive-resume` database + owner role on the CNPG
          # cluster using the superuser (Pattern B, same as ghostfolio). RR runs
          # its own Prisma migrations on boot but does not create the database.
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom: &envFrom
              - secretRef:
                  name: reactive-resume-secret
        containers:
          app:
            image:
              repository: docker.io/amruthpillai/reactive-resume
              tag: v6.0.5@sha256:59b0d4406ec4a9ed78f9327662fa36109c61a1ef11caa6a8c0b425e6ae0ef376
            env:
              NODE_ENV: production
              PORT: "3000"
              TZ: America/New_York
              # Public URL — RR builds OAuth callbacks and asset links from it.
              APP_URL: https://reactive-resume.${SECRET_DOMAIN}
              # Uploads land on the /app/data PVC (LOCAL_STORAGE_PATH default).
              # No S3 backend: the authoritative data is in Postgres (Barman→
              # Garage), uploads are secondary and ride the ceph-block PVC.
              #
              # Single-user lockdown. Deploy with signups ENABLED for first
              # boot so Robert's + Herman's accounts can be created, then flip
              # this to "true" (see README) to seal the instance.
              # FLAG_DISABLE_SIGNUPS: "true"
            # envFrom the secret: AUTH_SECRET + DATABASE_URL (app) and the
            # INIT_POSTGRES_* fields (init container).
            envFrom: *envFrom
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              # readOnlyRootFilesystem left OFF for bring-up: RR is a Node/Nest
              # app and its full set of runtime write paths is unverified.
              # Tighten to true (with tmpfs mounts) after soak.
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
    service:
      app:
        controller: reactive-resume
        ports:
          http:
            port: 3000
    route:
      app:
        annotations:
          glance/name: "Reactive Resume"
          glance/show: "true"
          glance/id: "Self-Hosted"
          glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/reactive-resume.png"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 3000
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: ceph-block
        advancedMounts:
          reactive-resume:
            app:
              - path: /app/data
    externalSecrets:
      reactive-resume:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: reactive-resume-secret
          template:
            data:
              # RR's Prisma connection string (app container).
              DATABASE_URL: "postgresql://{{ .RR_DB_USER }}:{{ .RR_DB_PASS }}@postgres-reactive-resume-rw.databases.svc.cluster.local:5432/reactive-resume?connect_timeout=300"
              # Session signing key (openssl rand -hex 32).
              AUTH_SECRET: "{{ .AUTH_SECRET }}"
              # postgres-init initContainer (db + owner-role bootstrap).
              INIT_POSTGRES_DBNAME: reactive-resume
              INIT_POSTGRES_HOST: postgres-reactive-resume-rw.databases.svc.cluster.local
              INIT_POSTGRES_USER: "{{ .RR_DB_USER }}"
              INIT_POSTGRES_PASS: "{{ .RR_DB_PASS }}"
              INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        dataFrom:
          - extract:
              key: reactive-resume
          - extract:
              key: cloudnative-pg
    networkpolicies:
      allow:
        type: cilium
        forceRename: reactive-resume-allow
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: reactive-resume
        # Additive — the selfhosted-ns default-deny triggers the lockdown;
        # these rules punch holes. DNS + intra-ns are covered by the baseline
        # network-policy component.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # Internal Gateway (Envoy) → reactive-resume :3000.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "3000"
                    protocol: TCP
        egress:
          # CNPG cluster postgres-reactive-resume in databases ns (Pattern B:
          # init container + app).
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
                  cnpg.io/cluster: postgres-reactive-resume
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
