---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wardrowbe
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: wardrowbe-secret
    creationPolicy: Owner
    template:
      data:
        # Backend token-signing key (backend refuses to boot on the default
        # once OIDC is configured).
        SECRET_KEY: "{{ .SECRET_KEY }}"
        # NextAuth session secret (frontend).
        NEXTAUTH_SECRET: "{{ .NEXTAUTH_SECRET }}"
        # Authelia OIDC client secret (plaintext here; Authelia stores the
        # argon2id hash in its own clients config — see PR notes).
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: wardrowbe
