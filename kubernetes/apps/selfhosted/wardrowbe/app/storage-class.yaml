---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/storageclass-storage-v1.json
#
# Binding-only StorageClass for the static Longhorn PV/PVC pair in
# longhorn-pvc.yaml. Never used for dynamic provisioning -- the PV already
# carries the real csi.volumeAttributes (fsType, numberOfReplicas,
# staleReplicaTimeout) and binds via volumeName. Mirrors obsidian-couchdb's
# obsidian-data-storage-class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: wardrowbe-uploads-storage-class
provisioner: driver.longhorn.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
