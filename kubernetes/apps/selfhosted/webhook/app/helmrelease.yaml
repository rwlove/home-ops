---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: webhook
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      webhook:
        pod:
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
        annotations:
          reloader.stakater.com/auto: "true"
        # Two replicas with topology spread expresses HA intent, but
        # without a PDB a node drain can take both at once.
        podDisruptionBudget:
          minAvailable: 1

        replicas: 2
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/webhook
              tag: 2.8.3@sha256:de6bba5fac2dde1a16083ba248292511c7d692404624f14909d4cb0206851f2e
            env:
              WEBHOOK__PORT: &port 8080
            envFrom:
              - secretRef:
                  name: webhook-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - renovate-webhook.${SECRET_DOMAIN}
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
    persistence:
      config:
        type: configMap
        defaultMode: 0775
        name: webhook-configmap
        globalMounts:
          - readOnly: true
    externalSecrets:
      webhook:
        forceRename: webhook
        # Short refresh so HMAC secret rotations propagate within minutes,
        # not hours. The secret is tiny and rarely changes; 5m is well below
        # 1Password Connect rate limits.
        refreshInterval: 5m
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: webhook-secret
          creationPolicy: Owner
          template:
            data:
              GITHUB_WEBHOOK_SECRET: "{{ .renovate_app_webhook_secret }}"
        dataFrom:
          - extract:
              key: github
    networkpolicies:
      allow-from-gateway:
        type: cilium
        forceRename: webhook-allow-from-gateway
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: webhook
        # Additive — the default-deny CNP from network-policy/default-deny
        # is what triggers the lockdown; this rule punches a hole through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
      allow-to-renovate:
        type: cilium
        forceRename: webhook-allow-to-renovate-operator
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: webhook
        # Additive — the default-deny CNP from network-policy/default-deny is what
        # triggers the lockdown; this punches one hole through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        egress:
          # Both hook scripts POST to the renovate-operator's schedule endpoint to
          # trigger a RenovateJob:
          #
          #   github-renovate-operator.sh      → dependency-dashboard checkbox flow
          #   github-rwlove-pump-package.sh    → PUMP release → HelmRelease digest bump
          #
          # The webhook pod had no egress rule at all, so both calls were dropped:
          # a POST from here to renovate-operator:8082 timed out rather than being
          # refused, which is why nothing surfaced in any log. The hook reported
          # "triggered successfully" — that only means the script was executed, not
          # that its curl reached anything.
          #
          # Port 8082 is the operator's *webhook* port, not metrics. The container
          # exposes http=8081, metrics=8080, webhook=8082, and the service maps
          # webhook→8082. The matching ingress rule (and a comment that had this
          # wrong) live in renovate/renovate-operator/app/cnp-allow.yaml.
          - toEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: renovate
                  app: renovate-operator
            toPorts:
              - ports:
                  - port: "8082"
                    protocol: TCP
