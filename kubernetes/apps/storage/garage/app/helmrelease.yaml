---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app garage
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 3002
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 3002
        runAsNonRoot: true
        runAsUser: 3000
        seccompProfile: {type: RuntimeDefault}
        supplementalGroups: [10000]
    controllers:
      garage:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/dxflrs/garage
              tag: v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
            envFrom:
              - secretRef:
                  name: garage-secret
            resources:
              requests:
                cpu: 100m
                memory: 384Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
              readOnlyRootFilesystem: true
    service:
      app:
        ports:
          api:
            port: 3903
          s3:
            port: &port 3900
    route:
      app:
        hostnames: ["s3.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      config:
        type: configMap
        enabled: true
        name: garage-configmap
        globalMounts:
          - path: /etc/garage.toml
            subPath: configuration.toml
      data:
        existingClaim: garage-data-pvc
        globalMounts:
          - path: /data
      meta:
        existingClaim: garage-meta-pvc
        globalMounts:
          - path: /meta
    externalSecrets:
      garage:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          name: garage-secret
          template:
            engineVersion: v2
            data:
              GARAGE_RPC_SECRET: "{{ .GARAGE_RPC_SECRET }}"
              GARAGE_ADMIN_TOKEN: "{{ .GARAGE_ADMIN_TOKEN }}"
              GARAGE_METRICS_TOKEN: "{{ .GARAGE_METRICS_TOKEN }}"
        dataFrom:
          - extract:
              key: garage
    networkpolicies:
      allow:
        type: cilium
        forceRename: garage-allow
        # Explicit endpointSelector preserves the pre-inline selector
        # (app.kubernetes.io/name) instead of the chart's controller-derived
        # default, keeping the policy byte-identical across the migration.
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: garage
        # Additive — default-deny is what triggers the lockdown; these rules
        # punch holes through it.
        enableDefaultDeny:
          egress: false
          ingress: false
        ingress:
          # External S3 traffic enters via envoy (s3.${SECRET_DOMAIN} →
          # internal Envoy gateway → garage:3900). Also covers garage-webui
          # → garage admin path (3903) when fronted by envoy.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: network
                  app.kubernetes.io/name: envoy
            toPorts:
              - ports:
                  - port: "3900" # S3 API
                    protocol: TCP
                  - port: "3903" # Admin API
                    protocol: TCP
          # In-cluster S3 clients reach garage directly via the cluster-DNS
          # Service (garage.storage.svc.cluster.local:3900) — no envoy hop.
          # Known consumers as of 2026-05-17:
          #   databases/<cnpg-instance-manager>  — CNPG Barman ObjectStore
          #     (20+ clusters; pod names rotate per backup, ns-level select)
          #   media/immich-offsite-backup        — rclone CronJob (no labels
          #     on pod template; auto-generated job-name churns)
          #   collab/paperless-offsite-backup    — same pattern
          # Selecting full namespaces is appropriate because CronJob and
          # CNPG instance-manager pods rotate names; the cross-ns boundary
          # is the meaningful gate, and these three namespaces are already
          # default-deny locked-down themselves.
          - fromEndpoints:
              - matchLabels:
                  io.kubernetes.pod.namespace: databases
              - matchLabels:
                  io.kubernetes.pod.namespace: media
              - matchLabels:
                  io.kubernetes.pod.namespace: collab
            toPorts:
              - ports:
                  - port: "3900" # S3 API
                    protocol: TCP
        # Garage RPC (3901) peer gossip and egress covered by baseline allow-intra-namespace.
        # NFS substrate mounts are kubelet-level (not pod egress). DNS + apiserver by baseline.
