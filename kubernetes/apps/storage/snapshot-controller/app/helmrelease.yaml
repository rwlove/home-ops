---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  chartRef:
    kind: OCIRepository
    name: snapshot-controller
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # This chart is the upstream external-snapshotter prerequisite rook's
    # csi-snapshotter sidecars expect (kubernetes-csi/external-snapshotter).
    # Neither the VolumeSnapshot CRDs (snapshot.storage.k8s.io/v1) nor a
    # controller were installed anywhere in this cluster — the rbd/cephfs
    # csi-snapshotter sidecars in ../../rook-ceph/rook-ceph/csi-drivers
    # were looping on "the server could not find the requested resource"
    # trying to watch CRDs that don't exist.
    #
    # Chart 5.2.0 -> appVersion v8.6.0, same kubernetes-csi/external-snapshotter
    # release train (and same CRD set: snapshot.storage.k8s.io/v1) as the
    # csi-snapshotter v8.5.0 sidecar image rook currently runs. `installCRDs:
    # true` (chart default) ships the CRDs from that exact tag.
    installCRDs: true

    controller:
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
      podSecurityContext:
        fsGroup: 1000
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop:
            - ALL
      serviceMonitor:
        create: true

    # VolumeGroupSnapshot conversion webhook is only needed for clusters
    # carrying older v1beta1/v1beta2 VolumeGroupSnapshot objects. Nothing in
    # this cluster uses VolumeGroupSnapshot (both Driver CRs in
    # ../../rook-ceph/rook-ceph/csi-drivers render snapshotPolicy:
    # volumeSnapshot, not volumeGroupSnapshot — see that HelmRelease's
    # comments), so leave the webhook off: one fewer cert-manager
    # dependency and Deployment.
    webhook:
      enabled: false

    # VolumeSnapshotClass CRs are intentionally NOT declared here. Helm cannot
    # create a snapshot.storage.k8s.io/v1 custom resource in the same release
    # that first installs its CRD — the install fails with "no matches for kind
    # VolumeSnapshotClass". Installing the CRDs + controller is all the rook
    # csi-snapshotter sidecars need to stop their watch loop. When a consumer
    # actually needs snapshots (e.g. CNPG snapshot-recovery,
    # databases/cloudnative-pg/app/cnp-allow-recovery-jobs.yaml), add the
    # ceph-block / ceph-filesystem VolumeSnapshotClass objects as separate
    # manifests applied after these CRDs are established.
