---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  chartRef:
    kind: OCIRepository
    name: snapshot-controller
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # This chart is the upstream external-snapshotter prerequisite rook's
    # csi-snapshotter sidecars expect (kubernetes-csi/external-snapshotter).
    # Neither the VolumeSnapshot CRDs (snapshot.storage.k8s.io/v1) nor a
    # controller were installed anywhere in this cluster — the rbd/cephfs
    # csi-snapshotter sidecars in ../../rook-ceph/rook-ceph/csi-drivers
    # were looping on "the server could not find the requested resource"
    # trying to watch CRDs that don't exist.
    #
    # Chart 5.2.0 -> appVersion v8.6.0, same kubernetes-csi/external-snapshotter
    # release train (and same CRD set: snapshot.storage.k8s.io/v1) as the
    # csi-snapshotter v8.5.0 sidecar image rook currently runs. `installCRDs:
    # true` (chart default) ships the CRDs from that exact tag.
    installCRDs: true

    controller:
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
      podSecurityContext:
        fsGroup: 1000
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop:
            - ALL
      serviceMonitor:
        create: true

    # VolumeGroupSnapshot conversion webhook is only needed for clusters
    # carrying older v1beta1/v1beta2 VolumeGroupSnapshot objects. Nothing in
    # this cluster uses VolumeGroupSnapshot (both Driver CRs in
    # ../../rook-ceph/rook-ceph/csi-drivers render snapshotPolicy:
    # volumeSnapshot, not volumeGroupSnapshot — see that HelmRelease's
    # comments), so leave the webhook off: one fewer cert-manager
    # dependency and Deployment.
    webhook:
      enabled: false

    # One VolumeSnapshotClass per driver that already has its csi-snapshotter
    # sidecar enabled (see ../../rook-ceph/rook-ceph/csi-drivers/helmrelease.yaml
    # for the driver-level snapshotPolicy that governs the sidecar). Additive
    # only — declaring a class does not take a snapshot; nothing calls these
    # yet, but CNPG's snapshot-recovery bootstrap mode
    # (databases/cloudnative-pg/app/cnp-allow-recovery-jobs.yaml) is the
    # documented future consumer.
    volumeSnapshotClasses:
      - name: ceph-block
        driver: rook-ceph.rbd.csi.ceph.com
        deletionPolicy: Delete
        parameters:
          clusterID: rook-ceph
          csi.storage.k8s.io/snapshotter-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/snapshotter-secret-namespace: rook-ceph
      - name: ceph-filesystem
        driver: rook-ceph.cephfs.csi.ceph.com
        deletionPolicy: Delete
        parameters:
          clusterID: rook-ceph
          csi.storage.k8s.io/snapshotter-secret-name: rook-csi-cephfs-provisioner
          csi.storage.k8s.io/snapshotter-secret-namespace: rook-ceph
