---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  enableDefaultDeny:
    egress: false
    ingress: false
  ingress:
    # Internal Gateway → forgejo HTTP :3000. Clients (humans + the Windmill
    # agent-ops sync job) reach the forge via the internal gateway, so no direct
    # cross-namespace ingress rule is needed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
