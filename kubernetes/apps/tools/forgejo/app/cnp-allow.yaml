---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-allow
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  enableDefaultDeny:
    egress: false
    ingress: false
  ingress:
    # Internal Gateway → forgejo HTTP :3000. Human/browser clients reach
    # the forge via the internal gateway.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Windmill (home ns) → forgejo :3000, direct Service call for the
    # app-ops workspace git-sync push to homelab/agent-ops. Scoped to
    # app + workers (the git-sync-capable pods); windmill-extra is the
    # in-browser LSP only and never initiates a git push. See the
    # symmetric egress rule + rationale in
    # kubernetes/apps/home/windmill/app/cnp-allow.yaml.
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - windmill-app
                - windmill-workers
          matchLabels:
            io.kubernetes.pod.namespace: home
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
