---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      forgejo:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # In-network git remote for the agent-ops control-plane (SQLite, single PVC).
              # Renovate adds the @sha256 digest on first PR. LTS 15.x is the conservative
              # alternative if we want backport-only; 16.x is current stable.
              repository: codeberg.org/forgejo/forgejo
              tag: 16.0.5-rootless
            env:
              FORGEJO__server__DOMAIN: forgejo.${SECRET_DOMAIN}
              FORGEJO__server__ROOT_URL: https://forgejo.${SECRET_DOMAIN}
              FORGEJO__server__HTTP_PORT: &httpPort 3000
              FORGEJO__server__DISABLE_SSH: "true"
              FORGEJO__database__DB_TYPE: sqlite3
              FORGEJO__database__PATH: /var/lib/gitea/forgejo.db
              FORGEJO__security__INSTALL_LOCK: "true"
              FORGEJO__service__DISABLE_REGISTRATION: "true"
              FORGEJO__log__MODE: console
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: *httpPort
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: *httpPort
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: forgejo
        ports:
          http:
            port: *httpPort
    persistence:
      # Irreplaceable git history → Longhorn + recurring backups (see longhorn-pvc.yaml).
      data:
        existingClaim: forgejo-data-pvc
        advancedMounts:
          forgejo:
            app:
              - path: /var/lib/gitea
      # Writable paths required under readOnlyRootFilesystem: true.
      etc:
        type: emptyDir
        advancedMounts:
          forgejo:
            app:
              - path: /etc/gitea
      tmp:
        type: emptyDir
        advancedMounts:
          forgejo:
            app:
              - path: /tmp
