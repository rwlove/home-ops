---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
#
# INTERNAL gateway only — no public/cloudflared exposure. This forge holds
# agent-ops control-plane git and must not leave the network
# (feedback_no_sensitive_logic_online_even_private_gh). No extAuth SecurityPolicy:
# Forgejo does its own auth and git-over-HTTPS can't complete the Authelia redirect.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  annotations:
    glance/id: "Self-Hosted"
    glance/name: "Forgejo"
    glance/show: "true"
    glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/forgejo.png"
spec:
  hostnames:
    - forgejo.${SECRET_DOMAIN}
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: forgejo
          port: 3000
