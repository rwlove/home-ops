---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
#
# INTERNAL gateway only — no public/cloudflared exposure. This forge holds
# agent-ops control-plane git and must not leave the network
# (feedback_no_sensitive_logic_online_even_private_gh). No extAuth SecurityPolicy:
# Forgejo does its own auth and git-over-HTTPS can't complete the Authelia redirect.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  # Hand-off to the chart-rendered route (next PR): prune-disabled keeps this
  # object when the file is removed; the Helm ownership metadata lets the
  # release adopt it in place (no route gap).
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    app.kubernetes.io/managed-by: Helm
  annotations:
    glance/id: "Self-Hosted"
    glance/name: "Forgejo"
    glance/show: "true"
    glance/icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/forgejo.png"
    meta.helm.sh/release-name: forgejo
    meta.helm.sh/release-namespace: tools
spec:
  hostnames:
    - forgejo.${SECRET_DOMAIN}
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: forgejo
          port: 3000
