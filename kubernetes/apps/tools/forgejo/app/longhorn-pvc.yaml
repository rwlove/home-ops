---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/storageclass-storage-v1.json
#
# Dynamic provisioning (not the repo's static-PV+volumeHandle pattern): a fresh
# app has no pre-created Longhorn volume, so Longhorn provisions one from this
# StorageClass. numberOfReplicas: 2 — the forge is the canonical store for
# in-cluster automation git. Backups are automatic via Longhorn's `default`
# recurring-job group (daily snapshot + weekly + monthly backup to the NFS target).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: forgejo-data
provisioner: driver.longhorn.io
reclaimPolicy: Retain
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "2880"
  fsType: xfs
  dataLocality: disabled
  unmapMarkSnapChainRemoved: ignored
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/persistentvolumeclaim-v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data-pvc
  labels:
    type: longhorn
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 10Gi
  storageClassName: forgejo-data
