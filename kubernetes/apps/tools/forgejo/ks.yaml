---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app forgejo
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: tools
  path: ./kubernetes/apps/tools/forgejo/app
  interval: 30m
  timeout: 5m
  # One-time: recreate the PVC whose storageClassName/volumeName changed from the
  # initial static form to dynamic provisioning (immutable fields → patch fails).
  # Remove after the forgejo-data PVC has been reprovisioned. See
  # reference_longhorn_static_pv_needs_precreated_volume.
  force: true
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
    - name: onepassword-connect
      namespace: external-secrets
  retryInterval: 1m
