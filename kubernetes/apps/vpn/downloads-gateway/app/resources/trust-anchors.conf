# Root DNSSEC trust anchors.
#
# Overrides the stale file baked into the pod-gateway image (Alpine's
# dnsmasq-dnssec apk ships only KSK-2017 / tag 20326, "valid as at
# 11/01/2019"). When the root zone stopped dual-signing during the ICANN
# KSK rollover (~2026-10-10), dnsmasq could no longer validate the root
# DNSKEY RRset against that single anchor and returned BOGUS for EVERY
# lookup, taking DNS down for the whole routed download stack.
#
# These are the two non-retired anchors from
# https://data.iana.org/root-anchors/root-anchors.xml (verified 2026-10-12):
#   20326 = KSK-2017 (published, no longer signing)
#   38696 = KSK-2024 (current signer since 2024-07-18)
# KSK-2010 / tag 19036 is retired (validUntil 2019-01-11) and omitted.
#
# Refresh at the next root KSK rollover: re-check root-anchors.xml and add
# the new anchor here. dnsmasq has no RFC 5011 auto-update; this file is
# maintained by hand.
trust-anchor=.,20326,8,2,E06D44B80B8F1D39A95C0B0D7C65D08458E880409BBC683457104237C7F8EC8D
trust-anchor=.,38696,8,2,683D2D0ACB8C9B712A1948B27F741219298D0A450D612C483AF444A4C0FB2B16
