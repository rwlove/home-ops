---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/podmonitor_v1.json
# Replaces the operator-generated PodMonitor: spec.monitoring.enablePodMonitor
# is deprecated in CloudNativePG 1.30, so every cluster sets it to false and
# gets this one instead. Same selector and port as the generated one. The
# scrape job label is databases/postgres-${APP}-metrics. Canaried on
# videodupfinder (#16354): all instances up, no restart, no alert change.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres-${APP}-metrics
  labels:
    cnpg.io/cluster: postgres-${APP}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres-${APP}
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
