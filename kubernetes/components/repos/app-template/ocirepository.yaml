---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: app-template
  labels:
    # Every app-template app in a namespace renders this same object (138 Kustomizations
    # across 8 namespaces), so it's owned by whichever Kustomization applied it last.
    # Without this label, disabling or removing that one app would garbage-collect
    # the chart source for every app-template app in the namespace until another
    # Kustomization re-applied it (up to its 30m/1h interval).
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 5.3.0
    digest: sha256:0e13b145656490310ada364d8eb708e5f4f6384c7deb60d3f5f0fa56950ff63a
  url: oci://ghcr.io/bjw-s-labs/helm/app-template
  # verify:
  #   provider: cosign
