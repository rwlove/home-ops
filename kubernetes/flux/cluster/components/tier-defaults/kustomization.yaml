---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Every setting the Flux tier parents share. A parent in ../../ks.yaml declares
# only its name, path, the home-ops.io/tier-parent label and prune (prune stays
# per parent so a migration window can toggle one parent at a time).
#
# Selected by label, never by kind, so cluster-config is untouched. A
# labelSelector that matches nothing is NOT a build error: a parent missing the
# label would silently ship without these settings. tools/lint-flux-parents.py
# (pre-commit + CI) enforces the label on every parent.
patches:
  - path: ./parent.yaml
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      labelSelector: home-ops.io/tier-parent=true
