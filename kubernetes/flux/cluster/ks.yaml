---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-config
  namespace: flux-system
spec:
  targetNamespace: flux-system
  path: ./kubernetes/flux/meta
  interval: 1h
  prune: true
  wait: true
  # Orphan: if this object is ever removed from kubernetes/flux/cluster/, the
  # sync Kustomization deletes it. With the default (MirrorPrune + prune: true)
  # that would also delete the substitution sources every app reads.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: home-ops-kubernetes
    namespace: flux-system
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
  labels:
    # Shared parent settings (interval, retry, timeout, sourceRef, dependsOn,
    # substitution, Orphan, child-default patches) come from
    # ./components/tier-defaults, selected by this label.
    home-ops.io/tier-parent: "true"
spec:
  path: ./kubernetes/apps
  prune: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-media
  namespace: flux-system
  labels:
    # Shared parent settings come from ./components/tier-defaults.
    home-ops.io/tier-parent: "true"
spec:
  path: ./kubernetes/tiers/media
  prune: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-platform
  namespace: flux-system
  labels:
    # Shared parent settings come from ./components/tier-defaults.
    home-ops.io/tier-parent: "true"
spec:
  path: ./kubernetes/tiers/platform
  prune: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-infra
  namespace: flux-system
  labels:
    # Shared parent settings come from ./components/tier-defaults.
    home-ops.io/tier-parent: "true"
spec:
  path: ./kubernetes/tiers/infra
  prune: true
