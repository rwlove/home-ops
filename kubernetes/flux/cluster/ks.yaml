---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-config
  namespace: flux-system
spec:
  targetNamespace: flux-system
  path: ./kubernetes/flux/meta
  interval: 1h
  prune: true
  wait: true
  # Orphan: if this object is ever removed from kubernetes/flux/cluster/, the
  # sync Kustomization deletes it. With the default (MirrorPrune + prune: true)
  # that would also delete the substitution sources every app reads.
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: home-ops-kubernetes
    namespace: flux-system
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
  labels:
    # A tier parent. Every tier parent in this file carries the same spec
    # apart from path and prune; tools/lint-flux-parents.py keeps the copies
    # identical. (No kustomize Component: flate never applies Component
    # patches, so CI would stop modelling the child defaults.)
    home-ops.io/tier-parent: "true"
spec:
  path: ./kubernetes/apps
  interval: 1h
  # retryInterval defaults to interval (1h). A failed render (e.g. an admission
  # webhook 429) then waits up to an hour unless a new commit lands. 2026-11-21
  # 15:27 sat failed for 51 min this way.
  retryInterval: 2m
  # timeout also defaults to interval; a hung apply would hold the parent 1h.
  timeout: 10m
  prune: false
  wait: false
  sourceRef:
    kind: GitRepository
    name: home-ops-kubernetes
    namespace: flux-system
  dependsOn:
    - name: cluster-config
      namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
      - kind: Secret
        name: cluster-secrets
  # Orphan, not WaitForTermination: if this parent object is ever removed from
  # kubernetes/flux/cluster/ (a rename, a bad revert), the sync Kustomization
  # deletes it, and WaitForTermination would then delete every child
  # Kustomization it owns, and through them every app. Orphan leaves them
  # in place. Children keep their own WaitForTermination via the patch below.
  deletionPolicy: Orphan
  patches:
    # Inject sourceRef and prune defaults into every child Kustomization.
    #
    # NOTE: strategic-merge is patch-WINS, not fill-in-the-blanks. A value
    # set here OVERRIDES whatever the child KS declares — it is not "a
    # no-op for KSes that already carry the same values". Anything this
    # patch sets can no longer be overridden per-KS, so keep the list
    # minimal and add an explicit exclusion below when a KS must differ.
    # wait/interval/timeout are deliberately NOT set here — they vary
    # per-KS (wait true/false, interval 10m/30m/1h, timeout 3m..15m) and
    # would all be flattened. retryInterval IS set: one uniform 2m retry
    # after a failure. Before this, 191 children had none, so they fell
    # back to their 30m/1h interval.
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          prune: true
          retryInterval: 2m
          sourceRef:
            kind: GitRepository
            name: home-ops-kubernetes
            namespace: flux-system
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
    # Exclusion: these two opt out of pruning. Both carry `prune: false`
    # in their own ks.yaml with a "never delete this" comment, but the
    # blanket patch above was silently flipping them back to true —
    # leaving cluster DNS and CSR approval exposed to garbage collection
    # if a refactor ever dropped a resource from their path. Patches
    # apply in order, so this one wins.
    # Selected by the label home-ops.io/child-prune: disabled on the KS
    # itself (literal in its ks.yaml), not by a name regex: KS names repeat
    # across namespaces, and the opt-out should sit next to the object.
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          prune: false
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        labelSelector: home-ops.io/child-prune=disabled
    # Add Kustomization defaults for all child Kustomizations
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          deletionPolicy: WaitForTermination
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  install:
                    crds: CreateReplace
                    strategy:
                      name: RetryOnFailure
                  rollback:
                    cleanupOnFail: true
                    recreate: true
                  upgrade:
                    cleanupOnFail: true
                    crds: CreateReplace
                    strategy:
                      name: RemediateOnFailure
                    remediation:
                      remediateLastFailure: true
                      retries: 2
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
            # Exclusion: apps whose startup runs forward-only DB
            # migrations. Rolling the *image* back cannot un-migrate the
            # *database*, so remediation turns a slow upgrade into an
            # unrecoverable one — this is the #13383 romm outage. Both
            # HelmReleases already declare `retries: 0` with a comment
            # explaining why, but the blanket patch above was overriding
            # it back to 2, so only the `timeout: 20m` half of that fix
            # was ever live. Patches apply in order; this one wins.
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  upgrade:
                    remediation:
                      retries: 0
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
                # Opt in with the label home-ops.io/forward-only-migrations: "true"
                # on the HelmRelease itself (literal in helmrelease.yaml;
                # commonMetadata is applied after the build, so it can't be used).
                labelSelector: home-ops.io/forward-only-migrations=true
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
---
