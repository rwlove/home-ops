---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NO root-level patches / patchesStrategicMerge / patchesJson6902 here, ever:
# with any of them, flate discovers 0 Kustomizations and exits 0, so CI goes
# green while testing nothing (guarded in .github/workflows/flate.yaml). Put
# parent settings in the tier-defaults Component instead.
components:
  - ./components/tier-defaults
resources:
  - ./ks.yaml
