---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/gitrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kagent-agents
spec:
  interval: 1h
  ref:
    branch: main
  # Private agent-persona source on the in-cluster forge. Anonymous clone: the
  # repo is public on a LAN-only Forgejo (the forge is not internet-exposed), so
  # no secretRef/credential is needed. In-cluster service URL — source-controller
  # resolves it via cluster DNS (CNP allows flux-system -> forgejo.tools:3000).
  url: http://forgejo.tools.svc.cluster.local:3000/windmill/kagent-agents.git
