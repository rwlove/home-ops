---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Root of the cluster-infra Flux parent: cluster infrastructure: networking, storage, databases, secrets, auth, observability and Flux itself.
# Every kubernetes/apps dir is listed by exactly one parent root
# (tools/lint-tier-membership.py).
resources:
  - ../../apps/auth
  - ../../apps/cert-manager
  - ../../apps/cilium-secrets
  - ../../apps/databases
  - ../../apps/external-secrets
  - ../../apps/flux-system
  - ../../apps/istio-system
  - ../../apps/kube-system
  - ../../apps/longhorn-system
  - ../../apps/network
  - ../../apps/observability
  - ../../apps/rook-ceph
  - ../../apps/storage
