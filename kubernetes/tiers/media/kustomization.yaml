---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Root of the cluster-media Flux parent: media and downloads.
# Every kubernetes/apps dir is listed by exactly one parent root
# (tools/lint-tier-membership.py).
resources:
  - ../../apps/downloads
  - ../../apps/media
