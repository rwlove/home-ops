---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Root of the cluster-platform Flux parent: agent, AI, CI-runner and Renovate platform.
# Every kubernetes/apps dir is listed by exactly one parent root
# (tools/lint-tier-membership.py).
resources:
  - ../../apps/actions-runner-privileged
  - ../../apps/actions-runner-system
  - ../../apps/ai
  - ../../apps/ate-system
  # - ../../apps/kuadrant
  - ../../apps/mcp-system
  - ../../apps/renovate
  - ../../apps/tools
